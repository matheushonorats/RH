/* Laboratório isolado das animações da Entidade. */
body.modo-laboratorio-entidade {
  overflow: hidden;
  background: #07110f;
}
body.modo-laboratorio-entidade > :not(.entidade-animation-lab):not(script) {
  display: none !important;
}
.entidade-animation-lab {
  position: fixed;
  inset: 0;
  z-index: 20000;
  display: flex;
  flex-direction: column;
  color: #e5eee9;
  background:
    radial-gradient(circle at 25% 35%, rgba(16,185,129,.16), transparent 34%),
    radial-gradient(circle at 78% 64%, rgba(99,102,241,.14), transparent 32%),
    #07110f;
  font-family: Inter, "Segoe UI", Arial, sans-serif;
}
.entidade-lab-header {
  min-height: 104px;
  padding: 22px clamp(22px, 4vw, 58px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  border-bottom: 1px solid rgba(148,163,184,.18);
  background: rgba(7,17,15,.82);
  backdrop-filter: blur(14px);
}
.entidade-lab-header span { color: #34d399; font-size: 10px; font-weight: 800; letter-spacing: .16em; }
.entidade-lab-header h1 { margin: 5px 0 3px; font-size: clamp(23px, 3vw, 34px); }
.entidade-lab-header p { margin: 0; color: #91a39b; font-size: 12px; }
.entidade-lab-close {
  width: 40px; height: 40px; border: 1px solid rgba(148,163,184,.25); border-radius: 12px;
  color: #cbd5e1; background: rgba(255,255,255,.04); font-size: 25px; cursor: pointer;
}
.entidade-lab-close:hover { color: #fff; border-color: #34d399; }
.entidade-lab-layout { min-height: 0; flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 330px; }
.entidade-lab-stage { position: relative; min-height: 420px; overflow: hidden; border-right: 1px solid rgba(148,163,184,.16); }
.entidade-lab-grid {
  position: absolute; inset: 0; opacity: .13;
  background-image: linear-gradient(rgba(148,163,184,.24) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,184,.24) 1px, transparent 1px);
  background-size: 42px 42px;
  mask-image: radial-gradient(circle at center, #000 15%, transparent 72%);
}
.entidade-lab-ghost-scale {
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: 3;
  width: 34px;
  height: 34px;
  transform: translate(-50%, -50%) scale(2.85);
  transform-origin: center;
  opacity: 1;
  filter: blur(0);
  transition: transform .36s cubic-bezier(.4,0,.2,1), opacity .36s ease, filter .36s ease;
}
.entidade-lab-ghost-scale.scene-transition {
  transform: translate(-50%, -47%) scale(2.62) rotate(-2deg);
  opacity: .34;
  filter: blur(.35px);
}
.entidade-animation-lab #entidade-lab-ghost.entidade-fab.roaming {
  position: relative !important;
  left: auto !important;
  top: auto !important;
  width: 34px;
  height: 34px;
  z-index: 3;
  color: #a5b4fc;
  opacity: 1;
  pointer-events: none;
}
.entidade-animation-lab #entidade-lab-ghost.entidade-fab.roaming svg { width: 27px; height: 27px; }
.entidade-animation-lab #entidade-lab-ghost.enter-right { animation: ghost-enter-right .75s cubic-bezier(.22,.78,.28,1) both !important; }
.entidade-animation-lab #entidade-lab-ghost.leaving { animation: ghost-exit-right .85s cubic-bezier(.55,0,.8,.28) both !important; }
.entidade-animation-lab #entidade-lab-ghost.chat-open { animation: ghost-float-smooth 4.6s ease-in-out infinite !important; }
.entidade-animation-lab #entidade-lab-ghost.lab-passeio { animation: entidade-lab-walk 8.2s cubic-bezier(.42,0,.24,1) both !important; }
.entidade-animation-lab #entidade-lab-ghost.lab-ending svg { animation: ghost-idle-leave .68s ease-in-out both !important; }
.entidade-animation-lab #entidade-lab-ghost.lab-ending::before,
.entidade-animation-lab #entidade-lab-ghost.lab-ending::after {
  opacity: 0 !important;
  transition: opacity .62s ease !important;
}
.entidade-lab-postit {
  position: absolute; left: calc(50% + 22px); top: calc(50% - 12px); z-index: 2;
  width: 38px; height: 32px; padding: 4px 3px; display: grid; place-items: center;
  border-radius: 2px 2px 6px 2px; color: #4b3600; background: linear-gradient(145deg,#fff59d,#facc15 82%);
  box-shadow: 0 6px 12px rgba(0,0,0,.3); font: 800 8px/1.05 "Comic Sans MS","Segoe Print",cursive;
  text-align: center; opacity: 0; transform: rotate(-5deg) scale(.65); pointer-events: none;
}
.entidade-lab-postit.show { animation: entidade-lab-note 8.2s ease both; }
.entidade-lab-status {
  position: absolute; left: 50%; bottom: 38px; transform: translateX(-50%);
  padding: 8px 13px; border: 1px solid rgba(129,140,248,.25); border-radius: 999px;
  color: #c7d2fe; background: rgba(15,23,42,.58); font-size: 11px; backdrop-filter: blur(8px);
}
.entidade-lab-controls { min-height: 0; padding: 20px; overflow-y: auto; background: rgba(12,22,20,.75); }
.entidade-lab-actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 16px; }
.entidade-lab-actions button, .entidade-lab-buttons button {
  min-height: 38px; padding: 8px 11px; border: 1px solid rgba(148,163,184,.2); border-radius: 10px;
  color: #cbd5e1; background: rgba(255,255,255,.035); font: 700 11px/1.2 inherit; cursor: pointer; transition: 160ms ease;
}
.entidade-lab-actions button:hover, .entidade-lab-buttons button:hover { color: #fff; border-color: #34d399; background: rgba(16,185,129,.10); }
.entidade-lab-actions .primary { color: #052e26; border-color: #34d399; background: #34d399; }
.entidade-lab-actions .primary.running { box-shadow: 0 0 0 4px rgba(52,211,153,.12), 0 0 18px rgba(52,211,153,.22); }
.entidade-lab-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@keyframes entidade-lab-walk {
  0%, 100% { transform: translate3d(0,0,0) rotate(0); }
  18% { transform: translate3d(-64px,-38px,0) rotate(-7deg); }
  43% { transform: translate3d(66px,-27px,0) rotate(7deg); }
  68% { transform: translate3d(41px,38px,0) rotate(5deg); }
  84% { transform: translate3d(-41px,27px,0) rotate(-5deg); }
}
@keyframes entidade-lab-note {
  0%, 9%, 91%, 100% { opacity: 0; transform: rotate(8deg) scale(.55); }
  15%, 84% { opacity: 1; transform: rotate(-5deg) scale(1); }
}
@media (max-width: 800px) {
  .entidade-lab-layout { grid-template-columns: 1fr; grid-template-rows: minmax(310px, 52vh) 1fr; }
  .entidade-lab-stage { border-right: 0; border-bottom: 1px solid rgba(148,163,184,.16); }
  .entidade-lab-controls { padding: 14px; }
  .entidade-lab-buttons { grid-template-columns: repeat(3, minmax(0,1fr)); }
  @keyframes entidade-lab-walk {
    0%,100%{transform:translate3d(0,0,0)} 25%{transform:translate3d(-38px,-24px,0) rotate(-6deg)}
    50%{transform:translate3d(38px,-17px,0) rotate(6deg)} 75%{transform:translate3d(25px,24px,0) rotate(4deg)}
  }
}
@media (max-width: 520px) {
  .entidade-lab-header { min-height: 86px; padding: 15px 17px; }
  .entidade-lab-header p { display: none; }
  .entidade-lab-buttons { grid-template-columns: 1fr 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  .entidade-fab,
  .entidade-fab svg,
  .entidade-fab::before,
  .entidade-fab::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}

/* Paleta Stitch para o tema escuro do painel executivo. */
body.dark-mode {
  --bg-primary: #0f1213;
  --bg-secondary: #191c1e;
  --bg-tertiary: #25292b;
  --border-color: rgba(231, 255, 246, .13);
  --text-primary: #f0f4f2;
  --text-secondary: #a9b1ae;
  --text-muted: #7f8a86;
  --brand-primary: #10b981;
  --brand-primary-hover: #059669;
  --header-bg: #062b38;
}

body.dark-mode .main-content {
  position: relative;
  isolation: isolate;
  background: linear-gradient(135deg, #101314 12%, #111516 55%, #0c1513 100%);
}

body.dark-mode .main-content::before,
body.dark-mode .main-content::after {
  content: '';
  position: absolute;
  z-index: 0;
  width: 62vw;
  height: 68vh;
  border-radius: 50%;
  pointer-events: none;
  will-change: transform, opacity;
}

body.dark-mode .main-content::before {
  left: -27vw;
  top: 8vh;
  background: radial-gradient(circle, rgba(2, 190, 129, .24), rgba(0, 151, 105, .08) 42%, transparent 70%);
  animation: ambientGlowLeft 22s cubic-bezier(.45, 0, .55, 1) infinite alternate;
}

body.dark-mode .main-content::after {
  right: -24vw;
  top: -11vh;
  background: radial-gradient(circle, rgba(4, 150, 112, .2), rgba(5, 95, 86, .07) 45%, transparent 72%);
  animation: ambientGlowRight 28s cubic-bezier(.45, 0, .55, 1) infinite alternate;
}

body.dark-mode .main-content > * {
  position: relative;
  z-index: 1;
}

body.dark-mode #view-dashboard::before {
  display: none;
}

@keyframes ambientGlowLeft {
  0% { transform: translate3d(0, 0, 0) scale(.98); opacity: .48; }
  50% { transform: translate3d(3.8vw, -2.2vh, 0) scale(1.055); opacity: .76; }
  100% { transform: translate3d(1.8vw, 4.2vh, 0) scale(1); opacity: .56; }
}

@keyframes ambientGlowRight {
  0% { transform: translate3d(0, 0, 0) scale(.97); opacity: .42; }
  50% { transform: translate3d(-3.2vw, 4.6vh, 0) scale(1.05); opacity: .7; }
  100% { transform: translate3d(-1.3vw, -1.8vh, 0) scale(1); opacity: .5; }
}

/* Mesmo com reducao de movimento do sistema, preserva somente este efeito
   ambiental, mais lento e sem deslocamentos bruscos. */
@media (prefers-reduced-motion: reduce) {
  body.dark-mode .main-content::before { animation-duration: 34s !important; animation-iteration-count: infinite !important; }
  body.dark-mode .main-content::after { animation-duration: 40s !important; animation-iteration-count: infinite !important; }
}

body.dark-mode .topbar {
