<style>
/* 
   RH Central de Documentos v2.0
   Design System & Stylesheet (CSS Puro)
*/

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

:root {
  --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  
  /* Paleta de Cores (Natural / Institucional) */
  --bg-primary: #f4f6f8;
  --bg-secondary: #ffffff;
  --bg-tertiary: #f0f2f5;
  --border-color: #d1d5db;
  
  --text-primary: #1f2937;
  --text-secondary: #4b5563;
  --text-muted: #6b7280;
  
  --brand-primary: #2563eb; /* Azul Gestão */
  --brand-primary-hover: #1d4ed8;
  --brand-secondary: #059669; /* Verde Institucional */
  
  /* Cores de Feedback de Status */
  --status-active-bg: #dcfce7;
  --status-active-text: #166534;
  --status-leave-bg: #fee2e2;
  --status-leave-text: #991b1b;
  --status-warning-bg: #fef3c7;
  --status-warning-text: #92400e;
  --status-inactive-bg: #f3f4f6;
  --status-inactive-text: #374151;
}

body.dark-mode {
  --bg-primary: #121214;
  --bg-secondary: #1a1a1e;
  --bg-tertiary: #26262b;
  --border-color: #323238;
  
  --text-primary: #e1e1e6;
  --text-secondary: #a8a8b3;
  --text-muted: #7c7c8a;
  
  --brand-primary: #00875f; /* VerdeSETUR */
  --brand-primary-hover: #00b37e;
  --brand-secondary: #0784b5; /* Azul Protocolo */

  --status-active-bg: rgba(0, 135, 95, 0.15);
  --status-active-text: #04d361;
  --status-leave-bg: rgba(247, 90, 90, 0.15);
  --status-leave-text: #f75a5a;
  --status-warning-bg: rgba(254, 180, 8, 0.15);
  --status-warning-text: #feb408;
  --status-inactive-bg: rgba(124, 124, 138, 0.15);
  --status-inactive-text: #8d8d99;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-family);
  background-color: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  height: 100vh;
}

    /* TELA DE LOGIN (Design Inspirado no Anexo) */
    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #061c31; /* Fundo azul escuro igual ao anexo */
      z-index: 100000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .login-box {
      width: 100%;
      max-width: 400px;
      background-color: #ffffff; /* Fundo branco */
      border: none;
      border-top: 6px solid #fbbf24; /* Faixa amarela no topo */
      border-radius: 12px;
      padding: 36px 32px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }
    
    .login-header h2 {
      font-size: 22px;
      margin-bottom: 4px;
      font-weight: 700;
      color: #061c31; /* Título azul escuro */
    }
    
    .login-header p {
      font-size: 14px;
      color: #64748b; /* Subtítulo cinza */
    }
    
    /* Forçar cores claras nos inputs do login, independentemente do tema dark */
    .login-box .form-label {
      color: #475569;
      font-weight: 600;
    }
    .login-box .form-control {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      color: #0f172a;
    }
    .login-box .form-control:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }
    .login-box .btn-primary {
      background-color: #061c31;
      color: #ffffff;
      font-weight: 600;
      border: none;
    }
    .login-box .btn-primary:hover {
      background-color: #0a2b4d;
    }
    .login-box .login-footer p {
      color: #94a3b8;
    }
    
    /* Layout Principal */
.app-container {
  display: flex;
  height: 100vh;
  width: 100vw;
}

/* Menu Lateral (Sidebar) */
.sidebar {
  width: 260px;
  background-color: var(--bg-secondary);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  height: 100%;
}

.sidebar-header {
  padding: 24px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
}

.brand-logo {
  height: 36px;
  display: block;
}

.sidebar-header h2 {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 0.5px;
}

.sidebar-header p {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

.sidebar-menu {
  flex: 1;
  padding: 24px 16px;
  list-style: none;
  overflow-y: auto;
}

.menu-item {
  margin-bottom: 8px;
}

.menu-link {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  border-radius: 0;
  transition: all 0.2s ease;
  cursor: pointer;
  position: relative;
  z-index: 1;
}

.menu-link:hover {
  background-color: var(--bg-tertiary);
  color: var(--text-primary);
}

.menu-link.active {
  color: #ffffff;
}

.sidebar-indicator {
  position: absolute;
  left: 16px;
  width: calc(100% - 32px);
  background-color: var(--brand-primary);
  transition: top 0.3s cubic-bezier(0.4, 0, 0.2, 1), height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 0;
  pointer-events: none;
}

.menu-icon {
  margin-right: 12px;
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn-link {
  color: var(--primary-color);
  text-decoration: none;
  font-weight: 500;
  transition: all 0.2s ease;
}

.btn-link:hover {
  text-decoration: underline;
  color: var(--primary-hover);
}

/* Área de Conteúdo */
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100%;
  background-color: var(--bg-primary);
}

/* Barra Superior */
.topbar {
  height: 70px;
  background-color: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
}

.topbar-title h1 {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
}

.user-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.user-details {
  text-align: right;
}

.user-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}

.user-role {
  font-size: 11px;
  color: var(--text-secondary);
}

/* Telas (Views) */
.view-container {
  flex: 1;
  padding: 32px;
  overflow-y: auto;
  position: relative;
}

.view-section {
  display: none;
}

.view-section.active {
  display: block;
  animation: fadeIn 0.3s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Cards & Layouts Comuns */
.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 24px;
  margin-bottom: 32px;
}

.card {
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 0;
  padding: 24px;
  transition: all 0.2s ease;
}

.clickable-card {
  cursor: pointer;
}

.clickable-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
  border-color: var(--brand-primary);
}

.card-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--text-secondary);
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

.card-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--text-primary);
}

/* Tabelas */
.table-container {
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 0;
  overflow: hidden;
  margin-bottom: 24px;
}

.table-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}

.table-title {
  font-size: 16px;
  font-weight: 600;
}

.custom-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}

.custom-table th {
  padding: 16px 24px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border-color);
  background-color: rgba(255, 255, 255, 0.02);
}

.custom-table td {
  padding: 16px 24px;
  font-size: 14px;
  border-bottom: 1px solid var(--border-color);
  color: var(--text-primary);
}

.custom-table tr:last-child td {
  border-bottom: none;
}

.custom-table tr:hover td {
  background-color: rgba(255, 255, 255, 0.01);
}

/* Badges de Status (Sem emojis) */
.badge {
  display: inline-block;
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  border-radius: 0;
  letter-spacing: 0.5px;
}

.badge-ativo {
  background-color: var(--status-active-bg);
  color: var(--status-active-text);
}

.badge-ferias {
  background-color: var(--status-leave-bg);
  color: var(--status-leave-text);
}

.badge-abono {
  background-color: var(--status-warning-bg);
  color: var(--status-warning-text);
}

.badge-inativo {
  background-color: var(--status-inactive-bg);
  color: var(--status-inactive-text);
}

/* Formulários */
.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 8px;
  color: var(--text-secondary);
}

.form-control {
  width: 100%;
  padding: 12px 16px;
  background-color: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  border-radius: 0;
  color: var(--text-primary);
  font-family: var(--font-family);
  font-size: 14px;
  transition: all 0.2s ease;
}

.form-control:focus {
  outline: none;
  border-color: var(--brand-primary);
  box-shadow: 0 0 0 2px rgba(0, 135, 95, 0.2);
}

/* Botões */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 12px 20px;
  font-size: 14px;
  font-weight: 600;
  border-radius: 0;
  border: none;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: var(--font-family);
  gap: 8px;
}

.btn-primary {
  background-color: var(--brand-primary);
  color: #ffffff;
}

.btn-primary:hover {
  background-color: var(--brand-primary-hover);
}

.btn-secondary {
  background-color: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border-color);
}

.btn-secondary:hover {
  background-color: var(--border-color);
}

/* Loader */
.loader-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(18, 18, 20, 0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 15000;
}

.loader {
  border: 4px solid rgba(0, 0, 0, 0.1);
  border-left-color: var(--brand-primary);
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.spinning {
  animation: spin 1s linear infinite;
}
/* Filtros e Barra de Pesquisa */
.filter-bar {
  display: flex;
  gap: 16px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.search-input-wrapper {
  position: relative;
  flex: 1;
  min-width: 250px;
}

.search-input-wrapper input {
  padding-left: 40px;
}

.search-icon-inside {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  width: 16px;
  height: 16px;
}

.filter-select {
  width: 180px;
  background-color: var(--bg-secondary);
}

/* Modais */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: rgba(0, 0, 0, 0.75);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 20000;
  backdrop-filter: blur(4px);
}

.modal-overlay.active {
  display: flex;
}

.modal-content {
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 0;
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  animation: modalSlideUp 0.25s ease-out;
}

.modal-content.large {
  max-width: 900px;
}

@keyframes modalSlideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-title {
  font-size: 16px;
  font-weight: 600;
}

.modal-close {
  background: none;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 0;
  transition: all 0.2s ease;
}

.modal-close:hover {
  background-color: var(--bg-tertiary);
  color: var(--text-primary);
}

.modal-body {
  padding: 24px;
  flex: 1;
}

.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border-color);
  display: flex;
  justify-content: flex-end;
  gap: 12px;
}

/* Abas (Tabs) para Ficha do Servidor */
.tab-container {
  display: flex;
  border-bottom: 1px solid var(--border-color);
  margin-bottom: 24px;
}

.tab-button {
  padding: 12px 20px;
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s ease;
  font-family: var(--font-family);
}

.tab-button:hover {
  color: var(--text-primary);
}

.tab-button.active {
  color: var(--brand-primary-hover);
  border-bottom-color: var(--brand-primary);
}

.tab-panel {
  display: none;
}

.tab-panel.active {
  display: block;
}

/* Colunas de Formulário Flex */
.form-row {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}

.form-row .form-group {
  flex: 1;
  min-width: 200px;
}

/* Ícones de ação na tabela */
.action-buttons {
  display: flex;
  gap: 8px;
}

.btn-action {
  width: 32px;
  height: 32px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 0;
  border: 1px solid var(--border-color);
  background-color: var(--bg-tertiary);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn-action:hover {
  color: var(--text-primary);
  background-color: var(--border-color);
}

.btn-action.btn-delete:hover {
  background-color: rgba(247, 90, 90, 0.15);
  color: var(--status-leave-text);
  border-color: rgba(247, 90, 90, 0.3);
}

.loader-card { width: min(520px, calc(100vw - 40px)); padding: 28px; display: flex; flex-direction: column; align-items: center; gap: 12px; border: 1px solid var(--border-color); border-radius: 18px; background: var(--bg-secondary); box-shadow: 0 22px 60px rgba(0,0,0,.34); }
.loader-entidade { width: 58px; height: 58px; display: grid; place-items: center; color: #a5b4fc; animation: ghost-float-smooth 4.6s ease-in-out infinite; }
.loader-entidade svg { width: 46px; height: 46px; filter: drop-shadow(0 8px 12px rgba(99,102,241,.38)); }
.loader-frase { min-height: 20px; color: var(--text-primary); font-size: 13px; font-weight: 600; text-align: center; }
.loader-progress-track { width: 100%; height: 9px; overflow: hidden; border-radius: 999px; background: var(--bg-tertiary); }
.loader-progress-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--brand-primary), #818cf8); transition: width .28s ease; }
.rep-evento-horario { display: flex; align-items: center; gap: 6px; }
.rep-horario-real { width: 76px; padding: 3px 5px; border: 1px solid color-mix(in srgb, var(--brand-primary) 35%, var(--border-color)); border-radius: 6px; color: var(--text-primary); background: color-mix(in srgb, var(--brand-primary) 7%, var(--bg-secondary)); font: inherit; font-weight: 700; }
.rep-horario-arredondado { padding: 2px 6px; border-radius: 999px; color: var(--text-secondary); background: var(--bg-tertiary); font-size: 10px; font-weight: 700; }
.rep-horario-sem-arredondamento { color: var(--text-muted); font-size: 9px; }
.rep-desconsiderar-rapido { width: 25px; height: 25px; display: grid; place-items: center; margin-left: auto; border: 0; border-radius: 6px; color: var(--text-muted); background: transparent; cursor: pointer; }
.rep-desconsiderar-rapido:hover { color: var(--danger-color, #ef4444); background: rgba(239,68,68,.1); }
.rep-desconsiderar-rapido svg { width: 13px; height: 13px; }
.rep-ajustar-dia.lancamento { color: var(--brand-primary); }

.nome-com-acao {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}
.btn-action.btn-notificacao-ferias {
  width: 27px;
  height: 27px;
  flex: 0 0 27px;
  color: var(--danger-color, #dc2626);
  border-color: color-mix(in srgb, var(--danger-color, #dc2626) 35%, var(--border-color));
  background: color-mix(in srgb, var(--danger-color, #dc2626) 8%, var(--bg-tertiary));
}
.btn-action.btn-notificacao-ferias:hover {
  color: #fff;
  border-color: var(--danger-color, #dc2626);
  background: var(--danger-color, #dc2626);
}

/* Layout Ficha de Servidor */
.profile-header {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 24px;
  background-color: rgba(255, 255, 255, 0.01);
  padding: 20px;
  border-radius: 0;
  border: 1px solid var(--border-color);
}

.profile-avatar-placeholder {
  width: 64px;
  height: 64px;
  border-radius: 0;
  background-color: var(--bg-tertiary);
  color: var(--brand-primary-hover);
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--border-color);
}

.profile-info h3 {
  font-size: 18px;
  font-weight: 600;
}

.profile-info p,
.ficha-metadados {
  font-size: 13px;
  color: var(--text-secondary);
}

.profile-info { flex: 1 1 auto; min-width: 0; }
.ficha-metadados { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
.ficha-campo-copiavel { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
.ficha-nome-copiavel { width: fit-content; max-width: 100%; }
.ficha-btn-copiar {
  width: 25px;
  height: 25px;
  flex: 0 0 25px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  cursor: pointer;
  transition: color .16s ease, border-color .16s ease, background .16s ease, transform .16s ease;
}
.ficha-btn-copiar:hover { color: var(--brand-primary); border-color: var(--brand-primary); background: color-mix(in srgb, var(--brand-primary) 10%, var(--bg-tertiary)); transform: translateY(-1px); }
.ficha-btn-copiar svg { width: 13px; height: 13px; }

.quick-1doc-dados-titulo {
  margin: 0 0 8px;
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.quick-1doc-dados {
  display: grid;
  gap: 1px;
  margin-bottom: 18px;
  padding: 1px;
  border: 1px solid var(--border-color);
  border-radius: 9px;
  overflow: hidden;
  background: var(--border-color);
}
.quick-1doc-dado {
  display: grid;
  grid-template-columns: 78px minmax(0, 1fr) 25px;
  align-items: center;
  gap: 8px;
  min-height: 39px;
  padding: 6px 8px 6px 11px;
  background: var(--bg-secondary);
}
.quick-1doc-dado-rotulo { color: var(--text-secondary); font-size: 12px; font-weight: 600; }
.quick-1doc-dado-valor { min-width: 0; color: var(--text-primary); font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.quick-1doc-resumo-lancamento {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(110px, .85fr) minmax(86px, .65fr);
  gap: 8px;
  margin-bottom: 18px;
}
.quick-1doc-resumo-item {
  min-width: 0;
  padding: 10px 11px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  background: color-mix(in srgb, var(--brand-primary) 5%, var(--bg-secondary));
}
.quick-1doc-resumo-item span {
  display: block;
  margin-bottom: 4px;
  color: var(--text-secondary);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .025em;
}
.quick-1doc-resumo-item strong {
  display: block;
  color: var(--text-primary);
  font-size: 12px;
  line-height: 1.25;
  overflow-wrap: anywhere;
}

@media (max-width: 520px) {
  .quick-1doc-dado { grid-template-columns: 68px minmax(0, 1fr) 25px; }
  .quick-1doc-resumo-lancamento { grid-template-columns: 1fr 1fr; }
  .quick-1doc-resumo-tipo { grid-column: 1 / -1; }
}

/* Seleção de anexos por clique ou arrastar e soltar. */
.anexo-dropzone-lista { display: grid; gap: 8px; }
.anexo-dropzone {
  min-height: 52px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1.5px dashed var(--border-color);
  border-radius: 8px;
  color: var(--text-secondary);
  background: var(--bg-tertiary);
  cursor: pointer;
  transition: border-color .18s ease, background .18s ease, color .18s ease, transform .18s ease;
}
.anexo-dropzone:hover,
.anexo-dropzone.dragover { border-color: var(--brand-primary); color: var(--brand-primary); background: color-mix(in srgb, var(--brand-primary) 9%, var(--bg-tertiary)); }
.anexo-dropzone.dragover { transform: scale(1.01); }
.anexo-dropzone.tem-arquivo { border-style: solid; border-color: #10b981; color: #10b981; background: rgba(16,185,129,.08); }
.anexo-dropzone input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.anexo-dropzone > svg { width: 19px; height: 19px; flex: 0 0 auto; }
.anexo-dropzone-texto { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 600; }

@media (max-width: 640px) {
  .profile-header { align-items: flex-start; flex-wrap: wrap; }
  .ficha-separador { display: none; }
  .ficha-metadados { align-items: flex-start; flex-direction: column; }
}

/* Grid de Períodos Aquisitivos */
.periods-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.period-card {
  background-color: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  border-radius: 0;
  padding: 16px;
}

.period-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.period-title {
  font-size: 13px;
  font-weight: 700;
}

.period-dates {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

.period-status-bar {
  height: 6px;
  border-radius: 0;
  background-color: var(--bg-secondary);
  overflow: hidden;
  margin-top: 12px;
}

.period-status-fill {
  height: 100%;
  width: 0%;
}

.fill-usufruido {
  background-color: var(--status-active-text);
  width: 100%;
}

.fill-disponivel {
  background-color: var(--status-warning-text);
  width: 100%;
}

.fill-vencido {
  background-color: var(--status-leave-text);
  width: 100%;
}

.period-legend {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
}

/* Interface v3 — navegação horizontal e dashboard responsivo */
:root {
  --header-bg: #082f49;
  --header-text: #e8f3f7;
  --surface-raised: #ffffff;
  --shadow-soft: 0 12px 34px rgba(15, 23, 42, 0.07);
  --shadow-hover: 0 18px 42px rgba(15, 23, 42, 0.12);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
}

body.dark-mode {
  --header-bg: #071c26;
  --surface-raised: #1a1a1e;
  --shadow-soft: 0 14px 40px rgba(0, 0, 0, 0.2);
  --shadow-hover: 0 20px 48px rgba(0, 0, 0, 0.3);
}

body {
  overflow: hidden;
}

.app-container {
  display: grid;
  grid-template-rows: 76px minmax(0, 1fr);
  grid-template-columns: 100%;
  min-height: 100vh;
}

.app-header {
  grid-row: 1;
  display: flex;
  align-items: center;
  gap: clamp(18px, 3vw, 48px);
  min-width: 0;
  padding: 0 clamp(20px, 3vw, 52px);
  color: var(--header-text);
  background: linear-gradient(112deg, var(--header-bg), #0b3a4f);
  border-bottom: 1px solid rgba(255, 255, 255, 0.09);
  box-shadow: 0 8px 30px rgba(2, 20, 29, 0.16);
  position: relative;
  z-index: 100;
}

body.dark-mode .app-header {
  background: linear-gradient(112deg, #07171f, #0a2936);
}

.brand-block {
  display: flex;
  align-items: center;
  gap: 14px;
  flex: 0 0 auto;
}

.brand-logo {
  width: 116px;
  height: 44px;
  object-fit: contain;
}

.brand-divider {
  width: 1px;
  height: 32px;
  background: rgba(255, 255, 255, 0.2);
}

.brand-copy {
  display: flex;
  flex-direction: column;
  line-height: 1.2;
  white-space: nowrap;
}

.brand-copy strong {
  font-size: 13px;
  font-weight: 700;
}

.brand-copy span {
  margin-top: 3px;
  font-size: 10px;
  color: rgba(232, 243, 247, 0.68);
}

.desktop-navigation {
  align-self: stretch;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  flex: 1 1 auto;
  min-width: 0;
}

.desktop-navigation .menu-link {
  align-self: stretch;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 clamp(10px, 1.2vw, 18px);
  color: rgba(232, 243, 247, 0.72);
  border-radius: 0;
  font-size: 13px;
  white-space: nowrap;
}

.desktop-navigation .menu-link svg {
  width: 16px;
  height: 16px;
}

.desktop-navigation .menu-link::after {
  content: '';
  position: absolute;
  left: 18px;
  right: 18px;
  bottom: 0;
  height: 3px;
  border-radius: 3px 3px 0 0;
  background: #25c28a;
  transform: scaleX(0);
  transition: transform 220ms ease;
}

.desktop-navigation .menu-link:hover,
.desktop-navigation .menu-link.active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}

.desktop-navigation .menu-link.active::after {
  transform: scaleX(1);
}

.header-actions,
.user-info {
  display: flex;
  align-items: center;
}

.header-actions {
  gap: 8px;
  flex: 0 0 auto;
}

.header-icon-button,
.mobile-menu-button {
  width: 38px;
  height: 38px;
  border: 1px solid rgba(255, 255, 255, 0.13);
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--header-text);
  background: rgba(255, 255, 255, 0.06);
  cursor: pointer;
  transition: background 180ms ease, transform 180ms ease;
}

.header-icon-button:hover,
.mobile-menu-button:hover {
  background: rgba(255, 255, 255, 0.13);
  transform: translateY(-1px);
}

.header-icon-button svg,
.mobile-menu-button svg {
  width: 18px;
  height: 18px;
}

.user-info {
  gap: 10px;
  margin-left: 5px;
}

.user-avatar {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #06261d;
  background: #6ee7b7;
  font-size: 12px;
  font-weight: 800;
}

.app-header .user-name { color: #ffffff; font-size: 12px; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app-header .user-role { color: rgba(232, 243, 247, 0.64); }
.mobile-menu-button { display: none; }

.main-content {
  grid-row: 2;
  min-width: 0;
  height: auto;
  overflow: hidden;
}

.topbar {
  height: auto;
  min-height: 82px;
  padding: 18px clamp(22px, 4vw, 64px);
  background: var(--bg-primary);
}

.topbar-title { display: flex; flex-direction: column; }
.topbar-title h1 { font-size: clamp(20px, 2vw, 28px); letter-spacing: -0.03em; }
.page-eyebrow { color: var(--brand-primary); font-size: 10px; font-weight: 800; letter-spacing: 0.12em; }
.topbar-context { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 12px; text-transform: capitalize; }
.topbar-context svg { width: 16px; height: 16px; color: var(--brand-primary); }
.topbar-clock-separator { color: var(--text-muted); }
#current-time-label { min-width: 55px; font-variant-numeric: tabular-nums; text-transform: none; }

.view-container {
  padding: 4px clamp(22px, 4vw, 64px) 48px;
  scroll-behavior: smooth;
}

.view-section.active {
  animation: pageEnter 380ms cubic-bezier(.2, .8, .2, 1);
}

@keyframes pageEnter {
  from { opacity: 0; transform: translateY(10px) scale(.995); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.dashboard-welcome {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 24px;
}

.dashboard-welcome h2 { margin-top: 5px; font-size: clamp(22px, 2.2vw, 32px); letter-spacing: -0.04em; }
.dashboard-welcome p { margin-top: 4px; color: var(--text-secondary); font-size: 13px; }

.dashboard-grid {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}

.card,
.table-container,
.insight-card,
.quick-actions-card {
  border-color: color-mix(in srgb, var(--border-color) 78%, transparent);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-soft);
}

.metric-card {
  min-height: 132px;
  padding: 21px;
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) 18px;
  align-items: start;
  gap: 14px;
  overflow: hidden;
  position: relative;
}

.metric-card:hover { box-shadow: var(--shadow-hover); }
.metric-icon { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; }
.metric-icon svg { width: 20px; height: 20px; }
.metric-green { color: #047857; background: #d1fae5; }
.metric-red { color: #dc2626; background: #fee2e2; }
.metric-blue { color: #2563eb; background: #dbeafe; }
.metric-amber { color: #d97706; background: #fef3c7; }
body.dark-mode .metric-green { background: rgba(4, 211, 97, .12); color: #34d399; }
body.dark-mode .metric-red { background: rgba(247, 90, 90, .12); color: #fb7185; }
body.dark-mode .metric-blue { background: rgba(59, 130, 246, .13); color: #60a5fa; }
body.dark-mode .metric-amber { background: rgba(254, 180, 8, .12); color: #fbbf24; }
.metric-card .card-title { margin: 0 0 3px; }
.metric-card .card-value { line-height: 1.05; font-size: 30px; }
.metric-caption { display: block; margin-top: 7px; color: var(--text-muted); font-size: 10px; }
.metric-arrow { width: 16px; color: var(--text-muted); opacity: .7; }
.status-danger { color: var(--status-leave-text); }
.status-warning { color: var(--status-warning-text); }

.dashboard-content-grid {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(290px, .75fr);
  gap: 20px;
  align-items: start;
}

.dashboard-table-card { min-width: 0; }
.table-subtitle { display: block; margin-top: 3px; color: var(--text-muted); font-size: 11px; font-weight: 400; }
.table-scroll { overflow-x: auto; }
.text-button { display: inline-flex; align-items: center; gap: 7px; border: 0; color: var(--brand-primary); background: transparent; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
.text-button svg { width: 15px; }
.dashboard-side-column { display: grid; gap: 20px; }
.insight-card, .quick-actions-card { padding: 22px; background: var(--bg-secondary); border: 1px solid var(--border-color); }
.insight-header { display: flex; justify-content: space-between; align-items: flex-start; }
.insight-header h3 { margin-top: 4px; font-size: 15px; }
.insight-header > svg { width: 18px; color: var(--text-muted); }
.donut-wrap { display: grid; place-items: center; padding: 20px 0 14px; }
.dashboard-donut {
  --attention-percent: 0%;
  width: 142px;
  height: 142px;
  padding: 15px;
  border-radius: 50%;
  background: conic-gradient(#f59e0b 0 var(--attention-percent), var(--brand-primary) var(--attention-percent) 100%);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.2);
}
.dashboard-donut > div { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 50%; background: var(--bg-secondary); }
.dashboard-donut strong { font-size: 27px; line-height: 1; }
.dashboard-donut span { margin-top: 5px; color: var(--text-muted); font-size: 10px; }
.donut-legend { display: flex; justify-content: space-between; gap: 12px; padding-top: 14px; border-top: 1px solid var(--border-color); }
.donut-legend span { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 10px; }
.donut-legend strong { margin-left: auto; color: var(--text-primary); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }
.active-dot { background: var(--brand-primary); }
.alert-dot { background: #f59e0b; }
.quick-actions-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-top: 16px; }
.quick-actions-grid button { min-height: 70px; padding: 12px 9px; border: 1px solid var(--border-color); border-radius: 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; color: var(--text-primary); background: var(--bg-tertiary); font: inherit; font-size: 10px; font-weight: 650; text-align: left; cursor: pointer; transition: 180ms ease; }
.quick-actions-grid button:hover { color: var(--brand-primary); border-color: var(--brand-primary); transform: translateY(-2px); }
.quick-actions-grid svg { width: 18px; }

.smart-dashboard-card {
  min-height: 440px;
  padding: 22px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-soft);
  display: flex;
  flex-direction: column;
}

#view-dashboard { position: relative; isolation: isolate; }
#view-dashboard::before {
  content: '';
  position: absolute;
  z-index: -1;
  inset: -90px calc(clamp(22px, 4vw, 64px) * -1) -48px;
  pointer-events: none;
  background:
    radial-gradient(circle at 2% 32%, color-mix(in srgb, var(--brand-primary) 18%, transparent), transparent 31%),
    radial-gradient(circle at 88% 15%, color-mix(in srgb, var(--brand-primary) 14%, transparent), transparent 34%);
}

body.dark-mode #view-dashboard .metric-card,
body.dark-mode #view-dashboard .dashboard-table-card,
body.dark-mode #view-dashboard .smart-dashboard-card {
  background: linear-gradient(145deg, rgba(28, 31, 35, .94), rgba(21, 24, 28, .88));
  border-color: rgba(255, 255, 255, .12);
  box-shadow: 0 18px 46px rgba(0, 0, 0, .18), inset 0 1px 0 rgba(255, 255, 255, .025);
  backdrop-filter: blur(14px);
}

.smart-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding-bottom: 17px;
  border-bottom: 1px solid var(--border-color);
}

.smart-card-header h3 { margin-top: 4px; font-size: 16px; }
.smart-card-header-actions { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
.smart-card-icon { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: var(--brand-primary); background: color-mix(in srgb, var(--brand-primary) 12%, transparent); }
.smart-card-icon svg { width: 18px; height: 18px; }
.smart-card-dismiss { width: 30px; height: 30px; padding: 0; border: 1px solid var(--border-color); border-radius: 9px; color: var(--text-secondary); background: transparent; cursor: pointer; place-items: center; transition: 180ms ease; }
.smart-card-dismiss:hover { color: var(--text-primary); border-color: var(--brand-primary); background: color-mix(in srgb, var(--brand-primary) 10%, transparent); }
.smart-card-dismiss svg { width: 15px; height: 15px; }
.dashboard-location-state, .dashboard-ai-alert-state { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.location-chart-summary { display: flex; align-items: baseline; gap: 8px; padding: 18px 0 13px; }
.location-chart-summary strong { font-size: 26px; line-height: 1; }
.location-chart-summary span { color: var(--text-muted); font-size: 10px; }
.location-pie-layout { flex: 1; display: grid; grid-template-columns: minmax(124px, .82fr) minmax(138px, 1.18fr); align-items: center; gap: 18px; min-height: 240px; padding: 4px 0 18px; }
.location-pie { width: min(100%, 174px); aspect-ratio: 1; justify-self: center; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.16), 0 18px 38px rgba(2,18,25,.16); transform: rotate(-2deg); animation: revealLocationPie 650ms cubic-bezier(.2,.8,.2,1) both; }
.location-pie-legend { display: grid; align-content: center; gap: 9px; min-width: 0; }
.location-pie-legend-row { display: grid; grid-template-columns: 9px minmax(0, 1fr) auto 30px; align-items: center; gap: 7px; min-width: 0; color: var(--text-secondary); font-size: 9px; }
.location-pie-dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 8%, transparent); }
.location-pie-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.location-pie-legend-row strong { color: var(--text-primary); font-size: 10px; text-align: right; }
.location-pie-legend-row small { color: var(--text-muted); font-size: 8px; text-align: right; }
@keyframes revealLocationPie { from { opacity: 0; transform: rotate(-28deg) scale(.86); } to { opacity: 1; transform: rotate(-2deg) scale(1); } }
.smart-card-footer { margin-top: auto; padding-top: 15px; border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--text-muted); font-size: 9px; }
.dashboard-ai-alert-state { padding-top: 18px; }
.ai-alert-summary { max-height: 315px; overflow-y: auto; padding: 15px; color: var(--text-primary); background: color-mix(in srgb, var(--status-warning-bg) 68%, transparent); border: 1px solid color-mix(in srgb, var(--status-warning-text) 24%, transparent); border-radius: 13px; font-size: 12px; line-height: 1.65; }
.ai-alert-summary strong { color: var(--status-warning-text); }
.smart-dashboard-card.has-alerts .smart-card-icon { color: var(--status-warning-text); background: var(--status-warning-bg); animation: alertPulse 2.2s ease-in-out infinite; }
.smart-dashboard-card.has-alerts .page-eyebrow { color: var(--status-warning-text); }
.smart-dashboard-card.has-briefing .smart-card-icon { color: #34d399; background: rgba(16, 185, 129, .13); }
.smart-dashboard-card.has-briefing .page-eyebrow { color: #34d399; }
.smart-dashboard-card.has-briefing .ai-alert-summary { background: rgba(16, 185, 129, .07); border-color: rgba(52, 211, 153, .2); }
.smart-dashboard-card.has-briefing .ai-alert-summary strong { color: #6ee7b7; }
@keyframes alertPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0); } 50% { box-shadow: 0 0 0 7px rgba(245,158,11,.10); } }
.location-chart-empty { flex: 1; display: grid; place-items: center; color: var(--text-muted); font-size: 11px; text-align: center; }
.empty-state-cell { height: 190px; text-align: center !important; color: var(--text-muted) !important; }
.empty-state-cell svg, .empty-state-cell strong, .empty-state-cell small { display: block; margin: 0 auto; }
.empty-state-cell svg { width: 26px; height: 26px; margin-bottom: 9px; color: var(--brand-primary); }
.empty-state-cell strong { color: var(--text-primary); }
.empty-state-cell small { margin-top: 3px; font-weight: 400; }

.btn, .form-control, .badge, .btn-action, .modal-close { border-radius: var(--radius-sm); }
.btn:hover { transform: translateY(-1px); box-shadow: 0 7px 18px rgba(0, 135, 95, .16); }
.table-container { overflow: hidden; }
.custom-table th { padding: 14px 20px; font-size: 10px; }
.custom-table td { padding: 15px 20px; font-size: 12px; }
.custom-table tbody tr { transition: background 160ms ease; }
.modal-content { border-radius: var(--radius-lg); box-shadow: 0 28px 80px rgba(0,0,0,.28); }

.mobile-drawer,
.mobile-drawer-backdrop { display: none; }

@media (max-width: 1280px) {
  .app-header .brand-copy, .app-header .brand-divider { display: none; }
  .desktop-navigation .menu-link { padding: 0 10px; }
  .desktop-navigation .menu-link svg { display: none; }
  .app-header .user-details { display: none; }
  .dashboard-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 920px) {
  .app-container { grid-template-rows: 66px minmax(0, 1fr); }
  .app-header { padding: 0 18px; justify-content: space-between; }
  .brand-logo { width: 103px; height: 39px; }
  .desktop-navigation, .app-header .user-info { display: none; }
  .mobile-menu-button { display: inline-flex; }
  .topbar { min-height: 72px; padding: 14px 20px; }
  .topbar-context { display: none; }
  .view-container { padding: 4px 18px 34px; }
  .dashboard-content-grid { grid-template-columns: 1fr; }
  .dashboard-side-column { grid-template-columns: repeat(2, minmax(0, 1fr)); }

@media (max-width: 620px) {

@media (prefers-reduced-motion: reduce) {

/* Regras de Impressão */
.entidade-assinatura-impressao {
  display: none !important;
}

@media print {
  body {
    background-color: #fff !important;
    color: #000 !important;
  }
  
  .app-container {
    display: none !important;
  }

  /* O mascote flutuante não invade o documento. Os modelos imprimíveis

  .entidade-widget,
  #entidade-fab,
  .entidade-fab,
  .entidade-placa-passeio,
  .entidade-animation-lab {
    display: none !important;
  }

  .entidade-assinatura-impressao {
    display: flex !important;
  }
  
  .modal-overlay {
    display: none !important;
  }
  
  .modal-overlay#modal-folha-protocolo.active,
  .modal-overlay#modal-notificacao-ferias.active,
  .modal-overlay#modal-relatorio-impressao.active {
    display: block !important;
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: auto !important;
    background-color: transparent !important;
    backdrop-filter: none !important;
    z-index: auto !important;
    padding: 0 !important;
  }
  
  .modal-overlay#modal-folha-protocolo.active .modal-content,
  .modal-overlay#modal-notificacao-ferias.active .modal-content,
  .modal-overlay#modal-relatorio-impressao.active .modal-content {
    border: none !important;
    box-shadow: none !important;

    width: 100% !important;
    height: auto !important;
    overflow: visible !important;
    background-color: #fff !important;
    color: #000 !important;
  }
  
  .modal-overlay#modal-folha-protocolo.active .modal-body,
  .modal-overlay#modal-notificacao-ferias.active .modal-body,
  .modal-overlay#modal-relatorio-impressao.active .modal-body {
    padding: 0 !important;
  }
  
  .modal-header, .btn, .modal-close {
    display: none !important;
  }
  
  #print-area-protocolo, #print-area-notificacao-ferias, #print-area-relatorio {
    border: none !important;
    padding: 0 !important;
  }

  .notificacao-ferias-documento {
    padding: 12mm 15mm !important;

  }
}

/* Toast Notifications */
.toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 12px; z-index: 90000; pointer-events: none; }
.toast { background-color: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-color); padding: 16px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 12px; min-width: 300px; max-width: 400px; animation: toastEnter 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.toast.toast-success { border-left: 4px solid var(--success-color); }
.toast.toast-error { border-left: 4px solid var(--danger-color); }
.toast.toast-warning { border-left: 4px solid var(--warning-color); }
.toast.toast-leaving { animation: toastLeave 0.3s forwards ease-in; }
@keyframes toastEnter { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes toastLeave { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
.toast-icon { display: flex; align-items: center; justify-content: center; }
.toast-content { flex: 1; font-size: 14px; }
.btn.is-processing { cursor: wait; opacity: .78; }
.button-spinner { width: 15px; height: 15px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; flex: 0 0 auto; }
/* Sync Status Bar */
.sync-bar { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 6px 16px; font-size: 12px; font-weight: 500; letter-spacing: 0.02em; z-index: 50; }
.sync-bar.sync-offline { background: linear-gradient(90deg, #dc262620, #dc262610); color: #f87171; border-bottom: 1px solid #dc262630; }
.sync-bar.sync-busy { background: linear-gradient(90deg, #3b82f620, #3b82f610); color: #60a5fa; border-bottom: 1px solid #3b82f630; }
.sync-bar.sync-pending { background: linear-gradient(90deg, #f59e0b20, #f59e0b10); color: #fbbf24; border-bottom: 1px solid #f59e0b30; }
.sync-spinner { width: 12px; height: 12px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.fila-modal-subtitulo { margin-top: 4px; color: var(--text-muted); font-size: 12px; }
.fila-sincronizacao-lista { display: flex; flex-direction: column; gap: 12px; }
.fila-item { padding: 16px; border: 1px solid var(--border-color); border-left: 4px solid var(--warning-color, #f59e0b); border-radius: 10px; background: var(--bg-tertiary); }
.fila-item.pronta { border-left-color: var(--brand-primary); }
.fila-item.erro { border-left-color: var(--danger-color, #dc2626); }
.fila-item-cabecalho { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.fila-item-cabecalho > div { display: flex; min-width: 0; flex-direction: column; }
.fila-item-cabecalho strong { color: var(--text-primary); font-size: 14px; }
.fila-item-cabecalho small { color: var(--text-muted); font-size: 11px; }
.fila-item p { margin: 10px 0 14px; color: var(--text-secondary); font-size: 13px; overflow-wrap: anywhere; }
.fila-item-acoes { display: flex; flex-wrap: wrap; gap: 8px; }
.btn.btn-small { min-height: 32px; padding: 6px 10px; gap: 6px; font-size: 12px; }
.btn.btn-small svg { width: 14px; height: 14px; }
.fila-vazia { display: flex; min-height: 180px; align-items: center; justify-content: center; flex-direction: column; gap: 6px; color: var(--text-muted); text-align: center; }
.fila-vazia svg { width: 32px; height: 32px; color: var(--brand-primary); }
.fila-vazia strong { color: var(--text-primary); }
.fila-vazia small { font-size: 12px; }
/* Detailed Sync Status Box - Banner Ticker (Surgimento Suave por Trás do Menu) */
.sync-detailed-status {
  position: fixed;
  top: 76px;
  left: 50%;
  transform: translate(-50%, -100%) scaleY(0.82);
  transform-origin: top center;
  width: min(780px, calc(100% - 32px));
  height: 38px;
  display: flex;
  align-items: center;
  overflow: hidden;
  white-space: nowrap;
  font-size: 11.5px;
  font-weight: 500;
  color: #a5f3fc;
  background: rgba(11, 28, 40, 0.95);
  border: 1px solid rgba(165, 243, 252, 0.25);
  border-top: none;
  border-radius: 0 0 10px 10px;
  box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45), 0 0 18px rgba(14, 165, 233, 0.18);
  backdrop-filter: blur(12px);
  z-index: 90;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: transform 0.48s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.38s ease, visibility 0.48s;
  padding: 0 14px;
  margin: 0;
}

.sync-detailed-status.show {
  transform: translate(-50%, 6px) scaleY(1);
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.sync-detailed-status.entidade-insight {
  background: rgba(15, 23, 42, 0.95);
  border-color: rgba(129, 140, 248, 0.4);
  color: #e0e7ff;
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5), 0 0 20px rgba(99, 102, 241, 0.25);
}

.sync-ticker-wrapper {
  overflow: hidden;
  width: 100%;
  display: flex;
  align-items: center;
  -webkit-mask-image: linear-gradient(to right, transparent, black 8px, black calc(100% - 8px), transparent);
  mask-image: linear-gradient(to right, transparent, black 8px, black calc(100% - 8px), transparent);
}

.sync-ticker-content {
  display: inline-flex;
  align-items: center;
  white-space: nowrap;
  will-change: transform;
  /* Animates from right to left constantly */
  padding-left: 100%;
  animation: ticker-slide 10s linear infinite;
}

.sync-ticker-content .sync-spinner {
  width: 10px;
  height: 10px;
  border-width: 1.5px;
  border-top-color: transparent;
  margin-right: 6px;
  flex-shrink: 0;
}

@keyframes ticker-slide {
  0% { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}

/* =========================================
   WIDGET IA ENTIDADE (CHAT)
   ========================================= */
.entidade-widget {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 16px;
}

.entidade-fab {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--brand-primary), #6366f1);
  color: white;
  border: none;
  box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: transform 0.2s, box-shadow 0.2s;
  animation: pulse-fab 2s infinite;
}

@keyframes pulse-fab {
  0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
  70% { box-shadow: 0 0 0 10px rgba(99, 102, 241, 0); }
  100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
}

.entidade-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 16px rgba(99, 102, 241, 0.5);
}

.entidade-fab-icon {
  width: 24px;
  height: 24px;
}

.entidade-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  background: #ef4444;
  color: white;
  font-size: 11px;
  font-weight: bold;
  border-radius: 50%;
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-primary);
  animation: bounce-badge 1s infinite alternate;
}

@keyframes bounce-badge {
  from { transform: translateY(0); }
  to { transform: translateY(-3px); }
}

.entidade-chat-window {
  width: 360px;
  height: 480px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transform-origin: bottom right;
  animation: chat-open 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

@keyframes chat-open {
  from { opacity: 0; transform: scale(0.8) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.entidade-header {
  padding: 16px;
  background: rgba(255, 255, 255, 0.03);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.entidade-title {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-primary);
  font-size: 15px;
}

.entidade-status {
  font-size: 11px;
  color: #10b981;
  background: rgba(16, 185, 129, 0.1);
  padding: 2px 8px;
  border-radius: 12px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 4px;
}
.entidade-status.thinking {
  color: #f59e0b;
  background: rgba(245, 158, 11, 0.1);
}

.entidade-close {
  background: none;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  padding: 4px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.entidade-close:hover {
  background: rgba(255, 255, 255, 0.1);
  color: var(--text-primary);
}

.entidade-messages {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.entidade-msg {
  max-width: 85%;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.5;
  word-wrap: break-word;
  animation: msg-in 0.2s ease-out;
}

@keyframes msg-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.entidade-msg.ia {
  background: rgba(99, 102, 241, 0.1);
  border: 1px solid rgba(99, 102, 241, 0.2);
  color: var(--text-primary);
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}

.entidade-proposta { display: flex; flex-direction: column; gap: 8px; border-color: rgba(52, 211, 153, .34) !important; background: rgba(16, 185, 129, .08) !important; }
.entidade-proposta > span { color: var(--text-secondary); font-size: 11px; }
.entidade-proposta p { margin: 0; color: var(--text-secondary); font-size: 11px; }
.entidade-proposta-change { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 7px; padding: 9px; border: 1px solid rgba(255,255,255,.11); border-radius: 9px; background: rgba(0,0,0,.12); font-size: 11px; }
.entidade-proposta-change small { grid-column: 1 / -1; color: var(--text-muted); font-weight: 700; text-transform: uppercase; font-size: 9px; }
.entidade-proposta-change del { color: #fca5a5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entidade-proposta-change ins { color: #6ee7b7; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entidade-proposta-change svg { width: 13px; color: var(--text-muted); }
.entidade-proposta-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.entidade-proposta-actions .btn { padding: 7px 10px; font-size: 11px; }
.entidade-proposta.confirmada { border-color: rgba(52, 211, 153, .38) !important; }
.entidade-proposta-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
.entidade-proposta-fields > div { min-width: 0; padding: 8px; border: 1px solid rgba(255,255,255,.09); border-radius: 8px; background: rgba(0,0,0,.12); }
.entidade-proposta-fields small { display: block; margin-bottom: 2px; color: var(--text-muted); font-size: 9px; text-transform: uppercase; }
.entidade-proposta-fields strong { display: block; overflow: hidden; color: var(--text-primary); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }

.entidade-msg.user {
  background: var(--brand-primary);
  color: white;
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}

.entidade-msg.system-error {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: #ef4444;
  align-self: center;
  text-align: center;
  font-size: 12px;
}

.entidade-chips {
  padding: 10px 16px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.entidade-chips::-webkit-scrollbar {
  display: none;
}

.entidade-chip {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  padding: 6px 12px;
  border-radius: 16px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}

.entidade-chip:hover {
  background: rgba(99, 102, 241, 0.1);
  border-color: rgba(99, 102, 241, 0.3);
  color: #818cf8;
}

.entidade-input-area {
  padding: 12px 16px;
  background: var(--bg-tertiary);
  border-top: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  gap: 8px;
}

.entidade-input-area input {
  flex: 1;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  padding: 10px 14px;
  border-radius: 20px;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}

.entidade-input-area input:focus {
  border-color: var(--brand-primary);
}

.entidade-input-area button {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--brand-primary);
  color: white;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.2s, background-color 0.2s;
}
.entidade-input-area button:disabled {
  background: var(--border-color);
  color: var(--text-muted);
  cursor: not-allowed;
}
.entidade-input-area button:not(:disabled):hover {
  transform: scale(1.05);
  background: #4f46e5;
}

/* Renderização de Markdown no chat */
.entidade-msg.ia p { margin-bottom: 8px; }
.entidade-msg.ia p:last-child { margin-bottom: 0; }
.entidade-msg.ia strong { color: #818cf8; }
.entidade-msg.ia ul { padding-left: 16px; margin: 8px 0; }
.entidade-msg.ia li { margin-bottom: 4px; }

.entidade-feedback { display: flex; align-items: center; gap: 6px; margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(129, 140, 248, .16); color: var(--text-muted); font-size: 9px; }
.entidade-feedback > span:first-child { margin-right: auto; }
.entidade-feedback button { width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid var(--border-color); border-radius: 7px; color: var(--text-muted); background: transparent; cursor: pointer; }
.entidade-feedback button:hover { color: #818cf8; border-color: #818cf8; }
.entidade-feedback button svg { width: 12px; height: 12px; }
.entidade-feedback.avaliado { color: var(--status-active-text); }

/* Animação piscadinha (wink) no botão da Entidade */
@keyframes fab-wink {
  0%, 80%, 100% { transform: scale(1) rotate(0deg); }
  85% { transform: scale(1.15) rotate(-15deg); }
  90% { transform: scale(1.15) rotate(15deg); }
  95% { transform: scale(1.05) rotate(0deg); }
}
.entidade-fab.wink {
  animation: fab-wink 1.2s ease-in-out !important;
}

/* Customização do Ticker de Status para Insights da Entidade */
.sync-detailed-status.entidade-insight {
  background: rgba(99, 102, 241, 0.12) !important;
  border: 1px solid rgba(99, 102, 241, 0.3) !important;
  color: #a5b4fc !important;
  cursor: pointer;
  max-width: 420px;
}

.entidade-input-area .entidade-attach { width: 38px; height: 38px; flex: 0 0 auto; display: grid; place-items: center; border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-secondary); background: transparent; cursor: pointer; transition: 180ms ease; }
.entidade-input-area .entidade-attach:not(:disabled):hover { color: var(--brand-primary); border-color: var(--brand-primary); background: color-mix(in srgb, var(--brand-primary) 10%, transparent); transform: none; }
.entidade-file-preview { margin: 0 14px 8px; padding: 8px 9px; display: flex; align-items: center; gap: 7px; border: 1px solid rgba(99, 102, 241, .32); border-radius: 9px; color: var(--text-secondary); background: rgba(99, 102, 241, .08); font-size: 11px; }
.entidade-file-preview > svg { width: 15px; height: 15px; color: #a5b4fc; flex: 0 0 auto; }
.entidade-file-preview > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entidade-file-preview button { margin-left: auto; padding: 2px; border: 0; color: var(--text-secondary); background: transparent; cursor: pointer; }
.entidade-file-preview button:hover { color: var(--text-primary); }
.entidade-file-preview button svg { width: 14px; height: 14px; }
.sync-detailed-status.entidade-insight.show {
  width: min(420px, calc(100vw - 180px));
}
.sync-detailed-status.entidade-insight:hover {
  background: rgba(99, 102, 241, 0.2) !important;
  border-color: rgba(99, 102, 241, 0.5) !important;
}
.sync-detailed-status.entidade-insight .sync-ticker-content {
  width: max-content;
  min-width: max-content !important;
  flex: 0 0 auto;
  padding-left: 100%;
  animation: entidade-ticker-slide var(--entidade-ticker-duration, 24s) linear 1 forwards !important;
}

@keyframes entidade-ticker-slide {
  from { transform: translate3d(0, 0, 0); }
  to { transform: translate3d(-100%, 0, 0); }
}

/* Animação de rotação 360 graus para a Entidade */
@keyframes fab-rotate {
  0% { transform: scale(1) rotate(0deg); }
  100% { transform: scale(1) rotate(360deg); }
}
.entidade-fab.rotate {
  animation: fab-rotate 0.6s cubic-bezier(0.4, 0, 0.2, 1) !important;
}

/* Convite da Entidade: o fantasma só surge quando existe um aviso pendente. */
.entidade-convite-button {
  width: 100%;
  min-height: 34px;
  margin-top: 9px;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px solid rgba(129, 140, 248, .45);
  border-radius: 10px;
  color: #c7d2fe;
  background: rgba(99, 102, 241, .10);
  font: inherit;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: 180ms ease;
}
.entidade-convite-button:hover { color: #fff; border-color: #818cf8; background: rgba(99, 102, 241, .20); }
.entidade-convite-button svg { width: 14px; height: 14px; }

.entidade-fab {
  width: 52px;
  height: 58px;
  padding: 0;
  border: 0;
  border-radius: 0;
  color: #a5b4fc;
  background: transparent;
  box-shadow: none;
  display: grid;
  place-items: center;
  animation: ghost-arrive .7s cubic-bezier(.2, .9, .25, 1) both;
  filter: drop-shadow(0 0 9px rgba(129, 140, 248, .64)) drop-shadow(0 0 22px rgba(99, 102, 241, .30));
}
.entidade-fab:hover { transform: scale(1.08); background: transparent; box-shadow: none; color: #e0e7ff; }
.entidade-fab svg { width: 38px; height: 38px; filter: drop-shadow(0 7px 10px rgba(99, 102, 241, .38)); }
.entidade-fab.has-notification { animation: ghost-arrive .7s cubic-bezier(.2, .9, .25, 1) both, ghost-float 3.6s ease-in-out .7s infinite; }
.entidade-fab.chat-open { animation: ghost-arrive .6s cubic-bezier(.2, .9, .25, 1) both, ghost-float 4.2s ease-in-out .6s infinite; }
.entidade-fab.leaving { animation: ghost-depart .42s ease-in forwards !important; pointer-events: none; }
.entidade-fab.rotate { animation: ghost-signal .62s ease-in-out !important; }
.entidade-badge { display: none !important; }

@keyframes ghost-arrive {
  0% { opacity: 0; transform: translate(38px, 32px) rotate(8deg) scale(.72); }
  65% { opacity: 1; transform: translate(-4px, -5px) rotate(-3deg) scale(1.04); }
  100% { opacity: 1; transform: translate(0, 0) rotate(0) scale(1); }
}
@keyframes ghost-float {
  0%, 100% { transform: translate(0, 0) rotate(-2deg); }
  45% { transform: translate(-5px, -9px) rotate(2deg); }
  70% { transform: translate(2px, -4px) rotate(-1deg); }
}
@keyframes ghost-signal {
  0% { transform: translate(20px, 15px) rotate(6deg) scale(.88); }
  55% { transform: translate(-3px, -8px) rotate(-5deg) scale(1.12); }
  100% { transform: translate(0, 0) rotate(0) scale(1); }
}
@keyframes ghost-depart {
  from { opacity: 1; transform: translate(0, 0) rotate(0) scale(1); }
  to { opacity: 0; transform: translate(30px, 24px) rotate(8deg) scale(.76); }
}

/* Movimento contínuo: o fantasma desliza, sem giros ou pulsos bruscos. */
.entidade-fab.has-notification,
.entidade-fab.chat-open { animation: ghost-float-smooth 4.6s ease-in-out infinite; }
.entidade-fab.enter-left { animation: ghost-enter-left .56s cubic-bezier(.22, .78, .28, 1) both !important; }
.entidade-fab.enter-right { animation: ghost-enter-right .56s cubic-bezier(.22, .78, .28, 1) both !important; }
.entidade-fab.leaving.exit-left { animation: ghost-exit-left .62s cubic-bezier(.55, 0, .8, .28) both !important; }
.entidade-fab.leaving.exit-right { animation: ghost-exit-right .62s cubic-bezier(.55, 0, .8, .28) both !important; }
.entidade-fab.rotate { animation: ghost-float-smooth 4.6s ease-in-out infinite !important; }

@keyframes ghost-float-smooth {
  0%, 100% { transform: translate3d(0, 0, 0); filter: drop-shadow(0 0 8px rgba(129,140,248,.54)) drop-shadow(0 0 18px rgba(99,102,241,.24)); }
  50% { transform: translate3d(0, -7px, 0); filter: drop-shadow(0 0 11px rgba(129,140,248,.74)) drop-shadow(0 0 25px rgba(99,102,241,.38)); }
}
@keyframes ghost-enter-left {
  from { opacity: 0; transform: translate3d(-72px, 16px, 0); }
  to { opacity: 1; transform: translate3d(0, 0, 0); }
}
@keyframes ghost-enter-right {
  from { opacity: 0; transform: translate3d(72px, 16px, 0); }
  to { opacity: 1; transform: translate3d(0, 0, 0); }
}
@keyframes ghost-exit-left {
  from { opacity: 1; transform: translate3d(0, 0, 0); }
  to { opacity: 0; transform: translate3d(-84px, 20px, 0); }
}
@keyframes ghost-exit-right {
  from { opacity: 1; transform: translate3d(0, 0, 0); }
  to { opacity: 0; transform: translate3d(84px, 20px, 0); }
}

/* Rodapé do aplicativo e percurso ocioso da Entidade dentro dessa faixa. */
.app-footer {
  position: relative;
  flex: 0 0 46px;
  min-height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 64px;
  color: var(--text-muted);
  font-size: 13px;
  text-align: center;
  border-top: 1px solid var(--border-color);
  margin-top: auto;
  overflow: hidden;
}

.entidade-fab.roaming {
  position: fixed;
  width: 34px;
  height: 34px;
  right: auto;
  bottom: auto;
  z-index: 10001;
  will-change: left, top, transform;
  transition: left 2.8s cubic-bezier(.34, .72, .28, 1), top 2.8s cubic-bezier(.34, .72, .28, 1), color .25s ease, filter .25s ease;
  animation: ghost-roaming-bob 3.8s ease-in-out infinite !important;
  filter: drop-shadow(0 0 6px rgba(129, 140, 248, .62)) drop-shadow(0 0 14px rgba(99, 102, 241, .28));
}
.entidade-fab.roaming.passeando {
  position: fixed !important;
  z-index: 1;
  pointer-events: none;
  opacity: .82;
  transition: left 4.6s cubic-bezier(.42, 0, .24, 1), top 4.6s cubic-bezier(.42, 0, .24, 1), color .25s ease, filter .25s ease;
  animation: ghost-roaming-bob 4.4s ease-in-out infinite !important;
}
.entidade-fab.roaming.subindo-do-rodape,
.entidade-fab.roaming.descendo-ao-rodape {
  position: fixed !important;
  z-index: 10001;
  opacity: 1;
  transition: left 2.35s cubic-bezier(.34, .72, .28, 1), top 2.35s cubic-bezier(.34, .72, .28, 1), opacity .35s ease;
}
.view-section { isolation: isolate; }
.view-section > .entidade-fab.roaming.passeando { position: fixed !important; z-index: -1; }
.entidade-fab.roaming svg { width: 27px; height: 27px; }
.entidade-fab.roaming svg {
  transform-origin: 50% 58%;
  will-change: transform, opacity, filter;
}
.entidade-fab.roaming.indo-direita svg {
  animation: ghost-travel-right 1.55s ease-in-out infinite;
}
.entidade-fab.roaming.indo-esquerda svg {
  animation: ghost-travel-left 1.55s ease-in-out infinite;
}
.entidade-fab.roaming.movendo-vertical svg {
  animation: ghost-travel-vertical 1.35s ease-in-out infinite;
}
.entidade-fab.roaming.has-notification {
  color: #e0e7ff;
  filter: drop-shadow(0 0 9px rgba(129, 140, 248, .72));
  animation: ghost-roaming-bob 3.2s ease-in-out infinite !important;
}
.entidade-fab.has-notification svg {
  animation: ghost-alert 1.8s ease-in-out infinite;
}
.entidade-fab.has-notification::after {
  content: '';
  position: absolute;
  right: 5px;
  top: 5px;
  width: 9px;
  height: 9px;
  border: 2px solid rgba(15, 23, 42, .92);
  border-radius: 50%;
  background: #fbbf24;
  box-shadow: 0 0 0 0 rgba(251, 191, 36, .55), 0 0 10px rgba(251, 191, 36, .75);
  animation: ghost-unread-ping 1.8s ease-out infinite;
  pointer-events: none;
}
.entidade-fab svg path:nth-of-type(1),
.entidade-fab svg path:nth-of-type(2) {
  animation: ghost-eye-blink 6.8s ease-in-out infinite;
}
.entidade-fab.roaming.idle-sleeping svg path:nth-of-type(1),
.entidade-fab.roaming.idle-sleeping svg path:nth-of-type(2) {
  animation: none;
  opacity: 0;
}
.entidade-fab.is-thinking svg {
  animation: ghost-thinking 2.35s ease-in-out infinite;
}
.entidade-fab.is-thinking::after {
  content: ''; position: absolute; right: -7px; top: -8px; width: 15px; height: 15px;
  border: 2px solid rgba(165,180,252,.24); border-top-color: #a5b4fc;
  border-right-color: #818cf8; border-radius: 50%;
  filter: drop-shadow(0 0 5px rgba(129,140,248,.55));
  animation: ghost-loading-spin .82s linear infinite;
}
.entidade-fab.is-thinking::before {
  content: none;
}
.entidade-fab.chat-open:not(.is-thinking):not(.has-notification) svg {
  animation: ghost-conversation 3.4s ease-in-out infinite;
}
.entidade-fab.roaming.leaving.exit-left { animation: ghost-exit-left .62s cubic-bezier(.55, 0, .8, .28) both !important; transition: none; }
.entidade-fab.roaming.leaving.exit-right { animation: ghost-exit-right .62s cubic-bezier(.55, 0, .8, .28) both !important; transition: none; }

/* Cenas ociosas espaçadas. Os elementos existem apenas durante a cena. */
.entidade-fab.roaming[class*="idle-"]::before,
.entidade-fab.roaming[class*="idle-"]::after {
  position: absolute;
  pointer-events: none;
  transition: opacity .52s ease, transform .52s cubic-bezier(.22, .78, .28, 1);
}
.entidade-fab.roaming.idle-entering svg { animation: ghost-idle-enter .52s ease-out both !important; }
.entidade-fab.roaming.idle-leaving svg { animation: ghost-idle-leave .62s ease-in-out both !important; }
.entidade-fab.roaming.idle-entering::before,
.entidade-fab.roaming.idle-entering::after,
.entidade-fab.roaming.idle-leaving::before,
.entidade-fab.roaming.idle-leaving::after { opacity: 0 !important; }
.entidade-fab.roaming.idle-reading svg { animation: ghost-read 2.2s ease-in-out infinite; }
.entidade-fab.roaming.idle-reading svg { position: relative; z-index: 1; }
.entidade-fab.roaming.idle-reading::after {
  content: '';
  left: 2px;
  bottom: -7px;
  width: 31px;
  height: 17px;
  border: 1px solid rgba(49,46,129,.9);
  border-radius: 3px 3px 6px 6px;
  background: linear-gradient(90deg, #4338ca 0 48%, #312e81 49% 51%, #4f46e5 52% 100%);
  clip-path: polygon(0 2px, 47% 5px, 50% 100%, 53% 5px, 100% 2px, 96% 94%, 53% 100%, 47% 100%, 4% 94%);
  filter: drop-shadow(0 4px 5px rgba(0, 0, 0, .48));
  animation: ghost-book 2.2s ease-in-out infinite;
  z-index: 2;
}
.entidade-fab.roaming.idle-reading::before {
  content: '';
  left: 4px;
  bottom: -4px;
  width: 27px;
  height: 14px;
  border-radius: 2px 2px 5px 5px;
  background:
    repeating-linear-gradient(0deg, transparent 0 3px, rgba(99,102,241,.22) 3px 4px),
    linear-gradient(90deg, #f8fafc 0 47%, #a5b4fc 48% 52%, #f8fafc 53% 100%);
  clip-path: polygon(0 0, 46% 3px, 50% 100%, 54% 3px, 100% 0, 96% 88%, 53% 100%, 47% 100%, 4% 88%);
  transform-origin: center bottom;
  animation: ghost-pages 2.2s ease-in-out infinite;
  z-index: 3;
}
.entidade-fab.roaming.idle-sleeping svg { animation: ghost-sleep 3.1s ease-in-out infinite; }
.entidade-fab.roaming.idle-sleeping::after {
  content: 'Z';
  top: -8px;
  right: -3px;
  color: #c7d2fe;
  font-size: 11px;
  font-weight: 800;
  text-shadow: 0 0 7px rgba(129, 140, 248, .75);
  animation: ghost-dream 2.4s ease-out infinite;
}
.entidade-fab.roaming.idle-orb svg { animation: ghost-watch-orb 2.5s ease-in-out infinite; }
.entidade-fab.roaming.idle-orb::after {
  content: '';
  left: 14px;
  top: 13px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #fef08a;
  box-shadow: 0 0 6px 2px rgba(250, 204, 21, .88), 0 0 13px 5px rgba(163, 230, 53, .30);
  animation: ghost-firefly 3.8s cubic-bezier(.45, 0, .3, 1) infinite;
}
.entidade-fab.roaming.idle-orb::before {
  content: '';
  left: 14px;
  top: 13px;
  width: 4px;
  height: 2px;
  border-radius: 50%;
  background: rgba(224, 231, 255, .72);
  animation: ghost-firefly-wings-path 3.8s cubic-bezier(.45, 0, .3, 1) infinite;
}
.entidade-fab.roaming.idle-juggling svg { animation: ghost-juggle-body 1.45s ease-in-out infinite; }
.entidade-fab.roaming.idle-juggling::before {
  content: '';
  left: 1px;
  top: -11px;
  width: 32px;
  height: 28px;
  background:
    radial-gradient(circle, #f87171 0 2.4px, transparent 2.8px) 1px 18px / 6px 6px no-repeat,
    radial-gradient(circle, #fbbf24 0 2.4px, transparent 2.8px) 13px 1px / 6px 6px no-repeat,
    radial-gradient(circle, #60a5fa 0 2.4px, transparent 2.8px) 25px 18px / 6px 6px no-repeat;
  filter: drop-shadow(0 0 4px rgba(255,255,255,.28));
  animation: ghost-juggle-balls 1.45s ease-in-out infinite;
}
.entidade-fab.roaming.idle-juggling::after {
  content: '';
  left: 7px;
  top: 0;
  width: 20px;
  height: 13px;
  border-top: 1px dashed rgba(199,210,254,.55);
  border-radius: 50%;
  opacity: .62;
  animation: ghost-juggle-arc 1.45s ease-in-out infinite;
}
.entidade-fab.roaming.idle-sunbathing svg { animation: ghost-sun-rest 3.5s ease-in-out infinite; }
.entidade-fab.roaming.idle-sunbathing::before {
  content: '';
  right: -8px;
  top: -10px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #fbbf24;
  box-shadow: 0 0 8px 3px rgba(251,191,36,.44);
  animation: ghost-sunshine 2.8s ease-in-out infinite;
}
.entidade-fab.roaming.idle-sunbathing::after {
  content: '';
  left: 8px;
  top: 12px;
  width: 7px;
  height: 5px;
  border: 1.5px solid #111827;
  border-radius: 2px 2px 4px 4px;
  background: rgba(15, 23, 42, .94);
  box-shadow: 10px 1px 0 -1.5px rgba(15,23,42,.94), 10px 1px 0 0 #111827, 5px 0 0 -2px #111827;
  transform: rotate(-5deg);
  filter: drop-shadow(0 1px 1px rgba(0,0,0,.5));
  animation: ghost-sunglasses 3.5s ease-in-out infinite;
}

/* Cenas adicionadas pelo roteiro do mascote. */
.entidade-fab.roaming.idle-coffee svg { animation: ghost-coffee-sip 2.2s ease-in-out infinite; }
.entidade-fab.roaming.idle-coffee::after {
  content: '';
  left: 10px;
  bottom: -3px;
  width: 14px;
  height: 9px;
  border: 1.5px solid #f8fafc;
  border-radius: 3px 3px 7px 7px;
  background: linear-gradient(#7c2d12 0 28%, #f59e0b 30% 100%);
  box-shadow: 5px 1px 0 -3px transparent, 5px 1px 0 -1.5px #f8fafc, 0 3px 5px rgba(0,0,0,.35);
  animation: ghost-coffee-cup 2.2s ease-in-out infinite;
}
.entidade-fab.roaming.idle-coffee::before {
  content: '≈';
  left: 11px;
  bottom: 5px;
  color: rgba(255,255,255,.86);
  font-size: 17px;
  font-weight: 700;
  transform: rotate(90deg);
  animation: ghost-coffee-steam 1.8s ease-out infinite;
}
.entidade-fab.roaming.idle-dancing svg { animation: ghost-dance 1s ease-in-out infinite; }
.entidade-fab.roaming.idle-dancing::before {
  content: '♫';
  right: -8px;
  top: -10px;
  color: #f0abfc;
  font-size: 15px;
  font-weight: 800;
  text-shadow: -27px 9px 0 #67e8f9, 0 0 8px rgba(217,70,239,.75);
  animation: ghost-dance-notes 1.7s ease-out infinite;
}
.entidade-fab.roaming.idle-dancing::after {
  content: '';
  left: 4px;
  bottom: -5px;
  width: 27px;
  height: 6px;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(129,140,248,.72), transparent 68%);
  animation: ghost-dance-floor 1s ease-in-out infinite;
}

/* Post-it deixado durante o passeio da Entidade. */
.entidade-placa-passeio {
  position: fixed;
  z-index: 10000;
  width: 38px;
  height: 32px;
  padding: 4px 3px 2px;
  border: 0;
  border-radius: 2px 2px 7px 2px;
  color: #4b3600;
  background: linear-gradient(145deg, #fff59d, #facc15 82%);
  box-shadow: 0 7px 13px rgba(0,0,0,.32), inset 0 1px rgba(255,255,255,.75);
  font-family: "Comic Sans MS", "Segoe Print", cursive;
  font-size: 8px;
  font-weight: 800;
  line-height: 1.05;
  text-align: center;
  cursor: pointer;
  transform: translate(25px, -5px) rotate(-5deg);
  transform-origin: 6px 26px;
  transition: filter .18s ease, box-shadow .18s ease;
}
.entidade-placa-passeio::after {
  content: '';
  position: absolute;
  right: 0;
  bottom: 0;

  border-width: 0 0 9px 9px;

}
.entidade-placa-passeio:hover { filter: brightness(1.08); box-shadow: 0 8px 17px rgba(0,0,0,.4), 0 0 12px rgba(250,204,21,.42); }
.entidade-placa-passeio.colocando { animation: ghost-note-place 1.35s cubic-bezier(.2,.9,.25,1) both; }
.entidade-placa-passeio.recolhendo { animation: ghost-note-pick .68s ease-in both; }
.entidade-placa-passeio.jogada { animation: ghost-note-throw .78s cubic-bezier(.55,0,.9,.45) both; }
.entidade-fab.colocando-placa svg { animation: ghost-place-note 1.5s ease-in-out both !important; }
.entidade-fab.recolhendo-placa svg { animation: ghost-pick-note .65s ease-in-out both !important; }
.entidade-fab.jogando-placa svg { animation: ghost-throw-note .8s ease-out both !important; }

/* Feedback visual das operações do sistema. */
.entidade-fab.operation-lancamento,
.entidade-fab.operation-alteracao,
.entidade-fab.operation-falha { z-index: 10002; }
.entidade-fab.operation-lancamento svg { animation: ghost-operation-success .72s ease-in-out 3 !important; color: #6ee7b7; }
.entidade-fab.operation-alteracao svg { animation: ghost-operation-edit .7s ease-in-out 3 !important; color: #93c5fd; }
.entidade-fab.operation-falha svg { animation: ghost-operation-fail .42s ease-in-out 4 !important; color: #fca5a5; }
.entidade-fab.operation-lancamento::after,
.entidade-fab.operation-alteracao::after,
.entidade-fab.operation-falha::after {
  position: absolute;
  right: -7px;
  top: -8px;
  width: 17px;
  height: 17px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #fff;
  font: 800 11px/1 Arial, sans-serif;

.entidade-fab.operation-lancamento::after { content: '✓'; background: #10b981; }

.entidade-fab.operation-falha::after { content: '×'; display: grid; background: #ef4444; }
.entidade-fab.operation-falha svg path:nth-of-type(1),

.entidade-fab.operation-falha::before {

  color: #fecaca; background: transparent; font: 900 8px/1 Arial,sans-serif;

@keyframes ghost-coffee-sip { 0%,100%{transform:translateY(0) rotate(0)} 45%{transform:translateY(2px) rotate(-7deg)} 65%{transform:translateY(0) rotate(3deg)} }
@keyframes ghost-coffee-cup { 0%,100%{transform:translateY(0) rotate(-2deg)} 45%,65%{transform:translate(2px,-3px) rotate(5deg)} }
@keyframes ghost-coffee-steam { 0%{opacity:0;transform:translateY(5px) rotate(90deg) scale(.7)} 35%{opacity:.9} 100%{opacity:0;transform:translateY(-8px) rotate(100deg) scale(1.2)} }
@keyframes ghost-juggle-body { 0%,100%{transform:translate3d(-2px,1px,0) rotate(-4deg)} 50%{transform:translate3d(2px,-2px,0) rotate(4deg)} }
@keyframes ghost-juggle-balls {
  0%,100%{transform:translate3d(0,0,0) rotate(-2deg);background-position:1px 18px,13px 1px,25px 18px}
  33%{transform:translate3d(2px,-2px,0) rotate(2deg);background-position:1px 3px,13px 18px,25px 9px}
  66%{transform:translate3d(-2px,-1px,0) rotate(-2deg);background-position:1px 11px,13px 2px,25px 18px}
}
@keyframes ghost-juggle-arc { 0%,100%{transform:scaleX(.86);opacity:.35} 50%{transform:scaleX(1.08);opacity:.72} }
@keyframes ghost-dance { 0%,100%{transform:translate(-2px,0) rotate(-8deg)} 50%{transform:translate(3px,-5px) rotate(10deg)} }
