<style>
/* 
   RH Central de Documentos v2.0
   Design System & Stylesheet (CSS Puro)
*/

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

:root {
  --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  
  /* Paleta de Cores (Premium & Profissional) */
  --bg-primary: #121214;
  --bg-secondary: #1a1a1e;
  --bg-tertiary: #26262b;
  --border-color: #323238;
  
  --text-primary: #e1e1e6;
  --text-secondary: #a8a8b3;
  --text-muted: #7c7c8a;
  
  --brand-primary: #00875f; /* VerdeSETUR */
  --brand-primary-hover: #00b37e;
  --brand-secondary: #0784b5; /* Azul Protocolo */
  
  /* Cores de Feedback de Status */
  --status-active-bg: rgba(0, 135, 95, 0.15);
  --status-active-text: #04d361;
  --status-leave-bg: rgba(247, 90, 90, 0.15);
  --status-leave-text: #f75a5a;
  --status-warning-bg: rgba(254, 180, 8, 0.15);
  --status-warning-text: #feb408;
  --status-inactive-bg: rgba(124, 124, 138, 0.15);
  --status-inactive-text: #8d8d99;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-family);
  background-color: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  height: 100vh;
}

/* Layout Principal */
.app-container {
  display: flex;
  height: 100vh;
  width: 100vw;
}

/* Menu Lateral (Sidebar) */
.sidebar {
  width: 260px;
  background-color: var(--bg-secondary);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  height: 100%;
}

.sidebar-header {
  padding: 24px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
}

.sidebar-header h2 {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 0.5px;
}

.sidebar-header p {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

.sidebar-menu {
  flex: 1;
  padding: 24px 16px;
  list-style: none;
  overflow-y: auto;
}

.menu-item {
  margin-bottom: 8px;
}

.menu-link {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  border-radius: 6px;
  transition: all 0.2s ease;
  cursor: pointer;
}

.menu-link:hover {
  background-color: var(--bg-tertiary);
  color: var(--text-primary);
}

.menu-link.active {
  background-color: var(--brand-primary);
  color: #ffffff;
}

.menu-icon {
  margin-right: 12px;
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn-link {
  color: var(--primary-color);
  text-decoration: none;
  font-weight: 500;
  transition: all 0.2s ease;
}

.btn-link:hover {
  text-decoration: underline;
  color: var(--primary-hover);
}

/* Área de Conteúdo */
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100%;
  background-color: var(--bg-primary);
}

/* Barra Superior */
.topbar {
  height: 70px;
  background-color: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
}

.topbar-title h1 {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
}

.user-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.user-details {
  text-align: right;
}

.user-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}

.user-role {
  font-size: 11px;
  color: var(--text-secondary);
}

/* Telas (Views) */
.view-container {
  flex: 1;
  padding: 32px;
  overflow-y: auto;
  position: relative;
}

.view-section {
  display: none;
}

.view-section.active {
  display: block;
  animation: fadeIn 0.3s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Cards & Layouts Comuns */
.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 24px;
  margin-bottom: 32px;
}

.card {
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 24px;
}

.card-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--text-secondary);
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

.card-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--text-primary);
}

/* Tabelas */
.table-container {
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 24px;
}

.table-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}

.table-title {
  font-size: 16px;
  font-weight: 600;
}

.custom-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}

.custom-table th {
  padding: 16px 24px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border-color);
  background-color: rgba(255, 255, 255, 0.02);
}

.custom-table td {
  padding: 16px 24px;
  font-size: 14px;
  border-bottom: 1px solid var(--border-color);
  color: var(--text-primary);
}

.custom-table tr:last-child td {
  border-bottom: none;
}

.custom-table tr:hover td {
  background-color: rgba(255, 255, 255, 0.01);
}

/* Badges de Status (Sem emojis) */
.badge {
  display: inline-block;
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  border-radius: 4px;
  letter-spacing: 0.5px;
}

.badge-ativo {
  background-color: var(--status-active-bg);
  color: var(--status-active-text);
}

.badge-ferias {
  background-color: var(--status-leave-bg);
  color: var(--status-leave-text);
}

.badge-abono {
  background-color: var(--status-warning-bg);
  color: var(--status-warning-text);
}

.badge-inativo {
  background-color: var(--status-inactive-bg);
  color: var(--status-inactive-text);
}

/* Formulários */
.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 8px;
  color: var(--text-secondary);
}

.form-control {
  width: 100%;
  padding: 12px 16px;
  background-color: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  border-radius: 6px;
  color: var(--text-primary);
  font-family: var(--font-family);
  font-size: 14px;
  transition: all 0.2s ease;
}

.form-control:focus {
  outline: none;
  border-color: var(--brand-primary);
  box-shadow: 0 0 0 2px rgba(0, 135, 95, 0.2);
}

/* Botões */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 12px 20px;
  font-size: 14px;
  font-weight: 600;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: var(--font-family);
  gap: 8px;
}

.btn-primary {
  background-color: var(--brand-primary);
  color: #ffffff;
}

.btn-primary:hover {
  background-color: var(--brand-primary-hover);
}

.btn-secondary {
  background-color: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border-color);
}

.btn-secondary:hover {
  background-color: var(--border-color);
}

/* Loader */
.loader-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(18, 18, 20, 0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.loader {
  border: 4px solid var(--bg-tertiary);
  border-top: 4px solid var(--brand-primary);
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
/* Filtros e Barra de Pesquisa */
.filter-bar {
  display: flex;
  gap: 16px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.search-input-wrapper {
  position: relative;
  flex: 1;
  min-width: 250px;
}

.search-input-wrapper input {
  padding-left: 40px;
}

.search-icon-inside {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  width: 16px;
  height: 16px;
}

.filter-select {
  width: 180px;
  background-color: var(--bg-secondary);
}

/* Modais */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: rgba(0, 0, 0, 0.75);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
  backdrop-filter: blur(4px);
}

.modal-overlay.active {
  display: flex;
}

.modal-content {
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  animation: modalSlideUp 0.25s ease-out;
}

.modal-content.large {
  max-width: 900px;
}

@keyframes modalSlideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-title {
  font-size: 16px;
  font-weight: 600;
}

.modal-close {
  background: none;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  transition: all 0.2s ease;
}

.modal-close:hover {
  background-color: var(--bg-tertiary);
  color: var(--text-primary);
}

.modal-body {
  padding: 24px;
  flex: 1;
}

.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border-color);
  display: flex;
  justify-content: flex-end;
  gap: 12px;
}

/* Abas (Tabs) para Ficha do Servidor */
.tab-container {
  display: flex;
  border-bottom: 1px solid var(--border-color);
  margin-bottom: 24px;
}

.tab-button {
  padding: 12px 20px;
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s ease;
  font-family: var(--font-family);
}

.tab-button:hover {
  color: var(--text-primary);
}

.tab-button.active {
  color: var(--brand-primary-hover);
  border-bottom-color: var(--brand-primary);
}

.tab-panel {
  display: none;
}

.tab-panel.active {
  display: block;
}

/* Colunas de Formulário Flex */
.form-row {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}

.form-row .form-group {
  flex: 1;
  min-width: 200px;
}

/* Ícones de ação na tabela */
.action-buttons {
  display: flex;
  gap: 8px;
}

.btn-action {
  width: 32px;
  height: 32px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  border: 1px solid var(--border-color);
  background-color: var(--bg-tertiary);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn-action:hover {
  color: var(--text-primary);
  background-color: var(--border-color);
}

.btn-action.btn-delete:hover {
  background-color: rgba(247, 90, 90, 0.15);
  color: var(--status-leave-text);
  border-color: rgba(247, 90, 90, 0.3);
}

/* Layout Ficha de Servidor */
.profile-header {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 24px;
  background-color: rgba(255, 255, 255, 0.01);
  padding: 20px;
  border-radius: 8px;
  border: 1px solid var(--border-color);
}

.profile-avatar-placeholder {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background-color: var(--bg-tertiary);
  color: var(--brand-primary-hover);
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--border-color);
}

.profile-info h3 {
  font-size: 18px;
  font-weight: 600;
}

.profile-info p {
  font-size: 13px;
  color: var(--text-secondary);
}

/* Grid de Períodos Aquisitivos */
.periods-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.period-card {
  background-color: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  border-radius: 6px;
  padding: 16px;
}

.period-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.period-title {
  font-size: 13px;
  font-weight: 700;
}

.period-dates {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

.period-status-bar {
  height: 6px;
  border-radius: 3px;
  background-color: var(--bg-secondary);
  overflow: hidden;
  margin-top: 12px;
}

.period-status-fill {
  height: 100%;
  width: 0%;
}

.fill-usufruido {
  background-color: var(--status-active-text);
  width: 100%;
}

.fill-disponivel {
  background-color: var(--status-warning-text);
  width: 100%;
}

.fill-vencido {
  background-color: var(--status-leave-text);
  width: 100%;
}

.period-legend {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
}

/* Regras de Impressão */
@media print {
  body, .app-container, .main-content, .view-container {
    background-color: #fff !important;
    color: #000 !important;
    overflow: visible !important;
    height: auto !important;
  }
  
  .sidebar, .topbar, .filter-bar, .table-container, .modal-overlay, .btn, .modal-header {
    display: none !important;
  }
  
  .modal-overlay#modal-folha-protocolo {
    display: block !important;
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: auto !important;
    background-color: #fff !important;
    backdrop-filter: none !important;
    z-index: auto !important;
  }
  
  .modal-overlay#modal-folha-protocolo .modal-content {
    border: none !important;
    box-shadow: none !important;
    max-width: 100% !important;
    width: 100% !important;
    height: auto !important;
    overflow: visible !important;
  }
  
  .modal-overlay#modal-folha-protocolo .modal-body {
    padding: 0 !important;
  }
  
  #print-area-protocolo {
    border: none !important;
    padding: 0 !important;
  }
}
</style>
