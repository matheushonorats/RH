<style>
/* 
   RH Central de Documentos v2.0
   Design System & Stylesheet (CSS Puro)
*/

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

:root {
  --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  
  /* Paleta de Cores (Natural / Institucional) */
  --bg-primary: #f4f6f8;
  --bg-secondary: #ffffff;
  --bg-tertiary: #f0f2f5;
  --border-color: #d1d5db;
  
  --text-primary: #1f2937;
  --text-secondary: #4b5563;
  --text-muted: #6b7280;
  
  --brand-primary: #2563eb; /* Azul Gestão */
  --brand-primary-hover: #1d4ed8;
  --brand-secondary: #059669; /* Verde Institucional */
  
  /* Cores de Feedback de Status */
  --status-active-bg: #dcfce7;
  --status-active-text: #166534;
  --status-leave-bg: #fee2e2;
  --status-leave-text: #991b1b;
  --status-warning-bg: #fef3c7;
  --status-warning-text: #92400e;
  --status-inactive-bg: #f3f4f6;
  --status-inactive-text: #374151;
}

body.dark-mode {
  --bg-primary: #121214;
  --bg-secondary: #1a1a1e;
  --bg-tertiary: #26262b;
  --border-color: #323238;
  
  --text-primary: #e1e1e6;
  --text-secondary: #a8a8b3;
  --text-muted: #7c7c8a;
  
  --brand-primary: #00875f; /* VerdeSETUR */
  --brand-primary-hover: #00b37e;
  --brand-secondary: #0784b5; /* Azul Protocolo */

  --status-active-bg: rgba(0, 135, 95, 0.15);
  --status-active-text: #04d361;
  --status-leave-bg: rgba(247, 90, 90, 0.15);
  --status-leave-text: #f75a5a;
  --status-warning-bg: rgba(254, 180, 8, 0.15);
  --status-warning-text: #feb408;
  --status-inactive-bg: rgba(124, 124, 138, 0.15);
  --status-inactive-text: #8d8d99;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-family);
  background-color: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  height: 100vh;
}

    /* TELA DE LOGIN (Design Inspirado no Anexo) */
    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #061c31; /* Fundo azul escuro igual ao anexo */
      z-index: 100000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .login-box {
      width: 100%;
      max-width: 400px;
      background-color: #ffffff; /* Fundo branco */
      border: none;
      border-top: 6px solid #fbbf24; /* Faixa amarela no topo */
      border-radius: 12px;
      padding: 36px 32px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }
    
    .login-header h2 {
      font-size: 22px;
      margin-bottom: 4px;
      font-weight: 700;
      color: #061c31; /* Título azul escuro */
    }
    
    .login-header p {
      font-size: 14px;
      color: #64748b; /* Subtítulo cinza */
    }
    
    /* Forçar cores claras nos inputs do login, independentemente do tema dark */
    .login-box .form-label {
      color: #475569;
      font-weight: 600;
    }
    .login-box .form-control {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      color: #0f172a;
    }
    .login-box .form-control:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }
    .login-box .btn-primary {
      background-color: #061c31;
      color: #ffffff;
      font-weight: 600;
      border: none;
    }
    .login-box .btn-primary:hover {
      background-color: #0a2b4d;
    }
    .login-box .login-footer p {
      color: #94a3b8;
    }
    
    /* Layout Principal */
.app-container {
  display: flex;
  height: 100vh;
  width: 100vw;
}

/* Menu Lateral (Sidebar) */
.sidebar {
  width: 260px;
  background-color: var(--bg-secondary);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  height: 100%;
}

.sidebar-header {
  padding: 24px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
}

.brand-logo {
  height: 36px;
  display: block;
}

.sidebar-header h2 {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 0.5px;
}

.sidebar-header p {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

.sidebar-menu {
  flex: 1;
  padding: 24px 16px;
  list-style: none;
  overflow-y: auto;
}

.menu-item {
  margin-bottom: 8px;
}

.menu-link {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  border-radius: 0;
  transition: all 0.2s ease;
  cursor: pointer;
  position: relative;
  z-index: 1;
}

.menu-link:hover {
  background-color: var(--bg-tertiary);
  color: var(--text-primary);
}

.menu-link.active {
  color: #ffffff;
}

.sidebar-indicator {
  position: absolute;
  left: 16px;
  width: calc(100% - 32px);
  background-color: var(--brand-primary);
  transition: top 0.3s cubic-bezier(0.4, 0, 0.2, 1), height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 0;
  pointer-events: none;
}

.menu-icon {
  margin-right: 12px;
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn-link {
  color: var(--primary-color);
  text-decoration: none;
  font-weight: 500;
  transition: all 0.2s ease;
}

.btn-link:hover {
  text-decoration: underline;
  color: var(--primary-hover);
}

/* Área de Conteúdo */
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100%;
  background-color: var(--bg-primary);
}

/* Barra Superior */
.topbar {
  height: 70px;
  background-color: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
}

.topbar-title h1 {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
}

.user-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.user-details {
  text-align: right;
}

.user-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}

.user-role {
  font-size: 11px;
  color: var(--text-secondary);
}

/* Telas (Views) */
.view-container {
  flex: 1;
  padding: 32px;
  overflow-y: auto;
  position: relative;
}

.view-section {
  display: none;
}

.view-section.active {
  display: block;
  animation: fadeIn 0.3s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Cards & Layouts Comuns */
.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 24px;
  margin-bottom: 32px;
}

.card {
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 0;
  padding: 24px;
  transition: all 0.2s ease;
}

.clickable-card {
  cursor: pointer;
}

.clickable-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
  border-color: var(--brand-primary);
}

.card-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--text-secondary);
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

.card-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--text-primary);
}

/* Tabelas */
.table-container {
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 0;
  overflow: hidden;
  margin-bottom: 24px;
}

.table-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}

.table-title {
  font-size: 16px;
  font-weight: 600;
}

.custom-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}

.custom-table th {
  padding: 16px 24px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border-color);
  background-color: rgba(255, 255, 255, 0.02);
}

.custom-table td {
  padding: 16px 24px;
  font-size: 14px;
  border-bottom: 1px solid var(--border-color);
  color: var(--text-primary);
}

.custom-table tr:last-child td {
  border-bottom: none;
}

.custom-table tr:hover td {
  background-color: rgba(255, 255, 255, 0.01);
}

/* Badges de Status (Sem emojis) */
.badge {
  display: inline-block;
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  border-radius: 0;
  letter-spacing: 0.5px;
}

.badge-ativo {
  background-color: var(--status-active-bg);
  color: var(--status-active-text);
}

.badge-ferias {
  background-color: var(--status-leave-bg);
  color: var(--status-leave-text);
}

.badge-abono {
  background-color: var(--status-warning-bg);
  color: var(--status-warning-text);
}

.badge-inativo {
  background-color: var(--status-inactive-bg);
  color: var(--status-inactive-text);
}

/* Formulários */
.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 8px;
  color: var(--text-secondary);
}

.form-control {
  width: 100%;
  padding: 12px 16px;
  background-color: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  border-radius: 0;
  color: var(--text-primary);
  font-family: var(--font-family);
  font-size: 14px;
  transition: all 0.2s ease;
}

.form-control:focus {
  outline: none;
  border-color: var(--brand-primary);
  box-shadow: 0 0 0 2px rgba(0, 135, 95, 0.2);
}

/* Botões */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 12px 20px;
  font-size: 14px;
  font-weight: 600;
  border-radius: 0;
  border: none;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: var(--font-family);
  gap: 8px;
}

.btn-primary {
  background-color: var(--brand-primary);
  color: #ffffff;
}

.btn-primary:hover {
  background-color: var(--brand-primary-hover);
}

.btn-secondary {
  background-color: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border-color);
}

.btn-secondary:hover {
  background-color: var(--border-color);
}

/* Loader */
.loader-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(18, 18, 20, 0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.loader {
  border: 4px solid rgba(0, 0, 0, 0.1);
  border-left-color: var(--brand-primary);
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.spinning {
  animation: spin 1s linear infinite;
}
/* Filtros e Barra de Pesquisa */
.filter-bar {
  display: flex;
  gap: 16px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.search-input-wrapper {
  position: relative;
  flex: 1;
  min-width: 250px;
}

.search-input-wrapper input {
  padding-left: 40px;
}

.search-icon-inside {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  width: 16px;
  height: 16px;
}

.filter-select {
  width: 180px;
  background-color: var(--bg-secondary);
}

/* Modais */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: rgba(0, 0, 0, 0.75);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
  backdrop-filter: blur(4px);
}

.modal-overlay.active {
  display: flex;
}

.modal-content {
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 0;
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  animation: modalSlideUp 0.25s ease-out;
}

.modal-content.large {
  max-width: 900px;
}

@keyframes modalSlideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-title {
  font-size: 16px;
  font-weight: 600;
}

.modal-close {
  background: none;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 0;
  transition: all 0.2s ease;
}

.modal-close:hover {
  background-color: var(--bg-tertiary);
  color: var(--text-primary);
}

.modal-body {
  padding: 24px;
  flex: 1;
}

.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border-color);
  display: flex;
  justify-content: flex-end;
  gap: 12px;
}

/* Abas (Tabs) para Ficha do Servidor */
.tab-container {
  display: flex;
  border-bottom: 1px solid var(--border-color);
  margin-bottom: 24px;
}

.tab-button {
  padding: 12px 20px;
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s ease;
  font-family: var(--font-family);
}

.tab-button:hover {
  color: var(--text-primary);
}

.tab-button.active {
  color: var(--brand-primary-hover);
  border-bottom-color: var(--brand-primary);
}

.tab-panel {
  display: none;
}

.tab-panel.active {
  display: block;
}

/* Colunas de Formulário Flex */
.form-row {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}

.form-row .form-group {
  flex: 1;
  min-width: 200px;
}

/* Ícones de ação na tabela */
.action-buttons {
  display: flex;
  gap: 8px;
}

.btn-action {
  width: 32px;
  height: 32px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 0;
  border: 1px solid var(--border-color);
  background-color: var(--bg-tertiary);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn-action:hover {
  color: var(--text-primary);
  background-color: var(--border-color);
}

.btn-action.btn-delete:hover {
  background-color: rgba(247, 90, 90, 0.15);
  color: var(--status-leave-text);
  border-color: rgba(247, 90, 90, 0.3);
}

/* Layout Ficha de Servidor */
.profile-header {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 24px;
  background-color: rgba(255, 255, 255, 0.01);
  padding: 20px;
  border-radius: 0;
  border: 1px solid var(--border-color);
}

.profile-avatar-placeholder {
  width: 64px;
  height: 64px;
  border-radius: 0;
  background-color: var(--bg-tertiary);
  color: var(--brand-primary-hover);
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--border-color);
}

.profile-info h3 {
  font-size: 18px;
  font-weight: 600;
}

.profile-info p {
  font-size: 13px;
  color: var(--text-secondary);
}

/* Grid de Períodos Aquisitivos */
.periods-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.period-card {
  background-color: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  border-radius: 0;
  padding: 16px;
}

.period-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.period-title {
  font-size: 13px;
  font-weight: 700;
}

.period-dates {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

.period-status-bar {
  height: 6px;
  border-radius: 0;
  background-color: var(--bg-secondary);
  overflow: hidden;
  margin-top: 12px;
}

.period-status-fill {
  height: 100%;
  width: 0%;
}

.fill-usufruido {
  background-color: var(--status-active-text);
  width: 100%;
}

.fill-disponivel {
  background-color: var(--status-warning-text);
  width: 100%;
}

.fill-vencido {
  background-color: var(--status-leave-text);
  width: 100%;
}

.period-legend {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
}

/* Interface v3 — navegação horizontal e dashboard responsivo */
:root {
  --header-bg: #082f49;
  --header-text: #e8f3f7;
  --surface-raised: #ffffff;
  --shadow-soft: 0 12px 34px rgba(15, 23, 42, 0.07);
  --shadow-hover: 0 18px 42px rgba(15, 23, 42, 0.12);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
}

body.dark-mode {
  --header-bg: #071c26;
  --surface-raised: #1a1a1e;
  --shadow-soft: 0 14px 40px rgba(0, 0, 0, 0.2);
  --shadow-hover: 0 20px 48px rgba(0, 0, 0, 0.3);
}

body {
  overflow: hidden;
}

.app-container {
  display: grid;
  grid-template-rows: 76px minmax(0, 1fr);
  grid-template-columns: 100%;
  min-height: 100vh;
}

.app-header {
  grid-row: 1;
  display: flex;
  align-items: center;
  gap: clamp(18px, 3vw, 48px);
  min-width: 0;
  padding: 0 clamp(20px, 3vw, 52px);
  color: var(--header-text);
  background: linear-gradient(112deg, var(--header-bg), #0b3a4f);
  border-bottom: 1px solid rgba(255, 255, 255, 0.09);
  box-shadow: 0 8px 30px rgba(2, 20, 29, 0.16);
  position: relative;
  z-index: 80;
}

body.dark-mode .app-header {
  background: linear-gradient(112deg, #07171f, #0a2936);
}

.brand-block {
  display: flex;
  align-items: center;
  gap: 14px;
  flex: 0 0 auto;
}

.brand-logo {
  width: 116px;
  height: 44px;
  object-fit: contain;
}

.brand-divider {
  width: 1px;
  height: 32px;
  background: rgba(255, 255, 255, 0.2);
}

.brand-copy {
  display: flex;
  flex-direction: column;
  line-height: 1.2;
  white-space: nowrap;
}

.brand-copy strong {
  font-size: 13px;
  font-weight: 700;
}

.brand-copy span {
  margin-top: 3px;
  font-size: 10px;
  color: rgba(232, 243, 247, 0.68);
}

.desktop-navigation {
  align-self: stretch;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  flex: 1 1 auto;
  min-width: 0;
}

.desktop-navigation .menu-link {
  align-self: stretch;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 clamp(10px, 1.2vw, 18px);
  color: rgba(232, 243, 247, 0.72);
  border-radius: 0;
  font-size: 13px;
  white-space: nowrap;
}

.desktop-navigation .menu-link svg {
  width: 16px;
  height: 16px;
}

.desktop-navigation .menu-link::after {
  content: '';
  position: absolute;
  left: 18px;
  right: 18px;
  bottom: 0;
  height: 3px;
  border-radius: 3px 3px 0 0;
  background: #25c28a;
  transform: scaleX(0);
  transition: transform 220ms ease;
}

.desktop-navigation .menu-link:hover,
.desktop-navigation .menu-link.active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}

.desktop-navigation .menu-link.active::after {
  transform: scaleX(1);
}

.header-actions,
.user-info {
  display: flex;
  align-items: center;
}

.header-actions {
  gap: 8px;
  flex: 0 0 auto;
}

.header-icon-button,
.mobile-menu-button {

  height: 38px;

}

.header-icon-button:hover,
.mobile-menu-button:hover {

  transform: translateY(-1px);
}

.header-icon-button svg,
.mobile-menu-button svg {

  height: 18px;
}

.user-info {
  gap: 10px;
  margin-left: 5px;
}

.user-avatar {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;

  background: #6ee7b7;
  font-size: 12px;
  font-weight: 800;
}

.app-header .user-name { color: #ffffff; font-size: 12px; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app-header .user-role { color: rgba(232, 243, 247, 0.64); }
.mobile-menu-button { display: none; }

.main-content {
  grid-row: 2;
  min-width: 0;
  height: auto;
  overflow: hidden;
}

.topbar {
  height: auto;
  min-height: 82px;
  padding: 18px clamp(22px, 4vw, 64px);
  background: var(--bg-primary);
}

.topbar-title { display: flex; flex-direction: column; }
.topbar-title h1 { font-size: clamp(20px, 2vw, 28px); letter-spacing: -0.03em; }
.page-eyebrow { color: var(--brand-primary); font-size: 10px; font-weight: 800; letter-spacing: 0.12em; }
.topbar-context { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 12px; text-transform: capitalize; }
.topbar-context svg { width: 16px; height: 16px; color: var(--brand-primary); }

.view-container {
  padding: 4px clamp(22px, 4vw, 64px) 48px;
  scroll-behavior: smooth;
}

.view-section.active {
  animation: pageEnter 380ms cubic-bezier(.2, .8, .2, 1);
}

@keyframes pageEnter {
  from { opacity: 0; transform: translateY(10px) scale(.995); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.dashboard-welcome {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 24px;
}

.dashboard-welcome h2 { margin-top: 5px; font-size: clamp(22px, 2.2vw, 32px); letter-spacing: -0.04em; }
.dashboard-welcome p { margin-top: 4px; color: var(--text-secondary); font-size: 13px; }

.dashboard-grid {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}

.card,
.table-container,
.insight-card,
.quick-actions-card {

}

.metric-card {
  min-height: 132px;

}

.metric-card:hover { box-shadow: var(--shadow-hover); }
.metric-icon { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; }
.metric-icon svg { width: 20px; height: 20px; }
.metric-green { color: #047857; background: #d1fae5; }
.metric-red { color: #dc2626; background: #fee2e2; }
.metric-blue { color: #2563eb; background: #dbeafe; }
.metric-amber { color: #d97706; background: #fef3c7; }
body.dark-mode .metric-green { background: rgba(4, 211, 97, .12); color: #34d399; }
body.dark-mode .metric-red { background: rgba(247, 90, 90, .12); color: #fb7185; }
body.dark-mode .metric-blue { background: rgba(59, 130, 246, .13); color: #60a5fa; }
body.dark-mode .metric-amber { background: rgba(254, 180, 8, .12); color: #fbbf24; }
.metric-card .card-title { margin: 0 0 3px; }
.metric-card .card-value { line-height: 1.05; font-size: 30px; }
.metric-caption { display: block; margin-top: 7px; color: var(--text-muted); font-size: 10px; }
.metric-arrow { width: 16px; color: var(--text-muted); opacity: .7; }
.status-danger { color: var(--status-leave-text); }
.status-warning { color: var(--status-warning-text); }

.dashboard-content-grid {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(290px, .75fr);
  gap: 20px;
  align-items: start;
}

.dashboard-table-card { min-width: 0; }
.table-subtitle { display: block; margin-top: 3px; color: var(--text-muted); font-size: 11px; font-weight: 400; }
.table-scroll { overflow-x: auto; }
.text-button { display: inline-flex; align-items: center; gap: 7px; border: 0; color: var(--brand-primary); background: transparent; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
.text-button svg { width: 15px; }
.dashboard-side-column { display: grid; gap: 20px; }
.insight-card, .quick-actions-card { padding: 22px; background: var(--bg-secondary); border: 1px solid var(--border-color); }
.insight-header { display: flex; justify-content: space-between; align-items: flex-start; }
.insight-header h3 { margin-top: 4px; font-size: 15px; }
.insight-header > svg { width: 18px; color: var(--text-muted); }
.donut-wrap { display: grid; place-items: center; padding: 20px 0 14px; }
.dashboard-donut {
  --attention-percent: 0%;
  width: 142px;
  height: 142px;
  padding: 15px;
  border-radius: 50%;
  background: conic-gradient(#f59e0b 0 var(--attention-percent), var(--brand-primary) var(--attention-percent) 100%);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.2);
}
.dashboard-donut > div { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 50%; background: var(--bg-secondary); }
.dashboard-donut strong { font-size: 27px; line-height: 1; }
.dashboard-donut span { margin-top: 5px; color: var(--text-muted); font-size: 10px; }
.donut-legend { display: flex; justify-content: space-between; gap: 12px; padding-top: 14px; border-top: 1px solid var(--border-color); }
.donut-legend span { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 10px; }
.donut-legend strong { margin-left: auto; color: var(--text-primary); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }
.active-dot { background: var(--brand-primary); }
.alert-dot { background: #f59e0b; }
.quick-actions-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-top: 16px; }
.quick-actions-grid button { min-height: 70px; padding: 12px 9px; border: 1px solid var(--border-color); border-radius: 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; color: var(--text-primary); background: var(--bg-tertiary); font: inherit; font-size: 10px; font-weight: 650; text-align: left; cursor: pointer; transition: 180ms ease; }
.quick-actions-grid button:hover { color: var(--brand-primary); border-color: var(--brand-primary); transform: translateY(-2px); }
.quick-actions-grid svg { width: 18px; }

.smart-dashboard-card {
  min-height: 440px;
  padding: 22px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-soft);
  display: flex;
  flex-direction: column;
}

#view-dashboard { position: relative; isolation: isolate; }
#view-dashboard::before {
  content: '';
  position: absolute;
  z-index: -1;
  inset: -90px calc(clamp(22px, 4vw, 64px) * -1) -48px;
  pointer-events: none;
  background:
    radial-gradient(circle at 2% 32%, color-mix(in srgb, var(--brand-primary) 18%, transparent), transparent 31%),
    radial-gradient(circle at 88% 15%, color-mix(in srgb, var(--brand-primary) 14%, transparent), transparent 34%);
}

body.dark-mode #view-dashboard .metric-card,
body.dark-mode #view-dashboard .dashboard-table-card,
body.dark-mode #view-dashboard .smart-dashboard-card {
  background: linear-gradient(145deg, rgba(28, 31, 35, .94), rgba(21, 24, 28, .88));
  border-color: rgba(255, 255, 255, .12);
  box-shadow: 0 18px 46px rgba(0, 0, 0, .18), inset 0 1px 0 rgba(255, 255, 255, .025);
  backdrop-filter: blur(14px);
}

.smart-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding-bottom: 17px;
  border-bottom: 1px solid var(--border-color);
}

.smart-card-header h3 { margin-top: 4px; font-size: 16px; }
.smart-card-header-actions { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
.smart-card-icon { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: var(--brand-primary); background: color-mix(in srgb, var(--brand-primary) 12%, transparent); }
.smart-card-icon svg { width: 18px; height: 18px; }
.smart-card-dismiss { width: 30px; height: 30px; padding: 0; border: 1px solid var(--border-color); border-radius: 9px; color: var(--text-secondary); background: transparent; cursor: pointer; place-items: center; transition: 180ms ease; }
.smart-card-dismiss:hover { color: var(--text-primary); border-color: var(--brand-primary); background: color-mix(in srgb, var(--brand-primary) 10%, transparent); }
.smart-card-dismiss svg { width: 15px; height: 15px; }
.dashboard-location-state, .dashboard-ai-alert-state { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.location-chart-summary { display: flex; align-items: baseline; gap: 8px; padding: 18px 0 13px; }
.location-chart-summary strong { font-size: 26px; line-height: 1; }
.location-chart-summary span { color: var(--text-muted); font-size: 10px; }
.location-pie-layout { flex: 1; display: grid; grid-template-columns: minmax(124px, .82fr) minmax(138px, 1.18fr); align-items: center; gap: 18px; min-height: 240px; padding: 4px 0 18px; }
.location-pie { width: min(100%, 174px); aspect-ratio: 1; justify-self: center; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.16), 0 18px 38px rgba(2,18,25,.16); transform: rotate(-2deg); animation: revealLocationPie 650ms cubic-bezier(.2,.8,.2,1) both; }
.location-pie-legend { display: grid; align-content: center; gap: 9px; min-width: 0; }
.location-pie-legend-row { display: grid; grid-template-columns: 9px minmax(0, 1fr) auto 30px; align-items: center; gap: 7px; min-width: 0; color: var(--text-secondary); font-size: 9px; }
.location-pie-dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 8%, transparent); }
.location-pie-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.location-pie-legend-row strong { color: var(--text-primary); font-size: 10px; text-align: right; }
.location-pie-legend-row small { color: var(--text-muted); font-size: 8px; text-align: right; }
@keyframes revealLocationPie { from { opacity: 0; transform: rotate(-28deg) scale(.86); } to { opacity: 1; transform: rotate(-2deg) scale(1); } }
.smart-card-footer { margin-top: auto; padding-top: 15px; border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--text-muted); font-size: 9px; }
.dashboard-ai-alert-state { padding-top: 18px; }
.ai-alert-summary { max-height: 315px; overflow-y: auto; padding: 15px; color: var(--text-primary); background: color-mix(in srgb, var(--status-warning-bg) 68%, transparent); border: 1px solid color-mix(in srgb, var(--status-warning-text) 24%, transparent); border-radius: 13px; font-size: 12px; line-height: 1.65; }
.ai-alert-summary strong { color: var(--status-warning-text); }
.smart-dashboard-card.has-alerts .smart-card-icon { color: var(--status-warning-text); background: var(--status-warning-bg); animation: alertPulse 2.2s ease-in-out infinite; }
.smart-dashboard-card.has-alerts .page-eyebrow { color: var(--status-warning-text); }
.smart-dashboard-card.has-briefing .smart-card-icon { color: #34d399; background: rgba(16, 185, 129, .13); }
.smart-dashboard-card.has-briefing .page-eyebrow { color: #34d399; }
.smart-dashboard-card.has-briefing .ai-alert-summary { background: rgba(16, 185, 129, .07); border-color: rgba(52, 211, 153, .2); }
.smart-dashboard-card.has-briefing .ai-alert-summary strong { color: #6ee7b7; }
@keyframes alertPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0); } 50% { box-shadow: 0 0 0 7px rgba(245,158,11,.10); } }
.location-chart-empty { flex: 1; display: grid; place-items: center; color: var(--text-muted); font-size: 11px; text-align: center; }
.empty-state-cell { height: 190px; text-align: center !important; color: var(--text-muted) !important; }
.empty-state-cell svg, .empty-state-cell strong, .empty-state-cell small { display: block; margin: 0 auto; }
.empty-state-cell svg { width: 26px; height: 26px; margin-bottom: 9px; color: var(--brand-primary); }
.empty-state-cell strong { color: var(--text-primary); }
.empty-state-cell small { margin-top: 3px; font-weight: 400; }

.btn, .form-control, .badge, .btn-action, .modal-close { border-radius: var(--radius-sm); }
.btn:hover { transform: translateY(-1px); box-shadow: 0 7px 18px rgba(0, 135, 95, .16); }
.table-container { overflow: hidden; }
.custom-table th { padding: 14px 20px; font-size: 10px; }
.custom-table td { padding: 15px 20px; font-size: 12px; }
.custom-table tbody tr { transition: background 160ms ease; }
.modal-content { border-radius: var(--radius-lg); box-shadow: 0 28px 80px rgba(0,0,0,.28); }

.mobile-drawer,
.mobile-drawer-backdrop { display: none; }

@media (max-width: 1280px) {
  .app-header .brand-copy, .app-header .brand-divider { display: none; }
  .desktop-navigation .menu-link { padding: 0 10px; }
  .desktop-navigation .menu-link svg { display: none; }
  .app-header .user-details { display: none; }
  .dashboard-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 920px) {
  .app-container { grid-template-rows: 66px minmax(0, 1fr); }
  .app-header { padding: 0 18px; justify-content: space-between; }
  .brand-logo { width: 103px; height: 39px; }
  .desktop-navigation, .app-header .user-info { display: none; }
  .mobile-menu-button { display: inline-flex; }
  .topbar { min-height: 72px; padding: 14px 20px; }
  .topbar-context { display: none; }
  .view-container { padding: 4px 18px 34px; }
  .dashboard-content-grid { grid-template-columns: 1fr; }
  .dashboard-side-column { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mobile-drawer-backdrop { display: block; position: fixed; inset: 0; z-index: 190; background: rgba(1, 10, 14, .58); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity 220ms ease; }
  .mobile-drawer-backdrop.active { opacity: 1; pointer-events: auto; }
  .mobile-drawer { display: flex; flex-direction: column; position: fixed; top: 0; right: 0; bottom: 0; z-index: 200; width: min(86vw, 340px); padding: 20px; color: #fff; background: linear-gradient(155deg, #071c26, #0b3545); box-shadow: -20px 0 60px rgba(0,0,0,.35); transform: translateX(105%); transition: transform 280ms cubic-bezier(.2,.8,.2,1); }
  .mobile-drawer.active { transform: translateX(0); }
  .mobile-drawer-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,.1); }
  .mobile-drawer .brand-copy { display: flex; }
  .mobile-navigation { display: grid; gap: 7px; padding-top: 20px; }
  .mobile-navigation .menu-link { display: flex; align-items: center; gap: 13px; min-height: 49px; padding: 0 15px; color: rgba(255,255,255,.73); border-radius: 12px; }
  .mobile-navigation .menu-link svg { width: 18px; }
  .mobile-navigation .menu-link:hover, .mobile-navigation .menu-link.active { color: #fff; background: rgba(37,194,138,.16); }
}

@media (max-width: 620px) {
  .header-actions .header-icon-button:first-child { display: none; }
  .dashboard-welcome { align-items: flex-start; flex-direction: column; }
  .dashboard-welcome .btn { width: 100%; }
  .dashboard-grid { grid-template-columns: 1fr; }
  .metric-card { min-height: 112px; }
  .dashboard-side-column { grid-template-columns: 1fr; }
  .filter-bar { gap: 10px; }
  .search-input-wrapper, .filter-select { width: 100%; min-width: 100%; }
  .table-header { padding: 17px; }
  .table-header .btn { width: 100%; }
  .custom-table th, .custom-table td { padding: 13px 15px; white-space: nowrap; }
  .form-row { display: block; }
  .modal-overlay { align-items: flex-end; }
  .modal-content, .modal-content.large { max-height: 94vh; border-radius: 20px 20px 0 0; }
  .tab-container { overflow-x: auto; }
  .tab-button { white-space: nowrap; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* Regras de Impressão */
@media print {
  body {
    background-color: #fff !important;
    color: #000 !important;
  }
  
  .app-container {
    display: none !important;
  }
  
  .modal-overlay {
    display: none !important;
  }
  
  .modal-overlay#modal-folha-protocolo,
  .modal-overlay#modal-relatorio-impressao {
    display: block !important;
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: auto !important;
    background-color: transparent !important;
    backdrop-filter: none !important;
    z-index: auto !important;
    padding: 0 !important;
  }
  
  .modal-overlay#modal-folha-protocolo .modal-content,
  .modal-overlay#modal-relatorio-impressao .modal-content {
    border: none !important;
    box-shadow: none !important;
    max-width: 100% !important;
    width: 100% !important;
    height: auto !important;
    overflow: visible !important;
    background-color: #fff !important;
    color: #000 !important;
  }
  
  .modal-overlay#modal-folha-protocolo .modal-body,
  .modal-overlay#modal-relatorio-impressao .modal-body {
    padding: 0 !important;
  }
  
  .modal-header, .btn, .modal-close {
    display: none !important;
  }
  
  #print-area-protocolo, #print-area-relatorio {
    border: none !important;
    padding: 0 !important;
  }
}

/* Toast Notifications */
.toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 12px; z-index: 10000; }
.toast { background-color: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-color); padding: 16px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 12px; min-width: 300px; max-width: 400px; animation: toastEnter 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.toast.toast-success { border-left: 4px solid var(--success-color); }
.toast.toast-error { border-left: 4px solid var(--danger-color); }
.toast.toast-warning { border-left: 4px solid var(--warning-color); }
.toast.toast-leaving { animation: toastLeave 0.3s forwards ease-in; }
@keyframes toastEnter { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes toastLeave { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
.toast-icon { display: flex; align-items: center; justify-content: center; }
.toast-content { flex: 1; font-size: 14px; }
/* Sync Status Bar */
.sync-bar { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 6px 16px; font-size: 12px; font-weight: 500; letter-spacing: 0.02em; z-index: 50; }
.sync-bar.sync-offline { background: linear-gradient(90deg, #dc262620, #dc262610); color: #f87171; border-bottom: 1px solid #dc262630; }
.sync-bar.sync-busy { background: linear-gradient(90deg, #3b82f620, #3b82f610); color: #60a5fa; border-bottom: 1px solid #3b82f630; }
.sync-bar.sync-pending { background: linear-gradient(90deg, #f59e0b20, #f59e0b10); color: #fbbf24; border-bottom: 1px solid #f59e0b30; }
.sync-spinner { width: 12px; height: 12px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
/* Detailed Sync Status Box - CNN Ticker Style */
.sync-detailed-status {
  display: flex;
  align-items: center;
  width: 0px;
  opacity: 0;
  padding: 0;
  border-width: 0;
  overflow: hidden;
  transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  white-space: nowrap;
  
  font-size: 11px;
  color: #a5f3fc;
  background: rgba(255, 255, 255, 0.08);
  border: 0px solid rgba(255, 255, 255, 0.15);
  height: 38px;
  margin-right: 0;
  border-radius: 8px;
  font-weight: 500;
}

.sync-detailed-status.show {
  width: 260px;
  opacity: 1;
  padding: 0 10px;
  border-width: 1px;
  margin-right: 8px;
}

.sync-ticker-wrapper {
  overflow: hidden;
  width: 100%;
  display: flex;
  align-items: center;
  -webkit-mask-image: linear-gradient(to right, transparent, black 8px, black calc(100% - 8px), transparent);
  mask-image: linear-gradient(to right, transparent, black 8px, black calc(100% - 8px), transparent);
}

.sync-ticker-content {
  display: inline-flex;
  align-items: center;
  white-space: nowrap;
  will-change: transform;
  /* Animates from right to left constantly */
  padding-left: 100%;
  animation: ticker-slide 10s linear infinite;
}

.sync-ticker-content .sync-spinner {
  width: 10px;
  height: 10px;
  border-width: 1.5px;
  border-top-color: transparent;
  margin-right: 6px;
  flex-shrink: 0;
}

@keyframes ticker-slide {
  0% { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}

/* =========================================
   WIDGET IA ENTIDADE (CHAT)
   ========================================= */
.entidade-widget {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 16px;
}

.entidade-fab {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--brand-primary), #6366f1);
  color: white;
  border: none;
  box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: transform 0.2s, box-shadow 0.2s;
  animation: pulse-fab 2s infinite;
}

@keyframes pulse-fab {
  0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
  70% { box-shadow: 0 0 0 10px rgba(99, 102, 241, 0); }
  100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
}

.entidade-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 16px rgba(99, 102, 241, 0.5);
}

.entidade-fab-icon {
  width: 24px;
  height: 24px;
}

.entidade-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  background: #ef4444;
  color: white;
  font-size: 11px;
  font-weight: bold;
  border-radius: 50%;
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-primary);
  animation: bounce-badge 1s infinite alternate;
}

@keyframes bounce-badge {
  from { transform: translateY(0); }
  to { transform: translateY(-3px); }
}

.entidade-chat-window {
  width: 360px;
  height: 480px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transform-origin: bottom right;
  animation: chat-open 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

@keyframes chat-open {
  from { opacity: 0; transform: scale(0.8) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.entidade-header {
  padding: 16px;
  background: rgba(255, 255, 255, 0.03);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.entidade-title {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-primary);
  font-size: 15px;
}

.entidade-status {
  font-size: 11px;
  color: #10b981;
  background: rgba(16, 185, 129, 0.1);
  padding: 2px 8px;
  border-radius: 12px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 4px;
}
.entidade-status.thinking {
  color: #f59e0b;
  background: rgba(245, 158, 11, 0.1);
}

.entidade-close {
  background: none;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  padding: 4px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.entidade-close:hover {
  background: rgba(255, 255, 255, 0.1);
  color: var(--text-primary);
}

.entidade-messages {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.entidade-msg {
  max-width: 85%;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.5;
  word-wrap: break-word;
  animation: msg-in 0.2s ease-out;
}

@keyframes msg-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.entidade-msg.ia {
  background: rgba(99, 102, 241, 0.1);
  border: 1px solid rgba(99, 102, 241, 0.2);
  color: var(--text-primary);
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}

.entidade-proposta { display: flex; flex-direction: column; gap: 8px; border-color: rgba(52, 211, 153, .34) !important; background: rgba(16, 185, 129, .08) !important; }
.entidade-proposta > span { color: var(--text-secondary); font-size: 11px; }
.entidade-proposta p { margin: 0; color: var(--text-secondary); font-size: 11px; }
.entidade-proposta-change { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 7px; padding: 9px; border: 1px solid rgba(255,255,255,.11); border-radius: 9px; background: rgba(0,0,0,.12); font-size: 11px; }
.entidade-proposta-change small { grid-column: 1 / -1; color: var(--text-muted); font-weight: 700; text-transform: uppercase; font-size: 9px; }
.entidade-proposta-change del { color: #fca5a5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entidade-proposta-change ins { color: #6ee7b7; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entidade-proposta-change svg { width: 13px; color: var(--text-muted); }
.entidade-proposta-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.entidade-proposta-actions .btn { padding: 7px 10px; font-size: 11px; }
.entidade-proposta.confirmada { border-color: rgba(52, 211, 153, .38) !important; }
.entidade-proposta-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
.entidade-proposta-fields > div { min-width: 0; padding: 8px; border: 1px solid rgba(255,255,255,.09); border-radius: 8px; background: rgba(0,0,0,.12); }
.entidade-proposta-fields small { display: block; margin-bottom: 2px; color: var(--text-muted); font-size: 9px; text-transform: uppercase; }
.entidade-proposta-fields strong { display: block; overflow: hidden; color: var(--text-primary); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }

.entidade-msg.user {
  background: var(--brand-primary);
  color: white;
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}

.entidade-msg.system-error {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: #ef4444;
  align-self: center;
  text-align: center;
  font-size: 12px;
}

.entidade-chips {
  padding: 10px 16px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.entidade-chips::-webkit-scrollbar {
  display: none;
}

.entidade-chip {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  padding: 6px 12px;
  border-radius: 16px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}

.entidade-chip:hover {
  background: rgba(99, 102, 241, 0.1);
  border-color: rgba(99, 102, 241, 0.3);
  color: #818cf8;
}

.entidade-input-area {
  padding: 12px 16px;
  background: var(--bg-tertiary);
  border-top: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  gap: 8px;
}

.entidade-input-area input {
  flex: 1;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  padding: 10px 14px;
  border-radius: 20px;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}

.entidade-input-area input:focus {
  border-color: var(--brand-primary);
}

.entidade-input-area button {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--brand-primary);
  color: white;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.2s, background-color 0.2s;
}
.entidade-input-area button:disabled {
  background: var(--border-color);
  color: var(--text-muted);
  cursor: not-allowed;
}
.entidade-input-area button:not(:disabled):hover {
  transform: scale(1.05);
  background: #4f46e5;
}

/* Renderização de Markdown no chat */
.entidade-msg.ia p { margin-bottom: 8px; }
.entidade-msg.ia p:last-child { margin-bottom: 0; }
.entidade-msg.ia strong { color: #818cf8; }
.entidade-msg.ia ul { padding-left: 16px; margin: 8px 0; }
.entidade-msg.ia li { margin-bottom: 4px; }

.entidade-feedback { display: flex; align-items: center; gap: 6px; margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(129, 140, 248, .16); color: var(--text-muted); font-size: 9px; }
.entidade-feedback > span:first-child { margin-right: auto; }
.entidade-feedback button { width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid var(--border-color); border-radius: 7px; color: var(--text-muted); background: transparent; cursor: pointer; }
.entidade-feedback button:hover { color: #818cf8; border-color: #818cf8; }
.entidade-feedback button svg { width: 12px; height: 12px; }
.entidade-feedback.avaliado { color: var(--status-active-text); }

/* Animação piscadinha (wink) no botão da Entidade */
@keyframes fab-wink {
  0%, 80%, 100% { transform: scale(1) rotate(0deg); }
  85% { transform: scale(1.15) rotate(-15deg); }
  90% { transform: scale(1.15) rotate(15deg); }
  95% { transform: scale(1.05) rotate(0deg); }
}
.entidade-fab.wink {
  animation: fab-wink 1.2s ease-in-out !important;
}

/* Customização do Ticker de Status para Insights da Entidade */
.sync-detailed-status.entidade-insight {
  background: rgba(99, 102, 241, 0.12) !important;
  border: 1px solid rgba(99, 102, 241, 0.3) !important;
  color: #a5b4fc !important;
  cursor: pointer;
  max-width: 420px;
}

.entidade-input-area .entidade-attach { width: 38px; height: 38px; flex: 0 0 auto; display: grid; place-items: center; border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-secondary); background: transparent; cursor: pointer; transition: 180ms ease; }
.entidade-input-area .entidade-attach:not(:disabled):hover { color: var(--brand-primary); border-color: var(--brand-primary); background: color-mix(in srgb, var(--brand-primary) 10%, transparent); transform: none; }
.entidade-file-preview { margin: 0 14px 8px; padding: 8px 9px; display: flex; align-items: center; gap: 7px; border: 1px solid rgba(99, 102, 241, .32); border-radius: 9px; color: var(--text-secondary); background: rgba(99, 102, 241, .08); font-size: 11px; }
.entidade-file-preview > svg { width: 15px; height: 15px; color: #a5b4fc; flex: 0 0 auto; }
.entidade-file-preview > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entidade-file-preview button { margin-left: auto; padding: 2px; border: 0; color: var(--text-secondary); background: transparent; cursor: pointer; }
.entidade-file-preview button:hover { color: var(--text-primary); }
.entidade-file-preview button svg { width: 14px; height: 14px; }
.sync-detailed-status.entidade-insight.show {
  width: min(420px, calc(100vw - 180px));
}
.sync-detailed-status.entidade-insight:hover {
  background: rgba(99, 102, 241, 0.2) !important;
  border-color: rgba(99, 102, 241, 0.5) !important;
}
.sync-detailed-status.entidade-insight .sync-ticker-content {
  width: max-content;
  min-width: max-content !important;
  flex: 0 0 auto;
  padding-left: 100%;
  animation: entidade-ticker-slide var(--entidade-ticker-duration, 24s) linear 1 forwards !important;
}

@keyframes entidade-ticker-slide {
  from { transform: translate3d(0, 0, 0); }
  to { transform: translate3d(-100%, 0, 0); }
}

/* Animação de rotação 360 graus para a Entidade */
@keyframes fab-rotate {
  0% { transform: scale(1) rotate(0deg); }
  100% { transform: scale(1) rotate(360deg); }
}
.entidade-fab.rotate {
  animation: fab-rotate 0.6s cubic-bezier(0.4, 0, 0.2, 1) !important;
}

/* Convite da Entidade: o fantasma só surge quando existe um aviso pendente. */
.entidade-convite-button {
  width: 100%;
  min-height: 34px;
  margin-top: 9px;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px solid rgba(129, 140, 248, .45);
  border-radius: 10px;
  color: #c7d2fe;
  background: rgba(99, 102, 241, .10);
  font: inherit;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: 180ms ease;
}
.entidade-convite-button:hover { color: #fff; border-color: #818cf8; background: rgba(99, 102, 241, .20); }
.entidade-convite-button svg { width: 14px; height: 14px; }

.entidade-fab {
  width: 52px;
  height: 58px;
  padding: 0;
  border: 0;
  border-radius: 0;
  color: #a5b4fc;
  background: transparent;
  box-shadow: none;
  display: grid;
  place-items: center;
  animation: ghost-arrive .7s cubic-bezier(.2, .9, .25, 1) both;
}
.entidade-fab:hover { transform: scale(1.08); background: transparent; box-shadow: none; color: #e0e7ff; }
.entidade-fab svg { width: 38px; height: 38px; filter: drop-shadow(0 7px 10px rgba(99, 102, 241, .38)); }
.entidade-fab.has-notification { animation: ghost-arrive .7s cubic-bezier(.2, .9, .25, 1) both, ghost-float 3.6s ease-in-out .7s infinite; }
.entidade-fab.chat-open { animation: ghost-arrive .6s cubic-bezier(.2, .9, .25, 1) both, ghost-float 4.2s ease-in-out .6s infinite; }
.entidade-fab.leaving { animation: ghost-depart .42s ease-in forwards !important; pointer-events: none; }
.entidade-fab.rotate { animation: ghost-signal .62s ease-in-out !important; }
.entidade-badge { display: none !important; }

@keyframes ghost-arrive {
  0% { opacity: 0; transform: translate(38px, 32px) rotate(8deg) scale(.72); }
  65% { opacity: 1; transform: translate(-4px, -5px) rotate(-3deg) scale(1.04); }
  100% { opacity: 1; transform: translate(0, 0) rotate(0) scale(1); }
}
@keyframes ghost-float {
  0%, 100% { transform: translate(0, 0) rotate(-2deg); }
  45% { transform: translate(-5px, -9px) rotate(2deg); }
  70% { transform: translate(2px, -4px) rotate(-1deg); }
}
@keyframes ghost-signal {
  0% { transform: translate(20px, 15px) rotate(6deg) scale(.88); }
  55% { transform: translate(-3px, -8px) rotate(-5deg) scale(1.12); }
  100% { transform: translate(0, 0) rotate(0) scale(1); }
}
@keyframes ghost-depart {
  from { opacity: 1; transform: translate(0, 0) rotate(0) scale(1); }
  to { opacity: 0; transform: translate(30px, 24px) rotate(8deg) scale(.76); }
}

/* Movimento contínuo: o fantasma desliza, sem giros ou pulsos bruscos. */
.entidade-fab.has-notification,
.entidade-fab.chat-open { animation: ghost-float-smooth 4.6s ease-in-out infinite; }
.entidade-fab.enter-left { animation: ghost-enter-left .56s cubic-bezier(.22, .78, .28, 1) both !important; }
.entidade-fab.enter-right { animation: ghost-enter-right .56s cubic-bezier(.22, .78, .28, 1) both !important; }
.entidade-fab.leaving.exit-left { animation: ghost-exit-left .62s cubic-bezier(.55, 0, .8, .28) both !important; }
.entidade-fab.leaving.exit-right { animation: ghost-exit-right .62s cubic-bezier(.55, 0, .8, .28) both !important; }
.entidade-fab.rotate { animation: ghost-float-smooth 4.6s ease-in-out infinite !important; }

@keyframes ghost-float-smooth {
  0%, 100% { transform: translate3d(0, 0, 0); }
  50% { transform: translate3d(0, -7px, 0); }
}
@keyframes ghost-enter-left {
  from { opacity: 0; transform: translate3d(-72px, 16px, 0); }
  to { opacity: 1; transform: translate3d(0, 0, 0); }
}
@keyframes ghost-enter-right {
  from { opacity: 0; transform: translate3d(72px, 16px, 0); }
  to { opacity: 1; transform: translate3d(0, 0, 0); }
}
@keyframes ghost-exit-left {
  from { opacity: 1; transform: translate3d(0, 0, 0); }
  to { opacity: 0; transform: translate3d(-84px, 20px, 0); }
}
@keyframes ghost-exit-right {
  from { opacity: 1; transform: translate3d(0, 0, 0); }
  to { opacity: 0; transform: translate3d(84px, 20px, 0); }
}

/* Cabeçalho responsivo: o ticker cede espaço antes dos controles e nunca cobre o menu. */
.app-header {
  gap: clamp(10px, 1.5vw, 24px);
}

.desktop-navigation {
  overflow-x: auto;
  scrollbar-width: none;
}
.desktop-navigation::-webkit-scrollbar {
  display: none;
}

.desktop-navigation .menu-link {
  flex: 0 0 auto;
  min-width: 0;
  padding: 0 clamp(6px, 0.9vw, 14px);
}

.header-actions {
  min-width: 0;
  max-width: 46vw;
}

.header-actions > .header-icon-button,
.header-actions > .mobile-menu-button,
.header-actions > .user-info {
  flex: 0 0 auto;
}

.sync-detailed-status {
  min-width: 0;
  max-width: 0;
  flex: 0 1 0;
}

.sync-detailed-status.show {
  width: clamp(150px, 14vw, 260px);
  max-width: 260px;
  flex-basis: clamp(150px, 14vw, 260px);
  margin-right: 0;
}

.sync-detailed-status.entidade-insight.show {
  width: clamp(180px, 20vw, 340px);
  max-width: 340px;
  flex-basis: clamp(180px, 20vw, 340px);
}

.sync-ticker-wrapper,
.sync-ticker-content {
  min-width: 0;
}

@media (max-width: 1920px) {
  .app-header .brand-copy,
  .app-header .brand-divider { display: none; }
}

@media (max-width: 1500px) {
  .desktop-navigation .menu-link {
    padding-left: 6px;
    padding-right: 6px;
    font-size: 11px;
    gap: 4px;
  }
  .sync-detailed-status.entidade-insight.show {
    width: clamp(170px, 18vw, 280px);
    max-width: 280px;
    flex-basis: clamp(170px, 18vw, 280px);
  }
}

@media (max-width: 1100px) and (min-width: 921px) {
  .app-header { padding-left: 16px; padding-right: 16px; }
  .desktop-navigation .menu-link { font-size: 11px; padding-left: 6px; padding-right: 6px; }
  .sync-detailed-status.show,
  .sync-detailed-status.entidade-insight.show {
    width: 150px;
    max-width: 150px;
    flex-basis: 150px;
  }
}

@media (max-width: 920px) {
  .app-container:has(.sync-detailed-status.show) {
    grid-template-rows: 108px minmax(0, 1fr);
  }

  .app-header:has(.sync-detailed-status.show) {
    align-items: flex-start;
    padding-top: 13px;
  }

  .header-actions {
    flex: 1 1 auto;
    justify-content: flex-end;
    max-width: calc(100% - 115px);
    overflow: visible;
  }

  .mobile-menu-button {
    display: inline-flex !important;
    visibility: visible !important;
    position: relative;
    z-index: 2;
  }

  .sync-detailed-status.show,
  .sync-detailed-status.entidade-insight.show {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 6px;
    width: auto;
    max-width: none;
    height: 32px;
    flex: none;
    margin: 0;
  }
}

@media (max-width: 620px) {
  .app-header { gap: 8px; padding-left: 12px; padding-right: 12px; }
  .brand-logo { width: 92px; }
  .header-actions { max-width: calc(100% - 100px); }
  .header-actions > button[aria-label="Sincronizar dados"] { display: none; }
  .sync-detailed-status.show,
  .sync-detailed-status.entidade-insight.show {
    max-width: none;
    min-width: 0;
    flex: none;
    padding-left: 7px;
    padding-right: 7px;
  }
}

@media (max-width: 430px) {
  .brand-logo { width: 80px; }
  .header-actions { max-width: calc(100% - 88px); }
  .header-actions > button[aria-label="Alternar tema"] { display: none; }
  .location-pie-layout { grid-template-columns: 1fr; gap: 13px; min-height: 0; }
  .location-pie { width: 130px; }
}

/* Paleta Stitch para o tema escuro do painel executivo. */
body.dark-mode {
  --bg-primary: #0f1213;
  --bg-secondary: #191c1e;
  --bg-tertiary: #25292b;
  --border-color: rgba(231, 255, 246, .13);
  --text-primary: #f0f4f2;
  --text-secondary: #a9b1ae;
  --text-muted: #7f8a86;
  --brand-primary: #10b981;
  --brand-primary-hover: #059669;
  --header-bg: #062b38;
}

body.dark-mode .main-content {
  position: relative;
  isolation: isolate;
  background: linear-gradient(135deg, #101314 12%, #111516 55%, #0c1513 100%);
}

body.dark-mode .main-content::before,
body.dark-mode .main-content::after {
  content: '';
  position: absolute;
  z-index: 0;
  width: 62vw;
  height: 68vh;
  border-radius: 50%;
  pointer-events: none;
  will-change: transform, opacity;
}

body.dark-mode .main-content::before {
  left: -27vw;
  top: 8vh;
  background: radial-gradient(circle, rgba(2, 190, 129, .24), rgba(0, 151, 105, .08) 42%, transparent 70%);
  animation: ambientGlowLeft 26s ease-in-out infinite alternate;
}

body.dark-mode .main-content::after {
  right: -24vw;
  top: -11vh;
  background: radial-gradient(circle, rgba(4, 150, 112, .2), rgba(5, 95, 86, .07) 45%, transparent 72%);
  animation: ambientGlowRight 32s ease-in-out infinite alternate;
}

body.dark-mode .main-content > * {
  position: relative;
  z-index: 1;
}

body.dark-mode #view-dashboard::before {
  display: none;
}

@keyframes ambientGlowLeft {
  0% { transform: translate3d(0, 0, 0) scale(1); opacity: .72; }
  50% { transform: translate3d(6vw, -3vh, 0) scale(1.08); opacity: .9; }
  100% { transform: translate3d(3vw, 7vh, 0) scale(.96); opacity: .68; }
}

@keyframes ambientGlowRight {
  0% { transform: translate3d(0, 0, 0) scale(.96); opacity: .62; }
  50% { transform: translate3d(-5vw, 7vh, 0) scale(1.06); opacity: .84; }
  100% { transform: translate3d(-2vw, -2vh, 0) scale(1); opacity: .68; }
}

body.dark-mode .topbar {
  background: linear-gradient(180deg, rgba(9, 14, 15, .9), rgba(13, 18, 19, .62));
