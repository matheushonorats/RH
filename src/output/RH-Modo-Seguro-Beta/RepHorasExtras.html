<script>
let referenciasRelatorioMensalHeRep_ = null;
let relatorioMensalHeCarregando_ = false;
let dadosRelatorioMensalHeAtual_ = null;
let desmarcadosRelatorioMensalHeRep_ = new Set();
let competenciaSelecaoRelatorioHeRep_ = '';

function obterChaveLinhaRelatorioHe_(item) {
  return String(normalizarPisRep(item && item.pis) || (item && item.matricula) || '').trim();
}

function obterCheckboxesSelecaoRelatorioHe_() {
  if (typeof document === 'undefined' || typeof document.querySelectorAll !== 'function') return [];
  return Array.from(document.querySelectorAll('#rep-he-previa input[data-rep-he-check]'));
}

function atualizarSelecaoRelatorioHe_() {
  const checks = obterCheckboxesSelecaoRelatorioHe_();
  const dados = dadosRelatorioMensalHeAtual_;
  if (!dados) return;
  const marcados = new Set();
  checks.forEach(function(input) {
    const chave = String(input.value || '').trim();
    if (!chave) return;
    if (input.checked) {
      desmarcadosRelatorioMensalHeRep_.delete(chave);
      marcados.add(chave);
    } else {
      desmarcadosRelatorioMensalHeRep_.add(chave);
    }
  });
  const linhasSelecionadas = checks.length
    ? (dados.linhas || []).filter(item => marcados.has(obterChaveLinhaRelatorioHe_(item)))
    : (dados.linhas || []).filter(item => !desmarcadosRelatorioMensalHeRep_.has(obterChaveLinhaRelatorioHe_(item)));
  const totalMinutos = linhasSelecionadas.reduce((soma, item) => soma + Number(item.minutos || 0), 0);

  const checkAll = typeof document !== 'undefined' && typeof document.getElementById === 'function'
    ? document.getElementById('rep-he-check-all')
    : null;
  if (checkAll && checks.length) {
    checkAll.checked = marcados.size === checks.length;
    checkAll.indeterminate = marcados.size > 0 && marcados.size < checks.length;
  }

  const resumo = typeof document !== 'undefined' && typeof document.getElementById === 'function'
    ? document.getElementById('rep-he-resumo-selecao')
    : null;
  if (resumo) {
    resumo.textContent = `${dados.rotulo} · ${linhasSelecionadas.length} de ${(dados.linhas || []).length} servidor(es) selecionado(s) · ${minutosParaHoraRep_(totalMinutos)} horas`;
  }
  definirBotoesRelatorioHe_(linhasSelecionadas.length > 0);
}

function marcarTodosRelatorioHe_(master) {
  const marcar = Boolean(master && master.checked);
  const checks = obterCheckboxesSelecaoRelatorioHe_();
  checks.forEach(function(input) {
    input.checked = marcar;
  });
  atualizarSelecaoRelatorioHe_();
}

function filtrarSelecionadosRelatorioMensalHeRep_(dados) {
  if (!dados || !Array.isArray(dados.linhas)) return dados;
  const checks = obterCheckboxesSelecaoRelatorioHe_();
  if (!checks.length && !desmarcadosRelatorioMensalHeRep_.size) return dados;
  const marcados = checks.length
    ? new Set(checks.filter(input => input.checked).map(input => String(input.value || '').trim()))
    : null;
  const linhas = dados.linhas.filter(item => {
    const chave = obterChaveLinhaRelatorioHe_(item);
    return marcados ? marcados.has(chave) : !desmarcadosRelatorioMensalHeRep_.has(chave);
  });
  const totalMinutos = linhas.reduce((total, item) => total + Number(item.minutos || 0), 0);
  return { ...dados, linhas, totalMinutos };
}

function normalizarVinculoRelatorioHe_(valor) {
  return String(valor || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
}

function montarRelatorioMensalHeRep_(servidores, competencia, referencias) {
  if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(String(competencia || ''))) throw new Error('Selecione um ano e um mês específicos.');
  const atuais = referencias && typeof referencias === 'object' ? referencias : null;
  const conferencias = atuais ? atuais.conferencias : conferenciasRep || [];
  const porIdentificador = new Map();
  if (atuais) (atuais.servidores || []).forEach(cadastro => {
    if (cadastro.pis) porIdentificador.set(normalizarPisRep(cadastro.pis), cadastro);
    if (cadastro.matricula) porIdentificador.set(normalizarPisRep('MAT:' + cadastro.matricula), cadastro);
  });
  const conferidos = new Set(conferencias.filter(item => item.conferido === true && item.competencia === competencia).map(item => normalizarPisRep(item.pis)));
  const linhas = [], excluidos = [];
  let diasPendentes = 0;
  for (const emp of servidores || []) {
    const cadastro = atuais ? porIdentificador.get(normalizarPisRep(emp.pis)) : obterServidorPorIdentificadorRep_(emp.pis);
    let minutos = 0;
    for (const dia of emp.dias || []) {
      if (String(dia.dataOriginal || '').slice(0,7) !== competencia) continue;
      if (dia.pendencia) { diasPendentes++; continue; }
      if (!dia.ausencia && Number.isFinite(dia.extraDia) && dia.extraDia > 0) minutos += Math.round(dia.extraDia * 60);
    }
    if (minutos <= 0) continue;
    const situacao = normalizarVinculoRelatorioHe_(cadastro && cadastro.situacao);
    const comissionado = /\bCOMISSIONAD[OA]S?\b|\bCOMISSAO\b/.test(situacao)
      || /\bCOMISSIONAD[OA]S?\b|\bEM COMISSAO\b/.test(normalizarVinculoRelatorioHe_(cadastro && cadastro.cargo));
    const conferido = conferidos.has(normalizarPisRep(emp.pis));
    const motivos = [];
    if (!conferido) motivos.push('Ponto não marcado como conferido neste mês');
    if (comissionado) motivos.push('Cargo comissionado');
    if (!cadastro || !situacao || ['NAO INFORMADO','N I','NI'].includes(situacao)) motivos.push('Vínculo funcional não informado no cadastro');
    const item = { pis:emp.pis, matricula:String(cadastro && cadastro.matricula || ''), cargo:String(cadastro && cadastro.cargo || ''),
      nome:String(cadastro && cadastro.nome || emp.nome || ''), minutos, conferido, situacao, motivos };
    (motivos.length ? excluidos : linhas).push(item);
  }
  const ordenar = (a,b) => a.nome.localeCompare(b.nome,'pt-BR') || a.matricula.localeCompare(b.matricula);
  linhas.sort(ordenar); excluidos.sort(ordenar);
  const [ano,mes] = competencia.split('-').map(Number);
  const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return { competencia, rotulo:meses[mes-1]+' de '+ano, inicio:'01/'+String(mes).padStart(2,'0')+'/'+ano,
    fim:String(new Date(ano,mes,0).getDate()).padStart(2,'0')+'/'+String(mes).padStart(2,'0')+'/'+ano,
    linhas, excluidos, totalMinutos:linhas.reduce((total,item)=>total+item.minutos,0), diasPendentes };
}

function prepararDadosRelatorioMensalHeRep_(referencias) {
  if (repOnlineCarregando) throw new Error('Aguarde o carregamento do Leitor REP.');
  if (repTemAlteracoesPendentes_() || (typeof existemGravacoesPendentes_ === 'function' && existemGravacoesPendentes_())) throw new Error('Aguarde a confirmação das alterações na fila antes de emitir o relatório.');
  if ((falhasIntegridadeRep || []).length) throw new Error('Há arquivos do REP que não foram lidos. Sincronize a pasta antes de emitir um relatório completo.');
  const competencia = obterCompetenciaAtualRep_();
  return montarRelatorioMensalHeRep_(obterServidoresCompetenciaRelatorioAlertasRep_(competencia), competencia, referencias || referenciasRelatorioMensalHeRep_);
}

async function conferirReferenciasRelatorioMensalHeRep_() {
  prepararDadosRelatorioMensalHeRep_();
  const competencia = obterCompetenciaAtualRep_();
  const [servidores,conferencias] = await Promise.all([
    chamarBackendPromessa_('obterListaServidores', []), chamarBackendPromessa_('listarConferenciasRep', [])
  ]);
  if (!Array.isArray(servidores) || !Array.isArray(conferencias)) throw new Error('Não foi possível confirmar os cadastros e as conferências atuais.');
  if (obterCompetenciaAtualRep_() !== competencia) throw new Error('A competência mudou. Abra novamente o relatório.');
  referenciasRelatorioMensalHeRep_ = { competencia, servidores, conferencias };
  return prepararDadosRelatorioMensalHeRep_(referenciasRelatorioMensalHeRep_);
}

function definirBotoesRelatorioHe_(habilitar) {
  if (typeof document === 'undefined' || typeof document.querySelectorAll !== 'function') return;
  document.querySelectorAll('[data-exportar-relatorio-he]').forEach(botao => { botao.disabled = !habilitar; });
}

async function atualizarPreviaRelatorioMensalHeRep_() {
  if (relatorioMensalHeCarregando_) return;
  const alvo = document.getElementById('rep-he-previa');
  relatorioMensalHeCarregando_ = true;
  definirBotoesRelatorioHe_(false);
  alvo.textContent = 'Confirmando o vínculo funcional e a conferência do mês na base…';
  try {
    const dados = await conferirReferenciasRelatorioMensalHeRep_();
    if (competenciaSelecaoRelatorioHeRep_ !== dados.competencia) {
      desmarcadosRelatorioMensalHeRep_.clear();
      competenciaSelecaoRelatorioHeRep_ = dados.competencia;
    }
    dadosRelatorioMensalHeAtual_ = dados;
    const todosMarcados = dados.linhas.length > 0 && dados.linhas.every(item => !desmarcadosRelatorioMensalHeRep_.has(obterChaveLinhaRelatorioHe_(item)));
    const linhas = dados.linhas.map(item => {
      const chave = obterChaveLinhaRelatorioHe_(item);
      const marcado = !desmarcadosRelatorioMensalHeRep_.has(chave);
      return `<tr><td style="text-align:center;width:36px"><input type="checkbox" data-rep-he-check value="${escapeHtml(chave)}" aria-label="Incluir ${escapeHtml(item.nome)}" ${marcado ? 'checked' : ''} onchange="atualizarSelecaoRelatorioHe_()"></td><td>${escapeHtml(item.matricula)}</td><td>${escapeHtml(item.cargo)}</td><td>${escapeHtml(item.nome)}</td><td style="white-space:nowrap;text-align:right">${minutosParaHoraRep_(item.minutos)}</td></tr>`;
    }).join('');
    const excluidos = dados.excluidos.map(item => `<tr><td>${escapeHtml(item.nome)}</td><td>${escapeHtml(item.motivos.join('; '))}</td></tr>`).join('');
    alvo.innerHTML = `<p><strong id="rep-he-resumo-selecao">${escapeHtml(dados.rotulo)} · ${dados.linhas.length} servidor(es) · ${minutosParaHoraRep_(dados.totalMinutos)} horas</strong></p>
      <p style="color:var(--text-secondary)">Entram somente servidores com horas extras, ponto marcado como conferido neste mês e vínculo não comissionado (todos elegíveis já vêm pré-selecionados para emissão). O relatório abrange todos os locais carregados do mês.</p>
      ${dados.diasPendentes ? `<p role="status">${dados.diasPendentes} dia(s) com marcações pendentes não entram no total de HE.</p>` : ''}
      <div style="max-height:40vh;overflow:auto"><table class="data-table" style="width:100%"><thead><tr><th style="width:36px;text-align:center"><input type="checkbox" id="rep-he-check-all" aria-label="Selecionar todos elegíveis" ${todosMarcados ? 'checked' : ''} onchange="marcarTodosRelatorioHe_(this)"></th><th>Matrícula</th><th>Função</th><th>Nome</th><th>HE (h:mm)</th></tr></thead><tbody>${linhas || '<tr><td colspan="5">Nenhum servidor atende aos critérios para este mês.</td></tr>'}</tbody></table></div>
      ${excluidos ? `<details style="margin-top:16px"><summary>Não entram no relatório (${dados.excluidos.length})</summary><table class="data-table" style="width:100%"><thead><tr><th>Servidor</th><th>Motivo</th></tr></thead><tbody>${excluidos}</tbody></table></details>` : ''}`;
    atualizarSelecaoRelatorioHe_();
  } catch (erro) { alvo.textContent = mensagemErro(erro); }
  finally { relatorioMensalHeCarregando_ = false; }
}

async function abrirRelatorioMensalHeRep_() {
  try { prepararDadosRelatorioMensalHeRep_(); } catch (erro) { return mostrarToast(mensagemErro(erro),'warning'); }
  desmarcadosRelatorioMensalHeRep_.clear();
  competenciaSelecaoRelatorioHeRep_ = obterCompetenciaAtualRep_();
  let modal = document.getElementById('modal-relatorio-mensal-he');
  if (!modal) {
    modal = document.createElement('div'); modal.id = 'modal-relatorio-mensal-he'; modal.className = 'modal-overlay';
    modal.innerHTML = `<div class="modal-content" style="max-width:980px"><div class="modal-header"><h3 class="modal-title">Relatório mensal de horas extras</h3><button type="button" class="modal-close" aria-label="Fechar relatório" onclick="fecharModal('modal-relatorio-mensal-he')">×</button></div><div class="modal-body"><div id="rep-he-previa" aria-live="polite"></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="fecharModal('modal-relatorio-mensal-he')">Fechar</button><button type="button" class="btn btn-secondary" onclick="atualizarPreviaRelatorioMensalHeRep_()">Conferir novamente</button><button type="button" class="btn btn-secondary" data-exportar-relatorio-he disabled onclick="exportarRelatorioMensalHeRep_('excel',this)">Baixar Excel</button><button type="button" class="btn btn-primary" data-exportar-relatorio-he disabled onclick="exportarRelatorioMensalHeRep_('pdf',this)">Imprimir / salvar PDF</button></div></div>`;
    document.body.appendChild(modal);
  }
  abrirModal('modal-relatorio-mensal-he');
  await atualizarPreviaRelatorioMensalHeRep_();
}

function criarPlanilhaRelatorioMensalHeRep_(dados) {
  const modelo = window.RELATORIO_HE_MODELO;
  if (!modelo) throw new Error('O modelo original do relatório não carregou.');
  const [ano,mes] = dados.competencia.split('-').map(Number);
  const serial = dia => (Date.UTC(ano,mes-1,dia)-Date.UTC(1899,11,30))/86400000;
  const linhas = [[],[modelo.prefeitura],[],[modelo.subtitulo],[modelo.titulo],[],[modelo.secretaria],[],
    ['PERÍODO:',null,null,null,null,serial(1),null,'A',serial(new Date(ano,mes,0).getDate())],
    [modelo.colunas[0],modelo.colunas[1],modelo.colunas[2],null,null,null,null,null,null,null,modelo.colunas[3]]];
  dados.linhas.forEach(item=>linhas.push([item.matricula,item.cargo,item.nome,null,null,null,null,null,null,null,item.minutos/1440]));
  const ultimaLinha = linhas.length, total = ultimaLinha+1;
  linhas.push([modelo.total,null,null,null,null,null,null,null,null,null,{t:'n',f:'SUM(K11:K'+ultimaLinha+')',v:dados.totalMinutos/1440,z:'[h]:mm'}],[],[modelo.assinatura], [modelo.cargoAssinatura]);
  const folha = XLSX.utils.aoa_to_sheet(linhas);
  folha.F9.z = 'd/m/yyyy'; folha.I9.z = 'd/m/yyyy';
  for (let linha=11;linha<=ultimaLinha;linha++) folha['K'+linha].z = '[h]:mm';
  const merge = (r1,c1,r2,c2)=>({s:{r:r1-1,c:c1},e:{r:r2-1,c:c2}});
  folha['!merges'] = [merge(1,0,1,11),merge(2,0,3,11),merge(4,0,4,11),merge(5,0,6,11),merge(7,0,8,11),merge(9,0,9,4),merge(9,5,9,6),merge(9,8,9,9),merge(9,10,9,11),merge(total,0,total+1,9),merge(total,10,total+1,11),merge(total+2,0,total+2,5),merge(total+3,0,total+3,5)];
  for (let linha=10;linha<=ultimaLinha;linha++) folha['!merges'].push(merge(linha,2,linha,9),merge(linha,10,linha,11));
  folha['!cols'] = modelo.colunasPx.map(wpx=>({wpx}));
  folha['!rows'] = Array.from({length:linhas.length},(_,i)=>({hpt:i<9?[9.75,15,15,19.5,15,6.75,15,7.5,15.75][i]:i===9||i===10?15:i===total?1.5:16.5}));
  folha['!margins'] = {left:.7875,right:.7875,top:.5902777778,bottom:.9847222222,header:.5118110236,footer:.3152777778};
  const livro = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(livro,folha,'RELATÓRIO'); return livro;
}

function criarHtmlRelatorioMensalHeRep_(dados) {
  const m = window.RELATORIO_HE_MODELO;
  if (!m || !m.selo) throw new Error('O modelo original do relatório não carregou.');
  const dataModelo = valor => valor.split('/').map((p,i)=>i<2?String(Number(p)):p).join('/');
  const horasModelo = minutos => Math.floor(minutos / 60) + ':' + String(minutos % 60).padStart(2,'0');
  const linha = (item,i)=>`<tr class="${i===0?'primeira':''}"><td>${escapeHtml(item.matricula)}</td><td>${escapeHtml(item.cargo)}</td><td class="nome">${escapeHtml(item.nome)}</td><td class="horas">${horasModelo(item.minutos)}</td></tr>`;
  // As alturas variam quando nomes ou cargos ocupam mais de uma linha.
  // Uma única sequência deixa o navegador quebrar somente onde falta espaço.
  const primeiro = dados.linhas.map(linha).join('');
  const demais = '';
  const rodapeCss = m.rodape.join('\\A ');
  return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Relatório de HE - ${escapeHtml(dados.rotulo)}</title><style>
    .assinatura td{height:34mm!important}.assinatura div:first-child{width:90mm!important;height:25mm!important;margin-left:4mm;font-size:0;line-height:0!important;border-bottom:.6675pt solid #000}.assinatura div:last-child{height:8mm!important;line-height:8mm!important}
    @page{@bottom-center{content:"${rodapeCss}";font:8.9pt/1.2 Arial,sans-serif;white-space:pre;text-align:center;vertical-align:bottom;padding-bottom:8.008055556mm;width:170mm}}@media print{footer.rodape{display:none!important}}

    </style></head><body><div class="acoes"><button onclick="window.print()">Imprimir / salvar PDF</button></div><table class="modelo"><colgroup><col><col><col><col></colgroup><thead><tr><td colspan="4" class="cabecalho"><img class="selo" src="${m.selo}" alt="Selo de São Sebastião"><div class="vazio"></div><div class="prefeitura">${escapeHtml(m.prefeitura)}</div><div class="subtitulo">${escapeHtml(m.subtitulo)}</div><div class="titulo">${escapeHtml(m.titulo)}</div><div class="secretaria">${escapeHtml(m.secretaria)}</div><div class="periodo"><span class="rotulo">PERÍODO:</span><b>${escapeHtml(dataModelo(dados.inicio))}</b><b>A</b><b>${escapeHtml(dataModelo(dados.fim))}</b><span></span></div></td></tr></thead><tbody class="dados"><tr class="colunas">${m.colunas.map(c=>'<th>'+escapeHtml(c)+'</th>').join('')}</tr>${primeiro}</tbody>${demais?'<tbody class="dados continuacao">'+demais+'</tbody>':''}<tbody class="final"><tr class="total"><td colspan="3">${escapeHtml(m.total)}</td><td class="horas">${minutosParaHoraRep_(dados.totalMinutos)}</td></tr><tr class="assinatura"><td colspan="4"><div>${escapeHtml(m.assinatura)}</div><div>${escapeHtml(m.cargoAssinatura)}</div></td></tr></tbody></table><footer class="rodape">${m.rodape.map(escapeHtml).join('<br>')}</footer></body></html>`;
}

async function exportarRelatorioMensalHeRep_(formato,botao) {
  let janela;
  try {
    if (relatorioMensalHeCarregando_) throw new Error('Aguarde a conferência dos critérios do relatório.');
    prepararDadosRelatorioMensalHeRep_();
    const checks = obterCheckboxesSelecaoRelatorioHe_();
    if (checks.length && !checks.some(c => c.checked)) {
      throw new Error('Selecione ao menos um servidor elegível para emitir o relatório.');
    }
    if (formato === 'pdf') {
      janela = window.open('','_blank');
      if (!janela) throw new Error('Permita a abertura da janela para imprimir o relatório.');
      janela.document.write('<p style="font:16px Arial;padding:24px">Conferindo os servidores que podem entrar no relatório…</p>');
    } else if (typeof XLSX === 'undefined') throw new Error('A biblioteca de Excel ainda não está disponível.');
    if (botao) botao.disabled = true;
    const dados = await conferirReferenciasRelatorioMensalHeRep_();
    const dadosSelecionados = filtrarSelecionadosRelatorioMensalHeRep_(dados);
    if (!dadosSelecionados.linhas.length) throw new Error('Nenhum servidor selecionado atende aos critérios: HE positiva, ponto conferido e vínculo não comissionado.');
    if (formato === 'pdf') { janela.document.open(); janela.document.write(criarHtmlRelatorioMensalHeRep_(dadosSelecionados)); janela.document.close(); janela.focus(); }
    else XLSX.writeFile(criarPlanilhaRelatorioMensalHeRep_(dadosSelecionados),'Relatorio_Horas_Extras_'+dadosSelecionados.competencia+'.xlsx');
  } catch (erro) { if (janela) janela.close(); mostrarToast('Não foi possível emitir o relatório: '+mensagemErro(erro),'error'); }
  finally { if (botao) botao.disabled = false; }
}
</script>
