<script>
/** Melhorias isoladas da conferência REP para evitar ampliar ainda mais o arquivo principal. */
async function baixarArquivosEntradaEmParaleloRep_(registros) {
  const arquivos = new Array(registros.length);
  let proximo = 0;
  let concluidos = 0;
  async function trabalhador() {
    while (proximo < registros.length) {
      const i = proximo++;
      const registro = registros[i];
      let localAtual = typeof resolverLocalAfdLoader_ === 'function' ? resolverLocalAfdLoader_(registro, '', '', i) : registro.nome;
      atualizarProgressoAfdLoader_(i, 'carregando', registro.nome, {
        progresso: 5,
        local: localAtual
      });
      try {
        const arquivo = await baixarArquivoPastaEntradaRep_(registro, i + 1, registros.length, function(info) {
          if (info?.local) localAtual = info.local;
          const fracao = Math.max(0, Math.min(1, Number(info?.fracao || 0)));
          atualizarProgressoAfdLoader_(i, 'carregando', registro.nome, {
            progresso: Math.max(6, Math.round(6 + fracao * 68)),
            local: localAtual
          });
        });
        if (arquivo) {
          arquivo.repIndiceLoader = i;
          if (arquivo.repLocalDetectado) localAtual = arquivo.repLocalDetectado;
        }
        arquivos[i] = arquivo;
        atualizarProgressoAfdLoader_(i, 'carregando', registro.nome, {
          progresso: 78,
          local: localAtual
        });
      } catch (erro) {
        atualizarProgressoAfdLoader_(i, 'falhou', registro.nome, { progresso: 100, local: localAtual });
        falhasIntegridadeRep.push({ nome: registro.nome, arquivoId: registro.id, motivo: mensagemErro(erro), tamanho: registro.tamanho });
      } finally {
        concluidos++;
        atualizarProgressoLoader_(8 + concluidos / Math.max(1, registros.length) * 52, `Carregando ${concluidos}/${registros.length}: ${localAtual || registro.nome}`);
      }
    }
  }
  await Promise.all(Array.from({ length: Math.min(2, registros.length) }, trabalhador));
  return arquivos.filter(Boolean);
}
let repReprocessamentoLeveTimer_ = null;
let repReprocessamentoGeracao_ = 0;
let repReprocessamentoTodos_ = false;
const repReprocessamentoPessoas_ = new Set();
function agendarReprocessamentoRepLeve_(atraso, pis) {
  if (pis) repReprocessamentoPessoas_.add(normalizarPisRep(pis));
  else repReprocessamentoTodos_ = true;
  const geracao = ++repReprocessamentoGeracao_;
  clearTimeout(repReprocessamentoLeveTimer_);
  repReprocessamentoLeveTimer_ = setTimeout(function() {
    const executar = function() {
      if (geracao !== repReprocessamentoGeracao_) return;
      const pessoas = repReprocessamentoTodos_ ? null : Array.from(repReprocessamentoPessoas_);
      repReprocessamentoPessoas_.clear();
      repReprocessamentoTodos_ = false;
      atualizarProcessamentoRep({ notificarEntidade: false, pessoas: pessoas });
    };
    // Edição feita pelo usuário deve aparecer no próximo quadro. Só o
    // recálculo geral em segundo plano aguarda o navegador ficar ocioso.
    if (!repReprocessamentoTodos_ && repReprocessamentoPessoas_.size) requestAnimationFrame(executar);
    else if (typeof requestIdleCallback === 'function') requestIdleCallback(executar, { timeout: 900 });
    else requestAnimationFrame(executar);
  }, pis ? 40 : Math.max(80, Number(atraso || 180)));
}
function obterServidorSelecionadoRep_() {
  const processado = (dadosRepProcessados || []).find(function(item) { return normalizarPisRep(item.pis) === normalizarPisRep(pisSelecionadoRep); });
  if (processado) return processado;
  const pis = normalizarPisRep(pisSelecionadoRep);
  if (!pis || !dadosRepCache.employees.has(pis)) return null;
  return {
    pis: pis,
    nome: dadosRepCache.employees.get(pis) || 'Servidor',
    lotacao: dadosRepCache.lotacoes.get(pis) || 'Não informada',
    dias: [],
    resumo: { origensSaldoCompensacao: [] }
  };
}

function garantirModalCartaoManualRep_() {
  const area = document.getElementById('rep-cartao-manual-inline');
  if (!area) return null;
  let modal = document.getElementById('modal-cartao-manual-rep');
  if (modal) return modal;
  modal = document.createElement('section');
  modal.className = 'rep-inline-workspace';
  modal.id = 'modal-cartao-manual-rep';
  modal.innerHTML = `<div class="modal-content rep-cartao-manual-modal"><div class="modal-header"><div><h3 class="modal-title">Incluir cartão de ponto manual</h3><small>O servidor passará pelos mesmos cálculos do Leitor REP.</small></div><button class="modal-close" onclick="fecharEspacoManualInlineRep_()"><span data-lucide="x"></span></button></div><div class="modal-body"><p class="rep-lote-intro">Selecione quem não registra ponto eletrônico e a competência. O preenchimento será aberto abaixo, nesta mesma tela.</p><div class="rep-cartao-manual-grid"><div class="form-group"><label for="rep-cartao-manual-servidor">Servidor</label><select id="rep-cartao-manual-servidor" class="form-control"></select><small id="rep-cartao-manual-aviso" class="rep-cartao-manual-aviso"></small></div><div class="form-group"><label for="rep-cartao-manual-competencia">Competência</label><input id="rep-cartao-manual-competencia" type="month" class="form-control"></div></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="fecharEspacoManualInlineRep_()">Cancelar</button><button type="button" class="btn btn-primary" onclick="continuarInclusaoCartaoManualRep_()"><span data-lucide="arrow-right"></span> Preencher cartão aqui</button></div></div>`;
  area.replaceChildren(modal);
  return modal;
}

async function fecharEspacoManualInlineRep_() {
  const area = document.getElementById('rep-cartao-manual-inline');
  const lote = document.getElementById('modal-lancamentos-lote-rep');
  if (lote && lote.parentElement === area && lote.dataset.dirty === 'sim') {
    const descartar = await abrirConfirm('Existem horários digitados que ainda não foram colocados na fila de salvamento. Deseja fechar e descartar somente essas alterações não salvas?');
    if (!descartar) return false;
  }
  if (lote && lote.parentElement === area) {
    // O formulário inline precisa voltar a ser um modal oculto. Apenas movê-lo
    // para o body deixa a tabela inteira visível no fim da página.
    lote.className = 'modal-overlay';
    lote.classList.remove('active');
    lote.dataset.inline = '';
    document.body.appendChild(lote);
  }
  if (area) { area.replaceChildren(); area.hidden = true; }
  const lista = document.getElementById('rep-servidores-list');
  if (lista) lista.style.display = 'flex';
  return true;
}

async function abrirInclusaoCartaoManualRep_() {
  if (!repOnlineCarregado) await carregarModuloRepOnline(true);
  const areaAtual = document.getElementById('rep-cartao-manual-inline');
  const loteAtual = document.getElementById('modal-lancamentos-lote-rep');
  if (loteAtual && loteAtual.parentElement === areaAtual) {
    areaAtual.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return mostrarToast('O cartão manual desta pessoa já está aberto. Continue o preenchimento abaixo.', 'info');
  }
  const resultados = document.getElementById('rep-results-container');
  if (resultados) resultados.style.display = 'block';
  const modal = garantirModalCartaoManualRep_();
  const servidores = (AppState.servidores || [])
    .filter(function(item) { return String(item.status || '').toLowerCase() !== 'inativo'; })
    .sort(function(a, b) { return String(a.nome || '').localeCompare(String(b.nome || ''), 'pt-BR'); });
  const aptos = servidores.filter(function(item) { return Boolean(normalizarPisRep(item.pis) || obterIdentificadorCartaoManualRep_(item)); });
  const seletor = document.getElementById('rep-cartao-manual-servidor');
  seletor.innerHTML = '<option value="">Selecione...</option>' + aptos.map(function(item) {
    const identificador = normalizarPisRep(item.pis) || obterIdentificadorCartaoManualRep_(item);
    return `<option value="${escapeHtml(identificador)}">${escapeHtml(item.nome || 'Servidor')} · ${escapeHtml(item.matricula || 'sem matrícula')} · ${escapeHtml(item.lotacao || 'lotação não informada')}</option>`;
  }).join('');
  const aviso = document.getElementById('rep-cartao-manual-aviso');
  aviso.textContent = 'Para quem não possui PIS/CPF cadastrado, o cartão manual será associado pela matrícula.';
  const campoCompetencia = document.getElementById('rep-cartao-manual-competencia');
  const anoFiltro = document.getElementById('rep-filter-ano')?.value;
  const mesFiltro = document.getElementById('rep-filter-mes')?.value;
  const referencia = new Date();
  referencia.setDate(1);
  referencia.setMonth(referencia.getMonth() - 1);
  campoCompetencia.value = anoFiltro && anoFiltro !== 'all' && mesFiltro && mesFiltro !== 'all'
    ? `${anoFiltro}-${mesFiltro}`
    : `${referencia.getFullYear()}-${String(referencia.getMonth() + 1).padStart(2, '0')}`;
  const area = document.getElementById('rep-cartao-manual-inline');
  if (area) { area.hidden = false; area.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  const lista = document.getElementById('rep-servidores-list');
  if (lista) lista.style.display = 'none';
  renderizarIcones();
}

function continuarInclusaoCartaoManualRep_() {
  const pis = normalizarPisRep(document.getElementById('rep-cartao-manual-servidor')?.value);
  if (!pis) return mostrarToast('Selecione um servidor para preencher o cartão manual.', 'warning');
  const competencia = String(document.getElementById('rep-cartao-manual-competencia')?.value || '');
  if (!/^\d{4}-\d{2}$/.test(competencia)) return mostrarToast('Informe a competência do cartão manual.', 'warning');
  const servidor = obterServidorPorIdentificadorRep_(pis);
  if (!servidor) return mostrarToast('O cadastro selecionado não foi localizado.', 'error');
  dadosRepCache.employees.set(pis, servidor.nome || 'Servidor');
  dadosRepCache.lotacoes.set(pis, String(servidor.lotacao || 'Não informada').trim() || 'Não informada');
  pisSelecionadoRep = pis;
  abrirLancamentosLoteRep_({ cartaoManual: true, inline: true, competencia: competencia, local: servidor.lotacao || 'Local informado manualmente' });
}

function preencherDiasCartaoManualRep_(competencia, local) {
  const partes = String(competencia || '').split('-').map(Number);
  if (partes.length !== 2 || !partes[0] || !partes[1]) return adicionarLinhaMarcacaoLoteRep_('', local);
  const feriados = new Set((feriadosCompartilhadosRep || [])
    .map(function(item) { return normalizarDataFeriadoRep_(item && item.data); })
    .filter(Boolean));
  obterFeriadosRep().forEach(function(data) { feriados.add(data); });
  const ultimoDia = new Date(partes[0], partes[1], 0).getDate();
  const servidorSelecionado = obterServidorSelecionadoRep_();
  let totalExistentes = 0;
  for (let dia = 1; dia <= ultimoDia; dia++) {
    const data = `${partes[0]}-${String(partes[1]).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
    const diaExistente = (servidorSelecionado?.dias || []).find(function(item) { return item.dataOriginal === data; });
    const eventosExistentes = (diaExistente?.batidasDetalhadas || []).slice(0, 6);
    totalExistentes += eventosExistentes.length;
    adicionarLinhaMarcacaoLoteRep_(data, local, eventosExistentes);
    const linha = document.querySelector('#rep-lote-marcacoes tr:last-child');
    const diaSemana = new Date(partes[0], partes[1] - 1, dia).getDay();
    if (!linha) continue;
    if (feriados.has(data)) {
      linha.classList.add('rep-cartao-feriado');
      linha.title = 'Feriado ou ponto facultativo cadastrado no Leitor REP';
    } else if (diaSemana === 0 || diaSemana === 6) {
      linha.classList.add('rep-cartao-fim-semana');
      linha.title = diaSemana === 0 ? 'Domingo' : 'Sábado';
    }
    if ((diaExistente?.batidasDetalhadas || []).length > 6) {
      linha.classList.add('rep-cartao-excedente');
      linha.title = 'Este dia possui mais de seis marcações. Faça a conferência pela opção Ajustar.';
    }
  }
  const status = document.getElementById('rep-lote-status');
  if (status && totalExistentes) status.textContent = `${totalExistentes} marcação(ões) já existente(s) foram carregadas. Registros do AFD estão protegidos; registros manuais podem ser continuados ou corrigidos.`;
}

function alternarDiaSeguinteCartaoManualRep_(botao, forcarOffset, automatico) {
  const celula = botao?.closest('.rep-cartao-horario');
  const campo = celula?.querySelector('.rep-lote-hora');
  if (!campo || campo.readOnly) return;
  const atual = Number(campo.dataset.diaOffset || 0);
  const novo = forcarOffset == null ? (atual ? 0 : 1) : (forcarOffset ? 1 : 0);
  campo.dataset.diaOffset = String(novo);
  if (automatico) campo.dataset.diaOffsetAutomatico = novo ? 'sim' : '';
  else delete campo.dataset.diaOffsetAutomatico;
  botao.classList.toggle('ativo', novo === 1);
  botao.setAttribute('aria-pressed', novo === 1 ? 'true' : 'false');
  botao.title = novo === 1 ? 'Este horário pertence ao dia seguinte' : 'Marcar este horário como pertencente ao dia seguinte';
  const modal = document.getElementById('modal-lancamentos-lote-rep');
  if (modal && modal.dataset.modo === 'cartao-manual') modal.dataset.dirty = 'sim';
}

function ajustarViradaAutomaticaCartaoManualRep_(campo) {
  if (!campo || campo.readOnly) return;
  const botao = campo.closest('.rep-cartao-horario')?.querySelector('.rep-dia-seguinte');
  const minutos = /^\d{2}:\d{2}$/.test(String(campo.value || ''))
    ? Number(campo.value.slice(0, 2)) * 60 + Number(campo.value.slice(3, 5))
    : null;
  // Só sugere automaticamente a virada para horários da madrugada. Para
  // qualquer outro horário, o +1 é uma decisão explícita de quem confere.
  if (minutos != null && minutos >= 0 && minutos <= 300) {
    alternarDiaSeguinteCartaoManualRep_(botao, true, true);
  } else if (campo.dataset.diaOffsetAutomatico === 'sim') {
    alternarDiaSeguinteCartaoManualRep_(botao, false, true);
  }
}

function criarDataAjusteComOffsetRep_(dataIso, hora, offset) {
  const data = criarDataAjusteRep(dataIso, hora);
  if (!data) return null;
  data.setDate(data.getDate() + (Number(offset) === 1 ? 1 : 0));
  return data;
}

function normalizarValorColadoCartaoManualRep_(campo, valor) {
  valor = String(valor == null ? '' : valor).trim();
  if (campo.type === 'time') {
    const encontrado = valor.match(/^(\d{1,2})[:h.](\d{2})/i);
    if (encontrado) return String(Math.min(23, Number(encontrado[1]))).padStart(2, '0') + ':' + String(Math.min(59, Number(encontrado[2]))).padStart(2, '0');
  }
  if (campo.type === 'date') {
    const br = valor.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
    if (br) return br[3] + '-' + br[2].padStart(2, '0') + '-' + br[1].padStart(2, '0');
  }
  return valor;
}

function ativarNavegacaoPlanilhaCartaoManualRep_(escopo) {
  const tabela = document.querySelector('#modal-lancamentos-lote-rep .rep-lote-marcacoes');
  if (!tabela) return;
  const camposDoDia = function(linha) { return Array.from(linha.querySelectorAll('input:not([readonly])')); };
  (escopo || tabela).querySelectorAll('input').forEach(function(campo) {
    if (campo.dataset.navegacaoPlanilha === 'sim') return;
    campo.dataset.navegacaoPlanilha = 'sim';
    campo.addEventListener('input', function() {
      const modal = document.getElementById('modal-lancamentos-lote-rep');
      if (modal && modal.dataset.modo === 'cartao-manual') modal.dataset.dirty = 'sim';
    });
    campo.addEventListener('focus', function() {
      if (typeof campo.select === 'function' && campo.type !== 'time' && campo.type !== 'date') campo.select();
    });
    campo.addEventListener('keydown', function(evento) {
      const linha = campo.closest('tr');
      const linhas = Array.from(tabela.querySelectorAll('tbody tr'));
      const indiceLinha = linhas.indexOf(linha);
      const celulas = camposDoDia(linha);
      const indiceColuna = celulas.indexOf(campo);
      let destino = null;
      if (evento.key === 'Tab' && campo.classList.contains('rep-lote-hora')) {
        const horarios = Array.from(tabela.querySelectorAll('tbody .rep-lote-hora:not([readonly])'));
        destino = horarios[horarios.indexOf(campo) + (evento.shiftKey ? -1 : 1)];
      } else if (evento.key === 'Enter') destino = camposDoDia(linhas[indiceLinha + (evento.shiftKey ? -1 : 1)] || linha)[indiceColuna];
      else if (evento.key === 'ArrowDown') destino = camposDoDia(linhas[indiceLinha + 1] || linha)[indiceColuna];
      else if (evento.key === 'ArrowUp') destino = camposDoDia(linhas[indiceLinha - 1] || linha)[indiceColuna];
      else if (evento.key === 'ArrowRight') destino = celulas[indiceColuna + 1];
      else if (evento.key === 'ArrowLeft') destino = celulas[indiceColuna - 1];
      if (destino && destino !== campo) { evento.preventDefault(); destino.focus(); }
    });
    campo.addEventListener('paste', function(evento) {
      const texto = evento.clipboardData?.getData('text/plain') || '';
      if (!/[\t\r\n]/.test(texto)) return;
      evento.preventDefault();
      const linhasTabela = Array.from(tabela.querySelectorAll('tbody tr'));
      const linhaInicial = linhasTabela.indexOf(campo.closest('tr'));
      const colunaInicial = camposDoDia(campo.closest('tr')).indexOf(campo);
      const matriz = texto.replace(/\r/g, '').trimEnd().split('\n').map(function(linha) { return linha.split('\t'); });
      matriz.forEach(function(valores, deslocamentoLinha) {
        const linhaDestino = linhasTabela[linhaInicial + deslocamentoLinha];
        if (!linhaDestino) return;
        const camposDestino = camposDoDia(linhaDestino);
        valores.forEach(function(valor, deslocamentoColuna) {
          const destino = camposDestino[colunaInicial + deslocamentoColuna];
          if (!destino || destino.readOnly) return;
          destino.value = normalizarValorColadoCartaoManualRep_(destino, valor);
          destino.dispatchEvent(new Event('input', { bubbles: true }));
          if (destino.classList.contains('rep-lote-hora')) ajustarViradaAutomaticaCartaoManualRep_(destino);
        });
      });
      mostrarToast(matriz.length + ' linha(s) colada(s) no cartão manual.', 'success');
    });
  });
}

async function editarMarcacaoRapidaRep_(pis, data, eventId, campo) {
  if (!campo || campo.dataset.salvando === 'true') return;
  const hora = String(campo.value || '');
  if (!/^\d{2}:\d{2}$/.test(hora)) { campo.value = campo.dataset.original || ''; return; }
  if (hora === campo.dataset.original) return;
  const existente = (dadosRepCache.punches || []).find(function(item) { return String(item.eventId || '') === String(eventId || ''); });
  if (!existente || existente.desconsiderada) return mostrarToast('A marcação já foi alterada por outra ação.', 'warning');
  campo.dataset.salvando = 'true';
  const anterior = { desconsiderada: existente.desconsiderada, justificativa: existente.ajusteJustificativa };
  const partes = hora.split(':').map(Number);
  const novaData = new Date(existente.datetime.getTime());
  novaData.setHours(partes[0], partes[1], 0, 0);
  existente.desconsiderada = true;
  existente.ajusteJustificativa = 'Horário corrigido diretamente no espelho de conferência.';
  const id = 'MANUAL|' + gerarUuidSeguroCliente_();
  const novo = {
    pis: String(pis), datetime: novaData, clock: existente.clock || 'Local informado manualmente',
    deviceSerial: 'AJUSTE MANUAL', nsr: 'MANUAL', lineNumber: '', eventId: id, eventKey: 'AJUSTE|' + id,
    nomeNoMomento: dadosRepCache.employees.get(String(pis)) || '', sourceFile: 'Ajuste compartilhado',
    rawTimestamp: novaData.getTime(), manual: true, ajusteCompartilhado: true,
    dataReferencia: existente.dataReferencia || data, ajusteOrigemData: existente.ajusteOrigemData || data,
    justificativa: 'Horário corrigido diretamente no espelho de conferência.'
  };
  dadosRepCache.punches.push(novo);
  try {
    await salvarAjustesCompetenciaRep_(pis, String(data).slice(0, 7), [], [data]);
    agendarReprocessamentoRepLeve_(180, pis);
    mostrarToast('Marcação corrigida. O horário original do AFD foi preservado.', 'success');
  } catch (erro) {
    existente.desconsiderada = anterior.desconsiderada;
    existente.ajusteJustificativa = anterior.justificativa;
    dadosRepCache.punches = dadosRepCache.punches.filter(function(item) { return item !== novo; });
    campo.value = campo.dataset.original || '';
    mostrarToast('Não foi possível corrigir a marcação: ' + mensagemErro(erro), 'error');
  } finally { campo.dataset.salvando = 'false'; }
}

async function desconsiderarMarcacaoRapidaRep_(pis, data, eventId) {
  const existente = (dadosRepCache.punches || []).find(function(item) { return String(item.eventId || '') === String(eventId || ''); });
  if (!existente || existente.desconsiderada) return mostrarToast('Essa marcação já foi desconsiderada.', 'info');
  existente.desconsiderada = true;
  existente.ajusteJustificativa = 'Marcação desconsiderada diretamente no espelho de conferência.';
  try {
    await salvarAjustesCompetenciaRep_(pis, String(data).slice(0, 7), [], [data]);
    agendarReprocessamentoRepLeve_(180, pis);
    mostrarToast('Marcação desconsiderada. O registro original continua na auditoria.', 'success');
  } catch (erro) {
    existente.desconsiderada = false;
    delete existente.ajusteJustificativa;
    mostrarToast('Não foi possível desconsiderar a marcação: ' + mensagemErro(erro), 'error');
  }
}

function abrirInsercaoMarcacaoDiaRep_(pis, data) {
  const id = 'rep-insercao-' + String(data || '').replace(/[^\d]/g, '');
  const area = document.getElementById(id);
  if (!area) return;
  area.hidden = false;
  area.innerHTML = `<div class="rep-insercao-direta"><div class="rep-insercao-direta-cabecalho"><strong>Adicionar uma marcação</strong><small>Mesmo recurso de “Adicionar marcação” da tela Ajustar.</small></div><div class="rep-insercao-direta-campos uma-marcacao"><input type="time" class="form-control rep-insercao-hora" aria-label="Horário da marcação"><input type="text" class="form-control rep-insercao-local" placeholder="Local" value="Local informado manualmente"><input type="text" class="form-control rep-insercao-motivo" placeholder="Motivo (opcional)"><button type="button" class="btn btn-primary" onclick="salvarInsercaoMarcacaoDiaRep_('${escapeHtml(String(pis))}','${escapeHtml(String(data))}')">Adicionar marcação</button><button type="button" class="btn btn-secondary" onclick="this.closest('[id^=rep-insercao-]').hidden=true">Cancelar</button></div></div>`;
  area.querySelector('.rep-insercao-hora')?.focus();
}

async function salvarInsercaoMarcacaoDiaRep_(pis, data) {
  const id = 'rep-insercao-' + String(data || '').replace(/[^\d]/g, '');
  const area = document.getElementById(id);
  const horarios = Array.from(area?.querySelectorAll('.rep-insercao-hora') || []).map(function(campo) { return campo.value; }).filter(Boolean);
  if (horarios.length !== 1) return mostrarToast('Informe o horário da marcação.', 'warning');
  const local = area.querySelector('.rep-insercao-local')?.value.trim() || 'Local informado manualmente';
  const justificativa = area.querySelector('.rep-insercao-motivo')?.value.trim() || 'Ajuste manual informado na conferência.';
  const novos = horarios.map(function(hora, indice) {
    const datetime = criarDataAjusteRep(data, hora);
    const idEvento = 'MANUAL|' + gerarUuidSeguroCliente_() + '|DIA|' + indice;
    return { pis: String(pis), datetime: datetime, clock: local, deviceSerial: 'AJUSTE MANUAL', nsr: 'MANUAL', lineNumber: '', eventId: idEvento, eventKey: 'AJUSTE|' + idEvento, nomeNoMomento: dadosRepCache.employees.get(String(pis)) || '', sourceFile: 'Ajuste direto no espelho', rawTimestamp: datetime?.getTime(), manual: true, ajusteCompartilhado: true, dataReferencia: data, ajusteOrigemData: data, justificativa: justificativa };
  });
  if (novos.some(function(item) { return !item.datetime; })) return mostrarToast('Há um horário inválido.', 'warning');
  const botao = area.querySelector('.btn-primary');
  if (botao) botao.disabled = true;
  try {
    await salvarAjustesCompetenciaRep_(pis, String(data).slice(0, 7), novos, [data]);
    dadosRepCache.punches.push.apply(dadosRepCache.punches, novos);
    area.hidden = true;
    agendarReprocessamentoRepLeve_(180, pis);
    mostrarToast('Marcação incluída no dia e identificada como ajuste manual.', 'success');
  } catch (erro) {
    mostrarToast('Não foi possível salvar as marcações: ' + mensagemErro(erro), 'error');
    if (botao) botao.disabled = false;
  }
}

function obterDebitoDiaDeclaracaoRep_() {
  const form = document.getElementById('form-lancamento');
  const tipo = document.getElementById('lanc-tipo')?.value;
  if (form?.dataset.origemRep !== 'sim' || document.getElementById('lanc-linha')?.value || !ehDeclaracaoHoras_(tipo)) return null;
  const data = document.getElementById('lanc-data-falta')?.value || '';
  const matricula = normalizarMatriculaRep_(document.getElementById('lanc-matricula')?.value);
  if (!matricula || !data) return { minutos: null, mensagem: 'Selecione o servidor e o dia para consultar as horas devidas.' };
  const dataBr = data.split('-').reverse().join('/');
  if (repOnlineCarregando) return { minutos: null, mensagem: 'Aguarde o carregamento do REP para consultar o débito do dia.' };
  const emp = (dadosRepProcessados || []).find(function(item) {
    const cadastro = obterServidorCadastroRep_(item);
    return cadastro && normalizarMatriculaRep_(cadastro.matricula) === matricula;
  });
  const dia = emp?.dias.find(function(item) { return item.dataOriginal === data; });
  if (!dia) return { minutos: null, mensagem: 'O dia ' + dataBr + ' não está disponível no espelho carregado. Você pode informar as horas manualmente.' };
  if (dia.pendencia) return { minutos: null, mensagem: 'Confira as batidas de ' + dataBr + ' antes de usar o débito como sugestão.' };
  const minutos = Math.max(0, Math.round(obterDeficitDiaRep_(dia) * 60));
  if (!Number.isFinite(minutos)) return { minutos: null, mensagem: 'Não foi possível calcular o débito deste dia. Informe as horas manualmente.' };
  return { minutos, mensagem: minutos > 0
    ? 'Horas devidas em ' + dataBr + ': ' + minutosParaHoraRep_(minutos) + 'h'
    : 'Não há horas devidas em ' + dataBr + ' no espelho atual.' };
}

function atualizarDebitoDiaDeclaracaoRep_() {
  let painel = document.getElementById('lanc-debito-dia-rep');
  const campo = document.getElementById('lanc-qtd-horas');
  if (!campo) return;
  if (!painel) {
    painel = document.createElement('div');
    painel.id = 'lanc-debito-dia-rep';
    painel.setAttribute('aria-live', 'polite');
    painel.style.cssText = 'display:none;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:10px;padding:12px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-tertiary)';
    painel.innerHTML = '<div style="display:grid;gap:4px;flex:1 1 220px"><strong class="rep-debito-dia-texto" style="font-size:12px"></strong><small style="font-size:11px;color:var(--text-secondary)">Use a sugestão se ela corresponder às horas justificadas no documento. O campo continua editável.</small></div><button type="button" class="btn btn-secondary" onclick="usarDebitoDiaDeclaracaoRep_()">Usar horas devidas</button>';
    campo.after(painel);
    campo.addEventListener('input', function() {
      delete campo.dataset.debitoRepContexto;
      delete campo.dataset.debitoRepValor;
    });
    document.getElementById('lanc-data-falta')?.addEventListener('input', atualizarDebitoDiaDeclaracaoRep_);
    document.getElementById('lanc-data-falta')?.addEventListener('change', atualizarDebitoDiaDeclaracaoRep_);
  }
  const debito = obterDebitoDiaDeclaracaoRep_();
  const contexto = debito ? normalizarMatriculaRep_(document.getElementById('lanc-matricula')?.value) + '|' + document.getElementById('lanc-data-falta')?.value : '';
  if (campo.dataset.debitoRepContexto && campo.dataset.debitoRepContexto !== contexto) {
    if (campo.value === campo.dataset.debitoRepValor) {
      campo.value = '';
      campo.dispatchEvent(new Event('input', { bubbles: true }));
    }
    delete campo.dataset.debitoRepContexto;
    delete campo.dataset.debitoRepValor;
  }
  painel.style.display = debito ? 'flex' : 'none';
  if (!debito) return;
  painel.querySelector('.rep-debito-dia-texto').textContent = debito.mensagem;
  const botao = painel.querySelector('button');
  botao.disabled = !debito.minutos || debito.minutos > 1439;
  botao.textContent = debito.minutos > 0 ? 'Usar ' + minutosParaHoraRep_(debito.minutos) + 'h' : 'Usar horas devidas';
}

function usarDebitoDiaDeclaracaoRep_() {
  // Reconsulta o estado atual ao clicar, sem reaproveitar um saldo de outro dia.
  const debito = obterDebitoDiaDeclaracaoRep_();

  campo.dataset.debitoRepValor = campo.value;
  campo.focus({ preventScroll: true });
}

function formatarDuracaoMensagemRep_(minutos) {
  const total = Math.max(0, Math.round(Number(minutos) || 0));
  if (total < 60) return total + (total === 1 ? ' minuto' : ' minutos');
  return Math.floor(total / 60) + 'h' + (total % 60 ? String(total % 60).padStart(2,'0') : '');
}

function explicarPendenciaMensagemRep_(dia, minutos) {
  const motivos = [];
  const excedentes = dia.batidasExcedentes || dia.status === 'batidas_excedentes';
  const impar = dia.isImpar || dia.status === 'impar';
  if (dia.semRegistro && minutos > 0) motivos.push('Não há marcações de ponto. Ainda há ' + formatarDuracaoMensagemRep_(minutos) + ' para justificar ou compensar.');
  if (excedentes) motivos.push('Há mais marcações que o esperado. Precisamos conferir possíveis duplicidades.');
  else if (impar) motivos.push('Falta uma entrada ou saída.');
  if (dia.colisaoReps || dia.status === 'colisao_reps') motivos.push('O mesmo horário aparece em mais de um relógio; precisamos confirmar a marcação correta.');
  if (dia.conflitoArredondamento || dia.status === 'conflito_arredondamento') motivos.push('Dois horários diferentes ficaram iguais no cálculo do ponto. Precisamos confirmar as marcações originais.');
  if (dia.ausencia && !dia.semRegistro && dia.status === 'ausencia_com_batidas') motivos.push('Consta ' + (dia.ausencia.tipo || 'uma justificativa') + ' neste dia, mas também há marcações. Confirme se houve trabalho no dia.');
  if (!dia.semRegistro && minutos > 0) motivos.push('A jornada ficou ' + formatarDuracaoMensagemRep_(minutos) + ' abaixo do previsto.');
  if ((impar && !excedentes) || dia.conflitoArredondamento || dia.status === 'conflito_arredondamento') {
    const horarios = String(dia.batidasOriginais || (dia.batidas || []).join(' · ')).trim();
    if (horarios) motivos.push('Horários registrados: ' + horarios.replace(/\s+-\s+/g,' · ') + '.');
  }
  return motivos.join(' ') || 'Precisamos conferir as marcações deste dia.';
}

function montarMensagemPendenciasMesRep_(emp, competencia, autorizacoes, compensacoes) {
  if (!emp || !/^\d{4}-(0[1-9]|1[0-2])$/.test(String(competencia || ''))) throw new Error('Selecione a pessoa, o ano e o mês.');
  const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const rotulo = meses[Number(competencia.slice(5)) - 1] + '/' + competencia.slice(0,4);
  const dataBr = function(data) { return String(data).split('-').reverse().join('/'); };
  const dias = (emp.dias || []).filter(function(dia) { return String(dia.dataOriginal || '').slice(0,7) === competencia; }).slice().sort(function(a,b) { return a.dataOriginal.localeCompare(b.dataOriginal); });
  const linhas = ['Olá, ' + String(emp.nome || 'servidor(a)').trim() + '!', '', '*Conferência do ponto — ' + rotulo + '*'];
  let diasPendentes = 0, minutosDevidos = 0, diasSemCalculo = 0;
  const pendencias = [];
  dias.forEach(function(dia) {
    const alertas = obterAlertasAtivosDiaRep_(dia, emp.pis);
    if (!alertas.length) return;
    const minutos = Math.max(0, Math.round(obterDeficitDiaRep_(dia) * 60));
    const marcacoesCompletas = !dia.semRegistro && !dia.pendencia && (dia.batidas || []).length > 0 && dia.batidas.length % 2 === 0;
    // Tolerância apenas no comunicado, sem alterar o saldo ou validar o ponto.
    if (marcacoesCompletas && minutos > 0 && minutos <= 10 && alertas.every(function(item) { return item.tipo === 'Jornada incompleta / horas devidas'; })) return;
    diasPendentes++;
    minutosDevidos += minutos;
    if (dia.pendencia) diasSemCalculo++;
    pendencias.push('• ' + dataBr(dia.dataOriginal) + ' — ' + explicarPendenciaMensagemRep_(dia, minutos));
  });
  if (emp.naoConciliado) linhas.push('', 'O RH precisa conferir sua identificação no cadastro do ponto.');
  if (pendencias.length) {
    linhas.push('', '*Pendências a regularizar:*', ...pendencias);
    if (minutosDevidos > 0) linhas.push('', '*' + (diasSemCalculo ? 'Horas já apuradas para regularizar: ' : 'Total de horas a regularizar: ') + formatarDuracaoMensagemRep_(minutosDevidos) + '*');
  } else linhas.push('', 'Não há ajustes de ponto a solicitar neste mês.');
  if (diasSemCalculo) linhas.push(minutosDevidos > 0 ? 'Esse total pode mudar após a conferência dos horários acima.' : 'As horas devidas serão confirmadas depois de conferir esses horários.');

  const limites = new Map(), usados = new Map();
  (autorizacoes || []).forEach(function(item) {
    if (normalizarPisRep(item.pis) !== normalizarPisRep(emp.pis)) return;
    limites.set(item.data, Math.max(limites.get(item.data) || 0, Math.max(0, Math.round(Number(item.minutos) || 0))));
  });
  (compensacoes || []).forEach(function(item) {
    if (normalizarPisRep(item.pis) !== normalizarPisRep(emp.pis) || !(Number(item.minutos) > 0)) return;
    (item.origens || []).forEach(function(origem) {
      usados.set(origem.data, (usados.get(origem.data) || 0) + Math.max(0, Math.round(Number(origem.minutos) || 0)));
      if (Number(origem.autorizado) > 0) limites.set(origem.data, Math.max(limites.get(origem.data) || 0, Math.round(Number(origem.autorizado))));
    });
  });
  // Compensações antigas podem não ter a origem gravada; a apuração atual
  // ainda conhece de quais dias as horas foram retiradas. Não conta duas vezes.
  const usadosCalculados = new Map();
  dias.forEach(function(dia) {
    (dia.compensacao?.origensAplicadas || []).forEach(function(origem) {
      usadosCalculados.set(origem.data, (usadosCalculados.get(origem.data) || 0) + Math.max(0, Math.round(Number(origem.minutos) || 0)));
    });
  });
  usadosCalculados.forEach(function(minutos, data) { usados.set(data, Math.max(usados.get(data) || 0, minutos)); });
  const diasPorData = new Map(dias.map(function(dia) { return [dia.dataOriginal, dia]; }));
  const origens = (emp.resumo?.origensSaldoCompensacao || []).filter(function(item) {
    const dia = diasPorData.get(item.data);
    return dia && !dia.pendencia && !dia.ausencia && Number(item.minutos) > 0;
  }).slice().sort(function(a,b) { return a.data.localeCompare(b.data); });
  let saldoTotal = 0, autorizadoTotal = 0;
  if (origens.length) linhas.push('', '*Horas disponíveis para compensação*', 'Estes dias ainda têm saldo para utilizar:');
  origens.forEach(function(origem) {
    const saldo = Math.max(0, Math.round(Number(origem.minutos)));
    const autorizado = Math.min(saldo, Math.max(0, (limites.get(origem.data) || 0) - (usados.get(origem.data) || 0)));
    saldoTotal += saldo;
    autorizadoTotal += autorizado;
    linhas.push('• ' + dataBr(origem.data) + ' — saldo de ' + formatarDuracaoMensagemRep_(saldo) + '.');
  });
  if (origens.length) {
    linhas.push('Total disponível: ' + formatarDuracaoMensagemRep_(saldoTotal) + '.', 'O uso dessas horas precisa ser confirmado com o RH.');
  } else if (minutosDevidos > 0) linhas.push('', 'Não há horas disponíveis para compensação neste mês.');
  if (pendencias.length) {
    const acoes = [];
    if (diasSemCalculo > 0) acoes.push('1. *Falta de batida:* informe o horário em que você entrou ou saiu.');
    if (minutosDevidos > 0) {
      if (origens.length > 0) {
        acoes.push((acoes.length + 1) + '. *Falta ou horas devidas:* envie o atestado/declaração ou autorize abater do seu saldo de horas.');
      } else {
        acoes.push((acoes.length + 1) + '. *Falta ou horas devidas:* envie o comprovante (atestado médico ou declaração).');
      }
    }
    if (!acoes.length) acoes.push('1. *Conferência de horários:* confirme os horários corretos trabalhados nas datas acima.');
    linhas.push('', '*O que você precisa fazer:*', ...acoes, '', '👉 Responda diretamente a esta mensagem com as informações ou documentos para acertarmos o seu ponto.');
  }
  return { texto: linhas.join('\n'), diasPendentes, minutosDevidos, saldoTotal, autorizadoTotal };
}

async function copiarPendenciasMesRep_(pis) {
  try {
    const competencia = obterCompetenciaAtualRep_();
    if (!competencia) throw new Error('Selecione um ano e um mês específicos.');
    if (!pis || buscaRepAguardandoSelecao_) throw new Error('Clique no nome da pessoa antes de copiar as pendências.');
    if (repOnlineCarregando || (falhasIntegridadeRep || []).length) throw new Error('Conclua o carregamento íntegro dos arquivos REP antes de copiar as pendências.');
    if (repTemAlteracoesPendentes_() || (typeof existemGravacoesPendentes_ === 'function' && existemGravacoesPendentes_())) throw new Error('Aguarde a conclusão dos salvamentos antes de copiar a situação atual.');
    // Apuração somente desta pessoa, com todos os relógios do mês. Os filtros
    // visuais de dias e locais não podem esconder pendências da mensagem.
    const emp = obterServidoresCompetenciaRelatorioAlertasRep_(competencia, pis).find(function(item) { return normalizarPisRep(item.pis) === normalizarPisRep(pis); });
    if (!emp) throw new Error('Não há um espelho carregado para esta pessoa no mês selecionado.');
    const mensagem = montarMensagemPendenciasMesRep_(emp, competencia, autorizacoesCompensacaoRep, compensacoesRep);
    await copiarTextoPendenciasRep_(mensagem.texto);
  } catch (erro) { mostrarToast(mensagemErro(erro), 'warning'); }
}

async function copiarTextoPendenciasRep_(texto) {
  try {
    if (!navigator.clipboard?.writeText) throw new Error('Cópia direta indisponível');
    await navigator.clipboard.writeText(texto);
  } catch (_) {
    const focoAnterior = document.activeElement;
    const campo = document.createElement('textarea');
    campo.value = texto;
    campo.setAttribute('readonly', '');
    campo.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(campo);
    campo.select();
    let copiado = false;
    try { copiado = document.execCommand('copy'); } catch (_) {}
    campo.remove();
    focoAnterior?.focus({ preventScroll: true });
    if (!copiado) return mostrarMensagemPendenciasParaCopiarRep_(texto);
  }
  mostrarToast('Pendências do mês copiadas. Confira o texto e cole no WhatsApp.', 'success');
}

function mostrarMensagemPendenciasParaCopiarRep_(texto) {
  let modal = document.getElementById('modal-mensagem-pendencias-rep');
  if (!modal) {
    modal = document.createElement('div');

function inicializarArrastarArquivosCartaoIA_(modal) {
  modal.querySelectorAll('.rep-cartao-ia-arquivo').forEach(function(area) {
    const input = area.querySelector('input[type="file"]');
    if (!input || area.dataset.dropConfigurado) return;
    area.dataset.dropConfigurado = 'sim';
    const lado = input.id.endsWith('-verso') ? 'verso' : 'frente';
    atualizarArquivoCartaoIA_(input, lado);
    area.addEventListener('dragover', function(evento) {
      evento.preventDefault(); evento.stopPropagation();
      if (evento.dataTransfer) evento.dataTransfer.dropEffect = 'copy';
      area.classList.add('arrastando');
    });
    area.addEventListener('dragleave', function(evento) {
      if (!area.contains(evento.relatedTarget)) area.classList.remove('arrastando');
    });
    area.addEventListener('drop', function(evento) {
      evento.preventDefault(); evento.stopPropagation();
      area.classList.remove('arrastando');
      const arquivos = Array.from(evento.dataTransfer && evento.dataTransfer.files || []);
      if (arquivos.length !== 1) return mostrarToast('Solte um arquivo por campo: frente ou verso.', 'warning');
      const arquivo = arquivos[0];
      if (!/^(image\/(jpeg|png|webp)|application\/pdf)$/i.test(String(arquivo.type || ''))) return mostrarToast('Use JPG, PNG, WEBP ou PDF.', 'warning');
      if (arquivo.size > 8 * 1024 * 1024) return mostrarToast('O arquivo ultrapassa 8 MB.', 'warning');
      try {
        const transferencia = new DataTransfer();
        transferencia.items.add(arquivo);
        input.files = transferencia.files;
        atualizarArquivoCartaoIA_(input, lado);
      } catch (e) {
        mostrarToast('O navegador não aceitou o arquivo arrastado. Clique no campo para selecioná-lo.', 'warning');

    });
  });
}

function prepararArquivoCartaoIA_(arquivo) {
  return new Promise(function(resolve, reject) {
    const tipo = String(arquivo?.type || '').toLowerCase();
    if (!arquivo || !/^(image\/(jpeg|png|webp)|application\/pdf)$/i.test(tipo)) return reject(new Error('Use JPG, PNG, WEBP ou PDF.'));
    if (tipo === 'application/pdf') {
      if (arquivo.size > 8 * 1024 * 1024) return reject(new Error('O PDF ultrapassa 8 MB. Reduza-o antes de tentar novamente.'));
      const leitor = new FileReader();
      leitor.onerror = function() { reject(new Error('Não foi possível abrir o PDF.')); };
      leitor.onload = function() {
        const base64 = String(leitor.result || '').split(',')[1] || '';
        if (!base64) return reject(new Error('Não foi possível preparar o PDF.'));
        resolve({ mimeType: 'application/pdf', base64: base64, nome: arquivo.name || 'cartao.pdf' });
      };
      leitor.readAsDataURL(arquivo);
      return;
    }
    if (arquivo.size > 20 * 1024 * 1024) return reject(new Error('A imagem original ultrapassa 20 MB. Reduza-a antes de tentar novamente.'));
    const url = URL.createObjectURL(arquivo);
    const imagem = new Image();
    imagem.onload = function() {
      try {
        const maiorLado = Math.max(imagem.naturalWidth, imagem.naturalHeight);
        const escalaInicial = Math.min(1, 2400 / Math.max(1, maiorLado));
        let largura = Math.max(1, Math.round(imagem.naturalWidth * escalaInicial));
        let altura = Math.max(1, Math.round(imagem.naturalHeight * escalaInicial));
        let qualidade = 0.9;
        let dataUrl = '';
        for (let tentativa = 0; tentativa < 5; tentativa++) {
          const canvas = document.createElement('canvas');
          canvas.width = largura;
          canvas.height = altura;
          const contexto = canvas.getContext('2d', { alpha: false });
          if (!contexto) throw new Error('O navegador não conseguiu preparar a imagem. Atualize a página e tente novamente.');
          contexto.fillStyle = '#ffffff';
          contexto.fillRect(0, 0, largura, altura);
          contexto.drawImage(imagem, 0, 0, largura, altura);
          dataUrl = canvas.toDataURL('image/jpeg', qualidade);
          if (Math.floor(dataUrl.length * 3 / 4) <= 5.7 * 1024 * 1024) break;
          largura = Math.max(900, Math.round(largura * 0.82));
          altura = Math.max(900, Math.round(altura * 0.82));
          qualidade = Math.max(0.68, qualidade - 0.07);
        }
        const base64 = String(dataUrl.split(',')[1] || '');
        if (!base64) throw new Error('Não foi possível preparar a imagem.');
        resolve({ mimeType: 'image/jpeg', base64: base64, nome: arquivo.name || 'cartao.jpg' });
      } catch (erro) {
        reject(erro);
      } finally {
        URL.revokeObjectURL(url);
      }
    };
    imagem.onerror = function() { URL.revokeObjectURL(url); reject(new Error('Não foi possível abrir uma das imagens.')); };
    imagem.src = url;
  });
}

async function prepararPaginasPdfCartaoIA_(arquivo, quantidadeEsperada) {
  if (!window.pdfjsLib) throw new Error('O leitor de PDF não carregou. Atualize a página ou envie frente e verso como imagens.');
  if (arquivo.size > 8 * 1024 * 1024) throw new Error('O PDF ultrapassa 8 MB. Reduza-o antes de tentar novamente.');
  let documento;
  try {
    const bytes = new Uint8Array(await arquivo.arrayBuffer());
    documento = await window.pdfjsLib.getDocument({ data: bytes }).promise;
    if (documento.numPages !== quantidadeEsperada) {
      throw new Error(quantidadeEsperada === 2
        ? 'O PDF completo deve ter exatamente duas páginas: frente e verso.'
        : 'Cada PDF separado deve conter somente a página do lado escolhido.');
    }
    const paginas = [];
    for (let numero = 1; numero <= documento.numPages; numero++) {
      const pagina = await documento.getPage(numero);
      const tamanho = pagina.getViewport({ scale: 1 });
      let escala = Math.min(3, 2400 / Math.max(tamanho.width, tamanho.height));
      let qualidade = 0.88;
      let base64 = '';
      for (let tentativa = 0; tentativa < 5; tentativa++) {
        const viewport = pagina.getViewport({ scale: escala });
        const canvas = document.createElement('canvas');
        canvas.width = Math.ceil(viewport.width);
        canvas.height = Math.ceil(viewport.height);
        const contexto = canvas.getContext('2d', { alpha: false });
        if (!contexto) throw new Error('Não foi possível preparar a imagem do PDF.');
        contexto.fillStyle = '#ffffff';
        contexto.fillRect(0, 0, canvas.width, canvas.height);
        await pagina.render({ canvasContext: contexto, viewport: viewport }).promise;
        base64 = canvas.toDataURL('image/jpeg', qualidade).split(',')[1] || '';
        canvas.width = 0;
        canvas.height = 0;
        if (Math.floor(base64.length * 3 / 4) <= 5.7 * 1024 * 1024) break;
        escala *= 0.82;
        qualidade = Math.max(0.68, qualidade - 0.06);
      }
      if (!base64 || Math.floor(base64.length * 3 / 4) > 5.7 * 1024 * 1024) throw new Error('Uma página do PDF ficou grande demais para leitura. Reduza a resolução.');
      paginas.push({ mimeType: 'image/jpeg', base64: base64, nome: (arquivo.name || 'cartao.pdf') + ' · página ' + numero });
      pagina.cleanup();
    }
    return paginas;
  } finally {
    if (documento) await documento.destroy();
  }
}

    const campos = Array.from(linha.querySelectorAll('.rep-lote-hora'));
    (dia.marcacoes || []).slice(0, 6).forEach(function(horario, indice) {
      if (!horario || !campos[indice] || campos[indice].readOnly) return;
      const campo = campos[indice];
      if (campo.value && campo.value !== horario && campo.dataset.preenchidoIa !== 'sim') {
        preservadas++;
        linha.classList.add('rep-cartao-ia-revisao');
        return;
      }
      const confianca = String((dia.confiancas || [])[indice] || 'media');
      campo.value = horario;
      campo.dataset.preenchidoIa = 'sim';
      campo.dataset.diaOffset = String(Number((dia.offsets || [])[indice] || 0));
      campo.classList.toggle('rep-cartao-ia-alta', confianca === 'alta');
      campo.classList.toggle('rep-cartao-ia-incerta', confianca !== 'alta');
      campo.title = confianca === 'alta' ? 'Preenchido pela IA com confiança alta; confira antes de salvar.' : 'Leitura incerta da IA; confira esta marcação.';
      const botaoMaisUm = campo.closest('.rep-cartao-horario')?.querySelector('.rep-dia-seguinte');
      const offset = Number(campo.dataset.diaOffset || 0);
      if (botaoMaisUm) {
        botaoMaisUm.classList.toggle('ativo', offset === 1);
        botaoMaisUm.setAttribute('aria-pressed', offset === 1 ? 'true' : 'false');
      }
      if (confianca !== 'alta') { incertas++; linha.classList.add('rep-cartao-ia-revisao'); }
      preenchidas++;
    });
    if (dia.observacao) {
      linha.classList.add('rep-cartao-ia-revisao');
      linha.title = dia.observacao;
    }
  });
  if (preenchidas) modal.dataset.dirty = 'sim';
  const avisos = Array.isArray(resultado.avisos) ? resultado.avisos : [];
  const resultadoEl = document.getElementById('rep-cartao-ia-resultado');
  if (resultadoEl) {
    resultadoEl.hidden = false;
    resultadoEl.innerHTML = `<strong>${preenchidas} horário(s) colocado(s) para conferência</strong><span>${incertas ? incertas + ' marcação(ões) destacada(s) em amarelo precisam de atenção.' : 'As leituras estão em verde, mas ainda precisam de sua conferência.'}${preservadas ? ' ' + preservadas + ' campo(s) já preenchido(s) foram preservados.' : ''}</span>${avisos.length ? `<ul>${avisos.slice(0, 6).map(function(item) { return '<li>' + escapeHtml(item) + '</li>'; }).join('')}</ul>` : ''}<small>Nada foi salvo. Revise a tabela e use “Salvar todos os ajustes” somente quando estiver correto.</small>`;
  }
  return { preenchidas: preenchidas, incertas: incertas, preservadas: preservadas };
}

async function analisarCartaoManualIA_() {
  const modal = document.getElementById('modal-lancamentos-lote-rep');
  const frenteInput = document.getElementById('rep-cartao-ia-frente');
  const versoInput = document.getElementById('rep-cartao-ia-verso');
  const frente = frenteInput?.files?.[0];
  const verso = versoInput?.files?.[0];
  if (!modal) return mostrarToast('Abra o cartão manual antes de iniciar a leitura.', 'warning');
  if (!frente) return mostrarToast('Escolha a frente do cartão ou um PDF com as duas páginas.', 'warning');
  const frenteEhPdf = String(frente.type || '').toLowerCase() === 'application/pdf' || /\.pdf$/i.test(frente.name || '');
  if (!verso && !frenteEhPdf) return mostrarToast('Escolha também o verso ou envie um PDF com as duas páginas.', 'warning');
  const botao = document.getElementById('rep-cartao-ia-analisar');
  const status = document.getElementById('rep-cartao-ia-status');
  let progressoLeitura = null;
  const competenciaLeitura = modal?.dataset.competencia || '';
  const pisLeitura = modal?.dataset.pis || '';
  const sessaoLeitura = {};
  modal._sessaoLeituraCartaoIA = sessaoLeitura;
  modal.dataset.leituraIaEmAndamento = 'sim';
  if (botao) botao.disabled = true;
  if (status) status.textContent = frenteEhPdf ? 'Convertendo as páginas do PDF em imagens neste navegador...' : 'Preparando as imagens sem salvá-las...';
  registrarAtividadeSegundoPlano_('ANALISANDO', 'Leitura do cartão manual', 'Preparando frente e verso para reconhecimento dos horários.');
  try {
    const versoEhPdf = Boolean(verso && (String(verso.type || '').toLowerCase() === 'application/pdf' || /\.pdf$/i.test(verso.name || '')));
    let leitura = modal._leituraParcialCartaoIA;
    if (!leitura || leitura.frente !== frente || leitura.verso !== verso || leitura.competencia !== competenciaLeitura || leitura.pis !== pisLeitura) {
      const frentePreparada = frenteEhPdf ? await prepararPaginasPdfCartaoIA_(frente, verso ? 1 : 2) : [await prepararArquivoCartaoIA_(frente)];
      const versoPreparado = verso ? (versoEhPdf ? await prepararPaginasPdfCartaoIA_(verso, 1) : [await prepararArquivoCartaoIA_(verso)]) : [];
      leitura = { frente: frente, verso: verso, competencia: competenciaLeitura, pis: pisLeitura, arquivos: frentePreparada.concat(versoPreparado), resultados: [] };
      modal._leituraParcialCartaoIA = leitura;
    }
    const arquivos = leitura.arquivos;
    arquivos[0].lado = 'frente';
    if (arquivos[1]) arquivos[1].lado = 'verso';
    if (status) status.textContent = 'A IA está lendo as anotações e conferindo a ordem dos horários...';
    registrarAtividadeSegundoPlano_('ENVIANDO', 'Leitura do cartão manual', 'Analisando ' + arquivos.length + ' arquivo(s) temporário(s); nenhuma marcação será salva nesta etapa.');
    let inicioLeitura = Date.now();
    let etapaLeitura = 'frente';
    progressoLeitura = setInterval(function() {
      if (!status || !status.isConnected) return;
      const segundos = Math.max(0, Math.floor((Date.now() - inicioLeitura) / 1000));
      status.textContent = 'Lendo ' + etapaLeitura + ': ' + segundos + ' s. ' + (segundos >= 75
        ? 'Se um provedor não responder no prazo, o servidor tenta a próxima alternativa disponível. Os arquivos permanecem selecionados.'
        : 'A proposta será exibida para conferência; nenhuma marcação está sendo salva.');
    }, 1000);
    for (let indice = 0; indice < arquivos.length; indice++) {
      if (leitura.resultados[indice]) continue;
      if (modal._sessaoLeituraCartaoIA !== sessaoLeitura || modal.dataset.competencia !== competenciaLeitura || (modal.dataset.pis || '') !== pisLeitura) throw new Error('O cartão aberto mudou. A leitura anterior não será aplicada.');
      etapaLeitura = arquivos[indice].lado;
      inicioLeitura = Date.now();
      if (status) status.textContent = 'Lendo ' + etapaLeitura + ' (' + (indice + 1) + '/' + arquivos.length + '). ' + (indice ? 'A frente já foi lida e está preservada nesta janela.' : 'Nenhuma marcação será salva.');
      registrarAtividadeSegundoPlano_('ENVIANDO', 'Leitura do cartão manual · ' + etapaLeitura, 'Analisando somente ' + etapaLeitura + '; partes já concluídas não serão reenviadas.');
      leitura.resultados[indice] = await new Promise(function(resolve, reject) {
        backendApi().withSuccessHandler(resolve).withFailureHandler(reject).analisarCartaoPontoManualIA({ competencia: competenciaLeitura, parte: etapaLeitura, arquivos: [arquivos[indice]] });
      });
    }
    if (modal._sessaoLeituraCartaoIA !== sessaoLeitura || modal.dataset.competencia !== competenciaLeitura || (modal.dataset.pis || '') !== pisLeitura || frenteInput.files?.[0] !== frente || versoInput.files?.[0] !== verso) throw new Error('O cartão ou os arquivos mudaram. A leitura anterior não será aplicada.');
    const resultado = { dias: leitura.resultados.flatMap(function(item) { return item.dias || []; }), avisos: leitura.resultados.flatMap(function(item) { return item.avisos || []; }) };
    if (!resultado.dias.length) throw new Error('Nenhum horário foi reconhecido. Confira as imagens; nenhuma marcação foi salva.');
    clearInterval(progressoLeitura);
    progressoLeitura = null;
    const resumo = aplicarLeituraCartaoIA_(resultado || {});
    if (status) status.textContent = 'Leitura concluída. Confira os horários destacados antes de salvar.';
    registrarAtividadeSegundoPlano_('CONFIRMADA', 'Leitura do cartão manual', resumo.preenchidas + ' horário(s) preparados para conferência; nenhum dado salvo automaticamente.');
    frenteInput.value = '';
    versoInput.value = '';
    delete modal._leituraParcialCartaoIA;
    atualizarArquivoCartaoIA_(frenteInput, 'frente');
    atualizarArquivoCartaoIA_(versoInput, 'verso');
    mostrarToast('A proposta foi preenchida. Confira os horários antes de salvar.', resumo.incertas ? 'warning' : 'success');
  } catch (erro) {
    const mensagem = mensagemErro(erro).replace(/^(?:(?:Error|Erro):\s*|A leitura não foi concluída[.:]\s*)+/i, '');
    if (status) status.textContent = 'A leitura não foi concluída: ' + mensagem;
    registrarAtividadeSegundoPlano_('ERRO', 'Leitura do cartão manual', mensagem);
    mostrarToast(mensagem, 'error');
  } finally {
    if (progressoLeitura !== null) clearInterval(progressoLeitura);
    if (modal._sessaoLeituraCartaoIA === sessaoLeitura) delete modal.dataset.leituraIaEmAndamento;
    if (botao) botao.disabled = false;
  }
}

function adicionarLinhaCompensacaoLoteRep_(data, horas) {
  const corpo = document.getElementById('rep-lote-compensacoes');
  if (!corpo) return;
  const tr = document.createElement('tr');
  tr.dataset.deficitSugerido = horas || '';
  tr.innerHTML = `<td><input type="date" class="form-control rep-lote-data" value="${escapeHtml(data || '')}" onchange="renderizarOrigensCompensacaoLoteRep_(this.closest('tr'))"></td><td class="rep-lote-origens"></td><td><label class="rep-lote-meta-dia"><small>Quanto compensar</small><input type="text" class="form-control rep-lote-meta-dia-valor" value="${escapeHtml(horas || '')}" placeholder="00:00" maxlength="5" inputmode="numeric" oninput="atualizarTotalCompensacaoLoteRep_(this.closest('tr'))"></label><button type="button" class="rep-ajustar-dia" onclick="usarTodoDebitoLoteRep_(this)">Usar horas devidas</button><small class="rep-lote-total-lancado"></small><input type="text" class="form-control rep-lote-horas" value="" placeholder="00:00" readonly></td><td><input type="text" class="form-control rep-lote-observacao" placeholder="Opcional"></td><td><button type="button" class="rep-lote-remove" title="Remover linha" onclick="this.closest('tr').remove()"><span data-lucide="trash-2"></span></button></td>`;
  // Primeiro define o débito desejado, depois escolhe/distribui as origens.
  tr.insertBefore(tr.children[2], tr.children[1]);
  corpo.appendChild(tr);
  renderizarOrigensCompensacaoLoteRep_(tr);
  renderizarIcones();
}

function adicionarLinhaAutorizacaoCompensacaoLoteRep_(data, limite) {
  const corpo = document.getElementById('rep-lote-autorizacoes');
  if (!corpo) return;
  const linha = document.createElement('div');
  linha.className = 'rep-lote-autorizacao';
  linha.innerHTML = `<span class="rep-lote-autorizacao-ordem" title="Ordem informada no documento"></span><label><small>Dia com hora extra</small><input type="date" class="form-control rep-lote-autorizacao-data" value="${escapeHtml(data || '')}" onchange="atualizarAutorizacoesCompensacaoLoteRep_()"></label><label><small>Máximo autorizado</small><input type="text" class="form-control rep-lote-autorizacao-limite" value="${escapeHtml(limite || '')}" placeholder="00:00" maxlength="5" inputmode="numeric" oninput="atualizarAutorizacoesCompensacaoLoteRep_()"></label><button type="button" class="rep-ajustar-dia" onclick="usarTodoSaldoAutorizacaoRep_(this)">Usar todo saldo</button><span class="rep-lote-autorizacao-saldo"></span><span class="rep-lote-autorizacao-acoes"><button type="button" title="Subir na ordem do documento" onclick="moverAutorizacaoCompensacaoLoteRep_(this,-1)"><span data-lucide="chevron-up"></span></button><button type="button" title="Descer na ordem do documento" onclick="moverAutorizacaoCompensacaoLoteRep_(this,1)"><span data-lucide="chevron-down"></span></button><button type="button" class="rep-lote-remove" title="Remover autorização" onclick="this.closest('.rep-lote-autorizacao').remove();atualizarAutorizacoesCompensacaoLoteRep_()"><span data-lucide="trash-2"></span></button></span>`;
  corpo.appendChild(linha);
  atualizarAutorizacoesCompensacaoLoteRep_();
  renderizarIcones();
}

function moverAutorizacaoCompensacaoLoteRep_(botao, direcao) {
  const linha = botao && botao.closest('.rep-lote-autorizacao');
  const corpo = linha && linha.parentElement;
  if (!linha || !corpo) return;
  if (direcao < 0 && linha.previousElementSibling) corpo.insertBefore(linha, linha.previousElementSibling);
  if (direcao > 0 && linha.nextElementSibling) corpo.insertBefore(linha.nextElementSibling, linha);
  atualizarAutorizacoesCompensacaoLoteRep_();
}

function obterUsoCompensacaoExistenteLoteRep_(destinosIgnorar) {
  const emp = obterServidorSelecionadoRep_();
  const uso = new Map();
  const ignorar = destinosIgnorar instanceof Set
    ? destinosIgnorar
    : new Set(Array.isArray(destinosIgnorar) ? destinosIgnorar : (destinosIgnorar ? [destinosIgnorar] : []));
  (compensacoesRep || []).filter(function(item) {
    return emp && normalizarPisRep(item.pis) === normalizarPisRep(emp.pis) && Number(item.minutos || 0) > 0 && !ignorar.has(item.data);
  }).forEach(function(item) {
    (Array.isArray(item.origens) ? item.origens : []).forEach(function(origem) {
      uso.set(origem.data, (uso.get(origem.data) || 0) + Math.max(0, Math.round(Number(origem.minutos || 0))));
    });
  });
  return uso;
}

function obterAutorizacoesCompensacaoLoteRep_(validar, destinosIgnorar) {
  const autorizacoes = new Map();
  const usoExistente = obterUsoCompensacaoExistenteLoteRep_(destinosIgnorar);
  Array.from(document.querySelectorAll('#rep-lote-autorizacoes .rep-lote-autorizacao')).forEach(function(linha) {
    const data = linha.querySelector('.rep-lote-autorizacao-data').value;
    const texto = linha.querySelector('.rep-lote-autorizacao-limite').value.trim();
    const minutos = lerDuracaoCompensacaoLoteRep_(texto);
    const jaUsado = usoExistente.get(data) || 0;
    linha.classList.toggle('input-error', Boolean((data || texto) && (!data || minutos === null || minutos <= 0 || minutos < jaUsado || autorizacoes.has(data))));
    if (!data && !texto) return;
    if (!data || minutos === null || minutos <= 0) { if (validar) throw new Error('Preencha o dia e o limite de cada autorização de compensação.'); return; }
    if (minutos < jaUsado) { if (validar) throw new Error('Já foram usados ' + minutosParaHoraRep_(jaUsado) + 'h do dia ' + data.split('-').reverse().join('/') + '; o limite não pode ser menor.'); return; }
    if (autorizacoes.has(data)) { if (validar) throw new Error('O dia ' + data.split('-').reverse().join('/') + ' aparece duas vezes nas autorizações.'); return; }
    autorizacoes.set(data, minutos);
  });
  return autorizacoes;
}

function atualizarAutorizacoesCompensacaoLoteRep_() {
  const emp = obterServidorProjetadoLoteRep_();
  const saldos = new Map(((emp && emp.resumo.origensSaldoCompensacao) || []).map(function(item) { return [item.data, Math.max(0, Math.round(Number(item.minutosBrutos != null ? item.minutosBrutos : item.minutos || 0)))]; }));
  const destinosNoForm = new Set(Array.from(document.querySelectorAll('#rep-lote-compensacoes .rep-lote-data')).map(function(c) { return c.value; }).filter(Boolean));
  (emp?.dias || []).filter(function(d) { return destinosNoForm.has(d.dataOriginal); }).forEach(function(d) {
    (d.compensacao?.origensAplicadas || []).forEach(function(origem) {
      saldos.set(origem.data, (saldos.get(origem.data) || 0) + Math.max(0, Math.round(Number(origem.minutos || 0))));
    });
  });
  const usoExistente = obterUsoCompensacaoExistenteLoteRep_(destinosNoForm);
  document.querySelectorAll('#rep-lote-autorizacoes .rep-lote-autorizacao').forEach(function(linha, indice) {
    linha.dataset.ordem = String(indice + 1);
    const marcador = linha.querySelector('.rep-lote-autorizacao-ordem');
    if (marcador) marcador.textContent = String(indice + 1) + 'º';
    const data = linha.querySelector('.rep-lote-autorizacao-data').value;
    const saldo = saldos.get(data) || 0;
    const usado = usoExistente.get(data) || 0;
    linha.querySelector('.rep-lote-autorizacao-saldo').textContent = data ? 'Disponível: ' + formatarDuracaoCompensacaoLoteRep_(saldo) + ' · já usado: ' + formatarDuracaoCompensacaoLoteRep_(usado) : '';
    const pedido = lerDuracaoCompensacaoLoteRep_(linha.querySelector('.rep-lote-autorizacao-limite').value.trim());
    if (data && pedido > saldo + usado) linha.querySelector('.rep-lote-autorizacao-saldo').textContent += ' · Não há todo o pedido neste dia; a aplicação ficará limitada ao saldo disponível.';
  });
  document.querySelectorAll('#rep-lote-compensacoes tr').forEach(renderizarOrigensCompensacaoLoteRep_);
}

function preencherAutorizacoesPersistidasLoteRep_(emp, modal) {
  const corpo = document.getElementById('rep-lote-autorizacoes');
  if (!emp || !corpo || corpo.children.length) return;
  const competencia = String(modal?.dataset.competencia || obterCompetenciaSelecionadaRep_() || '');
  (autorizacoesCompensacaoRep || []).filter(function(item) {
    return normalizarPisRep(item.pis) === normalizarPisRep(emp.pis) && (!competencia || String(item.data || '').slice(0, 7) === competencia);
  }).sort(function(a, b) { return (Number(a.ordem || 9999) - Number(b.ordem || 9999)) || String(a.data).localeCompare(String(b.data)); }).forEach(function(item) {
    adicionarLinhaAutorizacaoCompensacaoLoteRep_(item.data, formatarDuracaoCompensacaoLoteRep_(Number(item.minutos || 0)));
  });
}

async function carregarAutorizacoesCompensacaoLoteRep_(emp, modal) {
  try {
    autorizacoesCompensacaoRep = await chamarBackendPromessa_('listarAutorizacoesCompensacaoRep', []);
    if (modal?.dataset.pis === String(emp?.pis || '') && !modal.dataset.dirty) preencherAutorizacoesPersistidasLoteRep_(emp, modal);
  } catch (erro) { console.warn('Autorizações de compensação não puderam ser carregadas:', mensagemErro(erro)); }
}

function renderizarOrigensCompensacaoLoteRep_(linha) {
  const emp = obterServidorProjetadoLoteRep_();
  const dataDestino = linha && linha.querySelector('.rep-lote-data')?.value;
  const container = linha && linha.querySelector('.rep-lote-origens');
  if (!emp || !container) return;
  const valoresAtuais = new Map(Array.from(container.querySelectorAll('.rep-lote-origem-valor')).map(function(input) { return [input.dataset.data, input.value]; }));
  const destinosNoForm = new Set(Array.from(document.querySelectorAll('#rep-lote-compensacoes .rep-lote-data')).map(function(c) { return c.value; }).filter(Boolean));
  if (dataDestino) destinosNoForm.add(dataDestino);
  const autorizacoes = obterAutorizacoesCompensacaoLoteRep_(false, destinosNoForm);
  const usoExistente = obterUsoCompensacaoExistenteLoteRep_(destinosNoForm);
  const saldosPorData = new Map((emp.resumo.origensSaldoCompensacao || []).map(function(item) { return [item.data, { ...item, minutos: Math.max(0, Math.round(Number(item.minutos || 0))) }]; }));
  (emp.dias || []).filter(function(d) { return destinosNoForm.has(d.dataOriginal); }).forEach(function(d) {
    (d.compensacao?.origensAplicadas || []).forEach(function(origem) {
      const saldoObj = saldosPorData.get(origem.data) || { data: origem.data, minutos: 0, minutosBrutos: 0 };
      saldoObj.minutos = (Number(saldoObj.minutos) || 0) + Math.max(0, Math.round(Number(origem.minutos || 0)));
      saldoObj.minutosBrutos = (Number(saldoObj.minutosBrutos) || 0) + Math.max(0, Math.round(Number(origem.minutos || 0)));
      saldosPorData.set(origem.data, saldoObj);
    });
  });
  // A ordem de inserção do Map é a ordem do documento definida pelo RH.
  // Nunca ordenar por data aqui: a distribuição automática deve consumir as HE nessa sequência.
  const origens = Array.from(autorizacoes.keys()).map(function(dataOrigem) { return saldosPorData.get(dataOrigem); })
    .filter(function(item) { return item && dataDestino && item.data !== dataDestino && item.data.slice(0, 7) === dataDestino.slice(0, 7) && Number(item.minutos || 0) > 0; });
  container.innerHTML = origens.map(function(item) {
    const saldo = Math.max(0, Math.round(Number(item.minutos || 0)));
    const autorizadoTotal = autorizacoes.get(item.data) || 0;
    const jaUsado = usoExistente.get(item.data) || 0;
    const autorizadoRestante = Math.min(saldo, Math.max(0, autorizadoTotal - jaUsado));
    return `<label class="rep-lote-origem"><span><strong>${escapeHtml(item.data.split('-').reverse().join('/'))}</strong><small>Autorizado restante: ${formatarDuracaoCompensacaoLoteRep_(autorizadoRestante)} · saldo: ${formatarDuracaoCompensacaoLoteRep_(saldo)}</small></span><input type="text" class="form-control rep-lote-origem-valor" data-data="${escapeHtml(item.data)}" data-maximo="${autorizadoRestante}" data-autorizado="${autorizadoTotal}" value="${escapeHtml(valoresAtuais.get(item.data) || '')}" placeholder="${obterFormatoCompensacaoLoteRep_() === 'minutos' ? 'Minutos' : '00:00'}" maxlength="5" inputmode="numeric" oninput="atualizarTotalCompensacaoLoteRep_(this.closest('tr'))"></label>`;
  }).join('') || '<small class="rep-lote-sem-origem">Adicione acima ao menos um dia e o limite autorizado no documento.</small>';
  atualizarTotalCompensacaoLoteRep_(linha);
}

function atualizarTotalCompensacaoLoteRep_(linha) {
  let total = 0;
  let invalida = false;
  let temPedido = false;
  const origens = [], avisos = [];
  const emp = obterServidorProjetadoLoteRep_();
  const dia = emp?.dias.find(function(item) { return item.dataOriginal === linha.querySelector('.rep-lote-data')?.value; });
  const deficit = dia ? obterDeficitProjetadoLoteRep_(emp, dia) : 0;
  const campoMeta = linha && linha.querySelector('.rep-lote-meta-dia-valor');
  const textoMeta = String(campoMeta?.value || '').trim();
  const meta = textoMeta ? lerDuracaoCompensacaoLoteRep_(textoMeta) : null;
  if (textoMeta && (meta === null || meta <= 0)) invalida = true;
  (linha ? linha.querySelectorAll('.rep-lote-origem-valor') : []).forEach(function(input) {
    if (!input.value.trim()) return;
    temPedido = true;
    const minutos = lerDuracaoCompensacaoLoteRep_(input.value.trim());
    const maximo = Math.max(0, Number(input.dataset.maximo || 0));
    if (minutos === null || minutos <= 0) invalida = true;
    else {
      const aplicado = Math.min(minutos, maximo, Math.max(0, Number(meta || 0) - total), Math.max(0, deficit - total));

  const capacidades = new Map((emp.resumo.origensSaldoCompensacao || []).map(function(item) { return [item.data, Math.max(0, Math.round(Number(item.minutos || 0)))]; }));
  const datasCompensacaoNoFormulario = new Set(linhasCompensacao.map(function(linha) { return linha.querySelector('.rep-lote-data')?.value; }).filter(Boolean));
  (emp.dias || []).filter(function(dia) { return datasCompensacaoNoFormulario.has(dia.dataOriginal); }).forEach(function(dia) {
    (dia.compensacao?.origensAplicadas || []).forEach(function(origem) {
      capacidades.set(origem.data, (capacidades.get(origem.data) || 0) + Math.max(0, Math.round(Number(origem.minutos || 0))));
    });
  });
  limitesAutorizados = obterAutorizacoesCompensacaoLoteRep_(true, datasCompensacaoNoFormulario);
  const usoAutorizacaoExistente = obterUsoCompensacaoExistenteLoteRep_(datasCompensacaoNoFormulario);
  const autorizacaoRestante = new Map(Array.from(limitesAutorizados.entries()).map(function(item) { return [item[0], Math.max(0, item[1] - (usoAutorizacaoExistente.get(item[0]) || 0))]; }));
  compensacoes = linhasCompensacao.map(function(linha) {
    const data = linha.querySelector('.rep-lote-data').value;
    const resultadoOrigens = atualizarTotalCompensacaoLoteRep_(linha);
    let minutos = resultadoOrigens.total;
    avisosLimiteCompensacao.push.apply(avisosLimiteCompensacao, resultadoOrigens.avisos || []);
    if (resultadoOrigens.meta === null || resultadoOrigens.meta <= 0) throw new Error('Informe “Quanto compensar” no dia ' + (data ? data.split('-').reverse().join('/') : 'selecionado') + ' antes de salvar a compensação.');
    const dia = (emp.dias || []).find(function(item) { return item.dataOriginal === data; });
    const deficit = dia ? obterDeficitProjetadoLoteRep_(emp, dia) : 0;
    if (!data || resultadoOrigens.invalida || !dia) throw new Error('Informe uma data com déficit e escolha uma quantidade válida em ao menos um dia de origem.');
    if (!minutos || !deficit) return null;
    let restanteDestino = Math.min(deficit, resultadoOrigens.meta);
    const origens = resultadoOrigens.origens.map(function(item) { return { ...item }; });
    origens.forEach(function(origem) {
      const disponivel = capacidades.get(origem.data) || 0;
      const permitido = autorizacaoRestante.get(origem.data) || 0;
      const pedido = origem.minutos;
      origem.minutos = Math.min(pedido, disponivel, permitido, restanteDestino);
      if (origem.minutos < pedido) avisosLimiteCompensacao.push(origem.data.split('-').reverse().join('/') + ': aplicação limitada a ' + minutosParaHoraRep_(origem.minutos) + 'h pelo saldo restante do lote.');
      restanteDestino -= origem.minutos;
      capacidades.set(origem.data, disponivel - origem.minutos);
      autorizacaoRestante.set(origem.data, permitido - origem.minutos);
      origem.autorizado = limitesAutorizados.get(origem.data);
    });
    const aplicadas = origens.filter(function(origem) { return origem.minutos > 0; });
    minutos = aplicadas.reduce(function(soma, origem) { return soma + origem.minutos; }, 0);
    if (!minutos) return null;
    return { pis: pis, data: data, minutos: minutos, observacao: linha.querySelector('.rep-lote-observacao').value.trim(), origens: aplicadas };
  }).filter(Boolean);
  } catch (erroValidacao) {
    return mostrarToast(mensagemErro(erroValidacao), 'warning');
  }
  if (avisosInconsistencia.length) {
    const avisosUnicos = Array.from(new Set(avisosInconsistencia));
    const continuar = await abrirConfirm('Foram encontradas inconsistências que aparecerão como alerta na conferência:\n\n• ' + avisosUnicos.slice(0, 6).join('\n• ') + (avisosUnicos.length > 6 ? '\n• E mais ' + (avisosUnicos.length - 6) + ' ocorrência(s).' : '') + '\n\nDeseja salvar assim mesmo?', 'Salvar com alertas?');
    if (!continuar) return;
  }
  const mapaPersistido = new Map(autorizacoesPersistidas.map(function(item) { return [item.data, { minutos: Number(item.minutos || 0), ordem: Number(item.ordem || 0) }]; }));
  const ordemAutorizacoes = new Map(Array.from(document.querySelectorAll('#rep-lote-autorizacoes .rep-lote-autorizacao')).map(function(linha, indice) { return [linha.querySelector('.rep-lote-autorizacao-data').value, indice + 1]; }));
  const autorizacoesMudaram = mapaPersistido.size !== limitesAutorizados.size || Array.from(limitesAutorizados.entries()).some(function(item) { const anterior = mapaPersistido.get(item[0]); return !anterior || anterior.minutos !== item[1] || anterior.ordem !== ordemAutorizacoes.get(item[0]); });
  if (!novos.length && !paraDesconsiderar.length && !compensacoes.length && !autorizacoesMudaram) return mostrarToast(avisosLimiteCompensacao[0] || 'Nenhuma alteração nova foi informada.', 'info');
  const botao = document.getElementById('rep-lote-salvar');
  botao.disabled = true;
  try {
    paraDesconsiderar.forEach(function(item) {
      item.evento.desconsiderada = true;
      item.evento.ajusteJustificativa = item.justificativa || 'Substituído no cartão de ponto manual.';
    });
    const competencias = Array.from(new Set(Array.from(origensAjuste).map(function(data) { return data.slice(0,7); })));
    for (let i = 0; i < competencias.length; i++) {
      const competencia = competencias[i];
      document.getElementById('rep-lote-status').textContent = 'Preparando marcações da competência ' + competencia + '...';
      await salvarAjustesCompetenciaRep_(pis, competencia, novos.filter(function(item) { return item.dataReferencia.slice(0,7) === competencia; }), Array.from(origensAjuste).filter(function(data) { return data.slice(0,7) === competencia; }));
    }
    if (autorizacoesMudaram) {
      document.getElementById('rep-lote-status').textContent = 'Salvando os tetos autorizados...';
      mapaPersistido.forEach(function(_, data) { if (!limitesAutorizados.has(data)) enfileirarAlteracaoRep_('AUTORIZACAO_COMPENSACAO', { pis: pis, data: data, minutos: 0, ordem: 0 }, 'AUTORIZACAO_COMPENSACAO|' + normalizarPisRep(pis) + '|' + data); });
      limitesAutorizados.forEach(function(minutos, data) { enfileirarAlteracaoRep_('AUTORIZACAO_COMPENSACAO', { pis: pis, data: data, minutos: minutos, ordem: ordemAutorizacoes.get(data) || 0 }, 'AUTORIZACAO_COMPENSACAO|' + normalizarPisRep(pis) + '|' + data); });
      autorizacoesCompensacaoRep = (autorizacoesCompensacaoRep || []).filter(function(item) { return !(normalizarPisRep(item.pis) === normalizarPisRep(pis) && (!competenciaAutorizacao || String(item.data || '').slice(0, 7) === competenciaAutorizacao)); });
      limitesAutorizados.forEach(function(minutos, data) { autorizacoesCompensacaoRep.push({ pis: pis, data: data, minutos: minutos, ordem: ordemAutorizacoes.get(data) || 0 }); });
    }
    compensacoes.forEach(function(dados, indice) {
      document.getElementById('rep-lote-status').textContent = 'Preparando compensação ' + (indice + 1) + ' de ' + compensacoes.length + '...';
      enfileirarAlteracaoRep_('COMPENSACAO', dados, 'COMPENSACAO|' + normalizarPisRep(pis) + '|' + dados.data);
      compensacoesRep = (compensacoesRep || []).filter(function(item) { return !(normalizarPisRep(item.pis) === normalizarPisRep(pis) && item.data === dados.data); });
      compensacoesRep.push(dados);
    });
    if (novos.length) dadosRepCache.punches.push(...novos);
    // A fila já agenda o envio; a tela é liberada sem aguardar a rede.
    modal.dataset.dirty = '';
    if (modal.dataset.inline === 'sim') fecharEspacoManualInlineRep_();
    else fecharModal('modal-lancamentos-lote-rep');
    const resultados = document.getElementById('rep-results-container');
    if (resultados) resultados.style.display = 'block';
    ['rep-btn-export', 'rep-btn-pdf', 'rep-btn-alertas-servidor', 'rep-btn-alertas-geral', 'rep-btn-autorizacao-he', 'rep-btn-lancamento', 'rep-btn-lancamento-lote'].forEach(function(id) {
      const botaoAcao = document.getElementById(id);
      if (botaoAcao) botaoAcao.style.display = 'inline-flex';
    });
    if (cartaoManual && competencias.length) {
      const competenciaExibida = competencias.slice().sort().reverse()[0];
      const partesCompetencia = competenciaExibida.split('-');
      const seletorAno = document.getElementById('rep-filter-ano');
      const seletorMes = document.getElementById('rep-filter-mes');
      if (seletorAno && !Array.from(seletorAno.options).some(function(item) { return item.value === partesCompetencia[0]; })) {
        seletorAno.insertAdjacentHTML('beforeend', `<option value="${escapeHtml(partesCompetencia[0])}">${escapeHtml(partesCompetencia[0])}</option>`);
      }
      if (seletorAno) seletorAno.value = partesCompetencia[0];
      if (seletorMes) seletorMes.value = partesCompetencia[1];
      const buscaRep = document.getElementById('rep-search-input');
      const statusRep = document.getElementById('rep-filter-status');
      const conferenciaRep = document.getElementById('rep-filter-conferencia');
      const lotacaoRep = document.getElementById('rep-filter-lotacao');
      const localRep = document.getElementById('rep-filter-local');
      if (buscaRep) buscaRep.value = '';
      if (statusRep) statusRep.value = 'all';
      if (conferenciaRep) conferenciaRep.value = 'all';
      if (lotacaoRep) lotacaoRep.value = 'all';
      // O local do cartão manual pode não existir nos relógios carregados.
      // Não deixar esse filtro excluir a pessoa que acabou de ser incluída.
      if (localRep) localRep.value = 'all';
      pisSelecionadoRep = pis;
    }
    agendarReprocessamentoRepLeve_(260, pis);
    if (avisosLimiteCompensacao.length && compensacoes.length) mostrarToast('Salvo considerando somente o saldo real disponível. ' + avisosLimiteCompensacao[0], 'warning');
    else if (!linhasMarcacao.length && !compensacoes.length && autorizacoesMudaram) mostrarToast('Limites autorizados salvos com sucesso. Adicione dias em “Dias que serão compensados” para aplicar a compensação.', 'success');
    else if (avisosLimiteCompensacao.length) mostrarToast('Salvo considerando somente o saldo real disponível. ' + avisosLimiteCompensacao[0], 'warning');
    else mostrarToast(cartaoManual
      ? origensAjuste.size + ' dia(s) do cartão manual atualizado(s) no cálculo.'
