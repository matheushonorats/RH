  } finally { botao.disabled = false; }
}

function minutosParaRelogioHe_(minutos) {
  minutos = ((Math.round(minutos) % 1440) + 1440) % 1440;
  return String(Math.floor(minutos / 60)).padStart(2, '0') + ':' + String(minutos % 60).padStart(2, '0');
}

/** A autorização sempre usa a representação administrativa arredondada. */
function arredondarHorarioAutorizacaoHe_(horario) {
  const minutos = horaParaMinutosRep_(horario);
  if (minutos == null) return null;
  const data = new Date(2000, 0, 1, Math.floor(minutos / 60), minutos % 60, 0, 0);
  const arredondada = roundTimeRep(data);
  return arredondada.getHours() * 60 + arredondada.getMinutes();
}

function obterPeriodoAutorizacaoHeRep_(dia, extraMinutos) {
  const batidas = dia && dia.batidas || [];
  const detalhadas = dia && dia.batidasDetalhadas || [];
  const primeiroHorarioReal = detalhadas.length ? detalhadas[0].horarioOriginal : (batidas.length ? batidas[0] : '');
  const ultimoHorarioReal = detalhadas.length ? detalhadas[detalhadas.length - 1].horarioOriginal : (batidas.length ? batidas[batidas.length - 1] : '');
  const fim = arredondarHorarioAutorizacaoHe_(ultimoHorarioReal);
  const inicioDiaExtra = dia && dia.diaExtra ? arredondarHorarioAutorizacaoHe_(primeiroHorarioReal) : null;
  return {
    inicio: dia && dia.diaExtra
      ? (inicioDiaExtra == null ? '' : minutosParaRelogioHe_(inicioDiaExtra))
      : (fim == null ? '' : minutosParaRelogioHe_(fim - extraMinutos)),
    fim: fim == null ? '' : minutosParaRelogioHe_(fim)
  };
}

const janelasAutorizacaoHeRep_ = new Set();
window.addEventListener('message', async function(event) {
  const dados = event && event.data;
  if (!dados || !janelasAutorizacaoHeRep_.has(event.source)) return;
  try {
    if (dados.tipo === 'SALVAR_DESCRICAO_HE') {
      const descricoes = await salvarDescricaoHoraExtraRep_(dados.descricao);
      event.source.postMessage({ tipo: 'DESCRICAO_HE_SALVA', descricao: dados.descricao, descricoes: descricoes }, '*');
    } else if (dados.tipo === 'SALVAR_DESCRICAO_HE_SERVIDOR') {
      await salvarDescricaoHoraExtraServidorRep_(dados.matricula, dados.descricao);
      event.source.postMessage({ tipo: 'DESCRICAO_HE_SERVIDOR_SALVA' }, '*');
    } else if (dados.tipo === 'GERENCIAR_DESCRICAO_HE') {
      const descricoes = await gerenciarDescricaoHoraExtraRep_(dados.acao, dados.descricao, dados.novoTexto);
      event.source.postMessage({ tipo: 'DESCRICAO_HE_GERENCIADA', acao: dados.acao, descricao: dados.descricao, novoTexto: dados.novoTexto, descricoes: descricoes }, '*');
    } else return;
  } catch (erro) {
    event.source.postMessage({ tipo: 'DESCRICAO_HE_ERRO', mensagem: mensagemErro(erro) }, '*');
  }
});

function calendarioFeriadosEntidade_(ano) {
  ano=Number(ano);if(!Number.isInteger(ano)||ano<2000||ano>2100)return [];
  const a=ano%19,b=Math.floor(ano/100),c=ano%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=(h+l-7*m+114)%31+1;
  const fixos=[['01-01','Confraternização Universal'],['01-20','Padroeiro de São Sebastião'],['03-16','Aniversário de São Sebastião'],['04-21','Tiradentes'],['05-01','Dia do Trabalho'],['07-09','Revolução Constitucionalista (SP)'],['09-07','Independência do Brasil'],['10-12','Nossa Senhora Aparecida'],['11-02','Finados'],['11-15','Proclamação da República'],['12-25','Natal']];
  if(ano>=2024)fixos.push(['11-20','Consciência Negra']);
  const lista=fixos.map(([data,nome])=>({data:ano+'-'+data,nome}));
  [[-2,'Paixão de Cristo'],[60,'Corpus Christi (São Sebastião)']].forEach(([offset,nome])=>{const dt=new Date(Date.UTC(ano,mes-1,dia+offset));lista.push({data:dt.toISOString().slice(0,10),nome});});
  return lista.sort((a,b)=>a.data.localeCompare(b.data));
}

    const grupos=[['COMPENSACAO',compensacoesRep,{minutos:0,origens:[],observacao:''}],['AUTORIZACAO_COMPENSACAO',autorizacoesCompensacaoRep,{minutos:0,ordem:0}],['VALIDACAO',validacoesRep,{validado:false,observacao:''}],['DESCARTE_HE',descartesHoraExtraRep,{descartado:false,saldoAjustado:false}]];
    grupos.forEach(([tipo,lista,dados])=>lista.filter(mesmo).forEach(item=>enfileirarAlteracaoRep_(tipo,{pis,data:item.data,...dados},tipo+'|'+normalizarPisRep(pis)+'|'+item.data)));
    validacoesRep=validacoesRep.filter(i=>!mesmo(i));descartesHoraExtraRep=descartesHoraExtraRep.filter(i=>!mesmo(i));compensacoesRep=compensacoesRep.filter(i=>!mesmo(i));autorizacoesCompensacaoRep=autorizacoesCompensacaoRep.filter(i=>!mesmo(i));
    atualizarProcessamentoRep({notificarEntidade:false});
    mostrarToast('Espelho mensal limpo. Acompanhe a confirmação na fila de sincronização.', 'info');
  } catch(e) { mostrarToast(mensagemErro(e),'error'); }
}

const cartoesEspelhoAnimados_ = new Set();
let observadorCartoesRep_ = null;
let observadorIdentidadeRep_ = null;
function animarCartoesEspelhoRep_(container) {
  observadorIdentidadeRep_?.disconnect();
  const identidade=container.querySelector('.rep-identidade-fixa'),cabecalho=container.querySelector('.rep-detalhe-cabecalho');
  if(identidade&&cabecalho&&window.IntersectionObserver){observadorIdentidadeRep_=new IntersectionObserver(([entry])=>{identidade.classList.toggle('visivel',!entry.isIntersecting&&entry.boundingClientRect.top<0);});observadorIdentidadeRep_.observe(cabecalho);}
  const reduzido=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  if(reduzido || !window.IntersectionObserver)return;
  observadorCartoesRep_?.disconnect();
  const observer=observadorCartoesRep_=new IntersectionObserver(entradas=>entradas.forEach(({target,isIntersecting})=>{
    if(!isIntersecting)return;
    target.animate([{opacity:.35,transform:'translateY(8px)'},{opacity:1,transform:'translateY(0)'}],{duration:320,easing:'ease-out'});observer.unobserve(target);
  }),{threshold:.05});
  container.querySelectorAll('.rep-evento,.rep-status,.rep-compensacao-dia,.rep-ausencia-dia').forEach((card,i)=>{
    const chave=pisSelecionadoRep+'|'+(card.closest('tr')?.dataset.repData||'')+'|'+(card.dataset.eventId||card.className+'|'+card.textContent);
    if(cartoesEspelhoAnimados_.has(chave))return;cartoesEspelhoAnimados_.add(chave);observer.observe(card);
  });

  if(cartoesEspelhoAnimados_.size>4000)cartoesEspelhoAnimados_.clear();
}
function avisoDiaSaidaLancamento_() {
  const tipo=document.getElementById('lanc-tipo')?.value||'';
  if(!/FERIAS|ABON|LICENCA/i.test(normalizarTextoRep_(tipo))||/CREDITO|PENALIDADE|AJUSTE/.test(normalizarTextoRep_(tipo)))return '';
  const campos=Array.from(document.querySelectorAll('#form-lancamento input[type=date]')).filter(c=>c.id==='lanc-data-inicio'||c.id==='lanc-data-falta');
  const datas=tipo==='Abonada Eleitoral' ? Array.from(new Set((typeof obterDatasAbonoEleitoral_==='function'?obterDatasAbonoEleitoral_():[]).concat(document.getElementById('lanc-data-eleitoral-nova')?.value||[]))).filter(Boolean) : [campos.find(c=>c.offsetParent!==null&&c.value)?.value].filter(Boolean);
  const avisos=datas.map(data=>{const partes=data.split('-').map(Number),dia=new Date(partes[0],partes[1]-1,partes[2]).getDay();const feriado=calendarioFeriadosEntidade_(partes[0]).find(f=>f.data===data),cadastrado=(feriadosCompartilhadosRep||[]).some(f=>f.data===data);if(dia!==0&&dia!==6&&!feriado&&!cadastrado)return '';return data.split('-').reverse().join('/')+' — '+(feriado?feriado.nome:dia===0?'domingo':dia===6?'sábado':'feriado cadastrado');}).filter(Boolean);
  return avisos.length ? 'Atenção à data de saída: '+avisos.join('; ')+'. Confira uma data de saída em dia útil.' : '';
}

function prepararCoberturaDocumentoMedico_() {

    document.getElementById('lanc-mes-he-grupo').style.display='none';document.getElementById('lanc-ano-he-grupo').style.display='none';

}

// Estado exclusivo do diagnóstico. Não usa dadosRepCache nem envia operações.
let inspecaoAfdIsolada_ = null;
let geracaoInspecaoAfd_ = 0;
let filtroInspecaoAfdTimer_ = null;
function abrirInspecaoAfdIsolado_() {
  let modal=document.getElementById('modal-inspecao-afd');
  if(!modal){modal=document.createElement('div');modal.id='modal-inspecao-afd';modal.className='modal-overlay';modal.innerHTML=`<div class="modal-content large"><div class="modal-header"><div><h3 class="modal-title">Inspecionar AFD isolado</h3><small>Consulta local, separada do espelho e da sincronização.</small></div><button class="modal-close" onclick="fecharInspecaoAfdIsolado_()" aria-label="Fechar inspeção">×</button></div><div class="modal-body"><label class="anexo-dropzone" id="inspecao-afd-drop" ondragover="event.preventDefault()" ondrop="event.preventDefault();lerAfdIsolado_(event.dataTransfer.files)"><input type="file" accept=".txt,.afd" onchange="lerAfdIsolado_(this.files)"><span>Escolha ou arraste um único AFD (.txt ou .afd)</span></label><p class="form-help">O arquivo não é enviado ao Drive e não modifica pessoas, marcações ou cálculos do Leitor REP. Ao fechar, esta análise é descartada.</p><p id="inspecao-afd-status" role="status" aria-live="polite"></p><div id="inspecao-afd-resumo"></div><div id="inspecao-afd-filtros" hidden class="form-row"><div class="form-group"><label for="inspecao-afd-modo">Visualização</label><select id="inspecao-afd-modo" class="form-control" onchange="filtrarInspecaoAfd_()"><option value="batidas">Marcações originais</option><option value="registros">Todos os registros do arquivo</option></select></div><div class="form-group" style="flex:2"><label for="inspecao-afd-busca">Pesquisar</label><input id="inspecao-afd-busca" class="form-control" placeholder="Nome, PIS/CPF, data, horário ou NSR" oninput="clearTimeout(filtroInspecaoAfdTimer_);filtroInspecaoAfdTimer_=setTimeout(filtrarInspecaoAfd_,250)"></div></div><div id="inspecao-afd-tabela" class="rep-table-wrap"></div><div id="inspecao-afd-paginacao" class="rep-paginacao"></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="fecharInspecaoAfdIsolado_()">Fechar e descartar análise</button></div></div>`;document.body.append(modal);}
  abrirModal('modal-inspecao-afd');
}
function fecharInspecaoAfdIsolado_() {
  geracaoInspecaoAfd_++;inspecaoAfdIsolada_=null;clearTimeout(filtroInspecaoAfdTimer_);
  ['inspecao-afd-status','inspecao-afd-resumo','inspecao-afd-tabela','inspecao-afd-paginacao'].forEach(id=>{document.getElementById(id).textContent='';});
  document.getElementById('inspecao-afd-filtros').hidden=true;
  const input=document.querySelector('#inspecao-afd-drop input');input.value='';input.disabled=false;
  fecharModal('modal-inspecao-afd');
}
async function lerAfdIsolado_(arquivos) {
  const status=document.getElementById('inspecao-afd-status');
  if(!arquivos||arquivos.length!==1){status.textContent='Selecione somente um AFD para manter a análise isolada.';return;}
  const file=arquivos[0];
  if(!/\.(txt|afd)$/i.test(file.name)||file.size>50*1024*1024){status.textContent='Use um arquivo .txt ou .afd de até 50 MB.';return;}
  const geracao=++geracaoInspecaoAfd_;inspecaoAfdIsolada_=null;
  document.getElementById('inspecao-afd-filtros').hidden=true;
  ['inspecao-afd-resumo','inspecao-afd-tabela','inspecao-afd-paginacao'].forEach(id=>document.getElementById(id).textContent='');
  status.textContent='Interpretando somente '+file.name+'…';
  const input=document.querySelector('#inspecao-afd-drop input');input.disabled=true;
  try{
    const texto=await file.text();const leitura=await parseAFDRep(texto,file.name);
    if(geracao!==geracaoInspecaoAfd_)return;
    const batidas=[];
    for(let i=0;i<leitura.punches.length;i++){
      const p=leitura.punches[i],data=toDateStringRep(p.datetime).split('-').reverse().join('/'),hora=String(p.datetime.getHours()).padStart(2,'0')+':'+String(p.datetime.getMinutes()).padStart(2,'0');
      const nome=leitura.employees.get(p.pis)||p.nomeNoMomento||'Nome não consta no arquivo';
      batidas.push({p,nome,data,hora,busca:normalizarTextoBusca([nome,p.pis,data,hora,p.nsr].join(' '))});
      if(i%4000===3999){await new Promise(r=>setTimeout(r,0));if(geracao!==geracaoInspecaoAfd_)return;}
    }
    inspecaoAfdIsolada_={leitura,batidas,registros:texto.replaceAll('\r\n','\n').replaceAll('\r','\n').split('\n'),pagina:1,filtrados:[]};
    const a=leitura.audit,m=leitura.metadata;
    document.getElementById('inspecao-afd-resumo').innerHTML=`<p><b>${escapeHtml(file.name)}</b> · REP ${escapeHtml(m.deviceSerial||'não identificado')} · ${escapeHtml(m.employerName||'Empregador não informado')}</p><p>${batidas.length.toLocaleString('pt-BR')} marcações válidas · ${leitura.employees.size} cadastros · ${a.marcacoesInvalidas} marcações inválidas · ${a.quebrasNsr} interrupções de sequência NSR</p><p>${a.ajustesRelogio} ajustes do relógio · ${a.eventosTecnicos} eventos técnicos · ${a.linhasCurtas} linhas incompletas · ${a.tiposDesconhecidos} tipos desconhecidos</p><details><summary>Diagnóstico da leitura</summary><p>Tipos encontrados: ${escapeHtml(Object.entries(a.registrosPorTipo).map(([t,n])=>t+': '+n).join(' · '))}</p><p>Sequência interrompida ou quantidade ímpar é um indício para conferir, não prova de defeito no relógio. Esta consulta não verifica a assinatura digital do AFD.</p>${(a.erros||[]).slice(0,30).map(e=>'<p>Linha '+e.linha+': '+escapeHtml(e.motivo)+'</p>').join('')}</details>`;
    status.textContent='Leitura local concluída. Nenhum dado foi importado.';
    document.getElementById('inspecao-afd-busca').value='';document.getElementById('inspecao-afd-modo').value='batidas';document.getElementById('inspecao-afd-filtros').hidden=false;
    filtrarInspecaoAfd_();
  }catch(e){if(geracao===geracaoInspecaoAfd_)status.textContent='Não foi possível interpretar: '+mensagemErro(e);}
  finally{if(geracao===geracaoInspecaoAfd_)input.disabled=false;}
}
function filtrarInspecaoAfd_() {
  const estado=inspecaoAfdIsolada_;if(!estado)return;
  estado.modo=document.getElementById('inspecao-afd-modo').value;
  const busca=normalizarTextoBusca(document.getElementById('inspecao-afd-busca').value);
  const lista=estado.modo==='registros'?estado.registros:estado.batidas;
  estado.filtrados=[];
  lista.forEach((item,i)=>{if(!busca||(estado.modo==='registros'?normalizarTextoBusca(item):item.busca).includes(busca))estado.filtrados.push(i);});estado.pagina=1;renderizarInspecaoAfd_();
}
function renderizarInspecaoAfd_(delta) {
  const s=inspecaoAfdIsolada_;if(!s)return;const paginas=Math.max(1,Math.ceil(s.filtrados.length/100));s.pagina=Math.min(paginas,Math.max(1,s.pagina+(delta||0)));
  const linhas=s.filtrados.slice((s.pagina-1)*100,s.pagina*100).map(i=>{if(s.modo==='registros')return '<tr><td>'+(i+1)+'</td><td><code style="white-space:pre-wrap;overflow-wrap:anywhere">'+escapeHtml(s.registros[i])+'</code></td></tr>';const b=s.batidas[i];return '<tr><td>'+b.data+'</td><td>'+b.hora+'</td><td>'+escapeHtml(b.nome)+'</td><td>'+escapeHtml(b.p.pis)+'</td><td>'+escapeHtml(b.p.nsr)+'</td><td>'+escapeHtml(b.p.clock)+'</td></tr>';}).join('');
  document.getElementById('inspecao-afd-tabela').innerHTML='<table class="custom-table"><thead><tr>'+(s.modo==='registros'?'<th>Linha</th><th>Registro original</th>':'<th>Data</th><th>Hora</th><th>Nome no arquivo</th><th>PIS/CPF</th><th>NSR</th><th>Local registrado</th>')+'</tr></thead><tbody>'+linhas+'</tbody></table>';
  document.getElementById('inspecao-afd-paginacao').innerHTML='<span>'+s.filtrados.length.toLocaleString('pt-BR')+' resultados · Página '+s.pagina+' de '+paginas+'</span><div><button type="button" class="btn btn-secondary" onclick="renderizarInspecaoAfd_(-1)" '+(s.pagina===1?'disabled':'')+'>Anterior</button><button type="button" class="btn btn-secondary" onclick="renderizarInspecaoAfd_(1)" '+(s.pagina===paginas?'disabled':'')+'>Próxima</button></div>';
}
function instalarAcessoInspecaoAfd_(){const topo=document.querySelector('.rep-page-header > div');if(!topo||document.getElementById('rep-inspecao-isolada'))return;const botao=document.createElement('button');botao.id='rep-inspecao-isolada';botao.type='button';botao.className='rep-ajustar-dia';botao.textContent='Inspecionar AFD isolado';botao.title='Testar um arquivo local sem importar para o REP';botao.onclick=abrirInspecaoAfdIsolado_;topo.append(botao);}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',instalarAcessoInspecaoAfd_);else instalarAcessoInspecaoAfd_();


document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.getElementById('modal-inspecao-afd')?.classList.contains('active')){e.preventDefault();e.stopImmediatePropagation();fecharInspecaoAfdIsolado_();}},true);
</script>
