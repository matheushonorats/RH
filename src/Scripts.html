}

function renderizarAuditoriaArquivosRep() {
  const container = document.getElementById('rep-auditoria-arquivos');
  if (!container) return;
  const arquivos = dadosRepCache.arquivos || [];
  const falhas = falhasIntegridadeRep || [];
  const detalhesAnterior = container.querySelector('details.rep-auditoria');
  const estavaAberto = Boolean(detalhesAnterior?.open);
  const totalEncontradas = arquivos.reduce((soma, item) => soma + item.marcacoesEncontradas, 0);
  const totalValidas = arquivos.reduce((soma, item) => soma + item.marcacoesValidas, 0);
  const totalInvalidas = arquivos.reduce((soma, item) => soma + item.marcacoesInvalidas, 0);
  const consolidadas = (dadosRepCache.punches || []).length;
  const repetidas = Math.max(0, totalValidas - consolidadas);
  const integridadeFisica = arquivos.length > 0 && arquivos.every(item => item.integridadeConfirmada && item.sha256Drive === item.sha256Recebido && item.tamanhoDrive === item.tamanhoRecebido) && falhas.length === 0;
  const leituraIntegral = arquivos.length > 0 && arquivos.every(item => item.leituraCompleta && !item.marcacoesInvalidas && !item.quebrasNsr) && falhas.length === 0;
  const conciliado = integridadeFisica && leituraIntegral && totalEncontradas === totalValidas + totalInvalidas;
  const linhas = arquivos.map(item => {
    const problemas = Array.isArray(item.errosLeitura) ? item.errosLeitura : [];
    const detalheProblemas = problemas.length ? `<details class="rep-detalhes-problemas"><summary>Ver linhas</summary><ul>${problemas.slice(0, 10).map(erro => `<li>Linha ${Number(erro.linha || 0).toLocaleString('pt-BR')}: ${escapeHtml(erro.motivo || 'Inconsistência')}</li>`).join('')}</ul>${problemas.length > 10 ? `<small>Mais ${problemas.length - 10} ocorrência(s) no arquivo.</small>` : ''}</details>` : '';
    return `<tr>
    <td><strong>REP ${escapeHtml(item.numeroRep || 'não identificado')} <i class="rep-online-status ${item.integridadeConfirmada ? '' : 'falhou'}">${item.integridadeConfirmada ? 'SHA-256 confirmado' : 'Sem verificação criptográfica'}</i></strong><small>${escapeHtml(item.locais.join(' → '))}</small><small>${escapeHtml(item.nome)}</small></td>
    <td><span class="rep-integridade-selo ${item.integridadeConfirmada ? 'ok' : 'erro'}">${item.integridadeConfirmada ? 'Arquivo íntegro' : 'Não confirmado'}</span><small>${item.sha256Drive ? escapeHtml(item.sha256Drive.slice(0, 16)) + '…' : '-'}</small></td>
    <td>${item.marcacoesEncontradas.toLocaleString('pt-BR')}</td>
    <td>${item.marcacoesValidas.toLocaleString('pt-BR')}</td>
    <td class="${item.marcacoesInvalidas || item.quebrasNsr || !item.leituraCompleta ? 'rep-valor-negativo' : ''}">${item.marcacoesInvalidas.toLocaleString('pt-BR')}${item.quebrasNsr ? ` · ${item.quebrasNsr} quebra(s) NSR` : ''}${!item.leituraCompleta ? ` · ${item.linhasCurtas + item.tiposDesconhecidos} linha(s) não reconhecida(s)` : ''}${detalheProblemas}</td>
    <td>${Number((item.identificadoresBatidas || []).length).toLocaleString('pt-BR')}</td>
    <td>${item.inicio && item.fim ? `${item.inicio.split('-').reverse().join('/')} a ${item.fim.split('-').reverse().join('/')}` : '-'}</td>
  </tr>`;
  }).join('');
  const linhasFalha = falhas.map(item => `<tr class="rep-arquivo-bloqueado"><td><strong>${escapeHtml(item.nome)}</strong><small>Arquivo bloqueado após 3 tentativas</small></td><td><span class="rep-integridade-selo erro">Falha de integridade</span></td><td colspan="5">${escapeHtml(item.motivo)}</td></tr>`).join('');

  const ano = document.getElementById('rep-filter-ano')?.value || 'all';
  const mes = document.getElementById('rep-filter-mes')?.value || 'all';
  const batidasPeriodo = (dadosRepCache.punchesBrutos || []).filter(item => {
    if (!(item.datetime instanceof Date) || isNaN(item.datetime)) return false;
    return (ano === 'all' || String(item.datetime.getFullYear()) === ano) && (mes === 'all' || String(item.datetime.getMonth() + 1).padStart(2, '0') === mes);
  });
  const idsComBatida = new Set(batidasPeriodo.map(item => normalizarPisRep(item.pis)).filter(Boolean));
  const servidoresPorPis = new Map((AppState.servidores || []).map(item => [normalizarPisRep(item.pis), item]).filter(item => item[0]));
  const idsSemNome = Array.from(idsComBatida).filter(pis => !servidoresPorPis.has(pis) && !nomeValidoRep(dadosRepCache.employees.get(pis) || ''));
  const servidoresSemBatida = (AppState.servidores || []).filter(item => item.status !== 'Inativo' && normalizarPisRep(item.pis) && !idsComBatida.has(normalizarPisRep(item.pis)));
  const rotuloPeriodo = ano !== 'all' && mes !== 'all' ? `${mes}/${ano}` : 'período carregado';
  const listaSemNome = idsSemNome.length ? `<details class="rep-diagnostico-identidade erro"><summary>${idsSemNome.length} identificador(es) com batidas, mas sem nome conciliado</summary><p>${idsSemNome.map(escapeHtml).join(' · ')}</p></details>` : '<div class="rep-diagnostico-identidade ok">Todas as batidas possuem um nome conciliado.</div>';
  const listaSemBatida = `<details class="rep-diagnostico-identidade neutro"><summary>${servidoresSemBatida.length} servidor(es) cadastrado(s) sem batidas em ${rotuloPeriodo}</summary><p>${servidoresSemBatida.slice(0, 100).map(item => `${escapeHtml(item.nome)} (${escapeHtml(item.matricula || '-')})`).join(' · ') || 'Nenhum'}</p></details>`;
  container.innerHTML = `<details class="rep-auditoria" ${estavaAberto ? 'open' : ''}>
    <summary><strong>${arquivos.length + falhas.length} arquivos AFD encontrados</strong><span>${arquivos.length}/${arquivos.length + falhas.length} com integridade confirmada · ${totalEncontradas.toLocaleString('pt-BR')} marcações brutas · ${repetidas.toLocaleString('pt-BR')} repetições agrupadas · <b class="${conciliado ? 'rep-valor-positivo' : 'rep-valor-negativo'}">${conciliado ? 'INTEGRIDADE E LEITURA 100% CONFIRMADAS' : 'EXIGE VERIFICAÇÃO'}</b></span></summary>
    <div class="rep-table-wrap"><table class="custom-table rep-tabela-auditoria"><thead><tr><th>Local / arquivo</th><th>Integridade</th><th>Encontradas</th><th>Válidas</th><th>Problemas</th><th>PIS/CPF</th><th>Período</th></tr></thead><tbody>${linhas}${linhasFalha}</tbody></table></div>
    <div class="rep-diagnosticos-identidade">${listaSemNome}${listaSemBatida}</div>
  </details>`;
}

let repContextoProcessamento_ = '';
function atualizarProcessamentoRep(opcoes) {
  if (!dadosRepCache || !dadosRepCache.punches) return;
  opcoes = opcoes || {};

  const anoSel = document.getElementById('rep-filter-ano') ? document.getElementById('rep-filter-ano').value : 'all';
  const mesSel = document.getElementById('rep-filter-mes') ? document.getElementById('rep-filter-mes').value : 'all';
  atualizarCampoFeriadosCompartilhadosRep_();
  const localSel = document.getElementById('rep-filter-local') ? document.getElementById('rep-filter-local').value : 'all';
  const contexto = JSON.stringify([anoSel, mesSel, localSel, configuracaoCalculoRepAtual, obterJornadaReferenciaRep_(), document.getElementById('rep-intervalo-presumido-horas')?.value]);
  const pessoas = repContextoProcessamento_ === contexto && Array.isArray(opcoes.pessoas) && opcoes.pessoas.length
    ? new Set(opcoes.pessoas.map(normalizarPisRep)) : null;

  const punchesFiltrados = dadosRepCache.punches.filter(p => {
    if (pessoas && !pessoas.has(normalizarPisRep(p.pis))) return false;
    if (p.desconsiderada) return false;
    const referencia = /^\d{4}-\d{2}-\d{2}$/.test(String(p.dataReferencia || '')) ? String(p.dataReferencia).split('-').map(Number) : null;
    const y = referencia ? String(referencia[0]) : String(p.datetime.getFullYear());
    const m = referencia ? String(referencia[1]).padStart(2, '0') : String(p.datetime.getMonth() + 1).padStart(2, '0');

    if (anoSel !== 'all' && y !== anoSel) return false;
    if (mesSel !== 'all' && m !== mesSel) return false;
    if (localSel !== 'all' && !String(p.clock || '').split(', ').includes(localSel)) return false;
    return true;
  });

  const recalculados = processDataRep(dadosRepCache.employees, punchesFiltrados, dadosRepCache.lotacoes);
  dadosRepProcessados = pessoas
    ? dadosRepProcessados.filter(p => !pessoas.has(normalizarPisRep(p.pis))).concat(recalculados).sort((a,b) => a.nome.localeCompare(b.nome))
    : recalculados;
  repContextoProcessamento_ = contexto;
  if (!pessoas) paginaRepAtual = 1;
  updateDashboardRep();
  if (!pessoas) renderizarAuditoriaArquivosRep();
  renderizarListaRep();
  // Filtros, feriados e ajustes recalculam a tela sem emitir um novo som.
  // A notificação proativa é reservada ao término de uma nova carga de arquivos.
  observarPreLeituraRepEntidade_(Boolean(opcoes.notificarEntidade));
}

function obterRecorteAtualPreLeituraRep_() {
  const ano = document.getElementById('rep-filter-ano')?.value || 'all';
  const mes = document.getElementById('rep-filter-mes')?.value || 'all';
  const nomesMeses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  let rotulo = 'todo o período carregado';
  if (ano !== 'all' && mes !== 'all') rotulo = (nomesMeses[Number(mes) - 1] || mes) + '/' + ano;
  else if (ano !== 'all') rotulo = 'ano de ' + ano;
  else if (mes !== 'all') rotulo = nomesMeses[Number(mes) - 1] || mes;
  return { ano: ano, mes: mes, chave: ano + '-' + mes, rotulo: rotulo, periodoCompleto: ano === 'all' && mes === 'all' };
}

function montarResumoPreLeituraRepEntidade_() {
  if (currentView !== 'pre-leitura-rep' || !Array.isArray(dadosRepProcessados) || !dadosRepProcessados.length) {
    return { disponivel: false, observacao: 'Nenhuma leitura do REP está carregada nesta sessão.' };
  }

  let marcacoes = 0;
  let alertas = 0;
  let naoConciliados = 0;
  const situacoes = {};
  dadosRepProcessados.forEach(function(emp) {
    alertas += Number(emp.resumo && emp.resumo.pendencias || 0);
    if (emp.naoConciliado) naoConciliados++;
    (emp.dias || []).forEach(function(dia) {
      marcacoes += (dia.batidas || []).length;
      const status = String(dia.status || 'não informado');
      if (status !== 'ok') situacoes[status] = (situacoes[status] || 0) + 1;
    });
  });

  const recorte = obterRecorteAtualPreLeituraRep_();
  const arquivosGlobais = (dadosRepCache.arquivos || []).reduce(function(saida, arquivo) {
    saida.quantidade++;
    saida.marcacoesInvalidas += Number(arquivo.marcacoesInvalidas || 0);
    saida.quebrasNsr += Number(arquivo.quebrasNsr || 0);
    return saida;
  }, { quantidade: 0, marcacoesInvalidas: 0, quebrasNsr: 0 });
  // Linhas inválidas e quebras de NSR são métricas do arquivo completo e não
  // possuem competência confiável. Elas só entram no alerta quando a tela está
  // realmente exibindo todo o período carregado.
  const arquivos = recorte.periodoCompleto
    ? arquivosGlobais
    : {
        quantidade: arquivosGlobais.quantidade,
        marcacoesInvalidas: 0,
        quebrasNsr: 0,
        totaisGlobaisOmitidos: true
      };

  const casosPrioritarios = dadosRepProcessados
    .filter(function(emp) { return emp.naoConciliado || Number(emp.resumo && emp.resumo.pendencias || 0) > 0; })
    .sort(function(a, b) {
      return Number(Boolean(b.naoConciliado)) - Number(Boolean(a.naoConciliado)) ||
        Number(b.resumo && b.resumo.pendencias || 0) - Number(a.resumo && a.resumo.pendencias || 0);
    })
    .slice(0, 5)
    .map(function(emp) {
      return {
        nome: emp.nome,
        identificadorFinal: String(emp.pis || '').slice(-4),
        naoConciliado: Boolean(emp.naoConciliado),
        quantidadeAlertas: Number(emp.resumo && emp.resumo.pendencias || 0),
        saldoEstimadoHoras: Number(emp.resumo && (emp.resumo.saldo != null ? emp.resumo.saldo : emp.resumo.extras) || 0),
        diasPrioritarios: (emp.dias || []).filter(function(dia) { return dia.pendencia || dia.status === 'nao_conciliado'; }).slice(0, 2).map(function(dia) {
          return { data: dia.dataFormatada, situacao: textoSituacaoRep(dia.status) };
        })
      };
    });

  return {
    disponivel: true,
    natureza: 'Contexto temporário calculado localmente; não armazenado na planilha.',
    recorte: recorte,
    servidores: dadosRepProcessados.length,
    marcacoes: marcacoes,
    alertas: alertas,
    naoConciliados: naoConciliados,
    auditoriaArquivos: arquivos,
    situacoesParaConferencia: Object.keys(situacoes).map(function(status) {
      return { situacao: textoSituacaoRep(status), quantidade: situacoes[status] };
    }).sort(function(a, b) { return b.quantidade - a.quantidade; }).slice(0, 6),
    casosPrioritarios: casosPrioritarios
  };
}

function observarPreLeituraRepEntidade_(notificar) {
  const resumo = montarResumoPreLeituraRepEntidade_();
  if (!resumo.disponivel) return;
  const fingerprint = JSON.stringify({
    recorte: resumo.recorte && resumo.recorte.chave,
    servidores: resumo.servidores,
    marcacoes: resumo.marcacoes,
    alertas: resumo.alertas,
    naoConciliados: resumo.naoConciliados,
    arquivos: resumo.auditoriaArquivos,
    casos: resumo.casosPrioritarios.map(function(item) {
      return [item.nome, item.quantidadeAlertas, item.naoConciliado, item.diasPrioritarios];
    })
  });
  if (fingerprint === entidadeUltimoFingerprintRep) return;
  entidadeUltimoFingerprintRep = fingerprint;

  if (!notificar || entidadeFingerprintsRepNotificados.has(fingerprint)) return;
  entidadeFingerprintsRepNotificados.add(fingerprint);
  // A conclusão da leitura não é uma pendência: confirma discretamente, sem
  // criar mensagem no chat da Entidade, ponto de notificação ou histórico.
  tocarSomNotificacao();
  mostrarToast('Leitor de ponto carregado. A conferência está pronta para ' + resumo.recorte.rotulo + '.', 'success');
}

async function aplicarFeriadosRep() {
  const competencia = obterCompetenciaFeriadosRep_();
  if (!competencia) {
    mostrarToast('Selecione um ano e um mês antes de aplicar os feriados.', 'warning');
    return;
  }
  formatarCampoFeriadosRep();
  const tokens = obterTokensFeriadosRep_();
  const invalidos = tokens.filter(valor => !normalizarDataFeriadoRep_(valor));
  if (invalidos.length) {
    mostrarToast('Corrija a(s) data(s) inválida(s): ' + invalidos.join(', '), 'warning');
    return;
  }
  const datas = Array.from(new Set(tokens.map(normalizarDataFeriadoRep_).filter(Boolean))).sort();
  const foraDaCompetencia = datas.filter(function(data) { return data.slice(0, 7) !== competencia; });
  if (foraDaCompetencia.length) {
    mostrarToast('Mantenha no campo somente feriados de ' + competencia.split('-').reverse().join('/') + '.', 'warning');
    return;
  }
  const atuais = Array.from(new Set(feriadosDaCompetenciaRep_(competencia).map(item => item.data).filter(Boolean))).sort();
  const atuaisSet = new Set(atuais);
  const datasSet = new Set(datas);
  const adicionar = datas.filter(data => !atuaisSet.has(data));
  const remover = atuais.filter(data => !datasSet.has(data));
  if (remover.length) {
    const nomes = remover.map(formatarDataExibicaoFeriadoRep_).join(', ');
    const confirmou = await abrirConfirm(`Você removeu ${remover.length} data(s) do calendário compartilhado: ${nomes}.\n\nIsso recalculará as horas extras de toda a equipe. Deseja realmente remover?`);
    if (!confirmou) {
      atualizarCampoFeriadosCompartilhadosRep_(true);
      return;
    }
  }
  try {
    exibirLoader(true, 'Salvando feriados para toda a equipe...');
    const salvos = await chamarBackendPromessa_('atualizarFeriadosRep', [{ adicionar, remover }]);
    feriadosCompartilhadosRep = Array.isArray(salvos) ? salvos : datas.map(data => ({ data }));
    atualizarCampoFeriadosCompartilhadosRep_(true);
    atualizarProcessamentoRep();
    mostrarToast(datas.length ? `${datas.length} data(s) compartilhada(s) com toda a equipe.` : 'Calendário compartilhado de feriados limpo.', 'success');
  } catch (erro) {
    mostrarToast('Não foi possível salvar os feriados: ' + mensagemErro(erro), 'error');
  } finally { exibirLoader(false); }
}

  const linha = document.createElement('div');
  linha.className = 'rep-ajuste-linha';
  linha.dataset.eventId = evento?.eventId || '';
  linha.dataset.origemData = evento?.ajusteOrigemData || dataPadrao || '';
  linha.innerHTML = `<div><label>Dia da jornada</label><input type="date" class="form-control rep-ajuste-data" value="${escapeHtml(dataPadrao || '')}" title="Use o dia anterior quando a saída ocorreu após a meia-noite"></div>
    <div><label>Horário</label><input type="time" class="form-control rep-ajuste-hora" value="${escapeHtml(evento?.horarioOriginal || '')}"></div>
    <div class="rep-ajuste-local"><label>Local</label><input type="text" class="form-control rep-ajuste-local-input" value="${escapeHtml(evento?.local || '')}" placeholder="Local informado na justificativa"></div>
    <label class="rep-ajuste-remover"><input type="checkbox" class="rep-ajuste-desconsiderar"> Desconsiderar</label>`;

}

function abrirAjusteDiaRep(pis, data) {
  const emp = dadosRepProcessados.find(item => item.pis === String(pis));
  const dia = emp && emp.dias.find(item => item.dataOriginal === data);
  if (!emp || !dia) return mostrarToast('Dia não encontrado para ajuste.', 'error');
  const lancamentosServidor = obterLancamentosAusenciaServidorRep_(emp);
  const vinculoManual = (justificativasLancamentoRep || []).find(item => normalizarPisRep(item.pis) === normalizarPisRep(pis) && item.data === data);
  ajusteRepAtual = { pis: String(pis), data, linhaLancamentoOriginal: Number(vinculoManual?.linhaLancamento || 0) };
  document.getElementById('rep-ajuste-titulo').textContent = `${emp.nome} · ${dia.dataFormatada} (${dia.diaSemana})`;
  const container = document.getElementById('rep-ajuste-eventos');
  container.innerHTML = '';
  (dia.batidasDetalhadas || []).forEach(evento => container.appendChild(criarLinhaAjusteRep(evento, data)));
  const detectada = document.getElementById('rep-ajuste-ausencia-detectada');
  detectada.innerHTML = dia.ausencia
    ? `<strong>${escapeHtml(dia.ausencia.tipo)}</strong><span>${escapeHtml(formatarPeriodoAusenciaRep_(dia.ausencia))} · 1Doc: ${escapeHtml(dia.ausencia.idoc || 'não informado')} · ${dia.ausencia.origem === 'manual' ? 'associação manual' : 'identificado automaticamente'}</span>`
    : '<span>Nenhuma ausência foi identificada automaticamente para este dia.</span>';
  const seletor = document.getElementById('rep-ajuste-lancamento');
  seletor.innerHTML = '<option value="0">Usar associação automática</option>' + lancamentosServidor.map(lancamento => {
    const resumo = resumirLancamentoAusenciaRep_(lancamento, 'manual');
    return `<option value="${Number(lancamento.linhaPlanilha)}">${escapeHtml(resumo.tipo)} · ${escapeHtml(formatarPeriodoAusenciaRep_(resumo))} · 1Doc ${escapeHtml(resumo.idoc || 'não informado')}</option>`;
  }).join('');
  seletor.value = String(ajusteRepAtual.linhaLancamentoOriginal || 0);
  const registroCompensacao = (compensacoesRep || []).find(item => normalizarPisRep(item.pis) === normalizarPisRep(pis) && item.data === data);
  const diaSemRegistroCompensavel = Boolean(dia.semRegistro && !dia.diaExtra && !dia.ausencia);
  const deficitMinutos = diaSemRegistroCompensavel
    ? Math.round(obterJornadaReferenciaRep_() * 60)
    : (Number.isFinite(dia.extraDia) && dia.extraDia < 0
      ? Math.round(Math.abs(dia.extraDia) * 60) + Math.max(0, Math.round(Number(dia.compensacao?.minutosAplicados || 0)))
      : 0);
  const saldosOrigem = new Map((emp.resumo.origensSaldoCompensacao || []).map(item => [item.data, {
    liquido: Number(item.minutos || 0),
    bruto: Number(item.minutosBrutos != null ? item.minutosBrutos : item.minutos || 0)
  }]));
  (dia.compensacao?.origensAplicadas || []).forEach(origem => {
    const saldo = saldosOrigem.get(origem.data) || { liquido: 0, bruto: 0 };
    saldo.liquido += Number(origem.minutosLiquidos != null ? origem.minutosLiquidos : origem.minutos || 0);
    saldo.bruto += Number(origem.minutos || 0);
    const diaOrigem = emp.dias.find(item => item.dataOriginal === origem.data);
    const intervaloBruto = diaOrigem?.diaExtra ? Math.max(0, Math.round(Number(diaOrigem.descontoIntervalo || 0) * 60)) : 0;
    saldo.bruto = Math.max(saldo.bruto, saldo.liquido + intervaloBruto);
    saldosOrigem.set(origem.data, saldo);
  });
  const origensRegistradas = Array.isArray(registroCompensacao?.origens) && registroCompensacao.origens.length
    ? registroCompensacao.origens
    : (dia.compensacao?.origensAplicadas || []);
  const valoresOrigem = new Map(origensRegistradas.map(item => [item.data, Number(item.minutos || 0)]));
  const usadosOutrosDestinos = new Map();
  const autorizacoesConhecidas = new Map();
  (autorizacoesCompensacaoRep || []).filter(item => normalizarPisRep(item.pis) === normalizarPisRep(pis) && String(item.data || '').slice(0, 7) === data.slice(0, 7)).forEach(item => {
    autorizacoesConhecidas.set(item.data, Math.max(autorizacoesConhecidas.get(item.data) || 0, Number(item.minutos || 0)));
  });
  (compensacoesRep || []).filter(item => normalizarPisRep(item.pis) === normalizarPisRep(pis) && item.data !== data).forEach(item => {
    (Array.isArray(item.origens) ? item.origens : []).forEach(origem => {
      usadosOutrosDestinos.set(origem.data, (usadosOutrosDestinos.get(origem.data) || 0) + Math.max(0, Number(origem.minutos || 0)));
      if (Number(origem.autorizado) > 0) autorizacoesConhecidas.set(origem.data, Math.max(autorizacoesConhecidas.get(origem.data) || 0, Number(origem.autorizado)));
    });
  });
  origensRegistradas.forEach(origem => {
    if (Number(origem.autorizado) > 0) autorizacoesConhecidas.set(origem.data, Math.max(autorizacoesConhecidas.get(origem.data) || 0, Number(origem.autorizado)));
  });
  const ordemDocumento = new Map((autorizacoesCompensacaoRep || []).filter(item => normalizarPisRep(item.pis) === normalizarPisRep(pis)).map(item => [item.data, Number(item.ordem || 9999)]));
  const datasOrigem = Array.from(new Set([...saldosOrigem.keys(), ...valoresOrigem.keys()]))
    .filter(dataOrigem => dataOrigem !== data && dataOrigem.slice(0, 7) === data.slice(0, 7))
    .sort((a, b) => (Number(ordemDocumento.get(a) || 9999) - Number(ordemDocumento.get(b) || 9999)) || a.localeCompare(b));
  const containerOrigens = document.getElementById('rep-compensacao-origens');
  containerOrigens.innerHTML = datasOrigem.map(dataOrigem => {
    const saldo = saldosOrigem.get(dataOrigem) || { liquido: 0, bruto: 0 };
    const capacidadeLiquida = Math.max(0, Math.round(Number(saldo.liquido || 0)));
    const capacidadeBruta = Math.max(capacidadeLiquida, Math.round(Number(saldo.bruto || 0)));
    const valor = Math.min(capacidadeBruta, Math.max(0, Math.round(Number(valoresOrigem.get(dataOrigem) || 0))));
    const usadoOutros = Math.max(0, Math.round(Number(usadosOutrosDestinos.get(dataOrigem) || 0)));
    const autorizado = Math.max(valor + usadoOutros, Math.round(Number(autorizacoesConhecidas.get(dataOrigem) || 0)));
    const diaOrigem = emp.dias.find(item => item.dataOriginal === dataOrigem);
    const detalheIntervalo = capacidadeBruta > capacidadeLiquida ? ` · aplica ${minutosParaHoraRep_(capacidadeLiquida)}h após o intervalo` : '';
    return `<label class="rep-compensacao-origem"><span><strong>${escapeHtml(dataOrigem.split('-').reverse().join('/'))}${diaOrigem?.diaSemana ? ` · ${escapeHtml(diaOrigem.diaSemana)}` : ''}</strong><small>Saldo: ${minutosParaHoraRep_(capacidadeBruta)}h${detalheIntervalo} · já usado em outros dias: ${minutosParaHoraRep_(usadoOutros)}h</small></span><small>Autorizado no documento</small><input type="text" class="form-control rep-compensacao-origem-autorizado" data-data="${dataOrigem}" data-usado-outros="${usadoOutros}" value="${autorizado ? minutosParaHoraRep_(autorizado) : ''}" placeholder="00:00" maxlength="5" inputmode="numeric" oninput="atualizarTotalOrigensCompensacaoRep_()"><small>Usar neste dia</small><input type="text" class="form-control rep-compensacao-origem-valor" data-data="${dataOrigem}" data-maximo="${capacidadeBruta}" data-liquido-maximo="${capacidadeLiquida}" value="${valor ? minutosParaHoraRep_(valor) : ''}" placeholder="00:00" maxlength="5" inputmode="numeric" oninput="atualizarTotalOrigensCompensacaoRep_()"></label>`;
  }).join('') || '<span class="form-help">Não há dias com saldo positivo disponível nesta competência.</span>';
  const disponivelMinutos = Array.from(saldosOrigem.values()).reduce((total, saldo) => total + Math.max(0, Number(saldo.liquido || 0)), 0);
  const podeCompensar = deficitMinutos > 0 && !dia.ausencia && !dia.pendencia && (dia.jornadaIncompleta || diaSemRegistroCompensavel || dia.compensacao);
  ajusteRepAtual.compensacaoOriginal = Number(registroCompensacao?.minutos || 0);
  ajusteRepAtual.compensacaoObservacaoOriginal = String(registroCompensacao?.observacao || '');
  ajusteRepAtual.compensacaoOrigensOriginal = JSON.stringify(Array.isArray(registroCompensacao?.origens) ? registroCompensacao.origens : []);
  ajusteRepAtual.maximoCompensavel = deficitMinutos;
  const blocoCompensacao = document.getElementById('rep-ajuste-compensacao');
  blocoCompensacao.hidden = !(podeCompensar && (disponivelMinutos > 0 || registroCompensacao));
  blocoCompensacao.open = false;
  blocoCompensacao.dataset.maximo = String(deficitMinutos);
  atualizarTotalOrigensCompensacaoRep_();
  document.getElementById('rep-ajuste-compensacao-observacao').value = registroCompensacao?.observacao || '';
  document.getElementById('rep-ajuste-compensacao-resumo').innerHTML = `<span>${diaSemRegistroCompensavel ? 'Jornada sem registro a compensar' : 'Horas abaixo da jornada'}: <b>${minutosParaHoraRep_(deficitMinutos)}h</b></span><span>Saldo líquido disponível no mês: <b>${minutosParaHoraRep_(disponivelMinutos)}h</b></span><span>Aplicação desta compensação: <b id="rep-compensacao-total-liquido">00:00h</b></span>`;
  atualizarTotalOrigensCompensacaoRep_();
  const registroValidacao = (validacoesRep || []).find(item => normalizarPisRep(item.pis) === normalizarPisRep(pis) && item.data === data && item.validado);
  ajusteRepAtual.validadoOriginal = Boolean(registroValidacao);
  ajusteRepAtual.validacaoObservacaoOriginal = String(registroValidacao?.observacao || '');
  const blocoValidacao = document.getElementById('rep-ajuste-validacao');
  blocoValidacao.hidden = !(registroValidacao || dia.pendencia || dia.jornadaIncompleta || dia.status === 'falta_sem_registro');
  document.getElementById('rep-ajuste-validado').checked = Boolean(registroValidacao);
  document.getElementById('rep-ajuste-validacao-observacao').value = registroValidacao?.observacao || '';
  document.getElementById('rep-ajuste-justificativa').value = '';
  abrirModal('modal-ajuste-rep');
  carregarTetosAutorizadosNoAjusteRep_(pis, data);
}

async function carregarTetosAutorizadosNoAjusteRep_(pis, data) {
  try {
    autorizacoesCompensacaoRep = await chamarBackendPromessa_('listarAutorizacoesCompensacaoRep', []);
    if (!ajusteRepAtual || normalizarPisRep(ajusteRepAtual.pis) !== normalizarPisRep(pis) || ajusteRepAtual.data !== data) return;
    document.querySelectorAll('#rep-compensacao-origens .rep-compensacao-origem-autorizado').forEach(input => {
      const registro = (autorizacoesCompensacaoRep || []).find(item => normalizarPisRep(item.pis) === normalizarPisRep(pis) && item.data === input.dataset.data);
      if (registro && !input.value.trim()) input.value = minutosParaHoraRep_(Number(registro.minutos || 0));
    });
    const container = document.getElementById('rep-compensacao-origens');
    if (container) Array.from(container.querySelectorAll('.rep-compensacao-origem')).sort((a, b) => {
      const dataA = a.querySelector('.rep-compensacao-origem-autorizado')?.dataset.data || '';
      const dataB = b.querySelector('.rep-compensacao-origem-autorizado')?.dataset.data || '';
      const regA = (autorizacoesCompensacaoRep || []).find(item => normalizarPisRep(item.pis) === normalizarPisRep(pis) && item.data === dataA);
      const regB = (autorizacoesCompensacaoRep || []).find(item => normalizarPisRep(item.pis) === normalizarPisRep(pis) && item.data === dataB);
      return (Number(regA?.ordem || 9999) - Number(regB?.ordem || 9999)) || dataA.localeCompare(dataB);
    }).forEach(elemento => container.appendChild(elemento));
    atualizarTotalOrigensCompensacaoRep_();
  } catch (erro) { console.warn('Tetos autorizados não puderam ser carregados:', mensagemErro(erro)); }
}

function preencherCompensacaoMaximaRep_() {
  const bloco = document.getElementById('rep-ajuste-compensacao');
  let restante = Math.max(0, Number(bloco?.dataset.maximo || 0));
  document.querySelectorAll('#rep-compensacao-origens .rep-compensacao-origem-valor').forEach(input => {
    const maximoBruto = Math.max(0, Number(input.dataset.maximo || 0));
    const maximoLiquido = Math.max(0, Number(input.dataset.liquidoMaximo || maximoBruto));
    const autorizadoInput = input.closest('.rep-compensacao-origem')?.querySelector('.rep-compensacao-origem-autorizado');
    const autorizado = horaParaMinutosRep_(autorizadoInput?.value.trim() || '') || 0;
    const usadoOutros = Math.max(0, Number(autorizadoInput?.dataset.usadoOutros || 0));
    const limiteDocumento = Math.max(0, autorizado - usadoOutros);
    const valor = Math.min(limiteDocumento, restante >= maximoLiquido ? maximoBruto : Math.min(restante, maximoBruto));
    input.value = valor ? minutosParaHoraRep_(valor) : '';
    restante -= Math.min(valor, maximoLiquido);
  });
  atualizarTotalOrigensCompensacaoRep_();
}

function limparOrigensCompensacaoRep_() {
  document.querySelectorAll('#rep-compensacao-origens .rep-compensacao-origem-valor').forEach(input => { input.value = ''; });
  atualizarTotalOrigensCompensacaoRep_();
}

function obterOrigensCompensacaoFormularioRep_() {
  const origens = [];
  let invalida = false;
  let totalBruto = 0;
  document.querySelectorAll('#rep-compensacao-origens .rep-compensacao-origem-valor').forEach(input => {
    const texto = input.value.trim();
    if (!texto || texto === '00:00') return;
    const minutos = horaParaMinutosRep_(texto);
    const maximo = Math.max(0, Number(input.dataset.maximo || 0));
    const autorizadoInput = input.closest('.rep-compensacao-origem')?.querySelector('.rep-compensacao-origem-autorizado');
    const autorizado = horaParaMinutosRep_(autorizadoInput?.value.trim() || '');
    const usadoOutros = Math.max(0, Number(autorizadoInput?.dataset.usadoOutros || 0));
    if (minutos === null || minutos <= 0 || minutos > maximo || autorizado === null || autorizado <= 0 || minutos + usadoOutros > autorizado) { invalida = true; return; }
    origens.push({ data: input.dataset.data, minutos, autorizado });
    totalBruto += minutos;
  });
  const deficit = Math.max(0, Number(document.getElementById('rep-ajuste-compensacao')?.dataset.maximo || 0));
  const minutosLiquidos = deficit ? Math.min(totalBruto, deficit) : totalBruto;
  if (deficit && totalBruto > deficit + 60) invalida = true;
  return { origens, invalida, minutosLiquidos, totalBruto };
}

function atualizarTotalOrigensCompensacaoRep_() {
  const resultado = obterOrigensCompensacaoFormularioRep_();
  const total = resultado.origens.reduce((soma, origem) => soma + origem.minutos, 0);
  const campo = document.getElementById('rep-ajuste-compensacao-horas');
  if (campo) {
    campo.value = minutosParaHoraRep_(total);
    campo.classList.toggle('input-error', resultado.invalida);
  }
  const liquido = document.getElementById('rep-compensacao-total-liquido');
  if (liquido) liquido.textContent = `${minutosParaHoraRep_(resultado.minutosLiquidos)}h`;
  return resultado;
}

function adicionarLinhaAjusteRep() {
  document.getElementById('rep-ajuste-eventos').appendChild(criarLinhaAjusteRep(null, ajusteRepAtual?.data || ''));
}

function criarDataAjusteRep(dataIso, hora) {
  const data = String(dataIso).split('-').map(Number);
  const horario = String(hora).split(':').map(Number);
  if (data.length !== 3 || horario.length !== 2) return null;
  return new Date(data[0], data[1] - 1, data[2], horario[0], horario[1], 0, 0);
}

async function salvarAjustesDiaRep() {
  if (!ajusteRepAtual) return;
  const justificativa = document.getElementById('rep-ajuste-justificativa').value.trim();
  const linhas = Array.from(document.querySelectorAll('#rep-ajuste-eventos .rep-ajuste-linha'));

    observacaoCompensacao = document.getElementById('rep-ajuste-compensacao-observacao').value.trim();
    autorizacoesFormulario = Array.from(document.querySelectorAll('#rep-compensacao-origens .rep-compensacao-origem-autorizado')).map((input, indice) => {

      if (minutos === null || minutos < usadoOutros || minutos > capacidade + usadoOutros) erroAutorizacaoFormulario = 'Revise o teto autorizado para ' + input.dataset.data.split('-').reverse().join('/') + '.';
      return { data: input.dataset.data, minutos, ordem: indice + 1 };
    });
  }
  if (erroAutorizacaoFormulario) return mostrarToast(erroAutorizacaoFormulario, 'warning');

  const origensNormalizadas = JSON.stringify((origensCompensacao || []).map(item => ({ data: String(item.data || ''), minutos: Number(item.minutos || 0), autorizado: Number(item.autorizado || 0) })).sort((a, b) => a.data.localeCompare(b.data)));
  let origensOriginaisNormalizadas = '[]';
  try {

  } catch (e) {}
  const alterouCompensacao = minutosCompensacao !== Number(ajusteRepAtual.compensacaoOriginal || 0) || observacaoCompensacao !== String(ajusteRepAtual.compensacaoObservacaoOriginal || '') || origensNormalizadas !== origensOriginaisNormalizadas;
  const alterouAutorizacoes = autorizacoesFormulario.some(item => {

    return Number(existente?.minutos || 0) !== item.minutos || (item.minutos > 0 && Number(existente?.ordem || 0) !== item.ordem);
  });
  const blocoValidacao = document.getElementById('rep-ajuste-validacao');
  const validado = blocoValidacao && !blocoValidacao.hidden ? document.getElementById('rep-ajuste-validado').checked : Boolean(ajusteRepAtual.validadoOriginal);
  const observacaoValidacao = blocoValidacao && !blocoValidacao.hidden ? document.getElementById('rep-ajuste-validacao-observacao').value.trim() : String(ajusteRepAtual.validacaoObservacaoOriginal || '');
  const alterouValidacao = validado !== Boolean(ajusteRepAtual.validadoOriginal) || observacaoValidacao !== String(ajusteRepAtual.validacaoObservacaoOriginal || '');
  const novos = [];
  const competenciasAfetadas = new Set([ajusteRepAtual.data.slice(0, 7)]);
  const origensAfetadas = new Set([ajusteRepAtual.data]);
  linhas.forEach((linha, indice) => {
    const eventId = linha.dataset.eventId;
    const dataInformada = linha.querySelector('.rep-ajuste-data').value || ajusteRepAtual.data;
    const hora = linha.querySelector('.rep-ajuste-hora').value;
    const local = linha.querySelector('.rep-ajuste-local-input').value.trim() || 'Local informado manualmente';
    const remover = linha.querySelector('.rep-ajuste-desconsiderar').checked;

      enfileirarAlteracaoRep_('VALIDACAO', dadosValidacao, `VALIDACAO|${normalizarPisRep(ajusteRepAtual.pis)}|${ajusteRepAtual.data}`);
      validacoesRep = (validacoesRep || []).filter(item => !(normalizarPisRep(item.pis) === normalizarPisRep(ajusteRepAtual.pis) && item.data === ajusteRepAtual.data));
      if (validado) validacoesRep.push({ pis: ajusteRepAtual.pis, data: ajusteRepAtual.data, validado: true, observacao: observacaoValidacao, atualizadoPor: AppState.usuarioLogado?.nome || AppState.usuarioLogado?.email || '' });
    } catch (erro) {
      estadoAnterior.forEach(item => {
        item.p.desconsiderada = item.desconsiderada;
        item.p.ajusteJustificativa = item.ajusteJustificativa;
      });
      exibirLoader(false);
      return mostrarToast('Não foi possível salvar a validação: ' + mensagemErro(erro), 'error');
    }
  }
  if (alteracoes) {
    try {
      exibirLoader(true, 'Salvando ajustes para toda a equipe...');
      for (const competencia of competenciasAfetadas) {
        const origens = Array.from(origensAfetadas).filter(data => data.slice(0, 7) === competencia);
        await salvarAjustesCompetenciaRep_(ajusteRepAtual.pis, competencia, novos, origens);
      }
    } catch (erro) {
      estadoAnterior.forEach(item => {
        item.p.desconsiderada = item.desconsiderada;
        item.p.ajusteJustificativa = item.ajusteJustificativa;
      });
      exibirLoader(false);
      return mostrarToast('Não foi possível compartilhar os ajustes: ' + mensagemErro(erro), 'error');
    }
  }
  dadosRepCache.punches.push(...novos);
  if (alteracoes) aplicarAjustesCompartilhadosRep_();
  fecharModal('modal-ajuste-rep');
  exibirLoader(false);
  if (typeof agendarReprocessamentoRepLeve_ === 'function') agendarReprocessamentoRepLeve_(260);
  else setTimeout(function() { atualizarProcessamentoRep({ notificarEntidade: false }); }, 260);
  mostrarToast(alterouValidacao && !alteracoes && !alterouLancamento && !alterouCompensacao ? (validado ? 'Alerta validado e retirado da conferência.' : 'Alerta reaberto para conferência.') : (alterouCompensacao && !alteracoes && !alterouLancamento ? 'Compensação de jornada salva.' : 'Ajuste aplicado sem alterar o AFD original.'), 'success');
}

function iniciarArrasteMarcacaoRep_(event, eventId, dataOrigem) {
  if (!event?.dataTransfer || !eventId || !pisSelecionadoRep) return;
  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('text/plain', JSON.stringify({
    pis: String(pisSelecionadoRep),
    eventId: String(eventId),
    dataOrigem: String(dataOrigem || '')
  }));
  event.currentTarget?.classList.add('arrastando');
}

function finalizarArrasteMarcacaoRep_(event) {
  event?.currentTarget?.classList.remove('arrastando');
  document.querySelectorAll('.rep-dia-destino-arraste').forEach(item => item.classList.remove('rep-dia-destino-arraste'));
}

function permitirSoltarMarcacaoRep_(event) {
  event.preventDefault();
  if (event.dataTransfer) event.dataTransfer.dropEffect = 'move';
  event.currentTarget?.classList.add('rep-dia-destino-arraste');
}

function sairDestinoMarcacaoRep_(event) {
  if (event.currentTarget && !event.currentTarget.contains(event.relatedTarget)) {
    event.currentTarget.classList.remove('rep-dia-destino-arraste');
  }
}

async function soltarMarcacaoRep_(event, dataDestino) {
  event.preventDefault();
  event.currentTarget?.classList.remove('rep-dia-destino-arraste');
  let dados;
  try { dados = JSON.parse(event.dataTransfer?.getData('text/plain') || '{}'); } catch (e) { return; }
  if (!dados.eventId || dados.pis !== String(pisSelecionadoRep) || dados.dataOrigem === dataDestino) return;

  const registro = (dadosRepCache.punches || []).find(item => String(item.eventId || '') === String(dados.eventId));
  if (!registro || registro.desconsiderada) return mostrarToast('Essa marcação não está mais disponível para mover.', 'warning');
  const hora = `${String(registro.datetime.getHours()).padStart(2, '0')}:${String(registro.datetime.getMinutes()).padStart(2, '0')}`;
  const origemExibida = String(dados.dataOrigem || toDateStringRep(registro.datetime)).split('-').reverse().join('/');
  const destinoExibido = String(dataDestino).split('-').reverse().join('/');
  const confirmou = await abrirConfirm(`Mover a marcação das ${hora} de ${origemExibida} para a jornada de ${destinoExibido}?\n\nO AFD original será preservado e o ajuste ficará disponível para toda a equipe.`, 'Confirmar mudança de dia');
  if (!confirmou) return;

  const origemAjuste = String(registro.ajusteOrigemData || dados.dataOrigem || toDateStringRep(registro.datetime));
  const competencia = origemAjuste.slice(0, 7);
  const estadoAnterior = {
    desconsiderada: registro.desconsiderada,
    ajusteJustificativa: registro.ajusteJustificativa,
    dataReferencia: registro.dataReferencia
  };
  let novo = null;

  if (registro.manual) {
    registro.dataReferencia = dataDestino;
    registro.justificativa = registro.justificativa || 'Marcação vinculada a outra jornada por arrastar e soltar.';
  } else {
    registro.desconsiderada = true;
    registro.ajusteJustificativa = 'Marcação vinculada a outra jornada por arrastar e soltar.';
    const idManual = `MANUAL|${gerarUuidSeguroCliente_()}|ARRASTE`;
    novo = {
      pis: dados.pis,
      datetime: new Date(registro.datetime.getTime()),
      clock: registro.clock || 'Local não informado',
      deviceSerial: 'AJUSTE MANUAL', nsr: 'MANUAL', lineNumber: '',
      eventId: idManual, eventKey: `AJUSTE|${idManual}`,
      nomeNoMomento: dadosRepCache.employees.get(dados.pis) || '',
      sourceFile: 'Ajuste compartilhado', rawTimestamp: registro.datetime.getTime(),
      manual: true, ajusteCompartilhado: true, dataReferencia: dataDestino,
      ajusteOrigemData: origemAjuste,
      justificativa: 'Marcação vinculada a outra jornada por arrastar e soltar.'
    };
  }

  try {
    exibirLoader(true, 'Movendo marcação para o dia correto...');
    await salvarAjustesCompetenciaRep_(dados.pis, competencia, novo ? [novo] : [], [origemAjuste]);
    if (novo) dadosRepCache.punches.push(novo);
    aplicarAjustesCompartilhadosRep_();
    atualizarProcessamentoRep({ notificarEntidade: false });
    mostrarToast(`Marcação das ${hora} movida para ${destinoExibido}.`, 'success');
  } catch (erro) {
    registro.desconsiderada = estadoAnterior.desconsiderada;
    registro.ajusteJustificativa = estadoAnterior.ajusteJustificativa;
    registro.dataReferencia = estadoAnterior.dataReferencia;
    mostrarToast('Não foi possível mover a marcação: ' + mensagemErro(erro), 'error');
  } finally {
    exibirLoader(false);
    finalizarArrasteMarcacaoRep_(event);
  }
}

async function restaurarAjustesDiaRep() {
  if (!ajusteRepAtual) return;
  const listaAnterior = dadosRepCache.punches.slice();
  const estados = listaAnterior.map(p => ({ p, desconsiderada: p.desconsiderada, desconsideradaCompartilhada: p.desconsideradaCompartilhada, ajusteJustificativa: p.ajusteJustificativa }));
  dadosRepCache.punches.forEach(p => {
    if (!p.manual && normalizarPisRep(p.pis) === normalizarPisRep(ajusteRepAtual.pis) && toDateStringRep(p.datetime) === ajusteRepAtual.data) {
      p.desconsiderada = false;
      p.desconsideradaCompartilhada = false;
      delete p.ajusteJustificativa;
    }
  });
  dadosRepCache.punches = dadosRepCache.punches.filter(p => !(p.manual && normalizarPisRep(p.pis) === normalizarPisRep(ajusteRepAtual.pis) && String(p.ajusteOrigemData || toDateStringRep(p.datetime)) === ajusteRepAtual.data));
  try {
    exibirLoader(true, 'Restaurando dados para toda a equipe...');
    await salvarAjustesCompetenciaRep_(ajusteRepAtual.pis, ajusteRepAtual.data.slice(0, 7), [], [ajusteRepAtual.data]);
    aplicarAjustesCompartilhadosRep_();
  } catch (erro) {
    dadosRepCache.punches = listaAnterior;
    estados.forEach(item => {
      item.p.desconsiderada = item.desconsiderada;
      item.p.desconsideradaCompartilhada = item.desconsideradaCompartilhada;
      item.p.ajusteJustificativa = item.ajusteJustificativa;
    });
    exibirLoader(false);
    return mostrarToast('Não foi possível restaurar os ajustes compartilhados: ' + mensagemErro(erro), 'error');
  }
  fecharModal('modal-ajuste-rep');
  atualizarProcessamentoRep();
  exibirLoader(false);
  mostrarToast('Dados originais restaurados para toda a equipe.', 'success');
}

function abrirFusaoRep(identificadorRep) {

async function confirmarFusaoRep() {
  const identificadorPrincipal = String(fusaoRepAtual || '');
  const destino = normalizarPisRep(document.getElementById('rep-fusao-servidor')?.value || '');
  const identificadorAdicional = String(document.getElementById('rep-fusao-origem')?.value || '');
  if (!identificadorPrincipal || !destino) return mostrarToast('Selecione o nome correto no cadastro.', 'warning');

  const servidor = (AppState.servidores || []).find(item => normalizarPisRep(item.pis) === destino);
  if (!servidor) return mostrarToast('Servidor do cadastro não encontrado.', 'error');

  const identificadores = new Set([identificadorPrincipal, identificadorAdicional, destino].filter(Boolean));
  exibirLoader(true, 'Salvando vínculo permanente do REP...');
  try {
    await chamarBackendPromessa_('salvarVinculosRep', [{ identificadores: Array.from(identificadores), pisOficial: destino }]);
  } catch (erro) {
    exibirLoader(false);
    return mostrarToast(`Não foi possível salvar o vínculo: ${mensagemErro(erro)}`, 'error');
  }
  const eventos = new Set([...(dadosRepCache.punchesBrutos || []), ...(dadosRepCache.punches || [])]);
  let totalAssociado = 0;
  eventos.forEach(evento => {
    const identificadorOriginal = String(evento.pis || '');
    if (!identificadores.has(identificadorOriginal)) return;
    if (identificadorOriginal !== destino) evento.pisOriginal = evento.pisOriginal || identificadorOriginal;
    evento.pis = destino;
    evento.fusaoManual = true;
    totalAssociado++;
  });
  if (!totalAssociado) {
    exibirLoader(false);
    return mostrarToast('Não foram encontradas batidas para os registros escolhidos.', 'warning');
  }

  dadosRepCache.employees.set(destino, servidor.nome || 'Servidor');
  dadosRepCache.lotacoes.set(destino, String(servidor.lotacao || 'Não informada').trim() || 'Não informada');
  identificadores.forEach(identificador => dadosRepCache.vinculos.set(identificador, {
    identificador, pisOficial: destino, nome: servidor.nome, matricula: servidor.matricula, lotacao: servidor.lotacao || 'Não informada'
  }));
  identificadores.forEach(identificador => {
    if (identificador === destino) return;
    dadosRepCache.employees.delete(identificador);
    dadosRepCache.lotacoes.delete(identificador);
  });
  dadosRepCache.punches = deduplicarBatidasRep(dadosRepCache.punches || []);
  dadosRepCache.fusoes = dadosRepCache.fusoes || [];
  dadosRepCache.fusoes.push({ destino, origens: Array.from(identificadores), nome: servidor.nome, matricula: servidor.matricula, lotacao: servidor.lotacao, batidas: totalAssociado, em: new Date().toISOString() });
  pisSelecionadoRep = destino;
  fusaoRepAtual = null;
  fecharModal('modal-fusao-rep');
  atualizarProcessamentoRep();
  exibirLoader(false);
  mostrarToast(`${totalAssociado} batida(s) vinculadas a ${servidor.nome} (${servidor.lotacao || 'lotação não informada'}).`, 'success');
}
