function obterCompetenciaSelecionadaRep_() {
  const ano = document.getElementById('rep-filter-ano')?.value || 'all';
  const mes = document.getElementById('rep-filter-mes')?.value || 'all';
  return /^\d{4}$/.test(ano) && /^(0[1-9]|1[0-2])$/.test(mes) ? `${ano}-${mes}` : '';
}

function obterApontamentosServidorPeriodoRep_(pis, dias) {
  const competencia = obterCompetenciaSelecionadaRep_();
  const datas = new Set((dias || []).map(dia => dia.dataOriginal));
  return (apontamentosRep || []).filter(item => {
    if (normalizarPisRep(item.pis) !== normalizarPisRep(pis)) return false;
    if (competencia) return String(item.data || '').slice(0, 7) === competencia;
    return item.escopo === 'SERVIDOR' || datas.has(String(item.data || ''));
  });
}

function montarAnaliseFuncionarioRepEntidade_(emp) {
  if (!emp) return null;
  const recorte = obterRecorteAtualPreLeituraRep_();
  const jornadaReferencia = Number(document.getElementById('rep-jornada-horas')?.value) || 8;
  const dias = Array.isArray(emp.dias) ? emp.dias : [];
  const apontamentos = obterApontamentosServidorPeriodoRep_(emp.pis, dias);
  const contagens = {};
  dias.forEach(function(dia) {
    const status = String(dia.status || 'não informado');
    contagens[status] = (contagens[status] || 0) + 1;
  });

  const padroes = [];
  const adicionarPadrao = function(condicao, texto) { if (condicao) padroes.push(texto); };
  adicionarPadrao(contagens.impar, contagens.impar + ' dia(s) com quantidade ímpar de batidas; falta conferir entrada ou saída.');
  adicionarPadrao(contagens.batidas_excedentes, contagens.batidas_excedentes + ' dia(s) com mais de quatro batidas; conferir duplicidade ou jornada fracionada.');
  adicionarPadrao(contagens.colisao_reps, contagens.colisao_reps + ' dia(s) com batidas simultâneas vindas de REPs diferentes.');
  adicionarPadrao(contagens.conflito_arredondamento, contagens.conflito_arredondamento + ' dia(s) em que o arredondamento fez horários distintos colidirem.');
  adicionarPadrao(contagens.intervalo_presumido || contagens.extra_intervalo_presumido,
    (Number(contagens.intervalo_presumido || 0) + Number(contagens.extra_intervalo_presumido || 0)) + ' dia(s) tiveram intervalo descontado por presunção porque o almoço não foi registrado.');
  adicionarPadrao(contagens.intervalo_inferior_minimo, contagens.intervalo_inferior_minimo + ' dia(s) tiveram complemento automático do intervalo mínimo.');
  adicionarPadrao(contagens.jornada_incompleta, contagens.jornada_incompleta + ' dia(s) úteis terminaram abaixo da jornada de referência.');
  adicionarPadrao(contagens.ausencia_com_batidas, contagens.ausencia_com_batidas + ' dia(s) possuem afastamento lançado e batidas no REP na mesma data.');
  adicionarPadrao(contagens.nao_conciliado || emp.naoConciliado, 'A identificação do REP ainda não está conciliada de forma confiável com o cadastro.');
  adicionarPadrao(apontamentos.some(function(item) { return item.status !== 'CONCLUIDO'; }),
    apontamentos.filter(function(item) { return item.status !== 'CONCLUIDO'; }).length + ' apontamento(s) permanecem abertos nesta competência.');

  const diasCriticos = dias
    .filter(function(dia) {
      return Boolean(dia.pendencia || dia.jornadaIncompleta || dia.status === 'ausencia_com_batidas' || dia.status === 'nao_conciliado');
    })
    .sort(function(a, b) {
      const peso = function(dia) {
        if (dia.status === 'ausencia_com_batidas' || dia.status === 'colisao_reps') return 4;
        if (dia.isImpar || dia.batidasExcedentes || dia.conflitoArredondamento) return 3;
        if (dia.jornadaIncompleta) return 2;
        return 1;
      };
      return peso(b) - peso(a) || String(a.dataOriginal).localeCompare(String(b.dataOriginal));
    })
    .slice(0, 15)
    .map(function(dia) {
      return {
        data: dia.dataFormatada,
        diaSemana: dia.diaSemana,
        batidas: (dia.batidas || []).slice(0, 8),
        horasApuradas: Number.isFinite(dia.totalDia) ? Number(dia.totalDia.toFixed(2)) : null,
        saldoEstimado: Number.isFinite(dia.saldoDia) ? Number(dia.saldoDia.toFixed(2)) : null,
        situacao: textoSituacaoRep(dia.status),
        ausencia: dia.ausencia ? {
          tipo: dia.ausencia.tipo,
          periodo: formatarPeriodoAusenciaRep_(dia.ausencia),
          idoc: dia.ausencia.idoc || 'não informado'
        } : null
      };
    });

  return {
    escopoEstrito: 'Interpretar somente este funcionário e a competência selecionada. Não usar outros funcionários do Leitor REP.',
    natureza: 'Pré-leitura auxiliar; saldos e horas extras são estimativas para conferência, não autorização administrativa.',
    competencia: recorte.rotulo,
    funcionario: {
      nome: emp.nome,
      identificadorFinal: String(emp.pis || '').slice(-4),
      lotacao: emp.lotacao || 'Não informada',
      conciliadoComCadastro: !emp.naoConciliado
    },
    jornadaReferenciaHoras: jornadaReferencia,
    resumoCalculado: {
      diasNoRecorte: dias.length,
      horasApuradas: Number(Number(emp.resumo?.trabalhadas || 0).toFixed(2)),
      horasPositivasSomadas: Number(Number(emp.resumo?.horasExtras || 0).toFixed(2)),
      balancoEstimado: Number(Number(emp.resumo?.saldo || 0).toFixed(2)),
      valesRefeicaoEstimados: Number(emp.resumo?.valeRefeicao || 0),
      diasParaConferir: Number(emp.resumo?.pendencias || 0),
      apontamentosAbertos: apontamentos.filter(function(item) { return item.status !== 'CONCLUIDO'; }).length
    },
    padroesDetectados: padroes,
    diasCriticos: diasCriticos,
    diasCriticosOmitidos: Math.max(0, dias.filter(function(dia) {
      return Boolean(dia.pendencia || dia.jornadaIncompleta || dia.status === 'ausencia_com_batidas' || dia.status === 'nao_conciliado');
    }).length - diasCriticos.length),
    apontamentos: apontamentos.slice(0, 10).map(function(item) {
      return {
        data: item.data || '',
        escopo: item.escopo || '',
        status: item.status || '',
        texto: String(item.texto || '').slice(0, 350)
      };
    })
  };
}

function abrirApontamentoRep(pis, data, escopo, eventoChave, id) {
  let existente = null;
  if (id) existente = (apontamentosRep || []).find(item => item.id === id) || null;
  const escopoFinal = existente ? existente.escopo : String(escopo || 'DIA').toUpperCase();
  let dataFinal = existente ? existente.data : String(data || '');
  if (escopoFinal === 'SERVIDOR' && !dataFinal) {
    const competencia = obterCompetenciaSelecionadaRep_();
    if (!competencia) return mostrarToast('Selecione um ano e um mês para criar o apontamento do servidor.', 'warning');
    dataFinal = competencia + '-01';
  }
  const pisFinal = normalizarPisRep(existente ? existente.pis : pis);
  const servidor = dadosRepProcessados.find(item => normalizarPisRep(item.pis) === pisFinal);
  const rotuloEscopo = escopoFinal === 'SERVIDOR' ? 'Servidor / competência' : (escopoFinal === 'REGISTRO' ? 'Batida específica' : 'Dia');
  document.getElementById('rep-apontamento-id').value = existente ? existente.id : '';
  document.getElementById('rep-apontamento-pis').value = pisFinal;
  document.getElementById('rep-apontamento-data').value = dataFinal;
  document.getElementById('rep-apontamento-escopo').value = escopoFinal;
  document.getElementById('rep-apontamento-evento').value = existente ? (existente.eventoChave || '') : String(eventoChave || '');
  document.getElementById('rep-apontamento-texto').value = existente ? existente.texto : '';
  document.getElementById('rep-apontamento-titulo').textContent = existente ? 'Editar apontamento' : 'Novo apontamento';
  document.getElementById('rep-apontamento-contexto').innerHTML = `<b>${escapeHtml(rotuloEscopo)}</b><span>${escapeHtml(servidor?.nome || pisFinal)} · ${escopoFinal === 'SERVIDOR' ? dataFinal.slice(0, 7).split('-').reverse().join('/') : dataFinal.split('-').reverse().join('/')}</span>`;
  apontamentoRepAtual = existente;
  abrirModal('modal-apontamento-rep');
  setTimeout(() => document.getElementById('rep-apontamento-texto')?.focus(), 80);
}

async function recarregarApontamentosRep_() {
  apontamentosRep = await chamarBackendPromessa_('listarApontamentosRep', []);
  renderizarListaRep();
}

function atualizarApontamentosRepSegundoPlano_() {
  if (repTemAlteracoesPendentes_() || gravacoesBackendEmAndamento_ > 0) {
    setTimeout(atualizarApontamentosRepSegundoPlano_, 500);
    return;
  }
  const revisaoAoIniciar = revisaoMutacoesCliente_;
  chamarBackendPromessa_('obterAtualizacoesCompartilhadasRep', []).then(function(resultados) {
    if (revisaoAoIniciar !== revisaoMutacoesCliente_ || repTemAlteracoesPendentes_() || gravacoesBackendEmAndamento_ > 0) {
      setTimeout(atualizarApontamentosRepSegundoPlano_, 500);
      return;
    }
    apontamentosRep = Array.isArray(resultados.apontamentos) ? resultados.apontamentos : [];
    justificativasLancamentoRep = Array.isArray(resultados.justificativas) ? resultados.justificativas : [];
    compensacoesRep = Array.isArray(resultados.compensacoes) ? resultados.compensacoes : [];
    validacoesRep = Array.isArray(resultados.validacoes) ? resultados.validacoes : [];
    descartesHoraExtraRep = Array.isArray(resultados.descartesHoraExtra) ? resultados.descartesHoraExtra : [];
    feriadosCompartilhadosRep = Array.isArray(resultados.feriados) ? resultados.feriados : [];
    ajustesCompartilhadosRep = Array.isArray(resultados.ajustes) ? resultados.ajustes : [];
    conferenciasRep = Array.isArray(resultados.conferencias) ? resultados.conferencias : [];
    atualizarCampoFeriadosCompartilhadosRep_();
    aplicarAjustesCompartilhadosRep_();
    if (currentView === 'pre-leitura-rep' && dadosRepCache.punches.length) atualizarProcessamentoRep({ notificarEntidade: false });
    else if (currentView === 'pre-leitura-rep' && dadosRepProcessados.length) renderizarListaRep();
  }).catch(function(erro) { console.warn('Dados complementares do REP não puderam ser atualizados:', mensagemErro(erro)); });
}

async function salvarApontamentoRepInterface() {
  const texto = document.getElementById('rep-apontamento-texto').value.trim();
  if (!texto) return mostrarToast('Escreva o apontamento antes de salvar.', 'warning');
  const dados = {
    id: document.getElementById('rep-apontamento-id').value,
    pis: document.getElementById('rep-apontamento-pis').value,
    data: document.getElementById('rep-apontamento-data').value,
    escopo: document.getElementById('rep-apontamento-escopo').value,
    eventoChave: document.getElementById('rep-apontamento-evento').value,
    texto,
    status: apontamentoRepAtual?.status || 'ABERTO'
  };
  exibirLoader(true, 'Salvando apontamento...');
  try {
    await chamarBackendPromessa_('salvarApontamentoRep', [dados]);
    fecharModal('modal-apontamento-rep');
    apontamentoRepAtual = null;
    await recarregarApontamentosRep_();
    mostrarToast('Apontamento salvo.', 'success');
  } catch (erro) {
    mostrarToast('Não foi possível salvar: ' + mensagemErro(erro), 'error');
  } finally { exibirLoader(false); }
}

async function alternarConclusaoApontamentoRep(id, statusAtual) {
  exibirLoader(true, 'Atualizando apontamento...');
  try {
    await chamarBackendPromessa_('definirStatusApontamentoRep', [id, statusAtual === 'CONCLUIDO' ? 'ABERTO' : 'CONCLUIDO']);
    await recarregarApontamentosRep_();
  } catch (erro) { mostrarToast('Não foi possível atualizar: ' + mensagemErro(erro), 'error'); }
  finally { exibirLoader(false); }
}

async function excluirApontamentoRepInterface(id) {
  if (!confirm('Apagar este apontamento? Essa ação o remove da visualização para todos os usuários.')) return;
  exibirLoader(true, 'Apagando apontamento...');
  try {
    await chamarBackendPromessa_('excluirApontamentoRep', [id]);
    await recarregarApontamentosRep_();
    mostrarToast('Apontamento apagado.', 'success');
  } catch (erro) { mostrarToast('Não foi possível apagar: ' + mensagemErro(erro), 'error'); }
  finally { exibirLoader(false); }
}

function htmlApontamentosRep_(itens) {
  if (!itens || !itens.length) return '';
  return `<div class="rep-apontamentos-lista">${itens.map(item => {
    let referencia = item.escopo === 'SERVIDOR' ? 'Servidor' : (item.escopo === 'REGISTRO' ? 'Batida' : 'Dia');
    if (item.escopo === 'REGISTRO' && item.eventoChave) {
      const partes = String(item.eventoChave).split('|');
      const momento = new Date(Number(partes[partes.length - 1]));
      const horario = isNaN(momento.getTime()) ? '' : `${String(momento.getHours()).padStart(2, '0')}:${String(momento.getMinutes()).padStart(2, '0')}`;
      referencia += `${horario ? ' ' + horario : ''}${partes[1] ? ' · NSR ' + partes[1] : ''}`;
    }
    return `<article class="rep-apontamento ${item.status === 'CONCLUIDO' ? 'concluido' : ''}">
    <div><span>${escapeHtml(referencia)} · ${item.status === 'CONCLUIDO' ? 'Concluído' : 'Aberto'}</span><p>${escapeHtml(item.texto)}</p><small>Atualizado por ${escapeHtml(item.atualizadoPor || item.criadoPor || '-')}</small></div>
    <nav><button type="button" onclick="abrirApontamentoRep('', '', '', '', '${item.id}')" title="Editar"><span data-lucide="pencil"></span></button><button type="button" onclick="alternarConclusaoApontamentoRep('${item.id}','${item.status}')" title="${item.status === 'CONCLUIDO' ? 'Reabrir' : 'Concluir'}"><span data-lucide="${item.status === 'CONCLUIDO' ? 'rotate-ccw' : 'check'}"></span></button><button type="button" onclick="excluirApontamentoRepInterface('${item.id}')" title="Apagar"><span data-lucide="trash-2"></span></button></nav>
  </article>`;
  }).join('')}</div>`;
}

function definirFiltroDiasRep(tipo) {
  const permitidos = ['todos', 'he', 'vr', 'saldo', 'alertas', 'apontamentos'];
  filtroDiasRepAtual = permitidos.includes(tipo) ? tipo : 'todos';
  renderizarListaRep();
}

function diaAtendeFiltroRep_(dia, filtro, apontamentos) {
  if (filtro === 'he') return Boolean(dia.temHoraExtra);
  if (filtro === 'vr') return Boolean(dia.temValeRefeicao);
  if (filtro === 'saldo') return obterDeficitDiaRep_(dia) > 0;
  if (filtro === 'alertas') return Boolean(dia.pendencia || dia.jornadaIncompleta);
  if (filtro === 'apontamentos') return (apontamentos || []).some(item => item.escopo !== 'SERVIDOR' && item.data === dia.dataOriginal);
  return true;
}

function obterCompetenciaAtualRep_() {
  const ano = document.getElementById('rep-filter-ano')?.value || '';
  const mes = document.getElementById('rep-filter-mes')?.value || '';
  return /^\d{4}$/.test(ano) && /^\d{2}$/.test(mes) ? `${ano}-${mes}` : '';
}

function obterConferenciaServidorRep_(pis) {
  const competencia = obterCompetenciaAtualRep_();
  if (!competencia) return null;
  return (conferenciasRep || []).find(item => item.conferido && normalizarPisRep(item.pis) === normalizarPisRep(pis) && item.competencia === competencia) || null;
}

function primeiroNomeRep_(valor) {
  const texto = String(valor || '').trim();
  if (!texto) return 'usuário';
  const base = texto.includes('@') ? texto.split('@')[0].replace(/[._-]+/g, ' ') : texto;
  const primeiro = base.trim().split(/\s+/)[0] || 'usuário';
  return primeiro.charAt(0).toUpperCase() + primeiro.slice(1).toLowerCase();
}

async function alternarConferenciaServidorRep(pis, botao) {
  const competencia = obterCompetenciaAtualRep_();
  if (!competencia) return mostrarToast('Selecione um ano e um mês específicos para marcar a conferência.', 'warning');
  const atual = obterConferenciaServidorRep_(pis);
  if (!iniciarOperacaoInterface('conferencia-rep-' + normalizarPisRep(pis), botao, atual ? 'Reabrindo...' : 'Conferindo...')) return;
  try {
    await new Promise(function(resolve) { requestAnimationFrame(resolve); });
    exibirLoader(true, atual ? 'Reabrindo conferência...' : 'Marcando como conferido...');
    const resultado = await chamarBackendPromessa_('salvarConferenciaRep', [{ pis, competencia, conferido: !atual }]);
    conferenciasRep = (conferenciasRep || []).filter(item => !(normalizarPisRep(item.pis) === normalizarPisRep(pis) && item.competencia === competencia));
    if (!atual) conferenciasRep.push({ pis, competencia, conferido: true, conferidoPor: resultado?.conferidoPor || AppState.usuarioLogado?.nome || AppState.usuarioLogado?.email || '' });
    renderizarListaRep();
    mostrarToast(atual ? 'Servidor marcado novamente como pendente de conferência.' : `Conferência registrada por ${primeiroNomeRep_(resultado?.conferidoPor || AppState.usuarioLogado?.nome || AppState.usuarioLogado?.email)}.`, 'success');
  } catch (erro) {
    mostrarToast('Não foi possível atualizar a conferência: ' + mensagemErro(erro), 'error');
  } finally {
    exibirLoader(false);
    finalizarOperacaoInterface('conferencia-rep-' + normalizarPisRep(pis), botao);
  }
}

function salvarSaldoDiretoRep_(pis, data, campo) {
  if (!campo || campo.dataset.salvando === 'true') return;
  const minutos = saldoParaMinutosRep_(campo.value);
  const minutosAnteriores = Number(campo.dataset.minutosOriginais || 0);
  if (minutos === null || minutos < -1440 || minutos > 1440) {
    campo.value = campo.dataset.valorOriginal || '00:00';
    return mostrarToast('Use o formato HH:MM ou -HH:MM, entre -24:00 e 24:00.', 'warning');
  }
  campo.value = formatHoursRep(minutos / 60);
  if (minutos === minutosAnteriores) return;
  campo.dataset.salvando = 'true';
  enfileirarAlteracaoRep_('DESCARTE_HE', { pis, data, descartado: false, saldoAjustado: true, saldoMinutos: minutos }, `DESCARTE_HE|${normalizarPisRep(pis)}|${data}`);
  descartesHoraExtraRep = (descartesHoraExtraRep || []).filter(item => !(normalizarPisRep(item.pis) === normalizarPisRep(pis) && item.data === data));
  descartesHoraExtraRep.push({
    pis, data, descartado: false, saldoAjustado: true, saldoMinutos: minutos,
    atualizadoPor: AppState.usuarioLogado?.nome || AppState.usuarioLogado?.email || ''
  });
  atualizarProcessamentoRep({ notificarEntidade: false });
  mostrarToast(`Saldo de ${data.split('-').reverse().join('/')} ajustado para ${formatHoursRep(minutos / 60)}h.`, 'success');
}

function restaurarSaldoDiretoRep_(pis, data) {
  enfileirarAlteracaoRep_('DESCARTE_HE', { pis, data, descartado: false, saldoAjustado: false }, `DESCARTE_HE|${normalizarPisRep(pis)}|${data}`);
  descartesHoraExtraRep = (descartesHoraExtraRep || []).filter(item => !(normalizarPisRep(item.pis) === normalizarPisRep(pis) && item.data === data));
  atualizarProcessamentoRep({ notificarEntidade: false });
  mostrarToast('Saldo calculado pelo ponto restaurado.', 'success');
}

function alternarValidacaoRapidaRep_(pis, data) {
  const existente = (validacoesRep || []).find(item => item.validado && normalizarPisRep(item.pis) === normalizarPisRep(pis) && item.data === data);
  const validar = !existente;
  enfileirarAlteracaoRep_('VALIDACAO', { pis, data, validado: validar, observacao: '' }, `VALIDACAO|${normalizarPisRep(pis)}|${data}`);
  validacoesRep = (validacoesRep || []).filter(item => !(normalizarPisRep(item.pis) === normalizarPisRep(pis) && item.data === data));
  if (validar) validacoesRep.push({
    pis, data, validado: true, observacao: '',
    atualizadoPor: AppState.usuarioLogado?.nome || AppState.usuarioLogado?.email || ''
  });
  atualizarProcessamentoRep({ notificarEntidade: false });
  mostrarToast(validar ? 'Alerta validado.' : 'Alerta reaberto.', 'success');
}

function obterCadastroServidorRep_(pis) {
  return obterServidorPorIdentificadorRep_(pis);
}

/** Índices somente de visualização; não alteram cálculos nem dados persistidos. */
function criarContextoVisualRep_(servidores) {
  const cadastroPorPis = new Map();
  (AppState.servidores || []).forEach(function(servidor) {
    const pis = normalizarPisRep(servidor.pis);
    if (pis && !cadastroPorPis.has(pis)) cadastroPorPis.set(pis, servidor);
    const identificadorManual = obterIdentificadorCartaoManualRep_(servidor);
    if (identificadorManual && !cadastroPorPis.has(identificadorManual)) cadastroPorPis.set(identificadorManual, servidor);
  });
  const conferenciaPorPis = new Map();
  const competencia = obterCompetenciaAtualRep_();
  if (competencia) (conferenciasRep || []).forEach(function(item) {
    if (!item.conferido || item.competencia !== competencia) return;
    const pis = normalizarPisRep(item.pis);
    if (pis && !conferenciaPorPis.has(pis)) conferenciaPorPis.set(pis, item);
  });
  const apontamentosAgrupados = new Map();
  (apontamentosRep || []).forEach(function(item) {
    const pis = normalizarPisRep(item.pis);
    if (!pis) return;
    if (!apontamentosAgrupados.has(pis)) apontamentosAgrupados.set(pis, []);
    apontamentosAgrupados.get(pis).push(item);
  });
  const apontamentosPorPis = new Map();
  (servidores || []).forEach(function(emp) {
    const pis = normalizarPisRep(emp.pis);
    const registros = apontamentosAgrupados.get(pis) || [];
    if (competencia) {
      apontamentosPorPis.set(pis, registros.filter(function(item) { return String(item.data || '').slice(0, 7) === competencia; }));
      return;
    }
    const datas = new Set((emp.dias || []).map(function(dia) { return dia.dataOriginal; }));
    apontamentosPorPis.set(pis, registros.filter(function(item) {
      return item.escopo === 'SERVIDOR' || datas.has(String(item.data || ''));
    }));
  });
  return { cadastroPorPis, conferenciaPorPis, apontamentosPorPis };
}

function obterVinculoVisualRep_(servidor, compacto) {
  const situacaoOriginal = String(servidor && servidor.situacao || '').trim();
  const situacao = situacaoOriginal.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
  let classe = 'nao-informado';
  let rotulo = compacto ? 'N/I' : 'Vínculo não informado';
  let icone = 'circle-help';
  if (situacao === 'COMISSIONADO') {
    classe = 'comissionado'; rotulo = compacto ? 'COM' : 'Comissionado'; icone = 'briefcase-business';
  } else if (situacao === 'ESTATUTARIO') {
    classe = 'estatutario'; rotulo = compacto ? 'EST' : 'Estatutário'; icone = 'shield-check';
  } else if (situacao === 'ESTAGIARIO') {
    classe = 'estagiario'; rotulo = compacto ? 'ESTÁG.' : 'Estagiário'; icone = 'graduation-cap';
  } else if (situacao === 'PEAD') {
    classe = 'pead'; rotulo = 'PEAD'; icone = 'badge';
  } else if (situacaoOriginal) {
    classe = 'outro'; rotulo = compacto ? situacaoOriginal.slice(0, 7).toUpperCase() : situacaoOriginal; icone = 'contact-round';
  }
  return `<span class="rep-vinculo-funcional ${classe}" title="Situação funcional: ${escapeHtml(situacaoOriginal || 'não informada')}"><span data-lucide="${icone}"></span>${escapeHtml(rotulo)}</span>`;
}

function renderizarPainelRep(servidores, container, contextoVisual) {
  contextoVisual = contextoVisual || criarContextoVisualRep_(servidores);
  const listaAnterior = container.querySelector('.rep-pessoas');
  if (listaAnterior) rolagemPessoasRep = listaAnterior.scrollTop;
  if (!servidores.some(emp => emp.pis === pisSelecionadoRep)) {
    pisSelecionadoRep = servidores[0].pis;
    filtroDiasRepAtual = 'todos';
  }
  const selecionado = servidores.find(emp => emp.pis === pisSelecionadoRep);
  const cadastroSelecionado = contextoVisual.cadastroPorPis.get(normalizarPisRep(selecionado.pis)) || null;
  const controleVinculo = cadastroSelecionado
    ? `<span class="rep-vinculo-confirmado">Cadastro associado</span><button type="button" class="rep-unir-registros" onclick="abrirFusaoRep('${selecionado.pis}')">Gerenciar vínculo / unir outro</button>`
    : `<button type="button" class="rep-unir-registros" onclick="abrirFusaoRep('${selecionado.pis}')">Vincular ao cadastro / unir</button>`;
  const resumo = servidores.map(emp => {
    const pisNormalizado = normalizarPisRep(emp.pis);
    const cadastroEmp = contextoVisual.cadastroPorPis.get(pisNormalizado) || null;
    const abertos = (contextoVisual.apontamentosPorPis.get(pisNormalizado) || []).filter(item => item.status !== 'CONCLUIDO').length;
    const conferencia = contextoVisual.conferenciaPorPis.get(pisNormalizado) || null;
    const rotuloConferencia = conferencia ? `Conferido por ${primeiroNomeRep_(conferencia.conferidoPor)}` : 'Marcar como conferido';
    return `<div class="rep-pessoa-item ${emp.pis === pisSelecionadoRep ? 'active' : ''} ${conferencia ? 'conferido' : ''}" onclick="selecionarServidorRep('${emp.pis}')" onkeydown="if(event.key === 'Enter' || event.key === ' '){ event.preventDefault(); selecionarServidorRep('${emp.pis}'); }" role="button" tabindex="0">
      <span class="rep-pessoa-identidade"><strong>${escapeHtml(emp.nome)}</strong><small>${emp.pis} · ${escapeHtml(emp.lotacao || 'Não informada')}</small></span>
      <span class="rep-pessoa-metricas"><small>${obterVinculoVisualRep_(cadastroEmp, true)}<b class="rep-mini-indicador he">HE ${formatHoursRep(emp.resumo.horasExtras)}h</b><i class="rep-mini-indicador vr">${emp.resumo.valeRefeicao} VR</i><i class="rep-mini-indicador apontamento ${abertos ? 'tem-apontamento' : ''}" title="Apontamentos abertos">${abertos} AP</i><i class="rep-mini-indicador alerta ${emp.resumo.pendencias ? 'tem-alerta' : ''}">${emp.resumo.pendencias} alertas</i></small><button type="button" class="rep-conferencia-servidor ${conferencia ? 'conferido' : ''}" onclick="event.stopPropagation(); alternarConferenciaServidorRep('${emp.pis}', this)" title="${conferencia ? 'Desmarcar conferência' : 'Marcar como conferido'}"><span data-lucide="${conferencia ? 'circle-check-big' : 'circle'}"></span>${escapeHtml(rotuloConferencia)}</button></span>
    </div>`;
  }).join('');

  const conferenciaSelecionado = obterConferenciaServidorRep_(selecionado.pis);
  const apontamentosSelecionado = contextoVisual.apontamentosPorPis.get(normalizarPisRep(selecionado.pis)) || [];
  const apontamentosAbertos = apontamentosSelecionado.filter(item => item.status !== 'CONCLUIDO');
  const apontamentosConcluidos = apontamentosSelecionado.length - apontamentosAbertos.length;
  const apontamentosServidor = apontamentosSelecionado.filter(item => item.escopo === 'SERVIDOR');
  const rotulosFiltro = { he: 'dias com horas extras', vr: 'dias com vale-refeição extra', saldo: 'dias com horas devidas', alertas: 'dias que precisam de conferência', apontamentos: 'dias com apontamentos' };
  const diasFiltrados = selecionado.dias.filter(dia => diaAtendeFiltroRep_(dia, filtroDiasRepAtual, apontamentosSelecionado));
  const dias = diasFiltrados.map(dia => {
    const apontamentosDia = apontamentosSelecionado.filter(item => item.escopo !== 'SERVIDOR' && item.data === dia.dataOriginal);
    const infoAusencia = dia.ausencia ? `<div class="rep-ausencia-dia ${dia.ausenciaJustificada ? 'justificada' : 'conferir'}"><span>${dia.ausenciaJustificada ? 'Ausência registrada' : 'Atenção: ausência e batidas no mesmo dia'}</span><strong>${escapeHtml(dia.ausencia.tipo)}</strong><small>${escapeHtml(formatarPeriodoAusenciaRep_(dia.ausencia))} · 1Doc: ${escapeHtml(dia.ausencia.idoc || 'não informado')}${dia.ausencia.origem === 'manual' ? ' · associação manual' : ''}</small></div>` : '';
    const origensCompensacaoTexto = (dia.compensacao?.origensAplicadas || []).map(origem => {
      const bruto = Number(origem.minutos || 0);
      const liquido = Number(origem.minutosLiquidos != null ? origem.minutosLiquidos : bruto);
      return `${origem.data.split('-').reverse().join('/')} (${minutosParaHoraRep_(bruto)}h retiradas${bruto !== liquido ? ` → ${minutosParaHoraRep_(liquido)}h aplicadas` : ''})`;
    }).join(' + ');
    const infoCompensacao = dia.compensacao ? `<div class="rep-compensacao-dia ${dia.status === 'jornada_compensada' ? 'completa' : 'parcial'}"><span>${dia.status === 'jornada_compensada' ? 'Jornada compensada' : 'Compensação parcial'}</span><strong>${minutosParaHoraRep_(dia.compensacao.minutosAplicados)}h aplicadas de ${minutosParaHoraRep_(dia.compensacao.deficit)}h devidas</strong><small>Origem: ${escapeHtml(origensCompensacaoTexto || 'registro antigo sem detalhamento')}${dia.compensacao.observacao ? ` · ${escapeHtml(dia.compensacao.observacao)}` : ''}</small></div>` : '';
    const infoOrigemCompensacao = dia.minutosCompensadosComoOrigem ? `<div class="rep-compensacao-origem"><span>${configuracaoCalculoRepAtual.compensacaoMinutosExatos ? 'Minutos reais usados em compensação' : 'HE usada em compensação'}</span><strong>${minutosParaHoraRep_(dia.minutosCompensadosComoOrigem)}h retiradas deste dia</strong><small>Saldo administrativo de HE antes: ${formatHoursRep(dia.horaExtraAntesCompensacao)}h${configuracaoCalculoRepAtual.compensacaoMinutosExatos ? ` · impacto na HE: ${minutosParaHoraRep_(dia.minutosAdministrativosCompensadosComoOrigem || 0)}h` : ''}</small></div>` : '';
    const infoValidacao = dia.validacaoManual ? `<div class="rep-validacao-dia"><span>Alerta validado manualmente</span><strong>${escapeHtml(textoSituacaoRep(dia.statusAntesValidacao || ''))}</strong><small>${dia.validacaoManual.observacao ? escapeHtml(dia.validacaoManual.observacao) + ' · ' : ''}Use “Ajustar” para reabrir</small></div>` : '';
    const infoDescarteHe = dia.horaExtraDesconsiderada ? `<div class="rep-descarte-he-dia"><span>Hora extra desconsiderada neste dia</span><strong>${formatHoursRep(dia.horaExtraDesconsiderada.horas)}h não contabilizadas</strong><small>${dia.horaExtraDesconsiderada.atualizadoPor ? `Por ${escapeHtml(primeiroNomeRep_(dia.horaExtraDesconsiderada.atualizadoPor))}` : 'Decisão manual da conferência'}</small></div>` : '';
    const eventos = dia.semRegistro ? `<span class="rep-sem-registro">${escapeHtml(textoSituacaoRep(dia.status))}</span>` : (dia.batidasDetalhadas || []).map(evento => `<div class="rep-evento rep-comprovante-afd" draggable="true" data-event-id="${escapeHtml(evento.eventId || '')}" title="Local: ${escapeHtml(evento.local || 'não informado')} · Arraste esta marcação para o dia correto" ondragstart="iniciarArrasteMarcacaoRep_(event,this.dataset.eventId,'${dia.dataOriginal}')" ondragend="finalizarArrasteMarcacaoRep_(event)">
      <div class="rep-evento-horario"><div class="rep-comprovante-hora"><small>REGISTRADO</small><input class="rep-horario-real" type="time" value="${evento.horarioOriginal}" data-original="${evento.horarioOriginal}" aria-label="Horário real" title="Horário real preservado na auditoria" ondragstart="event.stopPropagation()" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}else if(event.key==='Escape'){this.value=this.dataset.original;this.blur()}" onblur="editarMarcacaoRapidaRep_('${selecionado.pis}','${dia.dataOriginal}','${escapeHtml(evento.eventId || '')}',this)"></div>${evento.horarioOriginal !== evento.horarioArredondado ? `<span class="rep-horario-arredondado" title="Horário considerado após arredondamento"><small>CONSIDERADO</small><strong>${evento.horarioArredondado}</strong></span>` : '<span class="rep-horario-sem-arredondamento">SEM AJUSTE</span>'}<button type="button" class="rep-desconsiderar-rapido" onclick="event.stopPropagation();desconsiderarMarcacaoRapidaRep_('${selecionado.pis}','${dia.dataOriginal}','${escapeHtml(evento.eventId || '')}')" title="Desconsiderar esta marcação sem abrir a janela"><span data-lucide="trash-2"></span></button></div>
      ${evento.dataReal && evento.dataReal !== dia.dataOriginal ? `<small class="rep-evento-virada">Batida real em ${escapeHtml(evento.dataReal.split('-').reverse().join('/'))} · vinculada a esta jornada</small>` : ''}
      <small class="rep-comprovante-local" title="${escapeHtml(evento.local || 'Local não informado')}">LOCAL · ${escapeHtml(evento.local || 'NÃO INFORMADO')}</small>
      <small class="rep-comprovante-auditoria">${evento.manual ? (evento.rep === 'CARTÃO MANUAL' ? 'CARTÃO MANUAL' : 'AJUSTE MANUAL') : `REP ${escapeHtml(evento.rep || '-')} · NSR ${escapeHtml(evento.nsr || '-')}`}</small>
    </div>`).join('');
    const sinalizadoresSaldo = `${dia.temHoraExtra ? '<span class="rep-sinalizador he">HE</span>' : ''}${dia.temValeRefeicao ? '<span class="rep-sinalizador vr">VR</span>' : ''}`;
    const sinalizadorCompensacao = dia.compensacao?.minutosAplicados ? '<span class="rep-sinalizador comp">COMP</span>' : '';
    const acaoValidacao = dia.validacaoManual
      ? `<button type="button" class="rep-ajustar-dia validar ativo" onclick="alternarValidacaoRapidaRep_('${selecionado.pis}','${dia.dataOriginal}')">Reabrir alerta</button>`
      : (dia.pendencia || dia.jornadaIncompleta || dia.status === 'falta_sem_registro' ? `<button type="button" class="rep-ajustar-dia validar" onclick="alternarValidacaoRapidaRep_('${selecionado.pis}','${dia.dataOriginal}')">Validar alerta</button>` : '');
    const saldoEditavel = Number.isFinite(dia.extraDia) && !dia.pendencia && !dia.ausencia;
    const saldoValor = Number.isFinite(dia.extraDia) ? formatHoursRep(dia.extraDia) : '';
    const restaurarSaldo = dia.ajusteSaldoManual ? `<button type="button" class="rep-restaurar-saldo" onclick="restaurarSaldoDiretoRep_('${selecionado.pis}','${dia.dataOriginal}')" title="Voltar ao saldo calculado pelas batidas">Original</button>` : '';
    const campoSaldo = saldoEditavel
      ? `<div class="rep-saldo-celula"><input type="text" class="rep-saldo-editor" value="${saldoValor}" data-valor-original="${saldoValor}" data-minutos-originais="${Math.round(dia.extraDia * 60)}" maxlength="6" inputmode="text" aria-label="Editar saldo de ${dia.dataFormatada}" title="Edite e pressione Enter ou saia do campo" onfocus="this.select()" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}else if(event.key==='Escape'){this.value=this.dataset.valorOriginal;this.blur()}" onblur="salvarSaldoDiretoRep_('${selecionado.pis}','${dia.dataOriginal}',this)"><span class="rep-sinalizadores rep-sinalizadores-saldo">${sinalizadoresSaldo}</span>${restaurarSaldo}</div>`
      : `<div class="rep-saldo-celula"><span>${!Number.isFinite(dia.extraDia) ? '—' : (dia.pendencia ? 'Conferir' : saldoValor + 'h')}</span><span class="rep-sinalizadores rep-sinalizadores-saldo">${sinalizadoresSaldo}</span></div>`;
    const classesDia = [dia.semRegistro ? 'rep-dia-sem-registro' : '', dia.diaExtra ? 'rep-dia-nao-util' : ''].filter(Boolean).join(' ');
    return `<tr class="${classesDia}" data-rep-data="${dia.dataOriginal}" ondragover="permitirSoltarMarcacaoRep_(event)" ondragleave="sairDestinoMarcacaoRep_(event)" ondrop="soltarMarcacaoRep_(event,'${dia.dataOriginal}')">
      <td><strong>${dia.dataFormatada}</strong><small class="rep-dia-semana">${dia.diaSemana}</small><div class="rep-acoes-dia"><button type="button" class="rep-ajustar-dia" onclick="abrirAjusteDiaRep('${selecionado.pis}','${dia.dataOriginal}')">Ajustar</button><button type="button" class="rep-ajustar-dia adicionar-marcacao" onclick="abrirInsercaoMarcacaoDiaRep_('${selecionado.pis}','${dia.dataOriginal}')">+ Batidas</button><button type="button" class="rep-ajustar-dia lancamento" onclick="abrirLancamentoDiretoRep_('', '${dia.dataOriginal}', '${selecionado.pis}')">+ Lançamento</button>${acaoValidacao}</div></td>
      <td><div class="rep-linha-tempo">${eventos}</div><div id="rep-insercao-${dia.dataOriginal.replace(/[^\d]/g,'')}" hidden></div>${infoAusencia}${infoCompensacao}${infoOrigemCompensacao}${infoValidacao}${infoDescarteHe}${htmlApontamentosRep_(apontamentosDia)}</td>
      <td>${dia.semRegistro || !Number.isFinite(dia.totalDia) ? '—' : (dia.pendencia ? 'Conferir' : formatHoursRep(dia.totalDia) + 'h')}</td>
      <td class="${dia.extraDia > 0 ? 'rep-valor-positivo' : (dia.extraDia < 0 ? 'rep-valor-negativo' : '')}">${campoSaldo}</td>
      <td><span class="rep-status ${dia.status}"><b>${categoriaSituacaoRep(dia.status)}</b><span>${textoSituacaoRep(dia.status)}</span></span><span class="rep-sinalizadores">${sinalizadorCompensacao}</span></td>
    </tr>`;
  }).join('') || `<tr><td colspan="5" class="rep-filtro-vazio">Nenhum dia encontrado neste filtro.</td></tr>`;

  const avisoFiltro = filtroDiasRepAtual === 'todos' ? '' : `<div class="rep-filtro-dias-ativo"><span>Exibindo ${rotulosFiltro[filtroDiasRepAtual]}: <b>${diasFiltrados.length}</b></span><button type="button" onclick="definirFiltroDiasRep('todos')">Mostrar todos os dias</button></div>`;
  const painelApontamentosServidor = apontamentosServidor.length ? `<section class="rep-apontamentos-servidor"><header><b>Apontamentos do servidor nesta competência</b><button type="button" onclick="abrirApontamentoRep('${selecionado.pis}','','SERVIDOR','','')">Novo apontamento</button></header>${htmlApontamentosRep_(apontamentosServidor)}</section>` : '';

  container.innerHTML = `<div class="rep-painel-pessoas">
    <aside class="rep-pessoas"><div class="rep-pessoas-titulo">Servidores encontrados <span>${servidores.length}</span></div>${resumo}</aside>
    <section class="rep-detalhe">
      <header class="rep-detalhe-cabecalho"><div><span class="page-eyebrow">CONFERÊNCIA INDIVIDUAL</span><div class="rep-identidade-titulo"><h3>${escapeHtml(selecionado.nome)}</h3>${obterVinculoVisualRep_(cadastroSelecionado, false)}</div><strong class="rep-identidade-cargo">${escapeHtml(cadastroSelecionado?.cargo || 'Cargo não informado')}</strong><small>Identificador: ${selecionado.pis} · Lotação: ${escapeHtml(selecionado.lotacao || 'Não informada')}</small><div class="rep-controle-vinculo">${controleVinculo}<button type="button" class="rep-conferencia-cabecalho ${conferenciaSelecionado ? 'conferido' : ''}" onclick="alternarConferenciaServidorRep('${selecionado.pis}', this)" title="${conferenciaSelecionado ? 'Desmarcar conferência' : 'Marcar como conferido'}"><span data-lucide="${conferenciaSelecionado ? 'circle-check-big' : 'circle-check'}"></span>${conferenciaSelecionado ? 'Conferido' : 'Conferir'}</button><button type="button" class="rep-unir-registros" onclick="abrirApontamentoRep('${selecionado.pis}','','SERVIDOR','','')">Apontar no servidor</button></div></div>
        <div class="rep-grupo-resumo">
          <button type="button" class="rep-indicador-resumo destaque ${filtroDiasRepAtual === 'he' ? 'ativo' : ''}" onclick="definirFiltroDiasRep('he')" aria-pressed="${filtroDiasRepAtual === 'he'}"><small>Horas extras válidas</small><b>${formatHoursRep(selecionado.resumo.horasExtras || 0)}h</b><em>Saldo para compensação: ${formatHoursRep(selecionado.resumo.saldoDisponivelCompensacao || 0)}h · ${formatHoursRep(selecionado.resumo.horasRetiradasCompensacao || 0)}h já usadas</em></button>
          <button type="button" class="rep-indicador-resumo vr ${filtroDiasRepAtual === 'vr' ? 'ativo' : ''}" onclick="definirFiltroDiasRep('vr')" aria-pressed="${filtroDiasRepAtual === 'vr'}"><small>Vales-refeição extras</small><b>${selecionado.resumo.valeRefeicao}</b><em>Jornada considerada ≥ 6h em dia não útil</em></button>
          <button type="button" class="rep-indicador-resumo devidas ${filtroDiasRepAtual === 'saldo' ? 'ativo' : ''}" onclick="definirFiltroDiasRep('saldo')" aria-pressed="${filtroDiasRepAtual === 'saldo'}" title="Soma do que ainda falta cumprir em dias úteis, após justificativas e compensações."><small>Horas devidas</small><b>${selecionado.resumo.horasDevidas > 0 ? '-' : ''}${formatHoursRep(selecionado.resumo.horasDevidas || 0)}h</b><em>Inclui falta de 8h em dia útil</em></button>
          <button type="button" class="rep-indicador-resumo alerta ${selecionado.resumo.pendencias ? 'tem-alerta' : ''} ${filtroDiasRepAtual === 'alertas' ? 'ativo' : ''}" onclick="definirFiltroDiasRep('alertas')" aria-pressed="${filtroDiasRepAtual === 'alertas'}"><small>Dias a conferir</small><b>${selecionado.resumo.pendencias}</b><em>Batidas inconsistentes</em></button>
          <button type="button" class="rep-indicador-resumo apontamentos ${apontamentosAbertos.length ? 'tem-apontamento' : ''} ${filtroDiasRepAtual === 'apontamentos' ? 'ativo' : ''}" onclick="definirFiltroDiasRep('apontamentos')" aria-pressed="${filtroDiasRepAtual === 'apontamentos'}"><small>Apontamentos abertos</small><b>${apontamentosAbertos.length}</b><em>${apontamentosConcluidos} concluído(s)</em></button>
        </div>
      </header>
      ${painelApontamentosServidor}
      ${avisoFiltro}
      <div class="rep-table-wrap rep-tabela-detalhe-wrap"><table class="custom-table rep-tabela-detalhe"><thead><tr><th>Data</th><th>Marcações (registrada → considerada)</th><th title="Total considerado após entradas, saídas e intervalo">Horas trabalhadas</th><th title="Diferença entre as horas trabalhadas e a jornada.">Horas extras</th><th>Situação</th></tr></thead><tbody>${dias}</tbody></table></div>
    </section>
  </div>`;
  const listaAtual = container.querySelector('.rep-pessoas');
  if (listaAtual) {
    listaAtual.scrollTop = rolagemPessoasRep;
    requestAnimationFrame(function() { listaAtual.scrollTop = rolagemPessoasRep; });
  }
  renderizarIcones();
}

function mudarPaginaRep(delta) {
  paginaRepAtual = Math.max(1, paginaRepAtual + delta);
  renderizarListaRep();
}

function renderizarTabelaPaginadaRep(servidores, container) {
  const registros = [];
  servidores.forEach(emp => emp.dias.forEach(dia => registros.push({ emp, dia })));
  const totalPaginas = Math.max(1, Math.ceil(registros.length / ITENS_POR_PAGINA_REP));
  paginaRepAtual = Math.min(paginaRepAtual, totalPaginas);
  const inicio = (paginaRepAtual - 1) * ITENS_POR_PAGINA_REP;
  const pagina = registros.slice(inicio, inicio + ITENS_POR_PAGINA_REP);
  let linhas = '';
  let ultimoPis = null;
  pagina.forEach(({ emp, dia }) => {
    if (emp.pis !== ultimoPis) {
      ultimoPis = emp.pis;
      const saldoClasse = emp.resumo.extras > 0 ? 'rep-valor-positivo' : (emp.resumo.extras < 0 ? 'rep-valor-negativo' : '');
      linhas += `<tr class="rep-grupo-servidor"><td colspan="7"><div class="rep-grupo-cabecalho">
        <div><strong>${escapeHtml(emp.nome)}</strong><span class="rep-badge-pis">PIS: ${emp.pis}</span></div>
        <div class="rep-grupo-resumo"><span>Trabalhadas: <b>${formatHoursRep(emp.resumo.trabalhadas)}h</b></span><span>Saldo: <b class="${saldoClasse}">${formatHoursRep(emp.resumo.extras)}h</b></span><span>Pendências: <b>${emp.resumo.pendencias}</b></span></div>
      </div></td></tr>`;
    }
    const situacoes = {
      impar: 'Batida ímpar', intervalo_nao_identificado: 'Intervalo não identificado',
      intervalo_inferior_minimo: 'Intervalo < 1h: saldo ajustado', conflito_arredondamento: 'Conflito no arredondamento',
      nao_conciliado: 'PIS não conciliado', extra_dia_nao_util: 'Extra (sábado/domingo/feriado)',
      saldo_positivo: 'Saldo estimado positivo', ok: 'Conferido'
    };
    linhas += `<tr>
      <td>${dia.dataFormatada}</td>
      <td><strong>${dia.batidas.join(' · ')}</strong><small class="rep-original">Original: ${dia.batidasOriginais}</small></td>
      <td>${dia.pendencia ? 'Conferir' : formatHoursRep(dia.totalDia) + 'h'}</td>
      <td class="${dia.extraDia > 0 ? 'rep-valor-positivo' : (dia.extraDia < 0 ? 'rep-valor-negativo' : '')}">${dia.pendencia ? 'Conferir' : formatHoursRep(dia.extraDia) + 'h'}</td>
      <td>${escapeHtml(dia.relogios || '-')}</td>
      <td><span class="rep-status ${dia.status}">${situacoes[dia.status] || dia.status}</span></td>
      <td>${emp.naoConciliado ? 'Não' : 'Sim'}</td>
    </tr>`;
  });
  container.innerHTML = `<div class="rep-paginacao"><span>Exibindo ${registros.length ? inicio + 1 : 0}–${Math.min(inicio + ITENS_POR_PAGINA_REP, registros.length)} de ${registros.length.toLocaleString('pt-BR')} dias processados</span><div><button class="btn btn-secondary" onclick="mudarPaginaRep(-1)" ${paginaRepAtual === 1 ? 'disabled' : ''}>Anterior</button><span>Página ${paginaRepAtual} de ${totalPaginas}</span><button class="btn btn-secondary" onclick="mudarPaginaRep(1)" ${paginaRepAtual === totalPaginas ? 'disabled' : ''}>Próxima</button></div></div>
    <div class="rep-table-wrap"><table class="custom-table rep-tabela-leitura"><thead><tr><th>Data</th><th>Batidas</th><th>Horas</th><th>Saldo estimado</th><th>Local do relógio</th><th>Situação</th><th>PIS vinculado</th></tr></thead><tbody>${linhas}</tbody></table></div>`;
}

function renderizarListaRep() {
  const searchInput = document.getElementById('rep-search-input');
  const filterStatus = document.getElementById('rep-filter-status');
  const listContainer = document.getElementById('rep-servidores-list');
  if (!listContainer) return;

  const searchTerm = normalizarTextoBusca(searchInput?.value || '');
  const statusFilter = filterStatus?.value || 'all';
  const conferenciaFilter = document.getElementById('rep-filter-conferencia')?.value || 'all';
  const lotacaoFilter = document.getElementById('rep-filter-lotacao')?.value || 'all';

  // A renderização seguinte lê a posição atual antes de substituir o painel.

  const contextoVisual = criarContextoVisualRep_(dadosRepProcessados);
  const filtered = dadosRepProcessados.filter(emp => {
    const pisNormalizado = normalizarPisRep(emp.pis);
    const matchesSearch = correspondeBusca(searchTerm, emp.nome, emp.pis);
    let matchesStatus = true;
    if (statusFilter === 'pending') {
      matchesStatus = emp.resumo.pendencias > 0 || (contextoVisual.apontamentosPorPis.get(pisNormalizado) || []).some(item => item.status !== 'CONCLUIDO');
    } else if (statusFilter === 'unmatched') {
      matchesStatus = emp.naoConciliado;
    } else if (statusFilter === 'saldo') {
      matchesStatus = emp.resumo.horasExtras > 0;
    }
    const conferencia = contextoVisual.conferenciaPorPis.get(pisNormalizado) || null;
    const matchesConferencia = conferenciaFilter === 'all' || (conferenciaFilter === 'checked' ? Boolean(conferencia) : !conferencia);
    return matchesSearch && matchesStatus && matchesConferencia && (lotacaoFilter === 'all' || emp.lotacao === lotacaoFilter);
  });

  if (filtered.length === 0) {
    listContainer.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-secondary);">Nenhum servidor encontrado com os filtros atuais.</div>';
    return;
  }

  renderizarPainelRep(filtered, listContainer, contextoVisual);
  return;

  let linhas = '';
  filtered.forEach(emp => {
    const saldoClasse = emp.resumo.extras > 0 ? 'rep-valor-positivo' : (emp.resumo.extras < 0 ? 'rep-valor-negativo' : '');
    linhas += `
      <tr class="rep-grupo-servidor">
        <td colspan="7">
          <div class="rep-grupo-cabecalho">
            <div><strong>${escapeHtml(emp.nome)}</strong><span class="rep-badge-pis">PIS: ${emp.pis}</span></div>
            <div class="rep-grupo-resumo">
              <span>Trabalhadas: <b>${formatHoursRep(emp.resumo.trabalhadas)}h</b></span>
              <span>Saldo: <b class="${saldoClasse}">${formatHoursRep(emp.resumo.extras)}h</b></span>
              <span>Pendências: <b>${emp.resumo.pendencias}</b></span>
            </div>
          </div>
        </td>
      </tr>`;
    emp.dias.forEach(dia => {
      let situacao = 'Conferido';
      if (dia.status === 'impar') situacao = 'Batida ímpar';
      else if (dia.status === 'intervalo_nao_identificado') situacao = 'Intervalo não identificado';
      else if (dia.status === 'intervalo_inferior_minimo') situacao = 'Intervalo < 1h: saldo ajustado';
      else if (dia.status === 'conflito_arredondamento') situacao = 'Conflito no arredondamento';
      else if (dia.status === 'nao_conciliado') situacao = 'PIS não conciliado';
      else if (dia.status === 'extra_dia_nao_util') situacao = 'Extra (sábado/domingo/feriado)';
      else if (dia.status === 'saldo_positivo') situacao = 'Saldo estimado positivo';
      linhas += `<tr>
        <td>${dia.dataFormatada}</td>
        <td><strong>${dia.batidas.join(' · ')}</strong><small class="rep-original">Original: ${dia.batidasOriginais}</small></td>
        <td>${dia.pendencia ? 'Conferir' : formatHoursRep(dia.totalDia) + 'h'}</td>
        <td class="${dia.extraDia > 0 ? 'rep-valor-positivo' : (dia.extraDia < 0 ? 'rep-valor-negativo' : '')}">${dia.pendencia ? 'Conferir' : formatHoursRep(dia.extraDia) + 'h'}</td>
        <td>${escapeHtml(dia.relogios || '-')}</td>
        <td><span class="rep-status ${dia.status}">${situacao}</span></td>
        <td>${emp.naoConciliado ? 'Não' : 'Sim'}</td>
      </tr>`;
    });
  });
  listContainer.innerHTML = `<div class="rep-table-wrap"><table class="custom-table rep-tabela-leitura">
    <thead><tr><th>Data</th><th>Batidas</th><th>Horas</th><th>Saldo estimado</th><th>Local do relógio</th><th>Situação</th><th>PIS vinculado</th></tr></thead>
    <tbody>${linhas}</tbody>
  </table></div>`;
  return;

  filtered.forEach((emp, idx) => {
    const cardId = `rep-card-${idx}`;
    const bodyId = `rep-body-${idx}`;

    let extrasClass = '';
    if (emp.resumo.extras > 0) extrasClass = 'color: #10b981;';
    if (emp.resumo.extras < 0) extrasClass = 'color: #ef4444;';

async function confirmarSaidaAuditoriaRep_() {
  const arquivos = dadosRepCache.arquivos || [];
  const fisicaOk = arquivos.length > 0 && !(falhasIntegridadeRep || []).length && arquivos.every(item => item.integridadeConfirmada && item.sha256Drive === item.sha256Recebido && item.tamanhoDrive === item.tamanhoRecebido);
  if (!fisicaOk) {
    mostrarToast('Exportação bloqueada: existe AFD sem integridade criptográfica confirmada.', 'error');
    return false;
  }
  const problemasConteudo = arquivos.reduce((total, item) => total + Number(item.marcacoesInvalidas || 0) + Number(item.quebrasNsr || 0) + Number(item.linhasCurtas || 0) + Number(item.tiposDesconhecidos || 0), 0);
  if (problemasConteudo) return await abrirConfirm(`Os arquivos chegaram íntegros, mas a leitura encontrou ${problemasConteudo} inconsistência(s) de conteúdo/NSR.\n\nDeseja gerar o documento identificado como "exige verificação"?`);
  return true;
}

/**
 * Traduz somente inconsistências ainda ativas do dia. A função lê o resultado
 * já calculado pelo Leitor REP e não recalcula nem altera marcações ou saldos.
 */
function obterAlertasAtivosDiaRep_(dia, pis) {
  const validadoPersistido = (validacoesRep || []).some(function(item) {
    return item.validado && normalizarPisRep(item.pis) === normalizarPisRep(pis) && item.data === (dia && dia.dataOriginal);
  });
  if (!dia || validadoPersistido || dia.validacaoManual || dia.status === 'validado_manualmente') return [];
  const alertas = [];
  const batidasOriginais = String(dia.batidasOriginais || (dia.batidas || []).join(' · ') || 'nenhuma');
  const batidasConsideradas = (dia.batidas || []).join(' · ') || 'nenhuma';
  const adicionar = function(tipo, detalhe, gravidade) {
    alertas.push({ tipo: tipo, detalhe: detalhe, gravidade: gravidade || 'atencao' });
  };

  if (dia.isImpar || dia.status === 'impar') {
    adicionar('Batida ausente / quantidade ímpar', `Foram encontradas ${(dia.batidas || []).length} marcação(ões). Verificar a entrada ou a saída que não foi registrada. Batidas: ${batidasOriginais}.`, 'critico');
  }
  if (dia.batidasExcedentes || dia.status === 'batidas_excedentes') {
    adicionar('Batidas excedentes', `Foram encontradas ${(dia.batidas || []).length} marcações no dia. Conferir duplicidade ou jornada fracionada. Batidas: ${batidasOriginais}.`, 'critico');
  }
  if (dia.colisaoReps || dia.status === 'colisao_reps') {
    adicionar('Conflito entre relógios', `O mesmo horário aparece em REPs diferentes. Conferir a origem antes do fechamento. Batidas: ${batidasOriginais}.`, 'critico');
  }
  if (dia.conflitoArredondamento || dia.status === 'conflito_arredondamento') {
    adicionar('Conflito de arredondamento', `Horários distintos passaram a coincidir após o arredondamento. Registradas: ${batidasOriginais}. Consideradas: ${batidasConsideradas}.`, 'critico');
  }
  if (dia.ausencia && !dia.semRegistro && dia.status === 'ausencia_com_batidas') {
    adicionar('Marcações durante ausência', `${dia.ausencia.tipo || 'Ausência'} registrada para ${formatarPeriodoAusenciaRep_(dia.ausencia)}, mas há batidas no dia: ${batidasOriginais}.`, 'critico');
  }

  const deficitHoras = obterDeficitDiaRep_(dia);
  const deficitTexto = deficitHoras > 0 ? minutosParaHoraRep_(Math.round(deficitHoras * 60)) + 'h' : '';
  if (dia.semRegistro && deficitHoras > 0) {
    adicionar('Falta / dia útil sem registro', `Nenhuma marcação foi localizada para este dia útil. Permanecem ${deficitTexto} devidas após os ajustes e compensações registrados.`, 'critico');
  } else if (!dia.semRegistro && deficitHoras > 0) {
    adicionar('Jornada incompleta / horas devidas', `A jornada considerada ficou abaixo da prevista. Permanecem ${deficitTexto} devidas. Batidas consideradas: ${batidasConsideradas}.`, 'atencao');
  }

  // Mantém o relatório preparado para um alerta novo que passe a ser contado
  // pelo processamento, sem transformar estados meramente informativos em erro.
  if (dia.pendencia && !alertas.length) {
    adicionar(categoriaSituacaoRep(dia.status), textoSituacaoRep(dia.status), 'atencao');
  }
  return alertas;
}

function montarAlertasAtivosServidorRep_(emp) {
  if (!emp) return [];
  const itens = [];
  if (emp.naoConciliado) {
    itens.push({
      pis: emp.pis,
      nome: emp.nome,
      data: '',
      dataOrdem: '',
      diaSemana: '',
      tipo: 'Identificação não conciliada',
      detalhe: `O identificador ${emp.pis || 'não informado'} ainda não está associado de forma confiável ao cadastro do servidor.`,
      gravidade: 'critico'
    });
  }
  (emp.dias || []).forEach(function(dia) {
    obterAlertasAtivosDiaRep_(dia, emp.pis).forEach(function(alerta) {
      itens.push({
        pis: emp.pis,
        nome: emp.nome,
        data: dia.dataFormatada,
        dataOrdem: dia.dataOriginal,
        diaSemana: dia.diaSemana || '',
        tipo: alerta.tipo,
        detalhe: alerta.detalhe,
        gravidade: alerta.gravidade
      });
    });
  });
  return itens;
}

/**
 * O relatório mensal não herda o filtro visual de local/relógio da tela.
 * Assim, "geral" representa de fato toda a competência, enquanto a tela
 * continua livre para a conferência segmentada por local.
 */
function obterServidoresCompetenciaRelatorioAlertasRep_(competencia) {
  const partes = String(competencia || '').split('-');
  if (partes.length !== 2) return [];
  const ano = partes[0];
  const mes = partes[1];
  const batidasCompetencia = (dadosRepCache.punches || []).filter(function(punch) {
    if (!punch || punch.desconsiderada || !(punch.datetime instanceof Date) || isNaN(punch.datetime)) return false;
    const referencia = /^\d{4}-\d{2}-\d{2}$/.test(String(punch.dataReferencia || ''))
      ? String(punch.dataReferencia).slice(0, 7)
      : `${punch.datetime.getFullYear()}-${String(punch.datetime.getMonth() + 1).padStart(2, '0')}`;
    return referencia === `${ano}-${mes}`;
  });
  return processDataRep(dadosRepCache.employees, batidasCompetencia, dadosRepCache.lotacoes);
}

function descreverPoliticaCalculoRep_() {
  const cfg = configuracaoCalculoRepAtual;
  if (cfg.modo === 'LEGADO') return 'Modo legado: arredondamento individual das batidas para 00, 30 ou 60 minutos.';
  if (cfg.modo === 'EXATO') return 'Modo exato: todos os minutos registrados participam integralmente do saldo.';
  if (cfg.modo === 'SOMENTE_HE') return 'Arredondamento exclusivo da HE: os demais controles usam minutos reais; somente o crédito de hora extra usa as batidas arredondadas.';
  const contagem = cfg.contagemDeficit === 'EXCEDENTE' ? 'somente o excedente é devido' : 'todo o déficit é devido';
  return `Saldo diário: tolerância de ${cfg.toleranciaDeficitMin} min; quando ultrapassada, ${contagem}. HE: 0-${cfg.heMeiaMin - 1} min = 0; ${cfg.heMeiaMin}-${cfg.heHoraMin - 1} min = 30 min; ${cfg.heHoraMin}-59 min = 1h.`;
}

    'PIS/CPF original no AFD': p.pisOriginal || p.pis,
    'Data': toDateStringRep(p.datetime).split('-').reverse().join('/'),
    'Hora original': `${String(p.datetime.getHours()).padStart(2, '0')}:${String(p.datetime.getMinutes()).padStart(2, '0')}`,
    'Local vigente no AFD': p.clock,
    'Número do REP': p.deviceSerial,
    'NSR': p.nsr,
    'Arquivo': p.sourceFile,
    'Linha': p.lineNumber
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(brutas), "Marcações Brutas");

  const arquivos = (dadosRepCache.arquivos || []).map(item => ({
    'Arquivo': item.nome, 'Número do REP': item.numeroRep, 'Histórico de locais': item.locais.join(' → '),
    'Integridade SHA-256': item.integridadeConfirmada ? 'Confirmada' : 'Não confirmada',
    'SHA-256': item.sha256Drive || '', 'Tamanho no Drive': item.tamanhoDrive, 'Tamanho recebido': item.tamanhoRecebido,
    'Linhas classificadas': item.linhasClassificadas, 'Leitura completa': item.leituraCompleta ? 'Sim' : 'Não',
    'Identificadores com batidas': (item.identificadoresBatidas || []).length,
    'Marcações encontradas': item.marcacoesEncontradas, 'Marcações válidas': item.marcacoesValidas,
    'Marcações inválidas': item.marcacoesInvalidas, 'Quebras de NSR': item.quebrasNsr,
    'Início': item.inicio, 'Fim': item.fim
  }));
  (falhasIntegridadeRep || []).forEach(item => arquivos.push({ 'Arquivo': item.nome, 'Integridade SHA-256': 'BLOQUEADO', 'Leitura completa': 'Não', 'Problema': item.motivo }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(arquivos), "Auditoria dos Arquivos");
  const ajustes = (dadosRepCache.punches || []).filter(p => p.manual || p.desconsiderada).map(p => ({
    'PIS/CPF': p.pis,
    'Data': toDateStringRep(p.datetime).split('-').reverse().join('/'),
    'Hora': `${String(p.datetime.getHours()).padStart(2, '0')}:${String(p.datetime.getMinutes()).padStart(2, '0')}`,
    'Ação': p.manual ? 'Marcação incluída/corrigida' : 'Marcação original desconsiderada',
    'Local': p.clock,
    'REP/Origem': p.deviceSerial,
    'NSR': p.nsr,
    'Justificativa': p.justificativa || p.ajusteJustificativa || ''
  }));
  if (ajustes.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ajustes), "Ajustes Manuais");
  XLSX.writeFile(wb, "Pre_Leitura_Ponto_RH.xlsx");
}

// Laboratório visual independente: não inicializa usuário, planilha, polling ou IA.
let entidadeLaboratorioTimer_ = null;
let entidadeLaboratorioSequenciaTimer_ = null;
let entidadeLaboratorioTimers_ = [];

function inicializarLaboratorioAnimacoesEntidade_() {
  document.body.classList.add('modo-laboratorio-entidade');
  const cenas = [
    ['idle-reading', 'Lendo'], ['idle-sleeping', 'Dormindo'],
    ['idle-coffee', 'Café'], ['idle-orb', 'Vagalume'],
    ['idle-juggling', 'Malabarismo'], ['idle-sunbathing', 'Tomando sol'],
    ['idle-dancing', 'Dançando'], ['lab-passeio', 'Passeio + post-it'],
    ['is-thinking', 'Pensando'], ['has-notification', 'Mensagem não lida'],
    ['operation-lancamento', 'Lançamento concluído'],
    ['operation-alteracao', 'Alteração concluída'], ['operation-falha', 'Falha'],
    ['enter-right', 'Entrada'], ['lab-saida', 'Saída'], ['chat-open', 'Chat aberto']
  ];
  const botoes = cenas.map(function(cena) {
    return `<button type="button" data-entidade-cena="${cena[0]}">${cena[1]}</button>`;
  }).join('');
  const laboratorio = document.createElement('main');
  laboratorio.className = 'entidade-animation-lab';
  laboratorio.innerHTML = `
    <header class="entidade-lab-header">
      <div><span>LABORATÓRIO VISUAL</span><h1>Animações da Entidade</h1><p>Ambiente isolado — sem acesso à planilha e sem consumo da API.</p></div>
      <button type="button" class="entidade-lab-close" aria-label="Fechar laboratório">×</button>
    </header>
    <section class="entidade-lab-layout">
      <div class="entidade-lab-stage">
        <div class="entidade-lab-grid"></div>
        <div class="entidade-lab-ghost-scale">
          <button type="button" id="entidade-lab-ghost" class="entidade-fab roaming" aria-label="Entidade">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 10h.01"/><path d="M15 10h.01"/><path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z"/>
            </svg>
          </button>
        </div>
        <div class="entidade-lab-postit"><span>Volto<br>Logo</span></div>
        <div id="entidade-lab-status" class="entidade-lab-status">Flutuação padrão</div>
      </div>
      <aside class="entidade-lab-controls">
        <div class="entidade-lab-actions">
          <button type="button" id="entidade-lab-todas" class="primary">▶ Reproduzir todas</button>
          <button type="button" id="entidade-lab-parar">Parar</button>
        </div>
        <div class="entidade-lab-buttons">${botoes}</div>
      </aside>
    </section>`;
  document.body.appendChild(laboratorio);

  laboratorio.querySelector('.entidade-lab-close').addEventListener('click', function() {
    const url = new URL(window.location.href);
    url.searchParams.delete('testeAnimacoesEntidade');
    window.location.href = url.toString();
  });
  laboratorio.querySelectorAll('[data-entidade-cena]').forEach(function(botao) {
    botao.addEventListener('click', function() {
      pararSequenciaLaboratorioEntidade_();
      executarCenaLaboratorioEntidade_(botao.dataset.entidadeCena, botao.textContent.trim());
    });
  });
  document.getElementById('entidade-lab-todas').addEventListener('click', iniciarSequenciaLaboratorioEntidade_);
  document.getElementById('entidade-lab-parar').addEventListener('click', function() {
    pararSequenciaLaboratorioEntidade_();
    limparCenaLaboratorioEntidade_();
  });
}

function limparCenaLaboratorioEntidade_() {
  if (entidadeLaboratorioTimer_) clearTimeout(entidadeLaboratorioTimer_);
  entidadeLaboratorioTimer_ = null;
  entidadeLaboratorioTimers_.forEach(clearTimeout);
  entidadeLaboratorioTimers_ = [];
  restaurarVisualLaboratorioEntidade_();
}

function restaurarVisualLaboratorioEntidade_() {
  const fantasma = document.getElementById('entidade-lab-ghost');
  if (!fantasma) return;
  fantasma.className = 'entidade-fab roaming';
  const escala = document.querySelector('.entidade-lab-ghost-scale');
  if (escala) escala.classList.remove('scene-transition');
  const postit = document.querySelector('.entidade-lab-postit');
  if (postit) postit.classList.remove('show');
  const status = document.getElementById('entidade-lab-status');
  if (status) status.textContent = 'Flutuação padrão';
}

function executarCenaLaboratorioEntidade_(classe, rotulo, callback) {
  limparCenaLaboratorioEntidade_();
  const fantasma = document.getElementById('entidade-lab-ghost');
  const escala = document.querySelector('.entidade-lab-ghost-scale');
  const status = document.getElementById('entidade-lab-status');
  if (!fantasma || !escala) return;
  escala.classList.add('scene-transition');
  if (status) status.textContent = `Preparando: ${rotulo}`;
  const duracao = classe === 'lab-passeio' ? 8500 : 5200;

  entidadeLaboratorioTimers_.push(setTimeout(function() {
    fantasma.className = 'entidade-fab roaming';
    if (classe === 'lab-saida') fantasma.classList.add('leaving', 'exit-right');
    else fantasma.classList.add(classe);
    if (classe === 'lab-passeio') {
      const postit = document.querySelector('.entidade-lab-postit');
      if (postit) postit.classList.add('show');
    }
    if (status) status.textContent = rotulo;
    requestAnimationFrame(function() { escala.classList.remove('scene-transition'); });
  }, 360));

  entidadeLaboratorioTimers_.push(setTimeout(function() {
    escala.classList.add('scene-transition');
    if (status) status.textContent = `Encerrando: ${rotulo}`;
  }, duracao - 360));

  entidadeLaboratorioTimer_ = setTimeout(function() {
    fantasma.className = 'entidade-fab roaming';
    const postit = document.querySelector('.entidade-lab-postit');
    if (postit) postit.classList.remove('show');
    requestAnimationFrame(function() {
      escala.classList.remove('scene-transition');
      if (status) status.textContent = 'Flutuação padrão';
      entidadeLaboratorioSequenciaTimer_ = setTimeout(function() {
        if (callback) callback();
      }, 420);
    });
  }, duracao);
}

function pararSequenciaLaboratorioEntidade_() {
  if (entidadeLaboratorioSequenciaTimer_) clearTimeout(entidadeLaboratorioSequenciaTimer_);
  entidadeLaboratorioSequenciaTimer_ = null;
  const botao = document.getElementById('entidade-lab-todas');
  if (botao) botao.classList.remove('running');
}

function iniciarSequenciaLaboratorioEntidade_() {
  pararSequenciaLaboratorioEntidade_();
  const botoes = Array.from(document.querySelectorAll('[data-entidade-cena]'));
  const botaoTodas = document.getElementById('entidade-lab-todas');
  if (botaoTodas) botaoTodas.classList.add('running');
  let indice = 0;
  function proxima() {
    if (indice >= botoes.length) {
      pararSequenciaLaboratorioEntidade_();
      limparCenaLaboratorioEntidade_();
      return;
    }
    const botao = botoes[indice++];
    executarCenaLaboratorioEntidade_(botao.dataset.entidadeCena, botao.textContent.trim(), function() {
      entidadeLaboratorioSequenciaTimer_ = setTimeout(proxima, 650);
    });
  }
  proxima();
}

document.addEventListener('DOMContentLoaded', () => {
  const zone = document.getElementById('rep-upload-zone');
  if (zone) {
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      window.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
      }, false);
    });

    zone.addEventListener('dragover', () => zone.classList.add('dragover'));
    zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
    zone.addEventListener('drop', (e) => {
      zone.classList.remove('dragover');
      if (e.dataTransfer && e.dataTransfer.files.length > 0) {
        processarArquivosRep(e.dataTransfer.files);
      }
    });
  }
});
</script>
