function montarAusenciasSimultaneasPainelDashboard_(servidores, lancamentos) {
  const servidorPorMatricula = {};
  servidores.forEach(function(s) { servidorPorMatricula[String(s.matricula || '').trim()] = s; });
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const limite = new Date(hoje); limite.setDate(limite.getDate() + 180);
  const ausencias = lancamentos.reduce(function(saida, l) {
    const tipo = normalizarTextoPainelDashboard_(l.tipo);
    const status = normalizarTextoPainelDashboard_(l.status);
    if (/(ANULAD|CANCELAD|EXCLUID|NAO EFETIVAD)/.test(status) || tipo.includes('NAO EFETIVAD') || !/(FERIAS|LICENCA|ABON|ATESTADO|AFAST|FALTA)/.test(tipo)) return saida;
    const inicio = dataPainelDashboard_(l.dataInicio);
    if (!inicio) return saida;
    const dias = Math.max(1, Number(l.dias || l.diasFerias || 1));
    const fim = new Date(inicio); fim.setDate(fim.getDate() + dias - 1);
    if (fim < hoje || inicio > limite) return saida;
    const servidor = servidorPorMatricula[String(l.matricula || '').trim()];
    const lotacao = String(servidor && servidor.lotacao || '').trim();
    if (!servidor || !lotacao || String(servidor.status || '').toLowerCase() === 'inativo') return saida;
    saida.push({ nome: servidor.nome || l.nome, matricula: servidor.matricula, lotacao: lotacao, tipo: l.tipo, inicio: inicio, fim: fim, linhaPlanilha: Number(l.linhaPlanilha || 0) });
    return saida;
  }, []);
  const grupos = {};
  ausencias.forEach(function(a) {
    if (!grupos[a.lotacao]) grupos[a.lotacao] = [];
    grupos[a.lotacao].push(a);
  });
  return Object.keys(grupos).sort().reduce(function(cenas, lotacao) {
    const lista = grupos[lotacao].sort((a, b) => a.inicio - b.inicio || String(a.nome).localeCompare(String(b.nome), 'pt-BR'));
    const periodos = [];
    for (let cursor = new Date(hoje); cursor <= limite; cursor.setDate(cursor.getDate() + 1)) {
      const pessoasPorMatricula = {};
      lista.forEach(function(ausencia) {
        if (ausencia.inicio <= cursor && ausencia.fim >= cursor) pessoasPorMatricula[String(ausencia.matricula || '')] = ausencia;
      });
      const pessoas = Object.values(pessoasPorMatricula).sort(function(a, b) { return String(a.nome).localeCompare(String(b.nome), 'pt-BR'); });
      if (pessoas.length < 2) continue;
      const chave = pessoas.map(function(pessoa) { return String(pessoa.matricula || ''); }).sort().join('|');
      const anterior = periodos[periodos.length - 1];
      const diaSeguinte = anterior ? new Date(anterior.fim) : null;
      if (diaSeguinte) diaSeguinte.setDate(diaSeguinte.getDate() + 1);
      const ehContinuidade = anterior && anterior.chave === chave && diaSeguinte.getFullYear() === cursor.getFullYear() && diaSeguinte.getMonth() === cursor.getMonth() && diaSeguinte.getDate() === cursor.getDate();
      if (ehContinuidade) anterior.fim = new Date(cursor);
      else periodos.push({ chave: chave, inicio: new Date(cursor), fim: new Date(cursor), pessoas: pessoas });
    }
    periodos.forEach(function(periodo) {
      const textoPeriodo = periodo.inicio.getTime() === periodo.fim.getTime()
        ? formatarDataComSemanaPainelDashboard_(periodo.inicio)
        : `${formatarDataComSemanaPainelDashboard_(periodo.inicio)} a ${formatarDataComSemanaPainelDashboard_(periodo.fim)}`;
      const corrente = periodo.pessoas.map(function(pessoa, indice) {
        const abrir = Number(pessoa.linhaPlanilha || 0)
          ? `abrirLancamentoDoPainelDashboard_(${Number(pessoa.linhaPlanilha)})`
          : `abrirFichaServidor('${escapeHtml(String(pessoa.matricula || ''))}')`;
        const nome = `<button type="button" class="billboard-conflict-node" onclick="${abrir}">${escapeHtml(pessoa.nome)}</button>`;
        if (indice === periodo.pessoas.length - 1) return nome;
        return `${nome}<span class="billboard-conflict-connector" aria-hidden="true"><i></i></span>`;
      }).join('');
      const html = `<div class="billboard-conflict-network"><div class="billboard-conflict-period"><span data-lucide="calendar-range"></span>${textoPeriodo}</div><div class="billboard-conflict-chain">${corrente}</div><div class="billboard-conflict-summary"><span data-lucide="users-round"></span><strong>${periodo.pessoas.length}</strong> pessoas ausentes simultaneamente</div></div>`;
      cenas.push({ eyebrow: 'COBERTURA DA EQUIPE', title: 'Ausências simultâneas', localizacao: lotacao, icon: 'users-round', accent: 'laranja', html: html, footer: 'Clique em um nome para abrir o lançamento', counter: `${periodo.pessoas.length} pessoas`, navegacao: `Ausências · ${lotacao}` });
    });
    return cenas;
  }, []);
}

function montarCenasPainelDashboard_(insight) {
  const servidores = (AppState.servidores || []).filter(s => String(s.status || '').toLowerCase() !== 'inativo');
  const lancamentos = AppState.lancamentos || [];
  const cenas = [cenaLotacoesPainelDashboard_()];
  const sem1Doc = lancamentos.filter(function(l) {
    const status = normalizarTextoPainelDashboard_(l.status);
    const tipo = normalizarTextoPainelDashboard_(l.tipo);
    if (/(ANULAD|CANCELAD|EXCLUID|NAO EFETIVAD)/.test(status) || tipo.includes('NAO EFETIVAD') || String(l.idoc || '').trim()) return false;
    const data = dataPainelDashboard_(l.dataSolicitacao);
    return !data || ((Date.now() - data.getTime()) / 86400000) <= 365;
  });
  cenas.push({ eyebrow: 'PENDÊNCIAS DOCUMENTAIS', title: 'Lançamentos sem número 1Doc', icon: 'file-warning', accent: 'laranja', html: montarListaPainelDashboard_(sem1Doc.map(function(l) { return `<button type="button" class="billboard-list-item" onclick="abrirLancamentoDoPainelDashboard_(${Number(l.linhaPlanilha || 0)})"><span><strong>${escapeHtml(l.nome || 'Servidor')}</strong><small>${escapeHtml(l.tipo || 'Lançamento')}</small></span><em>${escapeHtml(l.dataSolicitacao || l.dataInicio || 'Sem data')}</em></button>`; }), 'Nenhum lançamento aguardando 1Doc'), footer: 'Clique para abrir o lançamento', counter: `${sem1Doc.length} pendências`, navegacao: 'Pendências 1Doc' });

  const compulsorias = servidores.filter(s => s.feriasCompulsorias === true).sort((a, b) => Number(a.diasParaTerceiroPeriodo || 999999) - Number(b.diasParaTerceiroPeriodo || 999999));
  cenas.push({ eyebrow: 'PROGRAMAÇÃO DE FÉRIAS', title: 'Pessoas na lista de compulsórias', icon: 'calendar-warning', accent: 'vermelho', html: montarListaPainelDashboard_(compulsorias.map(function(s) { return `<button type="button" class="billboard-list-item" onclick="abrirFichaServidor('${escapeHtml(String(s.matricula || ''))}')"><span><strong>${escapeHtml(s.nome)}</strong><small>${escapeHtml(s.lotacao || 'Lotação não informada')}</small></span><em>${Number(s.saldoHoje || 0)} dias · ${escapeHtml(s.dataTerceiroPeriodo || 'prazo não informado')}</em></button>`; }), 'Nenhuma pessoa na lista preventiva de programação'), footer: 'Clique para consultar o saldo e os períodos', counter: `${compulsorias.length} pessoas`, navegacao: 'Férias' });

  montarAusenciasSimultaneasPainelDashboard_(servidores, lancamentos).forEach(cena => cenas.push(cena));

  const situacoes = {};
  servidores.forEach(function(s) { const nome = String(s.situacao || 'Não informada').trim() || 'Não informada'; situacoes[nome] = (situacoes[nome] || 0) + 1; });
  const listaSituacoes = Object.entries(situacoes).sort((a, b) => b[1] - a[1]);
  const maxSituacao = Math.max(1, ...listaSituacoes.map(item => item[1]));
  cenas.push({ eyebrow: 'PERFIL DA EQUIPE', title: 'Composição funcional', icon: 'contact-round', accent: 'azul', html: `<div class="billboard-bars">${listaSituacoes.map(function(item) { return `<div><span>${escapeHtml(item[0])}</span><i><b style="width:${Math.max(4, item[1] / maxSituacao * 100)}%"></b></i><strong>${item[1]}</strong></div>`; }).join('')}</div>`, footer: 'Servidores ativos por situação', counter: `${servidores.length} pessoas` });

  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const aniversarios = servidores.map(function(s) {
    const partes = String(s.aniversario || '').split('/');
    if (partes.length !== 2) return null;
    let data = new Date(hoje.getFullYear(), Number(partes[1]) - 1, Number(partes[0]));
    if (data < hoje) data = new Date(hoje.getFullYear() + 1, Number(partes[1]) - 1, Number(partes[0]));
    const dias = Math.round((data - hoje) / 86400000);
    return dias <= 30 ? { servidor: s, data: data, dias: dias } : null;
  }).filter(Boolean).sort((a,b) => a.dias - b.dias || String(a.servidor.nome).localeCompare(String(b.servidor.nome), 'pt-BR'));
  cenas.push({ eyebrow: 'PRÓXIMOS 30 DIAS', title: 'Aniversariantes da equipe', icon: 'cake-slice', accent: 'roxo', html: montarListaPainelDashboard_(aniversarios.map(function(item, indice) { const proximidade = item.dias === 0 ? 'HOJE' : item.dias === 1 ? 'AMANHÃ' : `EM ${item.dias} DIAS`; return `<button type="button" class="billboard-list-item billboard-birthday-item" onclick="abrirFichaServidor('${escapeHtml(String(item.servidor.matricula || ''))}')"><b>${indice + 1}</b><span><strong>${escapeHtml(item.servidor.nome)}</strong><small>${escapeHtml(item.servidor.lotacao || 'Lotação não informada')}</small></span><em><strong>${formatarDataPainelDashboard_(item.data)}</strong><small>${proximidade}</small></em></button>`; }), 'Nenhum aniversário nos próximos 30 dias'), footer: 'Em ordem cronológica, do mais próximo ao mais distante', counter: `${aniversarios.length} pessoas` });

  if (insight && insight.resposta && alertaDashboardEntidadeAcionavel(insight.resposta)) cenas.push({ eyebrow: 'A ENTIDADE OBSERVOU', title: 'Prioridades e pontos de atenção', icon: 'ghost', accent: 'verde', html: `<div class="billboard-entidade-texto">${renderizarMarkdownSeguroEntidade(limparComandosEntidade(insight.resposta))}</div>`, footer: 'Leitura automática dos dados atuais', counter: 'Entidade' });
  const temasPorIcone = {
    'map-pinned': 'lotacoes', 'file-warning': 'documentos', 'calendar-warning': 'ferias',
    'users-round': 'ausencias', 'contact-round': 'equipe', 'cake-slice': 'aniversarios', 'ghost': 'entidade'
  };
  cenas.forEach(function(cena) { cena.tema = temasPorIcone[cena.icon] || 'geral'; });
  return cenas;
}

function pararRolagemPainelDashboard_() {
  if (painelDashboardScrollFrame_) cancelAnimationFrame(painelDashboardScrollFrame_);
  painelDashboardScrollFrame_ = null;
  painelDashboardScrollInicio_ = 0;
  painelDashboardScrollPausaInicio_ = 0;
  painelDashboardScrollPausaAcumulada_ = 0;
}

function iniciarRolagemPainelDashboard_(posicaoInicial) {
  pararRolagemPainelDashboard_();
  const conteudo = document.getElementById('dashboard-billboard-content');
  if (!conteudo) return 0;
  const rolavel = conteudo.querySelector('.billboard-location-list, .billboard-list, .billboard-bars, .billboard-entidade-texto, .billboard-conflict-network');
  if (!rolavel) return 0;
  const limiteRolagem = Math.max(0, rolavel.scrollHeight - rolavel.clientHeight);
  const inicioRolagem = Math.max(0, Math.min(limiteRolagem, Number(posicaoInicial || 0)));
  rolavel.scrollTop = inicioRolagem;
  const distancia = Math.max(0, limiteRolagem - inicioRolagem);
  if (distancia < 5) return 0;
  const atraso = 2200;
  const velocidade = 13;
  const duracao = distancia / velocidade * 1000;
  function rolar(agora) {
    if (!painelDashboardScrollInicio_) painelDashboardScrollInicio_ = agora;
    const estaPausado = painelDashboardPausado_ || painelDashboardHover_ || painelDashboardEmTransicao_;
    if (estaPausado) {
      if (!painelDashboardScrollPausaInicio_) painelDashboardScrollPausaInicio_ = agora;
      painelDashboardScrollFrame_ = requestAnimationFrame(rolar);
      return;
    }
    if (painelDashboardScrollPausaInicio_) {
      painelDashboardScrollPausaAcumulada_ += agora - painelDashboardScrollPausaInicio_;
      painelDashboardScrollPausaInicio_ = 0;
    }
    const decorrido = agora - painelDashboardScrollInicio_ - painelDashboardScrollPausaAcumulada_;
    if (decorrido > atraso) rolavel.scrollTop = Math.min(limiteRolagem, inicioRolagem + (decorrido - atraso) / duracao * distancia);
    if (rolavel.scrollTop < limiteRolagem - 1) painelDashboardScrollFrame_ = requestAnimationFrame(rolar);
    else painelDashboardScrollFrame_ = null;
  }
  painelDashboardScrollFrame_ = requestAnimationFrame(rolar);
  return atraso + duracao;
}

  }).join('');

function exibirCenaPainelDashboard_(posicaoRolagem) {
  const cena = painelDashboardCenas_[painelDashboardIndice_];
  const conteudo = document.getElementById('dashboard-billboard-content');
  if (!cena || !conteudo) return;
  document.getElementById('smart-card-eyebrow').innerText = cena.eyebrow;
  document.getElementById('smart-card-title').innerText = cena.title;
  const localizacao = document.getElementById('smart-card-location');
  if (localizacao) {
    localizacao.innerText = cena.localizacao || '';
    localizacao.hidden = !cena.localizacao;
  }
  document.getElementById('smart-card-icon').innerHTML = `<span data-lucide="${cena.icon}"></span>`;
  const card = document.getElementById('smart-dashboard-card');
  card.dataset.accent = cena.accent || 'verde';
  card.dataset.tema = cena.tema || 'geral';
  card.classList.remove('cena-entrando');
  void card.offsetWidth;
  card.classList.add('cena-entrando');
  setTimeout(function() { card.classList.remove('cena-entrando'); }, 700);
  conteudo.innerHTML = `<div class="dashboard-billboard-scene">${ornamentacaoCenaPainelDashboard_(cena)}<div class="billboard-scene-body">${cena.html}</div><div class="smart-card-footer"><span>${escapeHtml(cena.footer || '')}</span><span>${escapeHtml(cena.counter || '')}</span></div></div>`;
  conteudo.className = 'dashboard-billboard-content entrando';
  setTimeout(function() { conteudo.classList.remove('entrando'); }, 700);
  atualizarNavegacaoPainelDashboard_();
  renderizarIcones();
  const tempoRolagem = iniciarRolagemPainelDashboard_(posicaoRolagem);
  conteudo.dataset.tempoExibicao = String(Math.max(11000, Math.ceil(tempoRolagem + 3000)));
}

function agendarPainelDashboard_() {
  if (painelDashboardTimer_) clearTimeout(painelDashboardTimer_);
  if (painelDashboardPausado_ || painelDashboardHover_ || painelDashboardCenas_.length < 2 || currentView !== 'dashboard') return;
  const conteudo = document.getElementById('dashboard-billboard-content');
  const tempo = Math.max(11000, Number(conteudo && conteudo.dataset.tempoExibicao || 11000));
  painelDashboardTimer_ = setTimeout(function() {
    if (currentView === 'dashboard') irParaCenaPainelDashboard_(painelDashboardIndice_ + 1, true);
  }, tempo);
}

function suspenderPainelDashboard_() { painelDashboardHover_ = true; if (painelDashboardTimer_) clearTimeout(painelDashboardTimer_); }
function retomarPainelDashboard_() { painelDashboardHover_ = false; if (!painelDashboardPausado_) agendarPainelDashboard_(); }

function irParaCenaPainelDashboard_(indice, automatico) {
  if (painelDashboardEmTransicao_ || !painelDashboardCenas_.length) return;
  const novoIndice = (Number(indice) + painelDashboardCenas_.length) % painelDashboardCenas_.length;
  if (novoIndice === painelDashboardIndice_) return agendarPainelDashboard_();
  painelDashboardEmTransicao_ = true;
  if (painelDashboardTimer_) clearTimeout(painelDashboardTimer_);
  pararRolagemPainelDashboard_();
  const conteudo = document.getElementById('dashboard-billboard-content');
  const entidade = document.getElementById('dashboard-billboard-entidade');
  conteudo?.classList.add('saindo');
  if (!automatico) {
    setTimeout(function() {
      painelDashboardIndice_ = novoIndice;
      exibirCenaPainelDashboard_();
      painelDashboardEmTransicao_ = false;
      agendarPainelDashboard_();
    }, 360);
    return;
  }
  setTimeout(function() { entidade?.classList.add('visivel'); }, 260);
  setTimeout(function() {
    painelDashboardIndice_ = novoIndice;
    exibirCenaPainelDashboard_();
    entidade?.classList.add('saindo');
  }, 3260);
  setTimeout(function() {
    entidade?.classList.remove('visivel', 'saindo');
    painelDashboardEmTransicao_ = false;
    agendarPainelDashboard_();
  }, 3920);
}

function mudarCenaPainelDashboard_(direcao) { irParaCenaPainelDashboard_(painelDashboardIndice_ + Number(direcao || 1)); }

function alternarPausaPainelDashboard_() {
  painelDashboardPausado_ = !painelDashboardPausado_;
  const icone = document.getElementById('dashboard-billboard-pause-icon');
  if (icone) icone.setAttribute('data-lucide', painelDashboardPausado_ ? 'play' : 'pause');
  if (painelDashboardPausado_ && painelDashboardTimer_) clearTimeout(painelDashboardTimer_);
  else agendarPainelDashboard_();
  renderizarIcones();
}

function renderizarCardInteligenteDashboard(insight) {
  const card = document.getElementById('smart-dashboard-card');
  if (!card || !document.getElementById('dashboard-billboard-content')) return;
  const cenaAtual = painelDashboardCenas_[painelDashboardIndice_];
  const chaveAtual = cenaAtual ? `${cenaAtual.tema}|${cenaAtual.title}` : '';
  const rolavelAtual = document.querySelector('#dashboard-billboard-content .billboard-location-list, #dashboard-billboard-content .billboard-list, #dashboard-billboard-content .billboard-bars, #dashboard-billboard-content .billboard-entidade-texto, #dashboard-billboard-content .billboard-conflict-network');
  const posicaoAtual = rolavelAtual ? rolavelAtual.scrollTop : 0;
  const novasCenas = montarCenasPainelDashboard_(insight);
  const novaAssinatura = novasCenas.map(function(cena) { return `${cena.tema}|${cena.title}|${cena.counter}|${cena.html}`; }).join('||');
  if (painelDashboardAssinatura_ === novaAssinatura && painelDashboardCenas_.length) {
    atualizarConviteEntidade();
    return;
  }
  painelDashboardCenas_ = novasCenas;
  fecharMapaPainelDashboard_();
  painelDashboardAssinatura_ = novaAssinatura;
  const indicePreservado = chaveAtual ? painelDashboardCenas_.findIndex(function(cena) { return `${cena.tema}|${cena.title}` === chaveAtual; }) : -1;
  if (indicePreservado >= 0) painelDashboardIndice_ = indicePreservado;
  else if (!chaveAtual) painelDashboardIndice_ = 0;
  if (painelDashboardIndice_ >= painelDashboardCenas_.length) painelDashboardIndice_ = 0;
  exibirCenaPainelDashboard_(indicePreservado >= 0 ? posicaoAtual : 0);
  agendarPainelDashboard_();
  atualizarConviteEntidade();
}

/**
 * Renderiza as linhas da tabela de Servidores com base nos dados locais
 */
function renderizarTabelaServidores(listaFiltrada, mantemPagina = false) {
  const listaOriginal = Array.isArray(listaFiltrada)
    ? listaFiltrada
    : (Array.isArray(AppState.servidores) ? AppState.servidores : []);
  const tbody = document.getElementById('tabela-servidores-body');
  
  const estado = AppState.paginacao.servidores;
  estado.listaAtual = listaOriginal;
  if (!mantemPagina) estado.paginaAtual = 1;
  const totalItens = estado.listaAtual.length;
  estado.paginaAtual = Math.min(estado.paginaAtual, Math.max(1, Math.ceil(totalItens / estado.itensPorPagina)));
  
  if (totalItens === 0) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-secondary);">Nenhum servidor encontrado.</td></tr>`;
    renderizarControlesPaginacao('paginacao-servidores', 'servidores', 0);
    return;
  }
  
  const start = (estado.paginaAtual - 1) * estado.itensPorPagina;
  const servidores = estado.listaAtual.slice(start, start + estado.itensPorPagina);
  
  let html = "";
  servidores.forEach(s => {
    let badgeClass = "badge-ativo";
    let badgeText = "Ativo";
    
    if (s.status === "Férias") {
      badgeClass = "badge-ferias";
      badgeText = "Férias";
    } else if (s.status === "Abono") {
      badgeClass = "badge-abono";
      badgeText = "Abono";
    } else if (s.status === "Inativo") {
      badgeClass = "badge-inativo";
      badgeText = "Inativo";
    }
    
    const botaoNotificacao = s.feriasCompulsorias === true
      ? `<button class="btn-action btn-notificacao-ferias" data-action="notificar-ferias" data-mat="${escapeHtml(s.matricula)}" title="Gerar notificação preventiva de férias"><span data-lucide="file-warning" style="width:14px;height:14px;"></span></button>`
      : '';
    html += `<tr>       <td><div class="nome-com-acao"><strong>${escapeHtml(s.nome)}</strong>${botaoNotificacao}</div></td>       <td>${escapeHtml(s.matricula)}</td>       <td>${escapeHtml(s.cargo)}</td>       <td>${escapeHtml(s.lotacao)}</td>       <td>${escapeHtml(s.situacao)}</td>       <td><span class="badge ${badgeClass}">${badgeText}</span></td>       <td>         <div class="action-buttons">           <button class="btn-action" data-action="ficha" data-mat="${escapeHtml(s.matricula)}" title="Visualizar Ficha">             <span data-lucide="eye" style="width: 14px; height: 14px;"></span>           </button>           <button class="btn-action" data-action="editar-servidor" data-mat="${escapeHtml(s.matricula)}" title="Editar Cadastro">             <span data-lucide="edit-2" style="width: 14px; height: 14px;"></span>           </button>           ${s.status !== 'Inativo' ? `<button class="btn-action btn-delete" data-action="desativar-servidor" data-mat="${escapeHtml(s.matricula)}" data-nome="${escapeHtml(s.nome)}" title="Desativar Servidor"><span data-lucide="trash-2" style="width: 14px; height: 14px;"></span></button>` : ''}         </div>       </td>     </tr>`;
  });

  tbody.innerHTML = html;
  // Delega eventos após inserção para evitar XSS em atributos onclick
  tbody.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', function() {
      const action = this.dataset.action;
      const mat = this.dataset.mat;
      const nome = this.dataset.nome || '';
      if (action === 'ficha') abrirFichaServidor(mat);
      else if (action === 'editar-servidor') abrirModalServidor(mat);
      else if (action === 'desativar-servidor') confirmarDesativacaoServidor(mat, nome);
      else if (action === 'notificar-ferias') abrirNotificacaoFeriasCompulsorias(mat);
    });
  });
  renderizarIcones();
  renderizarControlesPaginacao('paginacao-servidores', 'servidores', totalItens);
}

/**
 * Filtra a tabela de servidores em tempo real no lado do cliente
 */
function filtrarTabelaServidores() {
  const busca = normalizarTextoBusca(document.getElementById('filtro-busca-servidor').value);
  const lotacao = document.getElementById('filtro-lotacao-servidor').value;
  const situacao = document.getElementById('filtro-situacao-servidor').value;
  const status = document.getElementById('filtro-status-servidor').value;
  
  const filtrados = AppState.servidores.filter(s => {
    // 1. Busca textual (Nome ou Matrícula)
    const bateBusca = correspondeBusca(busca, s.nome, s.matricula);
    
    // 2. Filtro de Lotação
    const bateLotacao = !lotacao || s.lotacao === lotacao;
    
    // 3. Filtro de Situação
    const bateSituacao = !situacao || s.situacao === situacao;
    
    // 4. Filtro de Status
    let bateStatus = false;
    if (!status) {
      bateStatus = true;
    } else if (status === "Compulsorias") {
      bateStatus = s.feriasCompulsorias === true;
    } else {
      bateStatus = s.status === status;
    }
    
    return bateBusca && bateLotacao && bateSituacao && bateStatus;
  });
  
  const estado = AppState.paginacao.servidores;
  const assinatura = JSON.stringify([busca, lotacao, situacao, status]);
  const manterPagina = estado.filtroAssinatura === assinatura;
  estado.filtroAssinatura = assinatura;
  renderizarTabelaServidores(filtrados, manterPagina);
}

/**
 * Popula dinamicamente o select de lotações com base nos cadastros existentes
 */
function popularFiltroLotacoes() {
  const select = document.getElementById('filtro-lotacao-servidor');
  const lotacaoForm = document.getElementById('serv-lotacao');
  if (!select || !lotacaoForm) return;
  const filtroAtual = select.value;
  const lotacaoAtual = lotacaoForm.value;
  const campoNova = document.getElementById('serv-lotacao-nova');
  const textoNovaAtual = campoNova ? campoNova.value : '';
  
  // Extrai lotações exclusivas
  const lotacoes = [...new Set(AppState.servidores.map(s => s.lotacao).filter(Boolean))].sort();
  
  // Usa elementos DOM, evitando interpretar como HTML uma lotacao digitada.
  select.replaceChildren(new Option('Todas Lotações', ''));
  lotacoes.forEach(l => select.add(new Option(l, l)));
  if (Array.from(select.options).some(opcao => opcao.value === filtroAtual)) select.value = filtroAtual;

  const opcoesFormulario = lotacoes.slice();
  ['Turismo', 'Rodoviária', 'Espaço Batuíra'].forEach(l => {
    if (!opcoesFormulario.includes(l)) opcoesFormulario.push(l);
  });
  if (lotacaoAtual && lotacaoAtual !== '__NOVA_LOTACAO__' && !opcoesFormulario.includes(lotacaoAtual)) {
    opcoesFormulario.push(lotacaoAtual);
  }
  lotacaoForm.replaceChildren();
  opcoesFormulario.forEach(l => lotacaoForm.add(new Option(l, l)));
  lotacaoForm.add(new Option('Adicionar nova lotação...', '__NOVA_LOTACAO__'));
  if (Array.from(lotacaoForm.options).some(opcao => opcao.value === lotacaoAtual)) {
    lotacaoForm.value = lotacaoAtual;
  }
  if (lotacaoAtual === '__NOVA_LOTACAO__' && campoNova) campoNova.value = textoNovaAtual;
}

/** Exibe o campo livre somente quando for necessário cadastrar uma nova lotação. */
function atualizarCampoNovaLotacaoServidor() {
  const seletor = document.getElementById('serv-lotacao');
  const campoNovo = document.getElementById('serv-lotacao-nova');
  if (!seletor || !campoNovo) return;

  const informandoNova = seletor.value === '__NOVA_LOTACAO__';
  campoNovo.style.display = informandoNova ? 'block' : 'none';
  campoNovo.required = informandoNova;
  if (!informandoNova) campoNovo.value = '';
}

/** Mantém uma lotação histórica editável mesmo se ela não constar no menu atual. */
function selecionarLotacaoServidor_(lotacao) {
  const seletor = document.getElementById('serv-lotacao');
  const campoNovo = document.getElementById('serv-lotacao-nova');
  const valor = String(lotacao || '').trim();
  if (!seletor || !campoNovo) return;

  const opcaoNova = '__NOVA_LOTACAO__';
  const existe = Array.from(seletor.options).some(opcao => opcao.value === valor);
  if (valor && valor !== 'Outro' && !existe) {
    const opcao = document.createElement('option');
    opcao.value = valor;
    opcao.textContent = valor;
    seletor.insertBefore(opcao, Array.from(seletor.options).find(opcao => opcao.value === opcaoNova) || null);
  }

  seletor.value = valor && valor !== 'Outro' ? valor : opcaoNova;
  campoNovo.value = '';
  atualizarCampoNovaLotacaoServidor();
}

function obterLotacaoFormularioServidor_() {
  const seletor = document.getElementById('serv-lotacao');
  const campoNovo = document.getElementById('serv-lotacao-nova');
  if (!seletor) return '';
  if (seletor.value !== '__NOVA_LOTACAO__') return seletor.value;
  return String(campoNovo ? campoNovo.value : '').trim();
}

/**
 * Abre o modal de cadastro/edição de servidor
 */
function abrirModalServidor(matricula) {
  const form = document.getElementById('form-servidor');
  form.reset();
  
  const titulo = document.getElementById('modal-servidor-titulo');
  const inputMatricula = document.getElementById('serv-matricula');
  const wrapperAtivo = document.getElementById('serv-ativo-wrapper');
  const campoNovaLotacao = document.getElementById('serv-lotacao-nova');
  if (campoNovaLotacao) campoNovaLotacao.value = '';
  
  if (matricula) {
    // Modo Edição
    titulo.innerText = "Editar Servidor";
    inputMatricula.disabled = true; // matrícula é a chave primária, não edita
    wrapperAtivo.style.display = "block";
    
    const s = AppState.servidores.find(serv => serv.matricula === matricula);
    if (s) {
      document.getElementById('serv-matricula').value = s.matricula;
      document.getElementById('serv-pis').value = s.pis || '';
      document.getElementById('serv-nome').value = s.nome;
      document.getElementById('serv-cargo').value = s.cargo;
      selecionarLotacaoServidor_(s.lotacao);
      document.getElementById('serv-situacao').value = s.situacao;
      document.getElementById('serv-email').value = s.email;
      document.getElementById('serv-aniversario').value = s.aniversario || '';
      document.getElementById('serv-ativo').value = s.status === 'Inativo' ? 'Não' : 'Sim';
      document.getElementById('serv-penalidade-ferias').value = s.penalidadeFerias || 0;
      document.getElementById('serv-penalidade-abonos').value = s.penalidadeAbono || 0;
      
      // Parse de data no formato dd/mm/yyyy para yyyy-mm-dd exigido pelo input date
      if (s.admissao) {
        let partes = s.admissao.split('/');
        if (partes.length === 3) {
          document.getElementById('serv-admissao').value = `${partes[2]}-${partes[1]}-${partes[0]}`;
        }
      }
    }
  } else {
    // Modo Cadastro
    titulo.innerText = "Cadastrar Servidor";
    inputMatricula.disabled = false;
    wrapperAtivo.style.display = "none";
    document.getElementById('serv-ativo').value = "Sim";
    document.getElementById('serv-penalidade-ferias').value = 0;
    document.getElementById('serv-penalidade-abonos').value = 0;
    document.getElementById('serv-aniversario').value = '';
    selecionarLotacaoServidor_(document.getElementById('serv-lotacao').value);
  }

  abrirModal('modal-servidor');
  toggleCamposObrigatoriosServidor();
}

/**
 * Alterna a obrigatoriedade dos campos com base no status "Inativo"
 */
function toggleCamposObrigatoriosServidor() {
  const isAtivo = document.getElementById('serv-ativo').value !== 'Não';
  const situacao = document.getElementById('serv-situacao').value;
  const identificacaoOpcional = situacao === 'ESTAGIÁRIO' || situacao === 'PEAD';
  const obrigatorios = new Set(['serv-situacao', 'serv-nome']);
  if (!identificacaoOpcional) {
    obrigatorios.add('serv-matricula');
    obrigatorios.add('serv-email');
  }
  ['serv-matricula', 'serv-situacao', 'serv-nome', 'serv-email'].forEach(id => {
    const campo = document.getElementById(id);
    if (campo) campo.required = isAtivo && obrigatorios.has(id);
  });
  const marcaMatricula = document.getElementById('serv-matricula-obrigatoria');
  const marcaEmail = document.getElementById('serv-email-obrigatorio');
  const ajuda = document.getElementById('serv-identificacao-ajuda');
  if (marcaMatricula) marcaMatricula.style.display = !isAtivo || identificacaoOpcional ? 'none' : '';
  if (marcaEmail) marcaEmail.style.display = !isAtivo || identificacaoOpcional ? 'none' : '';
  if (ajuda) ajuda.style.display = isAtivo && identificacaoOpcional ? 'block' : 'none';
}


/**
 * Envia os dados do formulário de servidor ao backend do Apps Script
 */
async function salvarDadosServidor(event) {
  event.preventDefault();
  const botaoSalvar = event.submitter || document.getElementById('btn-servidor-salvar');
  if (!iniciarOperacaoInterface('salvar-servidor', botaoSalvar, 'Salvando...')) return;

  try {
  exibirLoader(true);

  const lotacao = obterLotacaoFormularioServidor_();
  if (!lotacao) {
    exibirLoader(false);
    mostrarToast('Informe o nome da nova lotação antes de salvar.', 'warning');
    return;
  }
  
  const aniversarioInformado = document.getElementById('serv-aniversario').value.trim();
  if (aniversarioInformado && !/^\d{2}\/\d{2}$/.test(aniversarioInformado)) {
    exibirLoader(false);
    mostrarToast('Informe o aniversário no formato DD/MM.', 'warning');
    return;
  }

  const dados = {
    operacaoId: gerarIdOperacaoCliente_(),
    matricula: document.getElementById('serv-matricula').value.trim(),
    pis: normalizarPisRep(document.getElementById('serv-pis').value),
    nome: document.getElementById('serv-nome').value.trim().toUpperCase(),
    cargo: document.getElementById('serv-cargo').value.trim().toUpperCase(),
    lotacao: lotacao,
    aniversario: aniversarioInformado,
    aniversarioInformado: Boolean(aniversarioInformado),
    admissao: document.getElementById('serv-admissao').value,
    situacao: document.getElementById('serv-situacao').value,
    email: document.getElementById('serv-email').value.trim(),
    ativo: document.getElementById('serv-ativo').value,
    penalidadeFerias: parseInt(document.getElementById('serv-penalidade-ferias').value) || 0,
    penalidadeAbono: parseInt(document.getElementById('serv-penalidade-abonos').value) || 0
  };
  
  if (typeof google === "undefined" || !google.script) {
    mostrarToast("Dados salvos em modo simulação local!", 'warning');
    exibirLoader(false);
    fecharModal('modal-servidor');
    return;
  }
  
  mostrarToast("Alteração salva nesta tela. O envio continuará em segundo plano.", 'info');
  SyncQueue.enfileirar('salvar_servidor', 'salvarServidor', [dados], 'Salvar servidor ' + dados.nome);
  exibirLoader(false);
  fecharModal('modal-servidor');
  agendarSincronizacaoSegura_('servidores');
  } finally {
    finalizarOperacaoInterface('salvar-servidor', botaoSalvar);
  }
}

/**
 * Aciona a desativação lógica (soft delete) do servidor
 */
async function confirmarDesativacaoServidor(matricula, nome) {
  if (await abrirConfirm(`Atenção!\n\nVocê tem certeza que deseja DESATIVAR o cadastro do servidor ${nome} (Matrícula: ${matricula})?\n\nEle não aparecerá mais nos formulários ativos, mas todo o histórico dele na planilha será preservado.`)) {
    exibirLoader(true);
    
    if (typeof google === "undefined" || !google.script) {
      mostrarToast("Servidor desativado em modo de simulação local!", 'warning');
      exibirLoader(false);
      return;
    }
    
    backendApi()
      .withSuccessHandler(function() {
        exibirLoader(false);
        mostrarToast("Cadastro de servidor desativado com sucesso!", 'success');
        animarEntidadeOperacao_('alteracao');
        sincronizarEmSegundoPlano('servidores');
      })
      .withFailureHandler(function(erro) {
        exibirLoader(false);
        mostrarToast("Erro ao desativar servidor: " + erro.toString(), 'error');
        animarEntidadeOperacao_('falha');
      })
      .desativarServidor(matricula);
  }
}

/**
 * Abre a Ficha Individual Detalhada do Servidor e carrega seus períodos de férias e lançamentos
 */
function abrirFichaServidor(matricula) {
  const s = AppState.servidores.find(serv => serv.matricula === matricula);
  if (!s) return;
  
  // 1. Limpar abas para o estado inicial
  alternarAbaFicha('tab-dados');
  
  // 2. Preencher Dados de Cadastro
  document.getElementById('ficha-nome').innerText = s.nome;
  document.getElementById('ficha-cargo').innerText = s.cargo || 'Não cadastrado';
  document.getElementById('ficha-lotacao').innerText = s.lotacao || 'Não cadastrado';
  document.getElementById('ficha-matricula').innerText = s.matricula;
  
  document.getElementById('ficha-dados-situacao').innerText = s.situacao;
  document.getElementById('ficha-dados-admissao').innerText = s.admissao || 'Não informada';
  document.getElementById('ficha-dados-email').innerText = s.email || 'Não informado';
  document.getElementById('ficha-dados-aniversario').innerText = s.aniversario || 'Não informado';
  const penalidadeAbonos = document.getElementById('ficha-penalidade-abonos');
  const btnPenalidadeAbonos = document.getElementById('ficha-btn-penalidade-abonos');
  if (penalidadeAbonos) penalidadeAbonos.innerText = Number(s.penalidadeAbono || 0) + ' dias';
  if (btnPenalidadeAbonos) btnPenalidadeAbonos.onclick = function() { ajustarPenalidadeAbonosFicha_(s.matricula, Number(s.penalidadeAbono || 0)); };
  
  const statusBadge = document.getElementById('ficha-dados-status');
  statusBadge.className = "badge";
  if (s.status === 'Ativo') {
    statusBadge.classList.add('badge-ativo');
    statusBadge.innerText = 'ATIVO';
  } else if (s.status === 'Férias') {
    statusBadge.classList.add('badge-ferias');
    statusBadge.innerText = 'FÉRIAS';
  } else if (s.status === 'Abono') {
    statusBadge.classList.add('badge-abono');
    statusBadge.innerText = 'ABONO';
  } else {
    statusBadge.classList.add('badge-inativo');
    statusBadge.innerText = 'INATIVO';
  }
  
  // 3. Preencher Saldo de Férias do cabeçalho
  document.getElementById('ficha-ferias-saldo').innerText = s.saldoHoje + " dias";
  
  // 4. Renderizar os períodos aquisitivos calculados no servidor.
  const gridPeriodos = document.getElementById('ficha-ferias-periodos');
  gridPeriodos.innerHTML = "";
  
  if (Array.isArray(s.periodosFerias) && s.periodosFerias.length > 0) {
    s.periodosFerias.forEach(periodo => {
      const percentualUso = periodo.diasOriginais > 0
        ? Math.round((periodo.diasUsados / periodo.diasOriginais) * 100)
        : 0;
      const futuro = periodo.status === "Em aquisição";
      const usufruido = periodo.status === "Usufruído";
      const badgeClass = futuro ? "badge-abono" : (usufruido ? "badge-inativo" : "badge-ativo");
      const fillClass = usufruido ? "fill-usufruido" : "fill-disponivel";

      gridPeriodos.innerHTML += `
        <div class="period-card">
          <div class="period-header">
            <span class="period-title">${escapeHtml(periodo.referencia)}</span>
            <span class="badge ${badgeClass}">${escapeHtml(periodo.status)}</span>
          </div>
          <div class="period-dates">Liberação: ${escapeHtml(periodo.dataLiberacao)}</div>
          <div class="period-dates">Usados: ${periodo.diasUsados} d | Saldo: ${periodo.saldo} d</div>
          <div class="period-dates">Penalidade: ${Number(periodo.penalidade || 0)} d (30 - penalidade)</div>
          <div class="period-status-bar">
            <div class="period-status-fill ${fillClass}" style="width:${Math.min(100, percentualUso)}% !important"></div>
          </div>
          <div class="period-legend">
            <span>0%</span><span>${percentualUso}% utilizado</span><span>100%</span>
          </div>
          <button type="button" class="btn btn-secondary btn-small" onclick="ajustarPenalidadePeriodoFeriasFicha_('${escapeHtml(s.matricula)}','${escapeHtml(periodo.referencia)}',${Number(periodo.penalidade || 0)})">Ajustar penalidade deste período</button>
        </div>`;
    });
  } else if (s.infoFerias) {
    // Compatibilidade com planilhas antigas que possuíam a fórmula Info_Férias.
    // Processamento do texto estruturado
    // Ex: "[AVISO] ATENÇÃO: 1 Período vencido. | Saldo: 30 dias | Próx (+30): 30/03/2027"
    let partes = s.infoFerias.split('|');
    partes.forEach((p, idx) => {
      let texto = p.trim();
      if (!texto) return;
      
      let cardClass = "";
      let fillClass = "fill-disponivel";
      let statusTexto = "Disponível";
      
      if (texto.toLowerCase().includes("vencido") || texto.toLowerCase().includes("crítico")) {
        cardClass = "style='border-color: rgba(247, 90, 90, 0.4); background-color: rgba(247, 90, 90, 0.02);'";
        fillClass = "fill-vencido";
        statusTexto = "Vencido (Compulsório)";
      } else if (texto.toLowerCase().includes("próx") || texto.toLowerCase().includes("projetado")) {
        cardClass = "";
        fillClass = "fill-usufruido";
        statusTexto = "Em Aquisição";
      }
      
      gridPeriodos.innerHTML += `         <div class="period-card" ${cardClass}>           <div class="period-header">             <span class="period-title">${texto.split(':')[0] || 'Período'}</span>             <span class="badge ${fillClass === 'fill-vencido' ? 'badge-ferias' : 'badge-ativo'}">${statusTexto}</span>           </div>           <div class="period-dates">${texto.includes(':') ? texto.split(':')[1] : texto}</div>           <div class="period-status-bar">             <div class="period-status-fill ${fillClass}"></div>           </div>           <div class="period-legend">             <span>0%</span>             <span>Uso</span>             <span>100%</span>           </div>         </div>       `;
    });
  }
  
  if (gridPeriodos.innerHTML === "") {
    gridPeriodos.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); font-size: 13px;">Nenhum período de férias registrado ou processado.</div>`;
  }
  
  // 5. Carregar Lançamentos/Ausências Históricas no modal
  const tabelaHist = document.getElementById('ficha-historico-tabela');
  tabelaHist.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">Buscando histórico...</td></tr>`;
  
  let elNormaisInit = document.getElementById('ficha-abonadas-normais');
  let elNataliciasInit = document.getElementById('ficha-abonadas-natalicias');
  if (elNormaisInit) elNormaisInit.innerHTML = '<i class="fas fa-circle-notch fa-spin" style="font-size: 16px; color: var(--text-muted);"></i>';
  if (elNataliciasInit) elNataliciasInit.innerHTML = '<i class="fas fa-circle-notch fa-spin" style="font-size: 16px; color: var(--text-muted);"></i>';
  
  if (typeof google !== "undefined" && google.script) {
    backendApi()
      .withSuccessHandler(function(historico) {
        historico = Array.isArray(historico) ? historico : [];
        let anoAtual = new Date().getFullYear();
        let contAbonadasNormais = 0;
        let contAbonadasNatalicias = 0;

        if (historico.length === 0) {
          tabelaHist.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Nenhum lançamento registrado no histórico.</td></tr>`;
        } else {
          let html = "";
          historico.forEach(l => {
            if (!AppState.lancamentos.some(lanc => lanc.linhaPlanilha === l.linhaPlanilha)) {
              AppState.lancamentos.push(l);
            }

            const historicoInativo = /(ANULAD|CANCELAD|EXCLUID|NAO EFETIVAD)/.test(normalizarTextoRep_(l.status || l.tipo));
            if (!historicoInativo) {
              if (l.dataInicio && l.dataInicio.includes(anoAtual)) {
                if (l.tipo.toLowerCase().includes("abonada eleitoral")) {
                } else if (l.tipo.toLowerCase().includes("natalícia") || l.tipo.toLowerCase().includes("natalicia")) {
                  contAbonadasNatalicias += parseInt(l.dias) || 1;
                } else if (l.tipo.toLowerCase().includes("abonada") || l.tipo.toLowerCase().includes("abono")) {
                  contAbonadasNormais += parseInt(l.dias) || 1;
                }
              }
            }

            let statusClass = "badge-neutral";
            let statusText = "Ativo";
            if (historicoInativo) {
              statusClass = "badge-inativo";
              statusText = "Anulado";
            }

            html += `<tr>
              <td>
                <div style="display: flex; gap: 4px; justify-content: center;">
                  <button class="btn-action" onclick="abrirViewLancamento(${l.linhaPlanilha}); fecharModal('modal-ficha-servidor'); return false;" title="Visualizar Lançamento">
                    <span data-lucide="eye" style="width: 14px; height: 14px;"></span>
                  </button>
                  <button class="btn-action" onclick="abrirModalQuick1Doc(${l.linhaPlanilha}, '${escapeHtml(s.nome)}', '${escapeHtml(l.idoc || '')}'); fecharModal('modal-ficha-servidor'); return false;" title="Preencher 1Doc Rápido" style="color: var(--brand-primary);">
                    <span data-lucide="file-signature" style="width: 14px; height: 14px;"></span>
                  </button>
                </div>
              </td>
              <td><strong>${escapeHtml(l.idoc)}</strong></td>
              <td>${escapeHtml(l.tipo)}</td>
              <td>${escapeHtml(l.dataInicio)}</td>
              <td style="text-align: center;">${escapeHtml(l.dias || l.qtdHoras || '-')}</td>
              <td><span class="badge ${statusClass}">${escapeHtml(statusText)}</span></td>
            </tr>`;

        }

        let elNormais = document.getElementById('ficha-abonadas-normais');
        let elNatalicias = document.getElementById('ficha-abonadas-natalicias');
        const limiteAbonadasFicha = Number.isFinite(Number(s.limiteAbonadas))
          ? Number(s.limiteAbonadas)

        if(elNatalicias) elNatalicias.innerHTML = contAbonadasNatalicias > 0

        renderizarIcones();
      })
      .withFailureHandler(function(erro) {
        console.error('Erro ao carregar histórico:', erro);
        tabelaHist.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--danger);">Erro ao buscar histórico: ${mensagemErro(erro)}</td></tr>`;
        let elNormais = document.getElementById('ficha-abonadas-normais');
        let elNatalicias = document.getElementById('ficha-abonadas-natalicias');
        if(elNormais) elNormais.innerText = '?';
        if(elNatalicias) elNatalicias.innerText = '?';
      })
      .obterHistoricoServidor(matricula);
  } else {
    tabelaHist.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Sem conexão com o Google Sheets (modo local).</td></tr>`;

  abrirModal('modal-ficha-servidor');
}

/**

 */
function carregarListaLancamentos() {
  filtrarTabelaLancamentos();
}

/**
 * Renderiza linhas da tabela de Lançamentos
 */
function formatarQuantidadeLancamento(lancamento) {
  const diasGozo = parseInt(lancamento && lancamento.dias, 10) || 0;
  const diasPecunia = parseInt(lancamento && lancamento.diasPecunia, 10) || 0;
  if (diasPecunia > 0) return `${diasGozo} gozo + ${diasPecunia} pecúnia`;
  if (diasGozo > 0) return `${diasGozo} dias`;
  return escapeHtml((lancamento && lancamento.qtdHoras) || '-');
}

function renderizarTabelaLancamentos(listaFiltrada, mantemPagina = false) {
  const listaOriginal = Array.isArray(listaFiltrada)
    ? listaFiltrada
    : (Array.isArray(AppState.lancamentos) ? AppState.lancamentos : []);
  const tbody = document.getElementById('tabela-lancamentos-body');
  
  const estado = AppState.paginacao.lancamentos;
  estado.listaAtual = listaOriginal;
  if (!mantemPagina) estado.paginaAtual = 1;
  const totalItens = estado.listaAtual.length;
  estado.paginaAtual = Math.min(estado.paginaAtual, Math.max(1, Math.ceil(totalItens / estado.itensPorPagina)));
  
  if (totalItens === 0) {
    tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; color: var(--text-secondary);">Nenhum lançamento encontrado.</td></tr>`;
    renderizarControlesPaginacao('paginacao-lancamentos', 'lancamentos', 0);
    return;
  }
  
  const start = (estado.paginaAtual - 1) * estado.itensPorPagina;
  const lancamentos = estado.listaAtual.slice(start, start + estado.itensPorPagina);
  
  let html = "";
  lancamentos.forEach(l => {
    let badgeClass = "badge-ativo";
    if (/(ANULAD|CANCELAD|EXCLUID|NAO EFETIVAD)/.test(normalizarTextoRep_(l.status || l.tipo))) {
      badgeClass = "badge-inativo";
    }
    
    // Verifica se possui anexos vinculados
    const possuiAnexos = l.anexo1 || l.anexo2 || l.anexo3;
    let dataShow = l.dataInicio;
    if (l.tipo === "Autorização de Horas Extras" && !dataShow) {
      if (l.mes && l.ano) dataShow = `${l.mes}/${l.ano}`;
      else if (l.mes) dataShow = l.mes;
      else if (l.ano) dataShow = l.ano;
      else dataShow = "-";
    }
    
    html += `<tr>
      <td>
        <div style="display: flex; gap: 4px; justify-content: center;">
          <button class="btn-action" data-action="view-lanc" data-linha="${l.linhaPlanilha}" title="Visualizar Lançamento">
            <span data-lucide="eye" style="width: 14px; height: 14px;"></span>
          </button>
          ${(!l.idoc || l.idoc.trim() === "") ? `
          <button class="btn-action" data-action="quick-1doc" data-linha="${l.linhaPlanilha}" data-nome="${escapeHtml(l.nome)}" data-idoc="${escapeHtml(l.idoc || '')}" title="Preencher 1Doc Rápido" style="color: var(--brand-primary);">
            <span data-lucide="file-signature" style="width: 14px; height: 14px;"></span>
          </button>` : ''}
        </div>
      </td>
      <td><strong>${escapeHtml(l.idoc)}</strong></td>
      <td>${escapeHtml(l.dataSolicitacao)}</td>
      <td>${escapeHtml(l.tipo)}</td>
      <td>${escapeHtml(l.nome)} <br><small>(${escapeHtml(l.matricula)})</small></td>
      <td>${escapeHtml(dataShow)}</td>
      <td style="text-align: center;">${formatarQuantidadeLancamento(l)}</td>
      <td><span class="badge ${badgeClass}">${escapeHtml(l.status)}</span></td>
      <td>
        <div class="action-buttons" style="justify-content: flex-end;">
          ${possuiAnexos ? `<button class="btn-action" data-action="ver-anexos" data-a1="${escapeHtml(l.anexo1)}" data-a2="${escapeHtml(l.anexo2)}" data-a3="${escapeHtml(l.anexo3)}" title="Visualizar Anexos"><span data-lucide="paperclip" style="width: 14px; height: 14px;"></span></button>` : ''}
          <button class="btn-action" data-action="editar-lanc" data-linha="${l.linhaPlanilha}" title="Editar Tudo">
            <span data-lucide="edit-2" style="width: 14px; height: 14px;"></span>
          </button>
          ${!/(ANULAD|CANCELAD|EXCLUID|NAO EFETIVAD)/.test(normalizarTextoRep_(l.status || l.tipo)) ? `<button class="btn-action" data-action="excluir-lanc" data-linha="${l.linhaPlanilha}" title="Excluir lançamento" style="color: var(--danger);">
            <span data-lucide="trash-2" style="width: 14px; height: 14px;"></span>
          </button>` : ''}
        </div>
      </td>
    </tr>`;
  });

  tbody.innerHTML = html;
  tbody.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      const action = this.dataset.action;
      if (action === 'ver-anexos') visualizarAnexos(this.dataset.a1, this.dataset.a2, this.dataset.a3);
      else if (action === 'editar-lanc') abrirModalLancamento(parseInt(this.dataset.linha));
      else if (action === 'excluir-lanc') excluirLancamentoInterface_(parseInt(this.dataset.linha));
      else if (action === 'view-lanc') abrirViewLancamento(parseInt(this.dataset.linha));
      else if (action === 'quick-1doc') abrirModalQuick1Doc(parseInt(this.dataset.linha), this.dataset.nome, this.dataset.idoc);
    });
  });
  renderizarIcones();
}

async function excluirLancamentoInterface_(linhaPlanilha) {
  const lancamento = (AppState.lancamentos || []).find(function(item) { return Number(item.linhaPlanilha) === Number(linhaPlanilha); });
  if (!lancamento) return mostrarToast('Lançamento não encontrado para exclusão.', 'error');
  const confirmou = await abrirConfirm('Excluir este lançamento? Ele será marcado como anulado, continuará no histórico e deixará de bloquear férias, saldos e novos períodos.');
  if (!confirmou) return;
  try {
    exibirLoader(true, 'Excluindo lançamento com segurança...');
    await chamarBackendPromessa_('excluirLancamento', [linhaPlanilha]);
    const lista = await chamarBackendPromessa_('obterListaLancamentos', []);
    AppState.lancamentos = Array.isArray(lista) ? lista : [];
    filtrarTabelaLancamentos();
    mostrarToast('Lançamento excluído com segurança e mantido no histórico como anulado.', 'success');
  } catch (erro) {
    mostrarToast('Não foi possível excluir o lançamento: ' + mensagemErro(erro), 'error');
  } finally {
    exibirLoader(false);
  }
}

/**
 * Filtra a tabela de lançamentos de RH em tempo real
 */
function filtrarTabelaLancamentos() {
  const busca = normalizarTextoBusca(document.getElementById('filtro-busca-lancamento').value);
  const tipo = document.getElementById('filtro-tipo-lancamento').value;
  const status = document.getElementById('filtro-status-lancamento').value;
  
  const filtrados = AppState.lancamentos.filter(l => {
    const bateBusca = correspondeBusca(busca, l.nome, l.matricula, l.idoc);
    const bateTipo = !tipo || l.tipo === tipo;
    
    let bateStatus = false;
    if (!status) {
      bateStatus = true;
    } else if (status === "SEM 1DOC") {
      let ehSemDoc = (!l.idoc || l.idoc.trim() === "");
      if (ehSemDoc) {
        let diffDias = 0;
        if (l.dataSolicitacao) {
          const partes = l.dataSolicitacao.split('/');
          if (partes.length === 3) {
            const dataLanc = new Date(partes[2], partes[1] - 1, partes[0]);
            diffDias = (new Date().getTime() - dataLanc.getTime()) / (1000 * 3600 * 24);
          }
        }
        bateStatus = diffDias <= 365;
      } else {
        bateStatus = false;
      }
    } else {
      bateStatus = l.status === status;
    }
    
    return bateBusca && bateTipo && bateStatus;
  });
  
  const estado = AppState.paginacao.lancamentos;
  const assinatura = JSON.stringify([busca, tipo, status]);
  const manterPagina = estado.filtroAssinatura === assinatura;
  estado.filtroAssinatura = assinatura;
  renderizarTabelaLancamentos(filtrados, manterPagina);
}

/**
 * Ajusta dinamicamente a visibilidade dos campos do formulário com base no tipo
 */
function ajustarCamposFormularioLancamento() {
  const tipo = document.getElementById('lanc-tipo').value;
  
  const blocoFerias = document.getElementById('bloco-ferias');
  const blocoFalta = document.getElementById('bloco-falta');
  const blocoHoras = document.getElementById('bloco-horas');
  const blocoEleitoral = document.getElementById('bloco-abono-eleitoral');
  const blocoDiasPecunia = document.getElementById('bloco-dias-pecunia');
  const labelDias = document.getElementById('lanc-dias-label');
  
  // Esconde todos inicialmente
  blocoFerias.style.display = "none";
  blocoFalta.style.display = "none";
  blocoHoras.style.display = "none";
  if (blocoEleitoral) blocoEleitoral.style.display = "none";
  blocoDiasPecunia.style.display = "none";
  labelDias.textContent = "Quantidade de Dias *";
  
  // Força remoção de obrigatoriedade temporária e desabilita os inputs invisíveis
  const inputs = ['lanc-data-inicio', 'lanc-dias', 'lanc-dias-pecunia', 'lanc-data-falta', 'lanc-qtd-horas', 'lanc-pleito-eleitoral', 'lanc-movimento-eleitoral', 'lanc-quantidade-eleitoral', 'lanc-data-eleitoral-nova', 'lanc-datas-eleitoral'];
  inputs.forEach(id => {
    const input = document.getElementById(id);
    if (!input) return;
    input.required = false;
    input.disabled = true;
  });
  
  if (tipo === "Férias" || tipo === "Férias (1/3 Pecúnia)" || tipo === "Licença Prêmio" || tipo === "Atestado") {
    blocoFerias.style.display = "flex";
    document.getElementById('lanc-data-inicio').disabled = false;
    document.getElementById('lanc-data-inicio').required = true;
    document.getElementById('lanc-dias').disabled = false;
    document.getElementById('lanc-dias').required = true;
    if (tipo === "Atestado") labelDias.textContent = "Dias de afastamento *";
    if (tipo === "Férias (1/3 Pecúnia)") {
      blocoDiasPecunia.style.display = "block";
      labelDias.textContent = "Dias de Gozo *";
      document.getElementById('lanc-dias-pecunia').disabled = false;
      document.getElementById('lanc-dias-pecunia').required = true;
    }
  } else if (tipo === "Abonada Eleitoral") {
    if (blocoEleitoral) blocoEleitoral.style.display = 'block';
    ['lanc-pleito-eleitoral', 'lanc-movimento-eleitoral', 'lanc-quantidade-eleitoral', 'lanc-data-eleitoral-nova', 'lanc-datas-eleitoral'].forEach(function(id) { const input = document.getElementById(id); if (input) input.disabled = false; });
    ajustarCamposAbonoEleitoral_();
  } else if (tipo === "Autorização de Horas Extras") {
    blocoHoras.style.display = "block";
    document.getElementById('lanc-qtd-horas').disabled = false;
    document.getElementById('lanc-qtd-horas').required = true;
  } else if (tipo === "Avaliação do Estágio Probatório") {
    // Não requer data de ausência
  } else {
    // Abonadas, Não Efetivados, etc
    blocoFalta.style.display = "block";
    document.getElementById('lanc-data-falta').disabled = false;
    document.getElementById('lanc-data-falta').required = true;
  }
  
  sugerirDespacho();
}

/**
 * Sugere um texto para o campo Despacho baseado no servidor e tipo selecionados
 */
function sugerirDespacho() {
  const tipo = document.getElementById('lanc-tipo').value;
  const matricula = document.getElementById('lanc-matricula').value;
  const campoDespacho = document.getElementById('lanc-despacho');
  
  // Só preenche automaticamente se estiver vazio ou se foi preenchido automaticamente antes
  if (campoDespacho.value !== "" && !campoDespacho.dataset.autoFilled) {
    return;
  }

  if (!matricula) return;
  
  const servidor = AppState.servidores.find(s => s.matricula === matricula);
  if (!servidor) return;

  let texto = "";
  
  if (tipo.toLowerCase().includes("férias") || tipo.toLowerCase().includes("ferias")) {
    const diasGozo = parseInt(document.getElementById('lanc-dias').value) || 0;
    const diasPecunia = tipo === "Férias (1/3 Pecúnia)"
      ? (parseInt(document.getElementById('lanc-dias-pecunia').value) || 0)
      : 0;
    const diasInput = diasGozo + diasPecunia;
    const saldo = parseInt(servidor.saldoHoje) || 0;
    const restante = Math.max(0, saldo - diasInput);
    texto = diasPecunia > 0
      ? `Possuía ${saldo} dias disponíveis. Solicitou ${diasGozo} dias de gozo e ${diasPecunia} dias em pecúnia, totalizando ${diasInput} dias. Restam ${restante} dias.`
      : `Possuía ${saldo} dias disponíveis. Solicitou ${diasInput} dias. Restam ${restante} dias.`;
    
  } else if ((tipo.toLowerCase().includes("abonada") || tipo.toLowerCase().includes("abono")) && !tipo.toLowerCase().includes("natal") && !tipo.toLowerCase().includes("eleitor")) {
    const usados = parseInt(servidor.abonosUsados) || 0;
    const novoUsado = usados + 1;
    const limite = Number.isFinite(Number(servidor.limiteAbonadas))
      ? Number(servidor.limiteAbonadas)
      : Math.max(0, 5 - Number(servidor.penalidadeAbono || 0));
    const restante = Math.max(0, limite - novoUsado);
    texto = `Possuía direito a ${limite} abonadas. Solicitou a ${novoUsado}ª abonada. Restam ${restante}.`;
  } else if (tipo === "Atestado") {
    const dias = parseInt(document.getElementById('lanc-dias').value, 10) || 1;
    texto = `Afastamento por atestado registrado por ${dias} dia${dias === 1 ? '' : 's'}.`;
  } else if (tipo === "Autorização de Horas Extras") {
    const qtdHoras = document.getElementById('lanc-qtd-horas').value || "0";
    const mes = document.getElementById('lanc-mes-he').value;
    const ano = document.getElementById('lanc-ano-he').value;
    
    let mesAnoTxt = "";
    if (mes && ano) mesAnoTxt = ` referentes a ${mes}/${ano}`;
    else if (mes) mesAnoTxt = ` referentes a ${mes}`;
    else if (ano) mesAnoTxt = ` referentes ao ano ${ano}`;
    
    texto = `Autorização para compensação ou pagamento de ${qtdHoras} horas extras${mesAnoTxt} registrada.`;
  }
  
  if (texto) {
    campoDespacho.value = texto;
    campoDespacho.dataset.autoFilled = "true";
  } else if (campoDespacho.dataset.autoFilled) {
    campoDespacho.value = "";
    delete campoDespacho.dataset.autoFilled;
  }
}

/**
 * Executa busca de autocomplete para selecionar o servidor
 */
function buscarServidorAutocomplete() {
  const input = document.getElementById('lanc-busca-servidor');
  const listagem = document.getElementById('autocomplete-lista');
  const txtMatricula = document.getElementById('lanc-matricula');
  const painelInfo = document.getElementById('lanc-servidor-info');
  
  const termo = normalizarTextoBusca(input.value);
  txtMatricula.value = ""; // Limpa a matrícula até selecionar
  painelInfo.style.display = "none";
  
  if (!termo) {
    listagem.style.display = "none";
    return;
  }
  
  // Filtra servidores ativos apenas
  const sugestoes = AppState.servidores.filter(s => 
    s.status !== 'Inativo' && correspondeBusca(termo, s.nome, s.matricula)
  ).slice(0, 5); // Limita em 5 sugestões
  
  if (sugestoes.length === 0) {
    listagem.innerHTML = `<div style="padding: 10px; color: var(--text-muted); font-size: 13px;">Nenhum servidor ativo encontrado.</div>`;
    listagem.style.display = "block";
    return;
  }
  
  let html = "";
  sugestoes.forEach(s => {
    html += `<div style="padding: 10px; cursor: pointer; border-bottom: 1px solid var(--border-color); font-size: 13px;" onclick="selecionarServidorAutocomplete('${s.matricula}', '${s.nome}', '${s.cargo}', '${s.lotacao}', '${s.saldoHoje}', '${s.abonosUsados || 0}')">       <strong>${s.nome}</strong> (Matrícula: ${s.matricula})     </div>`;
  });
  
  listagem.innerHTML = html;
  listagem.style.display = "block";
}

/**
 * Preenche os dados do servidor selecionado no autocomplete
 */
function selecionarServidorAutocomplete(matricula, nome, cargo, lotacao, saldo, abonosUsados) {
  document.getElementById('lanc-busca-servidor').value = nome;
  document.getElementById('lanc-matricula').value = matricula;
  document.getElementById('autocomplete-lista').style.display = "none";
  
  // Exibe informações de auxílio do servidor
  document.getElementById('info-serv-cargo').innerText = cargo || 'Não informado';
  document.getElementById('info-serv-lotacao').innerText = lotacao || 'Não informada';
  document.getElementById('info-serv-saldo').innerText = saldo + ' dias';
  
  const servidorSelecionado = (AppState.servidores || []).find(s => String(s.matricula) === String(matricula));
  const abonos = parseInt(servidorSelecionado?.abonosUsados ?? abonosUsados, 10) || 0;
  const limite = Number.isFinite(Number(servidorSelecionado?.limiteAbonadas))
    ? Number(servidorSelecionado.limiteAbonadas)
    : Math.max(0, 5 - Number(servidorSelecionado?.penalidadeAbono || 0));
  document.getElementById('info-serv-abonadas').innerText = `${abonos}/${limite}`;
  
  document.getElementById('lanc-servidor-info').style.display = "block";
  
  sugerirDespacho();
}

/**
 * Abre o modal de lançamento limpo (criação) ou carregado (edição)
 */
function abrirModalLancamento(linhaPlanilha) {
  if (typeof google !== "undefined" && google.script && (!AppState.servidores || AppState.servidores.length === 0)) {
    exibirLoader(true);
    backendApi()
      .withSuccessHandler(function(servidores) {
        AppState.servidores = Array.isArray(servidores) ? servidores : [];
        exibirLoader(false);
        abrirModalLancamento(linhaPlanilha); // Tenta novamente após carregar
      })
      .withFailureHandler(function(err) {
        exibirLoader(false);
        mostrarToast("Erro ao carregar lista de servidores: " + mensagemErro(err), 'error');
      })
      .obterListaServidores();
    return;
  }

  const form = document.getElementById('form-lancamento');
  form.reset();
  if (typeof renderizarDatasAbonoEleitoral_ === 'function') renderizarDatasAbonoEleitoral_();
  
  // Certifica de esconder informações de autocomplete anteriores
  document.getElementById('lanc-servidor-info').style.display = "none";
  document.getElementById('autocomplete-lista').style.display = "none";
  document.getElementById('anexos-existentes').style.display = "none";
  
  // Limpa arquivos dos inputs
  document.getElementById('lanc-file-1').value = "";
  document.getElementById('lanc-file-2').value = "";
  document.getElementById('lanc-file-3').value = "";
  atualizarVisualDropzoneAnexo(document.getElementById('lanc-file-1'));
  atualizarVisualDropzoneAnexo(document.getElementById('lanc-file-2'));
  atualizarVisualDropzoneAnexo(document.getElementById('lanc-file-3'));
  
  const titulo = document.getElementById('modal-lancamento-titulo');
  const buscaServidorInput = document.getElementById('lanc-busca-servidor');
  const inputLinha = document.getElementById('lanc-linha');
  
  if (linhaPlanilha) {
    // MODO EDIÇÃO
    titulo.innerText = "Editar Lançamento";
    inputLinha.value = linhaPlanilha;
    buscaServidorInput.disabled = true; // Não altera o servidor do lançamento cadastrado
    
    const l = AppState.lancamentos.find(lanc => lanc.linhaPlanilha === linhaPlanilha);
    if (!l) {
      if (typeof google !== "undefined" && google.script) {
        exibirLoader(true);
        backendApi()
          .withSuccessHandler(function(lancamentos) {
            AppState.lancamentos = Array.isArray(lancamentos) ? lancamentos : [];
            exibirLoader(false);
            abrirModalLancamento(linhaPlanilha);
          })
          .withFailureHandler(function(err) {
            exibirLoader(false);
            mostrarToast("Erro ao carregar detalhes do lançamento: " + mensagemErro(err), 'error');
          })
          .obterListaLancamentos();
      } else {
        console.warn("Lançamento não encontrado em modo local: ", linhaPlanilha);
      }
      return;
    }
    const statusLancamento = normalizarTextoRep_(l.status || '');
    if (/(ANULAD|CANCELAD|EXCLUID|NAO EFETIVAD)/.test(statusLancamento)) {
      titulo.innerText = "Corrigir Lançamento Anulado";
      mostrarToast('Este lançamento está anulado. Ao salvar a correção, ele será reativado automaticamente.', 'info');
    }
    
    document.getElementById('lanc-tipo').value = l.tipo;
      document.getElementById('lanc-idoc').value = l.idoc;
      document.getElementById('lanc-busca-servidor').value = l.nome;
      document.getElementById('lanc-matricula').value = l.matricula;
      document.getElementById('lanc-despacho').value = l.despacho;
      document.getElementById('lanc-observacao').value = l.observacao;
      document.getElementById('lanc-qtd-horas').value = l.qtdHoras;
      document.getElementById('lanc-mes-he').value = (l.mes && l.mes.charAt(0).toUpperCase() + l.mes.slice(1).toLowerCase()) || "";
      document.getElementById('lanc-ano-he').value = l.ano || "";
      document.getElementById('lanc-dias').value = l.dias;
      document.getElementById('lanc-dias-pecunia').value = l.diasPecunia || 0;
      
      // Parse de Data Solicitação
      if (l.dataSolicitacao) {
        let partes = l.dataSolicitacao.split('/');
        if (partes.length === 3) {
          document.getElementById('lanc-data-solicitacao').value = `${partes[2]}-${partes[1]}-${partes[0]}`;
        }
      }
      
      // Parse de Data Início / Data Falta
      if (l.dataInicio) {
        let partes = l.dataInicio.split('/');
        if (partes.length === 3) {
          const dataFormatadaInput = `${partes[2]}-${partes[1]}-${partes[0]}`;
          document.getElementById('lanc-data-inicio').value = dataFormatadaInput;
          document.getElementById('lanc-data-falta').value = dataFormatadaInput;
        }
      }
      
      // Renderizar anexos existentes no topo
      if (l.anexo1 || l.anexo2 || l.anexo3) {
        const listaExistente = document.getElementById('lista-anexos-existentes');
        exibirAnexosNaLista(listaExistente, [l.anexo1, l.anexo2, l.anexo3], true);
        document.getElementById('anexos-existentes').style.display = "block";
      }
  } else {
    // MODO CRIAÇÃO
    titulo.innerText = "Cadastrar Lançamento de Documento";
    inputLinha.value = "";
    buscaServidorInput.disabled = false;
    document.getElementById('lanc-data-solicitacao').value = new Date().toISOString().split('T')[0];
  }
  
  ajustarCamposFormularioLancamento();
  if (typeof inicializarWizard === 'function') inicializarWizard();
  abrirModal('modal-lancamento');
}

/**
 * Função utilitária para renderizar anexos e resolver caminhos relativos do AppSheet (Drive)
 */
function exibirAnexosNaLista(listaElemento, anexos, modoEdicao) {
  listaElemento.innerHTML = "";
  
  const caminhosValidos = anexos.map(a => String(a || "").trim()).filter(a => a !== "" && a !== "undefined");
  if (caminhosValidos.length === 0) {
    if (!modoEdicao) {
      listaElemento.innerHTML = '<li style="color: var(--text-muted); font-size: 13px;">Nenhum anexo válido encontrado.</li>';
    }
    return;
  }
  
  caminhosValidos.forEach((caminho, index) => {
    const rotulo = `Documento Anexo ${index + 1}`;
    const li = document.createElement('li');
    li.style.marginBottom = "8px";
    
    const a = document.createElement('a');
    a.href = "javascript:void(0)";
    a.onclick = () => baixarAnexoSeguro(caminho, rotulo);
    
    if (modoEdicao) {
      a.style.color = 'var(--primary-color)';
      a.style.textDecoration = 'none';
      a.style.fontWeight = '500';
      a.innerHTML = `<span data-lucide="download" style="width:14px;height:14px;margin-right:4px;vertical-align:middle;"></span>${rotulo}`;
    } else {
      a.className = 'btn btn-secondary';
      a.style.cssText = 'width: 100%; text-align: left; display:flex; align-items:center; gap:8px;';
      a.innerHTML = `<span data-lucide="download" style="width:16px;height:16px;"></span>${rotulo}`;
    }
    
    li.appendChild(a);
    listaElemento.appendChild(li);
  });
}

function baixarAnexoSeguro(caminho, rotulo) {
  exibirLoader(true);
  mostrarToast(`Baixando ${rotulo}...`, "info");
  
  backendApi()
    .withSuccessHandler(function(res) {
      exibirLoader(false);
      try {
        const byteCharacters = atob(res.b64);
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        const blob = new Blob([byteArray], {type: res.mimeType});
        const url = window.URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = res.nome;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
        mostrarToast("Download concluído com sucesso!", "success");
      } catch (err) {
        mostrarToast("Erro ao processar o arquivo baixado.", "error");
      }
    })
    .withFailureHandler(function(e) {
      exibirLoader(false);
      mostrarToast(e.message || "Erro ao baixar o anexo.", "error");
    })
    .obterAnexoBase64(caminho);
}
