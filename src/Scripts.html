<script>
/**
 * Lógica do Cliente (Interface do Usuário)
 * RH Central de Documentos v2.1 — Sync Otimista
 */

const AppState = {
  usuarioLogado: { email: "", nome: "", papel: "Consulta" },
  servidores: [],
  lancamentos: [],
  protocolos: [],
  dashboard: {},
  insightEntidade: null,
  briefingDiarioEntidade: null,
  operacoesPendentes: [],
  mensagemEntidadeOculta: '',
  conviteEntidadePendente: false,
  dadosCompletosCarregados: false,
  cacheRestaurado: false,
  paginacao: {
    servidores: { paginaAtual: 1, itensPorPagina: 30, listaAtual: [] },
    lancamentos: { paginaAtual: 1, itensPorPagina: 30, listaAtual: [] },
    protocolos: { paginaAtual: 1, itensPorPagina: 30, listaAtual: [] }
  }
};

let currentView = 'dashboard';

function gerarUuidSeguroCliente_() {
  if (!window.crypto) throw new Error('Este navegador nao oferece geracao segura de identificadores.');
  if (typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
  if (typeof window.crypto.getRandomValues !== 'function') {
    throw new Error('Este navegador nao oferece geracao segura de identificadores.');
  }
  const bytes = new Uint8Array(16);
  window.crypto.getRandomValues(bytes);
  bytes[6] = (bytes[6] & 0x0f) | 0x40;
  bytes[8] = (bytes[8] & 0x3f) | 0x80;
  const hex = Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
  return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
}

function obterChaveFilaSincronizacao_() {
  try {
    const usuario = JSON.parse(localStorage.getItem('rh_user') || '{}');
    const email = String(usuario.email || '').toLowerCase().trim();
    return email ? 'rh_sync_queue_v2_' + encodeURIComponent(email) : '';
  } catch (e) {
    return '';
  }
}

// ==========================================
// SYNC QUEUE — Fila de operações pendentes
// ==========================================
const SyncQueue = {
  fila: [],
  processando: false,
  MAX_RETRIES: 5,

  enfileirar(tipo, funcaoNome, args, descricao) {
    const operacaoId = args && args[0] && args[0].operacaoId ? String(args[0].operacaoId) : "";
    if (operacaoId) {
      const existente = this.fila.find(item => item.operacaoId === operacaoId);
      if (existente) return existente.id;
    }
    const item = {
      id: gerarUuidSeguroCliente_(),
      tipo: tipo,
      funcaoNome: funcaoNome,
      args: args,
      descricao: descricao || tipo,
      tentativas: 0,
      timestamp: new Date().toISOString(),
      operacaoId: operacaoId
    };
    this.fila.push(item);
    this.persistir();
    this.atualizarUI();
    this.processar();
    return item.id;
  },

  processar() {
    if (this.processando || this.fila.length === 0) return;
    if (!navigator.onLine) {
      this.atualizarUI();
      return;
    }
    if (typeof google === 'undefined' || !google.script) return;

    this.processando = true;
    const item = this.fila[0];
    item.tentativas++;
    this.atualizarUI();

    const syncBtn = document.getElementById('btn-sync-icon');
    if (syncBtn) syncBtn.classList.add('spinning');
    
    atualizarTextoSync(`Gravando: ${item.descricao || item.funcaoNome}...`);

    const self = this;
    backendApi()
      .withSuccessHandler(function(resultado) {
        self.fila.shift(); // Remove o primeiro (processado)
        self.processando = false;
        self.persistir();
        self.atualizarUI();
        const currBtn = document.getElementById('btn-sync-icon');
        if (currBtn && self.fila.length === 0) currBtn.classList.remove('spinning');
        
        atualizarTextoSync("Operação salva!", true, 'check');

        // Cadastros de servidor são auditados no backend durante a gravação.
        // Consulta imediatamente o novo parecer, sem aguardar o polling de 10 minutos.
        if (item.tipo === 'salvar_lancamento') {
          animarEntidadeOperacao_(item.args && item.args[0] && item.args[0].linhaPlanilha ? 'alteracao' : 'lancamento');
          removerOperacaoPendenteEstado_(item.operacaoId);
          setTimeout(atualizarLeiturasEntidadeAposMudanca_, 1200);
        } else if (item.tipo === 'salvar_servidor') {
          const matriculaSalva = String(item.args && item.args[0] && item.args[0].matricula || '');
          const jaExistia = (AppState.servidores || []).some(function(servidor) {
            return String(servidor.matricula || '') === matriculaSalva;
          });
          animarEntidadeOperacao_(jaExistia ? 'alteracao' : 'lancamento');
          setTimeout(atualizarLeiturasEntidadeAposMudanca_, 1200);
        }
        
        // Processa o próximo da fila
        if (self.fila.length > 0) {
          setTimeout(() => self.processar(), 500);
        } else {
          // Fila vazia: sincroniza dados frescos do servidor em background e atualiza a view atual
          sincronizarEmSegundoPlano(currentView);
        }
      })
      .withFailureHandler(function(erro) {
        self.processando = false;
        const detalheErro = mensagemErro(erro);
        const erroTemporario = /sistema ocupado|tente novamente|temporari|timeout|tempo limite|network|rede|service unavailable|internal error|lock/i.test(detalheErro);

        if (item.operacaoId) {
          backendApi().registrarFalhaOperacaoPendente(item.operacaoId, detalheErro);
        }

        if (!erroTemporario || item.tentativas >= self.MAX_RETRIES) {
          const falhou = self.fila.shift();
          mostrarToast(`${falhou.descricao}: ${detalheErro}`, 'error');
          atualizarTextoSync(`Falhou: ${falhou.descricao}`, true, 'warning');
          animarEntidadeOperacao_('falha');
          setTimeout(() => carregarOperacoesPendentesServidor(false), 500);
          setTimeout(() => { if(!self.processando) atualizarTextoSync("", false); }, 5000);
        } else {
          const delay = item.tentativas * 5000; // 5s, 10s, 15s
          mostrarToast(`Falha temporária. Nova tentativa de ${item.descricao} em ${delay/1000}s...`, 'warning');
          atualizarTextoSync(`Nova tentativa em ${delay/1000}s...`, true, 'warning');
          setTimeout(() => self.processar(), delay);
        }
        self.persistir();
        self.atualizarUI();
        const currBtn = document.getElementById('btn-sync-icon');
        if (currBtn) currBtn.classList.remove('spinning');
      })
      [item.funcaoNome](...item.args);
  },

  persistir() {
    try {
      const chave = obterChaveFilaSincronizacao_();
      if (chave) localStorage.setItem(chave, JSON.stringify(this.fila));
      localStorage.removeItem('rh_sync_queue');
    } catch(e) { console.warn('Erro ao persistir fila:', e); }
  },

  restaurar() {
    try {
      const chave = obterChaveFilaSincronizacao_();
      localStorage.removeItem('rh_sync_queue');
      this.fila = [];
      if (chave) {
        const raw = localStorage.getItem(chave);
        if (raw) this.fila = JSON.parse(raw);
        if (this.fila.length > 0) {
          mostrarToast(`${this.fila.length} operação(ões) pendente(s) encontrada(s). Sincronizando...`, 'info');
          setTimeout(() => this.processar(), 2000);
        }
      }
    } catch(e) { this.fila = []; }
  },

  atualizarUI() {
    const barra = document.getElementById('sync-status-bar');
    if (!barra) return;
    barra.onclick = null;
    barra.style.cursor = '';
    const online = navigator.onLine;
    const pendentes = this.fila.length;

    if (!online) {
      barra.className = 'sync-bar sync-offline';
      barra.innerHTML = '<span data-lucide="wifi-off" style="width:12px;height:12px;"></span> Offline — alterações serão salvas ao reconectar';
      barra.style.display = 'flex';
      atualizarTextoSync("Offline (aguardando rede)", true, 'offline');
    } else if (this.processando) {
      barra.className = 'sync-bar sync-busy';
      barra.innerHTML = '<span class="sync-spinner"></span> Sincronizando ' + (pendentes) + ' operação(ões)...';
      barra.style.display = 'flex';
    } else if (pendentes > 0) {
      barra.className = 'sync-bar sync-pending';
      barra.innerHTML = '<span data-lucide="alert-circle" style="width:12px;height:12px;"></span> ' + pendentes + ' operação(ões) pendente(s)';
      barra.style.display = 'flex';
      atualizarTextoSync(`${pendentes} alteração(ões) pendente(s)...`, true, 'warning');
    } else {
      const pendentesServidor = (AppState.operacoesPendentes || []).length;
      if (pendentesServidor > 0) {
        barra.className = 'sync-bar sync-pending';
        barra.innerHTML = '<span data-lucide="shield-alert" style="width:12px;height:12px;"></span> ' + pendentesServidor + ' operação(ões) preservada(s) — clique para revisar';
        barra.style.display = 'flex';
        barra.style.cursor = 'pointer';
        barra.onclick = abrirModalFilaSincronizacao;
      } else {
        barra.style.display = 'none';
        barra.onclick = null;
      }
      atualizarTextoSync("", false);
    }
    renderizarIcones();
  }
};

function gerarIdOperacaoCliente_() {
  return gerarUuidSeguroCliente_();
}

function chamarBackendPromessa_(funcaoNome, args) {
  return new Promise((resolve, reject) => {
    backendApi()
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      [funcaoNome](...(args || []));
  });
}

function ehErroTemporarioConcorrencia_(erro) {
  const texto = mensagemErro(erro).toLowerCase();
  return /tempo limite do bloqueio|manteve o bloqueio|sistema ocupado|tente novamente|temporari|timeout|lock|service unavailable|internal error|erro interno/.test(texto);
}

/**
 * Repete automaticamente chamadas curtas que falharam apenas porque outro
 * processo estava escrevendo na planilha. O botão permanece travado durante
 * todo o ciclo, portanto um único clique é suficiente.
 */
async function chamarBackendComRetryTemporario_(funcaoNome, args, descricao) {
  const atrasos = [1500, 3000, 6000, 10000];
  let ultimoErro = null;

  for (let tentativa = 0; tentativa <= atrasos.length; tentativa++) {
    try {
      return await chamarBackendPromessa_(funcaoNome, args);
    } catch (erro) {
      ultimoErro = erro;
      if (!ehErroTemporarioConcorrencia_(erro) || tentativa >= atrasos.length) throw erro;

      const espera = atrasos[tentativa];
      const numeroProximaTentativa = tentativa + 2;
      mostrarToast(`${descricao || 'Sistema ocupado'}. Nova tentativa automática ${numeroProximaTentativa}/${atrasos.length + 1} em ${espera / 1000}s...`, 'warning');
      atualizarTextoSync(`Aguardando para tentar novamente em ${espera / 1000}s...`, true, 'warning');
      await new Promise(resolve => setTimeout(resolve, espera));
    }
  }

  throw ultimoErro || new Error('Não foi possível concluir a operação.');
}

function removerOperacaoPendenteEstado_(operacaoId) {
  if (!operacaoId) return;
  AppState.operacoesPendentes = (AppState.operacoesPendentes || []).filter(op => op.idOperacao !== operacaoId);
  SyncQueue.atualizarUI();
}

function carregarOperacoesPendentesServidor(recuperarAutomaticamente = true) {
  if (typeof google === 'undefined' || !google.script || !localStorage.getItem('rh_token')) return;

  backendApi()
    .withSuccessHandler(function(operacoes) {
      AppState.operacoesPendentes = Array.isArray(operacoes) ? operacoes : [];

      if (recuperarAutomaticamente) {
        AppState.operacoesPendentes.forEach(op => {
          const recuperavelAutomaticamente = op.pronta && op.status !== 'ERRO';
          if (recuperavelAutomaticamente && op.payload) {
            SyncQueue.enfileirar(
              op.tipoOperacao,
              op.tipoOperacao === 'salvar_lancamento' ? 'salvarLancamento' : '',
              [op.payload],
              op.descricao || 'Operação recuperada'
            );
          }
        });
      }

      SyncQueue.atualizarUI();
      renderizarFilaSincronizacao_();
      const exigeAtencao = AppState.operacoesPendentes.filter(op => !op.pronta || op.status === 'ERRO').length;
      if (exigeAtencao > 0) {
        mostrarToast(`${exigeAtencao} operação(ões) preservada(s) precisam de atenção.`, 'warning');
      }
    })
    .withFailureHandler(function(erro) {
      console.warn('Não foi possível consultar a fila persistente:', mensagemErro(erro));
    })
    .obterOperacoesPendentesUsuario();
}

function abrirModalFilaSincronizacao() {
  renderizarFilaSincronizacao_();
  abrirModal('modal-fila-sincronizacao');
  carregarOperacoesPendentesServidor(false);
}

function renderizarFilaSincronizacao_() {
  const corpo = document.getElementById('fila-sincronizacao-lista');
  if (!corpo) return;
  const operacoes = AppState.operacoesPendentes || [];

  if (!operacoes.length) {
    corpo.innerHTML = '<div class="fila-vazia"><span data-lucide="check-circle"></span><strong>Nenhuma operação pendente</strong><small>Todos os documentos foram sincronizados.</small></div>';
    renderizarIcones();
    return;
  }

  corpo.innerHTML = operacoes.map(op => {
    const pronta = Boolean(op.pronta);
    const classe = op.status === 'ERRO' ? 'erro' : (pronta ? 'pronta' : 'incompleta');
    const detalhe = !pronta
      ? `Upload incompleto: ${op.anexosEnviados}/${op.anexosEsperados} anexo(s). Os arquivos já enviados estão preservados.`
      : (op.ultimoErro || 'Pronta para sincronizar.');
    const anexos = Array.isArray(op.anexos) ? op.anexos : [];
    return `<article class="fila-item ${classe}">
      <div class="fila-item-cabecalho">
        <div><strong>${escapeHtml(op.descricao || 'Operação pendente')}</strong><small>${escapeHtml(op.criadoEm || '')} · ${escapeHtml(op.status || '')}</small></div>
        <span class="badge ${op.status === 'ERRO' ? 'badge-inativo' : 'badge-ativo'}">${escapeHtml(op.status || 'PENDENTE')}</span>
      </div>
      <p>${escapeHtml(detalhe)}</p>
      <div class="fila-item-acoes">
        <button class="btn btn-primary btn-small" onclick="tentarNovamenteOperacao('${escapeHtml(op.idOperacao)}')" ${pronta ? '' : 'disabled'}><span data-lucide="refresh-cw"></span>Tentar novamente</button>
        ${anexos.length ? `<button class="btn btn-secondary btn-small" onclick="visualizarAnexosFila('${escapeHtml(op.idOperacao)}')"><span data-lucide="paperclip"></span>Ver anexo</button>` : ''}
        <button class="btn btn-secondary btn-small" onclick="cancelarOperacaoFila('${escapeHtml(op.idOperacao)}')"><span data-lucide="x-circle"></span>Cancelar pendência</button>
      </div>
    </article>`;
  }).join('');
  renderizarIcones();
}

function tentarNovamenteOperacao(operacaoId) {
  const op = (AppState.operacoesPendentes || []).find(item => item.idOperacao === operacaoId);
  if (!op || !op.pronta || !op.payload) {
    mostrarToast('Esta operação ainda não possui todos os anexos necessários.', 'warning');
    return;
  }
  SyncQueue.enfileirar(op.tipoOperacao, 'salvarLancamento', [op.payload], op.descricao || 'Operação recuperada');
  fecharModal('modal-fila-sincronizacao');
  mostrarToast('Operação recolocada na fila de sincronização.', 'success');
}

function visualizarAnexosFila(operacaoId) {
  const op = (AppState.operacoesPendentes || []).find(item => item.idOperacao === operacaoId);
  const anexos = op && Array.isArray(op.anexos) ? op.anexos : [];
  fecharModal('modal-fila-sincronizacao');
  visualizarAnexos(anexos[0] || '', anexos[1] || '', anexos[2] || '');
}

async function cancelarOperacaoFila(operacaoId) {
  const confirmar = await abrirConfirm('Cancelar esta pendência? Os anexos já enviados continuarão preservados no Drive.');
  if (!confirmar) return;
  exibirLoader(true);
  backendApi()
    .withSuccessHandler(function() {
      exibirLoader(false);
      SyncQueue.fila = SyncQueue.fila.filter(item => item.operacaoId !== operacaoId);
      SyncQueue.persistir();
      removerOperacaoPendenteEstado_(operacaoId);
      renderizarFilaSincronizacao_();
      mostrarToast('Pendência cancelada. Os anexos foram preservados.', 'success');
    })
    .withFailureHandler(function(erro) {
      exibirLoader(false);
      mostrarToast('Não foi possível cancelar: ' + mensagemErro(erro), 'error');
    })
    .cancelarOperacaoPendente(operacaoId);
}

let filaStatusInsights = [];
let statusAtualSync = false;
let exibindoInsightAtual = false;
let timeoutInsight = null;

function tentarMostrarInsight() {
  if (statusAtualSync) return; // Sistema está usando a barra
  if (exibindoInsightAtual) return; // Já está exibindo um insight
  if (filaStatusInsights.length === 0) return;
  
  let html = filaStatusInsights.shift();
  exibindoInsightAtual = true;
  
  const el = document.getElementById('sync-detailed-status');
  const textEl = document.getElementById('sync-detailed-text');
  
  el.classList.add('entidade-insight');
  el.onclick = function(e) {
    e.preventDefault();
    toggleChatEntidade();
    fecharInsightAtual();
  };
  
  textEl.innerHTML = html;
  const duracaoTicker = Math.min(180, Math.max(22, 8 + String(textEl.textContent || '').length * 0.11));
  textEl.style.setProperty('--entidade-ticker-duration', duracaoTicker + 's');
  el.classList.add('show');
  renderizarIcones();
  
  timeoutInsight = setTimeout(() => {
    fecharInsightAtual();
  }, (duracaoTicker + 2) * 1000);
}

function fecharInsightAtual() {
  if (!exibindoInsightAtual) return;
  exibindoInsightAtual = false;
  if (timeoutInsight) clearTimeout(timeoutInsight);
  
  const el = document.getElementById('sync-detailed-status');
  el.classList.remove('show');
  
  setTimeout(() => {
    el.classList.remove('entidade-insight');
    el.onclick = null;
    tentarMostrarInsight();
  }, 500);
}

/**
 * Atualiza o texto explicativo sobre o status de sincronismo no cabeçalho.
 */
function atualizarTextoSync(texto, exibir = true, icone = 'spinner') {
  const el = document.getElementById('sync-detailed-status');
  const textEl = document.getElementById('sync-detailed-text');
  if (!el || !textEl) return;
  
  if (exibir && texto) {
    // Interrompe insight atual se houver e o devolve para o topo da fila
    if (exibindoInsightAtual) {
       filaStatusInsights.unshift(textEl.innerHTML);
       exibindoInsightAtual = false;
       if (timeoutInsight) clearTimeout(timeoutInsight);
       el.classList.remove('entidade-insight');
       el.onclick = null;
    }
    
    statusAtualSync = true;
    
    let prefix = '';
    if (icone === 'spinner') prefix = `<span class="sync-spinner"></span> `;
    else if (icone === 'offline') prefix = `<span data-lucide="wifi-off" style="width: 12px; height: 12px; margin-right: 6px; color: #f87171;"></span> `;
    else if (icone === 'check') prefix = `<span data-lucide="check" style="width: 12px; height: 12px; margin-right: 6px; color: #34d399;"></span> `;
    else if (icone === 'warning') prefix = `<span data-lucide="alert-triangle" style="width: 12px; height: 12px; margin-right: 6px; color: #fbbf24;"></span> `;
    
    textEl.innerHTML = prefix + texto;
    el.classList.add('show');
    renderizarIcones();
  } else {
    if (statusAtualSync) {
      statusAtualSync = false;
      el.classList.remove('show');
      setTimeout(() => { 
        if (!el.classList.contains('show')) textEl.innerHTML = ''; 
        tentarMostrarInsight();
      }, 500);
    }
  }
}

// ==========================================
// CACHE LOCAL (localStorage)
// ==========================================
const CACHE_LOCAL_TTL_MS = 30 * 60 * 1000;

function obterEmailCacheLocal_() {
  try {
    const usuario = JSON.parse(localStorage.getItem('rh_user') || '{}');
    return String(usuario.email || '').toLowerCase().trim();
  } catch (e) {
    return '';
  }
}

function obterChaveCacheLocal_() {
  const email = obterEmailCacheLocal_();
  return email ? 'rh_cache_v2_' + encodeURIComponent(email) : '';
}

function limparCacheLocal_() {
  const chave = obterChaveCacheLocal_();
  if (chave) localStorage.removeItem(chave);
  localStorage.removeItem('rh_cache');
}

function salvarCacheLocal() {
  try {
    const email = obterEmailCacheLocal_();
    const chave = obterChaveCacheLocal_();
    if (!email || !chave) return;
    const cacheData = {
      usuarioEmail: email,
      servidores: AppState.servidores,
      lancamentos: AppState.lancamentos,
      protocolos: AppState.protocolos,
      dashboard: AppState.dashboard,
      timestamp: Date.now()
    };
    localStorage.setItem(chave, JSON.stringify(cacheData));
    localStorage.removeItem('rh_cache');
  } catch(e) {
    limparCacheLocal_();
    console.warn('Cache local indisponivel; os dados continuarao vindo do servidor.', e);
  }
}

function restaurarCacheLocal() {
  try {
    localStorage.removeItem('rh_cache');
    const email = obterEmailCacheLocal_();
    const chave = obterChaveCacheLocal_();
    if (!email || !chave) return false;
    const raw = localStorage.getItem(chave);
    if (!raw) return false;
    const cache = JSON.parse(raw);
    const expirado = !cache.timestamp || (Date.now() - Number(cache.timestamp)) > CACHE_LOCAL_TTL_MS;
    const outroUsuario = String(cache.usuarioEmail || '').toLowerCase() !== email;
    if (!Array.isArray(cache.servidores) || expirado || outroUsuario) {
      localStorage.removeItem(chave);
      return false;
    }
    AppState.servidores = cache.servidores || [];
    AppState.lancamentos = cache.lancamentos || [];
    AppState.protocolos = cache.protocolos || [];
    AppState.dashboard = cache.dashboard || {};
    AppState.cacheRestaurado = true;
    return true;
  } catch(e) {
    limparCacheLocal_();
    return false;
  }
}

// ==========================================
// DETECÇÃO ONLINE / OFFLINE
// ==========================================
window.addEventListener('online', () => {
  mostrarToast('Conexão restaurada. Sincronizando...', 'success');
  SyncQueue.atualizarUI();
  SyncQueue.processar();
  sincronizarEmSegundoPlano();
});

window.addEventListener('offline', () => {
  mostrarToast('Sem conexão com a internet. Você pode continuar trabalhando.', 'warning');
  SyncQueue.atualizarUI();
});

window.addEventListener('beforeunload', (e) => {
  if (SyncQueue.fila.length > 0) {
    e.preventDefault();
    e.returnValue = 'Há operações não sincronizadas. Tem certeza que deseja sair?';
  }
});

// Polling silencioso a cada 5 minutos (somente se aba ativa)
let pollingInterval;
function iniciarPolling() {
  if (pollingInterval) clearInterval(pollingInterval);
  pollingInterval = setInterval(() => {
    if (document.visibilityState === 'visible' && navigator.onLine && SyncQueue.fila.length === 0) {
      sincronizarEmSegundoPlano();
    }
  }, 5 * 60 * 1000);
}

/**
 * Função utilitária global para prevenir injeções de HTML e XSS armazenado
 */
function escapeHtml(unsafe) {
  if (unsafe === undefined || unsafe === null) return '';
  return String(unsafe)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/** Mantém o app funcional mesmo quando o CDN de ícones estiver indisponível. */
function renderizarIcones() {
  if (window.lucide && typeof window.lucide.createIcons === 'function') {
    window.lucide.createIcons();
  }
}

function mensagemErro(erro) {
  if (!erro) return "Erro desconhecido.";
  return erro.message || String(erro);
}

const operacoesInterfaceAtivas = new Set();
let proximoZIndexModal = 20000;

function iniciarOperacaoInterface(chave, botao, texto = 'Processando...') {
  if (operacoesInterfaceAtivas.has(chave)) {
    mostrarToast('Esta operação já está em andamento. Aguarde a conclusão.', 'info');
    return false;
  }

  operacoesInterfaceAtivas.add(chave);
  if (botao) {
    botao._htmlAntesProcessamento = botao.innerHTML;
    botao.disabled = true;
    botao.classList.add('is-processing');
    botao.innerHTML = `<span class="button-spinner" aria-hidden="true"></span>${escapeHtml(texto)}`;
  }
  return true;
}

function finalizarOperacaoInterface(chave, botao) {
  operacoesInterfaceAtivas.delete(chave);
  if (botao) {
    botao.disabled = false;
    botao.classList.remove('is-processing');
    if (botao._htmlAntesProcessamento != null) {
      botao.innerHTML = botao._htmlAntesProcessamento;
      delete botao._htmlAntesProcessamento;
      renderizarIcones();
    }
  }
}

/**
 * Exibe notificação customizada "Toast" e oculta automaticamente
 */
function mostrarToast(mensagem, tipo = 'info') {
  const container = document.getElementById('toast-container');
  if (!container) {
    console.warn('Aviso da interface:', mensagem);
    return;
  }
  
  const toast = document.createElement('div');
  toast.className = `toast toast-${tipo}`;
  
  let icone = 'info';
  if (tipo === 'success') icone = 'check-circle';
  if (tipo === 'error') icone = 'alert-circle';
  if (tipo === 'warning') icone = 'alert-triangle';
  
  toast.innerHTML = `
    <div class="toast-icon">
      <span data-lucide="${icone}"></span>
    </div>
    <div class="toast-content">${escapeHtml(mensagem)}</div>
  `;
  
  container.appendChild(toast);
  renderizarIcones();
  
  setTimeout(() => {
    toast.classList.add('toast-leaving');
    toast.addEventListener('animationend', () => toast.remove());
  }, 4000);
}

/**
 * Exibe um Modal de Confirmação customizado (Retorna Promise<boolean>)
 */
function abrirConfirm(mensagem, titulo = 'Atenção') {
  return new Promise((resolve) => {
    const modal = document.getElementById('modal-confirm');
    if (!modal) {
      resolve(confirm(mensagem));
      return;
    }
    document.getElementById('confirm-title').innerText = titulo;
    document.getElementById('confirm-message').innerText = mensagem;
    
    const btnCancel = document.getElementById('confirm-btn-cancel');
    const btnOk = document.getElementById('confirm-btn-ok');
    
    const fechar = (resultado) => {
      fecharModal('modal-confirm');
      btnCancel.removeEventListener('click', clkCancel);
      btnOk.removeEventListener('click', clkOk);
      resolve(resultado);
    };
    
    const clkCancel = () => fechar(false);
    const clkOk = () => fechar(true);
    
    btnCancel.addEventListener('click', clkCancel);
    btnOk.addEventListener('click', clkOk);
    
    abrirModal('modal-confirm');
  });
}

/** LÓGICA DE LOGIN CUSTOMIZADO */

let stepLogin = 1;

function mostrarLogin() {
  document.getElementById('login-container').style.display = 'flex';
  document.getElementById('login-error').style.display = 'none';
  document.getElementById('login-senha-container').style.display = 'none';
  document.getElementById('btn-login-submit').innerText = 'Continuar';
  document.getElementById('login-senha').required = false;
  stepLogin = 1;
  exibirLoader(false);
}

function esconderLogin() {
  document.getElementById('login-container').style.display = 'none';
}

function showError(msg) {
  const el = document.getElementById('login-error');
  el.innerText = msg;
  el.style.display = 'block';
  exibirLoader(false);
}

function processarLogin(e) {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const senhaInput = document.getElementById('login-senha');
  const senha = senhaInput.value;
  const hintEl = document.getElementById('login-senha-hint');
  const labelEl = document.getElementById('label-login-senha');
  const btnSubmit = document.getElementById('btn-login-submit');
  
  if (!email) return;
  
  exibirLoader(true);
  document.getElementById('login-error').style.display = 'none';
  
  if (stepLogin === 1) {
    // Passo 1: Verificar E-mail
    google.script.run
      .withSuccessHandler(function(res) {
        exibirLoader(false);
        stepLogin = 2;
        document.getElementById('login-senha-container').style.display = 'block';
        senhaInput.required = true;
        
        if (res.temSenha) {
          hintEl.style.display = 'none';
          labelEl.innerText = "Senha de Acesso";
          btnSubmit.innerText = "Entrar";
          senhaInput.autocomplete = "current-password";
        } else {
          hintEl.style.display = 'block';
          labelEl.innerText = "Crie uma Senha";
          btnSubmit.innerText = "Criar Senha e Entrar";
          senhaInput.autocomplete = "new-password";
        }
        
        // Foca no input de senha
        setTimeout(() => senhaInput.focus(), 100);
      })
      .withFailureHandler(function(e) {
        showError(e.message || "Erro ao verificar e-mail.");
      })
      .verificarStatusEmail(email);
      
  } else if (stepLogin === 2) {
    // Passo 2: Fazer Login ou Criar Senha
    const isCriandoSenha = hintEl.style.display === 'block';
    
    if (isCriandoSenha) {
      google.script.run
        .withSuccessHandler(function(res) {
          localStorage.setItem('rh_token', res.token);
          localStorage.setItem('rh_user', JSON.stringify(res.usuario));
          esconderLogin();
          inicializarUsuario(false);
        })
        .withFailureHandler(function(e) {
          showError(e.message || "Erro ao criar senha.");
        })
        .definirSenhaPrimeiroAcesso(email, senha);
    } else {
      google.script.run
        .withSuccessHandler(function(res) {
          localStorage.setItem('rh_token', res.token);
          localStorage.setItem('rh_user', JSON.stringify(res.usuario));
          esconderLogin();
          inicializarUsuario(false);
        })
        .withFailureHandler(function(e) {
          showError(e.message || "Senha incorreta.");
        })
        .fazerLogin(email, senha);
    }
  }
}

/** 
 * Wrapper para todas as chamadas de backend que necessitam autenticação.
 */
function backendApi() {
  const token = localStorage.getItem('rh_token');
  let sHandler = function(){};
  let fHandler = function(e){ console.error(e); };
  
  const proxy = new Proxy({}, {
    get: function(target, prop) {
      if (prop === 'withSuccessHandler') {
        return function(fn) { sHandler = fn; return proxy; };
      }
      if (prop === 'withFailureHandler') {
        return function(fn) { fHandler = fn; return proxy; };
      }
      return function(...args) {
        if (!token) {
          fHandler(new Error("Sessão inválida. Faça login."));
          mostrarLogin();
          return;
        }
        google.script.run
          .withSuccessHandler(sHandler)
          .withFailureHandler(function(e) {
            if (e.message && (e.message.includes("Sua sessão expirou") || e.message.includes("Token de sessão não fornecido"))) {
              limparCacheLocal_();
              localStorage.removeItem('rh_token');
              localStorage.removeItem('rh_user');
              mostrarLogin();
            }
            fHandler(e);
          })
          .executarApiBackend(token, prop, args);
      };
    }
  });
  return proxy;
}

/**
 * Busca o usuário atual logado e valida sessão
 */
function inicializarUsuario(temCache) {
  const token = localStorage.getItem('rh_token');
  const userJson = localStorage.getItem('rh_user');
  
  if (!token || !userJson) {
    mostrarLogin();
    return;
  }
  
  try {
    AppState.usuarioLogado = JSON.parse(userJson);
    SyncQueue.restaurar();
    SyncQueue.atualizarUI();
  } catch(e) {
    mostrarLogin();
    return;
  }
  
  atualizarBarraUsuario();
  if (AppState.usuarioLogado.papel === "Administrador" || AppState.usuarioLogado.papel === "Admin") {
    document.querySelectorAll('.admin-only').forEach(el => el.style.removeProperty('display'));
  }

  // Verifica se o token ainda é válido no servidor
  if (!temCache) exibirLoader(true);
  
  backendApi()
    .withSuccessHandler(function(usuario) {
      AppState.usuarioLogado = usuario;
      localStorage.setItem('rh_user', JSON.stringify(usuario));
      atualizarBarraUsuario();
      carregarOperacoesPendentesServidor(true);
      
      if (temCache) {
        carregarDadosDaView('dashboard');
        exibirLoader(false);
        sincronizarEmSegundoPlano('dashboard');
      } else {
        sincronizarDados(true, 'dashboard');
      }
    })
    .withFailureHandler(function(erro) {
      console.error("Sessão inválida:", erro);
      limparCacheLocal_();
      localStorage.removeItem('rh_token');
      localStorage.removeItem('rh_user');
      mostrarLogin();
      exibirLoader(false);
    })
    .verificarSessao(token);
}

/**
 * Sincronização INICIAL ou forçada (com loader pesado).
 * Só deve ser chamada no boot da aplicação ou ao limpar cache explicitamente.
 */
let sincronizacaoServidorEmAndamento = false;
let sincronizacaoViewPendente = null;

function reservarSincronizacaoServidor_(viewAlvo) {
  if (sincronizacaoServidorEmAndamento) {
    if (viewAlvo) sincronizacaoViewPendente = viewAlvo;
    return false;
  }
  sincronizacaoServidorEmAndamento = true;
  return true;
}

function concluirSincronizacaoServidor_(viewAlvo) {
  sincronizacaoServidorEmAndamento = false;
  const viewFinal = sincronizacaoViewPendente || viewAlvo || null;
  sincronizacaoViewPendente = null;
  return viewFinal;
}

function sincronizarDados(forcarUpdate = false, viewAlvo = null) {
  if (typeof google === "undefined" || !google.script) return;
  
  if (!forcarUpdate && AppState.dadosCompletosCarregados) {
    if (viewAlvo) carregarDadosDaView(viewAlvo);
    return;
  }
  
  if (!reservarSincronizacaoServidor_(viewAlvo)) return;
  const syncBtn = document.getElementById('btn-sync-icon');
  if (syncBtn) syncBtn.classList.add('spinning');
  exibirLoader(true);
  
  atualizarTextoSync("Baixando dados...");
  
  backendApi()
    .withSuccessHandler(function(dados) {
      const currBtn = document.getElementById('btn-sync-icon');
      if (currBtn) currBtn.classList.remove('spinning');
      atualizarTextoSync("Sincronizado!", true, 'check');
      setTimeout(() => {
        if (SyncQueue.fila.length === 0 && !SyncQueue.processando) {
          atualizarTextoSync("", false);
        }
      }, 3000);
      AppState.dashboard = dados.dashboard || {};
      AppState.servidores = Array.isArray(dados.servidores) ? dados.servidores : [];
      AppState.lancamentos = Array.isArray(dados.lancamentos) ? dados.lancamentos : [];
      AppState.protocolos = Array.isArray(dados.protocolos) ? dados.protocolos : [];
      AppState.dadosCompletosCarregados = true;
      popularFiltroLotacoes();
      salvarCacheLocal();
      exibirLoader(false);
      const viewFinal = concluirSincronizacaoServidor_(viewAlvo);
      if (viewFinal) {
        carregarDadosDaView(viewFinal);
      } else {
        const activeLink = document.querySelector('.menu-link.active');
        if (activeLink) {
          const match = activeLink.getAttribute('onclick').match(/'([^']+)'/);
          if (match) carregarDadosDaView(match[1]);
        }
      }
    })
    .withFailureHandler(function(erro) {
      const syncBtn = document.getElementById('btn-sync-icon');
      const currBtn = document.getElementById('btn-sync-icon');
      if (currBtn) currBtn.classList.remove('spinning');
      exibirLoader(false);
      concluirSincronizacaoServidor_(null);
      atualizarTextoSync("Falha na rede", true, 'warning');
      setTimeout(() => atualizarTextoSync("", false), 5000);
      mostrarToast("Falha ao sincronizar: " + mensagemErro(erro), 'error');
    })
    .obterDadosCompletos();
}

/**
 * Sincronização em SEGUNDO PLANO — não exibe loader pesado.
 * Usada após salvar registros (otimista, como AppSheets).
 * A setinha gira para indicar que está em andamento e para ao finalizar.
 * viewAlvo = aba a ser recarregada ao terminar ('lancamentos', 'servidores', etc)
 */
function sincronizarEmSegundoPlano(viewAlvo = null) {
  if (typeof google === "undefined" || !google.script) return;
  if (!reservarSincronizacaoServidor_(viewAlvo)) return;
  const syncBtn = document.getElementById('btn-sync-icon');
  if (syncBtn) syncBtn.classList.add('spinning');
  
  atualizarTextoSync("Atualizando dados...");
  
  backendApi()
    .withSuccessHandler(function(dados) {
      const currBtn = document.getElementById('btn-sync-icon');
      if (currBtn) currBtn.classList.remove('spinning');
      atualizarTextoSync("Sincronizado!", true, 'check');
      setTimeout(() => {
        if (SyncQueue.fila.length === 0 && !SyncQueue.processando) {
          atualizarTextoSync("", false);
        }
      }, 3000);
      AppState.dashboard = dados.dashboard || {};
      AppState.servidores = Array.isArray(dados.servidores) ? dados.servidores : [];
      AppState.lancamentos = Array.isArray(dados.lancamentos) ? dados.lancamentos : [];
      AppState.protocolos = Array.isArray(dados.protocolos) ? dados.protocolos : [];
      AppState.dadosCompletosCarregados = true;
      popularFiltroLotacoes();
      salvarCacheLocal();
      const viewFinal = concluirSincronizacaoServidor_(viewAlvo);
      if (viewFinal) carregarDadosDaView(viewFinal);
    })
    .withFailureHandler(function(erro) {
      const currBtn = document.getElementById('btn-sync-icon');
      if (currBtn) currBtn.classList.remove('spinning');
      concluirSincronizacaoServidor_(null);
      atualizarTextoSync("Falha na atualização", true, 'warning');
      setTimeout(() => atualizarTextoSync("", false), 5000);
      console.warn("Falha na sincronização em segundo plano:", erro);
      mostrarToast("Atualização em segundo plano falhou. Clique em ⟳ para recarregar.", 'warning');
    })
    .obterDadosCompletos();
}

function obterPrimeiroNome(nome) {
  const primeiro = String(nome || '').trim().split(/\s+/)[0];
  if (!primeiro) return 'seja bem-vindo';
  return primeiro.charAt(0).toUpperCase() + primeiro.slice(1).toLowerCase();
}

function obterIniciais(nome) {
  const partes = String(nome || 'Usuário').trim().split(/\s+/).filter(Boolean);
  return ((partes[0]?.[0] || 'U') + (partes.length > 1 ? partes[partes.length - 1][0] : '')).toUpperCase();
}

function obterSaudacao() {
  const hora = new Date().getHours();
  if (hora < 12) return 'Bom dia';
  if (hora < 18) return 'Boa tarde';
  return 'Boa noite';
}

/**
 * Exibe ou oculta o spinner de carregamento geral
 */
let loaderInterval;
let loaderSafetyTimeout;
let loaderHideTimeout;
function exibirLoader(mostrar, texto = "Sincronizando base de dados...") {
  const loader = document.getElementById('global-loader');
  const percText = document.getElementById('loader-percentage');
  const msgText = document.getElementById('loader-text');

  if (loader) {
    if (mostrar) {
      if (loaderHideTimeout) clearTimeout(loaderHideTimeout);
      loader.style.display = 'flex';
      if (msgText) msgText.innerText = texto;
      if (percText) {
        percText.innerText = "0%";
        let perc = 0;
        if (loaderInterval) clearInterval(loaderInterval);
        loaderInterval = setInterval(() => {
          if (perc < 92) {
            let inc = Math.max(1, Math.floor(Math.random() * (95 - perc) / 5));
            perc += inc;
            percText.innerText = perc + "%";
          }
        }, 300);
      }
      // Safety net: desliga loader após 30 segundos automaticamente
      if (loaderSafetyTimeout) clearTimeout(loaderSafetyTimeout);
      loaderSafetyTimeout = setTimeout(() => {
        exibirLoader(false);
        console.warn('Loader desligado por safety net (30s)');
      }, 30000);
    } else {
      if (loaderSafetyTimeout) clearTimeout(loaderSafetyTimeout);
      if (percText) percText.innerText = "100%";
      if (loaderHideTimeout) clearTimeout(loaderHideTimeout);
      loaderHideTimeout = setTimeout(() => {
        loader.style.display = 'none';
        if (loaderInterval) clearInterval(loaderInterval);
      }, 350);
    }
  }
}

function obterDistribuicaoLotacoesDashboard() {
  const mapa = {};
  (AppState.servidores || []).forEach(function(servidor) {
    if (String(servidor.status || '').toLowerCase() === 'inativo') return;
    const lotacao = String(servidor.lotacao || 'Não informada').trim() || 'Não informada';
    mapa[lotacao] = (mapa[lotacao] || 0) + 1;
  });
  return Object.entries(mapa)
    .map(item => ({ lotacao: item[0], quantidade: item[1] }))
    .sort((a, b) => b.quantidade - a.quantidade || a.lotacao.localeCompare(b.lotacao));
}

function renderizarDistribuicaoLotacoesDashboard() {
  const lista = obterDistribuicaoLotacoesDashboard();
  const total = lista.reduce((soma, item) => soma + item.quantidade, 0);
  const pizza = document.getElementById('dashboard-location-pie');
  const legenda = document.getElementById('dashboard-location-legend');
  const totalEl = document.getElementById('location-chart-total');
  const countEl = document.getElementById('location-chart-count');
  if (totalEl) totalEl.innerText = total;
  if (countEl) countEl.innerText = `${lista.length} ${lista.length === 1 ? 'lotação' : 'lotações'}`;
  if (!pizza || !legenda) return;

  if (!lista.length) {
    pizza.style.background = 'var(--bg-tertiary)';
    pizza.setAttribute('aria-label', 'Nenhuma lotação disponível');
    legenda.innerHTML = '<div class="location-chart-empty">Nenhuma lotação disponível.</div>';
    return;
  }

  const principais = lista.slice(0, 5);
  const quantidadeOutras = lista.slice(5).reduce((soma, item) => soma + item.quantidade, 0);
  const fatias = quantidadeOutras > 0
    ? principais.concat([{ lotacao: 'Outras lotações', quantidade: quantidadeOutras }])
    : principais;
  const cores = ['#10b981', '#22c55e', '#38bdf8', '#818cf8', '#f59e0b', '#64748b'];
  let acumulado = 0;
  const gradiente = fatias.map(function(item, indice) {
    const inicio = acumulado;
    acumulado += (item.quantidade / total) * 100;
    return `${cores[indice]} ${inicio.toFixed(2)}% ${acumulado.toFixed(2)}%`;
  }).join(', ');

  pizza.style.background = `conic-gradient(from -90deg, ${gradiente})`;
  pizza.setAttribute('aria-label', fatias.map(function(item) {
    return `${item.lotacao}: ${item.quantidade}`;
  }).join('; '));

  legenda.innerHTML = fatias.map(function(item, indice) {
    const percentual = Math.round((item.quantidade / total) * 100);
    return `<div class="location-pie-legend-row" title="${escapeHtml(item.lotacao)}: ${item.quantidade} servidores (${percentual}%)">
      <span class="location-pie-dot" style="background:${cores[indice]}"></span>
      <span class="location-pie-label">${escapeHtml(item.lotacao)}</span>
      <strong>${item.quantidade}</strong>
      <small>${percentual}%</small>
    </div>`;
  }).join('');
}

function alertaDashboardEntidadeAcionavel(resposta) {
  const original = String(resposta || '').trim();
  if (!original || /tudo em ordem/i.test(original)) return false;
  const texto = original.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const temProblema = /\b(aguarda|pendente|pendencia|inconsistencia|divergencia|conferir|corrigir|regularizar|vencido|vencimento|atraso|duplicado|faltando|ausente|sem matricula|sem lotacao)\b/.test(texto);
  const temReferencia = /\b(matricula|1doc|campo|motivo|prazo|data)\b/.test(texto)
    || /\b\d+\s+dias?\b/.test(texto)
    || /\b\d{2}[\/-]\d{2}(?:[\/-]\d{2,4})?\b/.test(original);
  return temProblema && temReferencia;
}

  const temBriefing = Boolean(briefing && briefing.mostrar !== false && briefing.disponivel && briefing.resposta);
  const chaveMensagem = temAlertas
    ? 'insight:' + String(insight.geradoEm || '') + ':' + String(insight.resposta || '').slice(0, 80)

    icon.innerHTML = '<span data-lucide="ghost"></span>';
    document.getElementById('dashboard-ai-alert-content').innerHTML = renderizarMarkdownSeguroEntidade(limparComandosEntidade(insight.resposta));

/**
 * Renderiza as linhas da tabela de Servidores com base nos dados locais
 */
function renderizarTabelaServidores(listaFiltrada, mantemPagina = false) {
  const listaOriginal = Array.isArray(listaFiltrada)
    ? listaFiltrada
    : (Array.isArray(AppState.servidores) ? AppState.servidores : []);
  const tbody = document.getElementById('tabela-servidores-body');
  
  if (!mantemPagina) {
    AppState.paginacao.servidores.listaAtual = listaOriginal;
    AppState.paginacao.servidores.paginaAtual = 1;
  }
  
  const estado = AppState.paginacao.servidores;
  const totalItens = estado.listaAtual.length;
  
  if (totalItens === 0) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-secondary);">Nenhum servidor encontrado.</td></tr>`;
    renderizarControlesPaginacao('paginacao-servidores', 'servidores', 0);
    return;
  }
  
  const start = (estado.paginaAtual - 1) * estado.itensPorPagina;
  const servidores = estado.listaAtual.slice(start, start + estado.itensPorPagina);
  
  let html = "";
  servidores.forEach(s => {
    let badgeClass = "badge-ativo";
    let badgeText = "Ativo";
    
    if (s.status === "Férias") {
      badgeClass = "badge-ferias";
      badgeText = "Férias";
    } else if (s.status === "Abono") {
      badgeClass = "badge-abono";
      badgeText = "Abono";
    } else if (s.status === "Inativo") {
      badgeClass = "badge-inativo";
      badgeText = "Inativo";
    }
    
    const botaoNotificacao = s.feriasCompulsorias === true
      ? `<button class="btn-action btn-notificacao-ferias" data-action="notificar-ferias" data-mat="${escapeHtml(s.matricula)}" title="Gerar notificação preventiva de férias"><span data-lucide="file-warning" style="width:14px;height:14px;"></span></button>`
      : '';
    html += `<tr>       <td><div class="nome-com-acao"><strong>${escapeHtml(s.nome)}</strong>${botaoNotificacao}</div></td>       <td>${escapeHtml(s.matricula)}</td>       <td>${escapeHtml(s.cargo)}</td>       <td>${escapeHtml(s.lotacao)}</td>       <td>${escapeHtml(s.situacao)}</td>       <td><span class="badge ${badgeClass}">${badgeText}</span></td>       <td>         <div class="action-buttons">           <button class="btn-action" data-action="ficha" data-mat="${escapeHtml(s.matricula)}" title="Visualizar Ficha">             <span data-lucide="eye" style="width: 14px; height: 14px;"></span>           </button>           <button class="btn-action" data-action="editar-servidor" data-mat="${escapeHtml(s.matricula)}" title="Editar Cadastro">             <span data-lucide="edit-2" style="width: 14px; height: 14px;"></span>           </button>           ${s.status !== 'Inativo' ? `<button class="btn-action btn-delete" data-action="desativar-servidor" data-mat="${escapeHtml(s.matricula)}" data-nome="${escapeHtml(s.nome)}" title="Desativar Servidor"><span data-lucide="trash-2" style="width: 14px; height: 14px;"></span></button>` : ''}         </div>       </td>     </tr>`;
  });

  tbody.innerHTML = html;
  // Delega eventos após inserção para evitar XSS em atributos onclick
  tbody.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', function() {
      const action = this.dataset.action;
      const mat = this.dataset.mat;
      const nome = this.dataset.nome || '';
      if (action === 'ficha') abrirFichaServidor(mat);
      else if (action === 'editar-servidor') abrirModalServidor(mat);
      else if (action === 'desativar-servidor') confirmarDesativacaoServidor(mat, nome);
      else if (action === 'notificar-ferias') abrirNotificacaoFeriasCompulsorias(mat);
    });
  });
  renderizarIcones();
  renderizarControlesPaginacao('paginacao-servidores', 'servidores', totalItens);
}

/**
 * Filtra a tabela de servidores em tempo real no lado do cliente
 */
function filtrarTabelaServidores() {
  const busca = document.getElementById('filtro-busca-servidor').value.toLowerCase().trim();
  const lotacao = document.getElementById('filtro-lotacao-servidor').value;
  const situacao = document.getElementById('filtro-situacao-servidor').value;
  const status = document.getElementById('filtro-status-servidor').value;
  
  const filtrados = AppState.servidores.filter(s => {
    // 1. Busca textual (Nome ou Matrícula)
    const bateBusca = !busca || s.nome.toLowerCase().includes(busca) || s.matricula.toLowerCase().includes(busca);
    
    // 2. Filtro de Lotação
    const bateLotacao = !lotacao || s.lotacao === lotacao;
    
    // 3. Filtro de Situação
    const bateSituacao = !situacao || s.situacao === situacao;
    
    // 4. Filtro de Status
    let bateStatus = false;
    if (!status) {
      bateStatus = true;
    } else if (status === "Compulsorias") {
      bateStatus = s.feriasCompulsorias === true;
    } else {
      bateStatus = s.status === status;
    }
    
    return bateBusca && bateLotacao && bateSituacao && bateStatus;
  });
  
  renderizarTabelaServidores(filtrados);
}

/**
 * Popula dinamicamente o select de lotações com base nos cadastros existentes
 */
function popularFiltroLotacoes() {
  const select = document.getElementById('filtro-lotacao-servidor');
  const lotacaoForm = document.getElementById('serv-lotacao');
  if (!select || !lotacaoForm) return;
  const filtroAtual = select.value;
  const lotacaoAtual = lotacaoForm.value;
  const campoNova = document.getElementById('serv-lotacao-nova');
  const textoNovaAtual = campoNova ? campoNova.value : '';
  
  // Extrai lotações exclusivas
  const lotacoes = [...new Set(AppState.servidores.map(s => s.lotacao).filter(Boolean))].sort();
  
  // Usa elementos DOM, evitando interpretar como HTML uma lotacao digitada.
  select.replaceChildren(new Option('Todas Lotações', ''));
  lotacoes.forEach(l => select.add(new Option(l, l)));
  if (Array.from(select.options).some(opcao => opcao.value === filtroAtual)) select.value = filtroAtual;

  const opcoesFormulario = lotacoes.slice();
  ['Turismo', 'Rodoviária', 'Espaço Batuíra'].forEach(l => {
    if (!opcoesFormulario.includes(l)) opcoesFormulario.push(l);
  });
  if (lotacaoAtual && lotacaoAtual !== '__NOVA_LOTACAO__' && !opcoesFormulario.includes(lotacaoAtual)) {
    opcoesFormulario.push(lotacaoAtual);
  }
  lotacaoForm.replaceChildren();
  opcoesFormulario.forEach(l => lotacaoForm.add(new Option(l, l)));
  lotacaoForm.add(new Option('Adicionar nova lotação...', '__NOVA_LOTACAO__'));
  if (Array.from(lotacaoForm.options).some(opcao => opcao.value === lotacaoAtual)) {
    lotacaoForm.value = lotacaoAtual;
  }
  if (lotacaoAtual === '__NOVA_LOTACAO__' && campoNova) campoNova.value = textoNovaAtual;
}

/** Exibe o campo livre somente quando for necessário cadastrar uma nova lotação. */
function atualizarCampoNovaLotacaoServidor() {
  const seletor = document.getElementById('serv-lotacao');

  if (!seletor || !campoNovo) return;

  campoNovo.style.display = informandoNova ? 'block' : 'none';
  campoNovo.required = informandoNova;

}

/** Mantém uma lotação histórica editável mesmo se ela não constar no menu atual. */
function selecionarLotacaoServidor_(lotacao) {
  const seletor = document.getElementById('serv-lotacao');
  const campoNovo = document.getElementById('serv-lotacao-nova');
  const valor = String(lotacao || '').trim();
  if (!seletor || !campoNovo) return;

  const opcaoNova = '__NOVA_LOTACAO__';
  const existe = Array.from(seletor.options).some(opcao => opcao.value === valor);
  if (valor && valor !== 'Outro' && !existe) {
    const opcao = document.createElement('option');
    opcao.value = valor;
    opcao.textContent = valor;
    seletor.insertBefore(opcao, Array.from(seletor.options).find(opcao => opcao.value === opcaoNova) || null);
  }

  seletor.value = valor && valor !== 'Outro' ? valor : opcaoNova;
  campoNovo.value = '';
  atualizarCampoNovaLotacaoServidor();
}

function obterLotacaoFormularioServidor_() {
  const seletor = document.getElementById('serv-lotacao');
  const campoNovo = document.getElementById('serv-lotacao-nova');
  if (!seletor) return '';
  if (seletor.value !== '__NOVA_LOTACAO__') return seletor.value;
  return String(campoNovo ? campoNovo.value : '').trim();
}

/**
 * Abre o modal de cadastro/edição de servidor
 */
function abrirModalServidor(matricula) {
  const form = document.getElementById('form-servidor');
  form.reset();
  
  const titulo = document.getElementById('modal-servidor-titulo');
  const inputMatricula = document.getElementById('serv-matricula');
  const wrapperAtivo = document.getElementById('serv-ativo-wrapper');
  const campoNovaLotacao = document.getElementById('serv-lotacao-nova');
  if (campoNovaLotacao) campoNovaLotacao.value = '';
  
  if (matricula) {
    // Modo Edição
    titulo.innerText = "Editar Servidor";
    inputMatricula.disabled = true; // matrícula é a chave primária, não edita
    wrapperAtivo.style.display = "block";
    
    const s = AppState.servidores.find(serv => serv.matricula === matricula);
    if (s) {
      document.getElementById('serv-matricula').value = s.matricula;
      document.getElementById('serv-pis').value = s.pis || '';
      document.getElementById('serv-nome').value = s.nome;
      document.getElementById('serv-cargo').value = s.cargo;
      selecionarLotacaoServidor_(s.lotacao);
      document.getElementById('serv-situacao').value = s.situacao;
      document.getElementById('serv-email').value = s.email;
      document.getElementById('serv-ativo').value = s.status === 'Inativo' ? 'Não' : 'Sim';
      document.getElementById('serv-penalidade-ferias').value = s.penalidadeFerias || 0;
      document.getElementById('serv-penalidade-abonos').value = s.penalidadeAbono || 0;
      
      // Parse de data no formato dd/mm/yyyy para yyyy-mm-dd exigido pelo input date
      if (s.admissao) {
        let partes = s.admissao.split('/');
        if (partes.length === 3) {
          document.getElementById('serv-admissao').value = `${partes[2]}-${partes[1]}-${partes[0]}`;
        }
      }
    }
  } else {
    // Modo Cadastro
    titulo.innerText = "Cadastrar Servidor";
    inputMatricula.disabled = false;
    wrapperAtivo.style.display = "none";
    document.getElementById('serv-ativo').value = "Sim";
    document.getElementById('serv-penalidade-ferias').value = 0;
    document.getElementById('serv-penalidade-abonos').value = 0;
    selecionarLotacaoServidor_(document.getElementById('serv-lotacao').value);
  }
  
  abrirModal('modal-servidor');
  toggleCamposObrigatoriosServidor();
}

/**
 * Alterna a obrigatoriedade dos campos com base no status "Inativo"
 */
function toggleCamposObrigatoriosServidor() {
  const isAtivo = document.getElementById('serv-ativo').value !== 'Não';
  const camposRequired = ['serv-matricula', 'serv-situacao', 'serv-nome', 'serv-email'];
  camposRequired.forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.required = isAtivo;
    }
  });
}


/**
 * Envia os dados do formulário de servidor ao backend do Apps Script
 */
function salvarDadosServidor(event) {
  event.preventDefault();
  const botaoSalvar = event.submitter || document.getElementById('btn-servidor-salvar');
  if (!iniciarOperacaoInterface('salvar-servidor', botaoSalvar, 'Salvando...')) return;

  try {
  exibirLoader(true);

  const lotacao = obterLotacaoFormularioServidor_();
  if (!lotacao) {
    exibirLoader(false);
    mostrarToast('Informe o nome da nova lotação antes de salvar.', 'warning');
    return;
  }
  
  const dados = {
    matricula: document.getElementById('serv-matricula').value.trim(),
    pis: document.getElementById('serv-pis').value.replace(/\D/g, ''),
    nome: document.getElementById('serv-nome').value.trim().toUpperCase(),
    cargo: document.getElementById('serv-cargo').value.trim().toUpperCase(),
    lotacao: lotacao,
    admissao: document.getElementById('serv-admissao').value,
    situacao: document.getElementById('serv-situacao').value,
    email: document.getElementById('serv-email').value.trim(),
    ativo: document.getElementById('serv-ativo').value,
    penalidadeFerias: parseInt(document.getElementById('serv-penalidade-ferias').value) || 0,
    penalidadeAbono: parseInt(document.getElementById('serv-penalidade-abonos').value) || 0
  };
  
  if (typeof google === "undefined" || !google.script) {
    mostrarToast("Dados salvos em modo simulação local!", 'warning');
    exibirLoader(false);
    fecharModal('modal-servidor');
    return;
  }
  
  // Otimista: fecha modal e atualiza UI imediatamente
  exibirLoader(false);
  fecharModal('modal-servidor');
  mostrarToast("Servidor salvo! Sincronizando...", 'success');

  // Enfileira operação para o servidor
  SyncQueue.enfileirar('salvar_servidor', 'salvarServidor', [dados], 'Salvar servidor ' + dados.nome);
  carregarListaServidores();
  } finally {
    finalizarOperacaoInterface('salvar-servidor', botaoSalvar);
  }
}

/**
 * Aciona a desativação lógica (soft delete) do servidor
 */
async function confirmarDesativacaoServidor(matricula, nome) {
  if (await abrirConfirm(`Atenção!\n\nVocê tem certeza que deseja DESATIVAR o cadastro do servidor ${nome} (Matrícula: ${matricula})?\n\nEle não aparecerá mais nos formulários ativos, mas todo o histórico dele na planilha será preservado.`)) {

      mostrarToast("Servidor desativado em modo de simulação local!", 'warning');
      exibirLoader(false);
      return;
    }
    
    backendApi()
      .withSuccessHandler(function() {
        exibirLoader(false);
        mostrarToast("Cadastro de servidor desativado com sucesso!", 'success');

/**
 * Controla a navegação das abas dentro da Ficha do Servidor
 */
function alternarAbaFicha(idAba) {
  document.querySelectorAll('#modal-ficha-servidor .tab-button').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('#modal-ficha-servidor .tab-panel').forEach(panel => panel.classList.remove('active'));
  
  // Ativa botão clicado
  const btnAlvo = Array.from(document.querySelectorAll('#modal-ficha-servidor .tab-button')).find(btn => 
    btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(`'${idAba}'`)
  );
  if (btnAlvo) btnAlvo.classList.add('active');
  
  // Ativa painel correspondente
  const painel = document.getElementById(idAba);
  if (painel) painel.classList.add('active');
}

/**
 * Abre a Ficha Individual Detalhada do Servidor e carrega seus períodos de férias e lançamentos
 */
function abrirFichaServidor(matricula) {
  const s = AppState.servidores.find(serv => serv.matricula === matricula);
  if (!s) return;
  
  // 1. Limpar abas para o estado inicial
  alternarAbaFicha('tab-dados');
  
  // 2. Preencher Dados de Cadastro
  document.getElementById('ficha-nome').innerText = s.nome;
  document.getElementById('ficha-cargo').innerText = s.cargo || 'Não cadastrado';
  document.getElementById('ficha-lotacao').innerText = s.lotacao || 'Não cadastrado';
  document.getElementById('ficha-matricula').innerText = s.matricula;
  
  document.getElementById('ficha-dados-situacao').innerText = s.situacao;
  document.getElementById('ficha-dados-admissao').innerText = s.admissao || 'Não informada';
  document.getElementById('ficha-dados-email').innerText = s.email || 'Não informado';
  
  const statusBadge = document.getElementById('ficha-dados-status');
  statusBadge.className = "badge";
  if (s.status === 'Ativo') {
    statusBadge.classList.add('badge-ativo');
    statusBadge.innerText = 'ATIVO';
  } else if (s.status === 'Férias') {
    statusBadge.classList.add('badge-ferias');
    statusBadge.innerText = 'FÉRIAS';
  } else if (s.status === 'Abono') {
    statusBadge.classList.add('badge-abono');
    statusBadge.innerText = 'ABONO';
  } else {
    statusBadge.classList.add('badge-inativo');
    statusBadge.innerText = 'INATIVO';
  }
  
  // 3. Preencher Saldo de Férias do cabeçalho
  document.getElementById('ficha-ferias-saldo').innerText = s.saldoHoje + " dias";
  
  // 4. Renderizar os períodos aquisitivos calculados no servidor.
  const gridPeriodos = document.getElementById('ficha-ferias-periodos');
  gridPeriodos.innerHTML = "";
  
  if (Array.isArray(s.periodosFerias) && s.periodosFerias.length > 0) {
    s.periodosFerias.forEach(periodo => {
      const percentualUso = periodo.diasOriginais > 0
        ? Math.round((periodo.diasUsados / periodo.diasOriginais) * 100)
        : 0;
      const futuro = periodo.status === "Em aquisição";
      const usufruido = periodo.status === "Usufruído";
      const badgeClass = futuro ? "badge-abono" : (usufruido ? "badge-inativo" : "badge-ativo");
      const fillClass = usufruido ? "fill-usufruido" : "fill-disponivel";

      gridPeriodos.innerHTML += `
        <div class="period-card">
          <div class="period-header">
            <span class="period-title">${escapeHtml(periodo.referencia)}</span>
            <span class="badge ${badgeClass}">${escapeHtml(periodo.status)}</span>
          </div>
          <div class="period-dates">Liberação: ${escapeHtml(periodo.dataLiberacao)}</div>
          <div class="period-dates">Usados: ${periodo.diasUsados} d | Saldo: ${periodo.saldo} d</div>
          <div class="period-status-bar">
            <div class="period-status-fill ${fillClass}" style="width:${Math.min(100, percentualUso)}% !important"></div>
          </div>
          <div class="period-legend">
            <span>0%</span><span>${percentualUso}% utilizado</span><span>100%</span>
          </div>
        </div>`;
    });
  } else if (s.infoFerias) {
    // Compatibilidade com planilhas antigas que possuíam a fórmula Info_Férias.
    // Processamento do texto estruturado
    // Ex: "[AVISO] ATENÇÃO: 1 Período vencido. | Saldo: 30 dias | Próx (+30): 30/03/2027"
    let partes = s.infoFerias.split('|');
    partes.forEach((p, idx) => {
      let texto = p.trim();
      if (!texto) return;
      
      let cardClass = "";
      let fillClass = "fill-disponivel";
      let statusTexto = "Disponível";
      
      if (texto.toLowerCase().includes("vencido") || texto.toLowerCase().includes("crítico")) {
        cardClass = "style='border-color: rgba(247, 90, 90, 0.4); background-color: rgba(247, 90, 90, 0.02);'";
        fillClass = "fill-vencido";
        statusTexto = "Vencido (Compulsório)";
      } else if (texto.toLowerCase().includes("próx") || texto.toLowerCase().includes("projetado")) {
        cardClass = "";
        fillClass = "fill-usufruido";
        statusTexto = "Em Aquisição";
      }
      
      gridPeriodos.innerHTML += `         <div class="period-card" ${cardClass}>           <div class="period-header">             <span class="period-title">${texto.split(':')[0] || 'Período'}</span>             <span class="badge ${fillClass === 'fill-vencido' ? 'badge-ferias' : 'badge-ativo'}">${statusTexto}</span>           </div>           <div class="period-dates">${texto.includes(':') ? texto.split(':')[1] : texto}</div>           <div class="period-status-bar">             <div class="period-status-fill ${fillClass}"></div>           </div>           <div class="period-legend">             <span>0%</span>             <span>Uso</span>             <span>100%</span>           </div>         </div>       `;
    });
  }
  
  if (gridPeriodos.innerHTML === "") {
    gridPeriodos.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); font-size: 13px;">Nenhum período de férias registrado ou processado.</div>`;
  }
  
  // 5. Carregar Lançamentos/Ausências Históricas no modal
  const tabelaHist = document.getElementById('ficha-historico-tabela');
  tabelaHist.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">Buscando histórico...</td></tr>`;

  if (elNataliciasInit) elNataliciasInit.innerHTML = '<i class="fas fa-circle-notch fa-spin" style="font-size: 16px; color: var(--text-muted);"></i>';
  
  if (typeof google !== "undefined" && google.script) {
    backendApi()
      .withSuccessHandler(function(historico) {
        historico = Array.isArray(historico) ? historico : [];
        let anoAtual = new Date().getFullYear();
        let contAbonadasNormais = 0;
        let contAbonadasNatalicias = 0;

        if (historico.length === 0) {
          tabelaHist.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Nenhum lançamento registrado no histórico.</td></tr>`;
        } else {
          let html = "";

            if (!AppState.lancamentos.some(lanc => lanc.linhaPlanilha === l.linhaPlanilha)) {

              if (l.dataInicio && l.dataInicio.includes(anoAtual)) {

                } else if (l.tipo.toLowerCase().includes("natalícia") || l.tipo.toLowerCase().includes("natalicia")) {
                  contAbonadasNatalicias += parseInt(l.dias) || 1;
                } else if (l.tipo.toLowerCase().includes("abonada") || l.tipo.toLowerCase().includes("abono")) {
                  contAbonadasNormais += parseInt(l.dias) || 1;
                }
              }

            let statusClass = "badge-neutral";
            let statusText = "Ativo";
            if (l.tipo.toLowerCase().includes("não efetivado") || l.tipo.toLowerCase().includes("anulado")) {
              statusClass = "badge-inativo";

              <td>

  } else {

  abrirModal('modal-ficha-servidor');

/**
 * Renderiza linhas da tabela de Lançamentos
 */
function formatarQuantidadeLancamento(lancamento) {
  const diasGozo = parseInt(lancamento && lancamento.dias, 10) || 0;
  const diasPecunia = parseInt(lancamento && lancamento.diasPecunia, 10) || 0;
  if (diasPecunia > 0) return `${diasGozo} gozo + ${diasPecunia} pecúnia`;
  if (diasGozo > 0) return `${diasGozo} dias`;
  return escapeHtml((lancamento && lancamento.qtdHoras) || '-');
}

function renderizarTabelaLancamentos(listaFiltrada, mantemPagina = false) {
  const listaOriginal = Array.isArray(listaFiltrada)
    ? listaFiltrada
    : (Array.isArray(AppState.lancamentos) ? AppState.lancamentos : []);
  const tbody = document.getElementById('tabela-lancamentos-body');
  
  if (!mantemPagina) {
    AppState.paginacao.lancamentos.listaAtual = listaOriginal;
    AppState.paginacao.lancamentos.paginaAtual = 1;
  }
  
  const estado = AppState.paginacao.lancamentos;
  const totalItens = estado.listaAtual.length;
  
  if (totalItens === 0) {
    tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; color: var(--text-secondary);">Nenhum lançamento encontrado.</td></tr>`;
    renderizarControlesPaginacao('paginacao-lancamentos', 'lancamentos', 0);
    return;
  }
  
  const start = (estado.paginaAtual - 1) * estado.itensPorPagina;
  const lancamentos = estado.listaAtual.slice(start, start + estado.itensPorPagina);
  
  let html = "";
  lancamentos.forEach(l => {
    let badgeClass = "badge-ativo";
    if (l.status === "Anulado") {
      badgeClass = "badge-inativo";
    }
    
    // Verifica se possui anexos vinculados
    const possuiAnexos = l.anexo1 || l.anexo2 || l.anexo3;
    let dataShow = l.dataInicio;
    if (l.tipo === "Autorização de Horas Extras" && !dataShow) {
      if (l.mes && l.ano) dataShow = `${l.mes}/${l.ano}`;
      else if (l.mes) dataShow = l.mes;
      else if (l.ano) dataShow = l.ano;
      else dataShow = "-";
    }
    
    html += `<tr>
      <td>
        <div style="display: flex; gap: 4px; justify-content: center;">
          <button class="btn-action" data-action="view-lanc" data-linha="${l.linhaPlanilha}" title="Visualizar Lançamento">
            <span data-lucide="eye" style="width: 14px; height: 14px;"></span>
          </button>
          ${(!l.idoc || l.idoc.trim() === "") ? `
          <button class="btn-action" data-action="quick-1doc" data-linha="${l.linhaPlanilha}" data-nome="${escapeHtml(l.nome)}" data-idoc="${escapeHtml(l.idoc || '')}" title="Preencher 1Doc Rápido" style="color: var(--brand-primary);">
            <span data-lucide="file-signature" style="width: 14px; height: 14px;"></span>
          </button>` : ''}
        </div>
      </td>
      <td><strong>${escapeHtml(l.idoc)}</strong></td>
      <td>${escapeHtml(l.dataSolicitacao)}</td>
      <td>${escapeHtml(l.tipo)}</td>
      <td>${escapeHtml(l.nome)} <br><small>(${escapeHtml(l.matricula)})</small></td>
      <td>${escapeHtml(dataShow)}</td>
      <td style="text-align: center;">${formatarQuantidadeLancamento(l)}</td>
      <td><span class="badge ${badgeClass}">${escapeHtml(l.status)}</span></td>
      <td>
        <div class="action-buttons" style="justify-content: flex-end;">
          ${possuiAnexos ? `<button class="btn-action" data-action="ver-anexos" data-a1="${escapeHtml(l.anexo1)}" data-a2="${escapeHtml(l.anexo2)}" data-a3="${escapeHtml(l.anexo3)}" title="Visualizar Anexos"><span data-lucide="paperclip" style="width: 14px; height: 14px;"></span></button>` : ''}
          <button class="btn-action" data-action="editar-lanc" data-linha="${l.linhaPlanilha}" title="Editar Tudo">
            <span data-lucide="edit-2" style="width: 14px; height: 14px;"></span>
          </button>
        </div>
      </td>
    </tr>`;
  });

  tbody.innerHTML = html;
  tbody.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      const action = this.dataset.action;
      if (action === 'ver-anexos') visualizarAnexos(this.dataset.a1, this.dataset.a2, this.dataset.a3);
      else if (action === 'editar-lanc') abrirModalLancamento(parseInt(this.dataset.linha));
      else if (action === 'view-lanc') abrirViewLancamento(parseInt(this.dataset.linha));
      else if (action === 'quick-1doc') abrirModalQuick1Doc(parseInt(this.dataset.linha), this.dataset.nome, this.dataset.idoc);
    });
  });
  renderizarIcones();
}

/**
 * Filtra a tabela de lançamentos de RH em tempo real
 */
function filtrarTabelaLancamentos() {
  const busca = document.getElementById('filtro-busca-lancamento').value.toLowerCase().trim();
  const tipo = document.getElementById('filtro-tipo-lancamento').value;
  const status = document.getElementById('filtro-status-lancamento').value;
  
  const filtrados = AppState.lancamentos.filter(l => {
    const bateBusca = !busca || l.nome.toLowerCase().includes(busca) || l.matricula.toLowerCase().includes(busca) || l.idoc.toLowerCase().includes(busca);
    const bateTipo = !tipo || l.tipo === tipo;
    
    let bateStatus = false;
    if (!status) {
      bateStatus = true;
    } else if (status === "SEM 1DOC") {
      let ehSemDoc = (!l.idoc || l.idoc.trim() === "");
      if (ehSemDoc) {
        let diffDias = 0;
        if (l.dataSolicitacao) {
          const partes = l.dataSolicitacao.split('/');
          if (partes.length === 3) {
            const dataLanc = new Date(partes[2], partes[1] - 1, partes[0]);
            diffDias = (new Date().getTime() - dataLanc.getTime()) / (1000 * 3600 * 24);
          }
        }
        bateStatus = diffDias <= 365;
      } else {
        bateStatus = false;
      }
    } else {
      bateStatus = l.status === status;
    }
    
    return bateBusca && bateTipo && bateStatus;
  });
  
  renderizarTabelaLancamentos(filtrados);
}

  blocoFalta.style.display = "none";
  blocoHoras.style.display = "none";
  blocoDiasPecunia.style.display = "none";

  } else {

/**
 * Sugere um texto para o campo Despacho baseado no servidor e tipo selecionados
 */
function sugerirDespacho() {
  const tipo = document.getElementById('lanc-tipo').value;
  const matricula = document.getElementById('lanc-matricula').value;
  const campoDespacho = document.getElementById('lanc-despacho');
  
  // Só preenche automaticamente se estiver vazio ou se foi preenchido automaticamente antes
  if (campoDespacho.value !== "" && !campoDespacho.dataset.autoFilled) {
    return;
  }

  if (!matricula) return;
  
  const servidor = AppState.servidores.find(s => s.matricula === matricula);
  if (!servidor) return;

  let texto = "";
  
  if (tipo.toLowerCase().includes("férias") || tipo.toLowerCase().includes("ferias")) {
    const diasGozo = parseInt(document.getElementById('lanc-dias').value) || 0;
    const diasPecunia = tipo === "Férias (1/3 Pecúnia)"
      ? (parseInt(document.getElementById('lanc-dias-pecunia').value) || 0)
      : 0;
    const diasInput = diasGozo + diasPecunia;
    const saldo = parseInt(servidor.saldoHoje) || 0;
    const restante = Math.max(0, saldo - diasInput);
    texto = diasPecunia > 0
      ? `Possuía ${saldo} dias disponíveis. Solicitou ${diasGozo} dias de gozo e ${diasPecunia} dias em pecúnia, totalizando ${diasInput} dias. Restam ${restante} dias.`
      : `Possuía ${saldo} dias disponíveis. Solicitou ${diasInput} dias. Restam ${restante} dias.`;
    
  } else if ((tipo.toLowerCase().includes("abonada") || tipo.toLowerCase().includes("abono")) && !tipo.toLowerCase().includes("natal") && !tipo.toLowerCase().includes("eleitor")) {
    const usados = parseInt(servidor.abonosUsados) || 0;
    const novoUsado = usados + 1;
    const limite = 5; // Padrão
    const restante = Math.max(0, limite - novoUsado);
    texto = `Possuía direito a ${limite} abonadas. Solicitou a ${novoUsado}ª abonada. Restam ${restante}.`;
  } else if (tipo === "Autorização de Horas Extras") {
    const qtdHoras = document.getElementById('lanc-qtd-horas').value || "0";
    const mes = document.getElementById('lanc-mes-he').value;
    const ano = document.getElementById('lanc-ano-he').value;
    
    let mesAnoTxt = "";
    if (mes && ano) mesAnoTxt = ` referentes a ${mes}/${ano}`;
    else if (mes) mesAnoTxt = ` referentes a ${mes}`;
    else if (ano) mesAnoTxt = ` referentes ao ano ${ano}`;
    
    texto = `Autorização para compensação ou pagamento de ${qtdHoras} horas extras${mesAnoTxt} registrada.`;
  }
  
  if (texto) {
    campoDespacho.value = texto;
    campoDespacho.dataset.autoFilled = "true";
  } else if (campoDespacho.dataset.autoFilled) {
    campoDespacho.value = "";
    delete campoDespacho.dataset.autoFilled;
  }
}

/**

function buscarServidorAutocomplete() {
  const input = document.getElementById('lanc-busca-servidor');
  const listagem = document.getElementById('autocomplete-lista');
  const txtMatricula = document.getElementById('lanc-matricula');
  const painelInfo = document.getElementById('lanc-servidor-info');
  
  const termo = input.value.toLowerCase().trim();
  txtMatricula.value = ""; // Limpa a matrícula até selecionar
  painelInfo.style.display = "none";
  
  if (!termo) {
    listagem.style.display = "none";
    return;
  }
  
  // Filtra servidores ativos apenas
  const sugestoes = AppState.servidores.filter(s => 
    s.status !== 'Inativo' && (s.nome.toLowerCase().includes(termo) || s.matricula.toLowerCase().includes(termo))
  ).slice(0, 5); // Limita em 5 sugestões
  
  if (sugestoes.length === 0) {
    listagem.innerHTML = `<div style="padding: 10px; color: var(--text-muted); font-size: 13px;">Nenhum servidor ativo encontrado.</div>`;
    listagem.style.display = "block";
    return;
  }
  
  let html = "";
  sugestoes.forEach(s => {
    html += `<div style="padding: 10px; cursor: pointer; border-bottom: 1px solid var(--border-color); font-size: 13px;" onclick="selecionarServidorAutocomplete('${s.matricula}', '${s.nome}', '${s.cargo}', '${s.lotacao}', '${s.saldoHoje}', '${s.abonosUsados || 0}')">       <strong>${s.nome}</strong> (Matrícula: ${s.matricula})     </div>`;
  });
  
  listagem.innerHTML = html;
  listagem.style.display = "block";
}

/**
 * Função utilitária para renderizar anexos e resolver caminhos relativos do AppSheet (Drive)
 */
function exibirAnexosNaLista(listaElemento, anexos, modoEdicao) {
  listaElemento.innerHTML = "";
  
  const caminhosValidos = anexos.map(a => String(a || "").trim()).filter(a => a !== "" && a !== "undefined");
  if (caminhosValidos.length === 0) {
    if (!modoEdicao) {
      listaElemento.innerHTML = '<li style="color: var(--text-muted); font-size: 13px;">Nenhum anexo válido encontrado.</li>';
    }
    return;
  }
  
  caminhosValidos.forEach((caminho, index) => {
    const rotulo = `Documento Anexo ${index + 1}`;
    const li = document.createElement('li');
    li.style.marginBottom = "8px";
    
    const a = document.createElement('a');
    a.href = "javascript:void(0)";
    a.onclick = () => baixarAnexoSeguro(caminho, rotulo);
    
    if (modoEdicao) {
      a.style.color = 'var(--primary-color)';
      a.style.textDecoration = 'none';
      a.style.fontWeight = '500';
      a.innerHTML = `<span data-lucide="download" style="width:14px;height:14px;margin-right:4px;vertical-align:middle;"></span>${rotulo}`;
    } else {
      a.className = 'btn btn-secondary';
      a.style.cssText = 'width: 100%; text-align: left; display:flex; align-items:center; gap:8px;';
      a.innerHTML = `<span data-lucide="download" style="width:16px;height:16px;"></span>${rotulo}`;
    }
    
    li.appendChild(a);
    listaElemento.appendChild(li);
  });
}

function baixarAnexoSeguro(caminho, rotulo) {
  exibirLoader(true);
  mostrarToast(`Baixando ${rotulo}...`, "info");
  
  backendApi()
    .withSuccessHandler(function(res) {
      exibirLoader(false);
      try {
        const byteCharacters = atob(res.b64);
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        const blob = new Blob([byteArray], {type: res.mimeType});
        const url = window.URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = res.nome;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
        mostrarToast("Download concluído com sucesso!", "success");
      } catch (err) {
        mostrarToast("Erro ao processar o arquivo baixado.", "error");
      }
    })
    .withFailureHandler(function(e) {
      exibirLoader(false);
      mostrarToast(e.message || "Erro ao baixar o anexo.", "error");
    })
    .obterAnexoBase64(caminho);
}
