<script>
/**
 * Lógica do Cliente (Interface do Usuário)
 * RH Central de Documentos v2.1 — Sync Otimista
 */

const AppState = {
  usuarioLogado: { email: "", nome: "", papel: "Consulta" },
  servidores: [],
  lancamentos: [],
  protocolos: [],
  dashboard: {},
  insightEntidade: null,
  briefingDiarioEntidade: null,
  operacoesPendentes: [],
  mensagemEntidadeOculta: '',
  conviteEntidadePendente: false,
  dadosCompletosCarregados: false,
  cacheRestaurado: false,
  versaoDados: '',
  paginacao: {
    servidores: { paginaAtual: 1, itensPorPagina: 30, listaAtual: [], filtroAssinatura: '' },
    lancamentos: { paginaAtual: 1, itensPorPagina: 30, listaAtual: [], filtroAssinatura: '' },
    protocolos: { paginaAtual: 1, itensPorPagina: 30, listaAtual: [], filtroAssinatura: '' }
  }
};

let currentView = 'dashboard';

// Impede que uma leitura iniciada antes de uma gravação substitua na tela o
// dado que o usuário acabou de salvar. Cada mutação invalida respostas de
// sincronização mais antigas, mesmo que elas terminem alguns segundos depois.
let revisaoMutacoesCliente_ = 0;
let gravacoesBackendEmAndamento_ = 0;
let temporizadorSincronizacaoSegura_ = null;
let carregamentoInicialBancoPendente_ = true;

function ehFuncaoMutacaoBackend_(nome) {
  return /^(salvar|atualizar|desativar|cancelar|remover|excluir|definir|marcar|registrar|resetar|criar|gerar)/i.test(String(nome || ''));
}

function registrarInicioMutacaoBackend_() {
  revisaoMutacoesCliente_++;
  gravacoesBackendEmAndamento_++;
  return revisaoMutacoesCliente_;
}

function registrarFimMutacaoBackend_() {
  gravacoesBackendEmAndamento_ = Math.max(0, gravacoesBackendEmAndamento_ - 1);
}

function existemGravacoesPendentes_() {
  const filaGeralPendente = typeof SyncQueue !== 'undefined' && (SyncQueue.processando || SyncQueue.fila.length > 0);
  const filaRepPendente = typeof repTemAlteracoesPendentes_ === 'function' && repTemAlteracoesPendentes_();
  const filaServidorPendente = Array.isArray(AppState.operacoesPendentes) && AppState.operacoesPendentes.some(function(op) {
    return !/^(CONCLUIDA|CANCELADA)$/i.test(String(op && op.status || ''));
  });
  return gravacoesBackendEmAndamento_ > 0 || filaGeralPendente || filaRepPendente || filaServidorPendente;
}

// Uma fila preservada não é uma gravação em andamento. Bloquear leituras por
// itens apenas aguardando envio cria um impasse na abertura: a base espera a
// fila, enquanto a fila também depende de a sessão terminar de carregar.
function existemGravacoesEmAndamento_() {
  const filaGeralProcessando = typeof SyncQueue !== 'undefined' && SyncQueue.processando;
  const filaRepProcessando = typeof repSalvamentoEmAndamento_ !== 'undefined' && Boolean(repSalvamentoEmAndamento_);
  return gravacoesBackendEmAndamento_ > 0 || filaGeralProcessando || filaRepProcessando;
}

function agendarSincronizacaoSegura_(viewAlvo) {
  if (viewAlvo) sincronizacaoViewPendente = viewAlvo;
  clearTimeout(temporizadorSincronizacaoSegura_);
  temporizadorSincronizacaoSegura_ = setTimeout(function tentarSincronizarSemGravacao() {
    if (existemGravacoesEmAndamento_() || sincronizacaoServidorEmAndamento) {
      temporizadorSincronizacaoSegura_ = setTimeout(tentarSincronizarSemGravacao, 500);
      return;
    }
    const destino = sincronizacaoViewPendente || currentView;
    sincronizacaoViewPendente = null;
    if (carregamentoInicialBancoPendente_) sincronizarDados(true, destino || 'dashboard');
    else sincronizarEmSegundoPlano(destino);
  }, 350);
}

function gerarUuidSeguroCliente_() {
  if (!window.crypto) throw new Error('Este navegador nao oferece geracao segura de identificadores.');
  if (typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
  if (typeof window.crypto.getRandomValues !== 'function') {
    throw new Error('Este navegador nao oferece geracao segura de identificadores.');
  }
  const bytes = new Uint8Array(16);
  window.crypto.getRandomValues(bytes);
  bytes[6] = (bytes[6] & 0x0f) | 0x40;
  bytes[8] = (bytes[8] & 0x3f) | 0x80;
  const hex = Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
  return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
}

function obterChaveFilaSincronizacao_() {
  try {
    const usuario = JSON.parse(localStorage.getItem('rh_user') || '{}');
    const email = String(usuario.email || '').toLowerCase().trim();
    return email ? 'rh_sync_queue_v2_' + encodeURIComponent(email) : '';
  } catch (e) {
    return '';
  }
}

const atividadeSegundoPlano_ = [];
function registrarAtividadeSegundoPlano_(estado, descricao, detalhe) {
  atividadeSegundoPlano_.unshift({ estado: estado, descricao: descricao || 'Atividade do sistema', detalhe: detalhe || '', horario: new Date() });
  if (atividadeSegundoPlano_.length > 30) atividadeSegundoPlano_.length = 30;
  renderizarAtividadeSegundoPlano_();
}

function renderizarAtividadeSegundoPlano_() {
  const container = document.getElementById('fila-sincronizacao-historico');
  if (!container) return;
  if (!atividadeSegundoPlano_.length) {
    container.innerHTML = '<div class="atividade-vazia">Nenhuma atividade em segundo plano nesta sessão.</div>';
    return;
  }
  container.innerHTML = atividadeSegundoPlano_.map(function(item) {
    const hora = item.horario.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    return `<div class="atividade-linha is-${escapeHtml(String(item.estado || '').toLowerCase())}"><time>${hora}</time><span><strong>${escapeHtml(item.descricao)}</strong>${item.detalhe ? `<small>${escapeHtml(item.detalhe)}</small>` : ''}</span></div>`;
  }).join('');
}

// ==========================================
// SYNC QUEUE — Fila de operações pendentes
// ==========================================
const SyncQueue = {
  fila: [],
  processando: false,
  MAX_RETRIES: 5,
  resultados: {},

  enfileirar(tipo, funcaoNome, args, descricao) {
    const operacaoId = args && args[0] && args[0].operacaoId ? String(args[0].operacaoId) : "";
    if (operacaoId) {
      const existente = this.fila.find(item => item.operacaoId === operacaoId);
      if (existente) {
        existente.status = 'pendente';
        existente.ultimoErro = '';
        existente.tentativas = 0;
        this.persistir();
        this.atualizarUI();
        this.processar();
        return existente.id;
      }
    }
    const item = {
      id: gerarUuidSeguroCliente_(),
      tipo: tipo,
      funcaoNome: funcaoNome,
      args: args,
      descricao: descricao || tipo,
      tentativas: 0,
      timestamp: new Date().toISOString(),
      operacaoId: operacaoId,
      status: 'pendente',
      ultimoErro: ''
    };
    this.fila.push(item);
    registrarAtividadeSegundoPlano_('AGUARDANDO', item.descricao, 'Alteração preservada e colocada na fila.');
    this.persistir();
    this.atualizarUI();
    this.processar();
    return item.id;
  },

  processar() {
    if (this.processando || this.fila.length === 0) return;
    // Uma falha que exige revisao nao pode represar alteracoes novas e validas.
    // Mantemos o item com erro preservado, mas processamos o primeiro item apto.
    const indiceItem = this.fila.findIndex(itemFila => itemFila.status !== 'erro');
    if (indiceItem === -1) {
      this.atualizarUI();
      return;
    }
    if (!navigator.onLine) {
      this.atualizarUI();
      return;
    }
    if (typeof google === 'undefined' || !google.script) return;

    this.processando = true;
    const item = this.fila[indiceItem];
    item.tentativas++;
    item.status = 'enviando';
    registrarAtividadeSegundoPlano_('ENVIANDO', item.descricao, `Tentativa ${item.tentativas} de ${this.MAX_RETRIES}.`);
    this.atualizarUI();

    const syncBtn = document.getElementById('btn-sync-icon');
    if (syncBtn) syncBtn.classList.add('spinning');
    
    atualizarTextoSync(`Gravando: ${item.descricao || item.funcaoNome}...`);

    const self = this;
    backendApi()
      .withSuccessHandler(function(resultado) {
        const indiceConcluido = self.fila.findIndex(itemFila => itemFila.id === item.id);
        if (indiceConcluido !== -1) self.fila.splice(indiceConcluido, 1);
        if (item.operacaoId) self.resultados[item.operacaoId] = { sucesso: true, resultado: resultado, concluidoEm: Date.now() };
        self.processando = false;
        self.persistir();
        self.atualizarUI();
        const currBtn = document.getElementById('btn-sync-icon');
        if (currBtn && self.fila.length === 0) currBtn.classList.remove('spinning');
        
        atualizarTextoSync("Operação salva!", true, 'check');
        mostrarToast(`${item.descricao || 'Alteração'} confirmada no servidor.`, 'success');
        registrarAtividadeSegundoPlano_('CONFIRMADA', item.descricao, 'O servidor confirmou a gravação.');

        // Cadastros de servidor são auditados no backend durante a gravação.
        // Consulta imediatamente o novo parecer, sem aguardar o polling de 10 minutos.
        if (item.tipo === 'salvar_lancamento') {
          animarEntidadeOperacao_(item.args && item.args[0] && item.args[0].linhaPlanilha ? 'alteracao' : 'lancamento');
          removerOperacaoPendenteEstado_(item.operacaoId);
          setTimeout(atualizarLeiturasEntidadeAposMudanca_, 1200);
        } else if (item.tipo === 'salvar_servidor') {
          const matriculaSalva = String(item.args && item.args[0] && item.args[0].matricula || '');
          const jaExistia = (AppState.servidores || []).some(function(servidor) {
            return String(servidor.matricula || '') === matriculaSalva;
          });
          animarEntidadeOperacao_(jaExistia ? 'alteracao' : 'lancamento');
          setTimeout(atualizarLeiturasEntidadeAposMudanca_, 1200);
        }
        
        // Processa o próximo da fila
        if (self.fila.length > 0) {
          setTimeout(() => self.processar(), 500);
        } else if (currentView !== 'pre-leitura-rep') {
          // No REP, o recarregamento integral durante a digitação causava travamentos.
          // O monitor de versão buscará mudanças reais da base sem interromper o trabalho.
          sincronizarEmSegundoPlano(currentView);
        }
      })
      .withFailureHandler(function(erro) {
        self.processando = false;
        const detalheErro = mensagemErro(erro);
        const erroTemporario = /sistema ocupado|tente novamente|temporari|timeout|tempo limite|network|rede|service unavailable|internal error|lock/i.test(detalheErro);

        if (item.operacaoId && item.tipo === 'salvar_lancamento') {
          backendApi().registrarFalhaOperacaoPendente(item.operacaoId, detalheErro);
        }

        if (!erroTemporario || item.tentativas >= self.MAX_RETRIES) {
          item.status = 'erro';
          item.ultimoErro = detalheErro;
          if (item.operacaoId) self.resultados[item.operacaoId] = { sucesso: false, erro: detalheErro, concluidoEm: Date.now() };
          mostrarToast(`${item.descricao} não foi confirmado e continua pendente: ${detalheErro}`, 'error');
          atualizarTextoSync(`Pendente: ${item.descricao}`, true, 'warning');
          animarEntidadeOperacao_('falha');
          registrarAtividadeSegundoPlano_('ERRO', item.descricao, detalheErro);
          setTimeout(() => carregarOperacoesPendentesServidor(false), 500);
          setTimeout(() => { if(!self.processando) atualizarTextoSync("", false); }, 5000);
        } else {
          item.status = 'pendente';
          const delay = item.tentativas * 5000; // 5s, 10s, 15s
          registrarAtividadeSegundoPlano_('TENTANDO', item.descricao, `Falha temporária. Nova tentativa em ${delay / 1000}s.`);
          mostrarToast(`Falha temporária. Nova tentativa de ${item.descricao} em ${delay/1000}s...`, 'warning');
          atualizarTextoSync(`Nova tentativa em ${delay/1000}s...`, true, 'warning');
          setTimeout(() => self.processar(), delay);
        }
        self.persistir();
        self.atualizarUI();
        const currBtn = document.getElementById('btn-sync-icon');
        if (currBtn) currBtn.classList.remove('spinning');
      })
      [item.funcaoNome](...item.args);
  },

  persistir() {
    try {
      const chave = obterChaveFilaSincronizacao_();
      if (chave) localStorage.setItem(chave, JSON.stringify(this.fila));
      localStorage.removeItem('rh_sync_queue');
    } catch(e) { console.warn('Erro ao persistir fila:', e); }
  },

  restaurar(processarAutomaticamente = true) {
    try {
      const chave = obterChaveFilaSincronizacao_();
      localStorage.removeItem('rh_sync_queue');
      this.fila = [];
      if (chave) {
        const raw = localStorage.getItem(chave);
        if (raw) this.fila = JSON.parse(raw);
        if (this.fila.length > 0) {
          const bloqueadas = this.fila.filter(item => item.status === 'erro').length;
          mostrarToast(bloqueadas ? `${bloqueadas} operação(ões) ainda não confirmada(s). Clique no aviso para revisar.` : `${this.fila.length} operação(ões) pendente(s) encontrada(s). Sincronizando...`, bloqueadas ? 'warning' : 'info');
          if (this.fila.some(item => item.status !== 'erro') && processarAutomaticamente) setTimeout(() => this.processar(), 2000);
        }
      }
    } catch(e) { this.fila = []; }
  },

  atualizarUI() {
    const barra = document.getElementById('sync-status-bar');
    if (!barra) return;
    barra.onclick = abrirModalFilaSincronizacao;
    barra.style.cursor = 'pointer';
    barra.title = 'Abrir detalhes da sincronização';
    const online = navigator.onLine;
    const pendentes = this.fila.length;

    if (!online) {
      barra.className = 'sync-bar sync-offline';
      barra.innerHTML = '<span data-lucide="wifi-off" style="width:12px;height:12px;"></span> Offline — alterações serão salvas ao reconectar';
      barra.style.display = 'flex';
      atualizarTextoSync("Offline (aguardando rede)", true, 'offline');
    } else if (this.processando) {
      barra.className = 'sync-bar sync-busy';
      barra.innerHTML = '<span class="sync-spinner"></span> Sincronizando ' + (pendentes) + ' operação(ões)...';
      barra.style.display = 'flex';
    } else if (pendentes > 0) {
      const comErro = this.fila.filter(item => item.status === 'erro').length;
      barra.className = 'sync-bar sync-pending';
      barra.innerHTML = '<span data-lucide="alert-circle" style="width:12px;height:12px;"></span> ' + pendentes + ' operação(ões) ' + (comErro ? 'não confirmada(s)' : 'pendente(s)');
      barra.style.display = 'flex';
      barra.style.cursor = 'pointer';
      barra.onclick = abrirModalFilaSincronizacao;
      atualizarTextoSync(`${pendentes} alteração(ões) ainda não confirmada(s)...`, true, 'warning');
    } else {
      const pendentesServidor = (AppState.operacoesPendentes || []).length;
      if (pendentesServidor > 0) {
        barra.className = 'sync-bar sync-pending';
        barra.innerHTML = '<span data-lucide="shield-alert" style="width:12px;height:12px;"></span> ' + pendentesServidor + ' operação(ões) preservada(s) — clique para revisar';
        barra.style.display = 'flex';
        barra.style.cursor = 'pointer';
        barra.onclick = abrirModalFilaSincronizacao;
      } else {
        barra.className = 'sync-bar sync-idle';
        barra.innerHTML = '<span data-lucide="ghost" aria-hidden="true"></span><span class="sr-only">Sem alterações pendentes. Abrir detalhes da sincronização.</span>';
        barra.style.display = 'flex';
      }
      atualizarTextoSync("", false);
    }
    renderizarIcones();
  }
};

function aguardarConfirmacaoFila_(operacaoId, limiteMs) {
  const inicio = Date.now();
  const limite = Math.max(30000, Number(limiteMs || 180000));
  return new Promise(function(resolve, reject) {
    function verificar() {
      const resultado = SyncQueue.resultados[operacaoId];
      if (resultado) {
        delete SyncQueue.resultados[operacaoId];
        if (resultado.sucesso) resolve(resultado.resultado);
        else reject(new Error(resultado.erro || 'A gravação não foi confirmada pelo banco de dados.'));
        return;
      }
      if (Date.now() - inicio >= limite) {
        reject(new Error('A confirmação está demorando além do esperado. A operação permanece preservada na fila de sincronização.'));
        return;
      }
      setTimeout(verificar, 250);
    }
    verificar();
  });
}

function gerarIdOperacaoCliente_() {
  return gerarUuidSeguroCliente_();
}

function chamarBackendPromessa_(funcaoNome, args) {
  return new Promise((resolve, reject) => {
    backendApi()
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      [funcaoNome](...(args || []));
  });
}

function ehErroTemporarioConcorrencia_(erro) {
  const texto = mensagemErro(erro).toLowerCase();
  return /tempo limite do bloqueio|manteve o bloqueio|sistema ocupado|tente novamente|temporari|timeout|lock|service unavailable|internal error|erro interno/.test(texto);
}

/**
 * Repete automaticamente chamadas curtas que falharam apenas porque outro
 * processo estava escrevendo na planilha. O botão permanece travado durante
 * todo o ciclo, portanto um único clique é suficiente.
 */
async function chamarBackendComRetryTemporario_(funcaoNome, args, descricao) {
  const atrasos = [1500, 3000, 6000, 10000];
  let ultimoErro = null;

  for (let tentativa = 0; tentativa <= atrasos.length; tentativa++) {
    try {
      return await chamarBackendPromessa_(funcaoNome, args);
    } catch (erro) {
      ultimoErro = erro;
      if (!ehErroTemporarioConcorrencia_(erro) || tentativa >= atrasos.length) throw erro;

      const espera = atrasos[tentativa];
      const numeroProximaTentativa = tentativa + 2;
      mostrarToast(`${descricao || 'Sistema ocupado'}. Nova tentativa automática ${numeroProximaTentativa}/${atrasos.length + 1} em ${espera / 1000}s...`, 'warning');
      atualizarTextoSync(`Aguardando para tentar novamente em ${espera / 1000}s...`, true, 'warning');
      await new Promise(resolve => setTimeout(resolve, espera));
    }
  }

  throw ultimoErro || new Error('Não foi possível concluir a operação.');
}

function removerOperacaoPendenteEstado_(operacaoId) {
  if (!operacaoId) return;
  AppState.operacoesPendentes = (AppState.operacoesPendentes || []).filter(op => op.idOperacao !== operacaoId);
  SyncQueue.atualizarUI();
}

function carregarOperacoesPendentesServidor(recuperarAutomaticamente = true) {
  if (typeof google === 'undefined' || !google.script || !localStorage.getItem('rh_token')) return;

  backendApi()
    .withSuccessHandler(function(operacoes) {
      AppState.operacoesPendentes = Array.isArray(operacoes) ? operacoes : [];

      if (recuperarAutomaticamente) {
        AppState.operacoesPendentes.forEach(op => {
          const recuperavelAutomaticamente = op.pronta && op.status !== 'ERRO';
          if (recuperavelAutomaticamente && op.payload) {
            SyncQueue.enfileirar(
              op.tipoOperacao,
              op.tipoOperacao === 'salvar_lancamento' ? 'salvarLancamento' : '',
              [op.payload],
              op.descricao || 'Operação recuperada'
            );
          }
        });
      }

      SyncQueue.atualizarUI();
      renderizarFilaSincronizacao_();
      const exigeAtencao = AppState.operacoesPendentes.filter(op => !op.pronta || op.status === 'ERRO').length;
      if (exigeAtencao > 0) {
        mostrarToast(`${exigeAtencao} operação(ões) preservada(s) precisam de atenção.`, 'warning');
      }
    })
    .withFailureHandler(function(erro) {
      console.warn('Não foi possível consultar a fila persistente:', mensagemErro(erro));
    })
    .obterOperacoesPendentesUsuario();
}

function abrirModalFilaSincronizacao() {
  renderizarFilaSincronizacao_();
  abrirModal('modal-fila-sincronizacao');
  carregarOperacoesPendentesServidor(false);
}

function renderizarFilaSincronizacao_() {
  const corpo = document.getElementById('fila-sincronizacao-lista');
  if (!corpo) return;
  renderizarAtividadeSegundoPlano_();
  const operacoesServidor = AppState.operacoesPendentes || [];
  const idsServidor = new Set(operacoesServidor.map(function(op) { return String(op.idOperacao || ''); }));
  const operacoesLocais = SyncQueue.fila.filter(function(item) { return !idsServidor.has(String(item.operacaoId || '')); }).map(function(item) {
    return {
      idOperacao: item.operacaoId || item.id,
      descricao: item.descricao,
      criadoEm: item.timestamp,
      status: item.status === 'erro' ? 'ERRO' : (item.status === 'enviando' ? 'SINCRONIZANDO' : 'PENDENTE_LOCAL'),
      pronta: true,
      payload: item.args && item.args[0],
      ultimoErro: item.ultimoErro || (item.status === 'enviando' ? 'Enviando agora e aguardando confirmação do banco de dados.' : 'Aguardando envio ao banco de dados.'),
      local: true
    };
  });
  const operacoes = operacoesServidor.concat(operacoesLocais);

  if (!operacoes.length) {
    corpo.innerHTML = '<div class="fila-vazia"><span data-lucide="check-circle"></span><strong>Nenhuma operação pendente</strong><small>Todos os documentos foram sincronizados.</small></div>';
    renderizarIcones();
    return;
  }

  corpo.innerHTML = operacoes.map(op => {
    const pronta = Boolean(op.pronta);
    const classe = op.status === 'ERRO' ? 'erro' : (pronta ? 'pronta' : 'incompleta');
    const detalhe = !pronta
      ? `Upload incompleto: ${op.anexosEnviados}/${op.anexosEsperados} anexo(s). Os arquivos já enviados estão preservados.`
      : (op.ultimoErro || 'Pronta para sincronizar.');
    const anexos = Array.isArray(op.anexos) ? op.anexos : [];
    return `<article class="fila-item ${classe}">
      <div class="fila-item-cabecalho">
        <div><strong>${escapeHtml(op.descricao || 'Operação pendente')}</strong><small>${escapeHtml(op.criadoEm || '')} · ${escapeHtml(op.status || '')}</small></div>
        <span class="badge ${op.status === 'ERRO' ? 'badge-inativo' : 'badge-ativo'}">${escapeHtml(op.status || 'PENDENTE')}</span>
      </div>
      <p>${escapeHtml(detalhe)}</p>
      <div class="fila-item-acoes">
        <button class="btn btn-primary btn-small" onclick="tentarNovamenteOperacao('${escapeHtml(op.idOperacao)}')" ${pronta ? '' : 'disabled'}><span data-lucide="refresh-cw"></span>Tentar novamente</button>
        ${anexos.length ? `<button class="btn btn-secondary btn-small" onclick="visualizarAnexosFila('${escapeHtml(op.idOperacao)}')"><span data-lucide="paperclip"></span>Ver anexo</button>` : ''}
        <button class="btn btn-secondary btn-small" onclick="cancelarOperacaoFila('${escapeHtml(op.idOperacao)}')"><span data-lucide="x-circle"></span>Cancelar pendência</button>
      </div>
    </article>`;
  }).join('');
  renderizarIcones();
}

function tentarNovamenteOperacao(operacaoId) {
  const local = SyncQueue.fila.find(item => String(item.operacaoId || item.id) === String(operacaoId));
  if (local) {
    local.status = 'pendente';
    local.ultimoErro = '';
    local.tentativas = 0;
    SyncQueue.persistir();
    SyncQueue.atualizarUI();
    SyncQueue.processar();
    fecharModal('modal-fila-sincronizacao');
    mostrarToast('Operação local recolocada na fila de sincronização.', 'success');
    return;
  }
  const op = (AppState.operacoesPendentes || []).find(item => item.idOperacao === operacaoId);
  if (!op || !op.pronta || !op.payload) {
    mostrarToast('Esta operação ainda não possui todos os anexos necessários.', 'warning');
    return;
  }
  SyncQueue.enfileirar(op.tipoOperacao, 'salvarLancamento', [op.payload], op.descricao || 'Operação recuperada');
  fecharModal('modal-fila-sincronizacao');
  mostrarToast('Operação recolocada na fila de sincronização.', 'success');
}

function visualizarAnexosFila(operacaoId) {
  const op = (AppState.operacoesPendentes || []).find(item => item.idOperacao === operacaoId);
  const anexos = op && Array.isArray(op.anexos) ? op.anexos : [];
  fecharModal('modal-fila-sincronizacao');
  visualizarAnexos(anexos[0] || '', anexos[1] || '', anexos[2] || '');
}

async function cancelarOperacaoFila(operacaoId) {
  const confirmar = await abrirConfirm('Cancelar esta pendência? Os anexos já enviados continuarão preservados no Drive.');
  if (!confirmar) return;
  const local = SyncQueue.fila.find(item => String(item.operacaoId || item.id) === String(operacaoId));
  const servidor = (AppState.operacoesPendentes || []).find(item => String(item.idOperacao) === String(operacaoId));
  if (local && !servidor) {
    SyncQueue.fila = SyncQueue.fila.filter(item => item !== local);
    SyncQueue.persistir();
    SyncQueue.atualizarUI();
    renderizarFilaSincronizacao_();
    mostrarToast('Pendência local cancelada.', 'success');
    return;
  }
  exibirLoader(true);
  backendApi()
    .withSuccessHandler(function() {
      exibirLoader(false);
      SyncQueue.fila = SyncQueue.fila.filter(item => item.operacaoId !== operacaoId);
      SyncQueue.persistir();
      removerOperacaoPendenteEstado_(operacaoId);
      renderizarFilaSincronizacao_();
      mostrarToast('Pendência cancelada. Os anexos foram preservados.', 'success');
    })
    .withFailureHandler(function(erro) {
      exibirLoader(false);
      mostrarToast('Não foi possível cancelar: ' + mensagemErro(erro), 'error');
    })
    .cancelarOperacaoPendente(operacaoId);
}

let filaStatusInsights = [];
let statusAtualSync = false;
let exibindoInsightAtual = false;
let timeoutInsight = null;

function posicionarFalaEntidadeStatus_() {
  const fantasma = document.getElementById('entidade-fab');
  const fala = document.getElementById('sync-detailed-status');
  if (!fantasma || !fala) return;

  const posicaoFantasma = fantasma.getBoundingClientRect();
  const larguraDesejada = Math.min(390, Math.max(180, window.innerWidth - 72));
  const espacoDireita = window.innerWidth - posicaoFantasma.right - 10;
  const usarEsquerda = espacoDireita < Math.min(larguraDesejada, 250) && posicaoFantasma.left > espacoDireita;
  const larguraDisponivel = usarEsquerda
    ? Math.max(170, posicaoFantasma.left - 18)
    : Math.max(170, espacoDireita);
  const largura = Math.min(larguraDesejada, larguraDisponivel);
  const topo = Math.max(4, Math.min(window.innerHeight - 43, posicaoFantasma.top - 3));

  fala.classList.toggle('fala-a-esquerda', usarEsquerda);
  fala.style.width = Math.round(largura) + 'px';
  fala.style.left = Math.round(usarEsquerda ? posicaoFantasma.left - largura - 8 : posicaoFantasma.right + 8) + 'px';
  fala.style.top = Math.round(topo) + 'px';
  fala.style.removeProperty('right');
  fala.style.removeProperty('bottom');
  atualizarRolagemFalaEntidadeStatus_();
}

function atualizarRolagemFalaEntidadeStatus_() {
  const fala = document.getElementById('sync-detailed-status');
  const texto = document.getElementById('sync-detailed-text');
  const trilha = fala && fala.querySelector('.sync-ticker-wrapper');
  if (!fala || !texto || !trilha) return;
  fala.classList.remove('texto-rolando');
  texto.style.removeProperty('--entidade-fala-deslocamento');
  texto.style.removeProperty('--entidade-fala-duracao');
  requestAnimationFrame(function() {
    const deslocamento = Math.ceil(texto.scrollWidth - trilha.clientWidth);
    if (deslocamento <= 4) return;
    texto.style.setProperty('--entidade-fala-deslocamento', '-' + deslocamento + 'px');
    texto.style.setProperty('--entidade-fala-duracao', Math.min(28, Math.max(9, 6 + deslocamento / 24)) + 's');
    fala.classList.add('texto-rolando');
  });
}

function mostrarFalaEntidadeStatus_() {
  const fantasma = document.getElementById('entidade-fab');
  const fala = document.getElementById('sync-detailed-status');
  if (!fantasma || !fala) return;
  if (entidadeChatAberto || entidadeChatAbrindo) {
    posicionarFalaEntidadeStatus_();
    return;
  }
  pararFantasmaErrante_();
  fantasma.classList.remove('roaming', 'passeando', 'leaving', 'exit-left', 'exit-right', 'enter-left', 'enter-right');
  fantasma.classList.add('roaming');
  const base = obterPosicaoBaseFantasma_();
  if (base) {
    fantasma.style.left = Math.round(base.x) + 'px';
    fantasma.style.top = Math.round(base.y) + 'px';
  }
  fantasma.style.display = 'grid';
  fantasma.classList.add('status-speaking', 'enter-left');
  requestAnimationFrame(posicionarFalaEntidadeStatus_);

}

function ocultarFalaEntidadeStatus_() {
  const fantasma = document.getElementById('entidade-fab');
  if (!fantasma) return;
  fantasma.classList.remove('status-speaking', 'enter-left', 'leaving', 'exit-right');
  if (!fantasma.classList.contains('has-notification') && !entidadeChatAberto && !entidadeChatAbrindo) iniciarFantasmaErrante_(false);

function tentarMostrarInsight() {
  if (statusAtualSync) return; // Sistema está usando a barra
  if (exibindoInsightAtual) return; // Já está exibindo um insight
  if (filaStatusInsights.length === 0) return;
  
  let html = filaStatusInsights.shift();
  exibindoInsightAtual = true;
  
  const el = document.getElementById('sync-detailed-status');
  const textEl = document.getElementById('sync-detailed-text');
  
  el.classList.add('entidade-insight');
  el.onclick = function(e) {
    e.preventDefault();
    toggleChatEntidade();
    fecharInsightAtual();
  };
  
  textEl.innerHTML = html;
  const duracaoTicker = Math.min(180, Math.max(22, 8 + String(textEl.textContent || '').length * 0.11));
  textEl.style.setProperty('--entidade-ticker-duration', duracaoTicker + 's');
  el.classList.add('show');
  mostrarFalaEntidadeStatus_();
  renderizarIcones();
  
  timeoutInsight = setTimeout(() => {
    fecharInsightAtual();
  }, (duracaoTicker + 2) * 1000);
}

function fecharInsightAtual() {
  if (!exibindoInsightAtual) return;
  exibindoInsightAtual = false;
  if (timeoutInsight) clearTimeout(timeoutInsight);
  
  const el = document.getElementById('sync-detailed-status');
  el.classList.remove('show');
  ocultarFalaEntidadeStatus_();
  
  setTimeout(() => {
    el.classList.remove('entidade-insight');
    el.onclick = null;
    tentarMostrarInsight();
  }, 500);
}

/**
 * Atualiza o texto explicativo sobre o status de sincronismo no cabeçalho.
 */
function atualizarTextoSync(texto, exibir = true, icone = 'spinner') {
  const el = document.getElementById('sync-detailed-status');
  const textEl = document.getElementById('sync-detailed-text');
  if (!el || !textEl) return;
  
  if (exibir && texto) {
    // Interrompe insight atual se houver e o devolve para o topo da fila
    if (exibindoInsightAtual) {
       filaStatusInsights.unshift(textEl.innerHTML);
       exibindoInsightAtual = false;
       if (timeoutInsight) clearTimeout(timeoutInsight);
       el.classList.remove('entidade-insight');
       el.onclick = null;
    }
    
    statusAtualSync = true;
    
    let prefix = '';
    if (icone === 'spinner') prefix = `<span class="sync-spinner"></span> `;
    else if (icone === 'offline') prefix = `<span data-lucide="wifi-off" style="width: 12px; height: 12px; margin-right: 6px; color: #f87171;"></span> `;
    else if (icone === 'check') prefix = `<span data-lucide="check" style="width: 12px; height: 12px; margin-right: 6px; color: #34d399;"></span> `;
    else if (icone === 'warning') prefix = `<span data-lucide="alert-triangle" style="width: 12px; height: 12px; margin-right: 6px; color: #fbbf24;"></span> `;
    
    textEl.innerHTML = prefix + texto;
    el.classList.add('show');
    mostrarFalaEntidadeStatus_();
    renderizarIcones();
  } else {
    if (statusAtualSync) {
      statusAtualSync = false;
      el.classList.remove('show');
      ocultarFalaEntidadeStatus_();
      setTimeout(() => { 
        if (!el.classList.contains('show')) textEl.innerHTML = ''; 
        tentarMostrarInsight();
      }, 500);
    }
  }
}

// ==========================================
const CACHE_LOCAL_TTL_MS = 30 * 60 * 1000;

function obterEmailCacheLocal_() {
  try {
    const usuario = JSON.parse(localStorage.getItem('rh_user') || '{}');
    return String(usuario.email || '').toLowerCase().trim();
  } catch (e) {
    return '';
  }
}

function obterChaveCacheLocal_() {
  const email = obterEmailCacheLocal_();
  return email ? 'rh_cache_v2_' + encodeURIComponent(email) : '';
}

function limparCacheLocal_() {
  const chave = obterChaveCacheLocal_();
  if (chave) localStorage.removeItem(chave);
  localStorage.removeItem('rh_cache');
}

function salvarCacheLocal() {
  try {
    const email = obterEmailCacheLocal_();
    const chave = obterChaveCacheLocal_();
    if (!email || !chave) return;
    const cacheData = {
      usuarioEmail: email,
      servidores: AppState.servidores,
      lancamentos: AppState.lancamentos,
      protocolos: AppState.protocolos,
      dashboard: AppState.dashboard,
      timestamp: Date.now()
    };
    localStorage.setItem(chave, JSON.stringify(cacheData));
    localStorage.removeItem('rh_cache');
  } catch(e) {
    limparCacheLocal_();
    console.warn('Cache local indisponivel; os dados continuarao vindo do servidor.', e);
  }
}

function restaurarCacheLocal() {
  try {
    localStorage.removeItem('rh_cache');
    const email = obterEmailCacheLocal_();
    const chave = obterChaveCacheLocal_();
    if (!email || !chave) return false;
    const raw = localStorage.getItem(chave);
    if (!raw) return false;
    const cache = JSON.parse(raw);
    const expirado = !cache.timestamp || (Date.now() - Number(cache.timestamp)) > CACHE_LOCAL_TTL_MS;
    const outroUsuario = String(cache.usuarioEmail || '').toLowerCase() !== email;
    if (!Array.isArray(cache.servidores) || expirado || outroUsuario) {
      localStorage.removeItem(chave);
      return false;
    }
    AppState.servidores = cache.servidores || [];
    AppState.lancamentos = cache.lancamentos || [];
    AppState.protocolos = cache.protocolos || [];
    AppState.dashboard = cache.dashboard || {};
    AppState.cacheRestaurado = true;
    return true;
  } catch(e) {
    limparCacheLocal_();
    return false;
  }
}

// Consulta apenas uma versão leve. A base completa só é recarregada quando
// outro usuário realmente grava uma alteração.
let pollingInterval;
let repUltimaSincronizacaoCompartilhadaEm_ = 0;
function iniciarPolling() {
  if (pollingInterval) clearInterval(pollingInterval);
  pollingInterval = setInterval(() => {
    if (!localStorage.getItem('rh_token') || document.visibilityState !== 'visible' || !navigator.onLine || existemGravacoesPendentes_()) return;
    backendApi()
      .withSuccessHandler(function(versao) {
        versao = String(versao || '');
        const mudou = Boolean(versao && AppState.versaoDados && versao !== AppState.versaoDados);
        if (!AppState.versaoDados) AppState.versaoDados = versao;
        const editorRepAtivo = currentView === 'pre-leitura-rep' && (
          document.getElementById('modal-lancamentos-lote-rep')?.dataset.dirty === 'sim' ||
          document.activeElement?.closest?.('#view-pre-leitura-rep input, #view-pre-leitura-rep textarea, #view-pre-leitura-rep select')
        );
        if (editorRepAtivo) return;
        if (currentView === 'pre-leitura-rep' && typeof sincronizarAlteracoesRepSegundoPlano_ === 'function') {
          // Proteção contra atrasos do timestamp do Drive: a cada minuto, busca
          // apenas os dados compartilhados do REP, sem reler arquivos AFD.
          if (mudou || Date.now() - repUltimaSincronizacaoCompartilhadaEm_ >= 60000) sincronizarAlteracoesRepSegundoPlano_(versao);
        } else if (mudou) {
          sincronizarEmSegundoPlano(currentView);
        }
      })
      .withFailureHandler(function(erro) { console.warn('Não foi possível consultar mudanças compartilhadas:', mensagemErro(erro)); })
      .obterVersaoDados();
  }, 30 * 1000);
}

/**
 * Função utilitária global para prevenir injeções de HTML e XSS armazenado
 */
function escapeHtml(unsafe) {
  if (unsafe === undefined || unsafe === null) return '';
  return String(unsafe)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/** Mantém o app funcional mesmo quando o CDN de ícones estiver indisponível. */
function prepararOlhosEntidade_() {
  document.querySelectorAll('#entidade-fab svg, #loader-entidade svg, #dashboard-billboard-entidade svg, #entidade-lab-ghost svg').forEach(function(svg) {
    const paths = Array.from(svg.querySelectorAll('path'));
    paths.forEach(path => path.classList.remove('entidade-olho'));
    const olhos = paths
      .map(path => ({ path: path, tamanho: String(path.getAttribute('d') || '').length }))
      .filter(item => item.tamanho > 0 && item.tamanho <= 24)
      .sort((a, b) => a.tamanho - b.tamanho)
      .slice(0, 2);
    olhos.forEach(item => item.path.classList.add('entidade-olho'));
  });
}

/**
 * Padroniza consultas textuais sem alterar o dado exibido. Com isso, nomes e
 * palavras podem ser encontrados com ou sem acentos e independentemente de
 * maiúsculas, minúsculas ou espaços nas extremidades.
 */
function normalizarTextoBusca(valor) {
  return String(valor == null ? '' : valor)
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .trim();
}

function correspondeBusca(termo, ...valores) {
  const consulta = normalizarTextoBusca(termo);
  return !consulta || valores.some(valor => normalizarTextoBusca(valor).includes(consulta));
}

function renderizarIcones() {
  if (window.lucide && typeof window.lucide.createIcons === 'function') {
    window.lucide.createIcons();
    prepararOlhosEntidade_();
  }
}

function mensagemErro(erro) {
  if (!erro) return "Erro desconhecido.";
  return erro.message || String(erro);
}

const operacoesInterfaceAtivas = new Set();
let proximoZIndexModal = 20000;
const valoresContadoresAnimados_ = new Map();

/** Atualiza totais sem o corte seco: o valor anterior sai e o novo entra dentro do próprio cartão. */
function atualizarContadorAnimado_(elementoOuId, valor, chave) {
  const elemento = typeof elementoOuId === 'string' ? document.getElementById(elementoOuId) : elementoOuId;
  if (!elemento) return;
  const novoValor = String(valor == null ? 0 : valor);
  const identificador = chave || elemento.id;
  const anterior = valoresContadoresAnimados_.get(identificador);
  valoresContadoresAnimados_.set(identificador, novoValor);
  if (anterior == null || anterior === novoValor || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    elemento.textContent = novoValor;
    return;
  }
  elemento.classList.remove('contador-trocando');
  elemento.innerHTML = `<span class="contador-sai">${escapeHtml(anterior)}</span><span class="contador-entra">${escapeHtml(novoValor)}</span>`;
  elemento.classList.add('contador-trocando');
  setTimeout(function() {
    if (valoresContadoresAnimados_.get(identificador) === novoValor) {
      elemento.textContent = novoValor;
      elemento.classList.remove('contador-trocando');
    }
  }, 420);
}

function iniciarOperacaoInterface(chave, botao, texto = 'Processando...') {
  if (operacoesInterfaceAtivas.has(chave)) {
    mostrarToast('Esta operação já está em andamento. Aguarde a conclusão.', 'info');
    return false;
  }

  operacoesInterfaceAtivas.add(chave);
  if (botao) {
    botao._htmlAntesProcessamento = botao.innerHTML;
    botao.disabled = true;
    botao.classList.add('is-processing');
    botao.innerHTML = `<span class="button-spinner" aria-hidden="true"></span>${escapeHtml(texto)}`;
  }
  return true;
}

function finalizarOperacaoInterface(chave, botao) {
  operacoesInterfaceAtivas.delete(chave);
  if (botao) {
    botao.disabled = false;
    botao.classList.remove('is-processing');
    if (botao._htmlAntesProcessamento != null) {
      botao.innerHTML = botao._htmlAntesProcessamento;
      delete botao._htmlAntesProcessamento;
      renderizarIcones();
    }
  }
}

/**
 * Exibe notificação customizada "Toast" e oculta automaticamente
 */
function mostrarToast(mensagem, tipo = 'info') {
  const container = document.getElementById('toast-container');
  if (!container) {
    console.warn('Aviso da interface:', mensagem);
    return;
  }
  
  const toast = document.createElement('div');
  toast.className = `toast toast-${tipo}`;
  
  let icone = 'info';
  if (tipo === 'success') icone = 'check-circle';
  if (tipo === 'error') icone = 'alert-circle';
  if (tipo === 'warning') icone = 'alert-triangle';
  
  toast.innerHTML = `
    <div class="toast-icon">
      <span data-lucide="${icone}"></span>
    </div>
    <div class="toast-content">${escapeHtml(mensagem)}</div>
  `;
  
  container.appendChild(toast);
  renderizarIcones();
  
  setTimeout(() => {
    toast.classList.add('toast-leaving');
    toast.addEventListener('animationend', () => toast.remove());
  }, 4000);
}

/**
 * Exibe um Modal de Confirmação customizado (Retorna Promise<boolean>)
 */
function abrirConfirm(mensagem, titulo = 'Atenção') {
  return new Promise((resolve) => {
    const modal = document.getElementById('modal-confirm');
    if (!modal) {
      resolve(confirm(mensagem));
      return;
    }
    document.getElementById('confirm-title').innerText = titulo;
    document.getElementById('confirm-message').innerText = mensagem;
    
    const btnCancel = document.getElementById('confirm-btn-cancel');
    const btnOk = document.getElementById('confirm-btn-ok');
    
    const fechar = (resultado) => {
      fecharModal('modal-confirm');
      btnCancel.removeEventListener('click', clkCancel);
      btnOk.removeEventListener('click', clkOk);
      resolve(resultado);
    };
    
    const clkCancel = () => fechar(false);
    const clkOk = () => fechar(true);
    
    btnCancel.addEventListener('click', clkCancel);
    btnOk.addEventListener('click', clkOk);
    
    abrirModal('modal-confirm');
  });
}

  document.getElementById('view-title').innerText = titulos[idView] || 'RH Central';
  alternarMenuMobile(false);
  document.querySelector('.view-container')?.scrollTo({ top: 0, behavior: 'smooth' });
  
  // 5. Recarrega os ícones Lucide para garantir renderização correta
  renderizarIcones();
  
  // 6. Carrega os dados específicos da view
  carregarDadosDaView(idView);
  return true;
}

/** LÓGICA DE LOGIN CUSTOMIZADO */

let stepLogin = 1;

function mostrarLogin() {
  document.getElementById('login-container').style.display = 'flex';
  document.getElementById('login-error').style.display = 'none';
  document.getElementById('login-senha-container').style.display = 'none';
  document.getElementById('btn-login-submit').innerText = 'Continuar';
  document.getElementById('login-senha').required = false;
  stepLogin = 1;
  exibirLoader(false);
}

function esconderLogin() {
  document.getElementById('login-container').style.display = 'none';
}

function showError(msg) {
  const el = document.getElementById('login-error');
  el.innerText = msg;
  el.style.display = 'block';
  exibirLoader(false);
}

function processarLogin(e) {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const senhaInput = document.getElementById('login-senha');
  const senha = senhaInput.value;
  const hintEl = document.getElementById('login-senha-hint');
  const labelEl = document.getElementById('label-login-senha');
  const btnSubmit = document.getElementById('btn-login-submit');
  
  if (!email) return;
  
  exibirLoader(true);
  document.getElementById('login-error').style.display = 'none';
  
  if (stepLogin === 1) {
    // Passo 1: Verificar E-mail
    google.script.run
      .withSuccessHandler(function(res) {
        exibirLoader(false);
        stepLogin = 2;
        document.getElementById('login-senha-container').style.display = 'block';
        senhaInput.required = true;
        
        if (res.temSenha) {
          hintEl.style.display = 'none';
          labelEl.innerText = "Senha de Acesso";
          btnSubmit.innerText = "Entrar";
          senhaInput.autocomplete = "current-password";
        } else {
          hintEl.style.display = 'block';
          labelEl.innerText = "Crie uma Senha";
          btnSubmit.innerText = "Criar Senha e Entrar";
          senhaInput.autocomplete = "new-password";
        }
        
        // Foca no input de senha
        setTimeout(() => senhaInput.focus(), 100);
      })
      .withFailureHandler(function(e) {
        showError(e.message || "Erro ao verificar e-mail.");
      })
      .verificarStatusEmail(email);
      
  } else if (stepLogin === 2) {
    // Passo 2: Fazer Login ou Criar Senha
    const isCriandoSenha = hintEl.style.display === 'block';
    
    if (isCriandoSenha) {
      google.script.run
        .withSuccessHandler(function(res) {
          localStorage.setItem('rh_token', res.token);
          localStorage.setItem('rh_user', JSON.stringify(res.usuario));
          esconderLogin();
          inicializarUsuario(false);
        })
        .withFailureHandler(function(e) {
          showError(e.message || "Erro ao criar senha.");
        })
        .definirSenhaPrimeiroAcesso(email, senha);
    } else {
      google.script.run
        .withSuccessHandler(function(res) {
          localStorage.setItem('rh_token', res.token);
          localStorage.setItem('rh_user', JSON.stringify(res.usuario));
          esconderLogin();
          inicializarUsuario(false);
        })
        .withFailureHandler(function(e) {
          showError(e.message || "Senha incorreta.");
        })
        .fazerLogin(email, senha);
    }
  }
}

/** 
 * Wrapper para todas as chamadas de backend que necessitam autenticação.
 */
function backendApi() {
  const token = localStorage.getItem('rh_token');
  let sHandler = function(){};
  let fHandler = function(e){ console.error(e); };
  
  const proxy = new Proxy({}, {
    get: function(target, prop) {
      if (prop === 'withSuccessHandler') {
        return function(fn) { sHandler = fn; return proxy; };
      }
      if (prop === 'withFailureHandler') {
        return function(fn) { fHandler = fn; return proxy; };
      }
      return function(...args) {
        if (!token) {
          fHandler(new Error("Sessão inválida. Faça login."));
          mostrarLogin();
          return;
        }
        const ehMutacao = ehFuncaoMutacaoBackend_(prop);
        if (ehMutacao) registrarInicioMutacaoBackend_();
        const sucessoDaChamada = sHandler;
        const falhaDaChamada = fHandler;
        google.script.run
          .withSuccessHandler(function(resultado) {
            if (ehMutacao) registrarFimMutacaoBackend_();
            sucessoDaChamada(resultado);
          })
          .withFailureHandler(function(e) {
            if (ehMutacao) registrarFimMutacaoBackend_();
            if (e.message && localStorage.getItem('rh_token') === token && (e.message.includes("Sua sessão expirou") || e.message.includes("Token de sessão não fornecido"))) {
              limparCacheLocal_();
              localStorage.removeItem('rh_token');
              localStorage.removeItem('rh_user');
              mostrarLogin();
            }
            falhaDaChamada(e);
          })
          .executarApiBackend(token, prop, args);
      };
    }
  });
  return proxy;
}

/**
 * Busca o usuário atual logado e valida sessão
 */
function inicializarUsuario(temCache) {
  const token = localStorage.getItem('rh_token');
  const userJson = localStorage.getItem('rh_user');
  
  if (!token || !userJson) {
    mostrarLogin();
    return;
  }
  
  try {
    AppState.usuarioLogado = JSON.parse(userJson);
    // Primeiro lê a base. As filas recuperadas começam a enviar somente após
    // essa leitura, evitando saturar o Apps Script durante a abertura.
    SyncQueue.restaurar(false);
    if (typeof restaurarFilaRep_ === 'function') restaurarFilaRep_(false);
    SyncQueue.atualizarUI();
  } catch(e) {
    mostrarLogin();
    return;
  }
  
  atualizarBarraUsuario();
  if (AppState.usuarioLogado.papel === "Administrador" || AppState.usuarioLogado.papel === "Admin") {
    document.querySelectorAll('.admin-only').forEach(el => el.style.removeProperty('display'));
  }

  // Verifica a sessão mantendo a interface bloqueada até a leitura do banco.
  carregamentoInicialBancoPendente_ = true;
  exibirLoader(true, 'Carregando informações atuais do banco de dados...');
  
  let sessaoRespondeu = false;
  const limiteSessao = setTimeout(function() {
    if (sessaoRespondeu) return;
    carregamentoInicialBancoPendente_ = false;
    exibirLoader(false);
    if (AppState.cacheRestaurado || temCache) {
      popularFiltroLotacoes();
      carregarDadosDaView('dashboard');
      atualizarTextoSync('Google demorou a responder — exibindo a última cópia salva', true, 'warning');
      mostrarToast('A abertura foi liberada com a última cópia salva. As pendências continuam protegidas e serão enviadas quando o Google responder.', 'warning');
    } else {
      atualizarTextoSync('Google ainda não respondeu — tente atualizar em alguns instantes', true, 'warning');
      mostrarToast('O Google não respondeu à abertura. A tela foi liberada, mas nenhuma pendência foi apagada.', 'error');
    }
  }, 30000);

  google.script.run
    .withSuccessHandler(function(usuario) {
      sessaoRespondeu = true;
      clearTimeout(limiteSessao);
      AppState.usuarioLogado = usuario;
      localStorage.setItem('rh_user', JSON.stringify(usuario));
      atualizarBarraUsuario();
      sincronizarDados(true, 'dashboard');
    })
    .withFailureHandler(function(erro) {
      sessaoRespondeu = true;
      clearTimeout(limiteSessao);
      console.error("Sessão inválida:", erro);
      if (localStorage.getItem('rh_token') !== token) return;
      limparCacheLocal_();
      localStorage.removeItem('rh_token');
      localStorage.removeItem('rh_user');
      mostrarLogin();
      showError('Não foi possível manter a sessão: ' + mensagemErro(erro));
      exibirLoader(false);
    })
    .verificarSessao(token);
}

/**
 * Sincronização INICIAL ou forçada (com loader pesado).
 * Só deve ser chamada no boot da aplicação ou ao limpar cache explicitamente.
 */
let sincronizacaoServidorEmAndamento = false;
let sincronizacaoViewPendente = null;
let sincronizacaoCompletaSequencia_ = 0;

function reservarSincronizacaoServidor_(viewAlvo) {
  if (existemGravacoesEmAndamento_()) {
    agendarSincronizacaoSegura_(viewAlvo || currentView);
    return false;
  }
  if (sincronizacaoServidorEmAndamento) {
    if (viewAlvo) sincronizacaoViewPendente = viewAlvo;
    return false;
  }
  sincronizacaoServidorEmAndamento = true;
  return true;
}

function concluirSincronizacaoServidor_(viewAlvo) {
  sincronizacaoServidorEmAndamento = false;
  const viewFinal = sincronizacaoViewPendente || viewAlvo || null;
  sincronizacaoViewPendente = null;
  return viewFinal;
}

let filasAposCargaInicialIniciadas_ = false;
function iniciarFilasAposCargaInicial_() {
  if (filasAposCargaInicialIniciadas_) return;
  filasAposCargaInicialIniciadas_ = true;
  carregarOperacoesPendentesServidor(true);
  if (SyncQueue.fila.some(item => item.status !== 'erro') && !SyncQueue.processando) {
    setTimeout(function() { SyncQueue.processar(); }, 350);
  }
  if (typeof liberarFilaRepRestaurada_ === 'function') liberarFilaRepRestaurada_();
}

function sincronizarDados(forcarUpdate = false, viewAlvo = null) {
  if (typeof google === "undefined" || !google.script) return;
  
  if (!forcarUpdate && AppState.dadosCompletosCarregados) {
    if (viewAlvo) carregarDadosDaView(viewAlvo);
    return;
  }
  
  if (!reservarSincronizacaoServidor_(viewAlvo)) {
    if (!carregamentoInicialBancoPendente_) exibirLoader(false);
    else atualizarTextoSync('Aguardando gravações pendentes antes de carregar a base...', true, 'warning');
    return;
  }
  const revisaoAoIniciar = revisaoMutacoesCliente_;
  const sequenciaSincronizacao = ++sincronizacaoCompletaSequencia_;
  let respostaEncerrada = false;
  const limiteSincronizacao = setTimeout(function() {
    if (respostaEncerrada || sequenciaSincronizacao !== sincronizacaoCompletaSequencia_) return;
    respostaEncerrada = true;
    const viewFinal = concluirSincronizacaoServidor_(viewAlvo);
    carregamentoInicialBancoPendente_ = false;
    AppState.dadosCompletosCarregados = false;
    exibirLoader(false);
    iniciarFilasAposCargaInicial_();
    if (AppState.cacheRestaurado) {
      popularFiltroLotacoes();
      carregarDadosDaView(viewFinal || viewAlvo || 'dashboard');
      atualizarTextoSync('Google demorou a responder — exibindo a última cópia salva', true, 'warning');
      mostrarToast('O Google demorou a responder. A última cópia salva foi aberta; suas pendências continuam protegidas.', 'warning');
    } else {
      atualizarTextoSync('Google demorou a responder — clique em atualizar para tentar novamente', true, 'warning');
      mostrarToast('O carregamento foi liberado porque o Google não respondeu. Clique em atualizar para tentar novamente.', 'error');
    }
  }, 45000);
  const syncBtn = document.getElementById('btn-sync-icon');
  if (syncBtn) syncBtn.classList.add('spinning');
  exibirLoader(true);
  
  atualizarTextoSync("Baixando dados...");
  
  backendApi()
    .withSuccessHandler(function(dados) {
      if (respostaEncerrada) return;
      respostaEncerrada = true;
      clearTimeout(limiteSincronizacao);
      const currBtn = document.getElementById('btn-sync-icon');
      if (currBtn) currBtn.classList.remove('spinning');
      if (revisaoAoIniciar !== revisaoMutacoesCliente_ || existemGravacoesEmAndamento_()) {
        if (!carregamentoInicialBancoPendente_) exibirLoader(false);
        const viewFinalPendente = concluirSincronizacaoServidor_(viewAlvo);
        atualizarTextoSync('Aguardando a gravação terminar...', true, 'warning');
        agendarSincronizacaoSegura_(viewFinalPendente || viewAlvo || currentView);
        return;
      }
      atualizarTextoSync("Sincronizado!", true, 'check');
      setTimeout(() => {
        if (SyncQueue.fila.length === 0 && !SyncQueue.processando) {
          atualizarTextoSync("", false);
        }
      }, 3000);
      AppState.dashboard = dados.dashboard || {};
      AppState.servidores = Array.isArray(dados.servidores) ? dados.servidores : [];
      AppState.lancamentos = Array.isArray(dados.lancamentos) ? dados.lancamentos : [];
      AppState.protocolos = Array.isArray(dados.protocolos) ? dados.protocolos : [];
      AppState.versaoDados = String(dados.versaoDados || AppState.versaoDados || '');
      if (Array.isArray(dados.errosCarga) && dados.errosCarga.length) {
        mostrarToast('A base abriu parcialmente. ' + dados.errosCarga.join(' | '), 'warning');
      }
      AppState.dadosCompletosCarregados = true;
      carregamentoInicialBancoPendente_ = false;
      iniciarFilasAposCargaInicial_();
      popularFiltroLotacoes();
      salvarCacheLocal();
      if (currentView === 'pre-leitura-rep') {
        aplicarCadastroAtualAoRep_();
        if (dadosRepCache && Array.isArray(dadosRepCache.punches) && dadosRepCache.punches.length) atualizarProcessamentoRep({ notificarEntidade: false });
      }
      if (currentView === 'pre-leitura-rep') atualizarApontamentosRepSegundoPlano_();
      exibirLoader(false);
      const viewFinal = concluirSincronizacaoServidor_(viewAlvo);
      if (viewFinal && viewFinal === currentView) {
        carregarDadosDaView(viewFinal);
      } else {
        // A resposta pode chegar depois de o usuário trocar de área.
        // Atualiza somente a tela que continua realmente aberta.
        carregarDadosDaView(currentView);
      }
    })
    .withFailureHandler(function(erro) {
      if (respostaEncerrada) return;
      respostaEncerrada = true;
      clearTimeout(limiteSincronizacao);
      const syncBtn = document.getElementById('btn-sync-icon');
      const currBtn = document.getElementById('btn-sync-icon');
      if (currBtn) currBtn.classList.remove('spinning');
      concluirSincronizacaoServidor_(null);
      if (carregamentoInicialBancoPendente_ && AppState.cacheRestaurado) {
        carregamentoInicialBancoPendente_ = false;
        iniciarFilasAposCargaInicial_();
        AppState.dadosCompletosCarregados = false;
        popularFiltroLotacoes();
        carregarDadosDaView(viewAlvo || 'dashboard');
        exibirLoader(false);
        atualizarTextoSync('Banco indisponível — exibindo a última cópia salva', true, 'warning');
        mostrarToast('Não foi possível acessar o banco agora. A última cópia conhecida foi carregada e uma nova tentativa será feita automaticamente.', 'warning');
        setTimeout(function() { sincronizarEmSegundoPlano(viewAlvo || 'dashboard'); }, 10000);
        return;
      }
      if (carregamentoInicialBancoPendente_) {
        exibirLoader(true, 'Banco temporariamente indisponível. Tentando novamente...');
        atualizarTextoSync('Tentando acessar o banco novamente...', true, 'warning');
        mostrarToast('Não foi possível carregar a base: ' + mensagemErro(erro) + '. O sistema tentará novamente sem abrir uma tela vazia.', 'error');
        setTimeout(function() { sincronizarDados(true, viewAlvo || 'dashboard'); }, 5000);
        return;
      }
      exibirLoader(false);
      atualizarTextoSync("Falha na rede", true, 'warning');
      setTimeout(() => atualizarTextoSync("", false), 5000);
      mostrarToast("Falha ao sincronizar: " + mensagemErro(erro), 'error');
    })
    .obterDadosCompletos();
}

/**
 * Sincronização em SEGUNDO PLANO — não exibe loader pesado.
 * Usada após salvar registros (otimista, como AppSheets).
 * A setinha gira para indicar que está em andamento e para ao finalizar.
 * viewAlvo = aba a ser recarregada ao terminar ('lancamentos', 'servidores', etc)
 */
function sincronizarEmSegundoPlano(viewAlvo = null) {
  if (typeof google === "undefined" || !google.script) return;
  if (!reservarSincronizacaoServidor_(viewAlvo)) return;
  const revisaoAoIniciar = revisaoMutacoesCliente_;
  const syncBtn = document.getElementById('btn-sync-icon');
  if (syncBtn) syncBtn.classList.add('spinning');
  
  atualizarTextoSync("Atualizando dados...");
  registrarAtividadeSegundoPlano_('ATUALIZANDO', 'Atualização dos dados', `Consultando a área ${viewAlvo || currentView || 'atual'}.`);
  
  backendApi()
    .withSuccessHandler(function(dados) {
      const currBtn = document.getElementById('btn-sync-icon');
      if (currBtn) currBtn.classList.remove('spinning');
      if (revisaoAoIniciar !== revisaoMutacoesCliente_ || existemGravacoesEmAndamento_()) {
        const viewFinalPendente = concluirSincronizacaoServidor_(viewAlvo);
        atualizarTextoSync('Aguardando a gravação terminar...', true, 'warning');
        agendarSincronizacaoSegura_(viewFinalPendente || viewAlvo || currentView);
        return;
      }
      atualizarTextoSync("Sincronizado!", true, 'check');
      registrarAtividadeSegundoPlano_('CONFIRMADA', 'Atualização dos dados', 'Informações recebidas e tela atualizada.');
      setTimeout(() => {
        if (SyncQueue.fila.length === 0 && !SyncQueue.processando) {
          atualizarTextoSync("", false);
        }
      }, 3000);
      AppState.dashboard = dados.dashboard || {};
      AppState.servidores = Array.isArray(dados.servidores) ? dados.servidores : [];
      AppState.lancamentos = Array.isArray(dados.lancamentos) ? dados.lancamentos : [];
      AppState.protocolos = Array.isArray(dados.protocolos) ? dados.protocolos : [];
      AppState.versaoDados = String(dados.versaoDados || AppState.versaoDados || '');
      AppState.dadosCompletosCarregados = true;
      popularFiltroLotacoes();
      salvarCacheLocal();
      // O REP fica processado na memória do navegador. Reaplica o cadastro
      // atualizado para refletir um PIS salvo em outra janela sem novo upload.
      if (currentView === 'pre-leitura-rep') {
        aplicarCadastroAtualAoRep_();
        if (dadosRepCache && Array.isArray(dadosRepCache.punches) && dadosRepCache.punches.length) atualizarProcessamentoRep({ notificarEntidade: false });
      }
      if (currentView === 'pre-leitura-rep') atualizarApontamentosRepSegundoPlano_();
      const viewFinal = concluirSincronizacaoServidor_(viewAlvo);
      carregarDadosDaView(viewFinal === currentView ? viewFinal : currentView);
    })
    .withFailureHandler(function(erro) {
      const currBtn = document.getElementById('btn-sync-icon');
      if (currBtn) currBtn.classList.remove('spinning');
      concluirSincronizacaoServidor_(null);
      atualizarTextoSync("Falha na atualização", true, 'warning');
      setTimeout(() => atualizarTextoSync("", false), 5000);
      console.warn("Falha na sincronização em segundo plano:", erro);
      mostrarToast("Atualização em segundo plano falhou. Clique em ⟳ para recarregar.", 'warning');
      registrarAtividadeSegundoPlano_('ERRO', 'Atualização dos dados', mensagemErro(erro));
    })
    .obterDadosCompletos();
}

/**
 * Alterna entre modo claro e escuro
 */
function toggleDarkMode() {
  const body = document.body;
  body.classList.toggle('dark-mode');
  
  const icon = document.getElementById('theme-icon');
  if (icon) {
    if (body.classList.contains('dark-mode')) {
      icon.setAttribute('data-lucide', 'moon');
    } else {
      icon.setAttribute('data-lucide', 'sun');
    }
    renderizarIcones();
  }
  
  const logo = document.getElementById('sidebar-logo');
  if (logo) {
    if (body.classList.contains('dark-mode')) {
      logo.src = 'https://i.ibb.co/v8brz40/manualmarca-pmss25-28-TURISMO-BRANCO.png';
    } else {
      logo.src = 'https://www.turismosaosebastiao.com.br/img/sao-sebastiao/logo-rodape-horizontal.png';
    }
  }
  try { localStorage.setItem('rh-theme', body.classList.contains('dark-mode') ? 'dark' : 'light'); } catch (e) {}
}

function inicializarInterface() {
  try {
    const temaSalvo = localStorage.getItem('rh-theme');
    if (temaSalvo === 'light') document.body.classList.remove('dark-mode');
    if (temaSalvo === 'dark') document.body.classList.add('dark-mode');
  } catch (e) {}

  atualizarDataHoraCabecalho_();
  if (window.relogioCabecalhoTimer) clearInterval(window.relogioCabecalhoTimer);
  window.relogioCabecalhoTimer = setInterval(atualizarDataHoraCabecalho_, 1000);

  atualizarLogoTema();
}

function atualizarDataHoraCabecalho_() {
  const agora = new Date();
  const dataLabel = document.getElementById('current-date-label');
  const horaLabel = document.getElementById('current-time-label');
  if (dataLabel) {
    if (!window.formatadorDataCabecalhoRep_) window.formatadorDataCabecalhoRep_ = new Intl.DateTimeFormat('pt-BR', {
      weekday: 'long', day: '2-digit', month: 'long'
    });
    dataLabel.innerText = window.formatadorDataCabecalhoRep_.format(agora);
  }
  if (horaLabel) {
    if (!window.formatadorHoraCabecalhoRep_) window.formatadorHoraCabecalhoRep_ = new Intl.DateTimeFormat('pt-BR', {
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });
    const hora = window.formatadorHoraCabecalhoRep_.format(agora);
    horaLabel.innerText = hora;
    horaLabel.setAttribute('datetime', agora.toISOString());
  }
}

function atualizarLogoTema() {
  const logo = document.getElementById('sidebar-logo');
  const icon = document.getElementById('theme-icon');
  const escuro = document.body.classList.contains('dark-mode');
  if (logo) logo.src = escuro
    ? 'https://i.ibb.co/v8brz40/manualmarca-pmss25-28-TURISMO-BRANCO.png'
    : 'https://www.turismosaosebastiao.com.br/img/sao-sebastiao/logo-rodape-horizontal.png';

}

function obterPrimeiroNome(nome) {

function atualizarProgressoLoader_(percentual, texto) {
  const alvo = Math.max(0, Math.min(100, Number(percentual) || 0));
  const percText = document.getElementById('loader-percentage');
  const fill = document.getElementById('loader-progress-fill');
  const msgText = document.getElementById('loader-text');
  if (texto && msgText) msgText.innerText = texto;
  if (loaderProgressoAnimacao_) cancelAnimationFrame(loaderProgressoAnimacao_);
  const inicioValor = loaderProgressoAtual_;
  const inicioTempo = performance.now();
  const distancia = Math.abs(alvo - inicioValor);
  const duracao = Math.max(280, Math.min(900, 260 + distancia * 13));
  function animar(agora) {
    const progresso = Math.min(1, (agora - inicioTempo) / duracao);
    const suavizado = 1 - Math.pow(1 - progresso, 3);
    loaderProgressoAtual_ = inicioValor + ((alvo - inicioValor) * suavizado);
    if (percText) percText.innerText = Math.round(loaderProgressoAtual_) + '%';
    if (fill) fill.style.width = loaderProgressoAtual_.toFixed(2) + '%';
    if (progresso < 1) loaderProgressoAnimacao_ = requestAnimationFrame(animar);
    else {
      loaderProgressoAtual_ = alvo;
      loaderProgressoAnimacao_ = null;
    }
  }
  loaderProgressoAnimacao_ = requestAnimationFrame(animar);
}

function reiniciarProgressoLoader_() {
  if (loaderProgressoAnimacao_) cancelAnimationFrame(loaderProgressoAnimacao_);
  loaderProgressoAnimacao_ = null;
  loaderProgressoAtual_ = 0;
  const percText = document.getElementById('loader-percentage');
  const fill = document.getElementById('loader-progress-fill');
  if (percText) percText.innerText = '0%';
  if (fill) fill.style.width = '0%';
}

}

function iniciarFrasesLoaderRep_() {
  clearTimeout(loaderFraseTimer_);
  loaderFrasesExibidas_ = 0;
  const frase = document.getElementById('loader-frase');

  function proxima() {
    if (!frase || loaderFrasesExibidas_ >= disponiveis.length) return;
    const nome = obterPrimeiroNome(AppState.usuarioLogado?.nome || '') || 'você';
    frase.textContent = disponiveis[loaderFrasesExibidas_++].replaceAll('{nome}', nome).replaceAll('REP', 'sistema').replaceAll('AFD', 'arquivo de ponto').replaceAll('hashes', 'informações técnicas').replaceAll('TXT', 'arquivo');
    if (loaderFrasesExibidas_ < disponiveis.length) loaderFraseTimer_ = setTimeout(proxima, 6000);
  }
  proxima();
}

function exibirLoader(mostrar, texto = "Sincronizando base de dados...") {
  const loader = document.getElementById('global-loader');
  const percText = document.getElementById('loader-percentage');
  const msgText = document.getElementById('loader-text');
  const entidadeLoader = document.getElementById('loader-entidade');
  const entidadeNaTela = document.getElementById('entidade-fab');

  if (loader) {
    if (mostrar) {
      const jaVisivel = loader.style.display === 'flex';
      if (loaderHideTimeout) clearTimeout(loaderHideTimeout);
      loader.style.display = 'flex';
      if (!jaVisivel && entidadeLoader) {
        entidadeLoader.classList.remove('saindo', 'entrando');
        requestAnimationFrame(function() {
          if (entidadeNaTela && entidadeNaTela.getBoundingClientRect().width > 0) {
            entidadeNaTela.dataset.visibilidadeAntesLoader = entidadeNaTela.style.visibility || '';
            entidadeNaTela.style.visibility = 'hidden';
          }
          entidadeLoader.classList.add('entrando');
          setTimeout(function() { entidadeLoader.classList.remove('entrando'); }, 620);
        });
      }
      if (msgText) msgText.innerText = texto;
      if (percText && !jaVisivel) {
        reiniciarProgressoLoader_();
        if (currentView !== 'pre-leitura-rep') limparProgressoAfdsLoader_();
        atualizarProgressoLoader_(0, texto);
        if (currentView === 'pre-leitura-rep') iniciarFrasesLoaderRep_();
        else {
          clearTimeout(loaderFraseTimer_);
          const frase = document.getElementById('loader-frase');
          if (frase) frase.textContent = '';
        }
        let perc = 0;
        if (loaderInterval) clearInterval(loaderInterval);
        if (currentView !== 'pre-leitura-rep') {
          loaderInterval = setInterval(() => {
            if (perc < 92) {
              const restante = 92 - perc;
              const inc = Math.max(.45, Math.min(2.6, restante * (.035 + Math.random() * .025)));
              perc = Math.min(92, perc + inc);
              atualizarProgressoLoader_(perc);
            }
          }, 520);
        }
      }
      // Safety net: desliga loader após 30 segundos automaticamente
      if (loaderSafetyTimeout) clearTimeout(loaderSafetyTimeout);
      loaderSafetyTimeout = setTimeout(() => {
        exibirLoader(false);
        console.warn('Loader desligado pelo limite de segurança.');
      }, (currentView === 'pre-leitura-rep' || carregamentoInicialBancoPendente_) ? 5 * 60 * 1000 : 30000);
    } else {
      if (loaderSafetyTimeout) clearTimeout(loaderSafetyTimeout);
      clearTimeout(loaderFraseTimer_);
      atualizarProgressoLoader_(100);
      if (loaderHideTimeout) clearTimeout(loaderHideTimeout);
      if (entidadeLoader) {
        entidadeLoader.classList.remove('entrando', 'saindo');
        void entidadeLoader.offsetWidth;
        entidadeLoader.classList.add('saindo');
      }
      loaderHideTimeout = setTimeout(() => {
        loader.style.display = 'none';
        if (loaderInterval) clearInterval(loaderInterval);
        if (entidadeLoader) entidadeLoader.classList.remove('saindo');
        if (entidadeNaTela && entidadeNaTela.dataset.visibilidadeAntesLoader !== undefined) {
          entidadeNaTela.style.visibility = entidadeNaTela.dataset.visibilidadeAntesLoader;
          delete entidadeNaTela.dataset.visibilidadeAntesLoader;
        }
        limparProgressoAfdsLoader_();
      }, 520);
    }
  }
}

function obterDistribuicaoLotacoesDashboard() {
  const mapa = {};
  (AppState.servidores || []).forEach(function(servidor) {
    if (String(servidor.status || '').toLowerCase() === 'inativo') return;
    const lotacao = String(servidor.lotacao || 'Não informada').trim() || 'Não informada';
    mapa[lotacao] = (mapa[lotacao] || 0) + 1;
  });
  return Object.entries(mapa)
    .map(item => ({ lotacao: item[0], quantidade: item[1] }))
    .sort((a, b) => b.quantidade - a.quantidade || a.lotacao.localeCompare(b.lotacao));
}

function renderizarDistribuicaoLotacoesDashboard() {
  const lista = obterDistribuicaoLotacoesDashboard();
  const total = lista.reduce((soma, item) => soma + item.quantidade, 0);
  const pizza = document.getElementById('dashboard-location-pie');
  const legenda = document.getElementById('dashboard-location-legend');
  const totalEl = document.getElementById('location-chart-total');
  const countEl = document.getElementById('location-chart-count');
  if (totalEl) totalEl.innerText = total;
  if (countEl) countEl.innerText = `${lista.length} ${lista.length === 1 ? 'lotação' : 'lotações'}`;
  if (!pizza || !legenda) return;

  if (!lista.length) {
    pizza.style.background = 'var(--bg-tertiary)';
    pizza.setAttribute('aria-label', 'Nenhuma lotação disponível');
    legenda.innerHTML = '<div class="location-chart-empty">Nenhuma lotação disponível.</div>';
    return;
  }

  const principais = lista.slice(0, 5);
  const quantidadeOutras = lista.slice(5).reduce((soma, item) => soma + item.quantidade, 0);
  const fatias = quantidadeOutras > 0
    ? principais.concat([{ lotacao: 'Outras lotações', quantidade: quantidadeOutras }])
    : principais;
  const cores = ['#10b981', '#22c55e', '#38bdf8', '#818cf8', '#f59e0b', '#64748b'];
  let acumulado = 0;
  const gradiente = fatias.map(function(item, indice) {
    const inicio = acumulado;
    acumulado += (item.quantidade / total) * 100;
    return `${cores[indice]} ${inicio.toFixed(2)}% ${acumulado.toFixed(2)}%`;
  }).join(', ');

  pizza.style.background = `conic-gradient(from -90deg, ${gradiente})`;
  pizza.setAttribute('aria-label', fatias.map(function(item) {
    return `${item.lotacao}: ${item.quantidade}`;
  }).join('; '));

  legenda.innerHTML = fatias.map(function(item, indice) {
    const percentual = Math.round((item.quantidade / total) * 100);
    return `<div class="location-pie-legend-row" title="${escapeHtml(item.lotacao)}: ${item.quantidade} servidores (${percentual}%)">
      <span class="location-pie-dot" style="background:${cores[indice]}"></span>
      <span class="location-pie-label">${escapeHtml(item.lotacao)}</span>
      <strong>${item.quantidade}</strong>
      <small>${percentual}%</small>
    </div>`;
  }).join('');
}

function alertaDashboardEntidadeAcionavel(resposta) {
  const original = String(resposta || '').trim();
  if (!original || /tudo em ordem/i.test(original)) return false;
  const texto = original.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const temProblema = /\b(aguarda|pendente|pendencia|inconsistencia|divergencia|conferir|corrigir|regularizar|vencido|vencimento|atraso|duplicado|faltando|ausente|sem matricula|sem lotacao)\b/.test(texto);
  const temReferencia = /\b(matricula|1doc|campo|motivo|prazo|data)\b/.test(texto)
    || /\b\d+\s+dias?\b/.test(texto)
    || /\b\d{2}[\/-]\d{2}(?:[\/-]\d{2,4})?\b/.test(original);
  return temProblema && temReferencia;
}

function normalizarTextoPainelDashboard_(valor) {
  return String(valor || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().trim();
}

function dataPainelDashboard_(valor) {
  if (valor instanceof Date && !isNaN(valor.getTime())) return new Date(valor.getFullYear(), valor.getMonth(), valor.getDate());
  const texto = String(valor || '').trim().split(' ')[0];
  let partes = texto.split('/');
  if (partes.length === 3) {
    const data = new Date(Number(partes[2]), Number(partes[1]) - 1, Number(partes[0]));
    return isNaN(data.getTime()) ? null : data;
  }
  partes = texto.split('-');
  if (partes.length === 3) {
    const data = new Date(Number(partes[0]), Number(partes[1]) - 1, Number(partes[2]));
    return isNaN(data.getTime()) ? null : data;
  }
  return null;
}

function formatarDataPainelDashboard_(data) {
  return data instanceof Date && !isNaN(data.getTime()) ? data.toLocaleDateString('pt-BR') : '-';
}

function formatarDataComSemanaPainelDashboard_(data) {
  if (!(data instanceof Date) || isNaN(data.getTime())) return '-';
  const diaSemana = data.toLocaleDateString('pt-BR', { weekday: 'long' });
  return `${diaSemana}, ${formatarDataPainelDashboard_(data)}`;
}

function corLotacaoPainelDashboard_(indice, total) {
  const matiz = Math.round((indice * 347 / Math.max(1, total)) % 360);
  return `hsl(${matiz} 72% ${indice % 3 === 0 ? 48 : 58}%)`;
}

function coordenadaGraficoLotacao_(centro, raio, angulo) {
  const radianos = (angulo - 90) * Math.PI / 180;
  return { x: centro + raio * Math.cos(radianos), y: centro + raio * Math.sin(radianos) };
}

function caminhoFatiaGraficoLotacao_(inicio, fim) {
  const centro = 80, raio = 74;
  const a = coordenadaGraficoLotacao_(centro, raio, inicio);
  const b = coordenadaGraficoLotacao_(centro, raio, fim);
  const grandeArco = fim - inicio > 180 ? 1 : 0;
  return `M ${centro} ${centro} L ${a.x.toFixed(2)} ${a.y.toFixed(2)} A ${raio} ${raio} 0 ${grandeArco} 1 ${b.x.toFixed(2)} ${b.y.toFixed(2)} Z`;
}

function cenaLotacoesPainelDashboard_() {
  const lista = obterDistribuicaoLotacoesDashboard();
  const total = lista.reduce((soma, item) => soma + item.quantidade, 0);
  painelDashboardLotacoesAtivas_ = lista.map(function(item, indice) {
    return Object.assign({}, item, { cor: corLotacaoPainelDashboard_(indice, lista.length), percentual: total ? Math.round(item.quantidade / total * 100) : 0 });

  let angulo = 0;
  const fatias = painelDashboardLotacoesAtivas_.map(function(item, indice) {
