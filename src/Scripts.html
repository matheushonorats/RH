<script>
/**
 * Lógica do Cliente (Interface do Usuário)
 * RH Central de Documentos v2.0
 */

// Estado Global do Aplicativo
const AppState = {
  usuarioLogado: {
    email: "",
    nome: "",
    papel: "Consulta"
  },
  servidores: [],
  lancamentos: []
};

// Executa automaticamente ao carregar a página
window.addEventListener('DOMContentLoaded', (event) => {
  // Inicializa os ícones do Lucide
  lucide.createIcons();
  
  // Busca informações do usuário logado no servidor Google
  inicializarUsuario();
});

/**
 * Controla a navegação SPA entre as abas do menu
 */
function navegarPara(idView) {
  // 1. Ocultar todas as views e desativar todos os links
  document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
  document.querySelectorAll('.menu-link').forEach(link => link.classList.remove('active'));
  
  // 2. Mostrar a view selecionada
  const viewAlvo = document.getElementById(`view-${idView}`);
  if (viewAlvo) {
    viewAlvo.classList.add('active');
  }
  
  // 3. Ativar o link clicado
  const linkAtivo = Array.from(document.querySelectorAll('.menu-link')).find(link => 
    link.getAttribute('onclick') && link.getAttribute('onclick').includes(`'${idView}'`)
  );
  if (linkAtivo) {
    linkAtivo.classList.add('active');
  }
  
  // 4. Mudar o título superior da barra
  const titulos = {
    'dashboard': 'Dashboard Geral',
    'servidores': 'Gestão de Servidores',
    'lancamentos': 'Histórico de Lançamentos',
    'protocolos': 'Controle de Protocolos',
    'relatorios': 'Relatórios & Emissão',
    'admin': 'Painel Administrativo'
  };
  document.getElementById('view-title').innerText = titulos[idView] || 'RH Central';
  
  // 5. Recarrega os ícones Lucide para garantir renderização correta
  lucide.createIcons();
  
  // 6. Carrega os dados específicos da view
  carregarDadosDaView(idView);
}

/**
 * Busca o usuário atual logado pelo Google Apps Script
 */
function inicializarUsuario() {
  exibirLoader(true);
  
  // Se estiver rodando fora do Apps Script (teste local no navegador, por exemplo)
  if (typeof google === "undefined" || !google.script) {
    AppState.usuarioLogado = { email: "teste@saosebastiao.sp.gov.br", nome: "Usuário Teste Local", papel: "Administrador" };
    atualizarBarraUsuario();
    exibirLoader(false);
    return;
  }
  
  google.script.run
    .withSuccessHandler(function(usuario) {
      AppState.usuarioLogado = usuario;
      atualizarBarraUsuario();
      
      // Se for Admin, mostra o menu administrativo
      if (usuario.papel === "Administrador" || usuario.papel === "Admin") {
        document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
      }
      
      exibirLoader(false);
      // Carrega o dashboard inicial
      carregarDadosDaView('dashboard');
    })
    .withFailureHandler(function(erro) {
      console.error("Erro ao obter usuário:", erro);
      document.getElementById('current-user-name').innerText = "Acesso Negado";
      document.getElementById('current-user-role').innerText = "Não autorizado";
      exibirLoader(false);
      alert("Erro ao validar credenciais do Google. Verifique se seu e-mail está cadastrado no sistema.");
    })
    .obterDadosUsuarioLogado(); // Essa função será criada no Auth.gs
}

/**
 * Atualiza os textos de identificação do usuário na barra superior
 */
function atualizarBarraUsuario() {
  document.getElementById('current-user-name').innerText = AppState.usuarioLogado.nome;
  document.getElementById('current-user-role').innerText = AppState.usuarioLogado.papel;
}

/**
 * Exibe ou oculta o spinner de carregamento geral
 */
function exibirLoader(mostrar) {
  const loader = document.getElementById('global-loader');
  if (loader) {
    loader.style.display = mostrar ? 'flex' : 'none';
  }
}

/**
 * Carrega ou atualiza os dados dependendo da tela aberta
 */
function carregarDadosDaView(idView) {
  if (idView === 'dashboard') {
    carregarDashboard();
  } else if (idView === 'servidores') {
    carregarListaServidores();
  } else if (idView === 'lancamentos') {
    carregarListaLancamentos();
  }
}

/**
 * Busca dados consolidados para o Dashboard
 */
function carregarDashboard() {
  if (typeof google === "undefined" || !google.script) return;
  
  google.script.run
    .withSuccessHandler(function(resumo) {
      document.getElementById('dash-servidores-ativos').innerText = resumo.ativos || 0;
      document.getElementById('dash-ferias-compulsorias').innerText = resumo.compulsorias || 0;
      document.getElementById('dash-ausentes-hoje').innerText = resumo.ausentesHoje || 0;
      document.getElementById('dash-protocolos-pendentes').innerText = resumo.protocolosPendentes || 0;
      
      // Renderiza tabela de ausências de hoje
      const tabela = document.getElementById('dash-tabela-ausencias');
      if (resumo.listaAusentes && resumo.listaAusentes.length > 0) {
        let html = "";
        resumo.listaAusentes.forEach(a => {
          html += `<tr>
            <td><strong>${a.nome}</strong></td>
            <td>${a.matricula}</td>
            <td>${a.tipo}</td>
            <td>${a.periodo}</td>
            <td style="text-align: center;">${a.dias}</td>
          </tr>`;
        });
        tabela.innerHTML = html;
      } else {
        tabela.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">Nenhuma ausência registrada para hoje.</td></tr>`;
      }
    })
    .obterResumoDashboard(); // Essa função será criada no DashboardService.gs
}

// Controle de Exibição de Modais
function abrirModal(idModal) {
  const modal = document.getElementById(idModal);
  if (modal) {
    modal.classList.add('active');
    lucide.createIcons();
  }
}

function fecharModal(idModal) {
  const modal = document.getElementById(idModal);
  if (modal) {
    modal.classList.remove('active');
  }
}

/**
 * Carrega a lista completa de servidores do backend
 */
function carregarListaServidores() {
  exibirLoader(true);
  
  if (typeof google === "undefined" || !google.script) {
    // Mock local para testes visuais
    AppState.servidores = [
      { nome: "ADIVANESSA PRATES DE ANDRADE", matricula: "86916", cargo: "SERVENTE", lotacao: "Rodoviária", admissao: "30/03/2024", situacao: "ESTATUTÁRIO", email: "vanessaprates@gmail.com", status: "Ativo", saldoHoje: 30, projetado: 30, infoFerias: "⚠️ ATENÇÃO: 1 Período vencido." },
      { nome: "ANDERSON AUGUSTO DOS SANTOS", matricula: "72882", cargo: "ASSESSOR", lotacao: "Turismo", admissao: "01/01/2023", situacao: "COMISSIONADO", email: "anderson@gmail.com", status: "Férias", saldoHoje: 0, projetado: 0, infoFerias: "Regular." }
    ];
    renderizarTabelaServidores();

  google.script.run

    })
    .withFailureHandler(function(erro) {

      exibirLoader(false);

    })

}

/**
 * Renderiza as linhas da tabela de Servidores com base nos dados locais
 */
function renderizarTabelaServidores(listaFiltrada) {
  const servidores = listaFiltrada || AppState.servidores;
  const tbody = document.getElementById('tabela-servidores-body');
  
  if (servidores.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-secondary);">Nenhum servidor encontrado.</td></tr>`;
    return;
  }
  
  let html = "";
  servidores.forEach(s => {
    let badgeClass = "badge-ativo";
    let badgeText = "Ativo";
    
    if (s.status === "Férias") {
      badgeClass = "badge-ferias";
      badgeText = "Em Férias";
    } else if (s.status === "Abono") {
      badgeClass = "badge-abono";
      badgeText = "Em Abono";
    } else if (s.status === "Inativo") {
      badgeClass = "badge-inativo";
      badgeText = "Inativo";
    }
    
    html += `<tr>
      <td><strong>${s.nome}</strong></td>
      <td>${s.matricula}</td>
      <td>${s.cargo}</td>
      <td>${s.lotacao}</td>
      <td>${s.situacao}</td>
      <td><span class="badge ${badgeClass}">${badgeText}</span></td>
      <td>
        <div class="action-buttons">
          <button class="btn-action" onclick="abrirFichaServidor('${s.matricula}')" title="Visualizar Ficha">
            <span data-lucide="eye" style="width: 14px; height: 14px;"></span>
          </button>
          <button class="btn-action" onclick="abrirModalServidor('${s.matricula}')" title="Editar Cadastro">
            <span data-lucide="edit-2" style="width: 14px; height: 14px;"></span>
          </button>
          ${s.status !== 'Inativo' ? `
            <button class="btn-action btn-delete" onclick="confirmarDesativacaoServidor('${s.matricula}', '${s.nome}')" title="Desativar Servidor">
              <span data-lucide="trash-2" style="width: 14px; height: 14px;"></span>
            </button>
          ` : ''}
        </div>
      </td>
    </tr>`;
  });
  
  tbody.innerHTML = html;
  lucide.createIcons();
}

/**
 * Filtra a tabela de servidores em tempo real no lado do cliente
 */
function filtrarTabelaServidores() {
  const busca = document.getElementById('filtro-busca-servidor').value.toLowerCase().trim();
  const lotacao = document.getElementById('filtro-lotacao-servidor').value;
  const situacao = document.getElementById('filtro-situacao-servidor').value;
  const status = document.getElementById('filtro-status-servidor').value;
  
  const filtrados = AppState.servidores.filter(s => {
    // 1. Busca textual (Nome ou Matrícula)
    const bateBusca = !busca || s.nome.toLowerCase().includes(busca) || s.matricula.toLowerCase().includes(busca);
    
    // 2. Filtro de Lotação
    const bateLotacao = !lotacao || s.lotacao === lotacao;
    
    // 3. Filtro de Situação
    const bateSituacao = !situacao || s.situacao === situacao;
    
    // 4. Filtro de Status
    const bateStatus = !status || s.status === status;
    
    return bateBusca && bateLotacao && bateSituacao && bateStatus;
  });
  
  renderizarTabelaServidores(filtrados);
}

/**
 * Popula dinamicamente o select de lotações com base nos cadastros existentes
 */
function popularFiltroLotacoes() {
  const select = document.getElementById('filtro-lotacao-servidor');
  const lotacaoForm = document.getElementById('serv-lotacao');
  
  // Extrai lotações exclusivas
  const lotacoes = [...new Set(AppState.servidores.map(s => s.lotacao).filter(Boolean))].sort();
  
  // Popula filtro da listagem
  let htmlFiltro = '<option value="">Todas Lotações</option>';
  lotacoes.forEach(l => {
    htmlFiltro += `<option value="${l}">${l}</option>`;
  });
  select.innerHTML = htmlFiltro;
  
  // Popula dropdown do formulário
  let htmlForm = '';
  lotacoes.forEach(l => {
    htmlForm += `<option value="${l}">${l}</option>`;
  });
  if (!lotacoes.includes("Turismo")) htmlForm += '<option value="Turismo">Turismo</option>';
  if (!lotacoes.includes("Rodoviária")) htmlForm += '<option value="Rodoviária">Rodoviária</option>';
  if (!lotacoes.includes("Espaço Batuíra")) htmlForm += '<option value="Espaço Batuíra">Espaço Batuíra</option>';
  htmlForm += '<option value="Outro">Outro...</option>';
  lotacaoForm.innerHTML = htmlForm;
}

/**
 * Abre o modal de cadastro/edição de servidor
 */
function abrirModalServidor(matricula) {
  const form = document.getElementById('form-servidor');
  form.reset();
  
  const titulo = document.getElementById('modal-servidor-titulo');
  const inputMatricula = document.getElementById('serv-matricula');
  const wrapperAtivo = document.getElementById('serv-ativo-wrapper');
  
  if (matricula) {
    // Modo Edição
    titulo.innerText = "Editar Servidor";
    inputMatricula.disabled = true; // matrícula é a chave primária, não edita
    wrapperAtivo.style.display = "block";
    
    const s = AppState.servidores.find(serv => serv.matricula === matricula);
    if (s) {
      document.getElementById('serv-matricula').value = s.matricula;
      document.getElementById('serv-nome').value = s.nome;
      document.getElementById('serv-cargo').value = s.cargo;
      document.getElementById('serv-lotacao').value = s.lotacao;
      document.getElementById('serv-situacao').value = s.situacao;
      document.getElementById('serv-email').value = s.email;
      document.getElementById('serv-ativo').value = s.status === 'Inativo' ? 'Não' : 'Sim';
      
      // Parse de data no formato dd/mm/yyyy para yyyy-mm-dd exigido pelo input date
      if (s.admissao) {
        let partes = s.admissao.split('/');
        if (partes.length === 3) {
          document.getElementById('serv-admissao').value = `${partes[2]}-${partes[1]}-${partes[0]}`;
        }
      }
    }
  } else {
    // Modo Cadastro
    titulo.innerText = "Cadastrar Servidor";
    inputMatricula.disabled = false;
    wrapperAtivo.style.display = "none";
    document.getElementById('serv-ativo').value = "Sim";
  }
  
  abrirModal('modal-servidor');
}

/**
 * Envia os dados do formulário de servidor ao backend do Apps Script
 */
function salvarDadosServidor(event) {
  event.preventDefault();
  exibirLoader(true);
  
  const dados = {
    matricula: document.getElementById('serv-matricula').value.trim(),
    nome: document.getElementById('serv-nome').value.trim().toUpperCase(),
    cargo: document.getElementById('serv-cargo').value.trim().toUpperCase(),
    lotacao: document.getElementById('serv-lotacao').value,
    admissao: document.getElementById('serv-admissao').value,
    situacao: document.getElementById('serv-situacao').value,
    email: document.getElementById('serv-email').value.trim(),
    ativo: document.getElementById('serv-ativo').value
  };
  
  if (typeof google === "undefined" || !google.script) {
    alert("Dados salvos em modo simulação local!");
    exibirLoader(false);
    fecharModal('modal-servidor');
    return;
  }
  
  google.script.run
    .withSuccessHandler(function() {
      fecharModal('modal-servidor');
      carregarListaServidores(); // recarrega a tabela
      alert("Cadastro de servidor salvo com sucesso!");
    })
    .withFailureHandler(function(erro) {
      exibirLoader(false);
      alert("Erro ao salvar servidor: " + erro.toString());
    })
    .salvarServidor(dados);
}

/**
 * Aciona a desativação lógica (soft delete) do servidor
 */
function confirmarDesativacaoServidor(matricula, nome) {
  if (confirm(`Atenção!\n\nVocê tem certeza que deseja DESATIVAR o cadastro do servidor ${nome} (Matrícula: ${matricula})?\n\nEle não aparecerá mais nos formulários ativos, mas todo o histórico dele na planilha será preservado.`)) {
    exibirLoader(true);
    
    if (typeof google === "undefined" || !google.script) {
      alert("Servidor desativado em modo de simulação local!");
      exibirLoader(false);
      return;
    }
    
    google.script.run
      .withSuccessHandler(function() {
        carregarListaServidores();
        alert("Cadastro de servidor desativado com sucesso!");
      })
      .withFailureHandler(function(erro) {
        exibirLoader(false);
        alert("Erro ao desativar servidor: " + erro.toString());
      })
      .desativarServidor(matricula);
  }
}

/**
 * Controla a navegação das abas dentro da Ficha do Servidor
 */
function alternarAbaFicha(idAba) {
  document.querySelectorAll('#modal-ficha-servidor .tab-button').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('#modal-ficha-servidor .tab-panel').forEach(panel => panel.classList.remove('active'));
  
  // Ativa botão clicado
  const btnAlvo = Array.from(document.querySelectorAll('#modal-ficha-servidor .tab-button')).find(btn => 
    btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(`'${idAba}'`)
  );
  if (btnAlvo) btnAlvo.classList.add('active');
  
  // Ativa painel correspondente
  const painel = document.getElementById(idAba);
  if (painel) painel.classList.add('active');
}

/**
 * Abre a Ficha Individual Detalhada do Servidor e carrega seus períodos de férias e lançamentos
 */
function abrirFichaServidor(matricula) {
  const s = AppState.servidores.find(serv => serv.matricula === matricula);
  if (!s) return;
  
  // 1. Limpar abas para o estado inicial
  alternarAbaFicha('tab-dados');
  
  // 2. Preencher Dados de Cadastro
  document.getElementById('ficha-nome').innerText = s.nome;
  document.getElementById('ficha-cargo').innerText = s.cargo || 'Não cadastrado';
  document.getElementById('ficha-lotacao').innerText = s.lotacao || 'Não cadastrado';
  document.getElementById('ficha-matricula').innerText = s.matricula;
  
  document.getElementById('ficha-dados-situacao').innerText = s.situacao;
  document.getElementById('ficha-dados-admissao').innerText = s.admissao || 'Não informada';
  document.getElementById('ficha-dados-email').innerText = s.email || 'Não informado';
  
  const statusBadge = document.getElementById('ficha-dados-status');
  statusBadge.className = "badge";
  if (s.status === 'Ativo') {
    statusBadge.classList.add('badge-ativo');
    statusBadge.innerText = 'ATIVO';
  } else if (s.status === 'Férias') {
    statusBadge.classList.add('badge-ferias');
    statusBadge.innerText = 'EM FÉRIAS';
  } else if (s.status === 'Abono') {
    statusBadge.classList.add('badge-abono');
    statusBadge.innerText = 'EM ABONO';
  } else {
    statusBadge.classList.add('badge-inativo');
    statusBadge.innerText = 'INATIVO';
  }
  
  // 3. Preencher Saldo de Férias do cabeçalho
  document.getElementById('ficha-ferias-saldo').innerText = s.saldoHoje + " dias";
  document.getElementById('ficha-ferias-projetado').innerText = s.projetado + " dias";
  
  // 4. Parsear o texto do Info_Férias para desenhar os Cards de Períodos Aquisitivos
  const gridPeriodos = document.getElementById('ficha-ferias-periodos');
  gridPeriodos.innerHTML = "";
  
  // Se contiver informações sobre períodos vencidos ou ativos
  if (s.infoFerias) {
    // Processamento do texto estruturado
    // Ex: "⚠️ ATENÇÃO: 1 Período vencido. | Saldo: 30 dias | Próx (+30): 30/03/2027"
    let partes = s.infoFerias.split('|');
    partes.forEach((p, idx) => {
      let texto = p.trim();
      if (!texto) return;
      
      let cardClass = "";
      let fillClass = "fill-disponivel";
      let statusTexto = "Disponível";
      
      if (texto.toLowerCase().includes("vencido") || texto.toLowerCase().includes("crítico")) {
        cardClass = "style='border-color: rgba(247, 90, 90, 0.4); background-color: rgba(247, 90, 90, 0.02);'";
        fillClass = "fill-vencido";
        statusTexto = "Vencido (Compulsório)";
      } else if (texto.toLowerCase().includes("próx") || texto.toLowerCase().includes("projetado")) {
        cardClass = "";
        fillClass = "fill-usufruido";
        statusTexto = "Em Aquisição";
      }
      
      gridPeriodos.innerHTML += `
        <div class="period-card" ${cardClass}>
          <div class="period-header">
            <span class="period-title">${texto.split(':')[0] || 'Período'}</span>
            <span class="badge ${fillClass === 'fill-vencido' ? 'badge-ferias' : 'badge-ativo'}">${statusTexto}</span>
          </div>
          <div class="period-dates">${texto.includes(':') ? texto.split(':')[1] : texto}</div>
          <div class="period-status-bar">
            <div class="period-status-fill ${fillClass}"></div>
          </div>
          <div class="period-legend">
            <span>0%</span>
            <span>Uso</span>
            <span>100%</span>
          </div>
        </div>
      `;
    });
  }
  
  if (gridPeriodos.innerHTML === "") {
    gridPeriodos.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); font-size: 13px;">Nenhum período de férias registrado ou processado.</div>`;
  }
  
  // 5. Carregar Lançamentos/Ausências Históricas no modal
  const tabelaHist = document.getElementById('ficha-historico-tabela');
  tabelaHist.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">Buscando histórico...</td></tr>`;
  
  if (typeof google !== "undefined" && google.script) {
    google.script.run
      .withSuccessHandler(function(historico) {
        if (historico.length === 0) {
          tabelaHist.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Nenhuma ausência registrada no histórico.</td></tr>`;
          return;
        }
        let html = "";
        historico.forEach(l => {
          html += `<tr>
            <td><strong>${l.idoc}</strong></td>
            <td>${l.tipo}</td>
            <td>${l.dataInicio}</td>
            <td style="text-align: center;">${l.dias || l.qtdHoras || '-'}</td>
            <td style="font-size: 12px; color: var(--text-secondary);">${l.observacao || '-'}</td>
          </tr>`;
        });
        tabelaHist.innerHTML = html;
      })
      .obterHistoricoServidor(matricula);
  } else {
    tabelaHist.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Sem conexão com o Google Sheets (modo local).</td></tr>`;
  }
  
  abrirModal('modal-ficha-servidor');
}

/**
 * Executa busca de autocomplete para selecionar o servidor
 */
function buscarServidorAutocomplete() {
  const input = document.getElementById('lanc-busca-servidor');
  const listagem = document.getElementById('autocomplete-lista');
  const txtMatricula = document.getElementById('lanc-matricula');
  const painelInfo = document.getElementById('lanc-servidor-info');
  
  const termo = input.value.toLowerCase().trim();
  txtMatricula.value = ""; // Limpa a matrícula até selecionar
  painelInfo.style.display = "none";
  
  if (!termo) {
    listagem.style.display = "none";
    return;
  }
  
  // Filtra servidores ativos apenas
  const sugestoes = AppState.servidores.filter(s => 
    s.status !== 'Inativo' && (s.nome.toLowerCase().includes(termo) || s.matricula.toLowerCase().includes(termo))
  ).slice(0, 5); // Limita em 5 sugestões
  
  if (sugestoes.length === 0) {
    listagem.innerHTML = `<div style="padding: 10px; color: var(--text-muted); font-size: 13px;">Nenhum servidor ativo encontrado.</div>`;
    listagem.style.display = "block";
    return;
  }
  
  let html = "";
  sugestoes.forEach(s => {
    html += `<div style="padding: 10px; cursor: pointer; border-bottom: 1px solid var(--border-color); font-size: 13px;" onclick="selecionarServidorAutocomplete('${s.matricula}', '${s.nome}', '${s.cargo}', '${s.lotacao}', '${s.saldoHoje}')">
      <strong>${s.nome}</strong> (Matrícula: ${s.matricula})
    </div>`;
  });
  
  listagem.innerHTML = html;
  listagem.style.display = "block";
}

/**
 * Abre o modal de lançamento limpo (criação) ou carregado (edição)
 */
function abrirModalLancamento(linhaPlanilha) {
  const form = document.getElementById('form-lancamento');
  form.reset();
  
  // Certifica de esconder informações de autocomplete anteriores
  document.getElementById('lanc-servidor-info').style.display = "none";
  document.getElementById('autocomplete-lista').style.display = "none";
  document.getElementById('anexos-existentes').style.display = "none";
  
  // Limpa arquivos dos inputs
  document.getElementById('lanc-file-1').value = "";
  document.getElementById('lanc-file-2').value = "";
  document.getElementById('lanc-file-3').value = "";
  
  const titulo = document.getElementById('modal-lancamento-titulo');
  const buscaServidorInput = document.getElementById('lanc-busca-servidor');
  const inputLinha = document.getElementById('lanc-linha');
  
  if (linhaPlanilha) {
    // MODO EDIÇÃO
    titulo.innerText = "Editar Lançamento";
    inputLinha.value = linhaPlanilha;
    buscaServidorInput.disabled = true; // Não altera o servidor do lançamento cadastrado
    
    const l = AppState.lancamentos.find(lanc => lanc.linhaPlanilha === linhaPlanilha);
    if (l) {
      document.getElementById('lanc-tipo').value = l.tipo;
      document.getElementById('lanc-idoc').value = l.idoc;
      document.getElementById('lanc-busca-servidor').value = l.nome;
      document.getElementById('lanc-matricula').value = l.matricula;
      document.getElementById('lanc-despacho').value = l.despacho;
      document.getElementById('lanc-observacao').value = l.observacao;
      document.getElementById('lanc-qtd-horas').value = l.qtdHoras;
      document.getElementById('lanc-dias').value = l.dias;
      
      // Parse de Data Solicitação
      if (l.dataSolicitacao) {
        let partes = l.dataSolicitacao.split('/');
        if (partes.length === 3) {
          document.getElementById('lanc-data-solicitacao').value = `${partes[2]}-${partes[1]}-${partes[0]}`;
        }
      }
      
      // Parse de Data Início / Data Falta
      if (l.dataInicio) {
        let partes = l.dataInicio.split('/');
        if (partes.length === 3) {
          const dataFormatadaInput = `${partes[2]}-${partes[1]}-${partes[0]}`;
          document.getElementById('lanc-data-inicio').value = dataFormatadaInput;
          document.getElementById('lanc-data-falta').value = dataFormatadaInput;
        }
      }
      
      // Renderizar anexos existentes no topo
      if (l.anexo1 || l.anexo2 || l.anexo3) {
        const listaExistente = document.getElementById('lista-anexos-existentes');
        let htmlAnexos = "";
        if (l.anexo1) htmlAnexos += `<li><a href="${l.anexo1}" target="_blank">Documento Anexo 1</a></li>`;
        if (l.anexo2) htmlAnexos += `<li><a href="${l.anexo2}" target="_blank">Documento Anexo 2</a></li>`;
        if (l.anexo3) htmlAnexos += `<li><a href="${l.anexo3}" target="_blank">Documento Anexo 3</a></li>`;
        listaExistente.innerHTML = htmlAnexos;
        document.getElementById('anexos-existentes').style.display = "block";
      }
    }
  } else {
    // MODO CRIAÇÃO
    titulo.innerText = "Cadastrar Lançamento de Documento";
    inputLinha.value = "";
    buscaServidorInput.disabled = false;
    document.getElementById('lanc-data-solicitacao').value = new Date().toISOString().split('T')[0];
  }
  
  ajustarCamposFormularioLancamento();
  abrirModal('modal-lancamento');
}

/**
 * Processa a gravação e faz o upload dos PDFs convertendo-os em Base64
 */
async function salvarDadosLancamento(event) {
  event.preventDefault();
  exibirLoader(true);
  
  const matricula = document.getElementById('lanc-matricula').value;
  if (!matricula) {
    exibirLoader(false);
    alert("Erro: Você precisa selecionar um servidor válido usando a lista de sugestões.");
    return;
  }
  
  const tipoDoc = document.getElementById('lanc-tipo').value;
  let dataInicioInput = "";
  let diasInput = 0;
  let qtdHorasInput = "";
  
  if (tipoDoc === "Férias" || tipoDoc === "Férias (1/3 Pecúnia)" || tipoDoc === "Licença Prêmio") {
    dataInicioInput = document.getElementById('lanc-data-inicio').value;
    diasInput = document.getElementById('lanc-dias').value;
  } else if (tipoDoc === "Hora Extra") {
    dataInicioInput = document.getElementById('lanc-data-falta').value;
    diasInput = 0;
    qtdHorasInput = document.getElementById('lanc-qtd-horas').value;
  } else {
    dataInicioInput = document.getElementById('lanc-data-falta').value;
    diasInput = 1; // abonos duram 1 dia
  }
  
  const dados = {
    linhaPlanilha: document.getElementById('lanc-linha').value,
    tipo: tipoDoc,
    idoc: document.getElementById('lanc-idoc').value.trim(),
    matricula: matricula,
    dataSolicitacao: document.getElementById('lanc-data-solicitacao').value,
    dataInicio: dataInicioInput,
    dias: diasInput,
    qtdHoras: qtdHorasInput,
    despacho: document.getElementById('lanc-despacho').value,
    observacao: document.getElementById('lanc-observacao').value.trim(),
    anexo1: "",
    anexo2: "",
    anexo3: ""
  };
  
  // Realiza uploads paralelos de arquivos em Base64 se houver no formulário
  try {
    const file1 = document.getElementById('lanc-file-1').files[0];
    const file2 = document.getElementById('lanc-file-2').files[0];
    const file3 = document.getElementById('lanc-file-3').files[0];
    
    if (file1) {
      let res = await uploadArquivoPromessa(file1);
      dados.anexo1 = res.url;
    }
    if (file2) {
      let res = await uploadArquivoPromessa(file2);
      dados.anexo2 = res.url;
    }
    if (file3) {
      let res = await uploadArquivoPromessa(file3);
      dados.anexo3 = res.url;
    }
  } catch (erroUpload) {
    exibirLoader(false);
    alert("Falha no upload dos anexos: " + erroUpload.toString());
    return;
  }
  
  if (typeof google === "undefined" || !google.script) {
    alert("Lançamento gravado em simulação local!");
    exibirLoader(false);
    fecharModal('modal-lancamento');
    return;
  }
  
  google.script.run
    .withSuccessHandler(function() {
      fecharModal('modal-lancamento');
      carregarListaLancamentos();
      carregarListaServidores(); // recarrega servidores para atualizar saldos alterados
      alert("Lançamento de documento salvo com sucesso!");
    })
    .withFailureHandler(function(erro) {
      exibirLoader(false);
      alert("Erro ao gravar lançamento: " + erro.toString());
    })
    .salvarLancamento(dados);
}

/**
 * Função utilitária em JS para converter e enviar arquivo no Drive de forma síncrona/prometida
 */
function uploadArquivoPromessa(arquivo) {
  return new Promise((resolver, rejeitar) => {
    const leitor = new FileReader();
    leitor.onload = function(evento) {
      const base64 = evento.target.result;
      
      google.script.run
        .withSuccessHandler(function(resultadoDrive) {
          resolver(resultadoDrive);
        })
        .withFailureHandler(function(erro) {
          rejeitar(erro);
        })
        .salvarArquivoNoDrive(base64, arquivo.name, arquivo.type);
    };
    leitor.onerror = function(e) {
      rejeitar("Falha ao ler arquivo físico local.");
    };
    leitor.readAsDataURL(arquivo);
  });
}

  const opcoes = ["Aguardando Assinatura", "Entregue ao Chefe", "Retornado pelo Chefe", "Enviado ao DGP"];
  
  let msg = `Selecione o novo status físico para o Protocolo ${idProtocolo}:\n\n` +
            `Status Atual: "${statusAtual}"\n\n` +
            `Opções (digite o número):\n` +
            `1. Aguardando Assinatura\n` +
            `2. Entregue ao Chefe (saiu da SETUR p/ assinatura)\n` +
            `3. Retornado pelo Chefe (assinado na mesa)\n` +
            `4. Enviado ao DGP (encaminhado ao RH Central)`;
            
  let escolha = prompt(msg, "1");
  if (escolha === null) return; // cancelou
  
  let novoStatus = "";
  if (escolha === "1") novoStatus = "Aguardando Assinatura";
  else if (escolha === "2") novoStatus = "Entregue ao Chefe";
  else if (escolha === "3") novoStatus = "Retornado pelo Chefe";
  else if (escolha === "4") novoStatus = "Enviado ao DGP";
  else {
    alert("Opção inválida.");
    return;
  }
  
  exibirLoader(true);
  
  google.script.run
    .withSuccessHandler(function() {
      carregarListaProtocolos();
      alert(`Status do protocolo ${idProtocolo} alterado para "${novoStatus}"!`);
    })
    .withFailureHandler(function(erro) {
      exibirLoader(false);
      alert("Erro ao transicionar status: " + erro.toString());
    })
    .atualizarStatusProtocolo(idProtocolo, novoStatus);
}
</script>
