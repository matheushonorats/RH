/**
 * Processa a gravação e faz o upload dos PDFs convertendo-os em Base64
 */
async function salvarDadosLancamento(event) {
  event.preventDefault();
  const botaoSalvarLancamento = event.submitter || document.getElementById('btn-lanc-salvar');
  if (!iniciarOperacaoInterface('salvar-lancamento', botaoSalvarLancamento, 'Salvando...')) return;

  try {
  exibirLoader(true);
  
  const matricula = document.getElementById('lanc-matricula').value;
  if (!matricula) {
    exibirLoader(false);
    mostrarToast("Erro: Você precisa selecionar um servidor válido usando a lista de sugestões.", 'error');
    return;
  }
  
  const idocInput = document.getElementById('lanc-idoc').value.trim();
  const linhaAtual = parseInt(document.getElementById('lanc-linha').value) || -1;
  const lancamentoEmEdicao = linhaAtual > 1 && AppState.lancamentos
    ? AppState.lancamentos.find(l => Number(l.linhaPlanilha) === linhaAtual)
    : null;
  const statusLancamentoEmEdicao = normalizarTextoRep_(lancamentoEmEdicao?.status || '');
  const lancamentoEmEdicaoInativo = Boolean(lancamentoEmEdicao) && /(ANULAD|CANCELAD|EXCLUID|NAO EFETIVAD)/.test(statusLancamentoEmEdicao);
  const tipoDoc = document.getElementById('lanc-tipo').value;
  const servidorLancamento = (AppState.servidores || []).find(item => String(item.matricula) === String(matricula));
  const situacaoLancamento = normalizarTextoRep_(servidorLancamento?.situacao || '');
  const tipoLancamentoNormalizado = normalizarTextoRep_(tipoDoc);
  if ((situacaoLancamento === 'ESTAGIARIO' || situacaoLancamento === 'PEAD') && (tipoLancamentoNormalizado.includes('ABONADA') || tipoLancamentoNormalizado.includes('ABONO'))) {
    exibirLoader(false);
    mostrarToast(`${servidorLancamento.situacao} não possui direito a abonos. Férias permanecem disponíveis.`, 'warning');
    return;
  }
  if (document.getElementById('lanc-tipo').value === 'Abonada Eleitoral') {
    await salvarAbonoEleitoralFormulario_(matricula);
    return;
  }
  
  if (idocInput && idocInput !== "-" && AppState.lancamentos) {
    const lExistente = AppState.lancamentos.find(l => l.idoc === idocInput && l.linhaPlanilha !== linhaAtual);
    if (lExistente && tipoDoc !== "Autorização de Horas Extras" && lExistente.tipo !== "Autorização de Horas Extras") {
      if (!await abrirConfirm(`Aviso: O protocolo ${idocInput} já está registrado no sistema para o servidor(a) ${lExistente.nome}.\n\nDeseja prosseguir com o lançamento mesmo assim?`)) {
        exibirLoader(false);
        return;
      }
    }
  }
  let dataInicioInput = "";
  let diasInput = 0;
  let diasPecuniaInput = 0;
  let qtdHorasInput = "";
  
  if (tipoDoc === "Férias" || tipoDoc === "Férias (1/3 Pecúnia)" || tipoDoc === "Licença Prêmio" || tipoDoc === "Atestado") {
    dataInicioInput = document.getElementById('lanc-data-inicio').value;
    diasInput = parseInt(document.getElementById('lanc-dias').value) || 0;
    diasPecuniaInput = tipoDoc === "Férias (1/3 Pecúnia)"
      ? (parseInt(document.getElementById('lanc-dias-pecunia').value) || 0)
      : 0;

    if (tipoDoc === "Férias (1/3 Pecúnia)" && (diasInput <= 0 || diasPecuniaInput <= 0)) {
      exibirLoader(false);
      mostrarToast("Informe os dias de gozo e os dias convertidos em pecúnia.", 'error');
      return;
    }

    if (tipoDoc === "Férias" || tipoDoc === "Férias (1/3 Pecúnia)") {
      const servidorSaldo = AppState.servidores.find(s => s.matricula === matricula);
      const totalSolicitado = diasInput + diasPecuniaInput;
      const lancamentoEditado = lancamentoEmEdicao;
      const dataInicioFerias = dataInicioInput ? new Date(`${dataInicioInput}T00:00:00`) : null;
      const saldoAtual = parseInt(servidorSaldo && servidorSaldo.saldoHoje, 10) || 0;
      const creditosQueLiberamAteASaida = (servidorSaldo?.periodosFerias || []).reduce(function(total, periodo) {
        if (!dataInicioFerias || periodo.status !== 'Em aquisição') return total;
        const partes = String(periodo.dataLiberacao || '').split('/');
        if (partes.length !== 3) return total;
        const liberacao = new Date(Number(partes[2]), Number(partes[1]) - 1, Number(partes[0]));
        const diasDoPeriodo = Math.max(0, Number(periodo.diasOriginais || 0) - Number(periodo.penalidade || 0));
        return liberacao <= dataInicioFerias ? total + diasDoPeriodo : total;
      }, 0);
      const saldoNaData = saldoAtual + creditosQueLiberamAteASaida;
      const inicioAnterior = lancamentoEditado?.dataInicio ? new Date(`${String(lancamentoEditado.dataInicio).split('T')[0]}T00:00:00`) : null;
      const lancamentoAnteriorJaConsiderado = !inicioAnterior || !dataInicioFerias || inicioAnterior <= dataInicioFerias;
      const saldoRecomposto = saldoNaData
        + (lancamentoEditado && !lancamentoEmEdicaoInativo && lancamentoAnteriorJaConsiderado
          ? (parseInt(lancamentoEditado.diasDebitados, 10) || parseInt(lancamentoEditado.dias, 10) || 0)
          : 0);

      if (totalSolicitado > saldoRecomposto) {
        exibirLoader(false);
        mostrarToast(`Na data de início informada, o total solicitado (${totalSolicitado} dias) ultrapassa o saldo disponível (${saldoRecomposto} dias).`, 'error');
        return;
      }
    }
    
    const linhaPlanilha = document.getElementById('lanc-linha').value;
    if (!linhaPlanilha && (tipoDoc === "Férias" || tipoDoc === "Férias (1/3 Pecúnia)")) {
      const servidor = AppState.servidores.find(s => s.matricula === matricula);
      if (servidor && servidor.periodosFerias) {
        const periodosAbertos = servidor.periodosFerias.filter(p => p.saldo > 0 && p.status === "Disponível");
        if (periodosAbertos.length > 0) {
          const periodoMaisAntigo = periodosAbertos[0];
          if ((diasInput + diasPecuniaInput) > periodoMaisAntigo.saldo) {
            const prosseguir = await abrirConfirm(`Aviso: O servidor possui o período mais antigo (${periodoMaisAntigo.referencia}) com saldo residual de apenas ${periodoMaisAntigo.saldo} dias.\n\nO ideal seria liquidar esta pendência primeiro antes de agrupar mais dias.\n\nDeseja prosseguir com o lançamento mesmo assim?`);
            if (!prosseguir) {
              exibirLoader(false);
              return;
            }
          }
        }
      }
    }
  } else if (tipoDoc === "Autorização de Horas Extras") {
    dataInicioInput = document.getElementById('lanc-data-falta').value;
    diasInput = 0;
    qtdHorasInput = document.getElementById('lanc-qtd-horas').value;
  } else if (tipoDoc === "Avaliação do Estágio Probatório") {
    dataInicioInput = document.getElementById('lanc-data-solicitacao').value;
    diasInput = 0;
  } else {
    dataInicioInput = document.getElementById('lanc-data-falta').value;
    diasInput = 1; // abonos duram 1 dia
  }

  let confirmarReservaCreditoFuturo = false;
  if ((tipoDoc === "Férias" || tipoDoc === "Férias (1/3 Pecúnia)") && dataInicioInput) {
    const servidor = AppState.servidores.find(s => String(s.matricula) === String(matricula));
    const saldoHoje = Number(servidor?.saldoHoje || 0);
    const totalFerias = Number(diasInput || 0) + Number(diasPecuniaInput || 0);
    if (totalFerias > saldoHoje) {
      const inicio = new Date(`${dataInicioInput}T00:00:00`);
      const creditosFuturos = (servidor?.periodosFerias || []).filter(function(periodo) {
        if (periodo.status !== 'Em aquisição') return false;
        const partes = String(periodo.dataLiberacao || '').split('/');
        if (partes.length !== 3) return false;
        return new Date(Number(partes[2]), Number(partes[1]) - 1, Number(partes[0])) <= inicio;
      });
      const nomesPeriodos = creditosFuturos.map(function(periodo) { return periodo.referencia || periodo.dataLiberacao; }).join(', ') || 'crédito futuro disponível na data de saída';
      exibirLoader(false);
      confirmarReservaCreditoFuturo = await abrirConfirm(
        `Esta programação usa ${totalFerias - saldoHoje} dia(s) de crédito ainda em aquisição.\n\n` +
        `O sistema reservará esse saldo futuro (${nomesPeriodos}) para esta saída e impedirá uso duplicado em novos lançamentos. Férias já confirmadas passam a compor imediatamente o saldo comprometido e os alertas serão recalculados.\n\nDeseja confirmar a reserva?`,
        'Reservar crédito futuro de férias'
      );
      if (!confirmarReservaCreditoFuturo) return;
      exibirLoader(true);
    }
  }
  
  const operacaoId = gerarIdOperacaoCliente_();
  const dados = {
    operacaoId: operacaoId,
    linhaPlanilha: document.getElementById('lanc-linha').value,
    reativar: lancamentoEmEdicaoInativo,
    tipo: tipoDoc,
    idoc: document.getElementById('lanc-idoc').value.trim(),
    matricula: matricula,
    dataSolicitacao: document.getElementById('lanc-data-solicitacao').value,
    dataInicio: dataInicioInput,
    dias: diasInput,
    diasPecunia: diasPecuniaInput,
    confirmarReservaCreditoFuturo: confirmarReservaCreditoFuturo,
    qtdHoras: qtdHorasInput,
    mesHE: document.getElementById('lanc-mes-he') ? document.getElementById('lanc-mes-he').value : "",
    anoHE: document.getElementById('lanc-ano-he') ? document.getElementById('lanc-ano-he').value : "",
    despacho: document.getElementById('lanc-despacho').value,
    observacao: document.getElementById('lanc-observacao').value.trim(),
    anexo1: "",
    anexo2: "",
    anexo3: ""
  };

  if (typeof google === "undefined" || !google.script) {
    mostrarToast("Lançamento gravado em simulação local!", 'warning');
    exibirLoader(false);
    fecharModal('modal-lancamento');
    return;
  }

  let operacaoRegistrada = false;
  
  
  // Registra a operação e envia os arquivos em Base64, vinculando cada anexo à fila segura.
  try {
    const validacaoPeriodo = await chamarBackendPromessa_('validarConflitosLancamento', [dados]);
    if (validacaoPeriodo && validacaoPeriodo.valido === false) {
      exibirLoader(false);
      mostrarToast(validacaoPeriodo.mensagem || 'Este lançamento se sobrepõe a outra ausência ativa do servidor.', 'error');
      return;
    }

    const alertaLotacao = await chamarBackendPromessa_('verificarAusenciasLotacaoLancamento', [dados]);
    if (alertaLotacao && alertaLotacao.temAlerta) {
      const pessoasAusentes = (alertaLotacao.ausentes || []).map(function(item) {
        return '• ' + item.nome + ' (' + item.matricula + ') — ' + item.tipo + ', ' + item.periodo;
      }).join('\n');
      const sufixo = Number(alertaLotacao.quantidade || 0) > (alertaLotacao.ausentes || []).length
        ? '\n\nHá mais pessoas ausentes nesse período.'
        : '';
      exibirLoader(false);
      const prosseguir = await abrirConfirm(
        'Atenção à cobertura da lotação "' + alertaLotacao.lotacao + '": no período ' + alertaLotacao.periodoNovo +
        ', os seguintes servidores também possuem ausência ativa:\n\n' + pessoasAusentes + sufixo +
        '\n\nDeseja confirmar este lançamento mesmo assim?',
        'Ausências simultâneas'
      );
      if (!prosseguir) return;
      exibirLoader(true);
    }

    const file1 = document.getElementById('lanc-file-1').files[0];
    const file2 = document.getElementById('lanc-file-2').files[0];
    const file3 = document.getElementById('lanc-file-3').files[0];

    await chamarBackendComRetryTemporario_('registrarOperacaoPendente', [{
      idOperacao: operacaoId,
      tipoOperacao: 'salvar_lancamento',
      descricao: 'Salvar lançamento: ' + tipoDoc,
      payload: dados,
      anexosEsperados: [file1, file2, file3].filter(Boolean).length
    }], 'Preparando a fila segura');
    operacaoRegistrada = true;
    
    if (file1) {
      let res = await uploadArquivoPromessa(file1, operacaoId, 1);
      dados.anexo1 = res.url;
    }
    if (file2) {
      let res = await uploadArquivoPromessa(file2, operacaoId, 2);
      dados.anexo2 = res.url;
    }
    if (file3) {
      let res = await uploadArquivoPromessa(file3, operacaoId, 3);
      dados.anexo3 = res.url;
    }
  } catch (erroUpload) {
    exibirLoader(false);
    if (!operacaoRegistrada) {
      mostrarToast("O sistema permaneceu ocupado. O formulário continua preenchido e nada foi enviado: " + mensagemErro(erroUpload), 'error');
      return;
    }
    // Mantém no Drive os anexos já vinculados à fila persistente.
    backendApi().registrarFalhaOperacaoPendente(operacaoId, mensagemErro(erroUpload));
    fecharModal('modal-lancamento');
    setTimeout(() => carregarOperacoesPendentesServidor(false), 500);
    mostrarToast("Upload interrompido. O lançamento e os anexos concluídos foram preservados na fila segura.", 'warning');
    return;
  }
  
  try {
    await chamarBackendComRetryTemporario_('marcarOperacaoPronta', [dados], 'Finalizando a fila segura');
  } catch (erroFila) {
    console.warn('A fila segura será reconstruída pelos anexos vinculados:', mensagemErro(erroFila));
  }

  mostrarToast("Documento protegido e salvo nesta tela. O envio continuará em segundo plano.", 'info');
  SyncQueue.enfileirar('salvar_lancamento', 'salvarLancamento', [dados], 'Salvar lançamento: ' + tipoDoc);
  exibirLoader(false);
  fecharModal('modal-lancamento');
  agendarSincronizacaoSegura_('lancamentos');
  } finally {
    finalizarOperacaoInterface('salvar-lancamento', botaoSalvarLancamento);
  }
}

/**
 * Função utilitária em JS para converter e enviar arquivo no Drive de forma síncrona/prometida
 */
function validarPdfDropzoneAnexo(arquivo) {
  if (!arquivo) return 'Nenhum arquivo selecionado.';
  if (!arquivo.name.toLowerCase().endsWith('.pdf') || (arquivo.type && arquivo.type !== 'application/pdf')) {
    return 'Selecione somente arquivos PDF.';
  }
  if (arquivo.size > 10 * 1024 * 1024) return 'O arquivo excede o limite de 10 MB.';
  return '';
}

function atualizarVisualDropzoneAnexo(input) {
  if (!input) return;
  const zona = input.closest('.anexo-dropzone');
  if (!zona) return;
  const texto = zona.querySelector('.anexo-dropzone-texto');
  if (texto && !zona.dataset.rotuloPadrao) zona.dataset.rotuloPadrao = texto.textContent;
  const arquivo = input.files && input.files[0];
  zona.classList.toggle('tem-arquivo', Boolean(arquivo));
  if (texto) texto.textContent = arquivo ? arquivo.name : zona.dataset.rotuloPadrao;
}

function inicializarDropzonesAnexos() {
  document.querySelectorAll('.anexo-dropzone[data-file-input]').forEach(zona => {
    if (zona.dataset.dropzoneInicializada === '1') return;
    zona.dataset.dropzoneInicializada = '1';
    const input = document.getElementById(zona.dataset.fileInput);
    if (!input) return;
    atualizarVisualDropzoneAnexo(input);
    input.addEventListener('change', function() {
      const arquivo = input.files && input.files[0];
      const erro = arquivo ? validarPdfDropzoneAnexo(arquivo) : '';
      if (erro) {
        input.value = '';
        mostrarToast(erro, 'error');
      }
      atualizarVisualDropzoneAnexo(input);
    });
    ['dragenter', 'dragover'].forEach(evento => zona.addEventListener(evento, function(e) {
      e.preventDefault();
      e.stopPropagation();
      zona.classList.add('dragover');
    }));
    ['dragleave', 'drop'].forEach(evento => zona.addEventListener(evento, function(e) {
      e.preventDefault();
      e.stopPropagation();
      zona.classList.remove('dragover');
    }));
    zona.addEventListener('drop', function(e) {
      const arquivo = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      const erro = validarPdfDropzoneAnexo(arquivo);
      if (erro) return mostrarToast(erro, 'error');
      const transferencia = new DataTransfer();
      transferencia.items.add(arquivo);
      input.files = transferencia.files;
      input.dispatchEvent(new Event('change', { bubbles: true }));
    });
  });
}

function uploadArquivoPromessa(arquivo, operacaoId, posicaoAnexo) {
  return new Promise((resolver, rejeitar) => {
    const leitor = new FileReader();
    leitor.onload = function(evento) {
      const base64 = evento.target.result;
      
      backendApi()
        .withSuccessHandler(function(resultadoDrive) {
          resolver(resultadoDrive);
        })
        .withFailureHandler(function(erro) {
          rejeitar(erro);
        })
        .salvarArquivoNoDrive(base64, arquivo.name, arquivo.type || 'application/pdf', operacaoId || '', posicaoAnexo || 0);
    };
    leitor.onerror = function(e) {
      rejeitar("Falha ao ler arquivo físico local.");
    };
    leitor.readAsDataURL(arquivo);
  });
}

/**
 * Renderiza linhas da tabela de Protocolos
 */
function renderizarTabelaProtocolos(listaFiltrada, mantemPagina = false) {
  const listaOriginal = Array.isArray(listaFiltrada)
    ? listaFiltrada
    : (Array.isArray(AppState.protocolos) ? AppState.protocolos : []);
  const tabela = document.getElementById('tabela-protocolos-body');
  
  const estado = AppState.paginacao.protocolos;
  estado.listaAtual = listaOriginal;
  if (!mantemPagina) estado.paginaAtual = 1;
  const totalItens = estado.listaAtual.length;
  estado.paginaAtual = Math.min(estado.paginaAtual, Math.max(1, Math.ceil(totalItens / estado.itensPorPagina)));
  
  if (totalItens === 0) {
    tabela.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 30px; color: var(--text-secondary);">Nenhum protocolo encontrado.</td></tr>`;
    renderizarControlesPaginacao('paginacao-protocolos', 'protocolos', 0);
    exibirLoader(false);
    return;
  }
  
  const start = (estado.paginaAtual - 1) * estado.itensPorPagina;
  const protocolos = estado.listaAtual.slice(start, start + estado.itensPorPagina);

  
  let html = "";
  protocolos.forEach(p => {
    html += `<tr>       <td><strong>${escapeHtml(p.id)}</strong></td>       <td>${escapeHtml(p.dataGeracao)}</td>       <td style="text-align: center;">${p.qtdDocumentos} documentos</td>       <td>${escapeHtml(p.criadoPor)}</td>       <td>         <div class="action-buttons">           <button class="btn-action" data-action="imprimir-prot" data-id="${escapeHtml(p.id)}" title="Visualizar e imprimir folha">             <span data-lucide="printer" style="width: 14px; height: 14px;"></span>           </button>           <button class="btn-action" data-action="editar-prot" data-id="${escapeHtml(p.id)}" data-linha="${p.linhaPlanilha}" title="Editar documentos desta folha">             <span data-lucide="pencil" style="width: 14px; height: 14px;"></span>           </button>         </div>       </td>     </tr>`;
  });
  
  tabela.innerHTML = html;
  tabela.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', function() {
      const action = this.dataset.action;
      if (action === 'imprimir-prot') abrirFolhaProtocolo(this.dataset.id);
      else if (action === 'editar-prot') abrirEdicaoProtocolo(this.dataset.id, this.dataset.linha);
    });
  });
  renderizarIcones();
  renderizarControlesPaginacao('paginacao-protocolos', 'protocolos', totalItens);
}

/**
 * Filtra protocolos localmente
 */
function filtrarTabelaProtocolos() {
  const busca = normalizarTextoBusca(document.getElementById('filtro-busca-protocolo').value);
  const filtrados = AppState.protocolos.filter(p => {
    const bateBusca = correspondeBusca(busca, p.id);

  });
  
  const estado = AppState.paginacao.protocolos;
  const assinatura = JSON.stringify([busca]);
  const manterPagina = estado.filtroAssinatura === assinatura;
  estado.filtroAssinatura = assinatura;
  renderizarTabelaProtocolos(filtrados, manterPagina);
}

async function salvarAbonoEleitoralFormulario_(matricula) {
  sincronizarDataEleitoralDigitada_();
  const pleito = document.getElementById('lanc-pleito-eleitoral').value.trim();
  const movimento = document.getElementById('lanc-movimento-eleitoral').value;
  const quantidadeCredito = Number(document.getElementById('lanc-quantidade-eleitoral').value || 0);
  const textoDatas = document.getElementById('lanc-datas-eleitoral').value;
  const datas = Array.from(new Set(textoDatas.split(/[\n,;]/).map(function(valor) {
    const texto = valor.trim();
    const br = texto.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    return br ? br[3] + '-' + br[2] + '-' + br[1] : texto;
  }).filter(function(data) { return /^\d{4}-\d{2}-\d{2}$/.test(data); }))).sort();
  if (!pleito) { exibirLoader(false); mostrarToast('Informe o pleito eleitoral.', 'warning'); return; }
  const concedeCredito = movimento === 'CREDITO' || movimento === 'CREDITO_USO';
  const usaFolgas = movimento === 'USO' || movimento === 'CREDITO_USO';
  if (concedeCredito && quantidadeCredito < 1) { exibirLoader(false); mostrarToast('Informe os dias concedidos.', 'warning'); return; }
  if (usaFolgas && !datas.length) { exibirLoader(false); mostrarToast('Informe ao menos uma data de uso, uma por linha.', 'warning'); return; }
  const dados = { operacaoId: gerarIdOperacaoCliente_(), matricula: matricula, pleito: pleito, movimento: movimento, quantidadeCredito: quantidadeCredito, datas: datas, idoc: document.getElementById('lanc-idoc').value.trim(), dataSolicitacao: document.getElementById('lanc-data-solicitacao').value, despacho: document.getElementById('lanc-despacho').value, observacao: document.getElementById('lanc-observacao').value.trim() };
  const descricao = movimento === 'CREDITO_USO' ? 'Conceder e usar abono eleitoral: ' + pleito : (movimento === 'CREDITO' ? 'Conceder crédito eleitoral: ' + pleito : 'Usar abono eleitoral: ' + pleito);
  SyncQueue.enfileirar('abono_eleitoral', 'salvarAbonoEleitoral', [dados], descricao);
  exibirLoader(false);
  fecharModal('modal-lancamento');
  mostrarToast('Abono eleitoral registrado nesta tela. A sincronização continuará em segundo plano.', 'success');
  agendarSincronizacaoSegura_('lancamentos');
}

function obterDatasAbonoEleitoral_() {
  const campo = document.getElementById('lanc-datas-eleitoral');
  return Array.from(new Set(String(campo?.value || '').split(/[\n,;]/).map(function(data) { return data.trim(); }).filter(function(data) { return /^\d{4}-\d{2}-\d{2}$/.test(data); })));
}

function renderizarDatasAbonoEleitoral_() {
  const lista = document.getElementById('lanc-datas-eleitoral-lista');
  if (!lista) return;
  const datas = obterDatasAbonoEleitoral_();
  lista.innerHTML = datas.length ? datas.map(function(data) {
    const partes = data.split('-');
    const rotulo = partes[2] + '/' + partes[1] + '/' + partes[0];
    return `<span class="eleitoral-data-chip">${rotulo}<button type="button" onclick="removerDataAbonoEleitoral_('${data}')" aria-label="Remover ${rotulo}">×</button></span>`;
  }).join('') : '<small>Nenhuma data adicionada.</small>';
}

function adicionarDataAbonoEleitoral_(silencioso) {
  const seletor = document.getElementById('lanc-data-eleitoral-nova');
  const campo = document.getElementById('lanc-datas-eleitoral');
  const data = String(seletor?.value || '');
  if (!data) { if (!silencioso) mostrarToast('Escolha uma data antes de adicionar.', 'warning'); return false; }
  const datas = obterDatasAbonoEleitoral_();
  if (!datas.includes(data)) datas.push(data);
  campo.value = datas.join('\n');
  seletor.value = '';
  renderizarDatasAbonoEleitoral_();
  return true;
}

function sincronizarDataEleitoralDigitada_() {
  if (document.getElementById('lanc-data-eleitoral-nova')?.value) adicionarDataAbonoEleitoral_(true);
}

function removerDataAbonoEleitoral_(data) {
  const campo = document.getElementById('lanc-datas-eleitoral');
  campo.value = obterDatasAbonoEleitoral_().filter(function(item) { return item !== data; }).join('\n');
  renderizarDatasAbonoEleitoral_();
}

function carregarResumoAbonosEleitorais_() {
  const container = document.getElementById('lanc-resumo-eleitoral');
  const matricula = document.getElementById('lanc-matricula')?.value || '';
  if (!container) return;
  if (!matricula || typeof google === 'undefined' || !google.script) { container.innerHTML = '<small>Selecione o servidor para consultar os saldos por pleito.</small>'; return; }
  container.innerHTML = '<small>Consultando saldos eleitorais...</small>';
  backendApi().withSuccessHandler(function(itens) {
    itens = Array.isArray(itens) ? itens : [];
    container.innerHTML = itens.length ? itens.map(function(item) {
      const datas = Array.isArray(item.datasUsadas) && item.datasUsadas.length ? `<small>Folgas usadas em: ${item.datasUsadas.map(escapeHtml).join(', ')}</small>` : '<small>Nenhuma folga utilizada.</small>';
      return `<div><strong>${escapeHtml(item.pleito)}</strong><span>${item.concedidos} concedido(s) · ${item.usados} usado(s) · <b>${item.saldo} restante(s)</b></span>${datas}</div>`;
    }).join('') : '<small>Nenhum crédito eleitoral registrado para este servidor.</small>';
  }).withFailureHandler(function(erro) { container.innerHTML = '<small>Não foi possível consultar os saldos: ' + escapeHtml(mensagemErro(erro)) + '</small>'; }).obterResumoAbonosEleitorais(matricula);
}

    const hoje = new Date().toISOString().split('T')[0];
    const fim = new Date();
    fim.setDate(fim.getDate() + 15);
    document.getElementById('rep-data-inicio').value = hoje;
    document.getElementById('rep-data-fim').value = fim.toISOString().split('T')[0];
  } else if (tipo === 'resumo_mensal') {
    blocoMesAno.style.display = "block";
    const meses = ["JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO", "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"];
    document.getElementById('rep-mes').value = meses[new Date().getMonth()];
    document.getElementById('rep-ano').value = new Date().getFullYear();
  }
}

/**
 * Consulta os dados do relatório no backend
 */
function gerarDadosRelatorio() {
  const tipo = document.getElementById('rep-tipo').value;
  exibirLoader(true);
  
  const handlerErro = function(e) {
    exibirLoader(false);
    document.getElementById('rep-resultado-container').style.display = "none";
    mostrarToast("Erro ao emitir relatório: " + e.toString(), 'error');
  };
  
  // Limpa os dados anteriores enquanto carrega
  document.getElementById('tabela-relatorio-head').innerHTML = "";
  document.getElementById('tabela-relatorio-body').innerHTML = `<tr><td colspan="10" style="text-align: center; color: var(--text-muted); padding: 30px;">Carregando informações...</td></tr>`;
  document.getElementById('rep-resultado-container').style.display = "block";
  
  if (typeof google === "undefined" || !google.script) {
    mostrarToast("Função disponível apenas conectada ao Apps Script (modo local)!", 'warning');
    exibirLoader(false);
    return;
  }
  
  let handlerSucesso = function(dados) {
    if (tipo === 'compulsorias') {
      dados = dados.map(s => {
        s.limiteCalc = calcularLimiteCompulsoria(s);
        return s;
      }).sort((a, b) => {
        const valA = a.limiteCalc.diasRestantes === null ? 999999 : a.limiteCalc.diasRestantes;
        const valB = b.limiteCalc.diasRestantes === null ? 999999 : b.limiteCalc.diasRestantes;
        return valA - valB;
      });
    }
    dadosUltimoRelatorio = dados;
    desenharTabelaRelatorio(tipo, dados);
    exibirLoader(false);
  };
  

  
  if (tipo === 'compulsorias') {
    tituloUltimoRelatorio = "Relatório de Programação Preventiva de Férias";
    backendApi().withSuccessHandler(handlerSucesso).withFailureHandler(handlerErro).obterRelatorioCompulsorias();
  } else if (tipo === 'situacao_ferias') {
    tituloUltimoRelatorio = "Relatório de Situação Geral de Férias";
    backendApi().withSuccessHandler(handlerSucesso).withFailureHandler(handlerErro).obterRelatorioSituacaoFerias();
  } else if (tipo === 'calendario_ausencias') {
    tituloUltimoRelatorio = "Calendário / Escala de Ausências Programadas";
    const ini = document.getElementById('rep-data-inicio').value;
    const fim = document.getElementById('rep-data-fim').value;
    backendApi().withSuccessHandler(handlerSucesso).withFailureHandler(handlerErro).obterRelatorioAusenciasCalendario(ini, fim);
  } else if (tipo === 'resumo_mensal') {
    const mes = document.getElementById('rep-mes').value;
    const ano = document.getElementById('rep-ano').value;
    tituloUltimoRelatorio = `Resumo Mensal de Lançamentos - ${mes}/${ano}`;
    backendApi().withSuccessHandler(handlerSucesso).withFailureHandler(handlerErro).obterRelatorioResumoMensal(mes, ano);
  } else if (tipo === 'abonos_anuais') {
    tituloUltimoRelatorio = "Relatório de Cotas de Abonadas do Ano Corrente";
    backendApi().withSuccessHandler(handlerSucesso).withFailureHandler(handlerErro).obterRelatorioAbonosAnuais();
  }
}

let ordenacaoRelatorio = { coluna: -1, asc: true };

function ordenarTabelaRelatorio(thElement, colIndex) {
  const tbody = document.getElementById('tabela-relatorio-body');
  const rows = Array.from(tbody.querySelectorAll('tr:not(.summary-row)'));
  if (rows.length === 0 || rows[0].querySelector('td[colspan]')) return;
  
  const asc = (ordenacaoRelatorio.coluna === colIndex) ? !ordenacaoRelatorio.asc : true;
  ordenacaoRelatorio = { coluna: colIndex, asc: asc };
  
  const ths = thElement.parentElement.querySelectorAll("th");
  ths.forEach(t => {
    t.innerHTML = t.innerHTML.replace(/ \u25B2| \u25BC/g, ''); // Remove arrows
    t.style.backgroundColor = "";
  });
  thElement.innerHTML += asc ? " \u25B2" : " \u25BC";
  thElement.style.backgroundColor = "rgba(0,0,0,0.05)";
  
  rows.sort((a, b) => {
    const cellA = a.children[colIndex].innerText.trim();
    const cellB = b.children[colIndex].innerText.trim();
    
    const dateRegex = /^(\d{2})\/(\d{2})\/(\d{4})/;
    if (dateRegex.test(cellA) && dateRegex.test(cellB)) {
      const da = cellA.split(' ')[0].split('/');
      const db = cellB.split(' ')[0].split('/');
      const timeA = new Date(da[2], da[1]-1, da[0]).getTime();
      const timeB = new Date(db[2], db[1]-1, db[0]).getTime();
      return asc ? timeA - timeB : timeB - timeA;
    }
    
    const numA = parseFloat(cellA.replace(/[^\d.-]/g, ''));
    const numB = parseFloat(cellB.replace(/[^\d.-]/g, ''));
    
    if (!isNaN(numA) && !isNaN(numB) && cellA.match(/\d/) && cellB.match(/\d/)) {
      return asc ? numA - numB : numB - numA;
    }
    
    return asc ? cellA.localeCompare(cellB) : cellB.localeCompare(cellA);
  });
  
  const summary = tbody.querySelector('.summary-row');
  const novoDados = [];
  
  rows.forEach((r, idx) => {
    tbody.appendChild(r);
    novoDados.push(dadosUltimoRelatorio[parseInt(r.dataset.index)]);
    r.dataset.index = idx; // Update index to match new array positions
  });
  
  dadosUltimoRelatorio = novoDados;
  
  if (summary) tbody.appendChild(summary);
}

/**

 */

  if (dadosUltimoRelatorio.length === 0) return;
  const tipo = document.getElementById('rep-tipo').value;
  
  // Constrói cabeçalho CSV
  let csv = colunasUltimoRelatorio.join(";") + "\r\n";
  
  dadosUltimoRelatorio.forEach(item => {
    let linha = [];
    switch (tipo) {
      case 'compulsorias':
        const limE = calcularLimiteCompulsoria(item);
        linha.push(item.nome || "");
        linha.push(item.matricula || "");
        linha.push(item.cargo || "");
        linha.push(item.lotacao || "");
        linha.push(item.saldoHoje != null ? item.saldoHoje : "0");
        linha.push(limE.limiteInicio);
        linha.push(limE.vencimento3);
        break;
      case 'situacao_ferias':
        linha.push(item.nome || "");
        linha.push(item.matricula || "");
        linha.push(item.cargo || "");
        linha.push(item.lotacao || "");
        linha.push(item.saldoHoje != null ? item.saldoHoje : "0");
        break;
      case 'calendario_ausencias':
        linha.push(item.nome || "");
        linha.push(item.matricula || "");
        linha.push(item.tipo || "");
        linha.push(item.inicio || "");
        linha.push(item.fim || "");
        linha.push(item.dias != null ? item.dias : "0");
        break;
      case 'resumo_mensal':
        linha.push(item.idoc || "");
        linha.push(item.dataSolicitacao || "");
        linha.push(item.tipo || "");
        linha.push(item.nome || "");
        linha.push(item.matricula || "");
        linha.push(item.dataInicio || "");
        linha.push(item.diasPecunia > 0 ? `${item.dias} gozo + ${item.diasPecunia} pecúnia` : (item.dias > 0 ? item.dias : (item.qtdHoras || "")));
        linha.push(item.status || "");
        break;
      case 'abonos_anuais':
        linha.push(item.nome || "");
        linha.push(item.matricula || "");
        linha.push(item.lotacao || "");
        linha.push(item.abonosUsados != null ? item.abonosUsados : "0");
        linha.push(item.limiteAnual != null ? item.limiteAnual : "5");
        linha.push(item.saldoRestante != null ? item.saldoRestante : "0");
        break;
    }
    
    // Escapa aspas
    let linhaEscapada = linha.map(col => {
      let texto = String(col).replace(/"/g, '""');
      return '"' + texto + '"';
    });
    csv += linhaEscapada.join(";") + "\r\n";
  });
  
  if (tipo === 'calendario_ausencias') {
    let counts = {};
    dadosUltimoRelatorio.forEach(a => counts[a.tipo] = (counts[a.tipo] || 0) + 1);
    let sumText = `TOTAL: ${dadosUltimoRelatorio.length} ausências.`;
    for (let k in counts) sumText += ` | ${k}: ${counts[k]}`;
    csv += `"${sumText}";;;;;\r\n`;
  }
  
  // Força download
  const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.setAttribute("href", url);
  link.setAttribute("download", `Relatorio_${tituloUltimoRelatorio.replace(/\s+/g, "_")}.csv`);
  link.style.visibility = 'hidden';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

/**
 * Calcula a data limite para o início das férias com base na liberação do próximo (3º) período.
 */
function calcularLimiteCompulsoria(servidor) {
  if (servidor.dataTerceiroPeriodo === 'Já vencido') {
    return { vencimento3: 'Já vencido', limiteInicio: 'Imediato', diasRestantes: 0 };
  }

  if (servidor.dataTerceiroPeriodo) {
    const partesRisco = String(servidor.dataTerceiroPeriodo).split('/');
    if (partesRisco.length === 3) {
      const dataVencRisco = new Date(Number(partesRisco[2]), Number(partesRisco[1]) - 1, Number(partesRisco[0]));
      const dataLimiteRisco = new Date(dataVencRisco);
      dataLimiteRisco.setDate(dataVencRisco.getDate() - 30);
      return {
        vencimento3: servidor.dataTerceiroPeriodo,
        limiteInicio: formatarDataDate_(dataLimiteRisco),
        diasRestantes: Number.isFinite(Number(servidor.diasParaTerceiroPeriodo)) ? Number(servidor.diasParaTerceiroPeriodo) - 30 : null
      };
    }
  }

  const periodos = servidor.periodosFerias || [];
  const proximo = periodos.find(p => p.status === "Em aquisição");
  
  if (proximo && proximo.dataLiberacao) {
    const partes = proximo.dataLiberacao.split('/');
    if (partes.length === 3) {
      const dataVenc = new Date(partes[2], partes[1] - 1, partes[0]);
      const dataLimit = new Date(dataVenc);
      dataLimit.setDate(dataVenc.getDate() - 30);
      
      const hoje = new Date();
      hoje.setHours(0,0,0,0);
      const diffTime = dataLimit.getTime() - hoje.getTime();
      const diasRestantes = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      
      return {
        vencimento3: proximo.dataLiberacao,
        limiteInicio: formatarDataDate_(dataLimit),
        diasRestantes: diasRestantes
      };
    }
  }
  
  if (servidor.admissao) {
    const partes = servidor.admissao.split('/');
    if (partes.length === 3) {
      const diaAdm = parseInt(partes[0]);
      const mesAdm = parseInt(partes[1]) - 1;
      const hoje = new Date();
      hoje.setHours(0,0,0,0);
      
      let anoVenc = hoje.getFullYear();
      let dataVenc = new Date(anoVenc, mesAdm, diaAdm);
      
      if (dataVenc < hoje) {
        anoVenc++;
        dataVenc = new Date(anoVenc, mesAdm, diaAdm);
      }
      
      const dataLimit = new Date(dataVenc);
      dataLimit.setDate(dataVenc.getDate() - 30);
      const diffTime = dataLimit.getTime() - hoje.getTime();
      const diasRestantes = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      
      return {
        vencimento3: formatarDataDate_(dataVenc),
        limiteInicio: formatarDataDate_(dataLimit),
        diasRestantes: diasRestantes
      };
    }
  }
  
  return {
    vencimento3: "-",
    limiteInicio: "-",
    diasRestantes: null
  };
}

function formatarDataDate_(date) {
  const dd = String(date.getDate()).padStart(2, '0');
  const mm = String(date.getMonth() + 1).padStart(2, '0');
  const yyyy = date.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

async function copiarCampoFicha(idElemento, rotulo) {
  const texto = String(document.getElementById(idElemento)?.textContent || '').trim();
  if (!texto || texto === '-') {
    mostrarToast(`${rotulo || 'Informação'} não informado.`, 'warning');
    return;
  }
  try {
    if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('Clipboard indisponível');
    await navigator.clipboard.writeText(texto);
  } catch (erro) {
    const area = document.createElement('textarea');
    area.value = texto;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.left = '-9999px';
    document.body.appendChild(area);
    area.select();
    const copiado = document.execCommand('copy');
    document.body.removeChild(area);
    if (!copiado) return mostrarToast(`Não foi possível copiar ${String(rotulo || 'a informação').toLowerCase()}.`, 'error');
  }
  mostrarToast(`${rotulo || 'Informação'} copiado com sucesso!`, 'success');
}

  const input = document.getElementById(`cfg-val-${linha}`);

  if (!valor) {
    mostrarToast("O valor do parâmetro não pode ficar em branco.", 'warning');

  exibirLoader(true);

    .withSuccessHandler(async function() {

    })
    .withFailureHandler(function(e) {
      exibirLoader(false);
      mostrarToast("Erro ao atualizar parâmetro: " + e.toString(), 'error');
    })
    .salvarConfiguracao({
      linhaPlanilha: linha,
      chave: chave,
      valor: valor
    });

/**
 * Filtra tabela de logs no cliente em tempo real
 */
function filtrarLogsAuditoria() {
  const busca = normalizarTextoBusca(document.getElementById('log-filtro-busca').value);
  const modulo = document.getElementById('log-filtro-modulo').value;
  const acao = document.getElementById('log-filtro-acao').value;
  
  const filtrados = AppState.logs.filter(l => {
    const bateBusca = correspondeBusca(busca, l.usuario, l.descricao, l.idRegistro);
    const bateModulo = !modulo || l.modulo === modulo;
    const bateAcao = !acao || l.acao === acao;
    return bateBusca && bateModulo && bateAcao;
  });
  
  renderizarTabelaLogs(filtrados);
}

function renderizarControlesPaginacao(idContainer, tipoTabela, totalItens) {
  const container = document.getElementById(idContainer);
  if (!container) return;
  
  const estado = AppState.paginacao[tipoTabela];
  const totalPaginas = Math.ceil(totalItens / estado.itensPorPagina) || 1;
  
  if (estado.paginaAtual > totalPaginas) estado.paginaAtual = totalPaginas;
  if (estado.paginaAtual < 1) estado.paginaAtual = 1;
  
  const html = `
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-size: 13px; color: var(--text-secondary);">
      <div>Mostrando ${(estado.paginaAtual - 1) * estado.itensPorPagina + (totalItens > 0 ? 1 : 0)} a ${Math.min(estado.paginaAtual * estado.itensPorPagina, totalItens)} de ${totalItens} registros</div>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 13px;" ${estado.paginaAtual === 1 ? 'disabled' : ''} onclick="mudarPagina('${tipoTabela}', ${estado.paginaAtual - 1})">Anterior</button>
        <span style="display: flex; align-items: center; padding: 0 8px; font-weight: 600;">${estado.paginaAtual} / ${totalPaginas}</span>
        <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 13px;" ${estado.paginaAtual === totalPaginas ? 'disabled' : ''} onclick="mudarPagina('${tipoTabela}', ${estado.paginaAtual + 1})">Próxima</button>
      </div>
    </div>
  `;
  container.innerHTML = html;
}

function mudarPagina(tipoTabela, novaPagina) {
  AppState.paginacao[tipoTabela].paginaAtual = novaPagina;
  
  if (tipoTabela === 'servidores') {
    renderizarTabelaServidores(AppState.paginacao.servidores.listaAtual, true);
  } else if (tipoTabela === 'lancamentos') {
    renderizarTabelaLancamentos(AppState.paginacao.lancamentos.listaAtual, true);
  } else if (tipoTabela === 'protocolos') {
    renderizarTabelaProtocolos(AppState.paginacao.protocolos.listaAtual, true);
  }
}

    const matricula = document.getElementById('lanc-matricula').value;
    const dataSol = document.getElementById('lanc-data-solicitacao').value;
    
    if (!tipo || !matricula || !dataSol) {
      mostrarToast("Preencha todos os campos obrigatórios da Etapa 1 (Tipo, Servidor e Data da Solicitação).", "warning");
      return;
    }
    
    document.getElementById('lanc-step-1').style.display = 'none';
    document.getElementById('lanc-step-2').style.display = 'block';
    document.getElementById('btn-lanc-voltar').style.display = 'block';
    etapaAtualWizard = 2;
    
  } else if (etapaAtualWizard === 2) {
    // Validação da Etapa 2 baseada no Tipo
    const tipo = document.getElementById('lanc-tipo').value;
    
    if (tipo.includes("Férias") || tipo === "Licença Prêmio" || tipo === "Atestado") {
      if (!document.getElementById('lanc-data-inicio').value) {
        mostrarToast("A Data de Início é obrigatória para este tipo de documento.", "warning");
        return;
      }
      if (tipo === "Atestado" && Number(document.getElementById('lanc-dias').value || 0) < 1) {
        mostrarToast("Informe pelo menos um dia de afastamento para o atestado.", "warning");
        return;
      }
    } else if (tipo === "Abonada Eleitoral") {
      sincronizarDataEleitoralDigitada_();
      if (!document.getElementById('lanc-pleito-eleitoral').value.trim() || !obterDatasAbonoEleitoral_().length) {
        mostrarToast("Informe o pleito e adicione ao menos uma data de folga eleitoral.", "warning");
        return;
      }
    } else if (tipo === "Autorização de Horas Extras") {
      if (!document.getElementById('lanc-qtd-horas').value) {
        mostrarToast("A quantidade de horas é obrigatória.", "warning");
        return;
      }
    } else if (tipo !== "Avaliação do Estágio Probatório" && tipo !== "Não Efetivado (Anulado)") {
      if (!document.getElementById('lanc-data-falta').value) {
        mostrarToast("A data da falta/afastamento é obrigatória.", "warning");
        return;
      }
    }

    document.getElementById('lanc-step-2').style.display = 'none';
    document.getElementById('lanc-step-3').style.display = 'block';
    
    document.getElementById('btn-lanc-avancar').style.display = 'none';
    document.getElementById('btn-lanc-salvar').style.display = 'flex'; // Usar flex por causa do ícone
    etapaAtualWizard = 3;
  }
}

function voltarPassoLancamento() {
  if (etapaAtualWizard === 3) {
    document.getElementById('lanc-step-3').style.display = 'none';
    document.getElementById('lanc-step-2').style.display = 'block';
    
    document.getElementById('btn-lanc-avancar').style.display = 'block';

    document.getElementById('lanc-step-1').style.display = 'block';
    
    document.getElementById('btn-lanc-voltar').style.display = 'none';
    etapaAtualWizard = 1;
  }
}

function abrirModalQuick1Doc(linhaPlanilha, nomeServidor, idocAtual) {
  document.getElementById('quick-idoc-linha').value = linhaPlanilha;
  document.getElementById('quick-idoc-input').value = idocAtual || "";
  const inputAnexo = document.getElementById('quick-1doc-anexo');
  const containerAnexo = document.getElementById('quick-1doc-anexo-container');
  const lancamento = AppState.lancamentos.find(item => item.linhaPlanilha === Number(linhaPlanilha));
  const matriculaLancamento = String(lancamento?.matricula || '').trim();
  const nomeLancamento = String(lancamento?.nome || nomeServidor || '').trim();
  const normalizarComparacao = valor => String(valor || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .trim()
    .toLowerCase();
  const servidor = (AppState.servidores || []).find(item =>
    matriculaLancamento && String(item.matricula || '').trim() === matriculaLancamento
  ) || (AppState.servidores || []).find(item =>
    nomeLancamento && normalizarComparacao(item.nome) === normalizarComparacao(nomeLancamento)
  );
  const preencherDado = (id, valor) => {
    const elemento = document.getElementById(id);
    if (elemento) elemento.innerText = String(valor || '').trim() || '-';
  };

  preencherDado('quick-1doc-servidor', servidor?.nome || nomeLancamento);
  preencherDado('quick-1doc-matricula', servidor?.matricula || matriculaLancamento);
  preencherDado('quick-1doc-cargo', servidor?.cargo);
  preencherDado('quick-1doc-lotacao', servidor?.lotacao || lancamento?.lotacao);
  preencherDado('quick-1doc-email', servidor?.email);

  const diasGozo = parseInt(lancamento?.dias, 10) || 0;
  const diasPecunia = parseInt(lancamento?.diasPecunia, 10) || 0;
  let quantidadeLancamento = lancamento?.qtdHoras || '-';
  if (diasPecunia > 0) quantidadeLancamento = `${diasGozo} gozo + ${diasPecunia} pecúnia`;
  else if (diasGozo > 0) quantidadeLancamento = `${diasGozo} ${diasGozo === 1 ? 'dia' : 'dias'}`;
  preencherDado('quick-1doc-tipo', lancamento?.tipo);
  preencherDado('quick-1doc-data', lancamento?.dataInicio);
  preencherDado('quick-1doc-quantidade', quantidadeLancamento);

  const possuiAnexo = lancamento && [lancamento.anexo1, lancamento.anexo2, lancamento.anexo3]
    .some(valor => valor && String(valor).trim() && String(valor).trim() !== 'undefined');
  if (inputAnexo) inputAnexo.value = '';
  atualizarVisualDropzoneAnexo(inputAnexo);
  if (containerAnexo) containerAnexo.style.display = possuiAnexo ? 'none' : 'block';
  
  abrirModal('modal-quick-1doc');
  renderizarIcones();
  
  // Foca no input após abrir (pequeno delay para transição)
  setTimeout(() => {
    document.getElementById('quick-idoc-input').focus();
  }, 100);
}

function atualizarQuick1DocPromessa(linhaPlanilha, novo1Doc, novoAnexo) {
  return new Promise((resolver, rejeitar) => {
    backendApi()
      .withSuccessHandler(resolver)
      .withFailureHandler(rejeitar)
      .atualizar1DocLote(linhaPlanilha, novo1Doc, novoAnexo || '');
  });
}

async function salvarQuick1Doc() {
  const linhaPlanilha = parseInt(document.getElementById('quick-idoc-linha').value);
  const novo1Doc = document.getElementById('quick-idoc-input').value.trim();
  const inputAnexo = document.getElementById('quick-1doc-anexo');
  const arquivo = inputAnexo && inputAnexo.offsetParent !== null ? inputAnexo.files[0] : null;
  
  if (!linhaPlanilha) return;
  if (arquivo && ((arquivo.type && arquivo.type !== 'application/pdf') || !arquivo.name.toLowerCase().endsWith('.pdf'))) {
    return mostrarToast('Selecione um arquivo PDF válido.', 'error');
  }
  if (arquivo && arquivo.size > 10 * 1024 * 1024) {
    return mostrarToast('O anexo excede o limite de 10 MB.', 'error');
  }

  exibirLoader(true);
  const botaoSalvar = document.getElementById('quick-1doc-salvar');
  if (botaoSalvar) botaoSalvar.disabled = true;
  let uploadCriado = null;
  try {
    if (arquivo) uploadCriado = await uploadArquivoPromessa(arquivo);
    const resultado = await atualizarQuick1DocPromessa(linhaPlanilha, novo1Doc, uploadCriado ? uploadCriado.url : '');
    const lancamento = AppState.lancamentos.find(item => item.linhaPlanilha === linhaPlanilha);
    if (lancamento) {
      lancamento.idoc = novo1Doc;
      if (resultado && resultado.anexoAdicionado) lancamento.anexo1 = resultado.anexoAdicionado;
    }
    fecharModal('modal-quick-1doc');
    carregarListaLancamentos();
    mostrarToast(uploadCriado ? '1Doc e anexo atualizados com sucesso!' : '1Doc atualizado com sucesso!', 'success');
  } catch (erro) {
    if (uploadCriado && uploadCriado.id) backendApi().withFailureHandler(function() {}).removerArquivoDrive(uploadCriado.id);
    mostrarToast('Não foi possível atualizar o lançamento: ' + mensagemErro(erro), 'error');
  } finally {
    exibirLoader(false);
    if (botaoSalvar) botaoSalvar.disabled = false;
  }
}

window.addEventListener('pointerdown', function habilitarSomEntidade() {
  try {

    if (AudioCtx && !entidadeAudioContext) entidadeAudioContext = new AudioCtx();
    if (entidadeAudioContext && entidadeAudioContext.state === 'suspended') entidadeAudioContext.resume();

      entidadeSomPendente = false;
      tocarSomNotificacao();

}, { once: true });

function toggleChatEntidade() {
  if (entidadeChatAberto || entidadeChatAbrindo) {
    fecharChatEntidade();
    return;
  }
  if (entidadeFantasmaSaindo) return;
  const tokenAbertura = ++entidadeAberturaToken;
  entidadeChatAbrindo = true;
  AppState.conviteEntidadePendente = false;
  const chatWindow = document.getElementById('entidade-chat-window');
  const fantasma = document.getElementById('entidade-fab');
  pararFantasmaErrante_();
  restaurarFantasmaNoWidget_();

  const jaEstavaVisivelComMensagem = fantasma.classList.contains('has-notification');
  function concluirAberturaChat_() {
    if (tokenAbertura !== entidadeAberturaToken) return;
    fantasma.classList.remove('enter-right');
    entidadeChatAbrindo = false;
    entidadeChatAberto = true;
    chatWindow.style.display = 'flex';
    if (document.getElementById('sync-detailed-status')?.classList.contains('show')) {
      requestAnimationFrame(mostrarFalaEntidadeStatus_);
    }
    document.getElementById('entidade-input').focus();
    if (!jaEstavaVisivelComMensagem && !entidadeSaudacaoInicialExibida) {
      addMensagemEntidade('Olá! Como posso ajudar?', false);
      entidadeSaudacaoInicialExibida = true;
    }
    if (entidadeMensagemTemporariaRep) {
      addMensagemEntidade(entidadeMensagemTemporariaRep, false);
      entidadeHistorico.push({ role: 'assistant', content: entidadeMensagemTemporariaRep });
      entidadeMensagemTemporariaRep = '';
    }
    if (!entidadeVigiaAtivo) {
      entidadeVigiaAtivo = true;
      iniciarVigia();
    }
    solicitarBriefingDiarioEntidade(true);
  }

  fantasma.classList.remove('has-notification', 'roaming', 'leaving', 'exit-left', 'exit-right', 'enter-left', 'enter-right');
  fantasma.style.removeProperty('left');
  fantasma.style.removeProperty('top');
  fantasma.style.display = 'grid';
  fantasma.classList.add('chat-open');
  requestAnimationFrame(function() { setTimeout(concluirAberturaChat_, jaEstavaVisivelComMensagem ? 120 : 260); });
}

function solicitarBriefingDiarioEntidade(exibirNoChat = false, forcarAtualizacao = false, notificar = true) {
  if (exibirNoChat) entidadeBriefingExibirAoCarregar = true;

  if (AppState.briefingDiarioEntidade && !forcarAtualizacao) {
    renderizarCardInteligenteDashboard(AppState.insightEntidade);
    apresentarBriefingDiarioNoChat_();
    return;
  }
  if (entidadeBriefingDiarioSolicitado) return;
  entidadeBriefingDiarioSolicitado = true;
  if (entidadeBriefingExibirAoCarregar) setEntidadePensando(true);

  backendApi()
    .withSuccessHandler(function(res) {
      entidadeBriefingDiarioSolicitado = false;
      if (entidadeBriefingExibirAoCarregar) setEntidadePensando(false);
      if (!res || !res.disponivel || !res.resposta) return;
      const briefingAnterior = AppState.briefingDiarioEntidade;
      const briefingMudou = !briefingAnterior || String(briefingAnterior.fingerprint || '') !== String(res.fingerprint || '');
      if (!notificar && res.mostrar && briefingMudou) {
        res.mostrar = false;
        backendApi().withFailureHandler(function() {}).marcarBriefingDiarioEntidadeComoVisto();
      }
      AppState.briefingDiarioEntidade = res;
      renderizarCardInteligenteDashboard(AppState.insightEntidade);
      if ((notificar && res.mostrar && briefingMudou) || entidadeTestePrimeiroAcesso) {
        // Parâmetro temporário de teste: reproduz o convite visual da primeira abertura
        // sem alterar o marcador diário salvo no servidor.
        exibirBadgeNotificacao();
        // O ticker apresenta o briefing integral; clicar nele continua sendo
        // apenas um atalho opcional para conversar com a Entidade.
        exibirInsightStatus(res.resposta);
        entidadeUltimoResumoNotificadoEm = Date.now();
        backendApi().withFailureHandler(function() {}).marcarBriefingDiarioEntidadeComoVisto();
      }
      apresentarBriefingDiarioNoChat_();
    })
    .withFailureHandler(function(erro) {
      entidadeBriefingDiarioSolicitado = false;
      if (entidadeBriefingExibirAoCarregar) setEntidadePensando(false);
      console.warn('Não foi possível carregar o briefing diário da Entidade:', erro);
    })
    .obterBriefingDiarioEntidade();
}

/** Reconsulta os fatos e a IA depois de uma gravação confirmada. */
function atualizarLeiturasEntidadeAposMudanca_() {
  AppState.briefingDiarioEntidade = null;
  AppState.mensagemEntidadeOculta = '';
  entidadeBriefingDiarioSolicitado = false;
  solicitarBriefingDiarioEntidade(false, true, false);
  consultarInsightEntidade();
}

function apresentarBriefingDiarioNoChat_() {
  const briefing = AppState.briefingDiarioEntidade;
  if (!entidadeBriefingExibirAoCarregar || entidadeBriefingMensagemExibida || !briefing || !briefing.mostrar || !briefing.resposta) return;

  entidadeBriefingMensagemExibida = true;
  addMensagemEntidade(briefing.resposta, false, false, false, briefing.interacaoId || '');
  entidadeHistorico.push({ role: 'assistant', content: limparComandosEntidade(briefing.resposta) });

}

async function carregarProtecaoDados() {
  const titulo = document.getElementById('protecao-dados-titulo');
  const resumo = document.getElementById('protecao-dados-resumo');
  const capacidade = document.getElementById('protecao-dados-capacidade');
  if (!titulo || !resumo) return;
  titulo.textContent = 'Verificando a base...';
  try {
    const status = await chamarBackendPromessa_('obterStatusProtecaoDados', []);
    titulo.textContent = status.integra ? 'Base íntegra' : 'Atenção necessária';
    const data = status.ultimaCopiaEm ? new Date(status.ultimaCopiaEm).toLocaleString('pt-BR') : 'ainda não criada';
    resumo.textContent = status.integra ? 'Última cópia completa: ' + data + '.' : (status.erros || []).join(' ');
    if (capacidade && status.capacidade) {
      const usado = Number(status.capacidade.percentual || 0).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
      capacidade.textContent = 'Espaço da base em uso: ' + usado + '%. O sistema libera automaticamente linhas vazias e arquiva históricos técnicos antigos antes que o limite se torne um problema.';
    }
    const backup = document.getElementById('protecao-dados-backup-link');
    const pasta = document.getElementById('protecao-dados-pasta-link');
    const historico = document.getElementById('protecao-dados-historico-link');
    if (backup) { backup.hidden = !status.ultimaCopiaUrl; backup.href = status.ultimaCopiaUrl || '#'; }
    if (pasta) { pasta.hidden = !status.pastaUrl; pasta.href = status.pastaUrl || '#'; }
    if (historico) { historico.hidden = !status.pastaHistoricoUrl; historico.href = status.pastaHistoricoUrl || '#'; }
    if (status.ultimoErro) mostrarToast('A última proteção automática informou: ' + status.ultimoErro, 'warning');
  } catch (erro) {
    titulo.textContent = 'Não foi possível conferir agora';
    resumo.textContent = mensagemErro(erro);
    if (capacidade) capacidade.textContent = '';
  }
}

function tocarSomNotificacao() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!entidadeAudioContext && AudioCtx) entidadeAudioContext = new AudioCtx();
    if (!entidadeAudioContext || entidadeAudioContext.state !== 'running') {
      entidadeSomPendente = true;
      if (entidadeAudioContext && entidadeAudioContext.state === 'suspended') entidadeAudioContext.resume().catch(() => {});
      return;
    }

    const inicio = entidadeAudioContext.currentTime;
    [659.25, 783.99, 987.77].forEach(function(frequencia, indice) {
      const oscilador = entidadeAudioContext.createOscillator();
      const ganho = entidadeAudioContext.createGain();
      oscilador.type = 'sine';
      oscilador.frequency.value = frequencia;
      ganho.gain.setValueAtTime(0.0001, inicio + indice * 0.11);
      ganho.gain.exponentialRampToValueAtTime(0.16, inicio + indice * 0.11 + 0.02);
      ganho.gain.exponentialRampToValueAtTime(0.0001, inicio + indice * 0.11 + 0.28);
      oscilador.connect(ganho);
      ganho.connect(entidadeAudioContext.destination);
      oscilador.start(inicio + indice * 0.11);
      oscilador.stop(inicio + indice * 0.11 + 0.3);
    });
  } catch (e) {
    const audio = document.getElementById('entidade-audio');
    if (audio) audio.play().catch(() => { entidadeSomPendente = true; });
  }
}

function agendarProximaAtividadeFantasma_() {
  if (entidadeFantasmaErranteTimer) clearTimeout(entidadeFantasmaErranteTimer);
  entidadeFantasmaErranteTimer = null;
  if (entidadeChatAberto || entidadeChatAbrindo || entidadeFantasmaSaindo || entidadeFantasmaEmPasseio || AppState.conviteEntidadePendente) return;
  entidadeFantasmaErranteTimer = setTimeout(function() {
    if (!entidadeFantasmaFilaAtividades.length) {
      entidadeFantasmaFilaAtividades = [
        'passeio', 'idle-reading', 'idle-sleeping', 'idle-coffee',
        'idle-orb', 'idle-juggling', 'idle-sunbathing', 'idle-dancing'
      ];
      // Fisher-Yates: cada cena aparece uma vez antes de qualquer repetição.
      for (let i = entidadeFantasmaFilaAtividades.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [entidadeFantasmaFilaAtividades[i], entidadeFantasmaFilaAtividades[j]] = [entidadeFantasmaFilaAtividades[j], entidadeFantasmaFilaAtividades[i]];
      }
      if (entidadeFantasmaFilaAtividades[0] === entidadeFantasmaUltimaAnimacaoOciosa) {
        const troca = 1 + Math.floor(Math.random() * (entidadeFantasmaFilaAtividades.length - 1));
        [entidadeFantasmaFilaAtividades[0], entidadeFantasmaFilaAtividades[troca]] = [entidadeFantasmaFilaAtividades[troca], entidadeFantasmaFilaAtividades[0]];
      }
    }
    const escolhida = entidadeFantasmaFilaAtividades.shift();
    entidadeFantasmaUltimaAnimacaoOciosa = escolhida;
    if (escolhida === 'passeio') {
      iniciarPasseioFantasma_();
    } else {
      iniciarAnimacaoOciosaFantasma_(escolhida);
    }
  }, 50000 + Math.round(Math.random() * 50000));
}

function iniciarAnimacaoOciosaFantasma_(escolhida) {
  if (entidadeChatAberto || entidadeChatAbrindo || entidadeFantasmaSaindo || entidadeFantasmaEmPasseio || AppState.conviteEntidadePendente) return;
  const fantasma = document.getElementById('entidade-fab');

  limparAnimacaoOciosaFantasma_();
  fantasma.classList.add(escolhida, 'idle-entering');
  setTimeout(function() { fantasma.classList.remove('idle-entering'); }, 520);
  entidadeFantasmaAnimacaoOciosaTimer = setTimeout(function() {
    fantasma.classList.add('idle-leaving');
    entidadeFantasmaAnimacaoOciosaTimer = setTimeout(function() {
      limparAnimacaoOciosaFantasma_();
      agendarProximaAtividadeFantasma_();
    }, 620);
  }, 5200 + Math.round(Math.random() * 1800));
}

function iniciarPasseioFantasma_() {
  const fantasma = document.getElementById('entidade-fab');
  if (!fantasma || entidadeChatAberto || entidadeChatAbrindo || entidadeFantasmaSaindo || AppState.conviteEntidadePendente) return;
  const base = obterPosicaoBaseFantasma_();
  const areaConteudo = document.querySelector('.view-container');
  const camadaConteudo = document.querySelector('.view-section.active');
  if (!base || !areaConteudo || !camadaConteudo) return agendarProximaAtividadeFantasma_();
  entidadeFantasmaEmPasseio = true;
  if (entidadeFantasmaAnimacaoOciosaTimer) clearTimeout(entidadeFantasmaAnimacaoOciosaTimer);
  entidadeFantasmaAnimacaoOciosaTimer = null;
  limparAnimacaoOciosaFantasma_();
  criarPlacaPasseio_(base);
  fantasma.classList.add('colocando-placa');
  const largura = fantasma.offsetWidth || 34;
  const altura = fantasma.offsetHeight || 34;
  const margem = 24;
  const limiteInferior = Math.max(120, base.y - 70);
  const destinos = [
    { x: window.innerWidth * (.18 + Math.random() * .16), y: window.innerHeight * (.56 + Math.random() * .10) },
    { x: window.innerWidth * (.44 + Math.random() * .18), y: window.innerHeight * (.25 + Math.random() * .18) },
    { x: window.innerWidth * (.70 + Math.random() * .14), y: window.innerHeight * (.48 + Math.random() * .14) }
  ];

  function mover(destino) {
    if (!entidadeFantasmaEmPasseio) return;
    definirDirecaoMovimentoFantasma_(destino.x, false);
    fantasma.style.left = Math.round(Math.min(window.innerWidth - largura - margem, Math.max(margem, destino.x))) + 'px';
    fantasma.style.top = Math.round(Math.min(limiteInferior, Math.max(84, destino.y))) + 'px';
  }

  // Primeiro apoia e abre a placa. Depois sobe para fora da barra.
  fantasma.style.left = Math.round(base.x) + 'px';
  fantasma.style.top = Math.round(base.y) + 'px';
  entidadeFantasmaPasseioTimers.push(setTimeout(function() {
    if (!entidadeFantasmaEmPasseio) return;
    fantasma.classList.remove('colocando-placa');
    definirDirecaoMovimentoFantasma_(base.x, true);
    fantasma.classList.add('subindo-do-rodape');
    void fantasma.offsetWidth;
    requestAnimationFrame(function() {
      if (entidadeFantasmaEmPasseio) fantasma.style.top = Math.round(base.y - 68) + 'px';
    });
  }, 1600));

  // Só depois da subida entra na camada entre o fundo e os cartões.
  entidadeFantasmaPasseioTimers.push(setTimeout(function() {
    if (!entidadeFantasmaEmPasseio) return;
    const posicaoVisual = fantasma.getBoundingClientRect();
    camadaConteudo.insertBefore(fantasma, camadaConteudo.firstChild);
    fantasma.style.left = Math.round(posicaoVisual.left) + 'px';
    fantasma.style.top = Math.round(posicaoVisual.top) + 'px';
    fantasma.classList.remove('subindo-do-rodape');
    fantasma.classList.add('passeando');
    void fantasma.offsetWidth;
    requestAnimationFrame(function() { mover(destinos[0]); });
  }, 4000));
  entidadeFantasmaPasseioTimers.push(setTimeout(function() { mover(destinos[1]); }, 8600));
  entidadeFantasmaPasseioTimers.push(setTimeout(function() { mover(destinos[2]); }, 13200));

  // Retorna primeiro ao ponto acima do rodapé, ainda atrás dos elementos.
  entidadeFantasmaPasseioTimers.push(setTimeout(function() {
    if (!entidadeFantasmaEmPasseio) return;
    definirDirecaoMovimentoFantasma_(base.x, false);
    fantasma.style.left = Math.round(base.x) + 'px';
    fantasma.style.top = Math.round(base.y - 68) + 'px';
  }, 17800));

  // Sai da camada de conteúdo e desce suavemente para sua posição original.
  entidadeFantasmaPasseioTimers.push(setTimeout(function() {
    if (!entidadeFantasmaEmPasseio) return;
    const posicaoVisual = fantasma.getBoundingClientRect();
    restaurarFantasmaNoWidget_();
    fantasma.style.left = Math.round(posicaoVisual.left) + 'px';
    fantasma.style.top = Math.round(posicaoVisual.top) + 'px';
    fantasma.classList.remove('passeando');
    fantasma.classList.add('descendo-ao-rodape');
    definirDirecaoMovimentoFantasma_(base.x, true);
    void fantasma.offsetWidth;
    requestAnimationFrame(function() {
      if (!entidadeFantasmaEmPasseio) return;
      fantasma.style.left = Math.round(base.x) + 'px';
      fantasma.style.top = Math.round(base.y) + 'px';
    });
  }, 22600));
  entidadeFantasmaPasseioTimers.push(setTimeout(function() {
    if (!entidadeFantasmaEmPasseio) return;
    fantasma.classList.remove('descendo-ao-rodape', 'indo-direita', 'indo-esquerda', 'movendo-vertical');
    posicionarFantasmaNaBase_();
    recolherEDescartarPlacaPasseio_(fantasma);
  }, 25200));
  entidadeFantasmaPasseioTimers.push(setTimeout(function() {
    if (!entidadeFantasmaEmPasseio) return;
    entidadeFantasmaEmPasseio = false;
    fantasma.classList.remove('recolhendo-placa', 'jogando-placa');
    removerPlacaPasseio_();
    agendarProximaAtividadeFantasma_();
  }, 26800));
}

function limparComandosEntidade(texto) {
  return String(texto || '')
    .replace(/\[(?:NAVEGAR_(?:DASHBOARD|SERVIDORES|LANCAMENTOS|PROTOCOLOS|RELATORIOS)|ABRIR_MODAL_(?:LANCAMENTO|SERVIDOR|PROTOCOLO)|FILTRAR_(?:FERIAS_COMPULSORIAS|SEM_1DOC))\]/g, '')
    .replace(/\[ABRIR_FICHA_SERVIDOR:[^\]]+\]/g, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function executarComandoEntidade(texto) {
  const comandos = [
    ['[NAVEGAR_DASHBOARD]', () => navegarPara('dashboard')],
    ['[NAVEGAR_SERVIDORES]', () => navegarPara('servidores')],
    ['[NAVEGAR_LANCAMENTOS]', () => navegarPara('lancamentos')],
    ['[NAVEGAR_PROTOCOLOS]', () => navegarPara('protocolos')],
    ['[NAVEGAR_RELATORIOS]', () => navegarPara('relatorios')],
    ['[ABRIR_MODAL_LANCAMENTO]', () => abrirModalLancamento()],
    ['[ABRIR_MODAL_SERVIDOR]', () => abrirModalServidor()],
    ['[ABRIR_MODAL_PROTOCOLO]', () => abrirModalCriarProtocolo()],
    ['[FILTRAR_FERIAS_COMPULSORIAS]', () => aplicarFiltroDashboard('compulsorias')],
    ['[FILTRAR_SEM_1DOC]', () => aplicarFiltroDashboard('pendentes')]
  ];

  const ficha = String(texto || '').match(/\[ABRIR_FICHA_SERVIDOR:([^\]]+)\]/);
  if (ficha) {
    const matricula = ficha[1].trim();
    if (matricula) setTimeout(() => abrirFichaServidor(matricula), 350);
    return;
  }

  const comando = comandos.find(item => String(texto || '').includes(item[0]));
  if (comando) setTimeout(comando[1], 350);
}

function renderizarMarkdownSeguroEntidade(texto) {
  let textoSeguro = String(texto || '');
  if ((textoSeguro.match(/\*\*/g) || []).length % 2 !== 0) textoSeguro = textoSeguro.replace(/\*\*/g, '');
  return escapeHtml(textoSeguro)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/^[-*]\s+/gm, '• ')
    .replace(/\n/g, '<br>');
}

function addMensagemEntidade(texto, isUser = false, isError = false, executarAcoes = false, interacaoId = '') {
  const messagesDiv = document.getElementById('entidade-messages');
  const msgDiv = document.createElement('div');
  msgDiv.className = 'entidade-msg ' + (isError ? 'system-error' : (isUser ? 'user' : 'ia'));
  const textoVisivel = isUser || isError ? String(texto || '') : limparComandosEntidade(texto);
  
  if (isUser || isError) {
    msgDiv.innerText = textoVisivel;
  } else {
    msgDiv.innerHTML = renderizarMarkdownSeguroEntidade(textoVisivel);
    if (interacaoId) {
      const feedback = document.createElement('div');
      feedback.className = 'entidade-feedback';
      feedback.innerHTML = `<span>Esta resposta ajudou?</span>
        <button type="button" title="Resposta útil" onclick="avaliarRespostaEntidade('${escapeHtml(interacaoId)}', true, this)"><span data-lucide="thumbs-up"></span></button>

function montarContextoEntidade(mensagemUsuario = '') {
  const servidores = Array.isArray(AppState.servidores) ? AppState.servidores : [];
  const lancamentos = Array.isArray(AppState.lancamentos) ? AppState.lancamentos : [];
  const protocolos = Array.isArray(AppState.protocolos) ? AppState.protocolos : [];
  const dashboard = AppState.dashboard || {};

  const feriasCompulsorias = servidores
    .filter(s => s.feriasCompulsorias === true)
    .sort((a, b) => {
      const prazoA = a.diasParaTerceiroPeriodo == null ? 999999 : Number(a.diasParaTerceiroPeriodo);
      const prazoB = b.diasParaTerceiroPeriodo == null ? 999999 : Number(b.diasParaTerceiroPeriodo);
      return prazoA - prazoB || Number(b.saldoHoje || 0) - Number(a.saldoHoje || 0) || String(a.nome || '').localeCompare(String(b.nome || ''));
    })
    .slice(0, 30)
    .map(s => ({
      nome: s.nome,
      matricula: s.matricula,
      lotacao: s.lotacao,
      saldoDisponivelDias: Number(s.saldoHoje || 0),
      statusAtual: s.status,
      dataTerceiroPeriodo: s.dataTerceiroPeriodo || '',
      diasParaTerceiroPeriodo: s.diasParaTerceiroPeriodo,
      periodosDisponiveis: (s.periodosFerias || [])
        .filter(p => p.status === 'Disponível' && Number(p.saldo || 0) > 0)
        .map(p => ({ periodo: p.periodo || p.periodoAquisitivo || '', saldo: Number(p.saldo || 0), dataLiberacao: p.dataLiberacao || '' }))
    }));

  const pendencias1Doc = lancamentos
    .filter(l => {
      if (/(ANULAD|CANCELAD|EXCLUID|NAO EFETIVAD)/.test(normalizarTextoRep_(l.status || l.tipo))) return false;
      if (String(l.idoc || '').trim()) return false;
      const partes = String(l.dataSolicitacao || '').split('/');
      if (partes.length !== 3) return true;
      const data = new Date(Number(partes[2]), Number(partes[1]) - 1, Number(partes[0]));
      return !isNaN(data.getTime()) && ((Date.now() - data.getTime()) / 86400000) <= 365;
    })
    .slice(0, 30)
    .map(l => ({ nome: l.nome, matricula: l.matricula, tipo: l.tipo, dataSolicitacao: l.dataSolicitacao, status: l.status, linhaPlanilha: l.linhaPlanilha }));

  const porLotacao = {};
  servidores.forEach(s => {
    const lotacao = String(s.lotacao || 'Não informada').trim() || 'Não informada';
    porLotacao[lotacao] = (porLotacao[lotacao] || 0) + 1;
  });

  const statusProtocolos = {};
  protocolos.forEach(p => {
    const status = String(p.status || 'Não informado');
    statusProtocolos[status] = (statusProtocolos[status] || 0) + 1;
  });

  return JSON.stringify({
    telaAtual: currentView,
    perfilUsuario: AppState.usuarioLogado && AppState.usuarioLogado.papel,
    dadosAtualizadosDoServidor: Boolean(AppState.dadosCompletosCarregados),
    resumoOficial: {
      servidoresAtivos: Number(dashboard.ativos || 0),
      feriasCompulsorias: Number(dashboard.compulsorias || 0),
      ausentesHoje: Number(dashboard.ausentesHoje || 0),
      lancamentosSem1Doc: Number(dashboard.protocolosPendentes || 0)
    },
    ausenciasHoje: (dashboard.listaAusentes || []).slice(0, 20).map(a => ({ nome: a.nome, matricula: a.matricula, tipo: a.tipo, periodo: a.periodo, dias: a.dias, idoc: a.idoc || '' })),
    servidoresEmFeriasCompulsorias: feriasCompulsorias,
    pendenciasDe1Doc: pendencias1Doc,
    equipePorLotacao: Object.entries(porLotacao).sort((a, b) => b[1] - a[1]).slice(0, 15).map(item => ({ lotacao: item[0], quantidade: item[1] })),
    protocolosPorStatus: statusProtocolos,
    ultimosLancamentos: lancamentos.slice(-15).reverse().map(l => ({ nome: l.nome, matricula: l.matricula, tipo: l.tipo, dataInicio: l.dataInicio, diasGozo: l.dias, diasPecunia: l.diasPecunia || 0, diasDebitados: l.diasDebitados || l.dias, status: l.status, idoc: l.idoc || '' })),

function enviarMensagemEntidade(textoForcado = null) {
  const input = document.getElementById('entidade-input');
  const texto = textoForcado || input.value.trim();

  if (!entidadeChatAberto) {
    toggleChatEntidade();
  }
  
  if (!textoForcado) input.value = '';
  addMensagemEntidade(texto, true);
  entidadeHistorico.push({ role: 'user', content: texto });
  if (entidadeHistorico.length > 20) entidadeHistorico = entidadeHistorico.slice(-20);
  setEntidadePensando(true);
  document.getElementById('entidade-chips').style.display = 'none';
  
  const contexto = montarContextoEntidade(texto);
  const historicoAnterior = entidadeHistorico.slice(0, -1).slice(-10);
  
  backendApi()
    .withSuccessHandler(function(res) {
      setEntidadePensando(false);
      if (res.erro) {
        addMensagemEntidade(res.erro, false, true);
      } else if (res.resposta) {
        addMensagemEntidade(res.resposta, false, false, true, res.interacaoId || '');
        entidadeHistorico.push({ role: 'assistant', content: limparComandosEntidade(res.resposta) });
        if (entidadeHistorico.length > 20) entidadeHistorico = entidadeHistorico.slice(-20);
      }
    })
    .withFailureHandler(function(erro) {
      setEntidadePensando(false);
      addMensagemEntidade("Erro de conexão.", false, true);
    })
    .chamarEntidade(texto, contexto, historicoAnterior);
}

function bytesParaBase64Rep_(bytes) {
  let binario = '';
  const bloco = 32768;
  for (let i = 0; i < bytes.length; i += bloco) {
    binario += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + bloco, bytes.length)));
  }
  return btoa(binario);
}

function base64ParaBytesRep_(base64) {
  const binario = atob(String(base64 || ''));
  const bytes = new Uint8Array(binario.length);
  for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
  return bytes;
}

async function compactarTextoRep_(texto) {
  if (typeof CompressionStream !== 'function') throw new Error('Este navegador não oferece compactação necessária para salvar o REP online. Atualize o Chrome.');
  const fluxo = new Blob([texto], { type: 'text/plain;charset=utf-8' }).stream().pipeThrough(new CompressionStream('gzip'));
  return new Uint8Array(await new Response(fluxo).arrayBuffer());
}

async function descompactarTextoRep_(bytes) {
  if (typeof DecompressionStream !== 'function') throw new Error('Este navegador não consegue abrir os AFDs compactados. Atualize o Chrome.');
  const fluxo = new Blob([bytes], { type: 'application/gzip' }).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(fluxo).text();
}

function concatenarPartesRep_(partes) {
  const total = partes.reduce((soma, parte) => soma + parte.length, 0);
  const saida = new Uint8Array(total);
  let posicao = 0;
  partes.forEach(parte => { saida.set(parte, posicao); posicao += parte.length; });
  return saida;
}

async function salvarAfdRepOnline_(arquivo, texto, leitura, inicio, fim) {
  const comprimido = await compactarTextoRep_(texto);
  const metadados = {
    numeroRep: leitura.metadata.deviceSerial || '', nomeOriginal: arquivo.name || 'AFD.txt', tamanhoOriginal: arquivo.size || texto.length,
    inicio: inicio || '', fim: fim || '', locais: leitura.clocks || []
  };
  const inicioUpload = await chamarBackendPromessa_('iniciarUploadRepOnline', [metadados]);
  const totalPartes = Math.ceil(comprimido.length / TAMANHO_PARTE_REP_ONLINE_);
  try {
    for (let indice = 0; indice < totalPartes; indice++) {
      const parte = comprimido.subarray(indice * TAMANHO_PARTE_REP_ONLINE_, Math.min((indice + 1) * TAMANHO_PARTE_REP_ONLINE_, comprimido.length));
      exibirLoader(true, `Salvando ${arquivo.name} online: parte ${indice + 1}/${totalPartes}...`);
      await chamarBackendPromessa_('salvarParteRepOnline', [{ uploadId: inicioUpload.uploadId, indice, base64: bytesParaBase64Rep_(parte) }]);
    }
    return await chamarBackendPromessa_('finalizarUploadRepOnline', [{ uploadId: inicioUpload.uploadId, totalPartes, metadados }]);
  } catch (erro) {
    chamarBackendPromessa_('cancelarUploadRepOnline', [inicioUpload.uploadId]).catch(function() {});
    throw erro;
  }
}

async function baixarAfdRepOnline_(registro, ordem, total) {
  const partes = [];
  for (let indice = 0; indice < registro.totalPartes; indice++) {
    exibirLoader(true, `Abrindo AFDs online ${ordem}/${total}: parte ${indice + 1}/${registro.totalPartes}...`);
    const base64 = await chamarBackendPromessa_('obterParteArquivoRepOnline', [registro.pastaId, indice]);
    partes.push(base64ParaBytesRep_(base64));
  }
  const texto = await descompactarTextoRep_(concatenarPartesRep_(partes));
  return new File([texto], registro.nomeOriginal || ('REP_' + (registro.numeroRep || ordem) + '.txt'), { type: 'text/plain', lastModified: Date.now() });
}

async function sha256BytesRep_(bytes) {
  if (!window.crypto?.subtle) throw new Error('Este navegador não oferece a verificação criptográfica necessária.');
  const digest = new Uint8Array(await window.crypto.subtle.digest('SHA-256', bytes));
  return Array.from(digest).map(valor => valor.toString(16).padStart(2, '0')).join('');
}

async function baixarArquivoPastaEntradaRepUmaVez_(registro, ordem, total) {
  const partes = [];
  let esperado = null;
  let indice = 0;
  do {
    exibirLoader(true, `Verificando AFD ${ordem}/${total}: ${registro.nome} · parte ${indice + 1}${esperado ? '/' + esperado.totalPartes : ''}...`);
    const resposta = await chamarBackendPromessa_('obterParteArquivoPastaEntradaRep', [{ arquivoId: registro.id, indice }]);
    if (!esperado) esperado = resposta;
    if (String(resposta.arquivoId) !== String(registro.id) || resposta.sha256 !== esperado.sha256 || Number(resposta.tamanho) !== Number(esperado.tamanho)) {
      throw new Error('O arquivo mudou durante a leitura. Sincronize novamente.');
    }
    partes.push(base64ParaBytesRep_(resposta.base64));
    indice++;
  } while (indice < Number(esperado.totalPartes));
  const bytes = concatenarPartesRep_(partes);
  if (bytes.length !== Number(esperado.tamanho)) throw new Error(`Tamanho divergente: Drive ${esperado.tamanho}, recebido ${bytes.length}.`);
  const hashRecebido = await sha256BytesRep_(bytes);
  if (hashRecebido !== esperado.sha256) throw new Error(`SHA-256 divergente. Esperado ${esperado.sha256.slice(0, 12)}..., recebido ${hashRecebido.slice(0, 12)}...`);
  const arquivo = new File([bytes], registro.nome, { type: registro.mimeType || 'text/plain', lastModified: Date.parse(registro.atualizadoEm) || Date.now() });
  arquivo.repIntegridade = { confirmada: true, sha256Drive: esperado.sha256, sha256Recebido: hashRecebido, tamanhoDrive: Number(esperado.tamanho), tamanhoRecebido: bytes.length, arquivoId: registro.id };
  return arquivo;
}

async function baixarArquivoPastaEntradaRep_(registro, ordem, total) {
  let ultimoErro = null;
  for (let tentativa = 1; tentativa <= 3; tentativa++) {
    try { return await baixarArquivoPastaEntradaRepUmaVez_(registro, ordem, total); }
    catch (erro) {
      ultimoErro = erro;
      if (tentativa < 3) exibirLoader(true, `Falha ao conferir ${registro.nome}. Nova tentativa ${tentativa + 1}/3...`);
    }
  }
  throw ultimoErro || new Error('Não foi possível verificar o arquivo.');
}

  }
}

function normalizarPisRep(valor) {
  const texto = String(valor || '').trim();
  if (/^MAT:/i.test(texto)) return 'MAT:' + texto.slice(4).trim().toUpperCase();
  let digitos = texto.replace(/\D/g, '');
  // O AFD legado reserva 12 posições para um PIS de 11 dígitos e pode
  // preenchê-lo com zero à esquerda. Alguns relógios omitem esse primeiro
  // zero: para a conciliação, 10 dígitos representam o mesmo PIS de 11
  // dígitos com zero inicial. Mantém zeros legítimos de PIS/CPF.
  while (digitos.length > 11 && digitos.charAt(0) === '0') digitos = digitos.slice(1);
  if (digitos.length === 10) digitos = `0${digitos}`;
  return digitos;
}

}

function obterServidorPorIdentificadorRep_(identificador) {
  const chave = normalizarPisRep(identificador);
  return (AppState.servidores || []).find(function(servidor) {
    return normalizarPisRep(servidor.pis) === chave || obterIdentificadorCartaoManualRep_(servidor) === chave;
  }) || null;
