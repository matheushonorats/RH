/** Salva a data ao pressionar Enter e mantém o campo pronto para a próxima. */
async function adicionarFeriadoRep() {
  const campo = document.getElementById('rep-feriados');
  if (!campo) return;
  const competencia = obterCompetenciaFeriadosRep_();
  if (!competencia) {
    mostrarToast('Selecione um ano e um mês antes de editar os feriados.', 'warning');
    return;
  }

  const tokens = obterTokensFeriadosRep_();
  if (!tokens.length) return;
  const ultimaData = formatarDataExibicaoFeriadoRep_(tokens[tokens.length - 1]);
  if (!ultimaData) {
    mostrarToast('Informe uma data válida com 8 números, por exemplo: 09072026.', 'warning');
    return;
  }

  const anteriores = tokens.slice(0, -1).map(formatarDataExibicaoFeriadoRep_);
  if (anteriores.some(valor => !valor)) {
    mostrarToast('Há uma data anterior inválida. Corrija-a antes de adicionar outra.', 'warning');
    return;
  }
  const ultimaIso = normalizarDataFeriadoRep_(ultimaData);
  if (!ultimaIso || ultimaIso.slice(0, 7) !== competencia) {
    mostrarToast('Informe um feriado pertencente a ' + competencia.split('-').reverse().join('/') + '.', 'warning');
    return;
  }
  const jaCompartilhada = (feriadosCompartilhadosRep || []).some(item => item.data === ultimaIso);
  if (anteriores.includes(ultimaData) && jaCompartilhada) {
    campo.value = anteriores.concat(ultimaData).join(', ') + ', ';
    campo.focus();
    mostrarToast('Esta data já foi informada.', 'info');
    return;
  }

  const datasCampo = anteriores.concat(ultimaData).map(normalizarDataFeriadoRep_).filter(Boolean);
  const atuais = new Set((feriadosCompartilhadosRep || []).map(item => item.data));
  const adicionar = datasCampo.filter(data => !atuais.has(data));
  campo.value = anteriores.concat(ultimaData).join(', ') + ', ';
  try {
    const salvos = await chamarBackendPromessa_('atualizarFeriadosRep', [{ adicionar, remover: [] }]);
    feriadosCompartilhadosRep = Array.isArray(salvos) ? salvos : datasCampo.map(data => ({ data }));
    atualizarCampoFeriadosCompartilhadosRep_(true);
    campo.value = campo.value ? campo.value + ', ' : '';
    campo.dataset.sujo = 'false';
    campo.focus();
    atualizarProcessamentoRep({ notificarEntidade: false });
    mostrarToast(`${ultimaData} salva para toda a equipe. Digite a próxima e pressione Enter.`, 'success');
  } catch (erro) {
    campo.dataset.sujo = 'true';
    mostrarToast('Não foi possível salvar o feriado: ' + mensagemErro(erro), 'error');
  }
}

function formatHoursRep(decimalHours) {
  const isNegative = decimalHours < 0;
  const absHours = Math.abs(decimalHours);
  const h = Math.floor(absHours);
  const m = Math.round((absHours - h) * 60);
  const sign = isNegative ? '-' : '';
  return `${sign}${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
}

function normalizarTextoRep_(valor) {
  return String(valor || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toUpperCase();
}

function normalizarMatriculaRep_(valor) {
  return String(valor || '').replace(/\D/g, '').replace(/^0+/, '');
}

function dataLancamentoParaIsoRep_(valor) {
  const partes = String(valor || '').trim().split(/[\/-]/).map(Number);
  if (partes.length !== 3 || !partes.every(Number.isFinite)) return '';
  const [dia, mes, ano] = partes;
  if (ano < 1900 || mes < 1 || mes > 12 || dia < 1 || dia > 31) return '';
  return `${String(ano).padStart(4, '0')}-${String(mes).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
}

function ehLancamentoAusenciaRep_(lancamento) {
  if (!lancamento || /(ANULAD|CANCELAD|EXCLUID|NAO EFETIVAD)/.test(normalizarTextoRep_(lancamento.status))) return false;
  const tipo = normalizarTextoRep_(lancamento.tipo);
  if (!tipo || tipo.includes('NAO EFETIVAD') || tipo.includes('HORA EXTRA') || tipo.includes('ESTAGIO PROBATORIO') || tipo.includes('AVALIACAO')) return false;
  return /(FERIAS|LICENCA|ABON|AFAST|ATESTADO|FALTA)/.test(tipo);
}

function obterServidorCadastroRep_(emp) {
  const pis = normalizarPisRep(emp && emp.pis);
  const porPis = obterServidorPorIdentificadorRep_(pis);
  if (porPis) return porPis;
  const nome = normalizarTextoRep_(emp && emp.nome);
  const porNome = (AppState.servidores || []).filter(item => normalizarTextoRep_(item.nome) === nome);
  return porNome.length === 1 ? porNome[0] : null;
}

function obterLancamentosAusenciaServidorRep_(emp) {
  const servidor = obterServidorCadastroRep_(emp);
  const matricula = normalizarMatriculaRep_(servidor && servidor.matricula);
  const nome = normalizarTextoRep_(servidor ? servidor.nome : emp && emp.nome);
  return (AppState.lancamentos || []).filter(lancamento => {
    if (!ehLancamentoAusenciaRep_(lancamento) || lancamento.identidadeConsistente === false) return false;
    const matriculaLancamento = normalizarMatriculaRep_(lancamento.matricula || lancamento.matriculaNoNome);
    return matricula ? matriculaLancamento === matricula : normalizarTextoRep_(lancamento.nome) === nome;
  });
}

function intervaloLancamentoRep_(lancamento) {
  const inicio = dataLancamentoParaIsoRep_(lancamento && lancamento.dataInicio);
  if (!inicio) return null;
  const dias = Math.max(1, parseInt(lancamento.dias, 10) || 1);
  const partes = inicio.split('-').map(Number);
  const fimData = new Date(partes[0], partes[1] - 1, partes[2] + dias - 1);
  const fim = `${fimData.getFullYear()}-${String(fimData.getMonth() + 1).padStart(2, '0')}-${String(fimData.getDate()).padStart(2, '0')}`;
  return { inicio, fim, dias };
}

function resumirLancamentoAusenciaRep_(lancamento, origem) {
  const intervalo = intervaloLancamentoRep_(lancamento);
  return {
    linhaPlanilha: Number(lancamento.linhaPlanilha || 0),
    tipo: String(lancamento.tipo || 'Ausência'),
    idoc: String(lancamento.idoc || '').trim(),
    inicio: intervalo ? intervalo.inicio : '',
    fim: intervalo ? intervalo.fim : '',
    dias: intervalo ? intervalo.dias : Math.max(1, parseInt(lancamento.dias, 10) || 1),
    origem: origem || 'automatica'
  };
}

function formatarPeriodoAusenciaRep_(ausencia) {
  if (!ausencia || !ausencia.inicio) return 'data não informada';
  const inicio = ausencia.inicio.split('-').reverse().join('/');
  const fim = ausencia.fim ? ausencia.fim.split('-').reverse().join('/') : inicio;
  return inicio === fim ? inicio : `${inicio} a ${fim}`;
}

function encontrarAusenciaDiaRep_(emp, data) {
  const lancamentos = obterLancamentosAusenciaServidorRep_(emp);
  const manual = (justificativasLancamentoRep || []).find(item => normalizarPisRep(item.pis) === normalizarPisRep(emp.pis) && item.data === data);
  if (manual && manual.linhaLancamento) {
    const selecionado = (AppState.lancamentos || []).find(item => Number(item.linhaPlanilha) === Number(manual.linhaLancamento));
    return selecionado && ehLancamentoAusenciaRep_(selecionado) ? resumirLancamentoAusenciaRep_(selecionado, 'manual') : null;
  }
  const automatico = lancamentos.find(lancamento => {
    const intervalo = intervaloLancamentoRep_(lancamento);
    return intervalo && data >= intervalo.inicio && data <= intervalo.fim;
  });
  return automatico ? resumirLancamentoAusenciaRep_(automatico, 'automatica') : null;
}

function aplicarAusenciasLancamentosRep_(emp, dias) {
  (dias || []).forEach(dia => {
    const ausencia = encontrarAusenciaDiaRep_(emp, dia.dataOriginal);
    if (!ausencia) return;
    dia.ausencia = ausencia;
    if (dia.semRegistro) {
      dia.status = 'ausencia_justificada';
      dia.ausenciaJustificada = true;
      dia.pendencia = false;
      return;
    }
    const jaContava = Boolean(dia.pendencia || dia.jornadaIncompleta);
    dia.status = 'ausencia_com_batidas';
    dia.pendencia = true;
    if (!jaContava) emp.resumo.pendencias++;
  });
}

function aplicarDescartesHoraExtraRep_(emp, dias, modo) {
  const ajustesFinais = modo === 'AJUSTES_FINAIS';
  const registros = (descartesHoraExtraRep || []).filter(item => {
    if (normalizarPisRep(item.pis) !== normalizarPisRep(emp.pis)) return false;
    return ajustesFinais ? Boolean(item.saldoAjustado) : Boolean(item.descartado && !item.saldoAjustado);
  });
  let totalDesconsiderado = 0;
  registros.forEach(registro => {
    const dia = (dias || []).find(item => item.dataOriginal === registro.data);
    if (!dia || dia.pendencia || dia.ausencia || !Number.isFinite(dia.extraDia)) return;
    const saldoOriginal = Number(dia.extraDia);
    if (!registro.saldoAjustado && saldoOriginal <= 0) return;
    const saldoNovo = registro.saldoAjustado ? Number(registro.saldoMinutos || 0) / 60 : 0;
    const reducaoPositiva = Math.max(0, Math.max(0, saldoOriginal) - Math.max(0, saldoNovo));
    totalDesconsiderado += reducaoPositiva;
    dia.saldoOriginalAntesDescarteHe = saldoOriginal;
    dia.statusAntesDescarteHe = dia.status;
    dia.ajusteSaldoManual = { saldoOriginal, saldoNovo, atualizadoPor: String(registro.atualizadoPor || ''), atualizadoEm: String(registro.atualizadoEm || '') };
    if (saldoNovo === 0 && saldoOriginal > 0) {
      dia.horaExtraDesconsiderada = { horas: saldoOriginal, atualizadoPor: String(registro.atualizadoPor || ''), atualizadoEm: String(registro.atualizadoEm || '') };
    }
    dia.extraDia = saldoNovo;
    // Um ajuste manual de saldo é uma decisão administrativa explícita e,
    // por isso, também passa a ser a base da compensação exata nesse dia.
    dia.saldoCompensacaoExatoDia = saldoNovo;
    dia.temHoraExtra = saldoNovo > 0;
    dia.jornadaIncompleta = !dia.diaExtra && saldoNovo < 0;
    dia.temValeRefeicao = Boolean(dia.diaExtra && saldoNovo >= 6);
    dia.status = saldoNovo === 0 && saldoOriginal > 0 ? 'hora_extra_desconsiderada' : 'saldo_ajustado_manual';
    emp.resumo.extras = Number(emp.resumo.extras || 0) + (saldoNovo - saldoOriginal);
    emp.resumo.saldo = Number(emp.resumo.saldo || 0) + (saldoNovo - saldoOriginal);
    emp.resumo.horasExtras = Math.max(0, Number(emp.resumo.horasExtras || 0) - Math.max(0, saldoOriginal) + Math.max(0, saldoNovo));
    if (ajustesFinais && Number.isFinite(Number(emp.resumo.saldoDisponivelCompensacao))) {
      emp.resumo.saldoDisponivelCompensacao = Math.max(0, Number(emp.resumo.saldoDisponivelCompensacao) - Math.max(0, saldoOriginal) + Math.max(0, saldoNovo));
      const origens = new Map((emp.resumo.origensSaldoCompensacao || []).map(item => [item.data, { ...item }]));
      if (saldoNovo > 0) origens.set(dia.dataOriginal, { data: dia.dataOriginal, minutos: Math.round(saldoNovo * 60), minutosBrutos: Math.round(saldoNovo * 60) });
      else origens.delete(dia.dataOriginal);
      emp.resumo.origensSaldoCompensacao = Array.from(origens.values()).sort((a, b) => a.data.localeCompare(b.data));
    }
  });
  emp.resumo.horasExtrasDesconsideradas = Number(emp.resumo.horasExtrasDesconsideradas || 0) + totalDesconsiderado;
  emp.resumo.valeRefeicao = (dias || []).filter(dia => Boolean(dia.temValeRefeicao)).length;
}

function minutosParaHoraRep_(minutos) {
  const total = Math.max(0, Math.round(Number(minutos) || 0));
  return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
}

function horaParaMinutosRep_(valor) {
  const texto = String(valor || '').trim();
  const partes = texto.match(/^(\d{1,2}):([0-5]\d)$/);
  if (!partes) return null;
  return Number(partes[1]) * 60 + Number(partes[2]);
}

function saldoParaMinutosRep_(valor) {
  const texto = String(valor == null ? '' : valor).trim();
  if (/^-?0+$/.test(texto)) return 0;
  const partes = texto.match(/^(-)?(\d{1,2}):([0-5]\d)$/);
  if (!partes) return null;
  const minutos = Number(partes[2]) * 60 + Number(partes[3]);
  return partes[1] ? -minutos : minutos;
}

function obterJornadaReferenciaRep_() {
  const valor = Number(document.getElementById('rep-jornada-horas')?.value);
  return Number.isFinite(valor) && valor > 0 ? valor : 8;
}

function aplicarCompensacoesRep_(emp, dias) {
  const usarMinutosExatos = Boolean(configuracaoCalculoRepAtual.compensacaoMinutosExatos);
  const saldoPorDia = new Map();
  const saldoInicialPorDia = new Map();
  const saldoAdministrativoInicialPorDia = new Map();
  (dias || []).forEach(dia => {
    const saldoBase = usarMinutosExatos ? Number(dia.saldoCompensacaoExatoDia) : Number(dia.extraDia);
    if (!dia.pendencia && Number.isFinite(saldoBase) && saldoBase > 0 && Number.isFinite(dia.extraDia)) {
      const liquido = Math.max(0, Math.round(saldoBase * 60));
      const administrativo = Math.max(0, Math.round(Number(dia.extraDia) * 60));
      // Em dia nao util, toda a jornada e extra. Quando o intervalo foi
      // presumido, a retirada pode ser informada pelo tempo bruto (ex.: 9h),
      // mantendo a aplicacao liquida ja calculada (ex.: 8h).
      const intervaloBruto = !usarMinutosExatos && dia.diaExtra ? Math.max(0, Math.round(Number(dia.descontoIntervalo || 0) * 60)) : 0;
      saldoPorDia.set(dia.dataOriginal, { liquido, bruto: liquido + intervaloBruto, administrativo });
      saldoInicialPorDia.set(dia.dataOriginal, liquido);
      saldoAdministrativoInicialPorDia.set(dia.dataOriginal, administrativo);
    }
  });
  let disponivel = Array.from(saldoPorDia.values()).reduce((total, saldo) => total + saldo.liquido, 0);
  let aplicadoTotal = 0;
  let retiradoTotal = 0;
  const jornadaReferenciaMinutos = Math.round(obterJornadaReferenciaRep_() * 60);
  const retirarDaOrigem = function(data, solicitadoBruto, limiteLiquido) {
    const saldo = saldoPorDia.get(data) || { liquido: 0, bruto: 0, administrativo: 0 };
    const temLimite = Number.isFinite(Number(limiteLiquido));
    const limite = temLimite ? Math.max(0, Math.round(Number(limiteLiquido) || 0)) : saldo.liquido;
    let bruto = Math.min(saldo.bruto, Math.max(0, Math.round(solicitadoBruto || 0)));
    let liquido = Math.min(saldo.liquido, bruto, limite);
    const administrativo = Math.min(saldo.administrativo, liquido);
    saldo.bruto = Math.max(0, saldo.bruto - bruto);
    saldo.liquido = Math.max(0, saldo.liquido - liquido);
    saldo.administrativo = Math.max(0, saldo.administrativo - administrativo);
    if (!saldo.liquido) saldo.bruto = 0;
    if (!saldo.bruto) saldo.liquido = 0;
    saldoPorDia.set(data, saldo);
    return { bruto, liquido, administrativo };
  };
  const alocarAutomaticamente = function(total, dataDestino) {
    let restante = Math.max(0, Math.round(total || 0));
    const origens = [];
    Array.from(saldoPorDia.keys()).sort().forEach(dataOrigem => {
      if (!restante || dataOrigem === dataDestino) return;
      const aplicado = retirarDaOrigem(dataOrigem, restante, restante);
      if (aplicado.liquido) origens.push({ data: dataOrigem, minutos: aplicado.bruto, minutosLiquidos: aplicado.liquido, minutosAdministrativos: aplicado.administrativo });
      restante -= aplicado.liquido;
    });
    return origens;
  };
  const registros = (compensacoesRep || [])
    .filter(item => normalizarPisRep(item.pis) === normalizarPisRep(emp.pis) && Number(item.minutos) > 0)
    .sort((a, b) => String(a.data).localeCompare(String(b.data)));
  registros.forEach(registro => {
    const dia = (dias || []).find(item => item.dataOriginal === registro.data);
    if (!dia || dia.ausencia || dia.diaExtra || dia.pendencia) return;
    const diaSemRegistroCompensavel = Boolean(dia.semRegistro);
    const saldoDeficitBase = usarMinutosExatos ? Number(dia.saldoCompensacaoExatoDia) : Number(dia.extraDia);
    const jornadaIncompletaCompensavel = Boolean(Number.isFinite(saldoDeficitBase) && saldoDeficitBase < 0);
    if (!diaSemRegistroCompensavel && !jornadaIncompletaCompensavel) return;
    const deficit = diaSemRegistroCompensavel
      ? jornadaReferenciaMinutos
      : Math.max(0, Math.round(Math.abs(saldoDeficitBase) * 60));
    const contavaComoPendencia = Boolean(dia.jornadaIncompleta || dia.pendencia);
    const solicitado = Math.max(0, Math.round(Number(registro.minutos) || 0));
    let restante = Math.min(deficit, solicitado);
    let brutoPermitido = Math.min(solicitado, deficit + 60);
    let origensAplicadas = [];
    const origensInformadas = Array.isArray(registro.origens) ? registro.origens.filter(item => item && item.data && Number(item.minutos) > 0) : [];
    if (origensInformadas.length) {
      origensInformadas.forEach(origem => {
        if (!brutoPermitido || origem.data === registro.data) return;
        const aplicadoOrigem = retirarDaOrigem(origem.data, Math.min(Number(origem.minutos), brutoPermitido), restante);
        if (aplicadoOrigem.bruto) origensAplicadas.push({ data: origem.data, minutos: aplicadoOrigem.bruto, minutosLiquidos: aplicadoOrigem.liquido, minutosAdministrativos: aplicadoOrigem.administrativo });
        brutoPermitido -= aplicadoOrigem.bruto;
        restante -= aplicadoOrigem.liquido;
      });
    } else {
      origensAplicadas = alocarAutomaticamente(restante, registro.data);
      restante -= origensAplicadas.reduce((total, origem) => total + origem.minutosLiquidos, 0);
    }
    const aplicado = origensAplicadas.reduce((total, origem) => total + origem.minutosLiquidos, 0);
    const retirado = origensAplicadas.reduce((total, origem) => total + origem.minutos, 0);
    const retiradoAdministrativo = origensAplicadas.reduce((total, origem) => total + Number(origem.minutosAdministrativos || 0), 0);
    dia.compensacao = {
      minutos: solicitado, minutosAplicados: aplicado, deficit,
      observacao: String(registro.observacao || ''), atualizadoPor: String(registro.atualizadoPor || ''),
      origens: origensInformadas, origensAplicadas,
      origemLegada: !origensInformadas.length,
      minutosExatos: usarMinutosExatos,
      minutosAdministrativosRetirados: retiradoAdministrativo
    };
    if (!aplicado) return;
    retiradoTotal += retirado;
    aplicadoTotal += aplicado;
    // O saldo exibido no destino também precisa refletir a compensação.
    // Dias sem registro partem do débito integral da jornada; nos demais,
    // parte-se do saldo negativo já apurado ou ajustado manualmente.
    const saldoAntesCompensacao = diaSemRegistroCompensavel ? -(deficit / 60) : Number(saldoDeficitBase || 0);
    dia.saldoAntesCompensacao = saldoAntesCompensacao;
    dia.extraDia = Math.min(0, saldoAntesCompensacao + (aplicado / 60));
    if (aplicado >= deficit) {
      dia.statusAnteriorCompensacao = dia.status;
      dia.status = 'jornada_compensada';
      dia.jornadaIncompleta = false;
      dia.compensacaoDiaSemRegistro = diaSemRegistroCompensavel;
      if (contavaComoPendencia) emp.resumo.pendencias = Math.max(0, emp.resumo.pendencias - 1);
    } else {
      dia.statusAnteriorCompensacao = dia.status;
      dia.status = 'jornada_compensada_parcial';
      dia.compensacaoDiaSemRegistro = diaSemRegistroCompensavel;
    }
  });
  disponivel = Array.from(saldoPorDia.values()).reduce((total, saldo) => total + saldo.liquido, 0);

  // A compensação retira a HE da origem, e não apenas do total disponível.
  // Assim a linha do dia, os filtros e os totais passam a representar o saldo
  // que ainda existe depois da compensação, sem alterar o AFD original.
  (dias || []).forEach(dia => {
    if (!saldoInicialPorDia.has(dia.dataOriginal)) return;
    const saldoInicial = saldoInicialPorDia.get(dia.dataOriginal);
    const saldoRestante = (saldoPorDia.get(dia.dataOriginal) || {}).liquido || 0;
    const minutosUsados = Math.max(0, saldoInicial - saldoRestante);
    const saldoAdministrativoInicial = saldoAdministrativoInicialPorDia.get(dia.dataOriginal) || 0;
    let saldoAdministrativoRestante = (saldoPorDia.get(dia.dataOriginal) || {}).administrativo || 0;
    // Na política por saldo diário, a HE deve ser reenquadrada depois que os
    // minutos reais forem usados. Ex.: 46 min = 1h; usando 20 min, restam
    // 26 min reais, que voltam à faixa administrativa de 30 min.
    if (usarMinutosExatos && configuracaoCalculoRepAtual.modo === 'SALDO_DIARIO') {
      saldoAdministrativoRestante = Math.max(0, Math.round(aplicarPoliticaSaldoDiarioRep_(saldoRestante / 60) * 60));
    } else if (usarMinutosExatos && configuracaoCalculoRepAtual.modo !== 'EXATO') {
      // O controle paralelo pode usar minutos reais, mas a HE exibida e levada
      // à autorização continua obedecendo ao arredondamento administrativo.
      const horasInteirasRestantes = Math.floor(Math.max(0, saldoRestante) / 60);
      const restoRestante = Math.max(0, saldoRestante) % 60;
      const minutosArredondados = restoRestante <= 15 ? 0 : (restoRestante <= 45 ? 30 : 60);
      saldoAdministrativoRestante = Math.min(saldoAdministrativoInicial, horasInteirasRestantes * 60 + minutosArredondados);
    }
    const minutosAdministrativosUsados = Math.max(0, saldoAdministrativoInicial - saldoAdministrativoRestante);
    if (!minutosUsados) return;
    dia.horaExtraAntesCompensacao = saldoAdministrativoInicial / 60;
    dia.minutosCompensadosComoOrigem = minutosUsados;
    dia.minutosAdministrativosCompensadosComoOrigem = minutosAdministrativosUsados;
    dia.extraDia = saldoAdministrativoRestante / 60;
    dia.temHoraExtra = dia.extraDia > 0;
    // Para o REP, a hora retirada para compensação também deixa de compor a
    // jornada que dá direito ao VR. Ex.: 6h em dia não útil - 1h retirada =
    // 5h consideradas e, portanto, sem VR.
    dia.temValeRefeicao = Boolean(dia.diaExtra && dia.extraDia >= 6);
  });

  // HE e VR refletem o saldo depois das retiradas de compensação.
  const administrativoRetiradoTotal = (dias || []).reduce((total, dia) => total + Number(dia.minutosAdministrativosCompensadosComoOrigem || 0), 0);
  emp.resumo.horasExtras = Math.max(0, Number(emp.resumo.horasExtras || 0) - (administrativoRetiradoTotal / 60));
  emp.resumo.valeRefeicao = (dias || []).filter(dia => Boolean(dia.temValeRefeicao)).length;
  emp.resumo.horasCompensadas = aplicadoTotal / 60;
  emp.resumo.horasRetiradasCompensacao = retiradoTotal / 60;
  emp.resumo.horasAdministrativasRetiradasCompensacao = administrativoRetiradoTotal / 60;
  emp.resumo.compensacaoMinutosExatos = usarMinutosExatos;
  emp.resumo.saldoDisponivelCompensacao = disponivel / 60;
  emp.resumo.origensSaldoCompensacao = Array.from(saldoPorDia.entries()).map(([data, saldo]) => ({ data, minutos: saldo.liquido, minutosBrutos: saldo.bruto })).filter(item => item.minutos > 0).sort((a, b) => a.data.localeCompare(b.data));
}

function aplicarValidacoesAlertasRep_(emp, dias) {
  const registros = (validacoesRep || []).filter(item => item.validado && normalizarPisRep(item.pis) === normalizarPisRep(emp.pis));
  registros.forEach(registro => {
    const dia = (dias || []).find(item => item.dataOriginal === registro.data);
    if (!dia || (!dia.pendencia && !dia.jornadaIncompleta)) return;
    dia.statusAntesValidacao = dia.status;
    dia.pendenciaAntesValidacao = Boolean(dia.pendencia);
    dia.jornadaIncompletaAntesValidacao = Boolean(dia.jornadaIncompleta);
    dia.validacaoManual = {
      observacao: String(registro.observacao || ''),
      atualizadoPor: String(registro.atualizadoPor || ''),
      atualizadoEm: String(registro.atualizadoEm || '')
    };
    dia.status = 'validado_manualmente';
    dia.pendencia = false;
    dia.jornadaIncompleta = false;
    emp.resumo.pendencias = Math.max(0, emp.resumo.pendencias - 1);
  });
}

function obterDeficitDiaRep_(dia) {
  if (!dia || dia.diaExtra || dia.ausencia || dia.validacaoManual || dia.pendencia) return 0;
  let deficitMinutos = 0;
  if (dia.semRegistro) deficitMinutos = Math.round(obterJornadaReferenciaRep_() * 60);
  else if (configuracaoCalculoRepAtual.compensacaoMinutosExatos && Number.isFinite(dia.saldoCompensacaoExatoDia) && dia.saldoCompensacaoExatoDia < 0) deficitMinutos = Math.round(Math.abs(dia.saldoCompensacaoExatoDia) * 60);
  else if (Number.isFinite(dia.extraDia) && dia.extraDia < 0) deficitMinutos = Math.round(Math.abs(dia.extraDia) * 60) + Math.max(0, Math.round(Number(dia.compensacao?.minutosAplicados || 0)));
  const compensado = Math.max(0, Math.round(Number(dia.compensacao?.minutosAplicados || 0)));
  return Math.max(0, deficitMinutos - compensado) / 60;
}

function atualizarHorasDevidasRep_(emp, dias) {
  emp.resumo.horasDevidas = (dias || []).reduce((total, dia) => total + obterDeficitDiaRep_(dia), 0);
}

function processDataRep(employees, punches, lotacoes) {
  const dataByPisSeguro = new Map();
  const jornadaReferencia = obterJornadaReferenciaRep_();
  const intervaloPresumidoInput = document.getElementById('rep-intervalo-presumido-horas');
  const intervaloPresumidoInformado = Number(intervaloPresumidoInput && intervaloPresumidoInput.value);
  const horasIntervaloSemBatida = Number.isFinite(intervaloPresumidoInformado) && intervaloPresumidoInformado >= 0
    ? intervaloPresumidoInformado
    : 1;
  const feriados = obterFeriadosRep();

  for (const punch of punches.slice().sort((a, b) => a.datetime - b.datetime)) {
    const pis = normalizarPisRep(punch.pis);
    if (!pis) continue;
    if (!dataByPisSeguro.has(pis)) {
      const nomeConhecido = employees.get(pis);
      dataByPisSeguro.set(pis, {
        pis,
        nome: nomeConhecido || `PIS nao conciliado (${pis})`,
        lotacao: (lotacoes && lotacoes.get(pis)) || 'Não informada',
        naoConciliado: !nomeConhecido,
        dias: new Map(),
        // extras/vr permanecem apenas como compatibilidade com a visualização antiga.
        resumo: { trabalhadas: 0, saldo: 0, extras: 0, horasExtras: 0, valeRefeicao: 0, vr: 0, pendencias: 0 }
      });
    }
    const empSeguro = dataByPisSeguro.get(pis);
    // A data pertence ao momento original: arredondar 23:46 não a move para o dia seguinte.
    const dataOriginal = /^\d{4}-\d{2}-\d{2}$/.test(String(punch.dataReferencia || '')) ? String(punch.dataReferencia) : toDateStringRep(punch.datetime);
    if (!empSeguro.dias.has(dataOriginal)) {
      empSeguro.dias.set(dataOriginal, { data: dataOriginal, eventos: [], relogios: new Set(), reps: new Set(), fontes: new Set() });
    }
    const diaSeguro = empSeguro.dias.get(dataOriginal);
    diaSeguro.eventos.push({
      original: punch.datetime,
      arredondada: horarioConsideradoRep_(punch.datetime),
      local: punch.clock,
      rep: punch.deviceSerial,
      nsr: punch.nsr,
      linha: punch.lineNumber,
      arquivo: punch.sourceFile
      , eventId: punch.eventId, eventKey: punch.eventKey || punch.eventId,
      manual: Boolean(punch.manual),
      justificativa: punch.justificativa || '', dataReferencia: punch.dataReferencia || '', ajusteOrigemData: punch.ajusteOrigemData || ''
    });
    if (punch.clock) diaSeguro.relogios.add(punch.clock);
    if (punch.deviceSerial) diaSeguro.reps.add(punch.deviceSerial);
    if (punch.sourceFile) diaSeguro.fontes.add(punch.sourceFile);
  }

  const resultadoSeguro = [];
  for (const empSeguro of dataByPisSeguro.values()) {
    const dias = [];
    for (const diaSeguro of Array.from(empSeguro.dias.values()).sort((a, b) => a.data.localeCompare(b.data))) {
      const eventos = diaSeguro.eventos.sort((a, b) => a.original - b.original);
      const batidas = eventos.map(evento => evento.arredondada);
      const isImpar = batidas.length % 2 !== 0;
      const batidasExcedentes = batidas.length > 6;
      const conflitoArredondamento = arredondamentoRepAtivo && new Set(batidas.map(d => d.getTime())).size !== batidas.length;
      const chavesMomento = new Map();
      eventos.forEach(evento => {
        const chave = evento.original.getTime();
        if (!chavesMomento.has(chave)) chavesMomento.set(chave, new Set());
        chavesMomento.get(chave).add(evento.rep);
      });
      const colisaoReps = Array.from(chavesMomento.values()).some(reps => reps.size > 1);
      const partesDataJornada = diaSeguro.data.split('-').map(Number);
      const diaSemana = new Date(partesDataJornada[0], partesDataJornada[1] - 1, partesDataJornada[2]).getDay();
      const diaExtra = diaSemana === 0 || diaSemana === 6 || feriados.has(diaSeguro.data);
      // O VR segue a mesma jornada considerada exibida na conferência.
      // Em dia não útil, 06h00 exatas já geram o vale.
      let elegivelValeRefeicao = false;
      // Jornada contínua de 7h ou mais sem marcações de almoço: aplica o
      // desconto selecionado. O padrão administrativo é sempre 1 hora.
      const tempoBrutoCorrido = getHoursDiffRep(batidas[0], batidas[1]);
      const intervaloPresumido = !isImpar && batidas.length === 2 && tempoBrutoCorrido >= 7;
      let totalDia = null;
      let saldoDia = null;
      let intervaloConsiderado = 0;
      let descontoIntervalo = 0;
      let jornadaIncompleta = false;
      let saldoControleDia = null;
      let calculoHeSomente = null;
      if (!isImpar && !batidasExcedentes && !conflitoArredondamento && !colisaoReps) {
        totalDia = 0;
        for (let i = 0; i < batidas.length; i += 2) totalDia += getHoursDiffRep(batidas[i], batidas[i + 1]);
        // A duração total da jornada não aumenta automaticamente o desconto.
        if (intervaloPresumido) {
          descontoIntervalo = Math.min(tempoBrutoCorrido, horasIntervaloSemBatida);
          totalDia = Math.max(0, totalDia - descontoIntervalo);
        } else if (batidas.length >= 4 && getHoursDiffRep(batidas[0], batidas[batidas.length - 1]) > 6) {
          for (let i = 1; i < batidas.length - 1; i += 2) {
            intervaloConsiderado += getHoursDiffRep(batidas[i], batidas[i + 1]);
          }
          descontoIntervalo = Math.max(0, 1 - intervaloConsiderado);
          totalDia = Math.max(0, totalDia - descontoIntervalo);
        }
        const saldoBrutoDia = diaExtra ? totalDia : totalDia - jornadaReferencia;
        saldoControleDia = aplicarPoliticaSaldoDiarioRep_(saldoBrutoDia);
        saldoDia = saldoControleDia;
        if (configuracaoCalculoRepAtual.modo === 'SOMENTE_HE' && saldoBrutoDia >= 0) {
          calculoHeSomente = calcularSaldoArredondadoSomenteHeRep_(eventos, diaExtra, jornadaReferencia, horasIntervaloSemBatida);
          saldoDia = calculoHeSomente ? Math.max(0, calculoHeSomente.saldo) : 0;
        }
        elegivelValeRefeicao = diaExtra && totalDia >= 6;
        empSeguro.resumo.trabalhadas += totalDia;
        empSeguro.resumo.saldo += saldoDia;
        empSeguro.resumo.extras += saldoDia;
        if (saldoDia > 0) empSeguro.resumo.horasExtras += saldoDia;
        if (elegivelValeRefeicao) empSeguro.resumo.valeRefeicao++;
        jornadaIncompleta = !diaExtra && saldoControleDia < 0;
        if (jornadaIncompleta) empSeguro.resumo.pendencias++;
      } else {
        empSeguro.resumo.pendencias++;
      }
      let status = 'ok';
      if (empSeguro.naoConciliado) status = 'nao_conciliado';
      if (isImpar) status = 'impar';
      else if (batidasExcedentes) status = 'batidas_excedentes';
      else if (colisaoReps) status = 'colisao_reps';
      else if (conflitoArredondamento) status = 'conflito_arredondamento';
      else if (intervaloPresumido) status = diaExtra ? 'extra_intervalo_presumido' : 'intervalo_presumido';
      else if (descontoIntervalo > 0) status = 'intervalo_inferior_minimo';
      else if (diaExtra) status = 'extra_dia_nao_util';
      else if (saldoDia > 0) status = 'saldo_positivo';
      else if (jornadaIncompleta) status = 'jornada_incompleta';
      const calculoExatoCompensacao = !isImpar && !batidasExcedentes && !colisaoReps
        ? calcularSaldoExatoCompensacaoRep_(eventos, diaExtra, jornadaReferencia, horasIntervaloSemBatida)
        : null;
      dias.push({
        dataOriginal: diaSeguro.data,
        dataFormatada: diaSeguro.data.split('-').reverse().join('/'),
        diaSemana: ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'][diaSemana],
        batidas: batidas.map(d => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`),
        batidasOriginais: eventos.map(evento => `${String(evento.original.getHours()).padStart(2, '0')}:${String(evento.original.getMinutes()).padStart(2, '0')}`).join(' - '),
        batidasDetalhadas: eventos.map(evento => ({
          horarioOriginal: `${String(evento.original.getHours()).padStart(2, '0')}:${String(evento.original.getMinutes()).padStart(2, '0')}`,
          horarioArredondado: `${String(evento.arredondada.getHours()).padStart(2, '0')}:${String(evento.arredondada.getMinutes()).padStart(2, '0')}`,
          dataReal: toDateStringRep(evento.original),
          local: evento.local, rep: evento.rep, nsr: evento.nsr, linha: evento.linha, arquivo: evento.arquivo
          , eventId: evento.eventId, eventKey: evento.eventKey || evento.eventId, manual: evento.manual, justificativa: evento.justificativa,
          dataReferencia: evento.dataReferencia || '', ajusteOrigemData: evento.ajusteOrigemData || ''
        })),
        totalDia, saldoDia, extraDia: saldoDia,
        saldoControleDia: saldoControleDia,
        saldoBrutoDia: Number.isFinite(totalDia) ? (diaExtra ? totalDia : totalDia - jornadaReferencia) : null,
        saldoArredondadoSomenteHeDia: calculoHeSomente ? calculoHeSomente.saldo : null,
        totalCompensacaoExatoDia: calculoExatoCompensacao ? calculoExatoCompensacao.total : null,
        saldoCompensacaoExatoDia: calculoExatoCompensacao ? calculoExatoCompensacao.saldo : null,
        regraSaldoDiarioAplicada: configuracaoCalculoRepAtual.modo === 'SALDO_DIARIO',
        arredondamentoSomenteHeAplicado: configuracaoCalculoRepAtual.modo === 'SOMENTE_HE',
        relogios: Array.from(diaSeguro.relogios).join(', '),
        reps: Array.from(diaSeguro.reps).join(', '),
        fontes: Array.from(diaSeguro.fontes).join(', '),
        status, isImpar,
        pendencia: isImpar || batidasExcedentes || conflitoArredondamento || colisaoReps,
        intervaloPresumido, batidasExcedentes, conflitoArredondamento, colisaoReps, intervaloConsiderado, descontoIntervalo, diaExtra, jornadaIncompleta,
        temHoraExtra: !isImpar && !batidasExcedentes && !conflitoArredondamento && !colisaoReps && saldoDia > 0,
        temValeRefeicao: elegivelValeRefeicao
      });
    }
    completarDiasSemRegistroRep_(dias, feriados);
    aplicarAusenciasLancamentosRep_(empSeguro, dias);
    aplicarDescartesHoraExtraRep_(empSeguro, dias, 'LEGADOS');
    aplicarCompensacoesRep_(empSeguro, dias);
    aplicarDescartesHoraExtraRep_(empSeguro, dias, 'AJUSTES_FINAIS');
    aplicarValidacoesAlertasRep_(empSeguro, dias);
    atualizarHorasDevidasRep_(empSeguro, dias);
    resultadoSeguro.push({ pis: empSeguro.pis, nome: empSeguro.nome, lotacao: empSeguro.lotacao, naoConciliado: empSeguro.naoConciliado, dias, resumo: empSeguro.resumo });
  }
  return resultadoSeguro.sort((a, b) => a.nome.localeCompare(b.nome));

  const dataByPis = new Map();
  punches.sort((a, b) => a.datetime - b.datetime);

  for (const punch of punches) {
    const pis = punch.pis;
    if (!employees.has(pis)) continue;

    if (!dataByPis.has(pis)) {
      dataByPis.set(pis, {
        pis: pis,
        nome: employees.get(pis),
        dias: new Map(),
        resumo: { trabalhadas: 0, extras: 0, vr: 0, pendencias: 0 }
      });
    }

    const employeeData = dataByPis.get(pis);
    const roundedTime = roundTimeRep(punch.datetime);
    const dateStr = toDateStringRep(roundedTime);

    if (!employeeData.dias.has(dateStr)) {
      employeeData.dias.set(dateStr, { data: dateStr, batidas: [], relogios: new Set() });
    }

    const dayData = employeeData.dias.get(dateStr);
    dayData.batidas.push(roundedTime);
    if (punch.clock) dayData.relogios.add(punch.clock);
  }

  const resultList = [];
  const JORNADA_PADRAO = 8;
  const HORAS_VR = 6;

  for (const emp of dataByPis.values()) {
    const diasArr = Array.from(emp.dias.values());
    diasArr.sort((a, b) => a.data.localeCompare(b.data));
    const diasProcessados = [];

    for (const dia of diasArr) {
      const batidas = dia.batidas;
      batidas.sort((a, b) => a - b);
      const isImpar = batidas.length % 2 !== 0;

      if (isImpar) {
        emp.resumo.pendencias++;
      }

      let tempoBruto = 0;
      for (let i = 0; i < batidas.length - 1; i += 2) {
        tempoBruto += getHoursDiffRep(batidas[i], batidas[i+1]);
      }

      let horasTrabalhadas = tempoBruto;

      // REGRA DO ALMOÇO (Intervalo Intrajornada):
      // Quando o servidor possui apenas 2 batidas no dia (Entrada e Saída final),
      // e o tempo total corrido é superior a 6 horas, deduz-se 1 hora (para 6h até 9.9h)
      // ou 2 horas (para 10h ou mais) referente ao intervalo de almoço obrigatório/presumido.
      if (!isImpar && batidas.length === 2 && tempoBruto > 6) {
        const descontoAlmoco = tempoBruto >= 10 ? 2.0 : 1.0;
        horasTrabalhadas = Math.max(0, tempoBruto - descontoAlmoco);
      }

      let extraDia = 0;
      if (!isImpar) {
        extraDia = horasTrabalhadas - JORNADA_PADRAO;
        emp.resumo.trabalhadas += horasTrabalhadas;
        emp.resumo.extras += extraDia;
        if (horasTrabalhadas >= HORAS_VR) {
          emp.resumo.vr += 1;
        }
      }

      let status = 'ok';
      if (isImpar) status = 'pendencia';
      else if (extraDia > 0) status = 'extra';

      diasProcessados.push({
        dataOriginal: dia.data,
        dataFormatada: dia.data.split('-').reverse().join('/'),
        batidas: batidas.map(d => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`),
        totalDia: horasTrabalhadas,
        extraDia: extraDia,
        relogios: Array.from(dia.relogios).join(', '),
        status: status,
        isImpar: isImpar
      });
    }

    resultList.push({
      pis: emp.pis,
      nome: emp.nome,
      dias: diasProcessados,
      resumo: emp.resumo
    });
  }

  resultList.sort((a, b) => a.nome.localeCompare(b.nome));
  return resultList;
}

/** Completa apenas o mês explicitamente escolhido, sem atribuir falta, carga horária ou saldo. */
function completarDiasSemRegistroRep_(dias, feriados) {
  const ano = String(document.getElementById('rep-filter-ano')?.value || '');
  const mes = String(document.getElementById('rep-filter-mes')?.value || '');
  if (!/^\d{4}$/.test(ano) || !/^(0[1-9]|1[0-2])$/.test(mes)) return;

  const existentes = new Set(dias.map(dia => dia.dataOriginal));
  const quantidadeDias = new Date(Number(ano), Number(mes), 0).getDate();
  const nomesSemana = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
  for (let numeroDia = 1; numeroDia <= quantidadeDias; numeroDia++) {
    const data = `${ano}-${mes}-${String(numeroDia).padStart(2, '0')}`;
    if (existentes.has(data)) continue;
    const momento = new Date(Number(ano), Number(mes) - 1, numeroDia);
    const indiceSemana = momento.getDay();
    const ehFeriado = feriados.has(data);
    const statusSemRegistro = ehFeriado
      ? 'feriado_sem_registro'
      : (indiceSemana === 0 ? 'descanso_semanal_remunerado' : (indiceSemana === 6 ? 'sabado_compensado' : 'falta_sem_registro'));
    dias.push({
      dataOriginal: data,
      dataFormatada: data.split('-').reverse().join('/'),
      diaSemana: nomesSemana[momento.getDay()],
      batidas: [], batidasOriginais: '', batidasDetalhadas: [],
      totalDia: null, saldoDia: null, extraDia: null,
      relogios: '-', reps: '-', fontes: '-',
      status: statusSemRegistro, pendencia: false, semRegistro: true,
      diaExtra: indiceSemana === 0 || indiceSemana === 6 || ehFeriado
    });
  }
  dias.sort((a, b) => a.dataOriginal.localeCompare(b.dataOriginal));
}

function deduplicarBatidasRep(punches) {
  if (!punches || punches.length === 0) return [];

  // Só consolida cópias exatamente idênticas do mesmo evento. Marcações próximas
  // (por exemplo, 08:14 e 08:15) continuam visíveis para conferência humana.
  const porEvento = new Map();
  for (const punch of punches) {
    const pis = normalizarPisRep(punch.pis);
    // Uma marcação só é repetida quando pertence ao mesmo REP e ao mesmo NSR.
    // Mesmo PIS/horário em equipamentos distintos continua sendo evento distinto.
    const chave = `${punch.deviceSerial || punch.sourceFile}|${punch.nsr || ''}|${pis}|${punch.datetime.getTime()}`;
    if (!porEvento.has(chave)) {
      porEvento.set(chave, { ...punch, pis, fontes: new Set([punch.sourceFile]), fontesIds: new Set(String(punch.sourceFileId || '').split(', ').filter(Boolean)), relogios: new Set([punch.clock]), repeticoes: 1 });
      continue;
    }
    const existente = porEvento.get(chave);
    existente.repeticoes++;
    if (punch.sourceFile) existente.fontes.add(punch.sourceFile);
    String(punch.sourceFileId || '').split(', ').filter(Boolean).forEach(id => existente.fontesIds.add(id));
    if (punch.clock) existente.relogios.add(punch.clock);
  }
  return Array.from(porEvento.values()).map(punch => ({
    ...punch,
    sourceFile: Array.from(punch.fontes).filter(Boolean).join(', '),
    sourceFileId: Array.from(punch.fontesIds || []).filter(Boolean).join(', '),
    clock: Array.from(punch.relogios).filter(Boolean).join(', ')
  })).sort((a, b) => a.pis.localeCompare(b.pis) || a.datetime - b.datetime);

  // Ordena por PIS e depois por timestamp
  punches.sort((a, b) => {
    if (a.pis !== b.pis) return a.pis.localeCompare(b.pis);
    return a.datetime - b.datetime;
  });

  const deduplicados = [];
  for (const punch of punches) {
    if (deduplicados.length === 0) {
      deduplicados.push(punch);
      continue;
    }

    const ultimo = deduplicados[deduplicados.length - 1];
    const mesmaPessoa = ultimo.pis === punch.pis;
    const diffSegundos = Math.abs(punch.datetime - ultimo.datetime) / 1000;

    // Se for a mesma pessoa e a diferença for menor que 2 minutos (120s), considera batida duplicada/simultânea
    if (mesmaPessoa && diffSegundos < 120) {
      if (punch.clock && ultimo.clock && !ultimo.clock.includes(punch.clock)) {
        ultimo.clock += `, ${punch.clock}`;
      }
      continue; // Ignora duplicata
    }

    deduplicados.push(punch);
  }

  return deduplicados;
}

async function processarArquivosRep(files, opcoes) {
  if (!files || files.length === 0) return;
  opcoes = opcoes || {};
  exibirLoader(true, `Lendo ${files.length} arquivo(s) AFD...`);
  const filtrosAnteriores = {
    ano: document.getElementById('rep-filter-ano')?.value || 'all',
    mes: document.getElementById('rep-filter-mes')?.value || 'all',
    local: document.getElementById('rep-filter-local')?.value || 'all',
    lotacao: document.getElementById('rep-filter-lotacao')?.value || 'all'
  };
  const jaHaviaArquivos = Boolean((dadosRepCache.arquivos || []).length);
  const falhasOnline = [];
  let substituidosOnline = 0;
  let ignoradosMaisAntigos = 0;

  if (!dadosRepCache.employees) dadosRepCache.employees = new Map();
  if (!dadosRepCache.lotacoes) dadosRepCache.lotacoes = new Map();
  if (!dadosRepCache.vinculos) dadosRepCache.vinculos = new Map();
  if (!dadosRepCache.punches) dadosRepCache.punches = [];
  if (!dadosRepCache.punchesBrutos) dadosRepCache.punchesBrutos = [];
  if (!dadosRepCache.arquivos) dadosRepCache.arquivos = [];

  try {
    const servidoresAtualizados = await chamarBackendPromessa_('obterListaServidores', []);
    if (Array.isArray(servidoresAtualizados) && servidoresAtualizados.length) AppState.servidores = servidoresAtualizados;
  } catch (erro) {
    console.warn('Cadastro atual de servidores não pôde ser recarregado:', mensagemErro(erro));
  }

  if (!dadosRepCache.vinculosCarregados) {
    try {
      const vinculos = await chamarBackendPromessa_('listarVinculosRep', []);
      dadosRepCache.vinculos = new Map((vinculos || []).map(item => [normalizarPisRep(item.identificador), item]));
      dadosRepCache.vinculosCarregados = true;
    } catch (erro) {
      console.warn('Não foi possível carregar os vínculos REP:', mensagemErro(erro));
      mostrarToast('Os AFDs serão lidos, mas os vínculos salvos não puderam ser consultados.', 'warning');
    }
  }

  const arquivosExistentes = new Set((dadosRepCache.arquivos || []).filter(arquivo => arquivo.salvoOnline !== false).map(arquivo => arquivo.chaveArquivo).filter(Boolean));
  const novosArquivos = Array.from(files).filter(file => !arquivosExistentes.has(`${file.repIntegridade?.arquivoId || ''}|${file.name}|${file.size}|${file.lastModified}`));
  const ignorados = Array.from(files).length - novosArquivos.length;
  if (!novosArquivos.length) {
    exibirLoader(false);
    return mostrarToast('Esses arquivos já foram carregados nesta sessão.', 'info');
  }

  // O cadastro de Servidores é a fonte oficial do nome; o AFD só complementa
  // nomes quando o PIS ainda não foi cadastrado no sistema.
  (AppState.servidores || []).forEach(servidor => {
    const pis = normalizarPisRep(servidor.pis);
    if (pis && servidor.nome) {
      dadosRepCache.employees.set(pis, servidor.nome);
      dadosRepCache.lotacoes.set(pis, String(servidor.lotacao || 'Não informada').trim() || 'Não informada');
    }
  });

  let indiceArquivo = 0;
  for (const file of novosArquivos) {
    indiceArquivo++;
    const progressoBase = Number(opcoes.progressoBase || 10);
    const progressoFaixa = Number(opcoes.progressoFaixa || 80);
    const progressoArquivo = progressoBase + (((indiceArquivo - 1) / Math.max(1, novosArquivos.length)) * progressoFaixa);
    exibirLoader(true, `Interpretando ${indiceArquivo}/${novosArquivos.length}: ${file.name}`);
    atualizarProgressoLoader_(progressoArquivo, `Interpretando ${indiceArquivo}/${novosArquivos.length}: ${file.name}`);
    const text = await file.text();
    const leitura = parseAFDRep(text, file.name);
    const { employees, punches, clocks, audit, metadata } = leitura;
    const arquivoDriveId = String(file.repIntegridade?.arquivoId || '');
    punches.forEach(item => { item.sourceFileId = arquivoDriveId; });
    let salvoOnline = Boolean(opcoes.origemOnline);
    for (const [pis, nome] of employees.entries()) {
      if (!dadosRepCache.employees.has(pis)) dadosRepCache.employees.set(pis, nome);
    }
    let dataInicial = null;
    let dataFinal = null;
    punches.forEach(p => {
      if (!dataInicial || p.datetime < dataInicial) dataInicial = p.datetime;
      if (!dataFinal || p.datetime > dataFinal) dataFinal = p.datetime;
    });
    if (!opcoes.origemOnline) {
      try {
        const resultadoOnline = await salvarAfdRepOnline_(file, text, leitura, dataInicial ? toDateStringRep(dataInicial) : '', dataFinal ? toDateStringRep(dataFinal) : '');
        if (resultadoOnline && resultadoOnline.ignoradoMaisAntigo) {
          ignoradosMaisAntigos++;
          continue;
        }
        salvoOnline = true;
        if (resultadoOnline && resultadoOnline.substituiu) substituidosOnline++;
      } catch (erro) {
        falhasOnline.push(`${file.name}: ${mensagemErro(erro)}`);
      }
    }

    // Substitui somente uma versao anterior do mesmo arquivo. Numeros de REP
    // repetidos em arquivos/locais diferentes permanecem carregados separadamente.
    dadosRepCache.arquivos = dadosRepCache.arquivos.filter(item => arquivoDriveId ? String(item.arquivoDriveId || '') !== arquivoDriveId : String(item.nome || '') !== String(file.name || ''));
    dadosRepCache.punchesBrutos = dadosRepCache.punchesBrutos.filter(item => arquivoDriveId ? !String(item.sourceFileId || '').split(', ').includes(arquivoDriveId) : !String(item.sourceFile || '').split(', ').includes(String(file.name || '')));
    dadosRepCache.punches = dadosRepCache.punches.reduce((saida, item) => {
      if (arquivoDriveId) {
        const ids = String(item.sourceFileId || '').split(', ').filter(Boolean);
        if (!ids.includes(arquivoDriveId)) { saida.push(item); return saida; }
        const idsRestantes = ids.filter(id => id !== arquivoDriveId);
        if (idsRestantes.length) saida.push({ ...item, sourceFileId: idsRestantes.join(', ') });
        return saida;
      }
      const fontes = String(item.sourceFile || '').split(', ').filter(Boolean);
      if (!fontes.includes(String(file.name || ''))) {
        saida.push(item);
        return saida;
      }
      const restantes = fontes.filter(nome => nome !== String(file.name || ''));
      if (restantes.length) saida.push({ ...item, sourceFile: restantes.join(', ') });
      return saida;
    }, []);
    dadosRepCache.arquivos.push({
      nome: file.name, chaveArquivo: `${arquivoDriveId}|${file.name}|${file.size}|${file.lastModified}`,
      salvoOnline,
      arquivoDriveId,
      integridadeConfirmada: Boolean(file.repIntegridade?.confirmada),
      sha256Drive: file.repIntegridade?.sha256Drive || '',
      sha256Recebido: file.repIntegridade?.sha256Recebido || '',
      tamanhoDrive: Number(file.repIntegridade?.tamanhoDrive || file.size || 0),
      tamanhoRecebido: Number(file.repIntegridade?.tamanhoRecebido || file.size || 0),
      locais: clocks.length ? clocks : ['Relógio não identificado'],
      linhasLidas: audit.linhasLidas,
      linhasArquivo: audit.linhasArquivo,
      linhasVazias: audit.linhasVazias,
      linhasCurtas: audit.linhasCurtas,
      linhasClassificadas: audit.linhasClassificadas,
      leituraCompleta: audit.leituraCompleta,
      tiposDesconhecidos: audit.tiposDesconhecidos,
      errosLeitura: audit.erros || [],
      identificadoresBatidas: audit.identificadoresBatidas || [],
      marcacoesEncontradas: audit.marcacoesEncontradas,
      marcacoesValidas: audit.marcacoesValidas,
      marcacoesInvalidas: audit.marcacoesInvalidas,
      numeroRep: metadata.deviceSerial,
      alteracoesLocal: audit.alteracoesLocal,
      quebrasNsr: audit.quebrasNsr,
      historicoLocais: metadata.locationHistory,
      inicio: dataInicial ? toDateStringRep(dataInicial) : '',
      fim: dataFinal ? toDateStringRep(dataFinal) : ''
    });
    dadosRepCache.punchesBrutos.push(...punches);
    dadosRepCache.punches.push(...punches);
    // Libera a interface entre arquivos grandes.
    await new Promise(resolve => setTimeout(resolve, 0));
    atualizarProgressoLoader_(progressoBase + ((indiceArquivo / Math.max(1, novosArquivos.length)) * progressoFaixa), `Interpretado ${indiceArquivo}/${novosArquivos.length}: ${file.name}`);
  }

  aplicarVinculosRepPersistidos_();
  // Unifica e remove batidas duplicadas entre relógios e arquivos
  dadosRepCache.punches = deduplicarBatidasRep(dadosRepCache.punches);
  aplicarAjustesCompartilhadosRep_();

  // Popula seletor de Anos dinamicamente
  const anosSet = new Set();
  let anoMaisRecente = "";
  let mesMaisRecente = "";

  dadosRepCache.punches.forEach(p => {
    const referencia = /^\d{4}-\d{2}-\d{2}$/.test(String(p.dataReferencia || '')) ? String(p.dataReferencia).split('-').map(Number) : null;
    const y = referencia ? String(referencia[0]) : String(p.datetime.getFullYear());
    const m = referencia ? String(referencia[1]).padStart(2, '0') : String(p.datetime.getMonth() + 1).padStart(2, '0');
    anosSet.add(y);
    if (!anoMaisRecente || p.datetime > new Date(`${anoMaisRecente}-${mesMaisRecente}-01`)) {
      anoMaisRecente = y;
      mesMaisRecente = m;
    }
  });

  const selectAno = document.getElementById('rep-filter-ano');
  const selectMes = document.getElementById('rep-filter-mes');
  const selectLocal = document.getElementById('rep-filter-local');
  const selectLotacao = document.getElementById('rep-filter-lotacao');
  const referenciaAnterior = new Date();
  referenciaAnterior.setDate(1);
  referenciaAnterior.setMonth(referenciaAnterior.getMonth() - 1);
  const anoAnterior = String(referenciaAnterior.getFullYear());
  const mesAnterior = String(referenciaAnterior.getMonth() + 1).padStart(2, '0');
  const possuiCompetenciaAnterior = dadosRepCache.punches.some(p =>
    String(p.datetime.getFullYear()) === anoAnterior && String(p.datetime.getMonth() + 1).padStart(2, '0') === mesAnterior
  );

  if (selectAno) {
    selectAno.innerHTML = '<option value="all">Todos os Anos</option>';
    const anosSorted = Array.from(anosSet).sort().reverse();
    anosSorted.forEach(a => {
      selectAno.insertAdjacentHTML('beforeend', `<option value="${a}">${a}</option>`);
    });
    if (jaHaviaArquivos && Array.from(anosSet).includes(filtrosAnteriores.ano)) selectAno.value = filtrosAnteriores.ano;
    else if (possuiCompetenciaAnterior && Array.from(anosSet).includes(anoAnterior)) selectAno.value = anoAnterior;
    else if (anoMaisRecente) selectAno.value = anoMaisRecente;
  }

  // Na primeira abertura, usa o mês anterior ao mês corrente. Ao adicionar
  // arquivos na mesma sessão, preserva a escolha feita pelo usuário.
  if (selectMes) selectMes.value = jaHaviaArquivos ? filtrosAnteriores.mes : (possuiCompetenciaAnterior ? mesAnterior : (mesMaisRecente || 'all'));

  if (selectLocal) {
    const locais = Array.from(new Set(dadosRepCache.punches.map(p => p.clock).filter(Boolean))).sort();
    selectLocal.innerHTML = '<option value="all">Todos os locais/relógios</option>';
    locais.forEach(local => selectLocal.insertAdjacentHTML('beforeend', `<option value="${escapeHtml(local)}">${escapeHtml(local)}</option>`));
    selectLocal.value = jaHaviaArquivos && locais.includes(filtrosAnteriores.local) ? filtrosAnteriores.local : 'all';
  }
  if (selectLotacao) {
    const lotacoes = Array.from(new Set(Array.from(dadosRepCache.lotacoes.values()).filter(Boolean))).sort((a, b) => a.localeCompare(b, 'pt-BR'));
    selectLotacao.innerHTML = '<option value="all">Todas as lotações</option>';
    lotacoes.forEach(lotacao => selectLotacao.insertAdjacentHTML('beforeend', `<option value="${escapeHtml(lotacao)}">${escapeHtml(lotacao)}</option>`));
    selectLotacao.value = jaHaviaArquivos && lotacoes.includes(filtrosAnteriores.lotacao) ? filtrosAnteriores.lotacao : 'all';
  }

  renderizarAuditoriaArquivosRep();
  atualizarProgressoLoader_(97, 'Montando a conferência e os indicadores...');
  atualizarProcessamentoRep({ notificarEntidade: true });

  const zone = document.getElementById('rep-upload-zone');
  const res = document.getElementById('rep-results-container');
  const btn = document.getElementById('rep-btn-export');
  const btnPdf = document.getElementById('rep-btn-pdf');
  const btnAlertasServidor = document.getElementById('rep-btn-alertas-servidor');
  const btnAlertasGeral = document.getElementById('rep-btn-alertas-geral');
  const btnAdicionar = document.getElementById('rep-btn-add');
  const btnAutorizacaoHe = document.getElementById('rep-btn-autorizacao-he');
  const btnLancamentoRep = document.getElementById('rep-btn-lancamento');
  const btnLancamentoLoteRep = document.getElementById('rep-btn-lancamento-lote');
  if (zone) zone.style.display = 'none';
  if (res) res.style.display = 'block';
  if (btn) btn.style.display = 'inline-flex';
  if (btnPdf) btnPdf.style.display = 'inline-flex';
  if (btnAlertasServidor) btnAlertasServidor.style.display = 'inline-flex';
  if (btnAlertasGeral) btnAlertasGeral.style.display = 'inline-flex';
  if (btnAutorizacaoHe) btnAutorizacaoHe.style.display = 'inline-flex';
  if (btnLancamentoRep) btnLancamentoRep.style.display = 'inline-flex';
  if (btnLancamentoLoteRep) btnLancamentoLoteRep.style.display = 'inline-flex';
  if (btnAdicionar) btnAdicionar.style.display = 'none';
  exibirLoader(false);
  if (falhasOnline.length) {
    mostrarToast(`${novosArquivos.length} arquivo(s) lido(s), mas ${falhasOnline.length} não puderam ser salvos online. ${falhasOnline[0]}`, 'warning');
  } else if (!opcoes.silencioso) {
    mostrarToast(`${novosArquivos.length - ignoradosMaisAntigos} arquivo(s) salvos online com sucesso.${substituidosOnline ? ` ${substituidosOnline} coleta(s) anterior(es) substituída(s).` : ''}${ignoradosMaisAntigos ? ` ${ignoradosMaisAntigos} coleta(s) mais antiga(s) foram preservadas sem sobrescrever a base.` : ''}${ignorados ? ` ${ignorados} já carregado(s) foram ignorado(s).` : ''}`, 'success');
  }
}

function aplicarVinculosRepPersistidos_() {
  const vinculos = dadosRepCache.vinculos || new Map();
  if (!vinculos.size) return;
  const identificadoresSubstituidos = new Set();
  const eventos = new Set([...(dadosRepCache.punchesBrutos || []), ...(dadosRepCache.punches || [])]);
  eventos.forEach(evento => {
    const identificador = normalizarPisRep(evento.pis);
    const vinculo = vinculos.get(identificador);
    if (!vinculo || !vinculo.pisOficial) return;
    if (identificador !== vinculo.pisOficial) {
      evento.pisOriginal = evento.pisOriginal || identificador;
      identificadoresSubstituidos.add(identificador);
    }
    evento.pis = vinculo.pisOficial;
    evento.vinculoCadastro = true;
    dadosRepCache.employees.set(vinculo.pisOficial, vinculo.nome || 'Servidor');
    dadosRepCache.lotacoes.set(vinculo.pisOficial, vinculo.lotacao || 'Não informada');
  });
  identificadoresSubstituidos.forEach(identificador => {
    dadosRepCache.employees.delete(identificador);
    dadosRepCache.lotacoes.delete(identificador);
  });
}

function aplicarAjustesCompartilhadosRep_() {
  if (!dadosRepCache || !Array.isArray(dadosRepCache.punches)) return;
  dadosRepCache.punches = dadosRepCache.punches.filter(item => !item.ajusteCompartilhado);
  dadosRepCache.punches.forEach(item => {
    if (!item.desconsideradaCompartilhada) return;
    item.desconsiderada = false;
    item.desconsideradaCompartilhada = false;
    delete item.ajusteJustificativa;
  });
  (ajustesCompartilhadosRep || []).forEach(registro => {
    const pis = normalizarPisRep(registro.pis);
    const servidor = obterServidorPorIdentificadorRep_(pis);
    if (servidor) {
      dadosRepCache.employees.set(pis, servidor.nome || 'Servidor');
      dadosRepCache.lotacoes.set(pis, String(servidor.lotacao || 'Não informada').trim() || 'Não informada');
    }
    (registro.ajustes || []).forEach(ajuste => {
      if (ajuste.tipo === 'DESCONSIDERAR') {
        const original = dadosRepCache.punches.find(item => !item.manual && normalizarPisRep(item.pis) === pis && String(item.eventKey || item.eventId || '') === String(ajuste.eventoChave || ''));
        if (original) {
          original.desconsiderada = true;
          original.desconsideradaCompartilhada = true;
          original.ajusteJustificativa = ajuste.justificativa || '';
        }
        return;
      }
      if (ajuste.tipo !== 'ADICIONAR') return;
      const data = criarDataAjusteRep(ajuste.data, ajuste.hora);
      if (!data || isNaN(data)) return;
      const cartaoManual = ajuste.origem === 'CARTAO_MANUAL';
      dadosRepCache.punches.push({
        pis, datetime: data, clock: ajuste.local || 'Local informado manualmente',
        deviceSerial: cartaoManual ? 'CARTÃO MANUAL' : 'AJUSTE COMPARTILHADO', nsr: 'MANUAL', lineNumber: '',
        eventId: String(ajuste.id || `AJUSTE|${pis}|${ajuste.data}|${ajuste.hora}`),
        eventKey: `AJUSTE|${String(ajuste.id || `${pis}|${ajuste.data}|${ajuste.hora}`)}`,
        nomeNoMomento: dadosRepCache.employees.get(pis) || '', sourceFile: cartaoManual ? 'Cartão de ponto manual' : 'Ajuste compartilhado',
        rawTimestamp: data.getTime(), manual: true, ajusteCompartilhado: true,
        dataReferencia: ajuste.dataReferencia || ajuste.data, ajusteOrigemData: ajuste.origemData || ajuste.dataReferencia || ajuste.data, justificativa: ajuste.justificativa || ''
      });
    });
  });
}

function montarAjustesCompetenciaRep_(pis, competencia, adicionais) {
  const identificador = normalizarPisRep(pis);
  const eventos = [...(dadosRepCache.punches || []), ...(adicionais || [])];
  const acoes = [];
  const vistos = new Set();
  eventos.forEach(item => {
    if (normalizarPisRep(item.pis) !== identificador || !(item.datetime instanceof Date) || isNaN(item.datetime)) return;
    const data = toDateStringRep(item.datetime);
    if (!item.manual && item.desconsiderada && data.slice(0, 7) === competencia) {
      const eventoChave = String(item.eventKey || item.eventId || '');
      const chave = 'D|' + eventoChave;
      if (eventoChave && !vistos.has(chave)) {
        vistos.add(chave);
        acoes.push({ tipo: 'DESCONSIDERAR', origemData: data, eventoChave, justificativa: item.ajusteJustificativa || '' });
      }
    } else if (item.manual && !item.desconsiderada && String(item.ajusteOrigemData || data).slice(0, 7) === competencia) {
      const id = String(item.eventId || gerarUuidSeguroCliente_());
      const chave = 'A|' + id;
      if (!vistos.has(chave)) {
        vistos.add(chave);
        acoes.push({ tipo: 'ADICIONAR', id, data, dataReferencia: item.dataReferencia || data, origemData: item.ajusteOrigemData || item.dataReferencia || data, hora: `${String(item.datetime.getHours()).padStart(2, '0')}:${String(item.datetime.getMinutes()).padStart(2, '0')}`, local: item.clock || 'Local informado manualmente', justificativa: item.justificativa || '', origem: item.sourceFile === 'Cartão de ponto manual' || item.deviceSerial === 'CARTÃO MANUAL' ? 'CARTAO_MANUAL' : 'AJUSTE' });
      }
    }
  });
  return acoes;
}

const repAlteracoesPendentes_ = new Map();
let repTemporizadorSalvamento_ = null;
let repSalvamentoEmAndamento_ = null;
let repSequenciaAlteracao_ = 0;
let repUltimoEstadoSincronizacao_ = 'idle';
let repUltimoErroSincronizacao_ = '';
let repUltimaConfirmacaoSincronizacao_ = 0;
let repTentativasReenvio_ = 0;

function obterChaveFilaRep_() {
  try {
    const usuario = JSON.parse(localStorage.getItem('rh_user') || '{}');
    const email = String(usuario.email || '').toLowerCase().trim();
    return email ? 'rh_rep_queue_v1_' + encodeURIComponent(email) : '';
  } catch (e) { return ''; }
}

let repFalhaPersistenciaFila_ = false;
function persistirFilaRep_() {
  try {
    const chave = obterChaveFilaRep_();
    if (!chave) throw new Error('Usuário da fila não identificado.');
    const itens = Array.from(repAlteracoesPendentes_.values());
    if (itens.length) localStorage.setItem(chave, JSON.stringify(itens));
    else localStorage.removeItem(chave);
    repFalhaPersistenciaFila_ = false;
    return true;
  } catch (e) {
    if (!repFalhaPersistenciaFila_ && repAlteracoesPendentes_.size) mostrarToast('Não foi possível guardar as pendências neste navegador. Não feche nem atualize esta aba até confirmar o envio para a nuvem.', 'error');
    repFalhaPersistenciaFila_ = true;
    repUltimoEstadoSincronizacao_ = 'error';
    repUltimoErroSincronizacao_ = 'Pendências apenas na memória desta aba: mantenha-a aberta e tente salvar na nuvem.';
    console.warn('Não foi possível preservar a fila do REP:', e);
    return false;
  }
}

let filaRepRestauradaAguardandoInicializacao_ = false;
function restaurarFilaRep_(processarAutomaticamente = true) {
  try {
    const chave = obterChaveFilaRep_();
    if (!chave) return;
    const itens = JSON.parse(localStorage.getItem(chave) || '[]');
    repAlteracoesPendentes_.clear();
    (Array.isArray(itens) ? itens : []).forEach(function(item) {
      if (!item || !item.chave || !item.tipo) return;
      item.sequencia = Number(item.sequencia || ++repSequenciaAlteracao_);
      repSequenciaAlteracao_ = Math.max(repSequenciaAlteracao_, item.sequencia);
      repAlteracoesPendentes_.set(String(item.chave), item);
    });
    if (repAlteracoesPendentes_.size) {
      repUltimoEstadoSincronizacao_ = 'pending';
      clearTimeout(repTemporizadorSalvamento_);
      if (processarAutomaticamente) {
        repTemporizadorSalvamento_ = setTimeout(function() { salvarAlteracoesPendentesRep_({ automatico: true }); }, 1800);
      } else {
        filaRepRestauradaAguardandoInicializacao_ = true;
      }
    }
    atualizarEstadoSalvamentoRep_();
  } catch (e) { console.warn('Não foi possível restaurar a fila do REP:', e); }
}

function liberarFilaRepRestaurada_() {
  if (!filaRepRestauradaAguardandoInicializacao_ || !repAlteracoesPendentes_.size) return;
  filaRepRestauradaAguardandoInicializacao_ = false;
  clearTimeout(repTemporizadorSalvamento_);
  repTemporizadorSalvamento_ = setTimeout(function() {
    salvarAlteracoesPendentesRep_({ automatico: true, reenvio: true });
  }, 900);
}

function atualizarEstadoSalvamentoRep_() {
  const botao = document.getElementById('btn-rep-salvar-manual');
  const quantidade = repAlteracoesPendentes_.size;
  if (botao) {
    const enviando = repUltimoEstadoSincronizacao_ === 'sending' || Boolean(repSalvamentoEmAndamento_);
    botao.disabled = quantidade === 0 && !enviando;
    botao.dataset.estado = repUltimoEstadoSincronizacao_;
    botao.textContent = enviando
      ? `Enviando ${Math.max(1, quantidade)}...`
      : (repUltimoEstadoSincronizacao_ === 'error'
        ? `Reenviar ${quantidade} pendente${quantidade === 1 ? '' : 's'}`
        : (quantidade ? `${quantidade} aguardando envio` : (repUltimaConfirmacaoSincronizacao_ ? `Nuvem confirmada ${new Date(repUltimaConfirmacaoSincronizacao_).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}` : 'Nenhuma alteração pendente')));
    botao.title = repUltimoErroSincronizacao_ || botao.textContent;
  }
  if (typeof atualizarMonitorSincronizacaoBeta_ === 'function') atualizarMonitorSincronizacaoBeta_();
}

function repTemAlteracoesPendentes_() {
  return repAlteracoesPendentes_.size > 0 || Boolean(repSalvamentoEmAndamento_);
}

function agendarReenvioSeguroRep_() {
  if (!repAlteracoesPendentes_.size) return;
  clearTimeout(repTemporizadorSalvamento_);
  const espera = Math.min(60000, 3000 * Math.pow(2, Math.max(0, repTentativasReenvio_ - 1)));
  repTemporizadorSalvamento_ = setTimeout(function() {
    if (navigator.onLine) salvarAlteracoesPendentesRep_({ automatico: true, reenvio: true });
  }, espera);
}

function enfileirarAlteracaoRep_(tipo, dados, chave) {
  const identificador = String(chave || `${tipo}|${++repSequenciaAlteracao_}`);
  const anterior = repAlteracoesPendentes_.get(identificador);
  if (String(tipo).toUpperCase() === 'AJUSTES' && anterior?.dados) {
    dados = {
      ...dados,
      origensSubstituidas: Array.from(new Set([
        ...(anterior.dados.origensSubstituidas || []),
        ...((dados && dados.origensSubstituidas) || [])
      ]))
    };
  }
  repAlteracoesPendentes_.set(identificador, {
    chave: identificador,
    tipo: String(tipo || '').toUpperCase(),
    dados: dados || {},
    sequencia: ++repSequenciaAlteracao_
  });
  repUltimoEstadoSincronizacao_ = 'pending';
  repUltimoErroSincronizacao_ = '';
  persistirFilaRep_();
  clearTimeout(repTemporizadorSalvamento_);
  repTemporizadorSalvamento_ = setTimeout(function() {
    salvarAlteracoesPendentesRep_({ automatico: true });
  }, 1400);
  atualizarEstadoSalvamentoRep_();
  return { pendente: true };
}

async function salvarAlteracoesPendentesRep_(opcoes) {
  opcoes = opcoes || {};
  clearTimeout(repTemporizadorSalvamento_);
  repTemporizadorSalvamento_ = null;
  if (repSalvamentoEmAndamento_) {
    const sucessoAtual = await repSalvamentoEmAndamento_;
    if (!sucessoAtual || !repAlteracoesPendentes_.size) return sucessoAtual;
  }
  if (!repAlteracoesPendentes_.size) {
    atualizarEstadoSalvamentoRep_();
    return true;
  }

  const lote = Array.from(repAlteracoesPendentes_.values());
  let loteSalvo = false;
  repUltimoEstadoSincronizacao_ = 'sending';
  repUltimoErroSincronizacao_ = '';
  atualizarEstadoSalvamentoRep_();
  repSalvamentoEmAndamento_ = (async function() {
    atualizarEstadoSalvamentoRep_();
    try {
      const resultados = await chamarBackendComRetryTemporario_('salvarAlteracoesLoteRep', [lote, { confirmacaoIndividual: true }], 'Sincronização do REP ocupada');
      if (!Array.isArray(resultados)) throw new Error('Resposta de salvamento inválida. A fila foi preservada.');
      const confirmados = new Set(resultados.filter(r => r.sucesso !== false).map(r => r.chave));
      lote.forEach(item => {
        if (!confirmados.has(item.chave)) return;
        const atual = repAlteracoesPendentes_.get(item.chave);
        if (atual && atual.sequencia === item.sequencia) repAlteracoesPendentes_.delete(item.chave);
      });
      persistirFilaRep_();
      const falha = resultados.find(r => r.sucesso === false);
      if (falha || lote.some(item => !confirmados.has(item.chave))) {
        throw new Error(falha ? falha.erro : 'Nem todas as alterações foram confirmadas pelo servidor.');
      }
      loteSalvo = true;
      repTentativasReenvio_ = 0;
      repUltimoEstadoSincronizacao_ = repAlteracoesPendentes_.size ? 'pending' : 'confirmed';
      repUltimaConfirmacaoSincronizacao_ = Date.now();
      repUltimoErroSincronizacao_ = '';
      persistirFilaRep_();
      if (opcoes.manual) mostrarToast(`${resultados.length} alteração(ões) do REP salvas.`, 'success');
      return true;
    } catch (erro) {
      const jaEstavaEmFalha = repUltimoEstadoSincronizacao_ === 'error';
      repUltimoEstadoSincronizacao_ = 'error';
      repUltimoErroSincronizacao_ = mensagemErro(erro);
      persistirFilaRep_();
      repTentativasReenvio_++;
      agendarReenvioSeguroRep_();
      if (!opcoes.reenvio && !jaEstavaEmFalha) mostrarToast('As alterações continuam pendentes e serão reenviadas automaticamente: ' + mensagemErro(erro), 'error');
      return false;
    } finally {
      repSalvamentoEmAndamento_ = null;
      atualizarEstadoSalvamentoRep_();
      if (loteSalvo && !repAlteracoesPendentes_.size) {
        setTimeout(atualizarApontamentosRepSegundoPlano_, 150);
      }
    }
  })();
  return repSalvamentoEmAndamento_;
}

async function garantirSalvamentoAntesDeSairRep_() {
  if (!repTemAlteracoesPendentes_()) return true;
  exibirLoader(true, 'Salvando alterações do REP antes de continuar...');
  try {
    return await salvarAlteracoesPendentesRep_({ manual: false });
  } finally {
    exibirLoader(false);
  }
}

async function salvarAjustesCompetenciaRep_(pis, competencia, adicionais, origensSubstituidas) {
  const ajustes = montarAjustesCompetenciaRep_(pis, competencia, adicionais);
  const dados = { pis, competencia, ajustes, origensSubstituidas: origensSubstituidas || [] };
  enfileirarAlteracaoRep_('AJUSTES', dados, `AJUSTES|${normalizarPisRep(pis)}|${competencia}`);
  ajustesCompartilhadosRep = (ajustesCompartilhadosRep || []).filter(item => !(normalizarPisRep(item.pis) === normalizarPisRep(pis) && item.competencia === competencia));
  if (ajustes.length) ajustesCompartilhadosRep.push({ pis, competencia, ajustes, atualizadoPor: 'Salvamento pendente' });
  return ajustes;
}

function adicionarArquivosRep() {
  const input = document.getElementById('rep-file-input');
