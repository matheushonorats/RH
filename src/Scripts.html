<script>
/**
 * Lógica do Cliente (Interface do Usuário)
 * RH Central de Documentos v2.0
 */

const AppState = {
  usuarioLogado: {
    email: "",
    nome: "",
    papel: "Consulta"
  },
  servidores: [],
  lancamentos: []
};

/**
 * Função utilitária global para prevenir injeções de HTML e XSS armazenado
 */
function escapeHtml(unsafe) {
  if (unsafe === undefined || unsafe === null) return '';
  return String(unsafe)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/** Mantém o app funcional mesmo quando o CDN de ícones estiver indisponível. */
function renderizarIcones() {
  if (window.lucide && typeof window.lucide.createIcons === 'function') {
    window.lucide.createIcons();
  }
}

function mensagemErro(erro) {
  if (!erro) return "Erro desconhecido.";
  return erro.message || String(erro);
}

// Executa automaticamente ao carregar a página
window.addEventListener('DOMContentLoaded', () => {
  // Inicializa os ícones do Lucide quando o CDN estiver disponível.
  renderizarIcones();
  
  // Busca informações do usuário logado no servidor Google
  inicializarUsuario();
});

/**
 * Controla a navegação SPA entre as abas do menu
 */
function navegarPara(idView) {
  // 1. Ocultar todas as views e desativar todos os links
  document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
  document.querySelectorAll('.menu-link').forEach(link => link.classList.remove('active'));
  
  // 2. Mostrar a view selecionada
  const viewAlvo = document.getElementById(`view-${idView}`);
  if (viewAlvo) {
    viewAlvo.classList.add('active');
  }
  
  // 3. Ativar o link clicado e mover o indicador
  const linkAtivo = Array.from(document.querySelectorAll('.menu-link')).find(link => 
    link.getAttribute('onclick') && link.getAttribute('onclick').includes(`'${idView}'`)
  );
  if (linkAtivo) {
    linkAtivo.classList.add('active');
    
    // Move o indicador flutuante
    const ind = document.getElementById('sidebar-indicator');
    if (ind) {
      // O offsetTop do link (dentro do li) + o offset do próprio li em relação ao ul
      const li = linkAtivo.closest('li');
      if (li) {
        ind.style.top = li.offsetTop + "px";
        ind.style.height = linkAtivo.offsetHeight + "px";
      }
    }
  }
  
  // 4. Mudar o título superior da barra
  const titulos = {
    'dashboard': 'Dashboard Geral',
    'servidores': 'Gestão de Servidores',
    'lancamentos': 'Histórico de Lançamentos',
    'protocolos': 'Controle de Protocolos',
    'relatorios': 'Relatórios & Emissão',
    'admin': 'Painel Administrativo'
  };
  document.getElementById('view-title').innerText = titulos[idView] || 'RH Central';
  
  // 5. Recarrega os ícones Lucide para garantir renderização correta
  renderizarIcones();
  
  // 6. Carrega os dados específicos da view
  carregarDadosDaView(idView);
}

/**
 * Busca o usuário atual logado pelo Google Apps Script
 */
function inicializarUsuario() {
  exibirLoader(true);
  
  // Se estiver rodando fora do Apps Script (teste local no navegador, por exemplo)
  if (typeof google === "undefined" || !google.script) {
    AppState.usuarioLogado = { email: "teste@saosebastiao.sp.gov.br", nome: "Usuário Teste Local", papel: "Administrador" };
    atualizarBarraUsuario();
    exibirLoader(false);
    return;
  }
  
  google.script.run
    .withSuccessHandler(function(usuario) {
      AppState.usuarioLogado = usuario;
      atualizarBarraUsuario();
      
      // Se for Admin, mostra o menu administrativo
      if (usuario.papel === "Administrador" || usuario.papel === "Admin") {
        document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
      }
      
      exibirLoader(false);
      // Carrega o dashboard inicial
      carregarDadosDaView('dashboard');
    })
    .withFailureHandler(function(erro) {
      console.error("Erro ao obter usuário:", erro);
      document.getElementById('current-user-name').innerText = "Acesso Negado";
      document.getElementById('current-user-role').innerText = "Não autorizado";
      exibirLoader(false);
      alert("Erro ao validar credenciais do Google. Verifique se seu e-mail está cadastrado no sistema.");
    })
    .obterDadosUsuarioLogado(); // Essa função será criada no Auth.gs
}

/**
 * Atualiza os textos de identificação do usuário na barra superior
 */
function atualizarBarraUsuario() {
  document.getElementById('current-user-name').innerText = AppState.usuarioLogado.nome;
  document.getElementById('current-user-role').innerText = AppState.usuarioLogado.papel;
  if (typeof lucide !== 'undefined') {
    lucide.createIcons();
  }
}

/**
 * Alterna entre modo claro e escuro
 */
function toggleDarkMode() {
  const body = document.body;
  body.classList.toggle('dark-mode');
  
  const icon = document.getElementById('theme-icon');
  if (icon) {
    if (body.classList.contains('dark-mode')) {
      icon.setAttribute('data-lucide', 'moon');
    } else {
      icon.setAttribute('data-lucide', 'sun');
    }
    renderizarIcones();
  }
}

/**
 * Exibe ou oculta o spinner de carregamento geral
 */
function exibirLoader(mostrar) {
  const loader = document.getElementById('global-loader');
  if (loader) {
    loader.style.display = mostrar ? 'flex' : 'none';
  }
}

/**
 * Carrega ou atualiza os dados dependendo da tela aberta
 */
function carregarDadosDaView(idView) {
  if (idView === 'dashboard') {
    carregarDashboard();
  } else if (idView === 'servidores') {
    carregarListaServidores();
  } else if (idView === 'lancamentos') {
    carregarListaLancamentos();
  } else if (idView === 'protocolos') {
    carregarListaProtocolos();
  } else if (idView === 'relatorios') {
    if(typeof ajustarFiltrosRelatorios === 'function') ajustarFiltrosRelatorios();
    if(typeof gerarDadosRelatorio === 'function') gerarDadosRelatorio();
  } else if (idView === 'admin') {
    alternarAbaAdmin('adm-usuarios');
  }
}

/**
 * Busca dados consolidados para o Dashboard
 */
function carregarDashboard() {
  if (typeof google === "undefined" || !google.script) return;

  exibirLoader(true);
  
  google.script.run
    .withSuccessHandler(function(resumo) {
      document.getElementById('dash-servidores-ativos').innerText = resumo.ativos || 0;
      document.getElementById('dash-ferias-compulsorias').innerText = resumo.compulsorias || 0;
      document.getElementById('dash-ausentes-hoje').innerText = resumo.ausentesHoje || 0;
      document.getElementById('dash-protocolos-pendentes').innerText = resumo.protocolosPendentes || 0;
      
      // Renderiza tabela de ausências de hoje
      const tabela = document.getElementById('dash-tabela-ausencias');
      if (resumo.listaAusentes && resumo.listaAusentes.length > 0) {
        let html = "";
        resumo.listaAusentes.forEach(a => {
          html += `<tr>             <td>               <button class="btn-action" onclick="abrirModalLancamento(${a.linhaPlanilha}); return false;" title="Visualizar Lançamento">                 <span data-lucide="eye" style="width: 14px; height: 14px;"></span>               </button>             </td>             <td><strong>${escapeHtml(a.idoc || '-')}</strong></td>             <td><strong>${escapeHtml(a.nome)}</strong></td>             <td>${escapeHtml(a.matricula)}</td>             <td>${escapeHtml(a.tipo)}</td>             <td>${escapeHtml(a.periodo)}</td>             <td style="text-align: center;">${a.dias}</td>           </tr>`;
        });
        tabela.innerHTML = html;
      } else {
        tabela.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-secondary);">Nenhuma ausência registrada para hoje.</td></tr>`;
      }
      renderizarIcones();
      exibirLoader(false);
    })
    .withFailureHandler(function(erro) {
      console.error("Erro ao carregar dashboard:", erro);
      exibirLoader(false);
      alert("Não foi possível carregar os dados da planilha: " + mensagemErro(erro));
    })
    .obterResumoDashboard();
}

/**
 * Aplica filtros ao clicar nos cartões do Dashboard e navega para a respectiva View
 */
function aplicarFiltroDashboard(tipo) {
  if (tipo === 'ativos') {
    navegarPara('servidores');
    document.getElementById('filtro-status-servidor').value = 'Ativo';
    filtrarTabelaServidores();
  } else if (tipo === 'compulsorias') {
    navegarPara('relatorios');
    document.getElementById('rep-tipo').value = 'compulsorias';
    if(typeof ajustarFiltrosRelatorios === 'function') ajustarFiltrosRelatorios();
    if(typeof gerarDadosRelatorio === 'function') gerarDadosRelatorio();
  } else if (tipo === 'pendentes') {
    navegarPara('lancamentos');
    document.getElementById('filtro-status-lancamento').value = 'SEM 1DOC';
    filtrarTabelaLancamentos();
  }
}

// Controle de Exibição de Modais
function abrirModal(idModal) {
  const modal = document.getElementById(idModal);
  if (modal) {
    modal.classList.add('active');
    renderizarIcones();
  }
}

function fecharModal(idModal) {
  const modal = document.getElementById(idModal);
  if (modal) {
    modal.classList.remove('active');
  }
}

/**
 * Carrega a lista completa de servidores do backend
 */
function carregarListaServidores() {
  exibirLoader(true);
  
  if (typeof google === "undefined" || !google.script) {
    // Mock local para testes visuais
    AppState.servidores = [
      { nome: "ADIVANESSA PRATES DE ANDRADE", matricula: "86916", cargo: "SERVENTE", lotacao: "Rodoviária", admissao: "30/03/2024", situacao: "ESTATUTÁRIO", email: "vanessaprates@gmail.com", status: "Ativo", saldoHoje: 30, projetado: 30, infoFerias: "[AVISO] ATENÇÃO: 1 Período vencido." },
      { nome: "ANDERSON AUGUSTO DOS SANTOS", matricula: "72882", cargo: "ASSESSOR", lotacao: "Turismo", admissao: "01/01/2023", situacao: "COMISSIONADO", email: "anderson@gmail.com", status: "Férias", saldoHoje: 0, projetado: 0, infoFerias: "Regular." }
    ];
    renderizarTabelaServidores();
    popularFiltroLotacoes();
    exibirLoader(false);
    return;
  }
  
  google.script.run
    .withSuccessHandler(function(servidores) {
      AppState.servidores = Array.isArray(servidores) ? servidores : [];
      renderizarTabelaServidores();
      popularFiltroLotacoes();
      exibirLoader(false);
    })
    .withFailureHandler(function(erro) {
      console.error("Erro ao buscar servidores:", erro);
      exibirLoader(false);
      alert("Erro ao buscar servidores da planilha: " + erro.toString());
    })
    .obterListaServidores();
}

/**
 * Renderiza as linhas da tabela de Servidores com base nos dados locais
 */
function renderizarTabelaServidores(listaFiltrada) {
  const servidores = Array.isArray(listaFiltrada)
    ? listaFiltrada
    : (Array.isArray(AppState.servidores) ? AppState.servidores : []);
  const tbody = document.getElementById('tabela-servidores-body');
  
  if (servidores.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-secondary);">Nenhum servidor encontrado.</td></tr>`;
    return;
  }
  
  let html = "";
  servidores.forEach(s => {
    let badgeClass = "badge-ativo";
    let badgeText = "Ativo";
    
    if (s.status === "Férias") {
      badgeClass = "badge-ferias";
      badgeText = "Em Férias";
    } else if (s.status === "Abono") {
      badgeClass = "badge-abono";
      badgeText = "Em Abono";
    } else if (s.status === "Inativo") {
      badgeClass = "badge-inativo";
      badgeText = "Inativo";
    }
    
    html += `<tr>       <td><strong>${escapeHtml(s.nome)}</strong></td>       <td>${escapeHtml(s.matricula)}</td>       <td>${escapeHtml(s.cargo)}</td>       <td>${escapeHtml(s.lotacao)}</td>       <td>${escapeHtml(s.situacao)}</td>       <td><span class="badge ${badgeClass}">${badgeText}</span></td>       <td>         <div class="action-buttons">           <button class="btn-action" data-action="ficha" data-mat="${escapeHtml(s.matricula)}" title="Visualizar Ficha">             <span data-lucide="eye" style="width: 14px; height: 14px;"></span>           </button>           <button class="btn-action" data-action="editar-servidor" data-mat="${escapeHtml(s.matricula)}" title="Editar Cadastro">             <span data-lucide="edit-2" style="width: 14px; height: 14px;"></span>           </button>           ${s.status !== 'Inativo' ? `<button class="btn-action btn-delete" data-action="desativar-servidor" data-mat="${escapeHtml(s.matricula)}" data-nome="${escapeHtml(s.nome)}" title="Desativar Servidor"><span data-lucide="trash-2" style="width: 14px; height: 14px;"></span></button>` : ''}         </div>       </td>     </tr>`;
  });

  tbody.innerHTML = html;
  // Delega eventos após inserção para evitar XSS em atributos onclick
  tbody.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', function() {
      const action = this.dataset.action;
      const mat = this.dataset.mat;
      const nome = this.dataset.nome || '';
      if (action === 'ficha') abrirFichaServidor(mat);
      else if (action === 'editar-servidor') abrirModalServidor(mat);
      else if (action === 'desativar-servidor') confirmarDesativacaoServidor(mat, nome);
    });
  });
  renderizarIcones();
}

/**
 * Filtra a tabela de servidores em tempo real no lado do cliente
 */
function filtrarTabelaServidores() {
  const busca = document.getElementById('filtro-busca-servidor').value.toLowerCase().trim();
  const lotacao = document.getElementById('filtro-lotacao-servidor').value;
  const situacao = document.getElementById('filtro-situacao-servidor').value;
  const status = document.getElementById('filtro-status-servidor').value;
  
  const filtrados = AppState.servidores.filter(s => {
    // 1. Busca textual (Nome ou Matrícula)
    const bateBusca = !busca || s.nome.toLowerCase().includes(busca) || s.matricula.toLowerCase().includes(busca);
    
    // 2. Filtro de Lotação
    const bateLotacao = !lotacao || s.lotacao === lotacao;
    
    // 3. Filtro de Situação
    const bateSituacao = !situacao || s.situacao === situacao;
    
    // 4. Filtro de Status
    let bateStatus = false;
    if (!status) {
      bateStatus = true;
    } else if (status === "Compulsorias") {
      bateStatus = s.feriasCompulsorias === true;
    } else {
      bateStatus = s.status === status;
    }
    
    return bateBusca && bateLotacao && bateSituacao && bateStatus;
  });
  
  renderizarTabelaServidores(filtrados);
}

/**
 * Popula dinamicamente o select de lotações com base nos cadastros existentes
 */
function popularFiltroLotacoes() {
  const select = document.getElementById('filtro-lotacao-servidor');
  const lotacaoForm = document.getElementById('serv-lotacao');
  
  // Extrai lotações exclusivas
  const lotacoes = [...new Set(AppState.servidores.map(s => s.lotacao).filter(Boolean))].sort();
  
  // Popula filtro da listagem
  let htmlFiltro = '<option value="">Todas Lotações</option>';
  lotacoes.forEach(l => {
    htmlFiltro += `<option value="${l}">${l}</option>`;
  });
  select.innerHTML = htmlFiltro;
  
  // Popula dropdown do formulário
  let htmlForm = '';
  lotacoes.forEach(l => {
    htmlForm += `<option value="${l}">${l}</option>`;
  });
  if (!lotacoes.includes("Turismo")) htmlForm += '<option value="Turismo">Turismo</option>';
  if (!lotacoes.includes("Rodoviária")) htmlForm += '<option value="Rodoviária">Rodoviária</option>';
  if (!lotacoes.includes("Espaço Batuíra")) htmlForm += '<option value="Espaço Batuíra">Espaço Batuíra</option>';
  htmlForm += '<option value="Outro">Outro...</option>';
  lotacaoForm.innerHTML = htmlForm;
}

/**
 * Abre o modal de cadastro/edição de servidor
 */
function abrirModalServidor(matricula) {
  const form = document.getElementById('form-servidor');
  form.reset();
  
  const titulo = document.getElementById('modal-servidor-titulo');
  const inputMatricula = document.getElementById('serv-matricula');
  const wrapperAtivo = document.getElementById('serv-ativo-wrapper');
  
  if (matricula) {
    // Modo Edição
    titulo.innerText = "Editar Servidor";
    inputMatricula.disabled = true; // matrícula é a chave primária, não edita
    wrapperAtivo.style.display = "block";
    
    const s = AppState.servidores.find(serv => serv.matricula === matricula);
    if (s) {
      document.getElementById('serv-matricula').value = s.matricula;
      document.getElementById('serv-nome').value = s.nome;
      document.getElementById('serv-cargo').value = s.cargo;
      document.getElementById('serv-lotacao').value = s.lotacao;
      document.getElementById('serv-situacao').value = s.situacao;
      document.getElementById('serv-email').value = s.email;
      document.getElementById('serv-ativo').value = s.status === 'Inativo' ? 'Não' : 'Sim';
      
      // Parse de data no formato dd/mm/yyyy para yyyy-mm-dd exigido pelo input date
      if (s.admissao) {
        let partes = s.admissao.split('/');
        if (partes.length === 3) {
          document.getElementById('serv-admissao').value = `${partes[2]}-${partes[1]}-${partes[0]}`;
        }
      }
    }
  } else {
    // Modo Cadastro
    titulo.innerText = "Cadastrar Servidor";
    inputMatricula.disabled = false;
    wrapperAtivo.style.display = "none";
    document.getElementById('serv-ativo').value = "Sim";
  }
  
  abrirModal('modal-servidor');
}

/**
 * Envia os dados do formulário de servidor ao backend do Apps Script
 */
function salvarDadosServidor(event) {
  event.preventDefault();
  exibirLoader(true);
  
  const dados = {
    matricula: document.getElementById('serv-matricula').value.trim(),
    nome: document.getElementById('serv-nome').value.trim().toUpperCase(),
    cargo: document.getElementById('serv-cargo').value.trim().toUpperCase(),
    lotacao: document.getElementById('serv-lotacao').value,
    admissao: document.getElementById('serv-admissao').value,
    situacao: document.getElementById('serv-situacao').value,
    email: document.getElementById('serv-email').value.trim(),
    ativo: document.getElementById('serv-ativo').value
  };
  
  if (typeof google === "undefined" || !google.script) {
    alert("Dados salvos em modo simulação local!");
    exibirLoader(false);
    fecharModal('modal-servidor');
    return;
  }
  
  google.script.run
    .withSuccessHandler(function() {
      fecharModal('modal-servidor');
      carregarListaServidores(); // recarrega a tabela
      alert("Cadastro de servidor salvo com sucesso!");
    })
    .withFailureHandler(function(erro) {
      exibirLoader(false);
      alert("Erro ao salvar servidor: " + erro.toString());
    })
    .salvarServidor(dados);
}

/**
 * Aciona a desativação lógica (soft delete) do servidor
 */
function confirmarDesativacaoServidor(matricula, nome) {
  if (confirm(`Atenção!\n\nVocê tem certeza que deseja DESATIVAR o cadastro do servidor ${nome} (Matrícula: ${matricula})?\n\nEle não aparecerá mais nos formulários ativos, mas todo o histórico dele na planilha será preservado.`)) {
    exibirLoader(true);
    
    if (typeof google === "undefined" || !google.script) {
      alert("Servidor desativado em modo de simulação local!");
      exibirLoader(false);
      return;
    }
    
    google.script.run
      .withSuccessHandler(function() {
        carregarListaServidores();
        alert("Cadastro de servidor desativado com sucesso!");
      })
      .withFailureHandler(function(erro) {
        exibirLoader(false);
        alert("Erro ao desativar servidor: " + erro.toString());
      })
      .desativarServidor(matricula);
  }
}

/**
 * Controla a navegação das abas dentro da Ficha do Servidor
 */
function alternarAbaFicha(idAba) {
  document.querySelectorAll('#modal-ficha-servidor .tab-button').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('#modal-ficha-servidor .tab-panel').forEach(panel => panel.classList.remove('active'));
  
  // Ativa botão clicado
  const btnAlvo = Array.from(document.querySelectorAll('#modal-ficha-servidor .tab-button')).find(btn => 
    btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(`'${idAba}'`)
  );
  if (btnAlvo) btnAlvo.classList.add('active');
  
  // Ativa painel correspondente
  const painel = document.getElementById(idAba);
  if (painel) painel.classList.add('active');
}

/**
 * Abre a Ficha Individual Detalhada do Servidor e carrega seus períodos de férias e lançamentos
 */
function abrirFichaServidor(matricula) {
  const s = AppState.servidores.find(serv => serv.matricula === matricula);
  if (!s) return;
  
  // 1. Limpar abas para o estado inicial
  alternarAbaFicha('tab-dados');
  
  // 2. Preencher Dados de Cadastro
  document.getElementById('ficha-nome').innerText = s.nome;
  document.getElementById('ficha-cargo').innerText = s.cargo || 'Não cadastrado';
  document.getElementById('ficha-lotacao').innerText = s.lotacao || 'Não cadastrado';
  document.getElementById('ficha-matricula').innerText = s.matricula;
  
  document.getElementById('ficha-dados-situacao').innerText = s.situacao;
  document.getElementById('ficha-dados-admissao').innerText = s.admissao || 'Não informada';
  document.getElementById('ficha-dados-email').innerText = s.email || 'Não informado';
  
  const statusBadge = document.getElementById('ficha-dados-status');
  statusBadge.className = "badge";
  if (s.status === 'Ativo') {
    statusBadge.classList.add('badge-ativo');
    statusBadge.innerText = 'ATIVO';
  } else if (s.status === 'Férias') {
    statusBadge.classList.add('badge-ferias');
    statusBadge.innerText = 'EM FÉRIAS';
  } else if (s.status === 'Abono') {
    statusBadge.classList.add('badge-abono');
    statusBadge.innerText = 'EM ABONO';
  } else {
    statusBadge.classList.add('badge-inativo');
    statusBadge.innerText = 'INATIVO';
  }
  
  // 3. Preencher Saldo de Férias do cabeçalho
  document.getElementById('ficha-ferias-saldo').innerText = s.saldoHoje + " dias";
  
  // 4. Renderizar os períodos aquisitivos calculados no servidor.
  const gridPeriodos = document.getElementById('ficha-ferias-periodos');
  gridPeriodos.innerHTML = "";
  
  if (Array.isArray(s.periodosFerias) && s.periodosFerias.length > 0) {
    s.periodosFerias.forEach(periodo => {
      const percentualUso = periodo.diasOriginais > 0
        ? Math.round((periodo.diasUsados / periodo.diasOriginais) * 100)
        : 0;
      const futuro = periodo.status === "Em aquisição";
      const usufruido = periodo.status === "Usufruído";
      const badgeClass = futuro ? "badge-abono" : (usufruido ? "badge-inativo" : "badge-ativo");
      const fillClass = usufruido ? "fill-usufruido" : "fill-disponivel";

      gridPeriodos.innerHTML += `
        <div class="period-card">
          <div class="period-header">
            <span class="period-title">${escapeHtml(periodo.referencia)}</span>
            <span class="badge ${badgeClass}">${escapeHtml(periodo.status)}</span>
          </div>
          <div class="period-dates">Liberação: ${escapeHtml(periodo.dataLiberacao)}</div>
          <div class="period-dates">Usados: ${periodo.diasUsados} d | Saldo: ${periodo.saldo} d</div>
          <div class="period-status-bar">
            <div class="period-status-fill ${fillClass}" style="width:${Math.min(100, percentualUso)}% !important"></div>
          </div>
          <div class="period-legend">
            <span>0%</span><span>${percentualUso}% utilizado</span><span>100%</span>
          </div>
        </div>`;
    });
  } else if (s.infoFerias) {
    // Compatibilidade com planilhas antigas que possuíam a fórmula Info_Férias.
    // Processamento do texto estruturado
    // Ex: "[AVISO] ATENÇÃO: 1 Período vencido. | Saldo: 30 dias | Próx (+30): 30/03/2027"
    let partes = s.infoFerias.split('|');
    partes.forEach((p, idx) => {
      let texto = p.trim();
      if (!texto) return;
      
      let cardClass = "";
      let fillClass = "fill-disponivel";
      let statusTexto = "Disponível";
      
      if (texto.toLowerCase().includes("vencido") || texto.toLowerCase().includes("crítico")) {
        cardClass = "style='border-color: rgba(247, 90, 90, 0.4); background-color: rgba(247, 90, 90, 0.02);'";
        fillClass = "fill-vencido";
        statusTexto = "Vencido (Compulsório)";
      } else if (texto.toLowerCase().includes("próx") || texto.toLowerCase().includes("projetado")) {
        cardClass = "";
        fillClass = "fill-usufruido";
        statusTexto = "Em Aquisição";
      }
      
      gridPeriodos.innerHTML += `         <div class="period-card" ${cardClass}>           <div class="period-header">             <span class="period-title">${texto.split(':')[0] || 'Período'}</span>             <span class="badge ${fillClass === 'fill-vencido' ? 'badge-ferias' : 'badge-ativo'}">${statusTexto}</span>           </div>           <div class="period-dates">${texto.includes(':') ? texto.split(':')[1] : texto}</div>           <div class="period-status-bar">             <div class="period-status-fill ${fillClass}"></div>           </div>           <div class="period-legend">             <span>0%</span>             <span>Uso</span>             <span>100%</span>           </div>         </div>       `;
    });
  }
  
  if (gridPeriodos.innerHTML === "") {
    gridPeriodos.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); font-size: 13px;">Nenhum período de férias registrado ou processado.</div>`;
  }
  
  // 5. Carregar Lançamentos/Ausências Históricas no modal
  const tabelaHist = document.getElementById('ficha-historico-tabela');
  tabelaHist.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">Buscando histórico...</td></tr>`;
  
  let elNormaisInit = document.getElementById('ficha-abonadas-normais');
  let elNataliciasInit = document.getElementById('ficha-abonadas-natalicias');
  if (elNormaisInit) elNormaisInit.innerHTML = '<i class="fas fa-circle-notch fa-spin" style="font-size: 16px; color: var(--text-muted);"></i>';
  if (elNataliciasInit) elNataliciasInit.innerHTML = '<i class="fas fa-circle-notch fa-spin" style="font-size: 16px; color: var(--text-muted);"></i>';
  
  if (typeof google !== "undefined" && google.script) {
    google.script.run
      .withSuccessHandler(function(historico) {
        historico = Array.isArray(historico) ? historico : [];
        // 5.1 Calcular Totais de Ausências no Ano Atual
        let anoAtual = new Date().getFullYear();
        let contAbonadasNormais = 0;
        let contAbonadasNatalicias = 0;

        // 5.2 Renderizar Tabela
        if (historico.length === 0) {
          tabelaHist.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Nenhum lançamento registrado no histórico.</td></tr>`;
        } else {
          let html = "";
          historico.forEach(l => {
            // Garante que o lançamento exista no AppState.lancamentos para o Modal de Edição funcionar
            if (!AppState.lancamentos.some(lanc => lanc.linhaPlanilha === l.linhaPlanilha)) {
              AppState.lancamentos.push(l);
            }
            
            // Contagem de Abonadas (Ignora não efetivados e filtrados pelo ano)
            if (!l.tipo.toLowerCase().includes("não efetivado") && !l.tipo.toLowerCase().includes("anulado")) {
              if (l.dataInicio && l.dataInicio.includes(anoAtual)) {
                if (l.tipo.toLowerCase().includes("abonada eleitoral")) {
                  // Pode colocar lógica de eleitoral se quiser, mas pediu normal/natalícia
                } else if (l.tipo.toLowerCase().includes("natalícia") || l.tipo.toLowerCase().includes("natalicia")) {
                  contAbonadasNatalicias += parseInt(l.dias) || 1;
                } else if (l.tipo.toLowerCase().includes("abonada") || l.tipo.toLowerCase().includes("abono")) {
                  contAbonadasNormais += parseInt(l.dias) || 1;
                }
              }
            }

            let statusClass = "badge-neutral";
            let statusText = "Ativo";
            if (l.tipo.toLowerCase().includes("não efetivado") || l.tipo.toLowerCase().includes("anulado")) {
              statusClass = "badge-inativo";
              statusText = "Anulado";
            }

            html += `<tr>               <td>                 <button class="btn-action" onclick="abrirModalLancamento(${l.linhaPlanilha}); fecharModal('modal-ficha-servidor'); return false;" title="Visualizar/Editar Lançamento">                   <span data-lucide="eye" style="width: 14px; height: 14px;"></span>                 </button>               </td>               <td><strong>${escapeHtml(l.idoc)}</strong></td>               <td>${escapeHtml(l.tipo)}</td>               <td>${escapeHtml(l.dataInicio)}</td>               <td style="text-align: center;">${escapeHtml(l.dias || l.qtdHoras || '-')}</td>               <td><span class="badge ${statusClass}">${escapeHtml(statusText)}</span></td>             </tr>`;
          });
          tabelaHist.innerHTML = html;
        }

        // 5.3 Atualiza as caixinhas de Abonadas
        let elNormais = document.getElementById('ficha-abonadas-normais');
        let elNatalicias = document.getElementById('ficha-abonadas-natalicias');
        if(elNormais) elNormais.innerText = contAbonadasNormais + " / 5";
        if(elNatalicias) elNatalicias.innerText = contAbonadasNatalicias + " / 1";
        
        renderizarIcones();
      })
      .obterHistoricoServidor(matricula);
  } else {
    tabelaHist.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Sem conexão com o Google Sheets (modo local).</td></tr>`;
  }
  
  abrirModal('modal-ficha-servidor');
}

/**

 */
function renderizarTabelaLancamentos(listaFiltrada) {
  const lancamentos = Array.isArray(listaFiltrada)
    ? listaFiltrada
    : (Array.isArray(AppState.lancamentos) ? AppState.lancamentos : []);
  const tbody = document.getElementById('tabela-lancamentos-body');
  
  if (lancamentos.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--text-secondary);">Nenhum lançamento encontrado.</td></tr>`;
    return;
  }
  
  let html = "";
  lancamentos.forEach(l => {
    let badgeClass = "badge-ativo";
    if (l.status === "Anulado") {
      badgeClass = "badge-inativo";
    }
    
    // Verifica se possui anexos vinculados
    const possuiAnexos = l.anexo1 || l.anexo2 || l.anexo3;
    
    html += `<tr>       <td><strong>${escapeHtml(l.idoc)}</strong></td>       <td>${escapeHtml(l.dataSolicitacao)}</td>       <td>${escapeHtml(l.tipo)}</td>       <td>${escapeHtml(l.nome)} (${escapeHtml(l.matricula)})</td>       <td>${escapeHtml(l.dataInicio)}</td>       <td style="text-align: center;">${l.dias > 0 ? l.dias + ' dias' : (escapeHtml(l.qtdHoras) || '-')}</td>       <td><span class="badge ${badgeClass}">${escapeHtml(l.status)}</span></td>       <td>         <div class="action-buttons">           ${possuiAnexos ? `<button class="btn-action" data-action="ver-anexos" data-a1="${escapeHtml(l.anexo1)}" data-a2="${escapeHtml(l.anexo2)}" data-a3="${escapeHtml(l.anexo3)}" title="Visualizar Anexos"><span data-lucide="paperclip" style="width: 14px; height: 14px;"></span></button>` : ''}           <button class="btn-action" data-action="editar-lanc" data-linha="${l.linhaPlanilha}" title="Editar Lançamento">             <span data-lucide="edit-2" style="width: 14px; height: 14px;"></span>           </button>         </div>       </td>     </tr>`;
  });

  tbody.innerHTML = html;
  tbody.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', function() {
      const action = this.dataset.action;
      if (action === 'ver-anexos') visualizarAnexos(this.dataset.a1, this.dataset.a2, this.dataset.a3);

    });

}

/**
 * Filtra a tabela de lançamentos de RH em tempo real
 */
function filtrarTabelaLancamentos() {
  const busca = document.getElementById('filtro-busca-lancamento').value.toLowerCase().trim();
  const tipo = document.getElementById('filtro-tipo-lancamento').value;
  const status = document.getElementById('filtro-status-lancamento').value;
  
  const filtrados = AppState.lancamentos.filter(l => {
    const bateBusca = !busca || l.nome.toLowerCase().includes(busca) || l.matricula.toLowerCase().includes(busca) || l.idoc.toLowerCase().includes(busca);
    const bateTipo = !tipo || l.tipo === tipo;
    
    let bateStatus = false;
    if (!status) {
      bateStatus = true;
    } else if (status === "SEM 1DOC") {
      let ehSemDoc = (!l.idoc || l.idoc.trim() === "");
      if (ehSemDoc) {
        let diffDias = 0;
        if (l.dataSolicitacao) {
          const partes = l.dataSolicitacao.split('/');
          if (partes.length === 3) {
            const dataLanc = new Date(partes[2], partes[1] - 1, partes[0]);
            diffDias = (new Date().getTime() - dataLanc.getTime()) / (1000 * 3600 * 24);
          }
        }
        bateStatus = diffDias <= 365;
      } else {
        bateStatus = false;
      }
    } else {
      bateStatus = l.status === status;
    }
    
    return bateBusca && bateTipo && bateStatus;
  });
  
  renderizarTabelaLancamentos(filtrados);
}

/**
 * Ajusta dinamicamente a visibilidade dos campos do formulário com base no tipo
 */
function ajustarCamposFormularioLancamento() {
  const tipo = document.getElementById('lanc-tipo').value;
  
  const blocoFerias = document.getElementById('bloco-ferias');
  const blocoFalta = document.getElementById('bloco-falta');
  const blocoHoras = document.getElementById('bloco-horas');
  
  // Esconde todos inicialmente
  blocoFerias.style.display = "none";
  blocoFalta.style.display = "none";
  blocoHoras.style.display = "none";
  
  // Força remoção de obrigatoriedade temporária dos inputs invisíveis
  document.getElementById('lanc-data-inicio').required = false;
  document.getElementById('lanc-dias').required = false;
  document.getElementById('lanc-data-falta').required = false;
  document.getElementById('lanc-qtd-horas').required = false;
  
  if (tipo === "Férias" || tipo === "Férias (1/3 Pecúnia)" || tipo === "Licença Prêmio") {
    blocoFerias.style.display = "flex";
    document.getElementById('lanc-data-inicio').required = true;
    document.getElementById('lanc-dias').required = true;
  } else if (tipo === "Hora Extra") {
    blocoHoras.style.display = "block";
    blocoFalta.style.display = "block";
    document.getElementById('lanc-data-falta').required = true;
    document.getElementById('lanc-qtd-horas').required = true;
  } else {
    // Abonadas, Avaliação Probatório, Não Efetivados
    blocoFalta.style.display = "block";
    document.getElementById('lanc-data-falta').required = true;
  }
  
  sugerirDespacho();
}

/**
 * Sugere um texto para o campo Despacho baseado no servidor e tipo selecionados
 */
function sugerirDespacho() {
  const tipo = document.getElementById('lanc-tipo').value;
  const matricula = document.getElementById('lanc-matricula').value;
  const campoDespacho = document.getElementById('lanc-despacho');
  
  // Só preenche automaticamente se estiver vazio ou se foi preenchido automaticamente antes
  if (campoDespacho.value !== "" && !campoDespacho.dataset.autoFilled) {
    return;
  }

  if (!matricula) return;
  
  const servidor = AppState.servidores.find(s => s.matricula === matricula);
  if (!servidor) return;

  let texto = "";
  
  if (tipo.toLowerCase().includes("férias") || tipo.toLowerCase().includes("ferias")) {
    const diasInput = parseInt(document.getElementById('lanc-dias').value) || 0;
    const saldo = parseInt(servidor.saldoHoje) || 0;
    const restante = Math.max(0, saldo - diasInput);
    texto = `${diasInput} / ${saldo} Disp Restam ${restante}`;
    
  } else if (tipo.toLowerCase().includes("abonada") || tipo.toLowerCase().includes("abono")) {
    const usados = parseInt(servidor.abonosUsados) || 0;
    const novoUsado = usados + 1;
    const limite = 5; // Padrão
    const restante = Math.max(0, limite - novoUsado);
    texto = `${novoUsado} / ${limite}, restando ${restante}`;
  }
  
  if (texto) {
    campoDespacho.value = texto;
    campoDespacho.dataset.autoFilled = "true";
  } else if (campoDespacho.dataset.autoFilled) {
    campoDespacho.value = "";
    delete campoDespacho.dataset.autoFilled;
  }
}

/**
 * Executa busca de autocomplete para selecionar o servidor
 */
function buscarServidorAutocomplete() {
  const input = document.getElementById('lanc-busca-servidor');
  const listagem = document.getElementById('autocomplete-lista');
  const txtMatricula = document.getElementById('lanc-matricula');
  const painelInfo = document.getElementById('lanc-servidor-info');
  
  const termo = input.value.toLowerCase().trim();
  txtMatricula.value = ""; // Limpa a matrícula até selecionar
  painelInfo.style.display = "none";
  
  if (!termo) {
    listagem.style.display = "none";
    return;
  }
  
  // Filtra servidores ativos apenas
  const sugestoes = AppState.servidores.filter(s => 
    s.status !== 'Inativo' && (s.nome.toLowerCase().includes(termo) || s.matricula.toLowerCase().includes(termo))
  ).slice(0, 5); // Limita em 5 sugestões
  
  if (sugestoes.length === 0) {
    listagem.innerHTML = `<div style="padding: 10px; color: var(--text-muted); font-size: 13px;">Nenhum servidor ativo encontrado.</div>`;
    listagem.style.display = "block";
    return;
  }
  
  let html = "";
  sugestoes.forEach(s => {
    html += `<div style="padding: 10px; cursor: pointer; border-bottom: 1px solid var(--border-color); font-size: 13px;" onclick="selecionarServidorAutocomplete('${s.matricula}', '${s.nome}', '${s.cargo}', '${s.lotacao}', '${s.saldoHoje}')">       <strong>${s.nome}</strong> (Matrícula: ${s.matricula})     </div>`;
  });
  
  listagem.innerHTML = html;
  listagem.style.display = "block";
}

/**
 * Preenche os dados do servidor selecionado no autocomplete
 */
function selecionarServidorAutocomplete(matricula, nome, cargo, lotacao, saldo) {
  document.getElementById('lanc-busca-servidor').value = nome;
  document.getElementById('lanc-matricula').value = matricula;
  document.getElementById('autocomplete-lista').style.display = "none";
  
  // Exibe informações de auxílio do servidor
  document.getElementById('info-serv-cargo').innerText = cargo || 'Não informado';
  document.getElementById('info-serv-lotacao').innerText = lotacao || 'Não informada';
  document.getElementById('info-serv-saldo').innerText = saldo + ' dias';

  sugerirDespacho();
}

/**

 */
function abrirModalLancamento(linhaPlanilha) {
  const form = document.getElementById('form-lancamento');
  form.reset();
  
  // Certifica de esconder informações de autocomplete anteriores
  document.getElementById('lanc-servidor-info').style.display = "none";
  document.getElementById('autocomplete-lista').style.display = "none";
  document.getElementById('anexos-existentes').style.display = "none";
  
  // Limpa arquivos dos inputs
  document.getElementById('lanc-file-1').value = "";
  document.getElementById('lanc-file-2').value = "";
  document.getElementById('lanc-file-3').value = "";
  
  const titulo = document.getElementById('modal-lancamento-titulo');
  const buscaServidorInput = document.getElementById('lanc-busca-servidor');
  const inputLinha = document.getElementById('lanc-linha');
  
  if (linhaPlanilha) {
    // MODO EDIÇÃO
    titulo.innerText = "Editar Lançamento";
    inputLinha.value = linhaPlanilha;

    const l = AppState.lancamentos.find(lanc => lanc.linhaPlanilha === linhaPlanilha);
    if (!l) {
      if (typeof google !== "undefined" && google.script) {
        exibirLoader(true);
        google.script.run
          .withSuccessHandler(function(lancamentos) {
            AppState.lancamentos = Array.isArray(lancamentos) ? lancamentos : [];
            exibirLoader(false);
            abrirModalLancamento(linhaPlanilha);
          })
          .withFailureHandler(function(err) {
            exibirLoader(false);
            alert("Erro ao carregar detalhes do lançamento: " + mensagemErro(err));
          })
          .obterListaLancamentos();
      } else {
        console.warn("Lançamento não encontrado em modo local: ", linhaPlanilha);
      }
      return;
    }
    
    document.getElementById('lanc-tipo').value = l.tipo;
      document.getElementById('lanc-idoc').value = l.idoc;
      document.getElementById('lanc-busca-servidor').value = l.nome;
      document.getElementById('lanc-matricula').value = l.matricula;
      document.getElementById('lanc-despacho').value = l.despacho;
      document.getElementById('lanc-observacao').value = l.observacao;
      document.getElementById('lanc-qtd-horas').value = l.qtdHoras;
      document.getElementById('lanc-dias').value = l.dias;
      
      // Parse de Data Solicitação
      if (l.dataSolicitacao) {
        let partes = l.dataSolicitacao.split('/');
        if (partes.length === 3) {
          document.getElementById('lanc-data-solicitacao').value = `${partes[2]}-${partes[1]}-${partes[0]}`;
        }
      }
      
      // Parse de Data Início / Data Falta
      if (l.dataInicio) {
        let partes = l.dataInicio.split('/');
        if (partes.length === 3) {
          const dataFormatadaInput = `${partes[2]}-${partes[1]}-${partes[0]}`;
          document.getElementById('lanc-data-inicio').value = dataFormatadaInput;
          document.getElementById('lanc-data-falta').value = dataFormatadaInput;
        }
      }
      
      // Renderizar anexos existentes no topo
      if (l.anexo1 || l.anexo2 || l.anexo3) {
        const listaExistente = document.getElementById('lista-anexos-existentes');
        exibirAnexosNaLista(listaExistente, [l.anexo1, l.anexo2, l.anexo3], true);
        document.getElementById('anexos-existentes').style.display = "block";
      }
  } else {
    // MODO CRIAÇÃO
    titulo.innerText = "Cadastrar Lançamento de Documento";
    inputLinha.value = "";
    buscaServidorInput.disabled = false;
    document.getElementById('lanc-data-solicitacao').value = new Date().toISOString().split('T')[0];
  }
  
  ajustarCamposFormularioLancamento();
  abrirModal('modal-lancamento');
}

/**
 * Função utilitária para renderizar anexos e resolver caminhos relativos do AppSheet (Drive)
 */
function exibirAnexosNaLista(listaElemento, anexos, modoEdicao) {
  listaElemento.innerHTML = "";
  
  const caminhosValidos = anexos.map(a => String(a || "").trim()).filter(a => a !== "" && a !== "undefined");
  if (caminhosValidos.length === 0) {
    if (!modoEdicao) {
      listaElemento.innerHTML = '<li style="color: var(--text-muted); font-size: 13px;">Nenhum anexo válido encontrado.</li>';
    }
    return;
  }
  
  let caminhosParaResolver = [];
  let itensTemp = [];
  
  caminhosValidos.forEach((caminho, index) => {
    const rotulo = `Documento Anexo ${index + 1}`;
    const ehDriveUrl = (function() {
      try {
        const parsed = new URL(caminho);
        return parsed.protocol === 'https:' && parsed.hostname === 'drive.google.com';
      } catch (_) { return false; }
    })();
    
    const li = document.createElement('li');
    if (ehDriveUrl) {
      const a = document.createElement('a');
      a.href = caminho;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      if (modoEdicao) {
        a.style.color = 'var(--primary-color)';
        a.style.textDecoration = 'none';
        a.style.fontWeight = '500';
      } else {
        a.className = 'btn btn-secondary';
        a.style.cssText = 'width: 100%; text-align: left;';
      }
      a.textContent = rotulo;
      li.appendChild(a);
      listaElemento.appendChild(li);
    } else {
      li.dataset.caminhoOriginal = caminho;
      const span = document.createElement('span');
      span.textContent = `${rotulo} (Buscando no Drive...)`;
      span.style.color = 'var(--text-muted)';
      span.style.fontSize = '12px';
      li.appendChild(span);
      listaElemento.appendChild(li);
      
      caminhosParaResolver.push(caminho);
      itensTemp.push({ li, span, rotulo });
    }
  });
  
  if (caminhosParaResolver.length > 0) {
    if (typeof google !== "undefined" && google.script) {
      google.script.run
        .withSuccessHandler(function(mapaUrls) {
          itensTemp.forEach(item => {
            const urlResolvida = mapaUrls[item.li.dataset.caminhoOriginal] || "";
            if (urlResolvida) {
              item.li.innerHTML = "";
              const a = document.createElement('a');
              a.href = urlResolvida;
              a.target = '_blank';
              a.rel = 'noopener noreferrer';
              if (modoEdicao) {
                a.style.color = 'var(--primary-color)';
                a.style.textDecoration = 'none';
                a.style.fontWeight = '500';
              } else {
                a.className = 'btn btn-secondary';
                a.style.cssText = 'width: 100%; text-align: left;';
              }
              a.textContent = item.rotulo;
              item.li.appendChild(a);
            } else {
              item.span.textContent = `${item.rotulo} (Não encontrado no Drive)`;
              item.span.style.color = 'var(--text-danger)';
            }
          });
        })
        .withFailureHandler(function(err) {
          itensTemp.forEach(item => {
            item.span.textContent = `${item.rotulo} (Erro ao buscar)`;
            item.span.style.color = 'var(--text-danger)';
          });
        })
        .resolverUrlsAnexosLote(caminhosParaResolver);
    } else {
      itensTemp.forEach(item => {
        item.span.textContent = `${item.rotulo} (Sem conexão)`;
      });
    }
  }
}

/**
 * Processa a gravação e faz o upload dos PDFs convertendo-os em Base64
 */
async function salvarDadosLancamento(event) {
  event.preventDefault();
  exibirLoader(true);
  
  const matricula = document.getElementById('lanc-matricula').value;
  if (!matricula) {
    exibirLoader(false);
    alert("Erro: Você precisa selecionar um servidor válido usando a lista de sugestões.");
    return;
  }
  
  const tipoDoc = document.getElementById('lanc-tipo').value;
  let dataInicioInput = "";
  let diasInput = 0;
  let qtdHorasInput = "";
  
  if (tipoDoc === "Férias" || tipoDoc === "Férias (1/3 Pecúnia)" || tipoDoc === "Licença Prêmio") {
    dataInicioInput = document.getElementById('lanc-data-inicio').value;
    diasInput = document.getElementById('lanc-dias').value;
  } else if (tipoDoc === "Hora Extra") {
    dataInicioInput = document.getElementById('lanc-data-falta').value;
    diasInput = 0;
    qtdHorasInput = document.getElementById('lanc-qtd-horas').value;
  } else {
    dataInicioInput = document.getElementById('lanc-data-falta').value;
    diasInput = 1; // abonos duram 1 dia
  }
  
  const dados = {
    linhaPlanilha: document.getElementById('lanc-linha').value,
    tipo: tipoDoc,
    idoc: document.getElementById('lanc-idoc').value.trim(),
    matricula: matricula,
    dataSolicitacao: document.getElementById('lanc-data-solicitacao').value,
    dataInicio: dataInicioInput,
    dias: diasInput,
    qtdHoras: qtdHorasInput,
    despacho: document.getElementById('lanc-despacho').value,
    observacao: document.getElementById('lanc-observacao').value.trim(),
    anexo1: "",
    anexo2: "",
    anexo3: ""
  };
  
  let arquivosCriados = [];
  
  // Realiza uploads paralelos de arquivos em Base64 se houver no formulário
  try {
    const file1 = document.getElementById('lanc-file-1').files[0];
    const file2 = document.getElementById('lanc-file-2').files[0];
    const file3 = document.getElementById('lanc-file-3').files[0];
    
    if (file1) {
      let res = await uploadArquivoPromessa(file1);
      dados.anexo1 = res.url;
      arquivosCriados.push(res.id);
    }
    if (file2) {
      let res = await uploadArquivoPromessa(file2);
      dados.anexo2 = res.url;
      arquivosCriados.push(res.id);
    }
    if (file3) {
      let res = await uploadArquivoPromessa(file3);
      dados.anexo3 = res.url;
      arquivosCriados.push(res.id);
    }
  } catch (erroUpload) {
    exibirLoader(false);
    // Remove uploads criados de forma imediata em caso de erro na transferência
    arquivosCriados.forEach(id => google.script.run.removerArquivoDrive(id));
    alert("Falha no upload dos anexos: " + erroUpload.toString());
    return;
  }
  
  if (typeof google === "undefined" || !google.script) {
    alert("Lançamento gravado em simulação local!");
    exibirLoader(false);
    fecharModal('modal-lancamento');
    return;
  }
  
  google.script.run
    .withSuccessHandler(function() {
      fecharModal('modal-lancamento');
      carregarListaLancamentos();
      carregarListaServidores(); // recarrega servidores para atualizar saldos alterados
      alert("Lançamento de documento salvo com sucesso!");
    })
    .withFailureHandler(function(erro) {
      exibirLoader(false);
      // Remove arquivos órfãos do Drive se gravação na Planilha falhar
      arquivosCriados.forEach(id => google.script.run.removerArquivoDrive(id));
      alert("Erro ao gravar lançamento: " + erro.toString());
    })
    .salvarLancamento(dados);
}

/**
 * Função utilitária em JS para converter e enviar arquivo no Drive de forma síncrona/prometida
 */
function uploadArquivoPromessa(arquivo) {
  return new Promise((resolver, rejeitar) => {
    const leitor = new FileReader();
    leitor.onload = function(evento) {
      const base64 = evento.target.result;
      
      google.script.run
        .withSuccessHandler(function(resultadoDrive) {
          resolver(resultadoDrive);
        })
        .withFailureHandler(function(erro) {
          rejeitar(erro);
        })
        .salvarArquivoNoDrive(base64, arquivo.name, arquivo.type);
    };
    leitor.onerror = function(e) {
      rejeitar("Falha ao ler arquivo físico local.");
    };
    leitor.readAsDataURL(arquivo);
  });
}

  const busca = document.getElementById('filtro-busca-protocolo').value.toLowerCase().trim();

  document.getElementById('rep-resultado-container').style.display = "block";
}

/**
 * Exporta para arquivo de Excel (.csv formatado) diretamente pelo navegador
 */
function exportarRelatorioExcel() {
  if (dadosUltimoRelatorio.length === 0) return;
  
  // Constrói cabeçalho CSV
  let csv = colunasUltimoRelatorio.join(";") + "\r\n";
  
  dadosUltimoRelatorio.forEach(item => {
    let linha = [];
    if (colunasUltimoRelatorio.includes("Servidor")) {
      linha.push(item.nome || "");
      linha.push(item.matricula || "");
    }
    
    if (colunasUltimoRelatorio.includes("Cargo")) linha.push(item.cargo || "");
    if (colunasUltimoRelatorio.includes("Lotação")) linha.push(item.lotacao || "");
    if (colunasUltimoRelatorio.includes("Saldo Férias")) linha.push(item.saldoHoje || "0");
    if (colunasUltimoRelatorio.includes("Projetado")) linha.push(item.projetado || "0");
    if (colunasUltimoRelatorio.includes("Info Períodos")) linha.push(item.infoFerias || "");
    
    if (colunasUltimoRelatorio.includes("Tipo de Ausência")) {
      linha.push(item.tipo || "");
      linha.push(item.inicio || "");
      linha.push(item.fim || "");
      linha.push(item.dias || "0");
    }
    
    if (colunasUltimoRelatorio.includes("1Doc")) {
      linha.push(item.idoc || "");
      linha.push(item.dataSolicitacao || "");
      linha.push(item.tipo || "");
      linha.push(item.nome || "");
      linha.push(item.matricula || "");
      linha.push(item.dataInicio || "");
      linha.push(item.dias > 0 ? item.dias : (item.qtdHoras || ""));
      linha.push(item.status || "");
    }
    
    if (colunasUltimoRelatorio.includes("Abonadas Usadas")) {
      linha.push(item.lotacao || "");
      linha.push(item.abonosUsados || "0");
      linha.push(item.limiteAnual || "5");
      linha.push(item.saldoRestante || "0");
    }
    
    // Escapa aspas
    let linhaEscapada = linha.map(col => {
      let texto = String(col).replace(/"/g, '""');
      return '"' + texto + '"';
    });
    csv += linhaEscapada.join(";") + "\r\n";
  });
  
  // Força download
  const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.setAttribute("href", url);
  link.setAttribute("download", `Relatorio_${tituloUltimoRelatorio.replace(/\s+/g, "_")}.csv`);
  link.style.visibility = 'hidden';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

    if (colunasUltimoRelatorio.includes("Lotação")) html += `<td style="border: 1px solid #111; padding: 8px;">${item.lotacao || '-'}</td>`;

      html += `<td style="border: 1px solid #111; padding: 8px; text-align:center;">${item.saldoHoje} d</td>`;
      html += `<td style="border: 1px solid #111; padding: 8px; text-align:center;">${item.projetado} d</td>`;
      html += `<td style="border: 1px solid #111; padding: 8px; font-size:11px;">${item.infoFerias}</td>`;
    }
    
    if (colunasUltimoRelatorio.includes("Tipo de Ausência")) {

      html += `<td style="border: 1px solid #111; padding: 8px; text-align:center;">${item.inicio}</td>`;
      html += `<td style="border: 1px solid #111; padding: 8px; text-align:center;">${item.fim}</td>`;
      html += `<td style="border: 1px solid #111; padding: 8px; text-align:center;">${item.dias}</td>`;
    }
    
    if (colunasUltimoRelatorio.includes("1Doc")) {

      html += `<td style="border: 1px solid #111; padding: 8px;">${item.dataSolicitacao}</td>`;
      html += `<td style="border: 1px solid #111; padding: 8px;">${item.tipo}</td>`;
      html += `<td style="border: 1px solid #111; padding: 8px;">${item.nome}</td>`;
      html += `<td style="border: 1px solid #111; padding: 8px;">${item.matricula}</td>`;
      html += `<td style="border: 1px solid #111; padding: 8px; text-align:center;">${item.dataInicio}</td>`;
      html += `<td style="border: 1px solid #111; padding: 8px; text-align:center;">${item.dias > 0 ? item.dias + ' d' : (item.qtdHoras || '-')}</td>`;
      html += `<td style="border: 1px solid #111; padding: 8px;">${item.status}</td>`;
    }
    
    if (colunasUltimoRelatorio.includes("Abonadas Usadas")) {
      html += `<td style="border: 1px solid #111; padding: 8px;">${item.lotacao || '-'}</td>`;
      html += `<td style="border: 1px solid #111; padding: 8px; text-align:center;">${item.abonosUsados} / 5</td>`;

/**

function alternarAbaAdmin(idAba) {
  document.querySelectorAll('#view-admin .tab-button').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('#view-admin .tab-panel').forEach(panel => panel.classList.remove('active'));
  
  // Ativa botão
  const btn = document.getElementById(`btn-${idAba}`);
  if (btn) btn.classList.add('active');
  
  // Ativa tela
  const painel = document.getElementById(idAba);
  if (painel) painel.classList.add('active');
  
  // Carrega dados da sub-aba
  if (idAba === 'adm-usuarios') carregarListaUsuarios();
  else if (idAba === 'adm-configs') carregarListaConfiguracoes();
  else if (idAba === 'adm-logs') carregarLogsAuditoria();
}

 */

function abrirModalUsuario(email) {
  const form = document.getElementById('form-usuario');
  form.reset();
  
  const titulo = document.getElementById('modal-usuario-titulo');
  const inputEmail = document.getElementById('usr-email');
  
  if (email) {
    titulo.innerText = "Editar Usuário";
    inputEmail.disabled = true;
    
    const u = AppState.usuarios.find(usr => usr.email === email);
    if (u) {
      document.getElementById('usr-email').value = u.email;
      document.getElementById('usr-nome').value = u.nome;
      document.getElementById('usr-papel').value = u.papel;
      document.getElementById('usr-ativo').value = u.ativo;
    }
  } else {
    titulo.innerText = "Autorizar Novo Usuário";
    inputEmail.disabled = false;
    document.getElementById('usr-ativo').value = "Sim";
  }
  
  abrirModal('modal-usuario');
}

  event.preventDefault();
  exibirLoader(true);
  
  const dados = {
    email: document.getElementById('usr-email').value.trim(),
    nome: document.getElementById('usr-nome').value.trim(),
    papel: document.getElementById('usr-papel').value,

    })

}

  if (confirm(`Deseja mesmo BLOQUEAR e desativar o acesso do e-mail ${email}?\n\nEle não conseguirá mais entrar no sistema.`)) {

      exibirLoader(false);

    .salvarConfiguracao({
      linhaPlanilha: linha,
      chave: chave,
      valor: valor
    });
}

/**
 * Busca logs de auditoria do servidor
 */
function carregarLogsAuditoria() {
  exibirLoader(true);
  
  google.script.run
    .withSuccessHandler(function(logs) {
      AppState.logs = logs;
      renderizarTabelaLogs();
      exibirLoader(false);
    })
    .withFailureHandler(function(e) {
      exibirLoader(false);
      alert("Erro ao buscar logs: " + e.toString());
    })
    .obterRelatorioLogs();
}

function renderizarTabelaLogs(listaFiltrada) {
  const logs = listaFiltrada || AppState.logs;
  const tbody = document.getElementById('tabela-adm-logs-body');
  
  if (logs.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--text-secondary);">Nenhum log registrado.</td></tr>`;
    return;
  }
  
  let html = "";
  logs.slice(0, 150).forEach(l => { // Limita exibição em 150 itens por performance
    html += `<tr>       <td style="font-size:11px; white-space:nowrap;">${escapeHtml(l.dataHora)}</td>       <td style="font-size:12px;"><strong>${escapeHtml(l.usuario)}</strong></td>       <td style="font-size:11px; font-weight:600;">${escapeHtml(l.acao)}</td>       <td style="font-size:12px;">${escapeHtml(l.modulo)}</td>       <td style="font-size:12px; color: var(--text-secondary); max-width: 250px; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(l.descricao)}</td>       <td style="font-size:11px; color: var(--text-muted);">${escapeHtml(l.campoAlterado) || '-'}</td>       <td style="font-size:11px; color: var(--text-muted); max-width: 100px; overflow:hidden; text-overflow:ellipsis;" title="${escapeHtml(l.valorAntes)}">${escapeHtml(l.valorAntes) || '-'}</td>       <td style="font-size:11px; color: var(--text-muted); max-width: 100px; overflow:hidden; text-overflow:ellipsis;" title="${escapeHtml(l.valorDepois)}">${escapeHtml(l.valorDepois) || '-'}</td>     </tr>`;
  });
  
  tbody.innerHTML = html;
}

/**
 * Filtra tabela de logs no cliente em tempo real
 */
function filtrarLogsAuditoria() {
  const busca = document.getElementById('log-filtro-busca').value.toLowerCase().trim();
  const modulo = document.getElementById('log-filtro-modulo').value;
  const acao = document.getElementById('log-filtro-acao').value;
  
  const filtrados = AppState.logs.filter(l => {
    const bateBusca = !busca || l.usuario.toLowerCase().includes(busca) || l.descricao.toLowerCase().includes(busca) || l.idRegistro.toLowerCase().includes(busca);
    const bateModulo = !modulo || l.modulo === modulo;
    const bateAcao = !acao || l.acao === acao;
    return bateBusca && bateModulo && bateAcao;
  });
  
  renderizarTabelaLogs(filtrados);
}
