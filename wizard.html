          <div class="modal-body">
            
            <!-- Etapa 1: Dados Básicos -->
            <div id="lanc-step-1" class="wizard-step">
              <h4 style="margin-bottom: 16px; font-size: 14px; color: var(--brand-primary);">Etapa 1 de 3: Identificação</h4>
              <div class="form-row">
                <div class="form-group" style="flex: 2;">
                  <label class="form-label">Tipo de Documento *</label>
                  <select id="lanc-tipo" class="form-control" required onchange="ajustarCamposFormularioLancamento()">
                    <option value="Férias">Férias</option>
                    <option value="Férias (1/3 Pecúnia)">Férias (1/3 Pecúnia)</option>
                    <option value="Abonada">Abonada</option>
                    <option value="Abonada Natalícia">Abonada Natalícia</option>
                    <option value="Abonada Eleitoral">Abonada Eleitoral</option>
                    <option value="Licença Prêmio">Licença Prêmio</option>
                    <option value="Autorização de Horas Extras">Autorização de Horas Extras</option>
                    <option value="Avaliação do Estágio Probatório">Avaliação Estágio Probatório</option>
                    <option value="Não Efetivado (Anulado)">Não Efetivado (Anulado)</option>
                  </select>
                </div>
                <div class="form-group" style="flex: 1;">
                  <label class="form-label">Data de Solicitação *</label>
                  <input type="date" id="lanc-data-solicitacao" class="form-control" required>
                </div>
              </div>

              <!-- Seleção de Servidor com Autocomplete -->
              <div class="form-group" style="margin-top: 16px;">
                <label class="form-label">Servidor *</label>
                <div style="position: relative;">
                  <input type="text" id="lanc-busca-servidor" class="form-control" required placeholder="Digite o nome ou matrícula do servidor..." oninput="buscarServidorAutocomplete()">
                  <input type="hidden" id="lanc-matricula" value="">
                  <div id="autocomplete-lista" style="position: absolute; width: 100%; max-height: 200px; overflow-y: auto; background-color: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 0 0 6px 6px; z-index: 1001; display: none;"></div>
                </div>
                <p class="form-help" id="lanc-servidor-info" style="font-size: 11px; color: var(--text-secondary); margin-top: 4px; display: none;">
                  Cargo: <span id="info-serv-cargo">-</span> | Lotação: <span id="info-serv-lotacao">-</span> | Saldo Férias: <strong id="info-serv-saldo">-</strong> | Abonadas: <strong id="info-serv-abonadas">-</strong>
                </p>
              </div>
            </div>

            <!-- Etapa 2: Detalhes do Período e Anexos -->
            <div id="lanc-step-2" class="wizard-step" style="display: none;">
              <h4 style="margin-bottom: 16px; font-size: 14px; color: var(--brand-primary);">Etapa 2 de 3: Período e Documentos</h4>
              
              <!-- Bloco 1: Campos Específicos de Férias e Licença Prêmio -->
              <div class="form-row" id="bloco-ferias">
                <div class="form-group">
                  <label class="form-label">Data de Início *</label>
                  <input type="date" id="lanc-data-inicio" class="form-control">
                </div>
                <div class="form-group">
                  <label class="form-label">Quantidade de Dias *</label>
                  <input type="number" id="lanc-dias" class="form-control" value="30" min="1" max="90" oninput="sugerirDespacho()">
                </div>
              </div>

              <!-- Bloco 2: Campos Específicos de Falta/Abono/Probatório -->
              <div class="form-group" id="bloco-falta" style="display: none;">
                <label class="form-label">Data da Falta / Afastamento *</label>
                <input type="date" id="lanc-data-falta" class="form-control">
              </div>

              <!-- Bloco 3: Horas Extras -->
              <div class="form-group" id="bloco-horas" style="display: none;">
                <label class="form-label">Quantidade de Horas *</label>
                <input type="text" id="lanc-qtd-horas" class="form-control" placeholder="Ex: 02:00" oninput="sugerirDespacho()">
              </div>

              <!-- Uploads de Anexos (Até 3 PDFs) -->
              <div class="form-group" style="margin-top: 16px;">
                <label class="form-label">Anexar Documentos (PDF)</label>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                  <input type="file" id="lanc-file-1" class="form-control" accept="application/pdf">
                  <input type="file" id="lanc-file-2" class="form-control" accept="application/pdf">
                  <input type="file" id="lanc-file-3" class="form-control" accept="application/pdf">
                </div>
                <div id="anexos-existentes" style="margin-top: 10px; display: none;">
                  <p style="font-size: 12px; font-weight: 600; color: var(--text-secondary);">Anexos cadastrados:</p>
                  <ul id="lista-anexos-existentes" style="list-style: none; font-size: 13px; margin-top: 4px;"></ul>
                </div>
              </div>
            </div>

            <!-- Etapa 3: Finalização -->
            <div id="lanc-step-3" class="wizard-step" style="display: none;">
              <h4 style="margin-bottom: 16px; font-size: 14px; color: var(--brand-primary);">Etapa 3 de 3: Finalização</h4>
              
              <!-- Despacho e Observação -->
              <div class="form-group">
                <label class="form-label">Despacho Individual</label>
                <input type="text" id="lanc-despacho" class="form-control" placeholder="Ex: 1º Abono, Férias Deferidas, etc...">
              </div>

              <div class="form-group">
                <label class="form-label">Observações</label>
                <textarea id="lanc-observacao" class="form-control" rows="3" placeholder="Insira observações relevantes..."></textarea>
              </div>

              <div class="form-group" style="margin-top: 24px; padding-top: 16px; border-top: 1px dashed var(--border-color);">
                <label class="form-label">Informar No 1Doc / Protocolo (Opcional)</label>
                <div style="display: flex; gap: 8px;">
                  <input type="text" id="lanc-idoc" class="form-control" placeholder="Ex: 14.129/2026">
                </div>
                <p class="form-help" style="font-size: 11px; margin-top: 4px; color: var(--text-muted);">Pode ser deixado em branco e preenchido depois pela ação Rápida na tabela.</p>
              </div>
            </div>

          </div>
          <div class="modal-footer" style="justify-content: space-between;">
            <div>
              <button type="button" class="btn btn-secondary" id="btn-lanc-voltar" style="display: none;" onclick="voltarPassoLancamento()">
                <span data-lucide="arrow-left" style="width:16px; height:16px;"></span> Voltar
              </button>
            </div>
            <div style="display: flex; gap: 8px;">
              <button type="button" class="btn btn-secondary" onclick="fecharModal('modal-lancamento')">Cancelar</button>
              <button type="button" class="btn btn-primary" id="btn-lanc-avancar" onclick="avancarPassoLancamento()">
                Próxima Etapa <span data-lucide="arrow-right" style="width:16px; height:16px; margin-left:4px;"></span>
              </button>
              <button type="submit" class="btn btn-primary" id="btn-lanc-salvar" style="display: none;">
                <span data-lucide="save" style="width:16px; height:16px; margin-right:4px;"></span> Salvar Lançamento
              </button>
            </div>
          </div>
